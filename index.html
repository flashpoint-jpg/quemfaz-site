      }).join('') : '<div class="empty-state"><div class="icon-tile icon-tile--ghost">' + icon('clipboard') + '</div><h3 class="h3">' +
        (tab === 'historico' ? 'Nenhum pedido no histórico' : 'Nenhum pedido em andamento') + '</h3><p class="text text--secondary">' +
        (tab === 'historico' ? 'Os serviços concluídos aparecem aqui.' : 'Seus serviços ativos e em negociação aparecem aqui.') + '</p></div>') +
      '</div></div>';
  };

  function servicoCard(req) {
    const cat = DB.categoryById(req.categoriaId);
    const cliente = DB.clienteById(req.clienteId);
    return (
      '<button class="card card--pressable" style="width:100%;text-align:left;" data-nav="/profissional/pedido/' + req.id + '">' +
        (req.atendimentoTipo === 'garante' ? '<span class="qf-garante-badge">QUEM FAZ GARANTE</span>' : '') +
        (global.QFVisita ? global.QFVisita.selo(req) : '') +
        '<div class="row-between">' +
          '<div class="row"><div class="icon-tile">' + icon(cat ? cat.icon : 'tag') + '</div>' +
          '<div><div class="h3">' + PU.escapeHtml(cat ? cat.nome : 'Serviço') + '</div><div class="text--sm text--secondary">' + PU.escapeHtml((cliente || {}).nome || '') + '</div></div></div>' +
          icon('chevronRight', 'list-item__chevron') +
        '</div>' +
        '<div class="qf-perf" aria-hidden="true"></div>' +
        '<div class="row-between">' + statusBadge(req.status) + '<span class="text--sm text--muted">' + PU.timeAgo(req.criadoEm) + '</span></div>' +
        (DB.STATUS_DESBLOQUEADO.indexOf(req.status) !== -1 ? '<div class="text--sm" style="margin-top:8px;color:var(--orange-600,#B4410A);font-weight:800;">Falta sua resposta: você fechou o serviço?</div>' : '') +
      '</button>'
    );
  }

  Screens.profPedidoDetalheRender = function (params, user) {
    const req = DB.requestById(params.id);
    if (!req || req.profissionalId !== user.id) return '<div class="view"><p class="text">Serviço não encontrado.</p></div>';
    const cat = DB.categoryById(req.categoriaId);
    const cliente = DB.clienteById(req.clienteId);
    const contatoAprovado = !!(req.orcamento && req.orcamento.status === 'aprovado');
    // V11.20: o WhatsApp do cliente chega já no desbloqueio (o servidor só envia enquanto a negociação está aberta).
    const contatoLiberado = contatoAprovado || !!((cliente || {}).telefone);
    const waMsg = contatoAprovado
      ? 'Olá ' + ((cliente || {}).nome || '') + ', sou ' + user.nome + ' do QuemFaz. Seu orçamento foi aprovado e estou entrando em contato para combinar o serviço.'
      : global.QFUI.primeiroContatoMsg(cliente, user, cat);
    return (
      '<div class="view">' +
        (req.atendimentoTipo === 'garante' ? '<span class="qf-garante-badge">QUEM FAZ GARANTE</span>' : '') +
        (global.QFVisita ? global.QFVisita.selo(req) : '') +
        '<div class="row-between qf-title-row">' +
          '<div class="row"><div class="icon-tile">' + icon(cat ? cat.icon : 'tag') + '</div><div class="h3">' + PU.escapeHtml(cat ? cat.nome : 'Serviço') + '</div></div>' +
          statusBadge(req.status) +
        '</div>' +

        '<div class="section card stack">' +
          '<div class="row-between"><div class="row">' + personAvatar(cliente, 'avatar--sm') + '<div><div class="text--strong">' + PU.escapeHtml((cliente || {}).nome || 'Cliente') + '</div><div class="text--sm text--secondary">' + (contatoAprovado ? 'Contato liberado após aprovação' : (contatoLiberado ? 'WhatsApp liberado: chame o cliente agora' : 'Aguardando aprovação do orçamento')) + '</div></div></div>' +
            (contatoAprovado ? '<span class="badge badge--success"><span class="badge__dot"></span>Aprovado</span>' : (contatoLiberado ? '<span class="badge badge--success"><span class="badge__dot"></span>WhatsApp liberado</span>' : '<span class="badge badge--warning"><span class="badge__dot"></span>Contato protegido</span>')) + '</div>' +
          (contatoLiberado
            ? '<div class="row text--sm text--secondary">' + icon('phoneCall', 'list-item__chevron') + ((cliente || {}).telefone ? '<a href="' + telHref(cliente.telefone) + '">' + PU.escapeHtml(cliente.telefone) + '</a>' : '<span>Telefone não informado</span>') + '</div>'
            : '<div class="row text--sm text--secondary">' + icon('lock', 'list-item__chevron') + '<span>Telefone e WhatsApp serão liberados quando o cliente aprovar seu orçamento.</span></div>') +
          (contatoLiberado && (cliente || {}).telefone ? '<a class="btn btn--whatsapp btn--lg" data-contact="whatsapp" href="' + PU.escapeHtml(whatsappHref(cliente.telefone, waMsg)) + '" target="_blank" rel="noopener">' + icon('whatsapp') + ' Chamar no WhatsApp</a>' +
            '<a class="btn btn--outline" data-contact="ligar" href="' + telHref(cliente.telefone) + '">' + icon('phoneCall') + ' Ligar para o cliente</a>' : '') +
          '<div class="text--sm text--secondary">' + PU.escapeHtml(req.descricao) + '</div>' +
          (req.fotos && req.fotos.length ? '<div class="qf-call-media">' + req.fotos.map(renderCallMedia).join('') + '</div>' : '') +
          (contatoAprovado
            ? '<div class="row text--sm text--secondary">' + icon('mapPin', 'list-item__chevron') + '<span>' + (req.endereco.rua ? PU.escapeHtml(req.endereco.rua) + ', ' : '') + PU.escapeHtml(req.endereco.bairro || '') + (req.endereco.complemento ? ' · ' + PU.escapeHtml(req.endereco.complemento) : '') + '</span></div>'
            : '<div class="row text--sm text--secondary">' + icon('mapPin', 'list-item__chevron') + '<span>' + PU.escapeHtml(req.endereco.bairro || 'Bairro não informado') + ' · endereço exato liberado após aprovação</span></div>') +
        '</div>' +

        '<!--qf-chat-->' +
        (req.orcamento ? orcamentoResumo(req) : '') +
        acoesPorStatus(req) +
      '</div>'
    );
  };

  function orcamentoResumo(req) {
    const o = req.orcamento;
    const combinadoNoChat = o && o.status === 'aprovado' &&
      Number(o.total || 0) === 0 && Number(o.maoDeObra || 0) === 0 &&
      Number(o.material || 0) === 0 && Number(req.taxaVisita || 0) === 0;
    if (combinadoNoChat) {
      return '<div class="section"><div class="card card--tight" style="background:var(--success-100);border:none;">' +
        '<div class="text--strong" style="color:var(--success-600);">Serviço combinado direto com o cliente</div>' +
        '<div class="text--sm text--secondary" style="margin-top:4px;">O valor e os detalhes foram acertados na conversa de vocês.</div>' +
      '</div></div>';
    }
    return (
      '<div class="section">' +
        '<div class="section-head"><h2 class="h3">Proposta enviada</h2></div>' +
        '<div class="card stack--sm">' +
          (req.taxaVisita ? rowValor('Taxa de visita', req.taxaVisita) : '') +
          rowValor('Mão de obra', o.maoDeObra) +
          rowValor('Material', o.material) +
          '<hr class="hairline">' +
          rowValor('Total', o.total + (req.taxaVisita || 0), true) +
          (o.status === 'recusado' && o.motivoRecusa ? '<p class="text--sm" style="color:var(--danger-600);margin-top:4px;">Motivo da recusa: ' + PU.escapeHtml(o.motivoRecusa) + '</p>' : '') +
          (o.status === 'nao_selecionado' ? '<div class="card card--tight" style="margin-top:8px;background:var(--navy-100);border:none;"><div class="text--strong" style="color:var(--navy-900);">Cliente escolheu outro profissional</div><div class="text--sm text--secondary" style="margin-top:3px;">Seu orçamento não foi selecionado desta vez. Este chamado foi encerrado para novos orçamentos.</div></div>' : '') +
        '</div>' +
      '</div>'
    );
  }
  function rowValor(label, cents, strong) {
    return '<div class="row-between"><span class="text' + (strong ? ' text--strong' : ' text--secondary text--sm') + '">' + label + '</span><span class="text' + (strong ? ' h3' : ' text--sm') + '">' + PU.formatCurrency(cents) + '</span></div>';
  }

  function acoesPorStatus(req) {
    const s = req.status;
    // V11.22: sem orçamento, iniciar e concluir. O profissional só conta como terminou.
    if (DB.STATUS_DESBLOQUEADO.indexOf(s) !== -1) {
      return '<div class="section"><div class="card stack qf-ticket" data-qf-fechamento style="gap:14px;">' +
        '<div><div class="text--sm" style="color:var(--orange-600,#B4410A);font-weight:800;letter-spacing:.06em;">FALTA SUA RESPOSTA</div>' +
        '<div class="text--strong" style="font-size:1.12rem;margin-top:2px;">Você fechou o serviço com esse cliente?</div>' +
        '<div class="text--sm text--secondary">Depois de combinar pelo WhatsApp, conte aqui como terminou. Ao fechar, o pedido sai da lista dos outros profissionais e o cliente é convidado a avaliar você.</div></div>' +
        '<div class="qf-perf" aria-hidden="true" style="margin:2px 0;"></div>' +
        '<button class="btn btn--primary" data-action="fechei-servico">' + icon('checkCircle') + ' Sim, fechei</button>' +
        '<button class="btn btn--outline" data-action="nao-fechei-servico">' + icon('xCircle') + ' Não fechei</button>' +
        '<button class="btn btn--ghost" type="button" data-action="ainda-conversando" style="text-decoration:underline;">Ainda estou conversando</button>' +
        '<div class="text--sm text--muted">Sem resposta em 7 dias, o pedido é encerrado sozinho como “Sem retorno”.</div>' +
      '</div></div>';
    }
    if (s === STATUS.NAO_SELECIONADO) {
      return '<div class="section"><div class="card" style="background:var(--navy-100);border:none;"><div class="text--strong" style="color:var(--navy-900);">Cliente escolheu outro profissional</div><div class="text--sm text--secondary" style="margin-top:4px;">Seu orçamento não foi selecionado desta vez. Este chamado foi encerrado para novos orçamentos.</div></div></div>';
    }
    if (s === STATUS.SERVICO_CONCLUIDO || s === STATUS.PAGO) {
      if (req.avaliacaoProfissional) {
        return (
          '<div class="section"><div class="card card--tight" style="background:var(--success-100);border:none;"><div class="text--strong" style="color:var(--success-600);">Sua avaliação foi enviada</div>' +
          '<div class="text--sm" style="color:var(--success-600);margin-top:4px;">Peça ao cliente para abrir o QuemFaz, finalizar o serviço e avaliar você. Enquanto aguarda, você pode continuar recebendo e aceitando outros chamados.</div></div></div>'
        );
      }
      return (
        '<div class="section"><div class="card card--tight" style="background:var(--warning-100);border:1px solid rgba(181,114,11,.22);margin-bottom:12px;">' +
          '<div class="text--strong">Finalize sua parte no QuemFaz</div>' +
          '<div class="text--sm text--secondary" style="margin-top:4px;">Avalie o cliente para liberar o app. Depois, peça ao cliente para abrir o QuemFaz, tocar em “Finalizar e avaliar” e concluir a parte dele.</div>' +
        '</div></div>' +
        '<div class="section">' +
          '<div class="section-head"><h2 class="h3">Finalizar e avaliar cliente</h2></div>' +
          '<div class="card stack" style="border:2px solid var(--orange-500);">' +
            '<div class="star-picker" id="prof-star-picker">' + [1, 2, 3, 4, 5].map(function (n) { return '<button type="button" data-star="' + n + '">' + icon('starFilled') + '</button>'; }).join('') + '</div>' +
            '<textarea class="textarea" id="prof-avaliacao-comentario" placeholder="Como foi atender este cliente? (opcional)"></textarea>' +
            '<button class="btn btn--primary" data-action="enviar-avaliacao-cliente">' + icon('checkCircle') + ' Finalizar e enviar avaliação</button>' +
          '</div>' +
        '</div>'
      );
    }
    if (s === STATUS.FINALIZADO) {
      return '<div class="section"><div class="card card--tight" style="background:var(--success-100);border:none;"><p class="text text--sm" style="color:var(--success-600);">Serviço concluído e avaliado.</p></div></div>';
    }
    if (s === STATUS.CANCELADO) {
      return '<div class="section"><div class="card card--tight" style="background:var(--danger-100);border:none;"><p class="text text--sm" style="color:var(--danger-600);">' + PU.escapeHtml(req.motivoCancelamento || 'Serviço cancelado.') + '</p></div></div>';
    }
    return '';
  }

            ((global.QFBonusCadastro || {}).texto ? walletInfoRow('money', global.QFBonusCadastro.texto + ' de bônus de cadastro', 'Todo novo profissional começa com ' + global.QFBonusCadastro.texto + ' em créditos. Cada chamado desbloqueado desconta o valor correspondente da carteira.') : '') +
            walletInfoRow('phoneCall', 'Contato liberado', 'Depois do desbloqueio, você recebe o WhatsApp do cliente e combina o serviço direto com ele.') +

      '</div>'

  };

  // Histórico da carteira: só créditos e débitos em reais (recargas, desbloqueios, bônus, ajustes).
  function walletMovimentacoesHtml(txs) {
    return (txs.length
            ? '<div class="card qf-tx-list" style="padding:4px 16px;">' + txs.map(function (t) {
                const debit = t.tipo === 'debito';
                const bonusTx = t.tipo === 'bonus';
                const pending = t.tipo === 'recarga_pendente' || t.status === 'pendente';
                const failed = t.status === 'cancelado' || t.status === 'expirado' || t.status === 'estornado';
                const positive = t.tipo === 'recarga' || t.tipo === 'credito' || t.tipo === 'estorno';
                const valueText = bonusTx ? 'GRÁTIS' : (debit ? '−' : (positive ? '+' : '')) + PU.formatCurrency(t.valor || 0);
                const valueColor = debit || failed ? 'var(--danger-600)' : (pending ? 'var(--warning-600)' : 'var(--success-600)');
                const statusText = pending ? ' · aguardando pagamento' : (failed ? ' · ' + t.status : '');
                return '<div class="list-item"><div class="icon-tile icon-tile--ghost">' + icon(debit || bonusTx ? 'unlock' : (t.metodo === 'Cartão' ? 'creditCard' : t.metodo === 'Boleto' ? 'document' : 'money')) + '</div>' +
                  '<div class="list-item__body"><div class="list-item__title">' + PU.escapeHtml(t.descricao) + '</div><div class="list-item__sub">' + PU.formatDateTime(t.criadoEm) + statusText + '</div></div>' +
                  '<div class="text--strong" style="color:' + valueColor + ';">' + valueText + '</div></div>';
              }).join('') + '</div>' +
              // V11.16.30: mostra só as 5 últimas; o botão libera mais 20 por vez.
              (txs.length > 5 ? '<button class="btn btn--outline btn--sm qf-tx-more" type="button" data-tx-more>Ver mais movimentações (' + (txs.length - 5) + ')</button>' : '')
            : '<div class="empty-state"><div class="icon-tile icon-tile--ghost">' + icon('wallet') + '</div><p class="text text--secondary">Nenhuma movimentação ainda.</p></div>');
  }

  function walletMethodButton(id, iconName, title, subtitle, selected) {
    return '<button type="button" class="card card--pressable row" style="width:100%;text-align:left;padding:12px 14px;' + (selected ? 'border-color:var(--orange-500);box-shadow:0 0 0 1px var(--orange-500);' : '') + '" data-wallet-method="' + id + '">' +
      '<div class="icon-tile ' + (selected ? 'icon-tile--orange' : 'icon-tile--ghost') + '">' + icon(iconName) + '</div>' +
      '<div class="spacer"><div class="text--strong">' + title + '</div><div class="text--sm text--secondary">' + subtitle + '</div></div>' +
      '<span class="badge ' + (selected ? 'badge--success' : 'badge--muted') + '">' + (selected ? 'Selecionado' : 'Escolher') + '</span>' +
    '</button>';
  }

  // "Meus planos": plano contratado, situação, chamados contratados/restantes, validade e histórico de compras.
  // Plano é produto separado do saldo da carteira: nunca soma em reais.
  function planoNomeCurto(id) { if (id === 'livre') return 'Quem Faz Livre'; return id === 'premium' ? 'Premium' : (id === 'pro' ? 'Pro' : 'Mensal'); }
  function planoSituacao(row, agora) {
    if (new Date(row.valido_ate).getTime() <= agora) return { texto: 'Expirado', classe: 'badge--muted' };
    if (Number(row.chamados_restantes || 0) <= 0) return { texto: 'Chamados esgotados', classe: 'badge--muted' };
    return { texto: 'Ativo', classe: 'badge--success' };
  }
  function compraPlanoSituacao(status, ativado) {
    if (status === 'aprovado') return { texto: ativado ? 'Pago · plano ativado' : 'Pago · ativando seu plano', classe: 'badge--success' };
    if (status === 'pendente') return { texto: 'Aguardando pagamento', classe: 'badge--warning' };
    if (status === 'estornado') return { texto: 'Estornado', classe: 'badge--danger' };
    if (status === 'cancelado') return { texto: 'Cancelado', classe: 'badge--muted' };
    return { texto: 'Expirado', classe: 'badge--muted' };
  }
  function walletPlanosAtualHtml(user, dados) {
    const agora = Date.now();
    const planos = dados.planos || [];
    const atual = planos.find(function (x) { return planoSituacao(x, agora).texto === 'Ativo'; }) || planos[0] || null;
    if (!atual) {
      const ativo = user && user.plano && user.plano.restantes > 0 ? user.plano : null;
      if (ativo) {
        return '<div class="card"><div class="row-between"><div class="text--strong">Plano ' + PU.escapeHtml(ativo.nome) + '</div><span class="badge badge--success">Ativo</span></div>' +
          '<div class="text--sm" style="margin-top:6px;">' + ativo.restantes + ' chamado' + (ativo.restantes === 1 ? '' : 's') + ' restante' + (ativo.restantes === 1 ? '' : 's') +
          (ativo.validoAte ? ' · vale até ' + new Date(ativo.validoAte).toLocaleDateString('pt-BR') : '') + '</div></div>';
      }
      return '<div class="card card--tight"><div class="text--sm text--secondary">Seus pacotes de chamados aparecem aqui. Consulte também a situação do Quem Faz Livre no destaque acima.</div></div>';
    }
    const sit = planoSituacao(atual, agora);
    const total = Number(atual.chamados_total || 0), resta = Number(atual.chamados_restantes || 0);
    const usados = Math.max(0, total - resta);
    return '<div class="card" style="' + (sit.texto === 'Ativo' ? 'border:2px solid var(--success-500, #2f9e44);' : '') + '">' +
      '<div class="row-between"><div class="text--strong">Plano ' + planoNomeCurto(atual.plano) + '</div><span class="badge ' + sit.classe + '">' + sit.texto + '</span></div>' +
      '<div class="text--sm" style="margin-top:8px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;">' +
        '<div><div class="h3">' + total + '</div><div class="text--secondary">contratados</div></div>' +
        '<div><div class="h3">' + usados + '</div><div class="text--secondary">usados</div></div>' +
        '<div><div class="h3">' + resta + '</div><div class="text--secondary">restantes</div></div>' +
      '</div>' +
      '<div class="text--sm text--secondary" style="margin-top:8px;">' + (sit.texto === 'Expirado' ? 'Venceu em ' : 'Vale até ') + new Date(atual.valido_ate).toLocaleDateString('pt-BR') +
        (sit.texto === 'Ativo' ? '. Os chamados do plano são usados antes do saldo.' : '.') + '</div></div>';
  }
  function walletPlanosHistoricoHtml(dados) {
    const compras = dados.compras || [];
    if (!compras.length) return '';
    const ativados = {};
    (dados.planos || []).concat(dados.livres || []).forEach(function (x) { if (x.recarga_id) ativados[x.recarga_id] = true; });
    return '<div class="section-head" style="margin-top:14px;"><h3 class="h3">Histórico de compras de plano</h3></div>' +
      '<div class="card" style="padding:4px 16px;">' + compras.slice(0, 8).map(function (c) {
        const sit = compraPlanoSituacao(c.status, !!ativados[c.id]);
        const forma = c.metodo === 'cartao' ? 'Cartão' : (c.metodo === 'boleto' ? 'Boleto' : 'Pix');
        return '<div class="list-item"><div class="icon-tile icon-tile--ghost">' + icon('crown') + '</div>' +
          '<div class="list-item__body"><div class="list-item__title">Plano ' + planoNomeCurto(c.plano) + ' · ' + PU.formatCurrency(Number(c.valor_centavos || 0)) + '</div>' +

  // Os botões do topo trocam a parte exibida (Profissional ou Cliente) sem mexer na rota (o app usa o # para navegar).
  document.addEventListener('click', function (e) {
    const a = e.target && e.target.closest ? e.target.closest('[data-cf-jump]') : null;
    if (!a) return;
    e.preventDefault();
    const alvo = a.getAttribute('data-cf-jump');
    document.querySelectorAll('[data-cf-pane]').forEach(function (pane) { pane.hidden = pane.getAttribute('data-cf-pane') !== alvo; });
    document.querySelectorAll('[data-cf-jump]').forEach(function (tab) { tab.classList.toggle('is-active', tab === a); });
  });

  document.addEventListener('click', async function (e) {
    const btn = e.target && e.target.closest ? e.target.closest('[data-action="salvar-pref-chamado"]') : null;
    if (!btn) return;
    const box = btn.closest('#pref-chamado') || document;
    const ini = (box.querySelector('#pref-inicio') || {}).value || '';
    const fim = (box.querySelector('#pref-fim') || {}).value || '';
    const marcado = box.querySelector('input[name="pref-alerta"]:checked');
    const modo = marcado ? marcado.value : 'toque';
    if (!/^\d{2}:\d{2}$/.test(ini) || !/^\d{2}:\d{2}$/.test(fim)) { PU.toast('Escolha o horário de início e de fim.', 'danger'); return; }
    if (!(global.QFCloud && global.QFCloud.client)) { PU.toast('Sem conexão com o QuemFaz agora. Tente de novo.', 'danger'); return; }
    btn.disabled = true;
    try {
      const res = await global.QFCloud.client.rpc('qf_salvar_preferencias_chamado', { p_inicio: ini, p_fim: fim, p_alerta: modo });
      if (res.error) throw res.error;
      const s = DB.getSession();
      const u = s ? DB.profissionalById(s.userId) : null;
      if (u) { u.horarioInicio = ini; u.horarioFim = fim; u.alertaModo = modo; DB.persist(); }
      PU.toast(ini === fim ? 'Salvo! Você recebe chamados o dia todo.' : 'Salvo! Você atende das ' + ini + ' às ' + fim + '.', 'success');
      Array.prototype.forEach.call(box.querySelectorAll('input[name="pref-alerta"]'), function (r) {
        const card = r.closest('label');
        if (card) { card.style.borderColor = r.checked ? 'var(--orange-500)' : ''; card.style.boxShadow = r.checked ? '0 0 0 1px var(--orange-500)' : ''; }
      });
    } catch (err) {
      console.warn('QuemFaz preferências', err);
      PU.toast('Não foi possível salvar agora. Tente de novo.', 'danger');
    } finally {
      btn.disabled = false;
    }
  });
  document.addEventListener('change', function (e) {
    if (!e.target || e.target.name !== 'pref-alerta') return;
    const box = e.target.closest('#pref-chamado');
    if (!box) return;
    Array.prototype.forEach.call(box.querySelectorAll('input[name="pref-alerta"]'), function (r) {

      global.QFPreCadastro.tentar().then(function (ativou) { if (ativou && (location.hash || '').indexOf(pattern) !== -1) global.navigate(pattern, true); });
    }
    if (pattern === '/profissional/chamada/:id') bindChamada(content, params, user);
    if (pattern === '/profissional/servicos') bindProfServicos(content, user);
    if (pattern === '/profissional/pedido/:id') bindPedidoDetalhe(content, params, user);
    if (pattern === '/profissional/orcamento/:id') bindOrcamentoForm(content, params, user);
    if (pattern === '/profissional/perfil') bindPerfil(content, user);
    if (pattern === '/profissional/carteira') bindCarteira(content, user);
    if (pattern === '/profissional/planos') bindPlanos(content, user);
    if (pattern === '/profissional/configuracoes') bindNotificationActivation(content);
    if (pattern === '/cliente/home') { bindAnunciosHome(content); bindNotificationActivation(content); }
    if (pattern === '/anuncie' || pattern === '/cliente/anuncie' || pattern === '/profissional/anuncie') bindAnuncie(content);

  function bindAnunciosHome(content) {
    const cards = Array.prototype.slice.call(content.querySelectorAll('[data-ad-click]'));
    if (cards.length) DB.registrarImpressoesAnuncios(cards.map(function (c) { return c.getAttribute('data-ad-click'); }));
    content.addEventListener('click', function (e) {
      const el = e.target.closest('[data-ad-click]');
      if (!el) return;

  // V11.73: formulário do QuemFaz Premium (sem cadastro) — prévia ao vivo, foto reduzida no aparelho, Pix e acompanhamento.
  function bindAnuncie(content) {

    };
    function digitos(v) { let n = String(v || '').replace(/\D/g, ''); if (n.indexOf('55') === 0 && n.length >= 12) n = n.slice(2); return n; }
    function telOk(v) { const n = digitos(v); return n.length === 10 || n.length === 11; }

    // A foto é reduzida no próprio aparelho: fica leve para enviar e para aparecer na tela inicial.
    function reduzir(file) {
      return new Promise(function (resolve, reject) {
        const r = new FileReader();
        r.onerror = reject;
        r.onload = function () {
          const img = new Image();
          img.onerror = reject;
          img.onload = function () {
            const max = 640, k = Math.min(1, max / Math.max(img.width, img.height));
            const c = document.createElement('canvas');
            c.width = Math.max(1, Math.round(img.width * k)); c.height = Math.max(1, Math.round(img.height * k));
            const ctx = c.getContext('2d');
            ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(img, 0, 0, c.width, c.height);
            let out = c.toDataURL('image/jpeg', 0.84);
            if (out.length > 600000) out = c.toDataURL('image/jpeg', 0.6);
            resolve(out);
          };
          img.src = String(r.result || '');
        };
        r.readAsDataURL(file);
      });

    const fileInput = content.querySelector('#qf-prem-img');
    fileInput.addEventListener('change', async function () {

    function abrirPix(p, pago) {

    form.addEventListener('submit', async function (e) {

  function pushJaAtivo() {
    try {
      const P = global.QFPush;
      if (!P) return false;
      // Se a permissão e a inscrição já foram confirmadas, não peça novamente.
      // Isso vale também para Android no navegador/PWA. O APK nativo continua
      // sendo recomendado para maior confiabilidade com a tela apagada, mas
      // não deve transformar uma notificação já ativa em "pendente".
      return !!(P.isActive && P.isActive());
    } catch (_) { return false; }
  }

  // V11.3: profissional só fica online com notificação ativa (permissão + inscrição salva no servidor).
  async function garantirNotificacoesParaOnline(opts) {
    opts = opts || {};
    const P = global.QFPush;
    if (!P) return true;
    await P.refreshStatus();
    // Reconfirma a inscrição no servidor ao entrar online, mesmo com marca local antiga.
    if (P.permission() === 'granted') await P.restore();
    if (P.supported() && pushJaAtivo()) return true;
    return new Promise(function (resolve) {
      const nativo = !!(P.isNative && P.isNative());
      const androidSemApk = /android/i.test(navigator.userAgent || '') && !nativo;
      const reconnect = P.permission() === 'granted';
      const intro = reconnect
        ? 'A permissão já está ativada. Falta reconectar este aparelho para receber os avisos. Confira sua conexão e tente novamente.'
        : androidSemApk && !P.supported()
        ? 'Para receber chamado com a tela apagada, o profissional precisa usar o app QuemFaz para Android. No navegador/PWA o Android pode suspender os avisos.'
        : (opts.jaOnline
          ? 'Você está online, mas as notificações estão desligadas neste aparelho. Sem elas você não recebe chamados com o app fechado. Ative agora para continuar online.'
          : (opts.passo // V11.12: aberto pelo passo "Ative as notificações" da ativação
            ? 'Permita as notificações para ser avisado imediatamente quando surgir um chamado.'
            : 'Para ficar online é obrigatório ativar as notificações. É assim que os chamados chegam, mesmo com o app fechado.'));
      function render() {
        const suportado = P.supported();
        const negado = P.permission() === 'denied';
        let corpo = '<p class="text text--secondary" style="text-align:center;">' + intro + '</p>';
        if (androidSemApk && !suportado) {
          corpo += '<div class="card card--tight" style="background:var(--warning-100);border:none;"><div class="text--sm" style="color:var(--warning-600);"><strong>' + (opts.passo ? 'Instale o app QuemFaz e ative as notificações por ele.' : 'Para ficar online, instale o app QuemFaz.') + '</strong><br>Assim o chamado usa notificação nativa e pode tocar mesmo com a tela apagada.</div></div>' +
            '<button class="btn btn--primary" type="button" data-download-apk>' + icon('download') + ' Baixar pela Google Play</button>';
        } else if (!suportado) {
          corpo += '<div class="card card--tight" style="background:var(--warning-100);border:none;"><div class="text--sm" style="color:var(--warning-600);">Esta forma de abrir o QuemFaz não permite notificações. ' +
            (/android/i.test(navigator.userAgent || '') ? 'Baixe o app QuemFaz para Android e entre com sua conta.' : 'No iPhone, abra o QuemFaz pelo Safari, toque em Compartilhar &gt; Adicionar à Tela de Início e abra pelo ícone.') + '</div></div>' +
            (/android/i.test(navigator.userAgent || '') && !nativo ? '<button class="btn btn--primary" type="button" data-download-apk>' + icon('download') + ' Baixar pela Google Play</button>' : '');
        } else if (negado) {
          corpo += '<div class="card card--tight" style="background:var(--danger-100);border:none;"><div class="text--sm" style="color:var(--danger-600);">As notificações estão bloqueadas para o QuemFaz. ' +
            (nativo ? 'Abra <strong>Configurações &gt; Apps &gt; QuemFaz &gt; Notificações</strong> e toque em <strong>Permitir</strong>.'
                    : 'No Chrome, toque no <strong>cadeado</strong> ao lado do endereço &gt; <strong>Permissões</strong> &gt; <strong>Notificações</strong> &gt; <strong>Permitir</strong>.') +
            '</div></div><button class="btn btn--primary" id="qf-notif-ativar">' + icon('bell') + ' Já liberei, tentar de novo</button>';
        } else {
          corpo += '<button class="btn btn--primary" id="qf-notif-ativar">' + icon('bell') + ' ' + (reconnect ? 'Reconectar avisos' : (opts.jaOnline ? 'Ativar agora' : 'Ativar notificações')) + '</button>';
        }
        corpo += '<button class="btn btn--outline" id="qf-notif-offline">' + (opts.passo ? 'Agora não' : 'Ficar offline') + '</button>';
        PU.openSheet('<div class="stack" id="qf-notif-sheet"><div class="icon-tile icon-tile--lg icon-tile--orange" style="margin:0 auto;">' + icon('bell') + '</div>' +
          '<h3 class="sheet__title" style="text-align:center;">' + (reconnect ? 'Reconectar notificações' : 'Ative as notificações') + '</h3>' + corpo +
          '<div class="text--sm" id="qf-notif-erro" role="alert" style="color:var(--danger-600);text-align:center;"></div></div>', { persistent: true });
        const offline = document.getElementById('qf-notif-offline');
        const ativar = document.getElementById('qf-notif-ativar');
        if (offline) offline.onclick = function () { PU.closeSheet(); resolve(false); };
        if (ativar) ativar.onclick = async function () {
          ativar.disabled = true;
          const erro = document.getElementById('qf-notif-erro');
          try {
            await P.activate();
            if (!pushJaAtivo()) throw new Error('As notificações ainda não foram confirmadas. Tente de novo.');
            PU.closeSheet();
            PU.toast('Notificações ativadas. Você receberá novos chamados mesmo com o app fechado.', 'success');
            resolve(true);
          } catch (err) {
            if (P.permission() === 'denied') { render(); const e2 = document.getElementById('qf-notif-erro'); if (e2) e2.textContent = 'A permissão continua bloqueada.'; return; }
            if (erro) erro.textContent = (err && err.message) || 'Não foi possível ativar as notificações.';
            ativar.disabled = false;
          }
        };
      }
      render();
    });
  }

  // V11.3: quem já está online sem notificação ativa vê a explicação ao abrir o app.
  let qfOnlineGateChecked = false;
  function exigirNotificacaoSeOnline(user) {
    if (qfOnlineGateChecked || !user || !user.online || !global.QFPush || pushJaAtivo()) return;
    qfOnlineGateChecked = true;
    garantirNotificacoesParaOnline({ jaOnline: true }).then(async function (ok) {
      if (ok) { global.navigate('/profissional/home', true); return; }
      try {
        try { sessionStorage.setItem('qf_gate_offline', '1'); } catch (_) {}
        if (global.QFCloud && global.QFCloud.enabled) await global.QFCloud.setOnline(false, { automatico: true });
        else DB.setOnlineStatus(user.id, false);

  function bindHome(content, user) {
    const radarMsg=content.querySelector('#qf-radar-msg');
    if(radarMsg){
      // V11.16.12: mantém o status estável para não parecer carregamento infinito.
      radarMsg.classList.remove('is-fading');
    }
    bindNotificationActivation(content);
    bindAtivacao(content, user);
    const toggle = content.querySelector('#toggle-online');
    if (toggle) {
      // V11.12: "Ficar online agora" (cartão de status) e "Ficar online" (passo 3 da ativação) usam a mesma lógica.
      const onlineBtns=Array.prototype.slice.call(content.querySelectorAll('[data-action="ficar-online-agora"]'));
      const offlineNow=content.querySelector('[data-action="ficar-offline-agora"]');
      onlineBtns.forEach(function(onlineNow){onlineNow.addEventListener('click',function(){if(toggle.disabled)return;onlineBtns.forEach(function(b){b.disabled=true;b.dataset.label=b.innerHTML;});onlineNow.textContent='Ficando online…';toggle.checked=true;toggle.dispatchEvent(new Event('change',{bubbles:true}));});});
      if(offlineNow)offlineNow.addEventListener('click',function(){if(toggle.disabled)return;toggle.checked=false;toggle.dispatchEvent(new Event('change',{bubbles:true}));});
      // V12.0.2: só "permissão negada" (code 1) conta como erro. Demora do GPS (timeout) ou GPS
      // desligado não significam falta de permissão — antes o app dizia "permita nas configurações"
      // mesmo com a permissão já dada.
      const locationBtn=content.querySelector('[data-action="qf-progress-location"]');
      if(locationBtn)locationBtn.addEventListener('click',function(){
        locationBtn.disabled=true;
        if(!navigator.geolocation){PU.toast('Localização não disponível neste aparelho.','danger');locationBtn.disabled=false;return;}
        function marcarOk(msg){try{localStorage.setItem('qf_location_ready','1');}catch(_){}PU.toast(msg,'success');global.navigate('/profissional/home',true);}
        navigator.geolocation.getCurrentPosition(function(){marcarOk('Localização permitida.');},function(err){
          if(err&&err.code===1){PU.toast('A localização está bloqueada para o QuemFaz. Abra Configurações > Apps > QuemFaz > Permissões > Localização e escolha "Permitir".','danger');locationBtn.disabled=false;return;}
          marcarOk(err&&err.code===2?'Localização permitida. Deixe a Localização (GPS) do celular ligada para receber chamados perto de você.':'Localização permitida.');
        },{enableHighAccuracy:false,timeout:20000,maximumAge:600000});
      });
      if(locationBtn&&navigator.permissions&&navigator.permissions.query){
        navigator.permissions.query({name:'geolocation'}).then(function(st){
          if(st&&st.state==='granted'&&document.body.contains(locationBtn)){try{localStorage.setItem('qf_location_ready','1');}catch(_){}global.navigate('/profissional/home',true);}
        }).catch(function(){});
      }
      const batteryBtn=content.querySelector('[data-action="qf-progress-battery"]');
      if(batteryBtn)batteryBtn.addEventListener('click',function(){if(global.QFPush&&global.QFPush.requestBattery)global.QFPush.requestBattery();});
      toggle.addEventListener('change', async function () {
        const querOnline = toggle.checked;
        toggle.checked = !querOnline; // só muda depois de confirmar no servidor
        toggle.disabled = true;
        try {
          if (querOnline && !user.fotoUrl) { explicarSelfieObrigatoria(); return; }
          if (querOnline) {
            const ok = await garantirNotificacoesParaOnline();
            if (!ok) return;
          }
          PU.unlockNotificationAudio();
          if (querOnline) { try { sessionStorage.removeItem('qf_gate_offline'); } catch (_) {} }
          if (global.QFCloud && global.QFCloud.enabled) await global.QFCloud.setOnline(querOnline);
          else DB.setOnlineStatus(user.id, querOnline);
          if (global.QFNativeOnline) global.QFNativeOnline.sync();
          toggle.checked = querOnline;
          const semGps = querOnline && global.QFCloud && global.QFCloud.onlineSemGps && global.QFCloud.onlineSemGps();
          PU.toast(querOnline ? (semGps ? 'Você está online. Ligue a Localização (GPS) do celular para ver a distância até cada chamado.' : 'Você está online.') : 'Você está offline.', querOnline ? 'success' : null);
          global.navigate('/profissional/home', true);
        } catch (err) {
          PU.toast('Não foi possível atualizar seu status. ' + (err && err.message ? err.message : ''), 'danger');
        } finally {
          toggle.disabled = false;
          onlineBtns.forEach(function (b) { if (document.body.contains(b)) { b.disabled = false; if (b.dataset.label) b.innerHTML = b.dataset.label; } });
        }
      });
    }
  }

  function bindChamada(content, params, user) {
    content.addEventListener('click', function (e) {
      const action = e.target.closest('[data-action]');
      if (!action) return;
      const act = action.getAttribute('data-action');
      if (act === 'desbloquear-chamada' || act === 'desbloquear-exclusivo') {
        const exclusivo = act === 'desbloquear-exclusivo' || (DB.requestById(params.id) || {}).atendimentoTipo === 'garante';
        const req = DB.requestById(params.id);
        const valorBase = req ? DB.leadFeeForRequest(req) : 0;
        const valor = (req && req.atendimentoTipo === 'garante' ? valorBase * (CallInfo.vagas(req).limite === 4 ? 4 : 1) : (exclusivo && global.QFExclusivo ? global.QFExclusivo.preco(valorBase) : valorBase)) + (user && user.cadastroExploracao ? 200 : 0);
        const primeiraGratis = !(user && user.cadastroExploracao) && !exclusivo && !!req && req.precoDesbloqueio != null && Number(req.precoDesbloqueio) === 0;
        const usaPlano = !exclusivo && !!(user && !user.cadastroExploracao && user.plano && user.plano.restantes > 0);
        const vg = CallInfo.vagas(req || {});
        const vagasFrase = 'O cliente escolheu receber ' + (vg.limite === 1 ? '1 orçamento' : 'até ' + vg.limite + ' orçamentos') + (vg.ocupadas ? ' e ' + vg.ocupadas + (vg.ocupadas === 1 ? ' profissional já desbloqueou' : ' profissionais já desbloquearam') : ' e ninguém desbloqueou ainda') + ': você será o ' + (vg.ocupadas + 1) + 'º de ' + vg.limite + '. Sem devolução: se o cliente não te responder ou fechar com outro, o valor não volta. ';
        PU.confirmDialog(exclusivo ? {
          title: req && req.atendimentoTipo === 'garante' ? 'Quem Faz Garante — exclusivo' : 'Pegar exclusivo',
          message: 'Não há garantia de contratação ou execução. O contato desse cliente fica só para você: o pedido sai da lista dos outros profissionais. Serão usados ' + PU.formatCurrency(valor) + ' dos seus créditos, sem devolução. O WhatsApp do cliente é liberado na hora.',
          okLabel: 'Pagar ' + PU.formatCurrency(valor) + ' e pegar'
        } : {
          title: primeiraGratis ? 'Você ganhou um desbloqueio grátis' : 'Desbloquear chamado',
          message: vagasFrase + (primeiraGratis
            ? 'Sua cortesia será usada neste pedido participante, sem descontar saldo ou plano. O WhatsApp do cliente e o chat são liberados na hora. O endereço exato só aparece se o cliente escolher você.'
            : (usaPlano
              ? 'Será usado 1 chamado do seu plano ' + user.plano.nome + ' (você tem ' + user.plano.restantes + '), sem devolução. O WhatsApp do cliente e o chat são liberados na hora; o endereço exato só aparece se o cliente escolher você.'
              : 'Serão usados ' + PU.formatCurrency(valor) + ' dos seus créditos, sem devolução. O WhatsApp do cliente e o chat são liberados na hora; o endereço exato só aparece se o cliente escolher você.')),
          okLabel: primeiraGratis ? 'Desbloquear grátis' : (usaPlano ? 'Usar 1 chamado do plano' : 'Pagar e desbloquear')
        }).then(async function (ok) {
          if (!ok) return;
          const result = (global.QFCloud && global.QFCloud.enabled)
            ? await global.QFCloud.unlockCall(params.id, user.id, exclusivo)
            : DB.desbloquearChamado(params.id, user.id);
          if (result && result.ok) {
            let msgOk = result.origem === 'plano' ? 'Chat liberado pelo seu plano. Converse com o cliente e combine o serviço.' : 'Chamado desbloqueado. O chat com o cliente está liberado.';
            if (!result.usouBonus && result.origem !== 'plano' && global.QFPlanoIncentivo) {
              const b = global.QFPlanoIncentivo.porChamado(result.valor || valor);
              if (b) msgOk += ' No plano ' + b.plano.nome + ' teria saído ' + PU.formatCurrency(b.unit) + '.';
            }
            try { sessionStorage.setItem('qf_chat_unlocked_notice', String(params.id)); } catch (_) {}
            PU.toast(result.exclusivo ? 'Pedido exclusivo seu. Agora chame o cliente no WhatsApp.' : 'Chamado desbloqueado. Agora chame o cliente no WhatsApp.', 'success', 5000);
            global.navigate('/profissional/chat/' + params.id, true);
            return;
          }
          if (result && result.reason === 'avaliacao_pendente' && result.chamadoId) {
            PU.toast('Finalize e avalie o serviço pendente antes de aceitar outro chamado.', 'danger');
            global.navigate('/profissional/pedido/' + result.chamadoId, true);
          } else if (result && (result.reason === 'exclusivo_indisponivel' || result.reason === 'exclusivo_desligado')) {
            PU.toast(result.reason === 'exclusivo_desligado' ? 'O exclusivo não está disponível agora. Você ainda pode desbloquear normal.' : 'Outro profissional acabou de pegar este pedido. Você ainda pode desbloquear normal, se tiver vaga.', 'danger', 5000);
            global.navigate('/profissional/chamada/' + params.id, true);
          } else if (result && result.reason === 'reservado') {
            PU.toast('As vagas deste pedido já foram preenchidas. Veja os outros serviços disponíveis.', 'danger');
            global.navigate('/profissional/servicos/disponiveis', true);
          } else if (result && result.reason === 'saldo') {
            PU.openSheet(
              '<div class="stack"><h3 class="sheet__title">Créditos insuficientes</h3>' +
              '<p class="text text--secondary">Você tem ' + PU.formatCurrency(result.saldo) + ' e precisa de ' + PU.formatCurrency(result.valor) + ' para este chamado.</p>' +
              '<button class="btn btn--primary" id="ir-carteira">Adicionar créditos</button>' +
              '<div class="text--sm text--secondary" style="text-align:center;">Pix, cartão ou boleto</div></div>'
            );
            document.getElementById('ir-carteira').onclick = function () {
              if (global.QFRechargeReturn) global.QFRechargeReturn.remember(params.id, user.id);
              PU.closeSheet();
              global.navigate('/profissional/carteira', true);
            };
          } else {
            PU.toast((result && result.error) ? result.error : 'Este chamado não está mais disponível.', 'danger');
            global.navigate('/profissional/servicos/disponiveis', true);
          }
        }).catch(function (err) {
          PU.toast('Não foi possível desbloquear. ' + (err && err.message ? err.message : ''), 'danger');
        });
      }
      if (act === 'recusar-chamada') {
        DB.recusarChamada(params.id, user.id);
        PU.toast('Oportunidade removida da sua lista.', null);
        global.navigate('/profissional/servicos/disponiveis', true);
      }
    });
  }

      btn.style.boxShadow = '0 0 0 1px var(--orange-500)';
      const tile = btn.querySelector('.icon-tile');
      tile.classList.remove('icon-tile--ghost');
      tile.classList.add('icon-tile--orange');
      const badge = btn.querySelector('.badge');
      badge.className = 'badge badge--success';
      badge.textContent = 'Selecionado';
    });

    content.addEventListener('click', function (e) {
      if (!e.target.closest('[data-action="rolar-recarga"]')) return;
      const alvo = content.querySelector('#carteira-recarga');
      if (alvo) alvo.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });

    content.addEventListener('click', function (e) {
      const b = e.target.closest('[data-action="assinar-plano"]');
      if (!b) return;
      const method = action.getAttribute('data-wallet-selected-method') || 'pix';
      openRechargeSheet(user, Number(b.getAttribute('data-valor') || 0), method, b.getAttribute('data-plano'));
    });

    action.addEventListener('click', function () {
      const valor = selectedValue();
      if (valor < 1499) { PU.toast('A recarga mínima é R$ 14,99.', 'danger'); return; }
      const method = action.getAttribute('data-wallet-selected-method') || 'pix';
      openRechargeSheet(user, valor, method);
    });
  }

  // V11.13: aba Planos — escolhe a forma de pagamento e assina.
  function bindPlanos(content, user) {
    let metodo = 'pix';
    content.addEventListener('click', function (e) {
      if (e.target.closest('[data-scroll-planos]')) {
        const sec = content.querySelector('#planos-chamados');
        if (sec) sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
        return;
      }
      const m = e.target.closest('[data-plano-metodo]');
      if (m) {
        metodo = m.getAttribute('data-plano-metodo') || 'pix';
        Array.prototype.forEach.call(content.querySelectorAll('[data-plano-metodo]'), function (b) { b.classList.toggle('is-selected', b === m); });
        return;
      }
      const b = e.target.closest('[data-action="assinar-plano"]');
      if (!b) return;
      openRechargeSheet(user, Number(b.getAttribute('data-valor') || 0), metodo, b.getAttribute('data-plano'));
    });
  }

  function openRechargeSheet(user, valor, method, plano) {
    const planoNome = plano === 'premium' ? 'Premium' : (plano === 'pro' ? 'Pro' : (plano === 'mensal' ? 'Mensal' : ''));
    const displayValue = PU.formatCurrency(valor);
    if (global.QFCloud && global.QFCloud.enabled) {
      const methodLabel = method === 'cartao' ? 'cartão de crédito' : (method === 'boleto' ? 'boleto' : 'Pix');
      PU.openSheet(
        '<div class="stack"><div class="icon-tile icon-tile--lg icon-tile--orange" style="margin:0 auto;">' + icon('wallet') + '</div>' +
        '<h3 class="sheet__title" style="text-align:center;">Gerando pagamento</h3>' +
        '<p class="text text--secondary" style="text-align:center;">Preparando ' + methodLabel + ' de <strong>' + displayValue + '</strong> no Efí Bank...</p>' +
        '<div class="text--sm text--secondary" style="text-align:center;">' + (plano ? 'O plano ' + planoNome + ' é ativado sozinho após a confirmação do pagamento.' : 'O saldo só entra após a confirmação do pagamento.') + '</div></div>'
      );
      (async function () {
        try {
          const rec = await (plano ? global.QFCloud.createPlan(plano, method) : global.QFCloud.createRecharge(valor, method));
          if (method === 'pix' && (rec.pixCopyPaste || rec.qrImage)) {
            const qrHtml = rec.qrImage
              ? '<div class="card" style="padding:14px;text-align:center;background:#fff;"><img src="' + PU.escapeHtml(rec.qrImage) + '" alt="QR Code Pix" style="width:min(230px,72vw);height:auto;display:block;margin:0 auto;border-radius:12px;"></div>'
              : '';
            const codeHtml = rec.pixCopyPaste
              ? '<label class="field"><span class="field__label">Pix copia e cola</span><textarea class="textarea" id="wallet-pix-real-code" readonly style="min-height:96px;">' + PU.escapeHtml(rec.pixCopyPaste) + '</textarea></label><button class="btn btn--outline" id="wallet-pix-real-copy">Copiar código Pix</button>'
              : '';
            PU.openSheet(
              '<div class="stack"><div class="icon-tile icon-tile--lg icon-tile--orange" style="margin:0 auto;">' + icon('bolt') + '</div>' +
              '<h3 class="sheet__title" style="text-align:center;">Pague com Pix</h3>' +
              '<p class="text text--secondary" style="text-align:center;">' + (plano ? 'Plano ' + planoNome + ' · ' : '') + displayValue + ' · pague sem sair do QuemFaz.</p>' +
              qrHtml + codeHtml +
              '<button class="btn btn--primary" id="wallet-refresh-after-pay">' + (plano ? 'Já paguei · ver meu plano' : 'Já paguei · atualizar saldo') + '</button>' +
              '<p class="text--sm text--secondary" style="text-align:center;">' + (plano ? 'O plano ' + planoNome + ' é ativado automaticamente assim que a Efí confirmar o Pix.' : 'O saldo entra automaticamente assim que a Efí confirmar o Pix.') + '</p></div>'
            );
            const copyPix = document.getElementById('wallet-pix-real-copy');
            if (copyPix) copyPix.onclick = async function () {
              const input = document.getElementById('wallet-pix-real-code');
              const code = input ? input.value : '';
              try {
                if (navigator.clipboard) await navigator.clipboard.writeText(code);
                else { input.select(); document.execCommand('copy'); }
                PU.toast('Código Pix copiado.', 'success');
              } catch (_) { PU.toast('Selecione e copie o código Pix.', 'danger'); }
            };
            const refreshPix = document.getElementById('wallet-refresh-after-pay');
            if (refreshPix) refreshPix.onclick = async function () {
              refreshPix.disabled = true;
              try {
                await global.QFCloud.syncForCurrentSession(true);
                PU.closeSheet();
                global.navigate(plano ? '/profissional/planos' : '/profissional/carteira', true);
              } catch (err) {
                PU.toast('Pagamento ainda não confirmado. Aguarde alguns segundos e tente novamente.', 'danger');
                refreshPix.disabled = false;
              }
            };
            return;
          }
          if (!rec.checkoutUrl) throw new Error('O link de pagamento não foi gerado.');
          PU.openSheet(
            '<div class="stack"><div class="icon-tile icon-tile--lg icon-tile--orange" style="margin:0 auto;">' + icon(method === 'cartao' ? 'creditCard' : (method === 'boleto' ? 'document' : 'bolt')) + '</div>' +
            '<h3 class="sheet__title" style="text-align:center;">Pagamento seguro</h3>' +
            '<p class="text text--secondary" style="text-align:center;">' + displayValue + ' via ' + methodLabel + '. Você será direcionado ao Efí Bank para concluir.</p>' +
            '<a class="btn btn--primary" href="' + PU.escapeHtml(rec.checkoutUrl) + '" rel="noopener">Ir para o Efí Bank</a>' +
            '<button class="btn btn--outline" id="wallet-refresh-after-pay">' + (plano ? 'Já paguei · ver meu plano' : 'Já paguei · atualizar saldo') + '</button>' +
            '<p class="text--sm text--secondary" style="text-align:center;">O QuemFaz não recebe nem armazena número do cartão ou CVV.</p></div>'
          );
          const refresh = document.getElementById('wallet-refresh-after-pay');
          if (refresh) refresh.onclick = async function () {
            refresh.disabled = true;
            try {
              await global.QFCloud.syncForCurrentSession(true);
              PU.closeSheet();
              global.navigate(plano ? '/profissional/planos' : '/profissional/carteira', true);
            } catch (err) {
              PU.toast('Pagamento ainda não confirmado. Aguarde alguns segundos e tente novamente.', 'danger');
              refresh.disabled = false;
            }
          };
        } catch (err) {
          PU.openSheet(
            '<div class="stack"><div class="icon-tile icon-tile--lg icon-tile--orange" style="margin:0 auto;">' + icon('alertTriangle') + '</div>' +
            '<h3 class="sheet__title" style="text-align:center;">Pagamento não iniciado</h3>' +
            '<p class="text text--secondary" style="text-align:center;">' + PU.escapeHtml((err && err.message) || 'Não foi possível iniciar o pagamento. Tente de novo em instantes.') + '</p>' +
            (err && err.qfOfferPix ? '<button class="btn btn--primary" id="wallet-payment-pix">' + icon('bolt') + ' Pagar com Pix</button>' : '') +
            '<button class="btn btn--outline" id="wallet-payment-close">Fechar</button></div>'
          );
          const close = document.getElementById('wallet-payment-close');
          if (close) close.onclick = function () { PU.closeSheet(); };
          const payPix = document.getElementById('wallet-payment-pix');
          if (payPix) payPix.onclick = function () {
            // troca o método selecionado na tela para Pix e já gera o Pix
            const pixBtn = document.querySelector('[data-wallet-method="pix"]');
            if (pixBtn) pixBtn.click();
            openRechargeSheet(user, valor, 'pix');
          };
        }
      })();
      return;
    }
    if (method === 'pix') {
      const pixCode = '00020126QUEMFAZ' + String(valor).padStart(8, '0') + 'BRASILPIX';
      PU.openSheet(
        '<div class="stack"><div class="row"><div class="icon-tile icon-tile--orange">' + icon('bolt') + '</div><div><h3 class="sheet__title">Pagar com Pix</h3><div class="text--sm text--secondary">' + displayValue + '</div></div></div>' +
        '<div class="card" style="background:var(--bg-sunken);border:none;text-align:center;padding:22px;"><div style="width:150px;height:150px;margin:0 auto;background:repeating-linear-gradient(45deg,#1458cc 0 7px,#fff 7px 14px);border:12px solid #fff;box-shadow:0 0 0 1px var(--border-subtle);"></div><div class="text--sm text--secondary" style="margin-top:10px;">QR Code de demonstração</div></div>' +
        '<label class="field"><span class="field__label">Pix copia e cola</span><input class="input" id="wallet-pix-code" readonly value="' + pixCode + '"></label>' +
        '<button class="btn btn--outline" id="wallet-copy-pix">Copiar código Pix</button>' +
        '<button class="btn btn--primary" id="wallet-confirm-pix">Simular Pix aprovado</button>' +
        '<p class="text--sm text--secondary" style="text-align:center;">Na versão online, o saldo entra somente depois da confirmação automática do provedor de pagamento.</p></div>'
      );
      document.getElementById('wallet-copy-pix').onclick = function () {
        const input = document.getElementById('wallet-pix-code'); input.select();
        if (navigator.clipboard) navigator.clipboard.writeText(input.value).catch(function () {});
        PU.toast('Código Pix copiado.', 'success');
      };
      document.getElementById('wallet-confirm-pix').onclick = function () {
        DB.recarregarCreditos(user.id, valor, 'Pix');
        PU.closeSheet();
        PU.toast(displayValue + ' adicionados à carteira.', 'success');
        global.navigate('/profissional/carteira', true);
      };
      return;
    }

    if (method === 'cartao') {
      PU.openSheet(
        '<div class="stack"><div class="row"><div class="icon-tile icon-tile--orange">' + icon('creditCard') + '</div><div><h3 class="sheet__title">Pagar com cartão</h3><div class="text--sm text--secondary">' + displayValue + '</div></div></div>' +
        '<label class="field"><span class="field__label">Número do cartão</span><input class="input" inputmode="numeric" placeholder="0000 0000 0000 0000"></label>' +
        '<label class="field"><span class="field__label">Nome no cartão</span><input class="input" placeholder="NOME COMO NO CARTÃO"></label>' +
        '<div class="row"><label class="field spacer"><span class="field__label">Validade</span><input class="input" placeholder="MM/AA"></label><label class="field" style="width:120px;"><span class="field__label">CVV</span><input class="input" inputmode="numeric" placeholder="123"></label></div>' +
        '<button class="btn btn--primary" id="wallet-confirm-card">Simular cartão aprovado</button>' +
        '<p class="text--sm text--secondary" style="text-align:center;">Na versão online, nenhum dado sensível do cartão deve ser salvo pelo QuemFaz; o provedor de pagamento processa a cobrança.</p></div>'
      );
      document.getElementById('wallet-confirm-card').onclick = function () {
        DB.recarregarCreditos(user.id, valor, 'Cartão');
        PU.closeSheet();
        PU.toast('Pagamento aprovado. Créditos liberados.', 'success');
        global.navigate('/profissional/carteira', true);
      };
      return;
    }

    const tx = DB.criarRecargaPendente(user.id, valor, 'Boleto');
    const line = '34191.79001 01043.510047 91020.150008 1 ' + String(900000000000 + valor).slice(0, 12);
    PU.openSheet(
      '<div class="stack"><div class="row"><div class="icon-tile icon-tile--orange">' + icon('document') + '</div><div><h3 class="sheet__title">Boleto gerado</h3><div class="text--sm text--secondary">' + displayValue + '</div></div></div>' +
      '<div class="card card--tight" style="background:var(--warning-100);border:none;"><div class="text--strong" style="color:var(--warning-600);">Aguardando compensação</div><div class="text--sm" style="color:var(--warning-600);margin-top:4px;">O saldo não é liberado ao gerar o boleto. Ele entra somente quando o pagamento for confirmado.</div></div>' +
      '<label class="field"><span class="field__label">Linha digitável</span><textarea class="textarea" id="wallet-boleto-line" readonly style="min-height:82px;">' + line + '</textarea></label>' +
      '<button class="btn btn--outline" id="wallet-copy-boleto">Copiar linha digitável</button>' +
      '<button class="btn btn--primary" id="wallet-confirm-boleto">Simular compensação do boleto</button>' +
      '<p class="text--sm text--secondary" style="text-align:center;">Esta confirmação manual existe apenas no protótipo offline.</p></div>'

  function bindPerfil(content, user, returnRoute) {
    const cadastroForm = content.querySelector('#prof-cadastro-update-form');
    const cadastroToggle = content.querySelector('#prof-cadastro-toggle');
    if (cadastroForm && cadastroToggle) {
      cadastroToggle.addEventListener('click', function () {
        const abrir = cadastroForm.hidden;
        cadastroForm.hidden = !abrir;
        cadastroToggle.setAttribute('aria-expanded', String(abrir));
        cadastroToggle.textContent = abrir ? 'Fechar dados cadastrais' : 'Editar dados cadastrais';
      });
    }
    if (cadastroForm) {
      const tipo = cadastroForm.querySelector('[name="tipoPessoa"]');
      const doc = cadastroForm.querySelector('[name="documento"]');
      const fantasia = cadastroForm.querySelector('[name="nomeFantasia"]');
      const docLabel = cadastroForm.querySelector('[data-update-doc-label]');
      const fantasiaLabel = cadastroForm.querySelector('[data-update-fantasia-label]');
      function atualizarTipoCadastro(limpar) {
        const pj = tipo.value === 'cnpj';
        docLabel.textContent = pj ? 'CNPJ' : 'CPF';
        fantasiaLabel.textContent = pj ? 'Nome fantasia da empresa (obrigatório)' : 'Nome fantasia (opcional)';
        fantasia.required = pj;
        doc.maxLength = pj ? 18 : 14;
        doc.inputMode = pj ? 'text' : 'numeric';
        doc.placeholder = pj ? '00.000.000/0000-00' : '000.000.000-00';
        if (limpar) doc.value = '';
        else doc.value = pj ? global.QFGeo.formatCnpj(doc.value) : global.QFGeo.formatCpf(doc.value);
      }
      tipo.addEventListener('change', function () { atualizarTipoCadastro(true); });
      doc.addEventListener('input', function () { doc.value = tipo.value === 'cnpj' ? global.QFGeo.formatCnpj(doc.value) : global.QFGeo.formatCpf(doc.value); });
      atualizarTipoCadastro(false);
      global.QFGeo.bindAddressForm(cadastroForm, { buscarAoCompletar: true });

      cadastroForm.addEventListener('submit', async function (e) {
        e.preventDefault();
        const fd = new FormData(cadastroForm);
        const tipoPessoa = String(fd.get('tipoPessoa') || 'cpf');
        const documento = String(fd.get('documento') || '').trim();
        const nomeFantasia = String(fd.get('nomeFantasia') || '').trim();
        if (tipoPessoa === 'cnpj') {
          if (!global.QFGeo.validCnpj(documento)) { PU.toast('Digite um CNPJ válido.', 'danger'); return; }
          if (!nomeFantasia) { PU.toast('Para empresa, o nome fantasia é obrigatório.', 'danger'); return; }
        } else if (!global.QFGeo.validCpf(documento)) { PU.toast('Digite um CPF válido.', 'danger'); return; }

        const cep = global.QFGeo.normalizeCep(fd.get('cep'));
        const rua = String(fd.get('rua') || '').trim();
        const numero = String(fd.get('numero') || '').trim();
        const bairro = String(fd.get('bairro') || '').trim();
        const cidade = String(fd.get('cidade') || '').trim();
        const uf = String(fd.get('uf') || '').trim().toUpperCase();
        if (!cep || !rua || !numero || !bairro || !cidade || !uf) { PU.toast('Preencha CEP, rua, número, bairro, cidade e UF.', 'danger'); return; }

        const btn = cadastroForm.querySelector('button[type="submit"]');
        if (btn) btn.disabled = true;
        try {
          if (!(global.QFCloud && global.QFCloud.enabled)) throw new Error('Atualização cadastral disponível somente com conexão ao banco.');
          if (tipoPessoa === 'cnpj') await global.QFCloud.saveCnpj(documento); else await global.QFCloud.saveCpf(documento);

          const cli = global.QFCloud.client;
          const uRes = await cli.auth.getUser();
          if (uRes.error || !uRes.data.user) throw new Error('Sua sessão expirou. Entre novamente.');
          const up = await cli.from('qf_profiles').update({
            tipo_pessoa: tipoPessoa,
            nome_fantasia: nomeFantasia || null,
            atualizado_em: new Date().toISOString()
          }).eq('id', uRes.data.user.id);
          if (up.error) throw up.error;

          await global.QFCloud.saveClientAddress({
            cep: cep, rua: rua, numero: numero, bairro: bairro, cidade: cidade, uf: uf,
            complemento: String(fd.get('complemento') || '').trim(),
            latitude: Number(fd.get('latitude')) || null, longitude: Number(fd.get('longitude')) || null
          });
          await global.QFCloud.syncForCurrentSession(true);
          PU.toast('Dados cadastrais atualizados com sucesso!', 'success');
          if(returnRoute)PU.closeSheet();
          global.navigate(returnRoute||'/profissional/perfil', true);
        } catch (err) {
          PU.toast((err && err.message) || 'Não foi possível atualizar seus dados.', 'danger');
        } finally { if (btn) btn.disabled = false; }
      });
    }

    const selfieInput = content.querySelector('#perfil-selfie');
    const companyLogoInput = content.querySelector('#perfil-empresa-logo');
    async function salvarImagemPerfil(input, tipo) {
      const file = input && input.files && input.files[0];
      if (!file) return;
      input.disabled = true;
      try {
        const photo = await PU.fileToCompressedDataUrl(file, 480);
        if (global.QFCloud && global.QFCloud.enabled) await global.QFCloud.saveProfessionalSelfie(photo); else DB.atualizarPerfilProfissional(user.id, { fotoUrl: photo });
        PU.toast(tipo === 'empresa' ? 'Marca da empresa atualizada. Ela poderá ser mostrada aos clientes.' : 'Selfie atualizada. Ela poderá ser mostrada aos clientes.', 'success');
        if(returnRoute)PU.closeSheet();
        global.navigate(returnRoute||'/profissional/perfil', true);
      } catch (err) {
        PU.toast((err && err.message) || 'Não foi possível salvar a imagem.', 'danger');
      } finally { input.disabled = false; }
    }
    if (selfieInput) selfieInput.addEventListener('change', function () { salvarImagemPerfil(selfieInput, 'selfie'); });
    if (companyLogoInput) companyLogoInput.addEventListener('change', function () { salvarImagemPerfil(companyLogoInput, 'empresa'); });

    // O painel rápido só contém cadastro e identificação; não reintroduz os uploads simulados.
    if(returnRoute)return;

    const chips = content.querySelector('#perfil-cats');
    chips.addEventListener('click', function (e) {
      const chip = e.target.closest('[data-chip-cat]');
      if (!chip) return;
      const id = chip.getAttribute('data-chip-cat');
      let cats = user.categorias.slice();
      if (cats.indexOf(id) === -1) cats.push(id); else cats = cats.filter(function (x) { return x !== id; });
      if (!(global.QFCloud && global.QFCloud.enabled)) DB.atualizarPerfilProfissional(user.id, { categorias: cats });
      user.categorias = cats;
      chip.classList.toggle('is-selected');
    });
    global.QFCatPicker.bind(chips);

    const areasWrap = content.querySelector('#perfil-areas');
    const addArea = content.querySelector('#adicionar-area');

    function bindAreaRanges() {
      Array.prototype.forEach.call(areasWrap.querySelectorAll('[data-area-radius]'), function (range) {
        if (range.dataset.bound) return;
        range.dataset.bound = '1';
        range.addEventListener('input', function () {
          const row = range.closest('[data-area-row]');
          const label = row && row.querySelector('[data-area-radius-label]');
          if (label) label.textContent = range.value;
        });
      });
    }
    bindAreaRanges();

    addArea.addEventListener('click', function () {
      const count = areasWrap.querySelectorAll('[data-area-row]').length;
      if (count >= 10) { PU.toast('Você pode cadastrar até 10 cidades por enquanto.', 'danger'); return; }
      areasWrap.insertAdjacentHTML('beforeend', renderServiceAreaRow({ cidade: '', uf: '', raioKm: 10 }, count));
      bindAreaRanges();
    });

    areasWrap.addEventListener('click', function (e) {
      const btn = e.target.closest('[data-remove-area]');
      if (!btn) return;
      const rows = areasWrap.querySelectorAll('[data-area-row]');
      if (rows.length <= 1) { PU.toast('Mantenha pelo menos uma cidade de atendimento.', 'danger'); return; }
      btn.closest('[data-area-row]').remove();
    });

    content.querySelector('#salvar-atendimento').addEventListener('click', async function () {
      const areas = Array.prototype.map.call(areasWrap.querySelectorAll('[data-area-row]'), function (row) {
        return {
          cidade: row.querySelector('[data-area-city]').value.trim(),
          uf: row.querySelector('[data-area-uf]').value,
          raioKm: Number(row.querySelector('[data-area-radius]').value || 10)
        };
      }).filter(function (a) { return a.cidade; });
      if (!areas.length) { PU.toast('Adicione pelo menos uma cidade de atendimento.', 'danger'); return; }
      if (chips.qfAutoPick) chips.qfAutoPick();
      const categorias = Array.prototype.map.call(chips.querySelectorAll('[data-chip-cat].is-selected'), function (chip) {
        return chip.getAttribute('data-chip-cat');
      });
      const categoriasPersonalizadas = chips.qfCustomCategories ? chips.qfCustomCategories() : [];
      if (!categorias.length) {
        if (chips.qfHighlight) chips.qfHighlight();
        PU.toast('Toque na sua profissão na lista para marcar (ela fica destacada). Só digitar na busca não marca.', 'danger');
        return;
      }

      const btn = content.querySelector('#salvar-atendimento');
      btn.disabled = true;
      try {
        if (global.QFCloud && global.QFCloud.enabled) {
          const updated = await global.QFCloud.saveProfessionalSettings(categorias, areas, categoriasPersonalizadas);
          updated.taxaVisitaPadrao = PU.parseCurrencyInput(content.querySelector('#perfil-taxa').value);
        } else {
          const first = areas[0];
          let localCity = DB.cities().find(function (c) { return String(c.nome).toLowerCase() === first.cidade.toLowerCase() && c.uf === first.uf; });
          if (!localCity) localCity = DB.criarCidade(first.cidade, first.uf);
          DB.atualizarPerfilProfissional(user.id, {
            categorias: categorias,

      return C && C.isPluginAvailable && C.isPluginAvailable('QFOnline') && C.Plugins ? C.Plugins.QFOnline : null;
    }
    const inicio = Date.now();
    let enviado = null, emEnvio = false;
    function desejado() {
      const s = DB.getSession && DB.getSession();
      if (!s || s.role !== 'profissional') return false;
      const p = DB.profissionalById && DB.profissionalById(s.userId);
      // O perfil pode estar sendo recarregado. Ausência temporária não é logout
      // nem uma decisão de desligar o serviço de notificações do Android.
      if (!p) return null;
      return !!(p.online && !p.bloqueado);
    }
    async function sync() {
      const P = plugin();
      if (!P || emEnvio) return;
      const on = desejado();
      if (on === null) return;
      // Logo ao abrir a sessão ainda pode estar carregando: não desliga o serviço nesses primeiros segundos.
      if (!on && enviado === null && Date.now() - inicio < 8000) return;
      if (on === enviado) return;
      emEnvio = true;
      let confirmado = false;
      try {
        await P.setOnline({ online: on });
        enviado = on;
        confirmado = true;
      } catch (_) { enviado = null; }
      finally { emEnvio = false; }
      // Se o usuário saiu ou mudou o estado durante a chamada nativa, aplica
      // o estado mais recente depois dela, nunca em paralelo.
      if (confirmado && desejado() !== null && desejado() !== enviado) sync();
    }
    global.QFNativeOnline = { available: function () { return !!plugin(); }, sync: sync };
    // V11.9: online automático. Ao abrir o app, o profissional fica online sozinho (a menos que tenha
    // tocado em "ficar offline"). O heartbeat a cada 60 s reafirma online=true no banco. Não existe
    // desconexão por tempo: o heartbeat nunca desliga ninguém.
    let batendo = false;
    async function batida() {
      if (batendo || !(global.QFCloud && global.QFCloud.enabled && global.QFCloud.heartbeat)) return;
      const s = DB.getSession && DB.getSession();
      if (!s || s.role !== 'profissional') return;
      const p = DB.profissionalById && DB.profissionalById(s.userId);
      if (!p || p.bloqueado) return;
      batendo = true;
      const antes = !!p.online;
      try {
        const out = await global.QFCloud.heartbeat(null);
        if (out && !!out.online !== antes) {
          sync();
          if (/^#\/profissional\/home/.test(location.hash || '') && global.navigate) global.navigate('/profissional/home', true);
        }
      } catch (err) { console.warn('QuemFaz heartbeat', err); }
      finally { batendo = false; }
    }
    setTimeout(batida, 2500);
    setInterval(batida, 60000);
    document.addEventListener('visibilitychange', function () { if (!document.hidden) batida(); });
    window.addEventListener('hashchange', function () { if (/^#\/profissional\//.test(location.hash || '')) setTimeout(batida, 800); });
    setTimeout(sync, 1500);
    setInterval(sync, 4000);
    window.addEventListener('hashchange', function () { setTimeout(sync, 300); });
    document.addEventListener('visibilitychange', function () { if (!document.hidden) sync(); });
    document.addEventListener('click', function (e) {
      const b = e.target.closest && e.target.closest('[data-action="revisar-alertas"]');
      if (!b) return;
      e.preventDefault();

  function qfUrgent(req){

  function qfSortPortfolio(list){
    return (list||[]).slice().sort(function(a,b){
      // Mesma ordem do Início: urgência paga primeiro, sem usar o prazo do cliente.
      const au=qfUrgent(a),bu=qfUrgent(b);
      if(au!==bu) return au?-1:1;
      const ap=a&&a.prioridade?1:0,bp=b&&b.prioridade?1:0;
      if(ap!==bp) return bp-ap;
      const ak=Number(a&&a.distanciaKm),bk=Number(b&&b.distanciaKm);
      if(Number.isFinite(ak)&&Number.isFinite(bk)&&ak!==bk) return ak-bk;
      return Date.parse((b&&b.criadoEm)||0)-Date.parse((a&&a.criadoEm)||0);
    });
