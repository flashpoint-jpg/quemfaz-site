        '</div>' +
        '<form id="novo-pedido-form" class="stack" novalidate>' +
          '<label class="field"><span class="field__label">Descreva o que você precisa</span>' +
            '<textarea class="textarea" name="descricao" required placeholder="Explique o problema ou serviço desejado com detalhes…"></textarea>' +
          '</label>' +

          '<div class="field">' +
            '<span class="field__label">Fotos ou vídeo (opcional)</span>' +
            '<div class="row" style="gap:8px;flex-wrap:wrap;">' +
              '<label class="btn btn--outline" style="cursor:pointer;">' + icon('image') + ' Galeria<input type="file" accept="image/*,video/*" multiple id="media-gallery-input" style="display:none;"></label>' +
              '<label class="btn btn--outline" style="cursor:pointer;">' + icon('camera') + ' Tirar foto<input type="file" accept="image/*" capture="environment" id="media-camera-input" style="display:none;"></label>' +
              '<label class="btn btn--outline" style="cursor:pointer;">' + icon('video') + ' Gravar vídeo<input type="file" accept="video/*" capture="environment" id="media-video-input" style="display:none;"></label>' +
            '</div>' +
            '<div class="upload-row" id="upload-row" style="margin-top:10px;"></div>' +
            '<span class="field__hint">Escolha da galeria, tire uma foto ou grave um vídeo curto. Até 4 mídias no total; no máximo 1 vídeo de 3 MB.</span>' +
          '</div>' +

          '<div class="field">' +
            '<span class="field__label">Endereço de atendimento</span>' +
            '<div class="stack--sm">' +
              '<div class="row" style="gap:8px;align-items:stretch;"><input class="input" name="cep" inputmode="numeric" maxlength="9" placeholder="CEP" style="flex:1;" value="' + (end ? PU.escapeHtml(end.cep || '') : '') + '"><button class="btn btn--outline" type="button" data-lookup-cep>Buscar CEP</button></div>' +
              '<button class="btn btn--outline" type="button" data-use-location>' + icon('location') + ' Usar minha localização atual</button>' +
              '<input class="input" name="rua" required placeholder="Rua e número" value="' + (end ? PU.escapeHtml(end.rua || '') : '') + '">' +
              '<input class="input" name="bairro" required placeholder="Bairro" value="' + (end ? PU.escapeHtml(end.bairro || '') : '') + '">' +
              '<div class="row" style="gap:10px;">' +
                '<input class="input" name="cidade" required placeholder="Cidade" style="flex:2;" value="' + PU.escapeHtml(endCidade) + '">' +
                '<select class="select" name="uf" required style="flex:1;"><option value="">UF</option>' + global.QFGeo.ufOptions(endUf) + '</select>' +
              '</div>' +
              '<input class="input" name="complemento" placeholder="Complemento (opcional)" value="' + (end && end.complemento ? PU.escapeHtml(end.complemento) : '') + '">' +
              '<input type="hidden" name="latitude" value="' + (end && end.latitude != null ? PU.escapeHtml(end.latitude) : '') + '"><input type="hidden" name="longitude" value="' + (end && end.longitude != null ? PU.escapeHtml(end.longitude) : '') + '">' +
            '</div>' +
          '</div>' +

          '<div class="card card--tight" style="background:var(--success-100);border:none;">' +
            '<div class="row">' + icon('checkCircle', 'list-item__chevron') + '<div><div class="text--strong" style="color:var(--success-600);">Pedido normal é 100% grátis</div><div class="text--sm" style="color:var(--success-600);">Você não paga para criar o chamado.</div></div></div>' +
          '</div>' +
          '<label class="card row-between" style="cursor:pointer;align-items:flex-start;">' +
            '<div class="row" style="align-items:flex-start;"><div class="icon-tile icon-tile--orange">' + icon('bolt') + '</div><div><div class="text--strong">Pacote Prioridade</div><div class="text--sm text--secondary">Opcional · pagamento obrigatório · ' + PU.formatCurrency(DB.state.settings.prioridadeCliente || 690) + '</div><div class="text--sm" style="color:var(--orange-700);margin-top:3px;">A prioridade só fica ativa depois da confirmação do pagamento.</div></div></div>' +
            '<input type="checkbox" name="prioridade" value="1" style="width:22px;height:22px;accent-color:var(--orange-600);margin-top:4px;">' +
          '</label>' +
          '<label class="field"><span class="field__label">Forma de pagamento da prioridade</span><select class="select" name="prioridadeMetodo"><option value="pix">Pix</option><option value="cartao">Cartão de crédito</option><option value="boleto">Boleto</option></select></label>' +
          '<div data-coverage aria-live="polite"></div>' +
          '<button class="btn btn--primary" type="submit" style="margin-top:4px;">' + icon('search') + ' Publicar chamado</button>' +
        '</form>' +
      '</div>'
    );
  };

  // ---------------- Lista de pedidos ----------------

  Screens.clientePedidosRender = function (params, user) {
    const hidden = loadHiddenHistory('cliente', user.id);
    const all = DB.requestsByCliente(user.id);
    const ativos = all.filter(function (r) { return ACTIVE_STATUSES.indexOf(r.status) !== -1; });
    const historico = all.filter(function (r) { return ACTIVE_STATUSES.indexOf(r.status) === -1 && hidden.indexOf(r.id) === -1; });
    if (!ativos.length && !historico.length) {
      return '<div class="view">' + emptyPedidos() + '</div>';
    }
    return (
      '<div class="view">' +
        (ativos.length ? '<div class="section"><div class="section-head"><h2 class="h3">Em andamento</h2></div><div class="stack--sm">' + ativos.map(pedidoCard).join('') + '</div></div>' : '') +
        (historico.length ? '<div class="section"><div class="section-head"><h2 class="h3">Histórico</h2></div><div class="stack--sm">' + historico.map(function (r) {
          return '<div class="history-entry">' + pedidoCard(r) +
            '<button class="history-delete" type="button" data-hide-pedido="' + PU.escapeHtml(r.id) + '" aria-label="Excluir pedido do histórico" title="Excluir do histórico">' + icon('xCircle') + '</button></div>';
        }).join('') + '</div></div>' : '') +
      '</div>'
    );
  };

  function emptyPedidos() {
    return '<div class="empty-state">' +
      '<div class="icon-tile icon-tile--lg icon-tile--ghost">' + icon('clipboard') + '</div>' +
      '<h2 class="h3">Nenhum pedido ainda</h2>' +
      '<p class="text text--secondary">Escolha uma categoria na Início para solicitar seu primeiro serviço.</p>' +
      '<button class="btn btn--primary btn--block-auto" data-nav="/cliente/home" style="margin-top:6px;">Ver categorias</button>' +
    '</div>';
  }

  // ---------------- Detalhe / acompanhamento do pedido ----------------

  Screens.clientePedidoDetalheRender = function (params, user) {
    const req = DB.requestById(params.id);
    if (!req || req.clienteId !== user.id) return '<div class="view"><p class="text">Pedido não encontrado.</p></div>';
    const cat = DB.categoryById(req.categoriaId);
    const prof = req.profissionalId ? DB.profissionalById(req.profissionalId) : null;

    return (
      '<div class="view" data-request-id="' + req.id + '">' +
        '<div class="row-between">' +
          '<div class="row">' +
            '<div class="icon-tile">' + icon(cat ? cat.icon : 'tag') + '</div>' +
            '<div class="h3">' + PU.escapeHtml(cat ? cat.nome : 'Serviço') + '</div>' +
          '</div>' +
          '<div class="row" style="gap:6px;">' + (req.prioridade ? '<span class="badge badge--orange"><span class="badge__dot"></span>Prioritário</span>' : '') + statusBadge(req.status) + '</div>' +
        '</div>' +

        buscandoBlock(req) +
        semProfissionalBlock(req) +
        profissionalEncontradoBlock(req, prof) +
        orcamentoBlock(req, prof) +
        avaliacaoBlock(req, prof) +
        canceladoBlock(req) +

        '<div class="section">' +
          '<div class="section-head"><h2 class="h3">Detalhes</h2></div>' +
          '<div class="card stack--sm">' +
            '<div class="text text--sm text--secondary">' + PU.escapeHtml(req.descricao) + '</div>' +
            (req.fotos && req.fotos.length ? '<div class="upload-row">' + req.fotos.map(renderCallMedia).join('') + '</div>' : '') +
            '<hr class="hairline">' +
            '<div class="row text--sm text--secondary">' + icon('mapPin', 'list-item__chevron') + '<span>' + PU.escapeHtml(req.endereco.rua) + ', ' + PU.escapeHtml(req.endereco.bairro) + '</span></div>' +
          '</div>' +
        '</div>' +

        statusTrackSection(req) +

        (canCancel(req.status)
          ? '<div class="section"><button class="btn btn--danger-ghost" data-action="cancelar-pedido">' + icon('xCircle') + ' Cancelar pedido</button></div>'
          : '') +
        (req.status === STATUS.CANCELADO
          ? '<div class="section"><button class="btn btn--primary" data-action="refazer-pedido">' + icon('refresh') + ' Refazer o mesmo pedido</button><div class="text--sm text--secondary" style="margin-top:7px;">Descrição, endereço e mídias serão reaproveitados. Você pode revisar antes de publicar.</div></div>'
          : '') +
      '</div>'
    );
  };

  function canCancel(status) {
    return [STATUS.BUSCANDO, STATUS.SEM_PROFISSIONAL, STATUS.AGUARDANDO_ACEITE, STATUS.AGUARDANDO_ORCAMENTO, STATUS.ORCAMENTO_ENVIADO, STATUS.ORCAMENTO_RECUSADO, STATUS.APROVADO].indexOf(status) !== -1;
  }

  function buscandoBlock(req) {
    if (req.status !== STATUS.BUSCANDO && req.status !== STATUS.AGUARDANDO_ACEITE) return '';
    return (
      '<div class="section">' +
        '<div class="card" style="display:flex;flex-direction:column;align-items:center;text-align:center;padding:30px 16px;">' +
          '<div class="icon-tile icon-tile--lg icon-tile--orange">' + icon(req.prioridade ? 'bolt' : 'bell') + '</div>' +
          '<h2 class="h3" style="margin-top:14px;">' + (req.prioridade ? 'Chamado prioritário publicado' : 'Chamado publicado') + '</h2>' +
          '<p class="text text--secondary text--sm" style="margin-top:4px;">Profissionais compatíveis e mais próximos dentro da área escolhida podem visualizar o serviço. O primeiro que desbloquear o chamado será conectado a você.</p>' +
          '<div class="qf-call-reach" data-call-reach data-call-id="' + PU.escapeHtml(req.id) + '">Avisando os profissionais mais próximos…</div>' +
          '<div class="qf-still-searching" data-still-searching data-created="' + PU.escapeHtml(String(req.criadoEm || '')) + '" hidden><div class="text--strong">Ainda estamos procurando</div><div class="text--sm">Avisamos mais profissionais perto de você. Você não precisa fazer nada; vamos te avisar quando alguém aceitar.</div><button class="btn btn--outline btn--sm" type="button" data-support-open>' + icon('info') + ' Falar com o suporte</button></div>' +
          (req.prioridade
            ? '<div class="badge badge--orange" style="margin-top:12px;"><span class="badge__dot"></span>Prioridade paga e ativa</div>'
            : (req.pagamentoPrioridade && req.pagamentoPrioridade.status === 'pendente'
              ? '<div class="badge badge--orange" style="margin-top:12px;"><span class="badge__dot"></span>Prioridade aguardando pagamento · ' + PU.formatCurrency(req.pagamentoPrioridade.valor || DB.state.settings.prioridadeCliente || 690) + '</div>'
              : '<div class="badge badge--success" style="margin-top:12px;"><span class="badge__dot"></span>Chamado normal gratuito</div>')) +
          (req.pagamentoPrioridade && req.pagamentoPrioridade.status === 'pendente' && req.pagamentoPrioridade.checkoutUrl
            ? '<a class="btn btn--primary btn--block-auto" href="' + PU.escapeHtml(req.pagamentoPrioridade.checkoutUrl) + '" rel="noopener" style="margin-top:12px;">' + icon('bolt') + ' Pagar prioridade</a>'
            : (req.pagamentoPrioridade && req.pagamentoPrioridade.status === 'pendente' && req.pagamentoPrioridade.id
              ? '<button class="btn btn--primary btn--block-auto" data-action="gerar-pagamento-prioridade" data-payment-id="' + PU.escapeHtml(req.pagamentoPrioridade.id) + '" style="margin-top:12px;">' + icon('bolt') + ' Gerar pagamento</button>'
              : '')) +
        '</div>' +
      '</div>'
    );
  }

  function semProfissionalBlock(req) {
    if (req.status !== STATUS.SEM_PROFISSIONAL) return '';
    return (
      '<div class="section">' +
        '<div class="card" style="text-align:center;padding:28px 16px;">' +
          '<div class="icon-tile icon-tile--ghost" style="margin:0 auto 12px;">' + icon('alertTriangle') + '</div>' +
          '<h2 class="h3">Nenhum profissional disponível agora</h2>' +
          '<p class="text text--secondary text--sm" style="margin-top:4px;">Tente novamente em instantes ou aguarde — avisamos assim que alguém ficar online.</p>' +
          '<button class="btn btn--primary" data-action="tentar-novamente" style="margin-top:14px;">' + icon('refresh') + ' Tentar novamente</button>' +
        '</div>' +
      '</div>'
    );
  }

  function whatsappHref(phone, message) {
    let d = String(phone || '').replace(/\D/g, '');
    if (!d) return '';
    if (d.length === 10 || d.length === 11) d = '55' + d;
    return 'https://wa.me/' + d + (message ? '?text=' + encodeURIComponent(message) : '');
  }
  global.QFUI = global.QFUI || {};
  global.QFUI.whatsappHref = whatsappHref;
  global.QFUI.telHref = telHref;
  global.QFUI.personAvatar = personAvatar;
  function telHref(phone) {
    let d = String(phone || '').replace(/\D/g, '');
    if (!d) return '';
    if (d.length === 10 || d.length === 11) d = '55' + d;
    return 'tel:+' + d;
  }
  function personAvatar(person, cls) {
    cls = cls || '';
    const photo = person && person.fotoUrl ? String(person.fotoUrl) : '';
    return '<div class="avatar ' + cls + '">' + (photo ? '<img src="' + PU.escapeHtml(photo) + '" alt="Foto de ' + PU.escapeHtml(person.nome || 'profissional') + '">' : PU.initials((person || {}).nome || '?')) + '</div>';
  }

  function profCard(prof, extra) {
    if (!prof) return '';
    const wa = whatsappHref(prof.telefone, 'Olá ' + (prof.nome || '') + ', estou falando pelo QuemFaz sobre meu chamado.');
    return (
      '<div class="card prof-safety-card">' +
        '<div class="row" style="align-items:flex-start;">' +
          personAvatar(prof, 'avatar--lg') +
          '<div class="spacer">' +
            '<div class="row" style="gap:7px;flex-wrap:wrap;"><div class="text--strong">' + PU.escapeHtml(prof.nome) + '</div>' +
              (prof.verificado ? '<span class="badge badge--success"><span class="badge__dot"></span>Verificado</span>' : (prof.fotoUrl ? '<span class="badge badge--warning"><span class="badge__dot"></span>Identificação cadastrada</span>' : '')) +
            '</div>' +
            '<div class="row text--sm text--secondary qf-rating" style="gap:6px;margin-top:4px;">' + global.QFRating(prof.avaliacaoMedia, prof.totalAvaliacoes) + '</div>' +
            ((prof.cidadeNome || prof.uf) ? '<div class="text--sm text--secondary" style="margin-top:4px;">' + icon('mapPin', 'list-item__chevron') + ' ' + PU.escapeHtml([prof.cidadeNome, prof.uf].filter(Boolean).join(' · ')) + '</div>' : '') +
            '<div class="text--sm text--secondary" style="margin-top:4px;">Foto e dados do perfil exibidos para sua segurança.</div>' +
            (extra || '') +
          '</div>' +
        '</div>' +
        (wa ? '<div class="btn-row" style="margin-top:12px;"><a class="btn btn--whatsapp" data-contact="whatsapp" href="' + wa + '" target="_blank" rel="noopener">' + icon('whatsapp') + ' WhatsApp</a>' +
          '<a class="btn btn--outline" data-contact="ligar" href="' + telHref(prof.telefone) + '">' + icon('phoneCall') + ' Ligar</a></div>' : '') +
      '</div>'
    );
  }

  function profissionalEncontradoBlock(req, prof) {
    if (req.status !== STATUS.AGUARDANDO_ORCAMENTO) return '';
    return (
      '<div class="section">' +
        '<div class="section-head"><h2 class="h3">Profissional encontrado</h2></div>' +
        profCard(prof) +
        '<div class="card card--tight" style="margin-top:10px;background:var(--navy-100);border:none;">' +
          '<p class="text text--sm" style="color:var(--navy-800);">' + PU.escapeHtml((prof || {}).nome || 'O profissional') + ' aceitou seu chamado e está preparando o orçamento. Você será avisado assim que ele chegar.</p>' +
        '</div>' +
      '</div>'
    );
  }

  function orcamentoBlock(req, prof) {
    if (!req.orcamento) return '';
    if ([STATUS.ORCAMENTO_ENVIADO, STATUS.ORCAMENTO_RECUSADO, STATUS.APROVADO, STATUS.EM_ANDAMENTO, STATUS.SERVICO_CONCLUIDO].indexOf(req.status) === -1) return '';
    const o = req.orcamento;
    return (
      '<div class="section">' +
        '<div class="section-head"><h2 class="h3">Orçamento</h2></div>' +
        profCard(prof) +
        '<div class="card stack--sm" style="margin-top:10px;">' +
          (req.taxaVisita ? rowValor('Taxa de visita', req.taxaVisita) : '') +
          rowValor('Mão de obra', o.maoDeObra) +
          rowValor('Material', o.material) +
          '<hr class="hairline">' +
          rowValor('Total', o.total + (req.taxaVisita || 0), true) +
        '</div>' +
        (req.status === STATUS.ORCAMENTO_ENVIADO ? (
          '<div class="btn-row" style="margin-top:12px;">' +
            '<button class="btn btn--outline" data-action="recusar-orcamento">Recusar</button>' +
            '<button class="btn btn--primary" data-action="aprovar-orcamento">' + icon('check') + ' Aprovar</button>' +
          '</div>'
        ) : '') +
        (req.status === STATUS.ORCAMENTO_RECUSADO ? (
          '<div class="card card--tight" style="margin-top:10px;background:var(--danger-100);border:none;">' +
            '<p class="text text--sm" style="color:var(--danger-600);">Você recusou este orçamento' + (o.motivoRecusa ? ': "' + PU.escapeHtml(o.motivoRecusa) + '"' : '.') + ' O profissional pode enviar uma nova proposta.</p>' +
          '</div>'
        ) : '') +
      '</div>'
    );
  }

  function rowValor(label, cents, strong) {
    return '<div class="row-between"><span class="text' + (strong ? ' text--strong' : ' text--secondary text--sm') + '">' + label + '</span><span class="text' + (strong ? ' h3' : ' text--sm') + '">' + PU.formatCurrency(cents) + '</span></div>';
  }

  function pagamentoBlock(req) {
    if (req.status !== STATUS.SERVICO_CONCLUIDO) return '';
    return (
      '<div class="section">' +
        '<div class="card" style="text-align:center;padding:26px 16px;">' +
          '<div class="icon-tile icon-tile--lg icon-tile--orange" style="margin:0 auto 12px;">' + icon('creditCard') + '</div>' +
          '<h2 class="h3">Serviço concluído!</h2>' +
          '<p class="text text--secondary text--sm" style="margin-top:4px;">O pagamento do serviço é combinado diretamente com o profissional.</p>' +
          '<div class="h1" style="margin:14px 0;">' + PU.formatCurrency(req.orcamento.total + (req.taxaVisita || 0)) + '</div>' +
          '<button class="btn btn--primary" data-action="pagar-pedido">' + icon('creditCard') + ' Pagar agora (simulado)</button>' +
        '</div>' +
      '</div>'
    );
  }

  function avaliacaoBlock(req, prof) {
    if ((req.status === STATUS.SERVICO_CONCLUIDO || req.status === STATUS.PAGO) && !req.avaliacaoCliente) {
      return (
        '<div class="section">' +
          '<div class="section-head"><h2 class="h3">Como foi o serviço?</h2></div>' +
          '<div class="card stack" id="avaliacao-form">' +
            '<div class="text--sm text--secondary">Como foi seu atendimento com ' + PU.escapeHtml((prof || {}).nome || 'o profissional') + '?</div>' +
            '<div class="star-picker" id="cliente-star-picker">' +
              [1, 2, 3, 4, 5].map(function (n) { return '<button type="button" data-star="' + n + '" aria-label="' + n + ' estrelas">' + icon('starFilled') + '</button>'; }).join('') +
            '</div>' +
            '<textarea class="textarea" id="cliente-avaliacao-comentario" placeholder="Conte como foi (opcional)"></textarea>' +
            '<button class="btn btn--primary" data-action="enviar-avaliacao">Enviar avaliação</button>' +
          '</div>' +

              '<div class="status-step__rail">' +
                '<div class="status-step__dot">' + (s.state === 'done' ? icon('check') : '') + '</div>' +

              '</div>' +
              '<div class="status-step__body">' +
                '<div class="status-step__title">' + s.title + '</div>' +
                (s.sub ? '<div class="status-step__sub">' + s.sub + (s.state === 'current' && s.working ? '<span class="status-step__waiting-dots" aria-hidden="true"><i></i><i></i><i></i></span>' : '') + '</div>' : '') +
                (s.state === 'current' && s.working ? '<div class="status-step__activity" aria-hidden="true"></div>' : '') +
              '</div>' +
            '</div>';
          }).join('') +
        '</div>' +
      '</div>'
    );

  function buildTrackSteps(req) {
    if (req.status === STATUS.CANCELADO) {
      return [
        { title: 'Pedido criado', sub: PU.formatDateTime(req.criadoEm), state: 'done' },
        { title: 'Cancelado', sub: PU.formatDateTime(req.atualizadoEm), state: 'current' },
      ];
    }
    const order = [STATUS.BUSCANDO, STATUS.AGUARDANDO_ORCAMENTO, STATUS.ORCAMENTO_ENVIADO, STATUS.APROVADO, STATUS.EM_ANDAMENTO, STATUS.SERVICO_CONCLUIDO, STATUS.FINALIZADO];
    const titles = {
      buscando: 'Chamado publicado', aguardando_orcamento: 'Profissional conectado', orcamento_enviado: 'Orçamento enviado',
      aprovado: 'Orçamento aprovado', em_andamento: 'Serviço em andamento', servico_concluido: 'Serviço concluído',
      finalizado: 'Avaliação concluída',
    };
    const activity = {
      buscando: 'Buscando profissionais próximos',
      aguardando_orcamento: 'Profissional analisando sua solicitação',
      orcamento_enviado: 'Aguardando sua aprovação do orçamento',
      aprovado: 'Aprovado — aguardando início do serviço',
      em_andamento: 'Serviço em execução',
      servico_concluido: 'Aguardando sua avaliação',
      finalizado: 'Processo finalizado'
    };
    let effectiveStatus = req.status;
    if ([STATUS.AGUARDANDO_ACEITE, STATUS.SEM_PROFISSIONAL].indexOf(req.status) !== -1) effectiveStatus = STATUS.BUSCANDO;
    if (req.status === STATUS.ORCAMENTO_RECUSADO) effectiveStatus = STATUS.AGUARDANDO_ORCAMENTO;
    const idx = order.indexOf(effectiveStatus);
    const fluxoFinalizado = effectiveStatus === STATUS.FINALIZADO;
    return order.map(function (st, i) {
      const state = fluxoFinalizado ? 'done' : (i < idx ? 'done' : i === idx ? 'current' : 'pending');
      return {
        title: titles[st],
        sub: state === 'current' ? activity[st] : '',
        working: state === 'current' && !fluxoFinalizado,
        state: state
      };
    });
  }

  function bindCategoryBrowser(content) {
    const input = content.querySelector('[data-category-search]');
    const chips = Array.prototype.slice.call(content.querySelectorAll('[data-category-filter]'));
    const groups = Array.prototype.slice.call(content.querySelectorAll('[data-category-group]'));
    const tiles = Array.prototype.slice.call(content.querySelectorAll('.category-tile[data-cat-name]'));
    const empty = content.querySelector('[data-category-empty]');
    if (!input || !tiles.length) return;
    let active = 'todos';
    function norm(v) {
      return String(v || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
    }
    function apply() {
      const q = norm(input.value);
      let visible = 0;
      tiles.forEach(function (tile) {
        const byGroup = active === 'todos' || tile.getAttribute('data-cat-group') === active;
        const byText = !q || norm(tile.getAttribute('data-cat-name')).indexOf(q) !== -1;
        const show = byGroup && byText;
        tile.style.display = show ? '' : 'none';
        if (show) visible++;
      });
      groups.forEach(function (group) {
        const has = Array.prototype.some.call(group.querySelectorAll('.category-tile'), function (tile) { return tile.style.display !== 'none'; });
        group.style.display = has ? '' : 'none';
      });
      if (empty) empty.style.display = visible ? 'none' : 'block';
    }
    input.addEventListener('input', apply);
    chips.forEach(function (chip) {
      chip.addEventListener('click', function () {
        active = chip.getAttribute('data-category-filter') || 'todos';
        chips.forEach(function (c) { c.classList.toggle('is-active', c === chip); });
        apply();
      });
    });
    apply();
  }

  function renderCallMedia(src) {
      src = String(src || '');
      const safe = PU.escapeHtml(src);
      if (/^data:video\//i.test(src)) {
        return '<video class="upload-thumb" src="' + safe + '" controls playsinline preload="metadata" aria-label="Vídeo enviado pelo cliente"></video>';
      }
      return '<img class="upload-thumb" src="' + safe + '" alt="Foto enviada pelo cliente">';
    }

    function bindNovoPedido(content, params, user) {
    const form = content.querySelector('#novo-pedido-form');
    const galleryInput = content.querySelector('#media-gallery-input');
      const cameraInput = content.querySelector('#media-camera-input');
      const videoInput = content.querySelector('#media-video-input');
      const uploadRow = content.querySelector('#upload-row');
      let fotos = [];
      global.QFGeo.bindAddressForm(form);

      function rawFileToDataUrl(file) {
        return new Promise(function (resolve, reject) {
          const reader = new FileReader();
          reader.onerror = function () { reject(reader.error || new Error('Falha ao ler o arquivo.')); };
          reader.onload = function () { resolve(String(reader.result || '')); };
          reader.readAsDataURL(file);
        });
      }

      function videoCount() {
        return fotos.filter(function (m) { return /^data:video\//i.test(String(m || '')); }).length;
      }

      async function addMediaFromInput(input) {
        if (!input) return;
        const selected = Array.prototype.slice.call(input.files || []);
        const room = 4 - fotos.length;
        if (room <= 0) {
          PU.toast('Você pode enviar até 4 mídias por chamado.', 'danger');
          input.value = '';
          return;
        }
        if (selected.length > room) PU.toast('Limite de 4 mídias por chamado.', 'danger');
        const files = selected.slice(0, room);

        for (const file of files) {
          try {
            let durl = '';
            if (/^image\//i.test(file.type || '')) {
              durl = await PU.fileToCompressedDataUrl(file, 640);
            } else if (/^video\//i.test(file.type || '')) {
              if (videoCount() >= 1) {
                PU.toast('Envie no máximo 1 vídeo por chamado.', 'danger');
                continue;
              }
              if (Number(file.size || 0) > 3 * 1024 * 1024) {
                PU.toast('O vídeo precisa ter no máximo 3 MB. Grave um vídeo mais curto.', 'danger');
                continue;
              }
              durl = await rawFileToDataUrl(file);
            } else {
              PU.toast('Use apenas foto ou vídeo.', 'danger');
              continue;
            }
            fotos.push(durl);
            renderThumb(durl);
          } catch (_) {
            PU.toast('Não foi possível carregar esta mídia.', 'danger');
          }
        }
        input.value = '';
      }

      [galleryInput, cameraInput, videoInput].forEach(function (input) {
        if (!input) return;
        input.addEventListener('change', function () { addMediaFromInput(input); });
      });

      function renderThumb(durl) {
        const wrap = document.createElement('div');
        wrap.className = 'upload-thumb-wrap';
        const safe = PU.escapeHtml(String(durl || ''));
        const media = /^data:video\//i.test(String(durl || ''))
          ? '<video class="upload-thumb" src="' + safe + '" controls playsinline muted preload="metadata" aria-label="Vídeo do serviço"></video>'
          : '<img class="upload-thumb" src="' + safe + '" alt="Foto do serviço">';
        wrap.innerHTML = media + '<span class="upload-thumb-remove" role="button" tabindex="0" aria-label="Remover mídia">' + icon('x') + '</span>';
        wrap.querySelector('.upload-thumb-remove').addEventListener('click', function () {
          fotos = fotos.filter(function (f) { return f !== durl; });
          wrap.remove();
        });
        uploadRow.appendChild(wrap);
      }

      (function applyRepeatOrderDraft() {
        let draft = null;
        try {
          const raw = sessionStorage.getItem('qf_repeat_order_draft');
          if (raw) draft = JSON.parse(raw);
        } catch (_) { draft = null; }
        if (!draft || String(draft.categoriaId || '') !== String(params.catId || '')) return;

        const setField = function (name, value) {
          const el = form.querySelector('[name="' + name + '"]');
          if (el && value != null) el.value = String(value);
        };
        setField('descricao', draft.descricao || '');

        const end = draft.endereco || {};
        setField('cep', end.cep || '');
        setField('rua', end.rua || '');
        setField('bairro', end.bairro || '');
        setField('cidade', end.cidade || '');
        setField('uf', end.uf || '');
        setField('complemento', end.complemento || '');
        setField('latitude', end.latitude != null ? end.latitude : '');
        setField('longitude', end.longitude != null ? end.longitude : '');

        fotos = Array.isArray(draft.fotos) ? draft.fotos.slice(0, 4) : [];
        fotos.forEach(function (media) { renderThumb(media); });

        try { sessionStorage.removeItem('qf_repeat_order_draft'); } catch (_) {}
        PU.toast('Pedido anterior carregado. Revise e publique quando quiser.', 'success');
      })();

      form.addEventListener('submit', async function (e) {
      e.preventDefault();
      const fd = new FormData(form);
      const cep = fd.get('cep').trim();
      if (!global.QFGeo.normalizeCep(cep)) { PU.toast('Informe um CEP válido para localizar o chamado corretamente.', 'danger'); return; }
      const cidade = fd.get('cidade').trim(); const uf = fd.get('uf');
      if (!cidade || !uf) { PU.toast('Informe cidade e estado.', 'danger'); return; }
      let localCity = DB.cities().find(function (c) { return String(c.nome).toLowerCase() === cidade.toLowerCase() && c.uf === uf; });
      if (!localCity) localCity = DB.criarCidade(cidade, uf);
      const endereco = {
        id: PU.uid('end'), rua: fd.get('rua').trim(), bairro: fd.get('bairro').trim(), cidade: cidade, uf: uf,
        cidadeId: localCity.id, cep: global.QFGeo.formatCep(cep), complemento: fd.get('complemento').trim(),
        latitude: Number(fd.get('latitude')) || null, longitude: Number(fd.get('longitude')) || null
      };
      const prioridade = fd.get('prioridade') === '1';
      const prioridadeMetodo = fd.get('prioridadeMetodo') || 'pix';
      await pedirNotificacaoAntesDePublicar();
      const btn = form.querySelector('button[type="submit"]');
      const btnHtml = btn ? btn.innerHTML : '';
      if (btn) { btn.disabled = true; btn.textContent = 'Publicando chamado…'; }
      try {
        const dados = { clienteId: user.id, categoriaId: params.catId, descricao: fd.get('descricao').trim(), fotos: fotos, endereco: endereco, prioridade: prioridade, prioridadeMetodo: prioridadeMetodo };
        const req = (global.QFCloud && global.QFCloud.enabled)
          ? await global.QFCloud.createCall(dados)
          : DB.criarPedido(dados);
        if (prioridade) {
          const pp = req.pagamentoPrioridade || {};
          if (pp.status === 'aprovado') PU.toast('Pagamento confirmado. Prioridade ativada!', 'success');
          else if (pp.status === 'erro') PU.toast('Chamado publicado normalmente. A prioridade não foi ativada porque o pagamento não pôde ser iniciado.', 'danger');
          else PU.toast('Chamado publicado. A prioridade ficará ativa somente depois do pagamento.', 'success');
        } else {
          PU.toast('Chamado criado grátis! O sistema começou a procurar os profissionais mais próximos da categoria.', 'success');
        }
        global.navigate('/cliente/pedido/' + req.id, true);
      } catch (err) {
        PU.toast('Não foi possível criar o chamado. ' + (err && err.message ? err.message : ''), 'danger');
      } finally {
        if (btn) { btn.disabled = false; btn.innerHTML = btnHtml; }
      }
    });
  }

  // V11.3: cliente — oferece ativar notificações antes de publicar; se recusar, publica mesmo assim.
  function pedirNotificacaoAntesDePublicar() {
    const P = global.QFPush;
    if (!P || !P.supported() || P.isActive()) return Promise.resolve(true);
    return new Promise(function (resolve) {
      const negado = P.permission() === 'denied';
      PU.openSheet('<div class="stack"><div class="icon-tile icon-tile--lg icon-tile--orange" style="margin:0 auto;">' + icon('bell') + '</div>' +
        '<h3 class="sheet__title" style="text-align:center;">Ative as notificações para saber quando um profissional responder</h3>' +
        (negado ? '<p class="text--sm" style="color:var(--danger-600);text-align:center;">As notificações estão bloqueadas neste aparelho. Você pode publicar e acompanhar pelo app.</p>'
                : '<button class="btn btn--primary" id="qf-cli-notif-ativar">' + icon('bell') + ' Ativar notificações</button>') +
        '<button class="btn btn--outline" id="qf-cli-notif-pular">' + (negado ? 'Publicar mesmo assim' : 'Agora não, publicar') + '</button>' +
        '<div class="text--sm" id="qf-cli-notif-erro" role="alert" style="color:var(--danger-600);text-align:center;"></div></div>', { persistent: true });
      const pular = document.getElementById('qf-cli-notif-pular');
      const ativar = document.getElementById('qf-cli-notif-ativar');
      if (pular) pular.onclick = function () { PU.closeSheet(); resolve(false); };
      if (ativar) ativar.onclick = async function () {
        ativar.disabled = true;
        try { await P.activate(); PU.closeSheet(); resolve(true); }
        catch (err) { PU.closeSheet(); resolve(false); }
      };
    });
  }

  let qfReachTimer=null;
  function stopCallReachPolling(){if(qfReachTimer){clearInterval(qfReachTimer);qfReachTimer=null;}}
  function renderCallReach(el,req,data){
    if(!el||!req||!data)return;
    const avisados=Number(data.avisados||0),online=Number(data.online_na_regiao||0);
    if(avisados>0){el.innerHTML='<strong>'+avisados+(avisados===1?' profissional':' profissionais')+' perto de você '+(avisados===1?'já foi avisado':'já foram avisados')+'</strong>';return;}
    if(online>0){el.textContent='Avisando os profissionais mais próximos…';return;}
    const created=typeof req.criadoEm==='number'?req.criadoEm:Date.parse(req.criadoEm||'');
    if(!Number.isFinite(created)||Date.now()-created<120000){el.textContent='Procurando profissionais online na sua região…';return;}
    const cat=DB.categoryById(req.categoriaId);
    el.innerHTML='<div class="qf-no-coverage"><div class="text--strong">Nenhum profissional online agora</div><div class="text--sm text--secondary" style="margin-top:4px;">No momento não há profissionais de '+PU.escapeHtml((cat&&cat.nome)||'serviço')+' online na sua região. Seu pedido continua publicado e avisaremos assim que alguém ficar disponível.</div><button class="btn btn--outline" type="button" data-support-open>Falar com o QuemFaz</button><button class="btn btn--primary" type="button" data-action="manter-pedido">Manter pedido</button></div>';
  }
  function startCallReachPolling(content,req){
    stopCallReachPolling();
    if(!req||(req.status!==STATUS.BUSCANDO&&req.status!==STATUS.AGUARDANDO_ACEITE))return;
    const el=content.querySelector('[data-call-reach]');
    if(!el||!(global.QFCloud&&global.QFCloud.client))return;
    async function load(){
      if(location.hash!=='#/cliente/pedido/'+req.id){stopCallReachPolling();return;}
      try{const res=await global.QFCloud.client.rpc('qf_chamado_alcance',{p_chamado_id:req.id});if(res.error)throw res.error;renderCallReach(el,req,res.data||{});}catch(err){console.warn('QuemFaz alcance do chamado',err);}
    }
    load();qfReachTimer=setInterval(load,15000);
  }

  function bindPedidoDetalhe(content, params, user) {
    const req = DB.requestById(params.id);
    if (!req) return;
    // V11.3: sem notificação ativa, avisa que o cliente precisa acompanhar pelo app.
    if (global.QFPush && !global.QFPush.isActive() && ACTIVE_STATUSES.indexOf(req.status) !== -1 && !content.querySelector('.qf-no-notif-strip')) {
      const strip = document.createElement('div');
      strip.className = 'qf-no-notif-strip';
      strip.setAttribute('role', 'status');
      strip.innerHTML = icon('bell') + '<span>Você não será avisado — acompanhe pelo app.</span>';
      const view = content.querySelector('.view') || content;
      view.insertBefore(strip, view.firstChild);
    }
    startCallReachPolling(content, req);

    if (req.status === STATUS.BUSCANDO && !(global.QFCloud && global.QFCloud.enabled)) {
      setTimeout(function () {
        if (location.hash !== '#/cliente/pedido/' + req.id) return;
        DB.buscarProfissional(req.id);
        global.navigate('/cliente/pedido/' + req.id, true);
      }, 1600);
    }

    content.addEventListener('click', function (e) {
      const action = e.target.closest('[data-action]');
      if (!action) return;
      const act = action.getAttribute('data-action');

      if (act === 'manter-pedido') {
        const box=action.closest('.qf-no-coverage');
        if(box)box.innerHTML='<div class="text--sm text--secondary">Pedido mantido. Continuaremos procurando e avisaremos quando houver profissional disponível.</div>';
        return;
      }
      if (act === 'tentar-novamente') {
        if (global.QFCloud && global.QFCloud.enabled) {
          global.QFCloud.syncForCurrentSession(true).then(function () { global.navigate('/cliente/pedido/' + req.id, true); });
        } else {
          DB.buscarProfissional(req.id);
          global.navigate('/cliente/pedido/' + req.id, true);
        }
      }
      if (act === 'refazer-pedido') {
        try {
          sessionStorage.setItem('qf_repeat_order_draft', JSON.stringify({
            sourceId: req.id,
            categoriaId: req.categoriaId,
            descricao: req.descricao || '',
            fotos: Array.isArray(req.fotos) ? req.fotos.slice(0, 4) : [],
            endereco: req.endereco || null
          }));
        } catch (_) {}
        global.navigate('/cliente/novo-pedido/' + encodeURIComponent(req.categoriaId));
      }
      if (act === 'gerar-pagamento-prioridade') {
        if (!(global.QFCloud && global.QFCloud.enabled)) return;
        const paymentId = action.getAttribute('data-payment-id');
        action.disabled = true;
        const oldHtml = action.innerHTML;
        action.textContent = 'Gerando pagamento...';
        (async function () {
          try {
            const out = await global.QFCloud.startEfiCheckout('prioridade', paymentId);
            if (!out.checkout_url) throw new Error('O link de pagamento não foi gerado.');
            if (req.pagamentoPrioridade) req.pagamentoPrioridade.checkoutUrl = out.checkout_url;
            DB.persist();
            location.href = out.checkout_url;
          } catch (err) {
            PU.toast((err && err.message) || 'Não foi possível gerar o pagamento.', 'danger');
            action.disabled = false;
            action.innerHTML = oldHtml;
          }
        })();
      }
      if (act === 'cancelar-pedido') {
        PU.confirmDialog({ title: 'Cancelar pedido', message: 'Tem certeza que deseja cancelar este pedido?', okLabel: 'Cancelar pedido', danger: true }).then(function (ok) {
          if (!ok) return;
          if (global.QFCloud && global.QFCloud.enabled) {
            global.QFCloud.cancelClientCall(req.id).then(function () {
              PU.toast('Pedido cancelado.', 'danger');
              global.navigate('/cliente/pedido/' + req.id, true);
            }).catch(function (err) {
              PU.toast('Não foi possível cancelar. ' + (err && err.message ? err.message : ''), 'danger');
            });
          } else {
            DB.cancelarPedido(req.id, 'cliente', 'Cancelado pelo cliente.');
            PU.toast('Pedido cancelado.', 'danger');
            global.navigate('/cliente/pedido/' + req.id, true);
          }
        });
      }
      if (act === 'aprovar-orcamento') {
        (async function () {
          try {
            if (global.QFCloud && global.QFCloud.enabled) await global.QFCloud.respondQuote(req.id, 'aceitar', '');
            else DB.aprovarOrcamento(req.id);
            PU.toast('Orçamento aprovado!', 'success');
            global.navigate('/cliente/pedido/' + req.id, true);
          } catch (err) {
            PU.toast('Não foi possível aprovar o orçamento. ' + (err && err.message ? err.message : ''), 'danger');
          }
        })();
      }
      if (act === 'recusar-orcamento') {
        PU.openSheet(
          '<h3 class="sheet__title">Orçamento acima do esperado?</h3>' +
          '<p class="text text--secondary text--sm">Você pode pedir um novo valor ao mesmo profissional ou voltar o chamado para buscar outro profissional.</p>' +
          '<textarea class="textarea" id="motivo-recusa" placeholder="Motivo opcional. Ex: valor acima do esperado"></textarea>' +
          '<div class="stack--sm" style="margin-top:14px;">' +
            '<button class="btn btn--outline" id="pedir-novo-valor">' + icon('refresh') + ' Pedir novo valor</button>' +
            '<button class="btn btn--primary" id="buscar-outro-profissional">' + icon('search') + ' Buscar outro profissional</button>' +
          '</div>'
        );

        async function processarRecusa(acao) {
          const campo = document.getElementById('motivo-recusa');
          const motivo = campo ? campo.value.trim() : '';
          PU.closeSheet();
          try {
            if (global.QFCloud && global.QFCloud.enabled) {
              await global.QFCloud.respondQuote(req.id, acao, motivo);
            } else if (acao === 'buscar_outro') {
              DB.buscarOutroProfissional(req.id, motivo);
            } else {
              DB.recusarOrcamento(req.id, motivo);
            }

            if (acao === 'buscar_outro') {
              PU.toast('Chamado voltou para a busca de outro profissional.', 'success');
            } else {
              PU.toast('Pedido de novo valor enviado ao profissional.', 'success');
            }
            global.navigate('/cliente/pedido/' + req.id, true);
          } catch (err) {
            PU.toast('Não foi possível atualizar o orçamento. ' + (err && err.message ? err.message : ''), 'danger');
          }
        }

        document.getElementById('pedir-novo-valor').addEventListener('click', function () {
          processarRecusa('recusar');
        });
        document.getElementById('buscar-outro-profissional').addEventListener('click', function () {
          processarRecusa('buscar_outro');
        });
      }
      if (act === 'enviar-avaliacao') {
        const picker = content.querySelector('#cliente-star-picker');
        const nota = Number(picker.getAttribute('data-nota') || 0);
        if (!nota) { PU.toast('Selecione uma nota de 1 a 5 estrelas.', 'danger'); return; }
        const comentario = content.querySelector('#cliente-avaliacao-comentario').value.trim();
        (async function () {
          try {
            if (global.QFCloud && global.QFCloud.enabled) await global.QFCloud.submitEvaluation(req.id, nota, comentario);
            else DB.avaliarComoCliente(req.id, nota, comentario);
            PU.toast('Obrigado pela avaliação!', 'success');
            global.navigate('/cliente/pedido/' + req.id, true);
          } catch (err) {
            PU.toast((err && err.message) || 'Não foi possível enviar a avaliação.', 'danger');
          }
        })();
      }
    });

    const picker = content.querySelector('#cliente-star-picker');
    if (picker) {
      picker.addEventListener('click', function (e) {
        const btn = e.target.closest('[data-star]');
        if (!btn) return;
        const n = Number(btn.getAttribute('data-star'));
        picker.setAttribute('data-nota', n);
        Array.prototype.forEach.call(picker.querySelectorAll('[data-star]'), function (b) {
          b.classList.toggle('is-active', Number(b.getAttribute('data-star')) <= n);
        });
      });
    }
  }

  function bindEndereco(content, user) {
    const form = content.querySelector('#endereco-form');
    global.QFGeo.bindAddressForm(form);
    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      const fd = new FormData(form);

      const cidade = fd.get('cidade').trim(); const uf = fd.get('uf');
      if (!cidade || !uf) { PU.toast('Informe cidade e UF.', 'danger'); return; }
      let localCity = DB.cities().find(function (c) { return String(c.nome).toLowerCase() === cidade.toLowerCase() && c.uf === uf; });
      if (!localCity) localCity = DB.criarCidade(cidade, uf);
      const endereco = {
        id: PU.uid('end'), rua: fd.get('rua').trim(), bairro: fd.get('bairro').trim(), cidade: cidade, uf: uf,

      };

        global.navigate('/cliente/perfil', true);
      } catch (err) { PU.toast('Não foi possível salvar o endereço. ' + ((err && err.message) || ''), 'danger'); }
    });

      const emNegociacao = req && [STATUS.AGUARDANDO_ORCAMENTO, STATUS.ORCAMENTO_ENVIADO, STATUS.ORCAMENTO_RECUSADO, STATUS.APROVADO, STATUS.EM_ANDAMENTO].indexOf(req.status) !== -1;
      return '<div class="view"><div class="empty-state"><div class="icon-tile icon-tile--ghost">' + icon(emNegociacao ? 'clock' : 'lock') + '</div><h2 class="h3">' + (emNegociacao ? 'Pedido em negociação' : 'Chamado indisponível') + '</h2><p class="text text--secondary">' + (emNegociacao ? 'Outro profissional já assumiu este pedido. Se ele voltar para a busca, o chamado poderá aparecer novamente para profissionais elegíveis.' : 'Esta oportunidade já foi assumida ou não está mais disponível.') + '</p></div></div>';
    }
    const cat = DB.categoryById(req.categoriaId);
    const cidade = DB.cityById(req.cidadeId);
    const valor = DB.leadFeeForRequest(req);
    const primeiraGratis = false;
    return (
      '<div class="view">' +
        '<div class="row-between">' +
          '<div class="row"><div class="icon-tile icon-tile--lg icon-tile--orange">' + icon(cat ? cat.icon : 'tag') + '</div><div><div class="h2">' + PU.escapeHtml(cat ? cat.nome : 'Serviço') + '</div><div class="text--sm text--secondary">Solicitado ' + PU.timeAgo(req.criadoEm) + '</div></div></div>' +
          (req.prioridade ? '<span class="badge badge--orange"><span class="badge__dot"></span>Prioritário</span>' : '') +
        '</div>' +

        '<div class="section card stack--sm">' +
          '<div class="row"><div class="avatar avatar--sm">?</div><div><div class="text--strong">Cliente verificado</div><div class="text--sm text--muted">Identidade protegida até o desbloqueio</div></div></div>' +
          '<hr class="hairline">' +
          '<div class="text--sm text--secondary">' + PU.escapeHtml(req.descricao) + '</div>' +
          (req.fotos && req.fotos.length ? '<div class="upload-row">' + req.fotos.map(renderCallMedia).join('') + '</div>' : '') +
          '<hr class="hairline">' +
          '<div class="row text--sm text--secondary">' + icon('mapPin', 'list-item__chevron') + '<span>' + PU.escapeHtml(req.endereco.bairro || 'Bairro informado') + ' — ' + PU.escapeHtml((cidade || {}).nome || '') + '</span></div>' +
          distanceHighlight(req) +
        '</div>' +

        '<div class="section card stack--sm" style="background:var(--navy-900);border:none;">' +
          '<div class="row-between"><div><div class="text--sm" style="color:var(--text-on-navy-muted);">' + (primeiraGratis ? 'Benefício de boas-vindas' : 'Taxa para desbloquear') + '</div><div class="h1" style="color:#fff;">' + (primeiraGratis ? 'GRÁTIS' : PU.formatCurrency(valor)) + '</div></div><div class="icon-tile icon-tile--orange">' + icon('unlock') + '</div></div>' +
          '<p class="text--sm" style="color:var(--text-on-navy-muted);">' +
            (primeiraGratis
              ? 'Este é o seu primeiro desbloqueio e não usa saldo. Depois dele, para abrir novos chamados, visualizar os dados do cliente e enviar orçamento, você precisará ter saldo na carteira.'
              : 'Ao desbloquear, usamos os créditos da carteira e liberamos nome, telefone/WhatsApp e endereço exato. O chamado fica reservado para você.') +
          '</p>' +
          (primeiraGratis ? '' : '<p class="text--sm qf-refund-note">' + icon('refresh') + '<span><strong>Devolução do lead:</strong> se o cliente cancelar antes de aprovar um orçamento, ou o pedido ficar 3 dias parado sem resposta, o valor volta sozinho para a sua carteira. Se ele não responder nada em 24 horas, você também pode pedir a devolução antes (até 2 pedidos por mês). ' + '<button class="qf-rules-link" type="button" data-action="regras-devolucao">Ver regras de devolução</button>' + '</span></p>') +
          '<div class="row-between"><span class="text--sm" style="color:var(--text-on-navy-muted);">Seus créditos</span><span class="text--strong" style="color:#fff;">' + PU.formatCurrency(user.creditos || 0) + '</span></div>' +
        '</div>' +

        '<div class="section btn-row">' +
          '<button class="btn btn--outline" data-action="recusar-chamada">Agora não</button>' +
          '<button class="btn btn--primary" data-action="desbloquear-chamada">' + icon('unlock') + ' ' + (primeiraGratis ? 'Desbloquear grátis' : 'Desbloquear ' + PU.formatCurrency(valor)) + '</button>' +
        '</div>' +
      '</div>'
    );
  };

  // ---------------- Meus serviços ----------------

  const ATIVOS_PROF = [STATUS.AGUARDANDO_ORCAMENTO, STATUS.ORCAMENTO_ENVIADO, STATUS.ORCAMENTO_RECUSADO, STATUS.APROVADO, STATUS.EM_ANDAMENTO, STATUS.SERVICO_CONCLUIDO, STATUS.PAGO];
  function profHiddenHistory(userId) {
    try { return JSON.parse(localStorage.getItem('quemfaz_hidden_history_v1_profissional_' + userId) || '[]') || []; } catch (_) { return []; }
  }
  function hideProfHistory(userId, requestId) {
    const ids = profHiddenHistory(userId);
    if (ids.indexOf(requestId) === -1) ids.push(requestId);
    try { localStorage.setItem('quemfaz_hidden_history_v1_profissional_' + userId, JSON.stringify(ids.slice(-250))); } catch (_) {}
  }

  Screens.profServicosRender = function (params, user) {
    const hidden = profHiddenHistory(user.id);
    const all = DB.requestsByProfissional(user.id);
    const ativos = all.filter(function (r) { return ATIVOS_PROF.indexOf(r.status) !== -1; });
    const historico = all.filter(function (r) { return ATIVOS_PROF.indexOf(r.status) === -1 && hidden.indexOf(r.id) === -1; });
    if (!ativos.length && !historico.length) {
      return '<div class="view"><div class="empty-state"><div class="icon-tile icon-tile--lg icon-tile--ghost">' + icon('clipboard') + '</div><h2 class="h3">Nenhum serviço ainda</h2><p class="text text--secondary">Fique online para começar a receber chamados de clientes.</p></div></div>';
    }
    return (
      '<div class="view">' +
        (ativos.length ? '<div class="section"><div class="section-head"><h2 class="h3">Em andamento</h2></div><div class="stack--sm">' + ativos.map(servicoCard).join('') + '</div></div>' : '') +
        (historico.length ? '<div class="section"><div class="section-head"><h2 class="h3">Histórico</h2></div><div class="stack--sm">' + historico.map(function (r) {
          return '<div class="history-entry">' + servicoCard(r) +
            '<button class="history-delete" type="button" data-hide-servico="' + PU.escapeHtml(r.id) + '" aria-label="Excluir serviço do histórico" title="Excluir do histórico">' + icon('xCircle') + '</button></div>';
        }).join('') + '</div></div>' : '') +
      '</div>'
    );
  };

  function servicoCard(req) {
    const cat = DB.categoryById(req.categoriaId);
    const cliente = DB.clienteById(req.clienteId);
    return (
      '<button class="card card--pressable" style="width:100%;text-align:left;" data-nav="/profissional/pedido/' + req.id + '">' +
        '<div class="row-between">' +
          '<div class="row"><div class="icon-tile">' + icon(cat ? cat.icon : 'tag') + '</div>' +
          '<div><div class="h3">' + PU.escapeHtml(cat ? cat.nome : 'Serviço') + '</div><div class="text--sm text--secondary">' + PU.escapeHtml((cliente || {}).nome || '') + '</div></div></div>' +
          icon('chevronRight', 'list-item__chevron') +
        '</div>' +
        '<div class="row-between" style="margin-top:12px;">' + statusBadge(req.status) + '<span class="text--sm text--muted">' + PU.timeAgo(req.criadoEm) + '</span></div>' +
      '</button>'
    );
  }

  Screens.profPedidoDetalheRender = function (params, user) {
    const req = DB.requestById(params.id);
    if (!req || req.profissionalId !== user.id) return '<div class="view"><p class="text">Serviço não encontrado.</p></div>';
    const cat = DB.categoryById(req.categoriaId);
    const cliente = DB.clienteById(req.clienteId);
    return (
      '<div class="view">' +
        '<div class="row-between">' +
          '<div class="row"><div class="icon-tile">' + icon(cat ? cat.icon : 'tag') + '</div><div class="h3">' + PU.escapeHtml(cat ? cat.nome : 'Serviço') + '</div></div>' +
          statusBadge(req.status) +
        '</div>' +

        '<div class="section card stack--sm">' +
          '<div class="row-between"><div class="row"><div class="avatar avatar--sm">' + PU.initials((cliente || {}).nome || '?') + '</div><div><div class="text--strong">' + PU.escapeHtml((cliente || {}).nome || '') + '</div><div class="text--sm text--secondary">Contato liberado</div></div></div><span class="badge badge--success"><span class="badge__dot"></span>Desbloqueado</span></div>' +
          '<div class="row text--sm text--secondary">' + icon('phoneCall', 'list-item__chevron') + ((cliente || {}).telefone ? '<a href="' + telHref(cliente.telefone) + '">' + PU.escapeHtml(cliente.telefone) + '</a>' : '<span>Telefone não informado</span>') + '</div>' +
          ((cliente || {}).telefone ? '<a class="btn btn--whatsapp btn--lg" data-contact="whatsapp" href="' + whatsappHref(cliente.telefone, 'Olá ' + (cliente.nome || '') + ', sou ' + user.nome + ' do QuemFaz. Desbloqueei seu chamado e estou entrando em contato sobre o serviço.') + '" target="_blank" rel="noopener">' + icon('whatsapp') + ' Chamar no WhatsApp</a>' +
            '<a class="btn btn--outline" data-contact="ligar" href="' + telHref(cliente.telefone) + '">' + icon('phoneCall') + ' Ligar para o cliente</a>' : '') +
          '<div class="text--sm text--secondary">' + PU.escapeHtml(req.descricao) + '</div>' +
          (req.fotos && req.fotos.length ? '<div class="upload-row">' + req.fotos.map(renderCallMedia).join('') + '</div>' : '') +
          '<div class="row text--sm text--secondary">' + icon('mapPin', 'list-item__chevron') + '<span>' + PU.escapeHtml(req.endereco.rua) + ', ' + PU.escapeHtml(req.endereco.bairro) + (req.endereco.complemento ? ' · ' + PU.escapeHtml(req.endereco.complemento) : '') + '</span></div>' +
        '</div>' +

        (req.orcamento ? orcamentoResumo(req) : '') +
        acoesPorStatus(req) +
      '</div>'
    );
  };

  function orcamentoResumo(req) {
    const o = req.orcamento;
    return (
      '<div class="section">' +
        '<div class="section-head"><h2 class="h3">Orçamento enviado</h2></div>' +
        '<div class="card stack--sm">' +
          (req.taxaVisita ? rowValor('Taxa de visita', req.taxaVisita) : '') +
          rowValor('Mão de obra', o.maoDeObra) +
          rowValor('Material', o.material) +
          '<hr class="hairline">' +
          rowValor('Total', o.total + (req.taxaVisita || 0), true) +
          (o.status === 'recusado' && o.motivoRecusa ? '<p class="text--sm" style="color:var(--danger-600);margin-top:4px;">Motivo da recusa: ' + PU.escapeHtml(o.motivoRecusa) + '</p>' : '') +
        '</div>' +
      '</div>'
    );
  }
  function rowValor(label, cents, strong) {
    return '<div class="row-between"><span class="text' + (strong ? ' text--strong' : ' text--secondary text--sm') + '">' + label + '</span><span class="text' + (strong ? ' h3' : ' text--sm') + '">' + PU.formatCurrency(cents) + '</span></div>';
  }

  function acoesPorStatus(req) {
    const s = req.status;
    if (s === STATUS.AGUARDANDO_ORCAMENTO) {
      return '<div class="section"><button class="btn btn--primary" data-nav="/profissional/orcamento/' + req.id + '">' + icon('document') + ' Criar orçamento</button></div>';
    }
    if (s === STATUS.ORCAMENTO_ENVIADO) {
      return '<div class="section"><div class="card card--tight" style="background:var(--navy-100);border:none;"><p class="text text--sm" style="color:var(--navy-800);">Aguardando aprovação do cliente.</p></div></div>';
    }
    if (s === STATUS.ORCAMENTO_RECUSADO) {
      return '<div class="section stack--sm">' +
        '<button class="btn btn--primary" data-nav="/profissional/orcamento/' + req.id + '">' + icon('edit') + ' Enviar novo orçamento</button>' +
        '<button class="btn btn--danger-ghost" data-action="cancelar-servico">Cancelar serviço</button>' +
      '</div>';
    }
    if (s === STATUS.APROVADO) {
      return '<div class="section"><button class="btn btn--primary" data-action="iniciar-servico">' + icon('checkCircle') + ' Iniciar serviço</button></div>';
    }
    if (s === STATUS.EM_ANDAMENTO) {
      return '<div class="section"><button class="btn btn--primary" data-action="finalizar-servico">' + icon('check') + ' Concluir serviço</button></div>';
    }
    if (s === STATUS.SERVICO_CONCLUIDO || s === STATUS.PAGO) {
      return (
        '<div class="section"><div class="card card--tight" style="background:var(--success-100);border:none;margin-bottom:12px;"><p class="text text--sm" style="color:var(--success-600);">Serviço marcado como concluído. O pagamento do serviço é combinado diretamente com o cliente.</p></div></div>' +
        '<div class="section">' +
          '<div class="section-head"><h2 class="h3">Avalie o cliente</h2></div>' +
          '<div class="card stack">' +
            '<div class="star-picker" id="prof-star-picker">' + [1, 2, 3, 4, 5].map(function (n) { return '<button type="button" data-star="' + n + '">' + icon('starFilled') + '</button>'; }).join('') + '</div>' +
            '<textarea class="textarea" id="prof-avaliacao-comentario" placeholder="Como foi atender este cliente? (opcional)"></textarea>' +
            '<button class="btn btn--primary" data-action="enviar-avaliacao-cliente">Enviar avaliação</button>' +
          '</div>' +
        '</div>'
      );
    }
    if (s === STATUS.FINALIZADO) {
      return '<div class="section"><div class="card card--tight" style="background:var(--success-100);border:none;"><p class="text text--sm" style="color:var(--success-600);">Serviço concluído e avaliado.</p></div></div>';
    }
    if (s === STATUS.CANCELADO) {
      return '<div class="section"><div class="card card--tight" style="background:var(--danger-100);border:none;"><p class="text text--sm" style="color:var(--danger-600);">' + PU.escapeHtml(req.motivoCancelamento || 'Serviço cancelado.') + '</p></div></div>';
    }
    return '';
  }

  Screens.profOrcamentoFormRender = function (params, user) {
    const req = DB.requestById(params.id);
    if (!req) return '<div class="view"><p class="text">Serviço não encontrado.</p></div>';
    return (
      '<div class="view">' +
        '<form id="orcamento-form" class="stack" novalidate>' +
          '<label class="field"><span class="field__label">Taxa de visita</span><input class="input" name="taxaVisita" inputmode="decimal" value="' + (req.taxaVisita ? (req.taxaVisita / 100).toFixed(2).replace('.', ',') : '') + '" placeholder="R$ 0,00"></label>' +
          '<label class="field"><span class="field__label">Mão de obra</span><input class="input" name="maoDeObra" inputmode="decimal" required placeholder="R$ 0,00" value="' + (req.orcamento ? (req.orcamento.maoDeObra / 100).toFixed(2).replace('.', ',') : '') + '"></label>' +
          '<label class="field"><span class="field__label">Material</span><input class="input" name="material" inputmode="decimal" placeholder="R$ 0,00" value="' + (req.orcamento ? (req.orcamento.material / 100).toFixed(2).replace('.', ',') : '') + '"></label>' +
          '<div class="card row-between" style="background:var(--navy-100);border:none;">' +            '<span class="text--strong" style="color:var(--navy-900);">Total</span>' +
            '<span class="h2" id="orcamento-total" style="color:var(--navy-900);">R$ 0,00</span>' +
          '</div>' +
          '<button class="btn btn--primary" type="submit">' + icon('arrowRight') + ' Enviar orçamento ao cliente</button>' +
        '</form>' +
      '</div>'
    );
  };

  // ---------------- Carteira ----------------

            '<div><div class="text--sm" style="color:var(--text-on-navy-muted);">Saldo disponível</div><div class="h1" style="color:#fff;margin-top:4px;">' + PU.formatCurrency(user.creditos || 0) + '</div></div>' +
            '<div class="icon-tile icon-tile--orange">' + icon('wallet') + '</div>' +
          '</div>' +
        '</div>' +

        '<div class="section">' +
          '<div class="section-head"><h2 class="h3">Adicionar créditos</h2></div>' +
          '<div class="card stack">' +
            '<div><div class="field__label">Escolha o valor</div>' +
              '<div class="chip-group" id="wallet-values" style="margin-top:8px;">' +
                '<button type="button" class="chip" data-wallet-value="2000">R$ 20</button>' +

                walletMethodButton('pix', 'bolt', 'Pix', 'Saldo após a confirmação', true) +
                walletMethodButton('cartao', 'creditCard', 'Cartão de crédito', 'Página segura Efí · saldo após aprovação', false) +
                walletMethodButton('boleto', 'document', 'Boleto', 'Saldo somente após compensação', false) +
              '</div>' +

          '</div>' +
        '</div>' +

        '<div class="section">' +
          '<div class="section-head"><h2 class="h3">Como funciona</h2></div>' +
          '<div class="card" style="padding:4px 16px;">' +
            walletInfoRow('money', 'R$ 25 de bônus de lançamento', 'Todo novo profissional começa com R$ 25,00 em créditos. Cada chamado desbloqueado desconta o valor correspondente da carteira.') +
            walletInfoRow('phoneCall', 'Contato e orçamento liberados', 'Depois do desbloqueio, você visualiza os dados do cliente e pode enviar o orçamento do serviço.') +
            walletInfoRow('money', 'Serviço é combinado à parte', 'Cliente e profissional escolhem como pagar o serviço. O QuemFaz já recebeu pelo lead.') +
            walletInfoRow('refresh', 'Devolução do lead', 'Se o cliente cancelar o pedido antes de aprovar um orçamento, ou o pedido ficar 3 dias parado sem resposta, o valor do desbloqueio volta sozinho para a carteira. Se ele não responder nada em 24 horas e você não quiser esperar, abra o serviço em Meus serviços e toque em "Pedir devolução" (até 2 pedidos a cada 30 dias).') +

        '<div class="section">' +
          '<div class="section-head"><h2 class="h3">Movimentações</h2></div>' +
          (txs.length
            ? '<div class="card" style="padding:4px 16px;">' + txs.map(function (t) {
                const debit = t.tipo === 'debito';
                const bonusTx = t.tipo === 'bonus';
                const pending = t.tipo === 'recarga_pendente' || t.status === 'pendente';
                const failed = t.status === 'cancelado' || t.status === 'expirado' || t.status === 'estornado';
                const positive = t.tipo === 'recarga' || t.tipo === 'credito' || t.tipo === 'estorno';
                const valueText = bonusTx ? 'GRÁTIS' : (debit ? '−' : (positive ? '+' : '')) + PU.formatCurrency(t.valor || 0);
                const valueColor = debit || failed ? 'var(--danger-600)' : (pending ? 'var(--warning-600)' : 'var(--success-600)');
                const statusText = pending ? ' · aguardando pagamento' : (failed ? ' · ' + t.status : '');

        '</div>' +
      '</div>'
    );

  // ---------------- Perfil profissional ----------------

    const cidade = DB.cityById(user.cidadeId);
    const cats = DB.categories();
    const docs = user.documentos || {};
    return (
      '<div class="view stack">' +
        '<div class="card row">' +
          personAvatar(user, 'avatar--lg') +
          '<div class="spacer">' +
            '<div class="h3">' + PU.escapeHtml(user.nome) + '</div>' +
            '<div class="text--sm text--secondary">' + PU.escapeHtml(user.email) + '</div>' +
            '<div style="margin-top:6px;">' + ((global.QFCloud && global.QFCloud.enabled) ? (user.verificado ? '<span class="badge badge--success"><span class="badge__dot"></span>Verificado</span>' : '<span class="badge badge--navy"><span class="badge__dot"></span>Conta ativa</span>') : aprovacaoBadge(user.statusAprovacao)) + '</div>' +
          '</div>' +

  function ufOptions(selected) {
    const ufs = ['AC','AL','AP','AM','BA','CE','DF','ES','GO','MA','MT','MS','MG','PA','PB','PR','PE','PI','RJ','RN','RS','RO','RR','SC','SP','SE','TO'];
    return '<option value="">UF</option>' + ufs.map(function (uf) { return '<option value="' + uf + '"' + (uf === selected ? ' selected' : '') + '>' + uf + '</option>'; }).join('');
  }

  function renderServiceAreaRow(area, index) {
    area = area || {};
    const raio = Math.max(1, Math.min(200, Number(area.raioKm || 10)));
    return '<div class="service-area-row card card--tight stack--sm" data-area-row style="background:var(--bg-sunken);border:none;margin-bottom:10px;">' +
      '<div class="row"><div class="text--strong spacer">Região ' + (index + 1) + '</div>' + (index ? '<button class="icon-btn" type="button" data-remove-area aria-label="Remover cidade">' + icon('x') + '</button>' : '') + '</div>' +
      '<label class="field"><span class="field__label">Cidade</span><input class="input" data-area-city required value="' + PU.escapeHtml(area.cidade || '') + '" placeholder="Ex.: Campinas"></label>' +
      '<label class="field"><span class="field__label">Estado</span><select class="select" data-area-uf>' + ufOptions(String(area.uf || '').toUpperCase()) + '</select></label>' +
      '<label class="field"><span class="field__label">Raio: <strong data-area-radius-label>' + raio + '</strong> km</span><input class="input" type="range" min="1" max="200" step="1" value="' + raio + '" data-area-radius></label>' +
    '</div>';
  }

  function renderServiceAreas(areas) {
    return (areas && areas.length ? areas : [{ cidade: '', uf: '', raioKm: 10 }]).map(renderServiceAreaRow).join('');
  }

  function documentoItem(key, label, enviado) {
    return (
      '<div class="list-item">' +
        '<div class="icon-tile icon-tile--ghost">' + icon('id') + '</div>' +
        '<div class="list-item__body"><div class="list-item__title">' + label + '</div><div class="list-item__sub">' + (enviado ? 'Enviado' : 'Pendente de envio') + '</div></div>' +
        (enviado
          ? '<span class="badge badge--success"><span class="badge__dot"></span>OK</span>'
          : '<button class="btn btn--sm btn--outline btn--block-auto" data-doc="' + key + '">Enviar</button>') +
      '</div>'
    );
  }

    const revs = DB.reviewsForProfissional(user.id);
    return (
      '<div class="view">' +
        (revs.length ? '<div class="stack--sm">' + revs.map(function (r) {
          return '<div class="card stack--sm">' + starsDisplay(r.nota) + (r.comentario ? '<p class="text text--sm">' + PU.escapeHtml(r.comentario) + '</p>' : '') + '<span class="text--sm text--muted">' + PU.formatDate(r.criadoEm) + '</span></div>';
        }).join('') + '</div>'
          : '<div class="empty-state"><div class="icon-tile icon-tile--ghost">' + icon('star') + '</div><p class="text text--secondary">Nenhuma avaliação recebida ainda.</p></div>') +

    );
