  function bindSchedule(content) {
    const box = content.querySelector('[data-qf-schedule]');
    if (!box) return;
    const hidden = box.querySelector('[data-qf-data-preferida]');
    const customWrap = box.querySelector('[data-qf-custom-wrap]');
    const custom = box.querySelector('[data-qf-custom-exec]');
    const buttons = Array.prototype.slice.call(box.querySelectorAll('[data-qf-exec]'));
    function set(mode) {
      buttons.forEach(function (b) { b.classList.toggle('is-active', b.getAttribute('data-qf-exec')===mode); });
      let d = new Date();
      if (mode==='today') {
        hidden.value = d.toISOString();
        customWrap.hidden = true;
      } else if (mode==='tomorrow') {
        d.setDate(d.getDate()+1); d.setHours(9,0,0,0);
        hidden.value = d.toISOString(); customWrap.hidden = true;
      } else {
        d.setDate(d.getDate()+(mode==='week'?3:2)); d.setHours(9,0,0,0);
        if (!custom.value) custom.value = localInputValue(d);
        customWrap.hidden = false;
        const x = new Date(custom.value);
        hidden.value = isNaN(x.getTime()) ? '' : x.toISOString();
      }
    }
    buttons.forEach(function (b) { b.addEventListener('click', function () { set(b.getAttribute('data-qf-exec')); }); });
    custom.addEventListener('change', function () {
      const d = new Date(custom.value);
      hidden.value = isNaN(d.getTime()) ? '' : d.toISOString();
    });
    set('today');
  }

  function bindPortfolio(content) {
    const root = content.querySelector('#chamados-disponiveis');
    if (!root) return;
    const period = root.querySelector('[data-qf-portfolio-period]');
    const search = root.querySelector('[data-qf-portfolio-search]');
    const cards = Array.prototype.slice.call(root.querySelectorAll('[data-qf-portfolio-card]'));
    function apply() {
      const q = String(search && search.value || '').trim().toLowerCase();
      const p = period ? period.value : 'all';
      const now = new Date();
      const tomorrow = new Date(now); tomorrow.setDate(now.getDate()+1);
      const limit7 = new Date(now); limit7.setDate(now.getDate()+7);
      cards.forEach(function (card) {
        const txt = (card.textContent || '').toLowerCase();
        const raw = card.getAttribute('data-qf-execucao') || '';
        const d = raw ? new Date(raw) : null;
        // V11.29: "sem pressa" não entra em Hoje; pedido com o dia já vencido continua aparecendo em Hoje e em 7 dias.
        const semPressa = card.hasAttribute('data-qf-sem-pressa');
        const vencido = !!d && d < now && !sameDay(d,now);
        let dateOk = true;
        if (p==='today') dateOk = d ? (sameDay(d,now) || vencido) : !semPressa;
        else if (p==='tomorrow') dateOk = !!d && sameDay(d,tomorrow);
        else if (p==='7d') dateOk = !d || vencido || (d>=now && d<=limit7) || sameDay(d,now);
        card.style.display = ((!q || txt.indexOf(q)!==-1) && dateOk) ? '' : 'none';
      });
    }
    if (period) period.addEventListener('change',apply);
    if (search) search.addEventListener('input',apply);
  }

  // V11.28: até 3 profissionais podem desbloquear o pedido; o cliente vê um cartão para cada um.
  function renderConversationCards(rows, req) {

        '<div class="text--sm text--secondary">' + (r.profissional_cidade ? esc(r.profissional_cidade + (r.profissional_uf ? '/' + r.profissional_uf : '')) : 'Profissional verificado') + '</div></div></div>' +
        (r.nao_lidas ? '<span class="badge badge--orange">' + Number(r.nao_lidas) + ' nova</span>' : '') + '</div>' +
        last +
        (r.tem_proposta ? '<div class="text--sm" style="color:var(--orange-700);margin-top:6px;font-weight:700;">Proposta disponível (opcional)</div>' : '') +
        '<div class="btn-row" style="margin-top:10px;"><button class="btn btn--outline" data-nav="/cliente/chat/' + esc(req.id) + '/' + esc(r.profissional_id) + '">' + icon('message') + ' Conversar</button>' +
        (escolhido ? '' : '<button class="btn btn--primary" type="button" data-qf-choose-prof="' + esc(r.profissional_id) + '" data-qf-prof-name="' + esc(r.profissional_nome || 'profissional') + '">Fechei com este</button>') +
        '</div>' +
      '</div>';
    }
    return '<div class="card qf-client-decision">' +
        '<div class="text--strong">' + (escolhido ? 'Serviço confirmado' : (n === 1 ? 'Um profissional desbloqueou seu pedido' : n + ' profissionais desbloquearam seu pedido')) + '</div>' +
        '<div class="text--sm text--secondary" style="margin-top:4px;">' + (escolhido ? 'Você escolheu este profissional. Continue combinando os detalhes pelo chat.' : 'Até 3 profissionais podem desbloquear seu pedido e chamar você no WhatsApp. Converse, compare e toque em “Fechei com este” no profissional que você escolher.') + '</div>' +
      '</div>' +
      '<div class="section-head" style="margin-top:14px;"><h2 class="h3">' + (escolhido || n === 1 ? 'Profissional em conversa' : 'Profissionais em conversa') + '</h2>' + (escolhido ? '<span class="badge badge--success">Escolhido</span>' : '<span class="badge badge--orange">' + n + ' de 3</span>') + '</div>' +
      (escolhido ? [escolhido] : rows).map(cartao).join('');
  }

  const conversationCache = new Map();
  async function fillClientConversations(content, params) {
    const slot = content.querySelector('[data-qf-client-conversations]');
    const req = DB.requestById(params.id);
    if (!slot || !req || !Cloud || !Cloud.clientConversations) return;
    const key = req.clienteId + ':' + req.id;
    function paint(rows) {
      const html = renderConversationCards(rows, DB.requestById(params.id) || req);
      if (slot.qfMarkup !== html) { slot.innerHTML = html; slot.qfMarkup = html; }
    }
    if (conversationCache.has(key)) paint(conversationCache.get(key));
    if (slot.qfLoading) return;
    slot.qfLoading = true;
    try {
      const rows = await Cloud.clientConversations(req.id);
      if (!document.body.contains(slot)) return;
      conversationCache.set(key, rows);
      paint(rows);
    } catch (e) {
      if (!conversationCache.has(key) && !slot.innerHTML) slot.innerHTML = '<div class="card text--sm text--secondary">Não foi possível carregar as conversas agora.</div>';
    } finally { slot.qfLoading = false; }
  }

  function renderChatRows(rows,userId) {
    if (!rows.length) return '<div class="text--sm text--secondary" style="text-align:center;padding:24px 8px;">A conversa começa aqui.</div>';
    return rows.map(function (r) {
      if (r.tipo==='sistema') return '<div class="qf-chat-bubble is-system">' + esc(r.mensagem) + '</div>';
      const mine = String(r.remetente_id)===String(userId);
      return '<div class="qf-chat-bubble' + (mine?' is-me':'') + '"><div>' + esc(r.mensagem).replace(/\n/g,'<br>') + '</div><small>' + new Date(r.criado_em).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}) + '</small></div>';
    }).join('');
  }

  // V11.16.33: chat ao vivo — só redesenha quando muda e toca quando chega mensagem do outro.
  function chatRowsKey(rows) { return rows.length + ':' + (rows.length ? rows[rows.length - 1].id : ''); }
  function chatIncoming(seen, rows, userId) {
    let n = 0;
    rows.forEach(function (r) {
      const id = String(r.id);
      if (seen.has(id)) return;
      seen.add(id);
      if (String(r.remetente_id) !== String(userId)) n++;
    });
    return n;
  }
  global.QFChatLive = { rowsKey: chatRowsKey, incoming: chatIncoming };

  function bindChat(content, params, user, role) {
    const root = content.querySelector('[data-qf-chat-root]');
    if (!root || !Cloud || !Cloud.chatConversation) return;
    const list = root.querySelector('[data-qf-chat-list]');
    const form = root.querySelector('[data-qf-chat-form]');
    const input = root.querySelector('[data-qf-chat-input]');
    const profId = role==='profissional' ? user.id : params.profId;
    const req = DB.requestById(params.id);
    let loading = false, again = false, ready = false, titled = false, lastKey = null, closed = false;
    const seen = new Set();

    // A caixa de digitar fica presa embaixo: a última mensagem tem que parar logo acima dela.
    function nearEnd() {
      try {
        const last = list.lastElementChild;
        return !last || last.getBoundingClientRect().bottom <= form.getBoundingClientRect().top + 140;
      } catch (_) { return true; }
    }
    function scrollToEnd() {
      try {
        const last = list.lastElementChild;
        if (!last) return;
        last.style.scrollMarginBottom = (form.offsetHeight + 12) + 'px';
        last.scrollIntoView({ block:'end' });
      } catch (_) {}
    }
    function chime() {
      try { PU.playNotificationSound(false); } catch (_) {}
      try { if (navigator.vibrate) navigator.vibrate(70); } catch (_) {}
    }

    if (role === 'profissional') {
      let justUnlocked = false;
      try {
        justUnlocked = sessionStorage.getItem('qf_chat_unlocked_notice') === String(params.id);
        if (justUnlocked) sessionStorage.removeItem('qf_chat_unlocked_notice');
      } catch (_) {}
      if (justUnlocked) {
        setTimeout(function () {
          const waCard = root.querySelector('[data-qf-wa-card]');
          if (waCard) {
            PU.toast('Chamado desbloqueado. Toque no botão verde para chamar o cliente no WhatsApp.', 'success', 6000);
            try { waCard.scrollIntoView({ behavior:'smooth', block:'center' }); } catch (_) {}
            return;
          }
          PU.toast('Chat liberado para negociação. Envie sua primeira mensagem ao cliente.', 'success', 5000);
          if (input) {
            try { input.scrollIntoView({ behavior:'smooth', block:'center' }); } catch (_) {}
            try { input.focus({ preventScroll:true }); } catch (_) { try { input.focus(); } catch (_) {} }
          }
        }, 350);
      }
    }

    async function load(first) {
      if (closed || !document.body.contains(root)) return;
      if (loading) { again = true; return; }
      loading = true;
      try {
        const rows = await Cloud.chatConversation(params.id, role==='profissional' ? null : profId);
        if (closed) return;
        const key = chatRowsKey(rows);
        if (key !== lastKey) {
          const stick = !ready || nearEnd();
          const incoming = chatIncoming(seen, rows, user.id);
          list.innerHTML = renderChatRows(rows,user.id);
          lastKey = key;
          if (stick || !incoming) scrollToEnd();
          if (ready && incoming && !document.hidden) chime();
        }
        ready = true;
        if (first && role==='profissional' && !rows.length && input && !input.value) {
          const cli = req ? DB.clienteById(req.clienteId) : null;
          input.value = 'Olá' + (cli && cli.nome ? ', ' + firstName(cli.nome) : '') + '! Sou ' + (user.nome || 'profissional') + ', profissional pelo QuemFaz. Vi seu pedido e estou disponível. Podemos conversar por aqui para combinar valor, horário e os detalhes do serviço.';
        }
        if (role==='cliente' && !titled) {
          try {
            const rowsP = await Cloud.clientConversations(params.id);
            const p = rowsP.find(function (x) { return String(x.profissional_id)===String(profId); });
            const title = root.querySelector('[data-qf-chat-title]');
            if (title && p) { title.textContent = 'Conversa com ' + (p.profissional_nome || 'profissional'); titled = true; }
          } catch (_) {}
        }
      } catch (err) {
        // Falha passageira não apaga a conversa que já está na tela.
        if (!ready) list.innerHTML = '<div class="text--sm text--secondary" style="text-align:center;padding:20px;">Não foi possível carregar a conversa.</div>';
      } finally {
        loading = false;
        if (again) { again = false; load(false); }
      }
    }

    // Canal ao vivo: quem envia dá um sinal e o outro lado atualiza na hora (a conferência a cada 2 s fica de reserva).
    let channel = null;
    try {
      if (Cloud.client && Cloud.client.channel) {
        channel = Cloud.client.channel('qf-chat-' + params.id + '-' + profId, { config: { broadcast: { self: false } } });
        channel.on('broadcast', { event: 'msg' }, function () { load(false); }).subscribe();
      }
    } catch (_) { channel = null; }
    function signal() {
      try {
        if (!channel) return;
        const q = channel.send({ type:'broadcast', event:'msg', payload:{} });
        if (q && q.catch) q.catch(function () {});
      } catch (_) {}
    }
    function leave() {
      if (Cloud.chatLeave) Cloud.chatLeave(params.id, profId);
    }
    function onVisibility() {
      if (document.hidden) leave(); else load(false);
    }
    function onRefresh() { load(false); }
    document.addEventListener('visibilitychange', onVisibility);
    global.addEventListener('qf-chat-refresh', onRefresh);
    function close() {
      if (closed) return;
      closed = true;
      clearInterval(timer);
      document.removeEventListener('visibilitychange', onVisibility);
      global.removeEventListener('qf-chat-refresh', onRefresh);
      try { if (channel && Cloud.client.removeChannel) Cloud.client.removeChannel(channel); } catch (_) {}
      leave();
    }

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      const msg = String(input.value || '').trim();
      if (!msg) return;
      const btn = form.querySelector('button[type="submit"]');
      btn.disabled = true;
      try {
        await Cloud.sendChatMessage(params.id, role==='profissional' ? null : profId, msg);
        input.value = '';
        signal();
        await load(false);
        scrollToEnd();
      } catch (err) {
        PU.toast('Não foi possível enviar. ' + ((err && err.message) || ''), 'danger');
      } finally { btn.disabled = false; }
    });

  function bindCalculadora(content) {

    if (!body) return;
    const st = { serv: null, i1: null };
    function passo() { return st.serv === null ? 1 : (st.i1 === null ? 2 : 3); }

      const n = passo();

<script>

(function (global) {
  const DB = global.DB, PU = global.PU, icon = global.icon;
  const Screens = (global.Screens = global.Screens || {});

  const QF_BRAND_MARK = global.QF_BRAND_MARK = '<span class="qf-brandmark qf-brandmark--services" aria-hidden="true"><svg viewBox="0 0 64 68" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="qfRoof" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#04a9f4"/><stop offset="1" stop-color="#003c9e"/></linearGradient><linearGradient id="qfPin" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffb100"/><stop offset="1" stop-color="#ff6500"/></linearGradient></defs><path d="M9 28 32 7l23 21v19H9Z" fill="#073c9d"/><path d="M5 29 32 5l27 24" fill="none" stroke="url(#qfRoof)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M23 26c0-7 18-7 18 0v3H23Z" fill="#ff9c00"/><circle cx="32" cy="32" r="6" fill="#06458e"/><path d="M20 47c1-14 23-14 24 0" fill="#06458e"/><path d="M32 62c-4-6-13-14-13-23a13 13 0 0 1 26 0c0 9-9 17-13 23Z" fill="url(#qfPin)"/><circle cx="32" cy="39" r="5.5" fill="#fff"/></svg></span>';

  const TABS = {
    cliente: [
      { id: 'home', label: 'Início', icon: 'home', route: '/cliente/home' },
      { id: 'pedidos', label: 'Pedidos', icon: 'clipboard', route: '/cliente/pedidos' },
      { id: 'avisos', label: 'Avisos', icon: 'bell', route: '/cliente/avisos' },
      { id: 'perfil', label: 'Perfil', icon: 'user', route: '/cliente/perfil' },
    ],
    profissional: [
      // V11.16.20: quatro destinos principais no celular. Avisos ficam no sino do topo.
      { id: 'home', label: 'Início', icon: 'home', route: '/profissional/home' },
      { id: 'servicos', label: 'Pedidos', icon: 'clipboard', route: '/profissional/servicos' },
      { id: 'carteira', label: 'Carteira', icon: 'wallet', route: '/profissional/carteira' },
      { id: 'perfil', label: 'Perfil', icon: 'user', route: '/profissional/perfil' },
    ],
  };

  const NOTICE_PREFIX = 'quemfaz_notices_v1_';

  function noticeKey(session) {
    return NOTICE_PREFIX + (session ? session.role + '_' + session.userId : 'anon');
  }
  function loadNotices(session) {
    if (!session) return [];
    try { return JSON.parse(localStorage.getItem(noticeKey(session)) || '[]') || []; }
    catch (e) { return []; }
  }
  function saveNotices(session, items) {
    if (!session) return;
    try { localStorage.setItem(noticeKey(session), JSON.stringify((items || []).slice(0, 50))); } catch (e) {}
  }
  function unreadNotices(session) {
    return loadNotices(session).filter(function (n) { return !n.read; }).length;
  }
  function markNoticesRead(session) {
    const items = loadNotices(session);
    let changed = false;
    items.forEach(function (n) { if (!n.read) { n.read = true; changed = true; } });
    if (changed) saveNotices(session, items);
  }
  let noticeBatch = null; // V10.2: agrupa vários avisos simultâneos num único toast/som
  function pushNotice(session, eventKey, title, body, route, strong) {
    if (!session) return;
    const items = loadNotices(session);
    if (items.some(function (n) { return n.eventKey === eventKey; })) return;
    if (noticeBatch) {
      items.unshift({ id: PU.uid('notice'), eventKey: eventKey, title: title, body: body || '', route: route || '', createdAt: new Date().toISOString(), read: false });
      saveNotices(session, items);
      noticeBatch.push({ title: title, body: body, strong: strong });
      return;
    }
    items.unshift({
      id: PU.uid('notice'), eventKey: eventKey, title: title, body: body || '', route: route || '',
      createdAt: new Date().toISOString(), read: false
    });
    saveNotices(session, items);
    const pushJustRang = PU.pushSoundRecent();
    if (!pushJustRang) PU.playNotificationSound(!!strong);
    PU.toast(title + (body ? ' — ' + body : ''), 'success');
    if (!pushJustRang) PU.browserNotification(title, body || 'Abra o QuemFaz para ver os detalhes.');
  }
  async function syncPersistentProfessionalNotices(session, alertNew) {
    if (!session || session.role !== 'profissional') return false;
    if (!(global.QFCloud && global.QFCloud.enabled && global.QFCloud.professionalNotices)) return false;
    const rows = await global.QFCloud.professionalNotices();
    const current = loadNotices(session);
    const existing = Object.create(null);
    current.forEach(function (n) { existing[n.eventKey] = true; });
    const fresh = [];
    (rows || []).forEach(function (r) {
      const eventKey = 'server_notice:' + r.id;
      if (existing[eventKey]) return;
      fresh.push({
        id: PU.uid('notice'),
        serverId: r.id,
        eventKey: eventKey,
        title: r.titulo || 'Aviso',
        body: r.corpo || '',
        route: r.rota || '',
        createdAt: r.criado_em || new Date().toISOString(),
        read: false
      });
    });
    if (!fresh.length) return false;
    saveNotices(session, fresh.concat(current));
    if (alertNew) {
      const title = fresh.length === 1 ? fresh[0].title : fresh.length + ' novas atualizações';
      const body = fresh.length === 1 ? fresh[0].body : 'Abra Avisos para conferir.';
      const pushJustRang = PU.pushSoundRecent();
      if (!pushJustRang) PU.playNotificationSound(true);
      PU.toast(title + (body ? ' — ' + body : ''), 'warning');
      if (!pushJustRang) PU.browserNotification(title, body || 'Abra o QuemFaz para conferir.');
    }
    return true;
  }

  function requestStateMap() {
    const out = Object.create(null);
    (DB.state.requests || []).forEach(function (r) {
      out[r.id] = {
        id: r.id, status: r.status, profissionalId: r.profissionalId || null,
        categoriaId: r.categoriaId, cidadeId: r.cidadeId,
        atualizadoEm: r.atualizadoEm || '', quoteStatus: r.orcamento ? r.orcamento.status : null
      };
    });
    return out;
  }
  function describeRequest(r) {
    const cat = DB.categoryById(r.categoriaId);
    const city = DB.cityById(r.cidadeId);
    return (cat ? cat.nome : 'Serviço') + (city ? ' · ' + city.nome : '');
  }
  function detectNotices(session, before, after) {
    if (!session) return;
    noticeBatch = [];
    try { detectNoticesInner(session, before, after); } finally {
      const batch = noticeBatch; noticeBatch = null;
      if (batch.length) {
        const strong = batch.some(function (n) { return n.strong; });
        const novos = batch.filter(function (n) { return n.title === 'Novo chamado perto de você'; }).length;
        const title = batch.length === 1 ? batch[0].title : (novos === batch.length ? novos + ' novos chamados perto de você' : batch.length + ' novas atualizações');
        const body = batch.length === 1 ? (batch[0].body || '') : 'Abra Avisos para ver todos.';
        // V11.1: se um push acabou de tocar, não toca de novo (o aviso continua na tela e em Avisos).
        const pushJustRang = PU.pushSoundRecent();
        const fullCallAlert = !!(global.QFCallAlert && global.QFCallAlert.isOpen && global.QFCallAlert.isOpen());
        if (!pushJustRang && !fullCallAlert) PU.playNotificationSound(strong);
        PU.toast(title + (body ? ' — ' + body : ''), 'success');
        if (!pushJustRang) PU.browserNotification(title, body || 'Abra o QuemFaz para ver os detalhes.');
      }
    }
  }
  function detectNoticesInner(session, before, after) {
    Object.keys(after).forEach(function (id) {
      const a = after[id], b = before[id];
      const detail = describeRequest(a);
      if (session.role === 'profissional') {
        // V11.32.1: pedido aberto a todos entra só na lista, sem aviso, sem toque e sem a tela cheia de chamado.
        const abertoTodos = !!(a.abertoTodos || ((DB.requestById(id) || {}).abertoTodos));
        if (!b && !a.profissionalId && a.status === DB.STATUS.BUSCANDO && !abertoTodos) {
          // V11.13: aviso já com distância, tempo e valor do desbloqueio.
          let detalheNovo = detail;
          try {
            const CI = global.QFCallInfo, r = DB.requestById(id);
            const pz = r && global.QFPrazo ? global.QFPrazo.info(r) : null;
            if (CI && r) detalheNovo = [detail, pz ? pz.texto : '', CI.kmTxt(r), CI.tempoTxt(r), CI.precoTxt(r, currentUser())].filter(Boolean).join(' · ');
          } catch (_) {}
          pushNotice(session, 'novo_chamado:' + id, 'Novo chamado perto de você', detalheNovo, '/profissional/chamada/' + id, true);
          if (global.QFCallAlert) global.QFCallAlert.offer(id);
        }
        if (b && b.status !== a.status && a.profissionalId === session.userId) {
          if (a.status === DB.STATUS.CANCELADO) pushNotice(session, 'cancelado:' + id, 'Chamado cancelado pelo cliente', detail, '/profissional/pedido/' + id, true);
          if (a.status === DB.STATUS.APROVADO) pushNotice(session, 'orc_aprovado:' + id, 'Cliente escolheu você', detail + ' · combine o serviço e conte depois se fechou', '/profissional/pedido/' + id, true);
          if (a.status === DB.STATUS.ORCAMENTO_RECUSADO) pushNotice(session, 'orc_recusado:' + id, 'Cliente respondeu ao orçamento', detail + ' · veja o motivo e envie uma nova proposta', '/profissional/pedido/' + id, false);
          if (a.status === DB.STATUS.NAO_SELECIONADO) pushNotice(session, 'orc_nao_selecionado:' + id, 'Cliente escolheu outro profissional', detail + ' · seu orçamento não foi selecionado desta vez', '/profissional/pedido/' + id, false);
        }
      } else if (session.role === 'cliente') {
        if (b && !b.profissionalId && a.profissionalId) {
          pushNotice(session, 'prof_encontrado:' + id, 'Profissional encontrado', detail + ' · ele vai chamar você no WhatsApp', '/cliente/pedido/' + id, true);
        }
        if (b && b.status !== a.status) {
          if (a.status === DB.STATUS.ORCAMENTO_ENVIADO) pushNotice(session, 'orc_recebido:' + id, 'Novo orçamento recebido', detail + ' · abra para aprovar ou recusar', '/cliente/pedido/' + id, true);
          if (a.status === DB.STATUS.EM_ANDAMENTO) pushNotice(session, 'servico_iniciado:' + id, 'Serviço iniciado', detail + ' · o profissional começou o atendimento', '/cliente/pedido/' + id, false);
          if (a.status === DB.STATUS.CANCELADO && b.profissionalId) pushNotice(session, 'cancelado:' + id, 'Serviço cancelado pelo profissional', detail, '/cliente/pedido/' + id, true);
          if (a.status === DB.STATUS.SERVICO_CONCLUIDO) pushNotice(session, 'servico_concluido:' + id, 'Serviço concluído', detail + ' · avalie o profissional', '/cliente/pedido/' + id, true);
        }
      }
    });
  }

  Screens.notificacoesRender = function () {
    const session = currentSession();
    const items = loadNotices(session);
    return '<div class="view">' +
      '<div class="section-head"><div><h2 class="h2">Avisos</h2><p class="text text--sm text--secondary">Chamados, profissionais e atualizações importantes.</p></div></div>' +
      (items.length ? '<div class="notice-toolbar"><button type="button" class="notice-clear" data-clear-notices>Excluir todos</button></div>' +
        '<div class="stack--sm">' + items.map(function (n) {
          return '<div class="notice-card' + (n.read ? '' : ' is-unread') + '">' +
            '<button type="button" class="notice-card__open"' + (n.route ? ' data-nav="' + PU.escapeHtml(n.route) + '"' : '') + '>' +
              '<span class="notice-card__icon">' + icon('bell') + '</span>' +
              '<span class="spacer"><span class="notice-card__title">' + PU.escapeHtml(n.title) + '</span>' +
              (n.body ? '<span class="notice-card__body">' + PU.escapeHtml(n.body) + '</span>' : '') +
              '<span class="notice-card__time">' + PU.timeAgo(n.createdAt) + '</span></span>' +
            '</button>' +
            '<button type="button" class="notice-card__delete" data-delete-notice="' + PU.escapeHtml(n.id) + '"' + (n.serverId ? ' data-server-notice-id="' + PU.escapeHtml(n.serverId) + '"' : '') + ' aria-label="Excluir aviso" title="Excluir aviso">' + icon('xCircle') + '</button>' +
          '</div>';
        }).join('') + '</div>'
        : '<div class="empty-state"><div class="icon-tile icon-tile--ghost">' + icon('bell') + '</div><p class="text text--secondary">Nenhum aviso novo.</p></div>') +
    '</div>';
  };

  function currentSession() { return DB.getSession(); }

  function currentUser() {
    const s = currentSession();
    if (!s) return null;
    if (s.role === 'cliente') return DB.clienteById(s.userId);
    if (s.role === 'profissional') return DB.profissionalById(s.userId);
    return null;
  }

  function navigate(hash, replace) {
    if (replace) {
      const url = location.pathname + location.search + '#' + hash;
      history.replaceState(null, '', url);
      route();
    } else {
      location.hash = hash;
    }
  }
  global.navigate = navigate;

  // ---------------- Rotas ----------------

  const routes = [
    { pattern: '/profissional/recrutamento', role: 'profissional', title: 'Recrutamento', back: '/profissional/home', render: Screens.recrutamentoRender },
    { pattern: '/profissional/recrutamento/vaga/:id', role: 'profissional', title: 'Vaga e candidatos', back: '/profissional/recrutamento', render: Screens.recrutVagaRender },
    { pattern: '/recrutamento/vaga/:id', anon: true, publicPage: true, title: 'Vaga de emprego', render: Screens.recrutPublicaRender },

    { pattern: '/', anon: true, render: function () { return Screens.landing(); } },
    { pattern: '/auth/:role/login', anon: true, render: function (p) { return Screens.authLogin(p); } },
    { pattern: '/auth/:role/cadastro', anon: true, render: function (p) { return Screens.authCadastro(p); } },

    { pattern: '/anuncie', anon: true, title: 'Anuncie no QuemFaz', render: Screens.anuncieRender },
    { pattern: '/como-funciona', anon: true, title: 'Como funciona', render: Screens.comoFuncionaRender },
    { pattern: '/calculadora', anon: true, title: 'Quanto custa?', render: function () { return Screens.calculadora(); } },

    { pattern: '/cliente/home', role: 'cliente', tab: 'home', title: 'QuemFaz', render: Screens.clienteHomeRender },
    { pattern: '/cliente/categoria/:catId', role: 'cliente', title: 'Categoria', back: '/cliente/home', render: Screens.clienteCategoriaRender },
    { pattern: '/cliente/novo-pedido/:catId', role: 'cliente', title: 'Solicitar serviço', back: '/cliente/home', render: Screens.clienteNovoPedidoRender },
    { pattern: '/cliente/pedidos', role: 'cliente', tab: 'pedidos', title: 'Meus pedidos', render: Screens.clientePedidosRender },
    { pattern: '/cliente/avisos', role: 'cliente', tab: 'avisos', title: 'Avisos', render: Screens.notificacoesRender },
    { pattern: '/cliente/pedido/:id', role: 'cliente', title: 'Acompanhar pedido', back: '/cliente/pedidos', render: Screens.clientePedidoDetalheRender },
    { pattern: '/cliente/chat/:id/:profId', role: 'cliente', title: 'Conversa com profissional', back: '/cliente/pedidos', render: Screens.clienteChatRender },
    { pattern: '/cliente/perfil', role: 'cliente', tab: 'perfil', title: 'Perfil', render: Screens.clientePerfilRender },
    { pattern: '/cliente/endereco', role: 'cliente', title: 'Meu endereço', back: '/cliente/perfil', render: Screens.clienteEnderecoRender },

    { pattern: '/cliente/como-funciona', role: 'cliente', title: 'Como funciona', back: '/cliente/perfil', render: Screens.comoFuncionaRender },
    { pattern: '/cliente/anuncie', role: 'cliente', title: 'Anuncie no QuemFaz', back: '/cliente/home', render: Screens.anuncieRender },

    { pattern: '/profissional/home', role: 'profissional', tab: 'home', title: 'QuemFaz', render: Screens.profHomeRender },
    { pattern: '/profissional/chamada/:id', role: 'profissional', title: 'Oportunidade de serviço', back: '/profissional/servicos/disponiveis', render: Screens.profChamadaRender },
    { pattern: '/profissional/servicos', role: 'profissional', tab: 'servicos', title: 'Serviços', render: Screens.profServicosRender },
    { pattern: '/profissional/servicos/disponiveis', role: 'profissional', tab: 'servicos', title: 'Serviços disponíveis', render: Screens.profServicosDisponiveisRender },
    { pattern: '/profissional/avisos', role: 'profissional', tab: 'avisos', title: 'Avisos', render: Screens.notificacoesRender },
    { pattern: '/profissional/pedido/:id', role: 'profissional', title: 'Detalhes do serviço', back: '/profissional/servicos', render: Screens.profPedidoDetalheRender },
    { pattern: '/profissional/chat/:id', role: 'profissional', title: 'Conversa com cliente', back: '/profissional/servicos', render: Screens.profChatRender },
    { pattern: '/profissional/orcamento/:id', role: 'profissional', title: 'Enviar proposta', back: '/profissional/servicos', render: Screens.profOrcamentoFormRender },
    { pattern: '/profissional/carteira', role: 'profissional', tab: 'carteira', title: 'Carteira', render: Screens.profCarteiraRender },
    { pattern: '/profissional/planos', role: 'profissional', tab: 'planos', title: 'Planos', render: Screens.profPlanosRender },
    { pattern: '/profissional/configuracoes', role: 'profissional', tab: 'config', title: 'Configurações', render: Screens.profConfigRender },
    { pattern: '/profissional/como-funciona', role: 'profissional', title: 'Como funciona e planos', back: '/profissional/planos', render: Screens.comoFuncionaRender },
    { pattern: '/profissional/anuncie', role: 'profissional', title: 'Anuncie no QuemFaz', back: '/profissional/home', render: Screens.anuncieRender },
    { pattern: '/profissional/perfil', role: 'profissional', tab: 'perfil', title: 'Perfil profissional', render: Screens.profPerfilRender },
    { pattern: '/profissional/avaliacoes', role: 'profissional', title: 'Avaliações', back: '/profissional/perfil', render: Screens.profAvaliacoesRender },

  ];

  function compilePattern(pattern) {
    const keys = [];
    const re = new RegExp('^' + pattern.replace(/:[^/]+/g, function (m) { keys.push(m.slice(1)); return '([^/]+)'; }) + '$');
    return { re: re, keys: keys };
  }
  routes.forEach(function (r) { const c = compilePattern(r.pattern); r._re = c.re; r._keys = c.keys; });

  function matchRoute(path) {
    for (let i = 0; i < routes.length; i++) {
      const r = routes[i];
      const m = r._re.exec(path);
      if (m) {
        const params = {};
        r._keys.forEach(function (k, idx) { params[k] = decodeURIComponent(m[idx + 1]); });
        return { route: r, params: params };
      }
    }
    return null;
  }

  function currentPath() {
    let h = location.hash || '#/';
    h = h.slice(1);
    if (!h) h = '/';
    return h;
  }

  async function route() {
    const path = currentPath();
    // Antigos links de login do cliente voltam para o pedido gratuito.
    if (path === '/auth/cliente/login') { navigate('/', true); return; }
    const found = matchRoute(path);
    if (found && found.route.publicPage) { renderAnon(found); return; }
    if (found && found.route.anon && global.QFCloud && !currentSession()) {
      renderAnon(found);
      if (global.QFCloud.refreshPublicAds) global.QFCloud.refreshPublicAds();
      return;
    }
    if (global.QFCloud && global.QFCloud.enabled) {
      try {
        await global.QFConnection.deadline(global.QFCloud.syncForCurrentSession(false), 15000, 'dados da conta');
      } catch (err) {
        console.error('QuemFaz sync error', err);
        renderConnectionError();
        return;
      }
    }
    if (global.QFPush) {
      try { await global.QFConnection.deadline(global.QFPush.refreshStatus(), 3000, 'permissão de notificações'); } catch (_) {}
    }
    const session = currentSession();
    if (session && session.role === 'profissional') {
      try { await global.QFConnection.deadline(syncPersistentProfessionalNotices(session, false), 5000, 'avisos'); }
      catch (err) { console.warn('QuemFaz avisos persistentes', err); }
    }

    if (session && global.QFCloud && global.QFCloud.enabled && global.QFCloud.pendingFlow) {
      try {
        const pending = await global.QFConnection.deadline(global.QFCloud.pendingFlow(), 5000, 'serviço pendente');
        if (pending && pending.pending && pending.chamado_id) {
          const target = session.role === 'profissional'
            ? '/profissional/pedido/' + pending.chamado_id
            : '/cliente/pedido/' + pending.chamado_id;
          if (path !== target) {
            let warned = false;
            try { warned = sessionStorage.getItem('qf_fluxo_obrigatorio_' + pending.chamado_id) === '1'; } catch (_) {}
            if (!warned) {
              PU.toast(session.role === 'profissional'
                ? 'Finalize e avalie o serviço pendente para continuar usando o app.'
                : 'Finalize e avalie o serviço pendente para continuar usando o app.', 'danger');
              try { sessionStorage.setItem('qf_fluxo_obrigatorio_' + pending.chamado_id, '1'); } catch (_) {}
            }
            navigate(target, true);
            return;
          }
        }
      } catch (err) {
        console.warn('QuemFaz fluxo obrigatório', err);
      }
    }

    if (!found) { navigate('/', true); return; }

    if (found.route.anon) {
      if (session && session.role === 'admin') {
        DB.logout();
        renderAnon(found);
        return;
      }
      if (session) {
        navigate('/' + session.role + '/home', true);
        return;
      }
      renderAnon(found);
      return;
    }

    if (!session || session.role !== found.route.role) {
      // V11.9: link direto do chamado (WhatsApp/push) sem sessão: entra e volta direto para o chamado.
      if (!session && found.route.role === 'profissional' && /^\/profissional\/chamada\//.test(path)) {
        try { sessionStorage.setItem('qf_pos_login', path); } catch (_) {}
        navigate('/auth/profissional/login', true);
        return;
      }
      navigate('/', true);
      return;
    }
    const user = currentUser();
    if (!user) { DB.logout(); navigate('/', true); return; }
    if (user.bloqueado) {
      PU.toast('Seu acesso foi bloqueado pelo administrador.', 'danger');
      DB.logout();
      navigate('/', true);
      return;
    }
    renderApp(found, user, session);
  }

  // V10.6: identifica a tela no #app-shell para o layout de computador/tablet.
  function routeKey(pattern) {
    return String(pattern || '/').replace(/:[^/]+/g, '').replace(/[^a-z0-9]+/gi, '-').replace(/^-+|-+$/g, '') || 'inicio';
  }

  function renderAnon(found) {
    const shell = document.getElementById('app-shell');
    shell.setAttribute('data-route', routeKey(found.route.pattern));
    shell.setAttribute('data-role', 'anon');
    const isLanding = found.route.pattern === '/';
    if (global.QFEarly) global.QFEarly.capture();
    const reuseHome = isLanding && shell.getAttribute('data-qf-prerender') === 'home' && !!shell.querySelector('[data-landing-service-form]');
    shell.removeAttribute('data-qf-prerender');
    if (!reuseHome) shell.innerHTML = '<div id="app-content"></div>' + (!isLanding && global.QFSupport ? global.QFSupport.buttonHtml() : '');
    const content = document.getElementById('app-content');
    content.style.paddingBottom = isLanding ? '0' : 'calc(env(safe-area-inset-bottom, 0px) + 96px)';
    if (!reuseHome) content.innerHTML = found.route.render(found.params);
    bindGlobalDelegation(content);
    if (Screens.afterRenderAnon) Screens.afterRenderAnon(found.route.pattern, content, found.params);

  // V11.16.7 — atualização em segundo plano sem remontar a tela inteira.
  // O servidor pode renovar timestamps a cada sincronização. Esses campos não mudam
  // o que o usuário está vendo e não podem provocar um novo DOM a cada 4 segundos.
  function detailRefreshSignature(found) {
    if (!found || !found.params || !found.params.id) return '';
    const req = DB.requestById(found.params.id);
    if (!req) return '';
    function quoteSig(q) {
      if (!q) return null;
      return [
        q.id || '', q.profissionalId || q.profissional_id || '', q.status || '',
        Number(q.maoDeObra || q.mao_de_obra || 0), Number(q.material || 0),
        Number(q.taxaVisita || q.taxa_visita || 0), Number(q.total || 0),
        q.mensagem || q.observacao || ''
      ];
    }
    const quotes = Array.isArray(req.orcamentos) ? req.orcamentos.map(quoteSig) : (req.orcamento ? [quoteSig(req.orcamento)] : []);
    const end = req.endereco || {};
    const pay = req.pagamentoPrioridade || {};
    const avCli = req.avaliacaoCliente || {};
    const avPro = req.avaliacaoProfissional || {};
    return JSON.stringify([
      req.id || '', req.status || '', req.categoriaId || '', req.profissionalId || '',
      !!req.prioridade, req.dataPreferida || '', req.prazo || '', req.prazoDia || '', req.periodo || '', req.descricao || '',
      Number(req.distanciaKm || 0), Number(req.valorDesbloqueio || req.leadValor || 0),
      end.cep || '', end.rua || '', end.numero || '', end.bairro || '', end.cidade || '', end.uf || '',
      pay.id || '', pay.status || '', Number(pay.valor || 0), pay.checkoutUrl || '',
      req.motivoCancelamento || '',
      avCli.nota || '', avCli.comentario || '', avPro.nota || '', avPro.comentario || '',
      quotes
    ]);
  }

    const detailSig = detail ? detailRefreshSignature(found) : '';

    // Enquanto o pedido continua no mesmo estado visual, atualiza somente os blocos

  let fixedBar = null, barRaf = 0, lastBarKey = '';

      const afterMap = requestStateMap();
      const after = requestStateSignature();
      if (before !== after) detectNotices(session, beforeMap, afterMap);
      if (currentPath() !== path) { pendingRefresh = false; return; }
      if (before === after && !pendingRefresh && !serverNoticesChanged) return;
      if (userIsEditing()) { pendingRefresh = true; return; }
      pendingRefresh = false;
      const found = matchRoute(path);
      const freshSession = currentSession();
      const freshUser = currentUser();
      if (found && freshSession && freshUser) {
        renderApp(found, freshUser, freshSession, { background: true });
        requestAnimationFrame(function () { window.scrollTo(0, y); });
      }
    } catch (err) {
      console.warn('QuemFaz atualização em tempo real', err);
    } finally {
      liveCallsBusy = false;
    }
  }, 4000);

  // Atualiza a tela após os anúncios chegarem sem apagar um formulário em edição.
  global.addEventListener('qf-push-state', function () {
    const P = global.QFPush;
    if (!P) return;
    if (!P.needsPermission()) {
      document.querySelectorAll('.qf-cli-notif,.qf-no-notif-strip,[data-pendencia="notificacoes"]').forEach(function (el) { el.remove(); });
    }
    if (P.isActive()) document.querySelectorAll('.qf-push-banner').forEach(function (el) { el.remove(); });
    const session = currentSession();
    if (session) document.querySelectorAll('.notify-required,.notify-reconnect,.notify-ok').forEach(function (el) {
      const html = P.card(session.role);
      if (el.outerHTML !== html) el.outerHTML = html;
    });
  });

  // V11.16.30: "Ver mais movimentações" na Carteira — libera mais 20 linhas por clique.
  document.addEventListener('click', function (ev) {
    const btn = ev.target && ev.target.closest ? ev.target.closest('[data-tx-more]') : null;
    if (!btn) return;
    const list = btn.previousElementSibling;
    if (!list || !list.classList.contains('qf-tx-list')) return;
    const total = list.children.length;
    const show = Math.min(total, (Number(list.getAttribute('data-show')) || 5) + 20);
    list.setAttribute('data-show', String(show));
    Array.prototype.forEach.call(list.children, function (row, i) { row.style.display = i < show ? '' : 'none'; });
    if (show >= total) btn.remove(); else btn.textContent = 'Ver mais movimentações (' + (total - show) + ')';
  });

  global.addEventListener('qf-ads-updated', function () {
    const content = document.getElementById('app-content');
    const path = currentPath();
    if (!content || userIsEditing()) return;
    if (path !== '/auth/cliente/cadastro' && path !== '/cliente/home') return;
    const found = matchRoute(path), session = currentSession(), user = currentUser();
    const y = window.scrollY;
    if (found && found.route.anon && !session) renderAnon(found);
    else if (found && session && user) renderApp(found, user, session);
    window.scrollTo(0, y);
  });

  // V11.9.1: modo demonstração (dados locais de exemplo) só em ambiente local, nunca no site publicado.
  function isDemoMode() { try { return ['localhost', '127.0.0.1', '[::1]'].indexOf(location.hostname) !== -1 && new URLSearchParams(location.search).get('demo') === '1'; } catch (_) { return false; } }
  function renderConnectionError() {
    const shell = document.getElementById('app-shell');
    shell.innerHTML = '<div class="qf-conn-error"><img src="./icon.svg" alt="QuemFaz" style="width:72px;height:72px;border-radius:18px;">' +
      '<h1 class="h2">Sem conexão com o QuemFaz</h1><p class="text text--secondary" style="max-width:340px;">A conexão demorou e seus dados não puderam ser carregados. Tente novamente em instantes.</p>' +
      '<button class="btn btn--primary" style="max-width:320px;" id="qf-retry">' + icon('refresh') + ' Tentar novamente</button></div>';
    document.getElementById('qf-retry').onclick = function () { location.reload(); };
  }

  window.addEventListener('DOMContentLoaded', async function () {
    DB.load();
    if (global.QFClientAcquisition) global.QFClientAcquisition.applyDestination();
    if (global.QFApp) global.QFApp.registerSW();
    if (!(global.QFCloud && global.QFCloud.enabled) && !isDemoMode()) {
      // V10.2: sem a biblioteca do Supabase o app NÃO cai mais em dados de demonstração.
      renderConnectionError();
      global.addEventListener('online', function () { location.reload(); }, { once: true });
      return;
    }
    if (global.QFCloud && global.QFCloud.enabled) global.QFCloud.prepareLocalState();
    await route();
    if (global.QFEarly) global.QFEarly.finish();
    try {
      const mustChange = !!(global.QFCloud && global.QFCloud.enabled && global.QFCloud.needsForcedPasswordChange && await global.QFCloud.needsForcedPasswordChange());
      if (mustChange && global.QFPasswordRecovery && global.QFPasswordRecovery.openForcedPassword) {
        try { sessionStorage.setItem('qf_force_password_change', '1'); } catch (_) {}
        global.QFPasswordRecovery.openForcedPassword();
      } else if (sessionStorage.getItem('qf_password_recovery') === '1' && global.QFPasswordRecovery) {
        global.QFPasswordRecovery.openNewPassword();
      }
    } catch (_) {}
    if (global.QFApp) global.QFApp.checkVersion(true).catch(function () {});
    if (global.QFPush) global.QFPush.restore().catch(function () {});
  });

  async function refreshNow() {
    if (!(global.QFCloud && global.QFCloud.enabled) || liveCallsBusy) return;
    const session = currentSession();
    if (!session) return;
    liveCallsBusy = true;
    const path = currentPath();
    const beforeMap = requestStateMap();
    const before = requestStateSignature();
    try {
      await global.QFCloud.syncForCurrentSession(true);
      const after = requestStateSignature();
      if (before !== after) detectNotices(session, beforeMap, requestStateMap());
      if (before !== after && currentPath() === path && !userIsEditing()) {
        const found = matchRoute(path); const u = currentUser(); const s2 = currentSession();
        if (found && u && s2 && found.route.role) renderApp(found, u, s2, { background: true });
      }
    } catch (err) { console.warn('QuemFaz atualização', err); }
    finally { liveCallsBusy = false; }
  }
  document.addEventListener('visibilitychange', function () { if (!document.hidden) refreshNow(); });

  global.PROAKI_APP = { navigate, currentSession, currentUser, route, TABS, refreshNow, userIsEditing };
})(window);

/* QuemFaz V11.17.0 — aviso geral na tela: comunicado que o admin publica e aparece uma vez para cada pessoa. */
(function (global) {
  const SEEN_KEY = 'qf_aviso_geral_visto';
  let lastCheck = 0, busy = false, retry = null;
  function client() { return global.QFCloud && global.QFCloud.enabled ? global.QFCloud.client : null; }
  // V11.18.0: "já vi" vale por pessoa (aparelho compartilhado) e o "Entendi" de quem está logado é registrado no servidor.
  function uid() { try { const se = global.PROAKI_APP && global.PROAKI_APP.currentSession(); return se && se.userId ? String(se.userId) : ''; } catch (_) { return ''; } }
  function seenKey(id) { return String(id) + ':' + (uid() || 'visitante'); }
  function seen() { try { return localStorage.getItem(SEEN_KEY) || ''; } catch (_) { return ''; } }
  function markSeen(id) { try { localStorage.setItem(SEEN_KEY, seenKey(id)); } catch (_) {} }
  function markRead(id) {
    const c = client();
    if (!c || !uid()) return;
    try { Promise.resolve(c.rpc('qf_aviso_geral_marcar_lido', { p_id: id })).catch(function () {}); } catch (_) {}
  }
  function esc(v) { return String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
  // Não cobre chamada tocando, conversa aberta nem formulário que a pessoa está preenchendo.
  function busyScreen() {
    const path = String(location.hash || '').replace(/^#/, '').split('?')[0];
    if (/\/(chamada|chat)\//.test(path)) return true;
    if (document.querySelector('.qf-call-overlay')) return true;
    try { if (global.PROAKI_APP && global.PROAKI_APP.userIsEditing()) return true; } catch (_) {}
    return false;
  }
  function close() { const el = document.getElementById('qf-aviso-overlay'); if (el) el.remove(); }
  function show(aviso) {
    if (!aviso || !aviso.id || document.getElementById('qf-aviso-overlay')) return;
    const el = document.createElement('div');
    el.id = 'qf-aviso-overlay';
    el.className = 'qf-aviso-overlay';
    el.setAttribute('role', 'dialog');
    el.setAttribute('aria-modal', 'true');
    el.setAttribute('aria-labelledby', 'qf-aviso-title');
    el.innerHTML = '<div class="qf-aviso"><div class="qf-aviso__head"><div class="qf-aviso__tag">Aviso do QuemFaz</div><h2 class="qf-aviso__title" id="qf-aviso-title">' + esc(aviso.titulo) + '</h2></div>' +
      '<div class="qf-aviso__body">' + esc(aviso.mensagem) + '</div>' +
      '<div class="qf-aviso__foot"><button type="button" class="btn btn--primary" data-aviso-ok>Entendi</button></div></div>';
    el.querySelector('[data-aviso-ok]').addEventListener('click', function () { markSeen(aviso.id); markRead(aviso.id); close(); });
    document.body.appendChild(el);
  }
  async function check(force) {
    const c = client();
    if (!c || busy) return;
    if (!force && Date.now() - lastCheck < 120000) return;
    busy = true; lastCheck = Date.now();
    try {
      const r = await c.rpc('qf_aviso_geral_atual');
      const aviso = r && !r.error && r.data ? r.data.aviso : null;
      if (!aviso || !aviso.id) { close(); return; }
      // Já tocou em "Entendi" neste aparelho, mas o servidor ainda não sabe (estava sem internet): registra agora, sem abrir de novo.
      if (seenKey(aviso.id) === seen()) { markRead(aviso.id); return; }
      if (busyScreen()) { clearTimeout(retry); retry = setTimeout(function () { check(true); }, 20000); return; }
      show(aviso);
    } catch (_) {}
    finally { busy = false; }
  }
  global.addEventListener('DOMContentLoaded', function () { setTimeout(function () { check(true); }, 2500); });
  document.addEventListener('visibilitychange', function () { if (!document.hidden) check(false); });
  global.addEventListener('hashchange', function () { setTimeout(function () { check(false); }, 800); });
  setInterval(function () { if (!document.hidden) check(false); }, 300000);
  global.QFAvisoGeral = { check: check, show: show, close: close };
})(window);

</script>

<script id="qf-launch-countdown">
(function(){
  // Data interna da contagem: quatro dias a partir de 08/10/2026, horário de Brasília.
  var deadline = Date.parse('2026-10-12T00:00:00-03:00');
  function tick(){
    var box=document.querySelector('[data-qf-launch-clock]');if(!box)return;
    var remaining=Math.max(0,Math.floor((deadline-Date.now())/1000));
    var vals=[Math.floor(remaining/86400),Math.floor(remaining%86400/3600),Math.floor(remaining%3600/60),remaining%60];
    ['days','hours','minutes','seconds'].forEach(function(k,i){var el=box.querySelector('[data-qf-'+k+']');if(el)el.textContent=String(vals[i]).padStart(2,'0');});
    
  }
  tick();setInterval(tick,1000);
})();
</script>
