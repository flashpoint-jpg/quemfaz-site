  function emailExists(role, email) { return !!findUserByEmail(role, email); }

  function cadastrarCliente(data) {
    const u = {
      id: PU.uid('cli'), nome: data.nome, email: data.email, senha: data.senha,
      telefone: data.telefone || '', bloqueado: false, criadoEm: nowIso(),
      enderecos: [],
    };
    state.users.clientes.push(u);
    persist();
    return u;
  }

  function cadastrarProfissional(data) {
    const u = {
      id: PU.uid('pro'), nome: data.nome, email: data.email, senha: data.senha,
      telefone: data.telefone || '', categorias: data.categorias || [], cidadeId: data.cidadeId,
      fotoUrl: data.selfieData || data.fotoUrl || '',
      raioKm: data.raioKm || 10, documentos: { rg: false, cpf: false, comprovanteEndereco: false },
      statusAprovacao: 'pendente', online: false, saldo: 0, creditos: 2500, bonusDesbloqueios: 0, avaliacaoMedia: 0, totalAvaliacoes: 0,
      taxaVisitaPadrao: data.taxaVisitaPadrao || 0, bloqueado: false, criadoEm: nowIso(),
    };
    state.users.profissionais.push(u);
    persist();
    return u;
  }

  function login(role, email, senha) {
    const u = findUserByEmail(role, email);
    if (!u) return { ok: false, error: 'E-mail não encontrado.' };
    if (u.senha !== senha) return { ok: false, error: 'Senha incorreta.' };
    if (u.bloqueado) return { ok: false, error: 'Este acesso foi bloqueado pelo administrador.' };
    const sess = { role: role, userId: u.id };
    setSession(sess);
    return { ok: true, user: u, session: sess };
  }

  function logout() { setSession(null); }

  // ---------------------------------------------------------------
  // Fluxo do pedido — Cliente
  // ---------------------------------------------------------------

  function criarPedido(data) {
    const req = {
      id: PU.uid('req'), clienteId: data.clienteId, categoriaId: data.categoriaId,
      descricao: data.descricao, fotos: data.fotos || [], endereco: data.endereco, cidadeId: data.endereco.cidadeId,
      status: STATUS.BUSCANDO, profissionalId: null,
      criadoEm: nowIso(), atualizadoEm: nowIso(),
      // Prioridade nunca é concedida gratuitamente. No modo offline ela fica apenas solicitada/pending.
      prioridade: false,
      pagamentoPrioridade: data.prioridade ? { status: 'pendente', valor: state.settings.prioridadeCliente || 690, metodo: data.prioridadeMetodo || 'pix', criadoEm: nowIso() } : null,
      leadUnlock: null,
      taxaVisita: 0, orcamento: null, pagamento: null, avaliacaoCliente: null, avaliacaoProfissional: null,
      recusadoPor: [], canceladoPor: null, motivoCancelamento: null,
      historico: [historicoItem(data.prioridade ? 'Pedido criado; prioridade aguardando pagamento' : 'Pedido criado gratuitamente')],
    };
    state.requests.push(req);
    persist();
    return req;
  }

  function buscarProfissional(requestId) {
    const req = requestById(requestId);
    if (!req) return null;
    const excluidos = req.recusadoPor || [];
    const candidatos = state.users.profissionais.filter(function (p) {
      return p.statusAprovacao === 'aprovado' && p.online && !p.bloqueado &&
        p.categorias.indexOf(req.categoriaId) !== -1 &&
        excluidos.indexOf(p.id) === -1;
    });

    req.profissionalId = null;
    req.atualizadoEm = nowIso();
    if (!candidatos.length) {
      req.status = STATUS.SEM_PROFISSIONAL;
      req.historico.push(historicoItem('Nenhum profissional disponível no momento'));
    } else {
      req.status = STATUS.BUSCANDO;
      req.historico.push(historicoItem('Chamado publicado para ' + candidatos.length + ' profissional(is) disponível(is)'));
    }
    persist();
    return req;
  }

  function desbloquearChamado(requestId, profissionalId) {
    const req = requestById(requestId);
    const prof = profissionalById(profissionalId);
    if (!req || !prof) return { ok: false, reason: 'nao_encontrado' };
    if (req.status !== STATUS.BUSCANDO || req.profissionalId) return { ok: false, reason: 'indisponivel' };
    if (prof.statusAprovacao !== 'aprovado' || !prof.online || prof.bloqueado || prof.categorias.indexOf(req.categoriaId) === -1) {
      return { ok: false, reason: 'nao_elegivel' };
    }
    const valor = leadFeeForRequest(req);
    const saldo = Number(prof.creditos || 0);
    const primeiraGratis = false;
    if (!primeiraGratis && saldo < valor) return { ok: false, reason: 'saldo', valor: valor, saldo: saldo };

    if (!primeiraGratis) prof.creditos = saldo - valor;
    prof.bonusDesbloqueios = 0;

    req.profissionalId = profissionalId;
    req.leadUnlock = {
      profissionalId: profissionalId,
      valor: primeiraGratis ? 0 : valor,
      valorTabela: valor,
      forma: primeiraGratis ? 'bonus' : 'creditos',
      status: 'pago',
      criadoEm: nowIso()
    };
    req.status = STATUS.AGUARDANDO_ORCAMENTO;
    req.atualizadoEm = nowIso();
    req.historico.push(historicoItem(
      primeiraGratis
        ? prof.nome + ' usou o primeiro desbloqueio grátis'
        : prof.nome + ' desbloqueou o chamado por ' + PU.formatCurrency(valor)
    ));
    state.transactions.push({
      id: PU.uid('tx'), profissionalId: profissionalId, requestId: requestId,
      tipo: primeiraGratis ? 'bonus' : 'debito',
      valor: valor, valorTabela: valor, status: 'pago', criadoEm: nowIso(),
      descricao: primeiraGratis
        ? 'Primeiro desbloqueio grátis'
        : 'Desbloqueio de chamado de ' + ((categoryById(req.categoriaId) || {}).nome || 'serviço'),
    });
    persist();
    return {
      ok: true, request: req, valor: primeiraGratis ? 0 : valor, valorTabela: valor,
      usouBonus: primeiraGratis, saldo: prof.creditos, bonusDesbloqueios: 0
    };
  }

  function recarregarCreditos(profissionalId, valor, metodo) {
    const prof = profissionalById(profissionalId);
    valor = Number(valor) || 0;
    if (!prof || valor <= 0) return null;
    metodo = metodo || 'Pix';
    prof.creditos = Number(prof.creditos || 0) + valor;
    state.transactions.push({
      id: PU.uid('tx'), profissionalId: profissionalId, requestId: null, tipo: 'recarga', status: 'pago', metodo: metodo,
      valor: valor, criadoEm: nowIso(), descricao: 'Recarga via ' + metodo,
    });
    persist();
    return prof.creditos;
  }

  function criarRecargaPendente(profissionalId, valor, metodo) {
    const prof = profissionalById(profissionalId);
    valor = Number(valor) || 0;
    if (!prof || valor <= 0) return null;
    const tx = {
      id: PU.uid('tx'), profissionalId: profissionalId, requestId: null, tipo: 'recarga_pendente', status: 'pendente',
      metodo: metodo || 'Boleto', valor: valor, criadoEm: nowIso(), descricao: 'Recarga via ' + (metodo || 'Boleto') + ' — aguardando compensação'
    };
    state.transactions.push(tx);
    persist();
    return tx;
  }

  function confirmarRecargaPendente(transactionId) {
    const tx = state.transactions.find(function (t) { return t.id === transactionId; });
    if (!tx || tx.tipo !== 'recarga_pendente' || tx.status !== 'pendente') return null;
    const prof = profissionalById(tx.profissionalId);
    if (!prof) return null;
    prof.creditos = Number(prof.creditos || 0) + Number(tx.valor || 0);
    tx.tipo = 'recarga';
    tx.status = 'pago';
    tx.compensadoEm = nowIso();
    tx.descricao = 'Recarga via ' + (tx.metodo || 'Boleto');
    persist();
    return { transaction: tx, saldo: prof.creditos };
  }

  function cancelarPedido(requestId, por, motivo) {
    const req = requestById(requestId);
    if (!req) return null;
    req.status = STATUS.CANCELADO;
    req.canceladoPor = por;
    req.motivoCancelamento = motivo || '';
    req.atualizadoEm = nowIso();
    req.historico.push(historicoItem('Pedido cancelado por ' + (por === 'cliente' ? 'cliente' : por === 'profissional' ? 'profissional' : 'administrador') + (motivo ? ': ' + motivo : '')));
    persist();
    return req;
  }

  function aprovarOrcamento(requestId) {
    const req = requestById(requestId);
    if (!req || !req.orcamento) return null;
    req.orcamento.status = 'aprovado';
    req.status = STATUS.APROVADO;
    req.atualizadoEm = nowIso();
    req.historico.push(historicoItem('Cliente aprovou o orçamento'));
    persist();
    return req;
  }

  function recusarOrcamento(requestId, motivo) {
    const req = requestById(requestId);
    if (!req || !req.orcamento) return null;
    req.orcamento.status = 'recusado';
    req.orcamento.motivoRecusa = motivo || '';
    req.status = STATUS.ORCAMENTO_RECUSADO;
    req.atualizadoEm = nowIso();
    req.historico.push(historicoItem('Cliente recusou o orçamento e pediu novo valor' + (motivo ? ': ' + motivo : '')));
    persist();
    return req;
  }

  function buscarOutroProfissional(requestId, motivo) {
    const req = requestById(requestId);
    if (!req || !req.orcamento) return null;

    const profissionalAnterior = req.profissionalId;
    req.orcamento.status = 'recusado';
    req.orcamento.motivoRecusa = motivo || '';

    req.recusadoPor = req.recusadoPor || [];
    if (profissionalAnterior && req.recusadoPor.indexOf(profissionalAnterior) === -1) {
      req.recusadoPor.push(profissionalAnterior);
    }

    if (req.leadUnlock) {
      req.desbloqueiosAnteriores = req.desbloqueiosAnteriores || [];
      req.desbloqueiosAnteriores.push(Object.assign({}, req.leadUnlock, { encerradoEm: nowIso() }));
    }

    req.profissionalId = null;
    req.leadUnlock = null;
    req.orcamento = null;
    req.status = STATUS.BUSCANDO;
    req.atualizadoEm = nowIso();
    req.historico.push(historicoItem('Cliente recusou o orçamento e voltou o chamado para buscar outro profissional' + (motivo ? ': ' + motivo : '')));
    persist();
    return buscarProfissional(requestId) || req;
  }

  function pagarPedido(requestId) {
    // Mantido apenas por compatibilidade com versões anteriores do protótipo.
    // O QuemFaz não cobra o valor do serviço: cliente e profissional combinam
    // o pagamento diretamente entre si. A receita da plataforma vem do
    // desbloqueio do chamado e da prioridade opcional do cliente.
    const req = requestById(requestId);
    if (!req || req.status !== STATUS.SERVICO_CONCLUIDO) return null;
    req.status = STATUS.PAGO;
    req.atualizadoEm = nowIso();
    req.historico.push(historicoItem('Pagamento do serviço tratado diretamente entre cliente e profissional'));
    persist();
    return req;
  }

  function avaliarComoCliente(requestId, nota, comentario) {
    const req = requestById(requestId);
    if (!req) return null;
    req.avaliacaoCliente = { nota: nota, comentario: comentario || '', criadoEm: nowIso() };
    req.status = STATUS.FINALIZADO;
    req.atualizadoEm = nowIso();
    req.historico.push(historicoItem('Cliente avaliou o serviço com nota ' + nota));
    state.reviews.push({ id: PU.uid('rev'), requestId: req.id, de: 'cliente', profissionalId: req.profissionalId, nota: nota, comentario: comentario || '', criadoEm: nowIso() });
    const prof = profissionalById(req.profissionalId);
    if (prof) {
      const total = prof.totalAvaliacoes || 0;
      const media = prof.avaliacaoMedia || 0;
      const novoTotal = total + 1;
      prof.avaliacaoMedia = ((media * total) + nota) / novoTotal;
      prof.totalAvaliacoes = novoTotal;
    }
    persist();
    return req;
  }

  function avaliarComoProfissional(requestId, nota, comentario) {
    const req = requestById(requestId);
    if (!req) return null;
    req.avaliacaoProfissional = { nota: nota, comentario: comentario || '', criadoEm: nowIso() };
    req.historico.push(historicoItem('Profissional avaliou o cliente com nota ' + nota));
    persist();
    return req;
  }

  // ---------------------------------------------------------------
  // Fluxo do pedido — Profissional
  // ---------------------------------------------------------------

  function aceitarChamada(requestId, profissionalId) {
    const result = desbloquearChamado(requestId, profissionalId);
    return result && result.ok ? result.request : null;
  }

  function recusarChamada(requestId, profissionalId) {
    try {
      const list = dismissedCalls(profissionalId);
      if (list.indexOf(requestId) === -1) list.unshift(requestId);
      writeRaw(dismissedKey(profissionalId), JSON.stringify(list.slice(0, 200)));
    } catch (_) {}
    const req = requestById(requestId);
    if (!req) return null;
    req.recusadoPor = req.recusadoPor || [];
    if (req.recusadoPor.indexOf(profissionalId) === -1) req.recusadoPor.push(profissionalId);
    req.atualizadoEm = nowIso();
    req.historico.push(historicoItem('Um profissional dispensou a oportunidade'));
    persist();
    return req;
  }

  function enviarOrcamento(requestId, dados) {
    const req = requestById(requestId);
    if (!req) return null;
    const versaoAnterior = req.orcamento ? req.orcamento.versao : 0;
    req.orcamento = {
      maoDeObra: dados.maoDeObra, material: dados.material, total: dados.maoDeObra + dados.material,
      criadoEm: nowIso(), status: 'pendente', versao: versaoAnterior + 1,
    };
    if (typeof dados.taxaVisita === 'number') req.taxaVisita = dados.taxaVisita;
    req.status = STATUS.ORCAMENTO_ENVIADO;
    req.atualizadoEm = nowIso();
    req.historico.push(historicoItem('Orçamento enviado — ' + PU.formatCurrency(req.orcamento.total)));
    persist();
    return req;
  }

  function iniciarServico(requestId) {
    const req = requestById(requestId);
    if (!req || req.status !== STATUS.APROVADO) return null;
    req.status = STATUS.EM_ANDAMENTO;
    req.atualizadoEm = nowIso();
    req.historico.push(historicoItem('Profissional iniciou o serviço'));
    persist();
    return req;
  }

  function finalizarServico(requestId) {
    const req = requestById(requestId);
    if (!req || req.status !== STATUS.EM_ANDAMENTO) return null;
    req.status = STATUS.SERVICO_CONCLUIDO;
    req.atualizadoEm = nowIso();
    req.historico.push(historicoItem('Profissional marcou o serviço como concluído'));
    persist();
    return req;
  }

  function setOnlineStatus(profissionalId, online) {
    const p = profissionalById(profissionalId);
    if (!p) return null;
    p.online = !!online;
    persist();
    return p;
  }

  function atualizarPerfilProfissional(profissionalId, data) {
    const p = profissionalById(profissionalId);
    if (!p) return null;
    Object.assign(p, data);
    persist();
    return p;
  }

  function enviarDocumento(profissionalId, doc) {
    const p = profissionalById(profissionalId);
    if (!p) return null;
    p.documentos[doc] = true;
    if (p.statusAprovacao === 'reprovado') { p.statusAprovacao = 'pendente'; delete p.motivoReprovacao; }
    persist();
    return p;
  }

  // ---------------------------------------------------------------
  // Anúncios patrocinados
  // ---------------------------------------------------------------

  function adPlan(key) {
    const plans = (state.settings && state.settings.adPlans) || {};
    return plans[key] || plans.local || { nome: 'Local', valor: 7900, dias: 30 };
  }

  function anuncioById(id) { return (state.ads || []).find(function (a) { return a.id === id; }); }

  function isAdActive(a) {
    if (!a || a.status !== 'ativo' || a.pagamentoStatus !== 'aprovado') return false;
    if (a.inicioEm && new Date(a.inicioEm) > new Date()) return false;
    if (a.fimEm && new Date(a.fimEm) < new Date()) return false;
    return true;
  }

  function activeAdsForCity(cityId) {
    const rank = { premium: 0, destaque: 1, local: 2 };
    const max = Number((state.settings || {}).adMaxSlots || 4);
    return (state.ads || []).filter(function (a) {
      return isAdActive(a) && (a.cidadeId === 'all' || !cityId || a.cidadeId === cityId);
    }).sort(function (a, b) {
      const p = (rank[a.plano] == null ? 9 : rank[a.plano]) - (rank[b.plano] == null ? 9 : rank[b.plano]);
      if (p) return p;
      return new Date(b.aprovadoEm || b.criadoEm) - new Date(a.aprovadoEm || a.criadoEm);
    }).slice(0, max);
  }

  function criarAnuncio(dados) {
    const plan = adPlan(dados.plano || 'local');
    const ad = {
      id: PU.uid('ad'), empresa: String(dados.empresa || '').trim(), chamada: String(dados.chamada || '').trim(),
      cidadeId: dados.cidadeId || 'all', plano: dados.plano || 'local', imagem: dados.imagem || '',
      whatsapp: String(dados.whatsapp || '').trim(), link: String(dados.link || '').trim(),
      formaPagamento: dados.formaPagamento || 'pix', valorPago: Number(plan.valor || 0), pagamentoStatus: 'aprovado',
      status: 'aguardando_aprovacao', criadoEm: nowIso(), pagoEm: nowIso(), inicioEm: null, fimEm: null,
      impressoes: 0, cliques: 0, motivoReprovacao: ''
    };
    state.ads.push(ad);
    persist();
    return ad;
  }

  function registrarImpressoesAnuncios(ids) {
    const seen = {};
    (ids || []).forEach(function (id) {
      if (seen[id]) return;
      seen[id] = true;
      const a = anuncioById(id);
      if (a && isAdActive(a)) a.impressoes = Number(a.impressoes || 0) + 1;
    });
    persist();
  }

  function registrarCliqueAnuncio(id) {
    const a = anuncioById(id);
    if (!a) return null;
    a.cliques = Number(a.cliques || 0) + 1;
    persist();
    return a;
  }

  // ---------------------------------------------------------------
  // Administração
  // ---------------------------------------------------------------

  function aprovarProfissional(profissionalId) {
    const p = profissionalById(profissionalId);
    if (!p) return null;
    p.statusAprovacao = 'aprovado';
    delete p.motivoReprovacao;
    persist();
    return p;
  }
  function reprovarProfissional(profissionalId, motivo) {
    const p = profissionalById(profissionalId);
    if (!p) return null;
    p.statusAprovacao = 'reprovado';
    p.motivoReprovacao = motivo || 'Cadastro reprovado pelo administrador.';
    p.online = false;
    persist();
    return p;
  }
  function bloquearUsuario(role, id, bloqueado) {
    const u = role === 'cliente' ? clienteById(id) : profissionalById(id);
    if (!u) return null;
    u.bloqueado = !!bloqueado;
    if (bloqueado && role === 'profissional') u.online = false;
    persist();
    return u;
  }

  function criarCategoria(nome, icon) {
    const c = { id: PU.uid('cat'), nome: nome, icon: icon || 'tag', leadTier: 'padrao' };
    state.categories.push(c);
    persist();
    return c;
  }
  function removerCategoria(id) {
    state.categories = state.categories.filter(function (c) { return c.id !== id; });
    persist();
  }
  function criarCidade(nome, uf) {
    const c = { id: PU.uid('city'), nome: nome, uf: uf || 'MG' };
    state.cities.push(c);
    persist();
    return c;
  }
  function removerCidade(id) {
    state.cities = state.cities.filter(function (c) { return c.id !== id; });
    persist();
  }
  function setLeadFees(values) {
    state.settings.leadFees = state.settings.leadFees || {};
    ['padrao', 'medio', 'premium'].forEach(function (k) {
      if (values[k] != null) state.settings.leadFees[k] = Math.max(0, Number(values[k]) || 0);
    });
    if (values.prioridadeCliente != null) state.settings.prioridadeCliente = Math.max(0, Number(values.prioridadeCliente) || 0);
    persist();
    return state.settings;
  }

  function cancelamentos() {
    return state.requests.filter(function (r) { return r.status === STATUS.CANCELADO; }).sort(byCriadoDesc);
  }
  function pagamentos() {
    const eventos = [];
    state.requests.forEach(function (r) {
      if (r.leadUnlock && r.leadUnlock.status === 'pago') eventos.push({ tipo: 'Desbloqueio de chamado', valor: r.leadUnlock.valor, criadoEm: r.leadUnlock.criadoEm, request: r, profissionalId: r.leadUnlock.profissionalId });
      if (r.pagamentoPrioridade && r.pagamentoPrioridade.status) eventos.push({ tipo: 'Prioridade do cliente', valor: r.pagamentoPrioridade.valor, criadoEm: r.pagamentoPrioridade.criadoEm, request: r, profissionalId: null });
    });
    return eventos.sort(function (a, b) { return new Date(b.criadoEm) - new Date(a.criadoEm); });
  }

  function dashboardStats() {
    const reqs = state.requests;
    const emAndamento = reqs.filter(function (r) { return [STATUS.APROVADO, STATUS.EM_ANDAMENTO].indexOf(r.status) !== -1; }).length;
    const concluidos = reqs.filter(function (r) { return [STATUS.SERVICO_CONCLUIDO, STATUS.PAGO, STATUS.FINALIZADO].indexOf(r.status) !== -1; }).length;
    const cancelados = reqs.filter(function (r) { return r.status === STATUS.CANCELADO; }).length;
    const receitaProfissionais = reqs.reduce(function (sum, r) { return sum + (r.leadUnlock && r.leadUnlock.status === 'pago' ? Number(r.leadUnlock.valor || 0) : 0); }, 0);
    const receitaPrioridade = reqs.reduce(function (sum, r) { return sum + (r.pagamentoPrioridade && r.pagamentoPrioridade.status ? Number(r.pagamentoPrioridade.valor || 0) : 0); }, 0);
    return {
      totalClientes: state.users.clientes.length,
      totalProfissionais: state.users.profissionais.length,
      profissionaisPendentes: state.users.profissionais.filter(function (p) { return p.statusAprovacao === 'pendente'; }).length,
      pedidosAbertos: reqs.filter(function (r) { return [STATUS.BUSCANDO, STATUS.SEM_PROFISSIONAL, STATUS.AGUARDANDO_ORCAMENTO, STATUS.ORCAMENTO_ENVIADO].indexOf(r.status) !== -1; }).length,
      emAndamento: emAndamento, concluidos: concluidos, cancelados: cancelados,
      faturamento: receitaProfissionais + receitaPrioridade,
      receitaProfissionais: receitaProfissionais,
      receitaPrioridade: receitaPrioridade,
    };
  }

  global.DB = {
    STATUS, STATUS_LABEL, storageOk,
    load, persist, resetDemoData, getSession, setSession,
    categories, categoryById, cities, cityById,
    clienteById, profissionalById, adminById, findUserByEmail, emailExists,
    requestsByCliente, requestsByProfissional, requestById, allRequests, chamadasPendentes, leadFeeForRequest,
    reviewsForProfissional, transactionsForProfissional,
    cadastrarCliente, cadastrarProfissional, login, logout,
    criarPedido, buscarProfissional, cancelarPedido,
    aprovarOrcamento, recusarOrcamento, buscarOutroProfissional, pagarPedido, avaliarComoCliente, avaliarComoProfissional,
    aceitarChamada, recusarChamada, desbloquearChamado, recarregarCreditos, criarRecargaPendente, confirmarRecargaPendente, enviarOrcamento, iniciarServico, finalizarServico,

  async function submitAd(dados) {
    if (!client) throw new Error('Conexão com o Supabase indisponível.');
    const sRes = await client.auth.getSession();
    if (sRes.error) throw sRes.error;
    if (!sRes.data.session) throw new Error('Entre na sua conta antes de anunciar. Cliente e profissional podem anunciar.');
    const res = await client.rpc('qf_enviar_anuncio', {
      p_empresa: String(dados.empresa || '').trim(),
      p_chamada: String(dados.chamada || '').trim(),
      p_regiao: dados.cidadeId || 'all',
      p_plano: dados.plano || 'local',
      p_imagem_data: dados.imagem || '',
      p_whatsapp: String(dados.whatsapp || '').trim(),
      p_link: String(dados.link || '').trim() || null,
      p_metodo: dados.formaPagamento || 'pix'
    });
    if (res.error) throw res.error;
    const out = res.data || {};
    if (!out.ok) throw new Error(out.reason || 'Não foi possível enviar o anúncio.');
    if (!out.pagamento_id) throw new Error('Pagamento do anúncio não foi criado.');
    const checkout = await startEfiCheckout('anuncio', out.pagamento_id);

    out.charge_id = checkout.charge_id || null;
    out.provider = checkout.provider || 'efi';
    out.pagamento_status = checkout.status || out.pagamento_status || 'pendente';
    await syncPublicAds();
    const ad = DB.anuncioById(out.anuncio_id);
    return { ad: ad, pagamento: out };

  function pendingCpfKey(email) { return 'qf_pending_cpf_' + String(email || '').trim().toLowerCase(); }
  function pendingAddressKey(email) { return 'qf_pending_address_' + String(email || '').trim().toLowerCase(); }
  function pendingSelfieKey(email) { return 'qf_pending_selfie_' + String(email || '').trim().toLowerCase(); }
  async function saveCpf(cpf) {
    if (!client || !cpf) return null;

  async function saveClientAddress(endereco) {
    if (!client) throw new Error('Conexão indisponível.');
    const uRes = await client.auth.getUser();
    if (uRes.error || !uRes.data.user) throw new Error('Entre na sua conta para salvar o endereço.');
    const e = endereco || {};
    const row = {
      user_id: uRes.data.user.id,
      cep: global.QFGeo ? global.QFGeo.normalizeCep(e.cep) : String(e.cep || '').replace(/\D/g,''),
      rua: String(e.rua || '').trim(), bairro: String(e.bairro || '').trim(),
      cidade: String(e.cidade || '').trim(), uf: String(e.uf || '').trim().toUpperCase(),
      complemento: String(e.complemento || '').trim() || null,
      latitude: (e.latitude !== null && e.latitude !== undefined && String(e.latitude).trim() !== '' && Number.isFinite(Number(e.latitude)) && Math.abs(Number(e.latitude)) <= 90) ? Number(e.latitude) : null,
      longitude: (e.longitude !== null && e.longitude !== undefined && String(e.longitude).trim() !== '' && Number.isFinite(Number(e.longitude)) && Math.abs(Number(e.longitude)) <= 180) ? Number(e.longitude) : null,
      atualizado_em: new Date().toISOString()
    };
    const res = await client.from('qf_enderecos').upsert(row, { onConflict: 'user_id' }).select('*').single();

  async function loadOwnAddress() {

    if (uRes.error || !uRes.data.user) return null;

  async function applyPendingIdentity(email, role) {
    try {
      const k = pendingCpfKey(email); const cpf = localStorage.getItem(k);
      if (cpf) { await saveCpf(cpf); localStorage.removeItem(k); }
    } catch (e) { console.warn('QuemFaz CPF pendente', e); }
    try {
      const k2 = pendingAddressKey(email); const raw = localStorage.getItem(k2);
      if (raw) { await saveClientAddress(JSON.parse(raw)); localStorage.removeItem(k2); }
    } catch (e) { console.warn('QuemFaz endereço pendente', e); }
    try {
      const k3 = pendingSelfieKey(email); const selfie = localStorage.getItem(k3);
      if (selfie) {
        const uRes = await client.auth.getUser();
        if (uRes && uRes.data && uRes.data.user) {
          const up = await client.from('qf_profiles').update({ foto_url: selfie, atualizado_em: new Date().toISOString() }).eq('id', uRes.data.user.id);
          if (up.error) throw up.error;
          localStorage.removeItem(k3);
        }
      }
    } catch (e) { console.warn('QuemFaz selfie pendente', e); }
    try {
      const rawMarketing = localStorage.getItem('qf_marketing_attribution');
      if (rawMarketing && (role === 'cliente' || role === 'profissional')) {
        const marketing = JSON.parse(rawMarketing);
        const uRes = await client.auth.getUser();
        if (uRes && uRes.data && uRes.data.user) {
          const row = {
            user_id: uRes.data.user.id,
            role: role,
            source: String(marketing.source || '').slice(0, 120) || null,
            medium: String(marketing.medium || '').slice(0, 120) || null,
            campaign: String(marketing.campaign || '').slice(0, 240) || null,
            content: String(marketing.content || '').slice(0, 240) || null,
            term: String(marketing.term || '').slice(0, 240) || null,
            click_id: String(marketing.click_id || '').slice(0, 512) || null,
            landing_url: String(marketing.landing_url || '').slice(0, 2000) || null,
            referrer: String(marketing.referrer || '').slice(0, 2000) || null,
            first_seen_at: marketing.first_seen_at || new Date().toISOString(),
            updated_at: new Date().toISOString()
          };
          const mr = await client.from('qf_marketing_attribution').upsert(row, { onConflict: 'user_id' });
          if (mr.error) throw mr.error;
          localStorage.removeItem('qf_marketing_attribution');
          try {
            if (role === 'profissional' && typeof global.fbq === 'function') {
              global.fbq('track', 'CompleteRegistration', { content_name: 'QuemFaz Profissional' });
            }
          } catch (_) {}
        }
      }
    } catch (e) { console.warn('QuemFaz origem de marketing pendente', e); }
  }

  // V11.1: consulta leve para o profissional (só ids/status); a sincronização completa roda quando algo muda.
  async function professionalQuickSignature() {
    if (!client) return null;
    const res = await Promise.all([
      client.rpc('qf_listar_chamados_disponiveis'),
      client.from('qf_chamados_desbloqueados').select('id,status,atualizado_em')
    ]);
    if (res[0].error) throw res[0].error;
    if (res[1].error) throw res[1].error;
    const a = (res[0].data || []).map(function (r) { return r.id + ':' + r.status; }).sort();
    const u = (res[1].data || []).map(function (r) { return r.id + ':' + r.status + ':' + (r.atualizado_em || ''); }).sort();
    return a.join(',') + '|' + u.join(',');
  }

  async function syncForCurrentSession(force) {
    if (!enabled) return null;
    prepareLocalState();
    if (syncing) return syncing;
    if (!force && Date.now() - lastSyncAt < 1200) return DB.getSession();
    syncing = (async function () {
      try {
        await syncPublicAds();
        const sRes = await client.auth.getSession();
        if (sRes.error) throw sRes.error;
        const sbSession = sRes.data.session;
        if (!sbSession) {
          DB.setSession(null);
          clearRuntimeData();
          return null;
        }
        const user = sbSession.user;
        const profile = await ensureProfile(user, null, null);
        const role = profile.tipo;
        await applyPendingIdentity(user.email || '', role);
        const localUser = await syncLocalUser(user, role);
        DB.setSession({ role: role, userId: user.id });
        if (role === 'cliente') await syncClientCalls(user.id);
        if (role === 'profissional') await syncProfessionalCalls(user.id);
        lastSyncAt = Date.now();
        return { role: role, userId: user.id, user: localUser };
      } finally {
        syncing = null;
      }
    })();
    return syncing;
  }

  function traduzErroAuth(msg) {
    msg = String(msg || '');
    if (/already registered|already exists/i.test(msg)) return 'Este e-mail já está cadastrado. Entre na sua conta.';
    if (/at least 6/i.test(msg)) return 'A senha precisa ter pelo menos 6 caracteres.';
    if (/invalid email|valid email/i.test(msg)) return 'Digite um e-mail válido.';
    if (/rate limit|too many/i.test(msg)) return 'Muitas tentativas. Aguarde um minuto e tente novamente.';
    return msg || 'Não foi possível criar a conta.';
  }
  async function signUp(role, data) {
    if (!enabled) return { ok: false, error: 'Não foi possível carregar a conexão com o banco.' };
    if (String(data.senha || '').length < 6) return { ok: false, error: 'A senha precisa ter pelo menos 6 caracteres.' };
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(data.email || ''))) return { ok: false, error: 'Digite um e-mail válido.' };
    if (!String(data.nome || '').trim()) return { ok: false, error: 'Informe seu nome.' };
    if (role === 'profissional' && !/^data:image\//i.test(String(data.selfieData || ''))) {
      return { ok: false, error: 'A selfie é obrigatória para concluir o cadastro profissional.' };
    }
    const city = data.cidadeId ? cityFromId(data.cidadeId) : null;
    const cityName = String(data.cidade || (city ? city.nome : '') || '').trim() || null;
    const cityUf = String(data.uf || (city ? city.uf : '') || '').trim().toUpperCase() || null;
    const meta = {
      qf_role: role,
      qf_nome: data.nome,
      qf_telefone: data.telefone || '',
      qf_cidade: cityName,
      qf_uf: cityUf,
      qf_categorias: data.categorias || [],
      qf_raio_km: data.raioKm || 10
    };
    if (data.cpf) { try { localStorage.setItem(pendingCpfKey(data.email), data.cpf); } catch (_) {} }
    if (data.endereco) { try { localStorage.setItem(pendingAddressKey(data.email), JSON.stringify(data.endereco)); } catch (_) {} }
    if (role === 'profissional' && data.selfieData) {
      try { localStorage.setItem(pendingSelfieKey(data.email), data.selfieData); } catch (_) {}
    }
    const res = await client.auth.signUp({
      email: data.email,
      password: data.senha,
      options: { data: meta }
    });
    if (res.error) return { ok: false, error: traduzErroAuth(res.error.message) };
    if (!res.data.session) {
      return { ok: true, needsConfirmation: true, user: res.data.user };
    }
    try {
      await ensureProfile(res.data.user, role, data);
      await applyPendingIdentity(data.email, role);
      const local = await syncLocalUser(res.data.user, role);
      DB.setSession({ role: role, userId: res.data.user.id });      if (role === 'cliente') await syncClientCalls(res.data.user.id); else await syncProfessionalCalls(res.data.user.id);
      return { ok: true, user: local, session: DB.getSession() };
    } catch (e) {
      return { ok: false, error: e.message || String(e) };
    }
  }

  async function signIn(expectedRole, email, senha) {
    if (!enabled) return { ok: false, error: 'Não foi possível carregar a conexão com o banco.' };
    const res = await client.auth.signInWithPassword({ email: email, password: senha });
    if (res.error) return { ok: false, error: 'E-mail ou senha inválidos.' };
    try {
      const p = await ensureProfile(res.data.user, expectedRole, null);
      await applyPendingIdentity(email, p.tipo);
      if (p.tipo !== expectedRole) {
        await client.auth.signOut();
        DB.setSession(null);
        return { ok: false, error: 'Esta conta está cadastrada como ' + (p.tipo === 'cliente' ? 'cliente' : 'profissional') + '.' };
      }
      const local = await syncLocalUser(res.data.user, p.tipo);
      DB.setSession({ role: p.tipo, userId: res.data.user.id });
      if (p.tipo === 'cliente') await syncClientCalls(res.data.user.id); else await syncProfessionalCalls(res.data.user.id);
      lastSyncAt = Date.now();
      return { ok: true, user: local, session: DB.getSession() };
    } catch (e) {
      return { ok: false, error: e.message || String(e) };
    }
  }

  async function requestPasswordReset(email) {
    if (!enabled || !client) return { ok: false, error: 'Não foi possível carregar a conexão com o banco.' };
    email = String(email || '').trim();
    if (!email || email.indexOf('@') < 1 || email.indexOf('.') < 3) return { ok: false, error: 'Digite um e-mail válido.' };
    const redirectTo = location.origin + location.pathname;
    const res = await client.auth.resetPasswordForEmail(email, { redirectTo: redirectTo });
    if (res.error) {
      const msg = String(res.error.message || '');
      if (/rate limit|too many/i.test(msg)) return { ok: false, error: 'Muitas tentativas. Aguarde um minuto e tente novamente.' };
      return { ok: false, error: 'Não foi possível enviar o link agora. Tente novamente.' };
    }
    return { ok: true };
  }

  async function updatePassword(newPassword) {
    if (!enabled || !client) return { ok: false, error: 'Não foi possível carregar a conexão com o banco.' };
    newPassword = String(newPassword || '');
    if (newPassword.length < 6) return { ok: false, error: 'A nova senha precisa ter pelo menos 6 caracteres.' };
    const res = await client.auth.updateUser({ password: newPassword });
    if (res.error) return { ok: false, error: String(res.error.message || 'Não foi possível atualizar a senha.') };
    try { sessionStorage.removeItem('qf_password_recovery'); } catch (_) {}
    return { ok: true };

  async function startEfiCheckout(tipo, pagamentoId) {
    const sess = DB.getSession();
    const route = tipo === 'prioridade'
      ? '#/cliente/pedidos'
      : (tipo === 'recarga'
        ? '#/profissional/carteira'
        : (sess && sess.role === 'profissional' ? '#/profissional/home' : '#/cliente/home'));
    const returnUrl = location.origin + location.pathname + route;
    const fn = await client.functions.invoke('quemfaz-efi-checkout', {
      body: { tipo: tipo, pagamento_id: pagamentoId, return_url: returnUrl }
    });
    if (fn.error) throw new Error(fn.error.message || 'Não foi possível iniciar o pagamento.');
    const out = fn.data || {};
    if (!out.ok) {
      if (out.error === 'efi_not_configured') throw new Error('Efí Bank ainda não está configurado no servidor.');
      throw new Error(out.error || 'Não foi possível gerar o checkout.');
    }
    return out;
  }

  async function createRecharge(valorCentavos, metodo) {

    };

  async function createCall(data) {
    const city = cityFromId(data.endereco.cidadeId);
    const cat = DB.categoryById(data.categoriaId);
    const enderecoCompleto = [data.endereco.rua, data.endereco.complemento].filter(Boolean).join(' · ');
    const rawLat = data.endereco.latitude;
    const rawLng = data.endereco.longitude;
    const hasAddressCoords =
      rawLat !== null && rawLat !== undefined && String(rawLat).trim() !== '' &&
      rawLng !== null && rawLng !== undefined && String(rawLng).trim() !== '' &&
      Number.isFinite(Number(rawLat)) && Number.isFinite(Number(rawLng)) &&
      Math.abs(Number(rawLat)) <= 90 && Math.abs(Number(rawLng)) <= 180 &&
      !(Number(rawLat) === 0 && Number(rawLng) === 0);
    const loc = hasAddressCoords
      ? { latitude: Number(rawLat), longitude: Number(rawLng) }
      : await getCurrentPositionSafe({ timeout: 7000, maximumAge: 20000 });
    // O chamado nasce NORMAL. Prioridade só é ativada no banco depois de pagamento aprovado.
    const row = {
      cliente_id: data.clienteId,
      categoria: data.categoriaId,
      titulo: cat ? cat.nome : 'Serviço solicitado',
      descricao: data.descricao,
      cidade: data.endereco.cidade || (city ? city.nome : null),
      uf: data.endereco.uf || (city ? city.uf : null),
      bairro: data.endereco.bairro || null,
      cep: global.QFGeo ? global.QFGeo.normalizeCep(data.endereco.cep) : String(data.endereco.cep || '').replace(/\D/g,''),
      endereco_completo: enderecoCompleto || null,
      latitude: loc ? loc.latitude : null,
      longitude: loc ? loc.longitude : null,
      fotos: Array.isArray(data.fotos) ? data.fotos.slice(0, 4) : [],
      status: 'aberto',
      prioridade: false
    };
    const res = await client.from('qf_chamados').insert(row).select('*').single();
    if (res.error) throw res.error;
    await client.from('qf_profiles').update({ cidade: row.cidade, uf: row.uf, atualizado_em: new Date().toISOString() }).eq('id', data.clienteId);
    try { await saveClientAddress(Object.assign({}, data.endereco, { latitude: row.latitude, longitude: row.longitude })); } catch (_) {}
    const req = requestFromCloud(res.data, null);
    req.fotos = Array.isArray(data.fotos) ? data.fotos.slice(0, 4) : [];

    if (data.prioridade) {
      const pay = await client.rpc('qf_solicitar_prioridade', {
        p_chamado_id: res.data.id,
        p_metodo: data.prioridadeMetodo || 'pix'
      });
      if (pay.error) {
        req.pagamentoPrioridade = { status: 'erro', valor: DB.state.settings.prioridadeCliente || 690, erro: pay.error.message };
      } else {
        const out = pay.data || {};
        req.pagamentoPrioridade = {
          id: out.pagamento_id || null,
          status: out.status || 'pendente',
          valor: Number(out.valor_centavos || DB.state.settings.prioridadeCliente || 690),
          checkoutUrl: out.checkout_url || null,
          criadoEm: new Date().toISOString()
        };
        req.prioridade = !!out.prioridade_ativa;
        if (!req.prioridade && req.pagamentoPrioridade.id && !req.pagamentoPrioridade.checkoutUrl) {
          try {
            const checkout = await startEfiCheckout('prioridade', req.pagamentoPrioridade.id);
            req.pagamentoPrioridade.checkoutUrl = checkout.checkout_url || null;
          } catch (checkoutErr) {
            req.pagamentoPrioridade.erro = checkoutErr && checkoutErr.message ? checkoutErr.message : String(checkoutErr || '');
          }
        }
      }
    }

    DB.state.requests = DB.state.requests.filter(function (x) { return x.id !== req.id; });
    DB.state.requests.unshift(req);
    const localClient = DB.clienteById(data.clienteId);
    if (localClient) localClient.enderecos = [data.endereco];
    DB.persist();
    if (global.QFPush) {
      try { await global.QFPush.notify('new_call', req.id); }
      catch (pushErr) { console.warn('QuemFaz push do novo chamado', pushErr); }
    }
    return req;
  }

  async function unlockCall(chamadoId, profissionalId) {
    const res = await client.rpc('qf_desbloquear_chamado', { p_chamado_id: chamadoId });
    if (res.error) return { ok: false, reason: 'erro', error: res.error.message };
    const out = res.data || {};
    if (!out.ok) {

        return { ok: false, reason: 'saldo', valor: Number(out.preco_centavos || 0), saldo: Number(out.saldo_centavos || 0) };
      }
      return { ok: false, reason: out.reason || 'indisponivel' };
    }
    const uRes = await client.auth.getUser();
    if (uRes.error || !uRes.data || !uRes.data.user) {
      return { ok: false, reason: 'sessao', error: 'Sessão expirada. Entre novamente.' };
    }
    await syncLocalUser(uRes.data.user, 'profissional');
    await syncProfessionalCalls(profissionalId);
    const req = DB.requestById(chamadoId);
    const prof = DB.profissionalById(profissionalId);
    if (global.QFPush) global.QFPush.notify('professional_connected', chamadoId).catch(function () {});
    return {
      ok: true,

    const cleanAreas = (areas || []).map(function (a) {
      return {
        cidade: String(a.cidade || '').trim(),
        uf: String(a.uf || '').trim().toUpperCase(),
        raioKm: Math.max(1, Math.min(300, Number(a.raioKm || 10)))
      };
    }).filter(function (a) { return a.cidade && a.uf; });
    if (!cleanAreas.length) throw new Error('Adicione pelo menos uma cidade de atendimento.');

    const pr = await client.from('qf_profissionais').update({
      especialidades: Array.isArray(categorias) ? categorias : [],
      raio_km: cleanAreas[0].raioKm,
      atualizado_em: new Date().toISOString()
    }).eq('user_id', uid);
    if (pr.error) throw pr.error;

    const del = await client.from('qf_profissional_cidades').delete().eq('profissional_id', uid);
    if (del.error) throw del.error;
    const ins = await client.from('qf_profissional_cidades').insert(cleanAreas.map(function (a) {
      return { profissional_id: uid, cidade: a.cidade, uf: a.uf, raio_km: a.raioKm };
    }));
    if (ins.error) throw ins.error;

    const first = cleanAreas[0];
    const prof = await client.from('qf_profiles').update({
      cidade: first.cidade,
      uf: first.uf,
      atualizado_em: new Date().toISOString()
    }).eq('id', uid);
    if (prof.error) throw prof.error;

    const local = await syncLocalUser(uRes.data.user, 'profissional');
    if (local.online) await syncProfessionalCalls(uid);
    return local;
  }

  function roleCard(role) {
    const m = ROLE_META[role];
    return (
      '<button class="role-card" data-nav="/auth/' + role + '/login" style="width:100%;">' +
        '<div class="icon-tile icon-tile--lg' + (role === 'profissional' ? ' icon-tile--orange' : '') + '">' + icon(m.iconName) + '</div>' +
        '<div class="role-card__body">' +
          '<div class="row-between" style="gap:8px;align-items:center;">' +
            '<div class="role-card__title">' + m.titulo + '</div>' +
            (role === 'cliente' ? '<span class="badge badge--success" style="font-size:10px;padding:4px 8px;">GRÁTIS</span>' : '') +
          '</div>' +
          '<div class="role-card__sub">' + (role === 'cliente' ? 'Publique seu pedido sem pagar e receba orçamentos.' : m.sub) + '</div>' +
        '</div>' +
        icon('chevronRight', 'list-item__chevron')
      + '</button>'
    );
  }

  Screens.authLogin = function (params) {
    const role = params.role;
    const m = ROLE_META[role];
    if (!m) return Screens.landing();
    return (
      '<div class="view stack--lg">' +
        backRow('/', null) +
        '<div class="stack--sm" style="text-align:center;">' +
          '<div class="icon-tile icon-tile--lg' + (role === 'profissional' ? ' icon-tile--orange' : '') + '" style="margin:6px auto 0;">' + icon(m.iconName) + '</div>' +
          '<h1 class="h1" style="text-align:center;">' + m.titulo + '</h1>' +
          '<p class="text text--secondary" style="text-align:center;">Entre com o e-mail e a senha da sua conta.</p>' +
        '</div>' +
        '<form id="login-form" class="stack" novalidate>' +
          field('E-mail', '<input class="input" type="email" name="email" autocomplete="email" inputmode="email" required placeholder="voce@exemplo.com">') +
          field('Senha', '<input class="input" type="password" name="senha" autocomplete="current-password" required placeholder="Sua senha">') +
          (role !== 'admin' ? '<button class="btn btn--ghost btn--block-auto" type="button" id="qf-forgot-password" style="align-self:flex-end;padding:6px 0;">Esqueci minha senha</button>' : '') +
          '<button class="btn btn--primary" type="submit">Entrar</button>' +
        '</form>' +
        (role !== 'admin'
          ? '<div class="divider-label">ou</div><button class="btn btn--outline" data-nav="/auth/' + role + '/cadastro">Criar conta de ' + (role === 'cliente' ? 'cliente' : 'profissional') + '</button>'
          : '<p class="text text--sm text--muted" style="text-align:center;">Acesso administrativo único e pré-configurado para esta demonstração.</p>') +
      '</div>'
    );
  };

  Screens.authCadastro = function (params) {
    const role = params.role;
    if (role === 'cliente') return cadastroClienteView();
    if (role === 'profissional') return cadastroProfissionalView();
    return Screens.landing();
  };

  function cadastroClienteView() {
    return (
      '<div class="view stack--lg">' +
        backRow('/auth/cliente/login', 'Criar conta') +
        '<form id="cadastro-cliente-form" class="stack" novalidate>' +
          field('Nome completo', '<input class="input" name="nome" required placeholder="Seu nome">') +
          field('E-mail', '<input class="input" type="email" name="email" required placeholder="voce@exemplo.com">') +
          field('WhatsApp / celular', '<input class="input" name="telefone" type="tel" inputmode="tel" autocomplete="tel" required placeholder="(35) 99999-0000">') +
          field('CPF', '<input class="input" name="cpf" inputmode="numeric" required maxlength="14" placeholder="000.000.000-00">') +
          field('Senha', '<input class="input" type="password" name="senha" required minlength="6" autocomplete="new-password" placeholder="Mínimo 6 caracteres">') +
          '<button class="btn btn--primary" type="submit" style="margin-top:6px;">Criar conta</button>' +
        '</form>' +
      '</div>'
    );
  }

            '<label class="btn btn--outline" style="cursor:pointer;">' + icon('camera') + ' Tirar selfie agora<input type="file" id="cadastro-prof-selfie" accept="image/*" capture="user" style="display:none;"></label>' +
            '<div class="text--sm text--secondary">Sem esta foto você não consegue criar a conta, ficar online nem desbloquear chamados.</div>' +

            '<p class="text text--sm" style="color:var(--navy-800);">A selfie fica vinculada ao cadastro e é usada para segurança. Ela também pode aparecer ao cliente quando você assumir um chamado. Seu CPF nunca é mostrado ao cliente.</p><div class="row" style="margin-top:10px;align-items:flex-start;"><div class="icon-tile icon-tile--orange" style="width:34px;height:34px;">' + icon('wallet') + '</div><div><div class="text--strong" style="color:var(--navy-900);">Chamados são desbloqueados com créditos</div><div class="text--sm text--secondary">Você começa com R$ 25,00 em créditos de lançamento. Use esse saldo para desbloquear oportunidades e depois recarregue quando precisar.</div></div></div>' +

  }

  function validPhone(v) { const d = String(v || '').replace(/\D/g, '').replace(/^55(?=\d{10,11}$)/, ''); return d.length === 10 || d.length === 11; }
  function field(label, controlHtml) {
    return '<label class="field"><span class="field__label">' + label + '</span>' + controlHtml + '</label>';
  }
  function backRow(to, title) {
    return '<div class="row">' +
      '<button class="topbar__back" data-nav="' + to + '" aria-label="Voltar">' + icon('chevronLeft') + '</button>' +
      (title ? '<h1 class="h2">' + title + '</h1>' : '') +
      '</div>';
  }

  // ---------------- Recuperação de senha ----------------

  function openPasswordRecovery(prefillEmail) {
    const prefill = PU.escapeHtml(String(prefillEmail || '').trim());
    PU.openSheet(
      '<div class="stack"><h3 class="sheet__title">Recuperar senha</h3>' +
      '<p class="text text--secondary">Digite o e-mail cadastrado. Vamos enviar um link para você criar uma nova senha.</p>' +
      '<form id="qf-password-recovery-form" class="stack">' +
      '<label class="field"><span class="field__label">E-mail</span><input class="input" type="email" name="email" autocomplete="email" required placeholder="voce@exemplo.com" value="' + prefill + '"></label>' +
      '<button class="btn btn--primary" type="submit">Enviar link de recuperação</button>' +
      '<button class="btn btn--ghost" type="button" id="qf-password-recovery-cancel">Cancelar</button>' +
      '</form></div>'
    );
    const form = document.getElementById('qf-password-recovery-form');
    const cancel = document.getElementById('qf-password-recovery-cancel');
    if (cancel) cancel.onclick = function () { PU.closeSheet(); };
    if (!form) return;
    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      const email = String(new FormData(form).get('email') || '').trim();
      const btn = form.querySelector('button[type="submit"]');
      if (btn) { btn.disabled = true; btn.textContent = 'Enviando...'; }
      try {
        if (!(global.QFCloud && global.QFCloud.enabled && global.QFCloud.requestPasswordReset)) {
          PU.toast('A recuperação de senha precisa de conexão com a internet.', 'danger');
          return;
        }
        const res = await global.QFCloud.requestPasswordReset(email);
        if (!res.ok) { PU.toast(res.error || 'Não foi possível enviar o link.', 'danger'); return; }
        PU.openSheet(
          '<div class="stack"><h3 class="sheet__title">Confira seu e-mail</h3>' +
          '<p class="text text--secondary">Se esse e-mail estiver cadastrado no QuemFaz, você receberá um link para criar uma nova senha.</p>' +
          '<button class="btn btn--primary" id="qf-password-recovery-done">Entendi</button></div>'
        );
        const done = document.getElementById('qf-password-recovery-done');
        if (done) done.onclick = function () { PU.closeSheet(); };
      } finally {
        if (btn) { btn.disabled = false; btn.textContent = 'Enviar link de recuperação'; }
      }
    });
  }

  let newPasswordSheetOpen = false;
  async function openNewPassword() {
    if (newPasswordSheetOpen || document.getElementById('qf-new-password-form')) return;
    if (!(global.QFCloud && global.QFCloud.enabled && global.QFCloud.updatePassword)) return;
    newPasswordSheetOpen = true;
    PU.openSheet(
      '<div class="stack"><h3 class="sheet__title">Crie uma nova senha</h3>' +
      '<p class="text text--secondary">Digite sua nova senha para voltar a acessar o QuemFaz.</p>' +
      '<form id="qf-new-password-form" class="stack">' +
      '<label class="field"><span class="field__label">Nova senha</span><input class="input" type="password" name="senha" minlength="6" autocomplete="new-password" required placeholder="Mínimo 6 caracteres"></label>' +
      '<label class="field"><span class="field__label">Confirmar nova senha</span><input class="input" type="password" name="confirmar" minlength="6" autocomplete="new-password" required placeholder="Digite novamente"></label>' +
      '<button class="btn btn--primary" type="submit">Salvar nova senha</button>' +
      '</form></div>',
      { persistent: true }
    );
    const form = document.getElementById('qf-new-password-form');
    if (!form) { newPasswordSheetOpen = false; return; }
    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      const fd = new FormData(form);
      const senha = String(fd.get('senha') || '');
      const confirmar = String(fd.get('confirmar') || '');
      if (senha.length < 6) { PU.toast('A senha precisa ter pelo menos 6 caracteres.', 'danger'); return; }
      if (senha !== confirmar) { PU.toast('As senhas não são iguais.', 'danger'); return; }
      const btn = form.querySelector('button[type="submit"]');
      if (btn) { btn.disabled = true; btn.textContent = 'Salvando...'; }
      try {
        const res = await global.QFCloud.updatePassword(senha);
        if (!res.ok) { PU.toast(res.error || 'Não foi possível atualizar a senha.', 'danger'); return; }
        newPasswordSheetOpen = false;
        PU.closeSheet();
        PU.toast('Senha atualizada com sucesso.', 'success');
      } finally {
        if (btn) { btn.disabled = false; btn.textContent = 'Salvar nova senha'; }
      }
    });
  }

  global.QFPasswordRecovery = { openRequest: openPasswordRecovery, openNewPassword: openNewPassword };
  global.addEventListener('qf-password-recovery', function () { setTimeout(openNewPassword, 0); });

  // ---------------- Vínculo pós-render (rotas anônimas) ----------------

  Screens.afterRenderAnon = function (pattern, content, params) {
    if (pattern === '/') {
      content.addEventListener('click', function (e) {
        const cat=e.target.closest('[data-landing-cat]');
        if(cat){try{sessionStorage.setItem('qf_pending_category',cat.getAttribute('data-landing-cat'));}catch(_){} global.navigate('/auth/cliente/login',true);return;}
        if(e.target.closest('[data-action="landing-login"]')){PU.openSheet('<div class="stack"><h3 class="sheet__title">Entrar no QuemFaz</h3><button class="btn btn--primary" id="qf-login-cliente">Entrar como cliente</button><button class="btn btn--outline" id="qf-login-prof">Entrar como profissional</button></div>');const c=document.getElementById('qf-login-cliente'),p=document.getElementById('qf-login-prof');if(c)c.onclick=function(){PU.closeSheet();global.navigate('/auth/cliente/login',true)};if(p)p.onclick=function(){PU.closeSheet();global.navigate('/auth/profissional/login',true)};return;}
        if(e.target.closest('[data-action="landing-all-services"]')) global.navigate('/auth/cliente/login',true);
      });
    }
    if (pattern === '/auth/:role/login') {
      const form = content.querySelector('#login-form');
      const forgot = content.querySelector('#qf-forgot-password');
      if (forgot) forgot.addEventListener('click', function () {
        const emailInput = form && form.querySelector('[name="email"]');
        openPasswordRecovery(emailInput ? emailInput.value : '');
      });
      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        const fd = new FormData(form);
        const btn = form.querySelector('button[type="submit"]');
        if (btn) btn.disabled = true;
        try {
          const res = (global.QFCloud && global.QFCloud.enabled)
            ? await global.QFCloud.signIn(params.role, fd.get('email').trim(), fd.get('senha'))
            : DB.login(params.role, fd.get('email').trim(), fd.get('senha'));
          if (!res.ok) { PU.toast(res.error || 'Não foi possível entrar.', 'danger'); return; }
          PU.toast('Bem-vindo(a), ' + res.user.nome.split(' ')[0] + '!', 'success');
          if (sessionStorage.getItem('qf_pending_ad_draft')) {
            global.navigate('/' + params.role + '/anuncie', true);
            return;
          }
          if (params.role === 'cliente') {
            const pendingCat=sessionStorage.getItem('qf_pending_category');
            if(pendingCat){sessionStorage.removeItem('qf_pending_category');global.navigate('/cliente/novo-pedido/'+encodeURIComponent(pendingCat),true);return;}
          }
          global.navigate('/' + params.role + '/home', true);
        } finally {
          if (btn) btn.disabled = false;
        }
      });
    }

    if (pattern === '/auth/:role/cadastro' && params.role === 'cliente') {
      const form = content.querySelector('#cadastro-cliente-form');
      global.QFGeo.bindAddressForm(form);
      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        const fd = new FormData(form);
        const cpf = fd.get('cpf').trim();
        if (!global.QFGeo.validCpf(cpf)) { PU.toast('Digite um CPF válido.', 'danger'); return; }
        if (!validPhone(fd.get('telefone'))) { PU.toast('Informe um WhatsApp/celular com DDD.', 'danger'); return; }
        const dados = { nome: fd.get('nome').trim(), email: fd.get('email').trim(), senha: fd.get('senha'), telefone: fd.get('telefone').trim(), cpf: cpf };
        const btn = form.querySelector('button[type="submit"]');
        if (btn) btn.disabled = true;
        try {
          if (global.QFCloud && global.QFCloud.enabled) {
            const res = await global.QFCloud.signUp('cliente', dados);
            if (!res.ok) { PU.toast(res.error || 'Não foi possível criar a conta.', 'danger'); return; }
            if (res.needsConfirmation) {
              PU.toast('Conta criada. Confirme o e-mail e depois entre no QuemFaz.', 'success');
              global.navigate('/auth/cliente/login', true);
              return;
            }
            PU.toast('Conta criada com sucesso!', 'success');
            if (sessionStorage.getItem('qf_pending_ad_draft')) {
              global.navigate('/cliente/anuncie', true);
              return;
            }
            const pendingCat=sessionStorage.getItem('qf_pending_category');
            if(pendingCat){sessionStorage.removeItem('qf_pending_category');global.navigate('/cliente/novo-pedido/'+encodeURIComponent(pendingCat),true);return;}
            global.navigate('/cliente/home', true);
            return;
          }
          const user = DB.cadastrarCliente(dados);
          DB.setSession({ role: 'cliente', userId: user.id });
          PU.toast('Conta criada com sucesso!', 'success');
          if (sessionStorage.getItem('qf_pending_ad_draft')) {
            global.navigate('/cliente/anuncie', true);
            return;
          }
          const pendingCat=sessionStorage.getItem('qf_pending_category');
          if(pendingCat){sessionStorage.removeItem('qf_pending_category');global.navigate('/cliente/novo-pedido/'+encodeURIComponent(pendingCat),true);return;}
          global.navigate('/cliente/home', true);
        } finally {
          if (btn) btn.disabled = false;
        }
      });
    }

    if (pattern === '/auth/:role/cadastro' && params.role === 'profissional') {
      const form = content.querySelector('#cadastro-prof-form');
      global.QFGeo.bindAddressForm(form);
      const chipsWrap = content.querySelector('#cadastro-prof-cats');
      const hiddenInput = content.querySelector('#cadastro-prof-cats-input');
      const selfieInput = content.querySelector('#cadastro-prof-selfie');
      const selfiePreview = content.querySelector('#cadastro-selfie-preview');
      const selfieImg = content.querySelector('#cadastro-selfie-img');
      let selfieData = '';
      let selected = [];
      if (selfieInput) selfieInput.addEventListener('change', async function () {
        const file = selfieInput.files && selfieInput.files[0];
        if (!file) { selfieData = ''; return; }
        try {
          selfieData = await PU.fileToCompressedDataUrl(file, 480);
          if (!/^data:image\//i.test(selfieData)) throw new Error('Foto inválida.');
          if (selfieImg) selfieImg.src = selfieData;
          if (selfiePreview) selfiePreview.style.display = 'block';
          PU.toast('Selfie registrada para o cadastro.', 'success');
        } catch (err) {
          selfieData = '';
          selfieInput.value = '';
          if (selfiePreview) selfiePreview.style.display = 'none';
          PU.toast((err && err.message) || 'Não foi possível processar a selfie.', 'danger');
        }
      });
      chipsWrap.addEventListener('click', function (e) {
        const chip = e.target.closest('[data-chip-cat]');
        if (!chip) return;
        const id = chip.getAttribute('data-chip-cat');
        if (selected.indexOf(id) === -1) selected.push(id); else selected = selected.filter(function (x) { return x !== id; });
        chip.classList.toggle('is-selected');
        hiddenInput.value = selected.join(',');
      });
      const raioRange = content.querySelector('#raio-range');
      const raioValor = content.querySelector('#raio-valor');
      raioRange.addEventListener('input', function () { raioValor.textContent = raioRange.value; });

      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        const fd = new FormData(form);
        if (!selfieData) {
          PU.toast('A selfie é obrigatória. Tire a foto antes de criar a conta.', 'danger');
          if (selfieInput) selfieInput.click();
          return;
        }
        if (!selected.length) { PU.toast('Selecione ao menos uma categoria de serviço.', 'danger'); return; }
        const cpf = fd.get('cpf').trim();
        if (!global.QFGeo.validCpf(cpf)) { PU.toast('Digite um CPF válido.', 'danger'); return; }
        if (!validPhone(fd.get('telefone'))) { PU.toast('Informe um WhatsApp/celular com DDD.', 'danger'); return; }
        if (!global.QFGeo.normalizeCep(fd.get('cep'))) { PU.toast('Digite um CEP válido da sua base.', 'danger'); return; }
        const dados = {
          nome: fd.get('nome').trim(), email: fd.get('email').trim(), senha: fd.get('senha'), telefone: fd.get('telefone').trim(), cpf: cpf,
          categorias: selected, cidade: fd.get('cidade').trim(), uf: fd.get('uf'), cep: fd.get('cep').trim(),
          latitude: Number(fd.get('latitude')) || null, longitude: Number(fd.get('longitude')) || null, raioKm: Number(fd.get('raioKm')),
          taxaVisitaPadrao: PU.parseCurrencyInput(fd.get('taxaVisita')),
          selfieData: selfieData
        };
        const btn = form.querySelector('button[type="submit"]');
        if (btn) btn.disabled = true;
        try {
          if (global.QFCloud && global.QFCloud.enabled) {
            const res = await global.QFCloud.signUp('profissional', dados);
            if (!res.ok) { PU.toast(res.error || 'Não foi possível criar a conta.', 'danger'); return; }
            if (res.needsConfirmation) {
              PU.toast('Cadastro com selfie registrado. Confirme o e-mail e depois entre no QuemFaz.', 'success');
              global.navigate('/auth/profissional/login', true);
              return;
            }
            PU.toast('Cadastro criado com selfie de segurança!', 'success');
            if (sessionStorage.getItem('qf_pending_ad_draft')) {
              global.navigate('/profissional/anuncie', true);
              return;
            }
            global.navigate('/profissional/home', true);
            return;
          }
          const foundCity = DB.cities().find(function (c) { return String(c.nome).toLowerCase() === String(dados.cidade).toLowerCase() && c.uf === dados.uf; });
          const localCity = foundCity || DB.criarCidade(dados.cidade, dados.uf);          dados.cidadeId = localCity.id;
          const user = DB.cadastrarProfissional(dados);
          DB.setSession({ role: 'profissional', userId: user.id });
          PU.toast('Cadastro criado! Adicione créditos para desbloquear oportunidades.', 'success');
          if (sessionStorage.getItem('qf_pending_ad_draft')) {
            global.navigate('/profissional/anuncie', true);
            return;
          }
          global.navigate('/profissional/home', true);
        } finally {
          if (btn) btn.disabled = false;
        }
      });
    }
  };
})(window);


/* QuemFaz — telas da área Cliente */

(function (global) {
  const DB = global.DB, PU = global.PU, icon = global.icon, Screens = global.Screens;
  const STATUS = DB.STATUS;

  const ACTIVE_STATUSES = [
    STATUS.BUSCANDO, STATUS.SEM_PROFISSIONAL, STATUS.AGUARDANDO_ACEITE, STATUS.AGUARDANDO_ORCAMENTO,
    STATUS.ORCAMENTO_ENVIADO, STATUS.ORCAMENTO_RECUSADO, STATUS.APROVADO, STATUS.EM_ANDAMENTO, STATUS.SERVICO_CONCLUIDO, STATUS.PAGO,
  ];
  function hiddenHistoryKey(role, userId) { return 'quemfaz_hidden_history_v1_' + role + '_' + userId; }
  function loadHiddenHistory(role, userId) {
    try { return JSON.parse(localStorage.getItem(hiddenHistoryKey(role, userId)) || '[]') || []; } catch (_) { return []; }
  }
  function hideHistoryItem(role, userId, requestId) {
    const ids = loadHiddenHistory(role, userId);
    if (ids.indexOf(requestId) === -1) ids.push(requestId);
    try { localStorage.setItem(hiddenHistoryKey(role, userId), JSON.stringify(ids.slice(-250))); } catch (_) {}
  }

  function statusBadge(status) {
    const label = DB.STATUS_LABEL[status] || status;
    const map = {
      buscando: 'orange', sem_profissional: 'danger', aguardando_aceite: 'orange', aguardando_orcamento: 'orange',
      orcamento_enviado: 'navy', orcamento_recusado: 'danger', aprovado: 'success', em_andamento: 'success',
      servico_concluido: 'warning', pago: 'navy', finalizado: 'success', cancelado: 'danger',
    };
    return '<span class="badge badge--' + (map[status] || 'muted') + '"><span class="badge__dot"></span>' + label + '</span>';
  }

  function pedidoCard(req) {
    const cat = DB.categoryById(req.categoriaId);
    const prof = req.profissionalId ? DB.profissionalById(req.profissionalId) : null;
    return (
      '<button class="card card--pressable" style="width:100%;text-align:left;" data-nav="/cliente/pedido/' + req.id + '">' +
        '<div class="row-between">' +
          '<div class="row">' +
            '<div class="icon-tile">' + icon(cat ? cat.icon : 'tag') + '</div>' +
            '<div>' +
              '<div class="h3">' + PU.escapeHtml(cat ? cat.nome : 'Serviço') + '</div>' +
              '<div class="text--sm text--secondary">' + (prof ? PU.escapeHtml(prof.nome) : 'Aguardando profissional') + '</div>' +
            '</div>' +
          '</div>' +
          icon('chevronRight', 'list-item__chevron') +
        '</div>' +
        '<div class="row-between" style="margin-top:12px;">' +
          statusBadge(req.status) +
          '<span class="text--sm text--muted">' + PU.timeAgo(req.criadoEm) + '</span>' +
        '</div>' +
      '</button>'
    );
  }

  // ---------------- Início ----------------

  function renderCategoryBrowser(cats) {
    const groupOrder = [['casa','Casa e manutenção'],['auto','Automotivo e transporte'],['tecnica','Assistência técnica'],['pessoas','Cuidados e pessoas'],['outros','Outros']];
    const filters = [['todos','Todos']].concat(groupOrder);
    function norm(v){return String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();}
    const popularNames=['Montador de móveis','Encanador','Eletricista','Diarista','Marido de aluguel','Pintor'];
    const popular=popularNames.map(function(name){return cats.find(function(c){return norm(c.nome)===norm(name);});}).filter(Boolean).slice(0,6);
    const popularHtml=popular.length?'<div class="qf-popular-wrap"><div class="qf-popular-title">Mais pedidos</div><div class="qf-popular-row">'+popular.map(function(c){
      return '<button class="category-tile" data-nav="/cliente/categoria/'+c.id+'"><span class="category-tile__icon">'+icon(c.icon)+'</span><span class="category-tile__label">'+PU.escapeHtml(c.nome)+'</span></button>';
    }).join('')+'</div></div>':'';
    const filterHtml=filters.map(function(g,i){return '<button type="button" class="category-filter-chip'+(i===0?' is-active':'')+'" data-category-filter="'+g[0]+'">'+PU.escapeHtml(g[1])+'</button>';}).join('');
    const groupsHtml=groupOrder.map(function(g){
      const groupCats=cats.filter(function(c){return (c.grupoId||'outros')===g[0];});
      if(!groupCats.length)return '';
      return '<section class="category-group" data-category-group="'+g[0]+'"><div class="category-group__title"><span>'+PU.escapeHtml(g[1])+'</span><span class="category-group__count">'+groupCats.length+'</span></div><div class="category-tiles">'+groupCats.map(function(c){
        return '<button class="category-tile" data-cat-group="'+g[0]+'" data-cat-name="'+PU.escapeHtml(c.nome)+'" data-nav="/cliente/categoria/'+c.id+'"><span class="category-tile__icon">'+icon(c.icon)+'</span><span class="category-tile__label">'+PU.escapeHtml(c.nome)+'</span></button>';
      }).join('')+'</div></section>';
    }).join('');
    return '<div class="category-browser"><label class="category-browser-search"><span class="category-browser-search__icon">'+icon('search')+'</span><input class="input" type="search" placeholder="Qual serviço você precisa?" autocomplete="off" data-category-search aria-label="Buscar serviço"></label>'+popularHtml+'<div class="category-filter-row" aria-label="Filtrar serviços">'+filterHtml+'</div><div class="category-grid">'+groupsHtml+'</div><div class="category-empty" data-category-empty>Nenhum serviço encontrado. Tente outro nome.</div></div>';
  }

  function qfPendenciaDismissed(tipo) {
    try { const ts=Number(localStorage.getItem('qf_dismiss_'+tipo)||0); return !!ts && Date.now()-ts<86400000; } catch(_){ return false; }
  }
  function clientePendenciaHtml() {
    let tipo='',iconName='',texto='',action='';

  function safeAdHref(ad) {
    const raw = String((ad && ad.link) || '').trim();
    if (/^https?:\/\//i.test(raw)) return raw;
    const phone = String((ad && ad.whatsapp) || '').replace(/\D/g, '');
    if (phone) return 'https://wa.me/' + (phone.indexOf('55') === 0 ? phone : '55' + phone);
    return '';
  }

  function anunciosCarousel(user) {
    const end = user && user.enderecos && user.enderecos[0] ? user.enderecos[0] : null;
    const cityObj = end && end.cidadeId ? DB.cityById(end.cidadeId) : null;
    const cidade = end ? (end.cidade || (cityObj && cityObj.nome) || '') : '';
    const uf = end ? (end.uf || (cityObj && cityObj.uf) || '') : '';
    const cityId = cidade && uf ? global.QFGeo.regionKey(cidade, uf) : (end ? end.cidadeId : null);
    const ads = DB.activeAdsForCity(cityId);
    const cards = ads.length ? ads.map(function (a) {
      const href = safeAdHref(a);
      return '<button class="ad-card" type="button" data-ad-click="' + a.id + '" data-ad-href="' + PU.escapeHtml(href) + '">' +
        (a.imagem ? '<img class="ad-card__media" src="' + a.imagem + '" alt="Anúncio de ' + PU.escapeHtml(a.empresa) + '">' : '') +
        '<span class="ad-card__veil"></span><span class="ad-card__body">' +
          '<span class="ad-card__sponsor">Patrocinado' + (a.plano === 'premium' ? ' · Premium' : a.plano === 'destaque' ? ' · Destaque' : '') + '</span>' +
          '<span class="ad-card__title">' + PU.escapeHtml(a.empresa) + '</span>' +
          '<span class="ad-card__text">' + PU.escapeHtml(a.chamada) + '</span>' +
          (href ? '<span class="ad-card__cta">Saiba mais ' + icon('arrowRight') + '</span>' : '') +
        '</span></button>';
    }).join('') :
      '<button class="ad-card ad-card--empty" type="button" data-nav="/cliente/anuncie"><span class="ad-card__body">' +
        '<span class="ad-card__sponsor">Espaço publicitário</span><span class="ad-card__title">Sua empresa pode aparecer aqui</span>' +
        '<span class="ad-card__text">Anuncie para clientes da sua região a partir de R$ 79 por 30 dias.</span>' +
        '<span class="ad-card__cta">Ver planos ' + icon('arrowRight') + '</span></span></button>';
    return '<div class="section ad-section"><div class="ad-section__head"><div class="ad-section__label">' + icon('briefcase') + ' Empresas da região</div>' +
      '<button class="topbar__action" type="button" data-nav="/cliente/anuncie" style="padding:4px 0;color:var(--orange-700);">Anuncie aqui</button></div>' +
      '<div class="ad-carousel" id="ad-carousel">' + cards + '</div>' +
      '<div class="ad-dots">' + Array.from({length: Math.max(1, ads.length)}).map(function () { return '<span class="ad-dot"></span>'; }).join('') + '</div></div>';
  }

    return (

            '<div class="text--sm text--secondary">' + (cloudMode ? 'Profissionais da sua região recebem o chamado na hora' : disponiveis.length + ' profissional' + (disponiveis.length === 1 ? '' : 'is') + ' online agora') + '</div>' +

  function starsDisplay(nota) {
    nota = Math.round(nota || 0);
    let s = '<span class="stars-display">';
    for (let i = 1; i <= 5; i++) s += icon(i <= nota ? 'starFilled' : 'star');
    return s + '</span>';
  }

  // ---------------- Lista de pedidos ----------------

  Screens.clientePedidosRender = function (params, user) {
    const hidden = loadHiddenHistory('cliente', user.id);
    const all = DB.requestsByCliente(user.id);
    const ativos = all.filter(function (r) { return ACTIVE_STATUSES.indexOf(r.status) !== -1; });
    const historico = all.filter(function (r) { return ACTIVE_STATUSES.indexOf(r.status) === -1 && hidden.indexOf(r.id) === -1; });
    if (!ativos.length && !historico.length) {
      return '<div class="view">' + emptyPedidos() + '</div>';
    }
    return (
      '<div class="view">' +
        (ativos.length ? '<div class="section"><div class="section-head"><h2 class="h3">Em andamento</h2></div><div class="stack--sm">' + ativos.map(pedidoCard).join('') + '</div></div>' : '') +
        (historico.length ? '<div class="section"><div class="section-head"><h2 class="h3">Histórico</h2></div><div class="stack--sm">' + historico.map(function (r) {
          return '<div class="history-entry">' + pedidoCard(r) +
            '<button class="history-delete" type="button" data-hide-pedido="' + PU.escapeHtml(r.id) + '" aria-label="Excluir pedido do histórico" title="Excluir do histórico">' + icon('xCircle') + '</button></div>';
        }).join('') + '</div></div>' : '') +

    const cat = DB.categoryById(req.categoriaId);
    const prof = req.profissionalId ? DB.profissionalById(req.profissionalId) : null;

    return (
      '<div class="view" data-request-id="' + req.id + '">' +
        '<div class="row-between">' +
          '<div class="row">' +
            '<div class="icon-tile">' + icon(cat ? cat.icon : 'tag') + '</div>' +
            '<div class="h3">' + PU.escapeHtml(cat ? cat.nome : 'Serviço') + '</div>' +
          '</div>' +
          '<div class="row" style="gap:6px;">' + (req.prioridade ? '<span class="badge badge--orange"><span class="badge__dot"></span>Prioritário</span>' : '') + statusBadge(req.status) + '</div>' +
        '</div>' +

        buscandoBlock(req) +
        semProfissionalBlock(req) +
        profissionalEncontradoBlock(req, prof) +
        orcamentoBlock(req, prof) +
        avaliacaoBlock(req, prof) +
        canceladoBlock(req) +

        '<div class="section">' +
          '<div class="section-head"><h2 class="h3">Detalhes</h2></div>' +
          '<div class="card stack--sm">' +
            '<div class="text text--sm text--secondary">' + PU.escapeHtml(req.descricao) + '</div>' +
            (req.fotos && req.fotos.length ? '<div class="upload-row">' + req.fotos.map(renderCallMedia).join('') + '</div>' : '') +

            '<div class="row text--sm text--secondary">' + icon('mapPin', 'list-item__chevron') + '<span>' + PU.escapeHtml(req.endereco.rua) + ', ' + PU.escapeHtml(req.endereco.bairro) + '</span></div>' +

        statusTrackSection(req) +

        (canCancel(req.status)
          ? '<div class="section"><button class="btn btn--danger-ghost" data-action="cancelar-pedido">' + icon('xCircle') + ' Cancelar pedido</button></div>'
          : '') +
        (req.status === STATUS.CANCELADO
          ? '<div class="section"><button class="btn btn--primary" data-action="refazer-pedido">' + icon('refresh') + ' Refazer o mesmo pedido</button><div class="text--sm text--secondary" style="margin-top:7px;">Descrição, endereço e mídias serão reaproveitados. Você pode revisar antes de publicar.</div></div>'
          : '') +
      '</div>'

  function buildTrackSteps(req) {
    if (req.status === STATUS.CANCELADO) {
      return [
        { title: 'Pedido criado', sub: PU.formatDateTime(req.criadoEm), state: 'done' },
        { title: 'Cancelado', sub: PU.formatDateTime(req.atualizadoEm), state: 'current' },
      ];
    }
    const order = [STATUS.BUSCANDO, STATUS.AGUARDANDO_ORCAMENTO, STATUS.ORCAMENTO_ENVIADO, STATUS.APROVADO, STATUS.EM_ANDAMENTO, STATUS.SERVICO_CONCLUIDO, STATUS.FINALIZADO];
    const titles = {
      buscando: 'Chamado publicado', aguardando_orcamento: 'Profissional conectado', orcamento_enviado: 'Orçamento enviado',
      aprovado: 'Orçamento aprovado', em_andamento: 'Serviço em andamento', servico_concluido: 'Serviço concluído',
      finalizado: 'Avaliação concluída',
    };
    const activity = {
      buscando: 'Buscando profissionais próximos',
      aguardando_orcamento: 'Profissional analisando sua solicitação',
      orcamento_enviado: 'Aguardando sua aprovação do orçamento',
      aprovado: 'Aprovado — aguardando início do serviço',
      em_andamento: 'Serviço em execução',
      servico_concluido: 'Aguardando sua avaliação',
      finalizado: 'Processo finalizado'
    };
    let effectiveStatus = req.status;
    if ([STATUS.AGUARDANDO_ACEITE, STATUS.SEM_PROFISSIONAL].indexOf(req.status) !== -1) effectiveStatus = STATUS.BUSCANDO;
    if (req.status === STATUS.ORCAMENTO_RECUSADO) effectiveStatus = STATUS.AGUARDANDO_ORCAMENTO;
    const idx = order.indexOf(effectiveStatus);
    const fluxoFinalizado = effectiveStatus === STATUS.FINALIZADO;
    return order.map(function (st, i) {
      const state = fluxoFinalizado ? 'done' : (i < idx ? 'done' : i === idx ? 'current' : 'pending');
      return {
        title: titles[st],
        sub: state === 'current' ? activity[st] : '',
        working: state === 'current' && !fluxoFinalizado,
        state: state
      };
    });
  }

  function bindCategoryBrowser(content) {
    const input = content.querySelector('[data-category-search]');
    const chips = Array.prototype.slice.call(content.querySelectorAll('[data-category-filter]'));
    const groups = Array.prototype.slice.call(content.querySelectorAll('[data-category-group]'));
    const tiles = Array.prototype.slice.call(content.querySelectorAll('.category-tile[data-cat-name]'));
    const empty = content.querySelector('[data-category-empty]');
    if (!input || !tiles.length) return;
    let active = 'todos';
    function norm(v) {
      return String(v || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
    }
    function apply() {
      const q = norm(input.value);
      let visible = 0;
      tiles.forEach(function (tile) {
        const byGroup = active === 'todos' || tile.getAttribute('data-cat-group') === active;
        const byText = !q || norm(tile.getAttribute('data-cat-name')).indexOf(q) !== -1;
        const show = byGroup && byText;
        tile.style.display = show ? '' : 'none';
        if (show) visible++;
      });
      groups.forEach(function (group) {
        const has = Array.prototype.some.call(group.querySelectorAll('.category-tile'), function (tile) { return tile.style.display !== 'none'; });
        group.style.display = has ? '' : 'none';
      });
      if (empty) empty.style.display = visible ? 'none' : 'block';
    }
    input.addEventListener('input', apply);
    chips.forEach(function (chip) {
      chip.addEventListener('click', function () {
        active = chip.getAttribute('data-category-filter') || 'todos';
        chips.forEach(function (c) { c.classList.toggle('is-active', c === chip); });
        apply();
      });
    });
    apply();
  }
