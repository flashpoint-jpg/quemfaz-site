  function bindCatPicker(root) {
    if (!root || root.dataset.catpickBound) return;
    root.dataset.catpickBound = '1';
    const search = root.querySelector('[data-catpick-search]');
    const addBtn = root.querySelector('[data-catpick-add]');
    const openBtn = root.querySelector('[data-catpick-open]');
    const editor = root.querySelector('[data-catpick-editor]');
    const nameInput = root.querySelector('[data-catpick-name]');
    function closeEditor() {
      editor.hidden = true;
      openBtn.setAttribute('aria-expanded', 'false');
      nameInput.value = '';
      openBtn.focus();
    }
    openBtn.addEventListener('click', function () {
      editor.hidden = false;
      openBtn.setAttribute('aria-expanded', 'true');
      nameInput.value = search.value.trim();
      nameInput.focus();
    });
    root.querySelector('[data-catpick-cancel]').addEventListener('click', closeEditor);
    function confirmProfession() {
      if (nameInput.value.trim().length < 2) {
        PU.toast('Informe o nome da profissão com pelo menos 2 caracteres.', 'danger');
        nameInput.focus();
        return;
      }
      search.value = nameInput.value.trim();
      filter();
      if (addTypedCategory()) {
        search.value = '';
        filter();
        closeEditor();
      }
    }
    nameInput.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); confirmProfession(); }
      if (e.key === 'Escape') { e.preventDefault(); closeEditor(); }
    });
    function update() {
      const selected = Array.prototype.slice.call(root.querySelectorAll('[data-chip-cat].is-selected'));
      Array.prototype.forEach.call(root.querySelectorAll('[data-catpick-group]'), function (g) {
        const n = g.querySelectorAll('[data-chip-cat].is-selected').length;
        const badge = g.querySelector('[data-catpick-count]');
        badge.textContent = n ? String(n) : '';
        badge.classList.toggle('is-on', n > 0);
      });
      const sum = root.querySelector('[data-catpick-summary]');
      sum.innerHTML = '<span class="qf-catpick__sumtitle">Selecionadas: ' + selected.length + '</span>' +
        (selected.length ? '<span class="qf-catpick__sumlist">' + selected.map(function (c) { return PU.escapeHtml(c.textContent); }).join(' · ') + '</span>'
          : (search && search.value.trim()
            ? '<span class="qf-catpick__sumlist" style="color:var(--warning-600);font-weight:800;">Agora toque na sua profissão na lista abaixo para marcar.</span>'
            : '<span class="qf-catpick__sumlist">Toque num grupo e escolha suas profissões.</span>'));
    }
    // V12.0.1: quem digita a profissão na busca e não toca no botão ficava sem profissão marcada.
    // Se só uma profissão bate com o que foi digitado, marca ela automaticamente.
    function visibleChips() {
      return Array.prototype.filter.call(root.querySelectorAll('[data-chip-cat]'), function (c) { return !c.hidden && !(c.closest('[data-catpick-group]') || {}).hidden; });
    }
    function autoPick() {
      const q = catNorm(search && search.value).trim();
      if (!q) return !!root.querySelector('[data-chip-cat].is-selected');
      const vis = visibleChips();
      const exact = vis.filter(function (c) { return c.getAttribute('data-cat-search') === q; });
      const pick = exact.length === 1 ? exact[0] : (vis.length === 1 ? vis[0] : null);
      if (!pick) return false;
      if (!pick.classList.contains('is-selected')) pick.click();
      return true;
    }
    function highlight() {
      root.scrollIntoView({ behavior: 'smooth', block: 'center' });
      root.style.transition = 'box-shadow .2s';
      root.style.boxShadow = '0 0 0 3px var(--warning-600, #d97706)';
      root.style.borderRadius = '12px';
      setTimeout(function () { root.style.boxShadow = ''; }, 2500);
    }
    root.qfAutoPick = autoPick;
    root.qfHighlight = highlight;
    root.qfCustomCategories = function () {
      return Array.prototype.map.call(root.querySelectorAll('[data-chip-cat].is-selected[data-cat-custom-name]'), function (chip) {
        const cat = customCatFromName(chip.getAttribute('data-cat-custom-name') || chip.textContent);
        if (cat) cat.id = chip.getAttribute('data-chip-cat') || cat.id;
        return cat;
      }).filter(Boolean);
    };
    function addTypedCategory() {
      const cat = customCatFromName(search && search.value);
      if (!cat) { PU.toast('Digite o nome do serviço para adicionar.', 'danger'); return false; }
      const exactChip = Array.prototype.find.call(root.querySelectorAll('[data-chip-cat]'), function (chip) {
        return catNorm(chip.textContent).trim() === catNorm(cat.nome).trim();
      });
      if (exactChip) {
        if (!exactChip.classList.contains('is-selected')) exactChip.click();
        exactChip.closest('[data-catpick-group]').open = true;
        search.blur();
        return true;
      }
      const saved = rememberCustomCat(cat);
      const group = root.querySelector('[data-catpick-group="outros"]');
      const wrap = group && group.querySelector('.qf-catpick__chips');
      if (!group || !wrap) { PU.toast('Não foi possível adicionar a categoria agora.', 'danger'); return false; }
      const chip = document.createElement('button');
      chip.type = 'button'; chip.className = 'chip'; chip.setAttribute('data-chip-cat', saved.id);
      chip.setAttribute('data-cat-search', catNorm(saved.nome)); chip.setAttribute('data-cat-custom-name', saved.nome); chip.textContent = saved.nome;
      wrap.appendChild(chip);
      filter();
      group.open = true;
      chip.click();
      search.blur();
      PU.toast('Profissão "' + saved.nome + '" adicionada e selecionada.', 'success');
      return true;
    }
    root.qfAddTypedCategory = addTypedCategory;
    function filter() {
      const q = catNorm(search.value).trim();
      let any = false;
      Array.prototype.forEach.call(root.querySelectorAll('[data-catpick-group]'), function (g) {
        let hits = 0;
        Array.prototype.forEach.call(g.querySelectorAll('[data-chip-cat]'), function (c) {
          const ok = !q || (' ' + c.getAttribute('data-cat-search').replace(/[^a-z0-9]+/g, ' ')).indexOf(' ' + q.replace(/[^a-z0-9]+/g, ' ')) !== -1;
          c.hidden = !ok;
          if (ok) hits++;
        });
        g.hidden = !hits;
        if (q) g.open = hits > 0; else g.open = false;
        if (hits) any = true;
      });

      empty.hidden = any || !q;
      update();
    }
    search.addEventListener('input', filter);
    search.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.keyCode === 13) {
        e.preventDefault();

        else if (visibleChips().length === 0) addTypedCategory();

      }
    });
    if (addBtn) addBtn.addEventListener('click', confirmProfession);
    root.addEventListener('click', function (e) { if (e.target.closest('[data-chip-cat]')) setTimeout(update, 0); });
    update();
  }

  // V11.21: só aceita celular brasileiro de verdade (DDD válido + 9 + 8 dígitos) e barra números de exemplo.
  const QF_DDDS = '11 12 13 14 15 16 17 18 19 21 22 24 27 28 31 32 33 34 35 37 38 41 42 43 44 45 46 47 48 49 51 53 54 55 61 62 63 64 65 66 67 68 69 71 73 74 75 77 79 81 82 83 84 85 86 87 88 89 91 92 93 94 95 96 97 98 99'.split(' ');
  function validPhone(v) {
    const d = String(v || '').replace(/\D/g, '').replace(/^55(?=\d{10,11}$)/, '');
    if (d.length !== 11 || QF_DDDS.indexOf(d.slice(0, 2)) === -1 || d.charAt(2) !== '9') return false;
    const resto = d.slice(3);
    if (resto === '12345678' || resto === '87654321') return false;
    const distintos = {}; resto.split('').forEach(function (c) { distintos[c] = 1; });
    return Object.keys(distintos).length >= 3;
  }
  global.QFUI = global.QFUI || {};
  global.QFUI.validPhone = validPhone;
  function field(label, controlHtml) {
    return '<label class="field"><span class="field__label">' + label + '</span>' + controlHtml + '</label>';
  }

      '</div>';
  }

  // ---------------- Recuperação de senha ----------------

  function openPasswordRecovery(prefillEmail) {
    const prefill = PU.escapeHtml(String(prefillEmail || '').trim());
    PU.openSheet(
      '<div class="stack"><h3 class="sheet__title">Recuperar senha</h3>' +
      '<p class="text text--secondary">Digite o e-mail cadastrado. Vamos enviar um link para você criar uma nova senha.</p>' +
      '<form id="qf-password-recovery-form" class="stack">' +
      '<label class="field"><span class="field__label">E-mail</span><input class="input" type="email" name="email" autocomplete="email" required placeholder="voce@exemplo.com" value="' + prefill + '"></label>' +
      '<button class="btn btn--primary" type="submit">Enviar link de recuperação</button>' +
      '<button class="btn btn--ghost" type="button" id="qf-password-recovery-cancel">Cancelar</button>' +
      '</form></div>'
    );
    const form = document.getElementById('qf-password-recovery-form');
    const cancel = document.getElementById('qf-password-recovery-cancel');
    if (cancel) cancel.onclick = function () { PU.closeSheet(); };
    if (!form) return;
    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      const email = String(new FormData(form).get('email') || '').trim();
      const btn = form.querySelector('button[type="submit"]');
      if (btn) { btn.disabled = true; btn.textContent = 'Enviando...'; }
      try {
        if (!(global.QFCloud && global.QFCloud.enabled && global.QFCloud.requestPasswordReset)) {
          PU.toast('A recuperação de senha precisa de conexão com a internet.', 'danger');
          return;
        }
        const res = await global.QFCloud.requestPasswordReset(email);
        if (!res.ok) { PU.toast(res.error || 'Não foi possível enviar o link.', 'danger'); return; }
        PU.openSheet(
          '<div class="stack"><h3 class="sheet__title">Confira seu e-mail</h3>' +
          '<p class="text text--secondary">Se esse e-mail estiver cadastrado no QuemFaz, você receberá um link para criar uma nova senha.</p>' +
          '<button class="btn btn--primary" id="qf-password-recovery-done">Entendi</button></div>'
        );
        const done = document.getElementById('qf-password-recovery-done');
        if (done) done.onclick = function () { PU.closeSheet(); };
      } finally {
        if (btn) { btn.disabled = false; btn.textContent = 'Enviar link de recuperação'; }
      }
    });
  }

  let newPasswordSheetOpen = false;
  async function openNewPassword(options) {
    const forced = !!(options && options.forced);
    if (newPasswordSheetOpen || document.getElementById('qf-new-password-form')) return;
    if (!(global.QFCloud && global.QFCloud.enabled && global.QFCloud.updatePassword)) return;
    if (forced && !global.QFCloud.updateForcedPassword) return;
    newPasswordSheetOpen = true;
    PU.openSheet(
      '<div class="stack"><h3 class="sheet__title">' + (forced ? 'Troque sua senha' : 'Crie uma nova senha') + '</h3>' +
      '<p class="text text--secondary">' + (forced
        ? 'Você entrou com uma senha temporária definida pelo suporte. Crie agora uma senha nova, que só você vai saber, para continuar.'
        : 'Digite sua nova senha para voltar a acessar o QuemFaz.') + '</p>' +
      '<form id="qf-new-password-form" class="stack">' +
      '<label class="field"><span class="field__label">Nova senha</span><input class="input" type="password" name="senha" minlength="6" autocomplete="new-password" required placeholder="Mínimo 6 caracteres"></label>' +
      '<label class="field"><span class="field__label">Confirmar nova senha</span><input class="input" type="password" name="confirmar" minlength="6" autocomplete="new-password" required placeholder="Digite novamente"></label>' +
      '<button class="btn btn--primary" type="submit">Salvar nova senha</button>' +
      '</form></div>',
      { persistent: true }
    );
    const form = document.getElementById('qf-new-password-form');
    if (!form) { newPasswordSheetOpen = false; return; }
    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      const fd = new FormData(form);
      const senha = String(fd.get('senha') || '');
      const confirmar = String(fd.get('confirmar') || '');
      if (senha.length < 6) { PU.toast('A senha precisa ter pelo menos 6 caracteres.', 'danger'); return; }
      if (senha !== confirmar) { PU.toast('As senhas não são iguais.', 'danger'); return; }
      const btn = form.querySelector('button[type="submit"]');
      if (btn) { btn.disabled = true; btn.textContent = 'Salvando...'; }
      try {
        const res = forced ? await global.QFCloud.updateForcedPassword(senha) : await global.QFCloud.updatePassword(senha);
        if (!res.ok) { PU.toast(res.error || 'Não foi possível atualizar a senha.', 'danger'); return; }
        newPasswordSheetOpen = false;
        PU.closeSheet();
        if (forced && res.needsLogin) {
          PU.toast('Senha atualizada. Entre novamente com sua nova senha.', 'success');
          global.navigate('/auth/profissional/login', true);
          return;
        }
        PU.toast('Senha atualizada com sucesso.', 'success');
        if (forced) {
          const sess = DB.getSession();
          if (sess && sess.role) global.navigate('/' + sess.role + '/home', true);
        }
      } finally {
        if (btn) { btn.disabled = false; btn.textContent = 'Salvar nova senha'; }
      }
    });
  }

  global.QFPasswordRecovery = {
    openRequest: openPasswordRecovery,
    openNewPassword: openNewPassword,
    openForcedPassword: function () { return openNewPassword({ forced: true }); }
  };
  global.addEventListener('qf-password-recovery', function () { setTimeout(openNewPassword, 0); });

  // ---------------- Vínculo pós-render (rotas anônimas) ----------------

  Screens.afterRenderAnon = function (pattern, content, params) {
    if (pattern === '/') {
      const landingSearchForm=content.querySelector('[data-landing-service-form]');
      const landingSearch=content.querySelector('[data-landing-service-search]');
      const landingSuggestions=content.querySelector('[data-landing-service-suggestions]');
      content.addEventListener('click',function(e){const menu=content.querySelector('.qf-home-prof');if(menu&&!menu.contains(e.target))menu.open=false;});
      content.addEventListener('keydown',function(e){if(e.key==='Escape'){const menu=content.querySelector('.qf-home-prof');if(menu){menu.open=false;menu.querySelector('summary').focus();}}});
      const homeLocation=content.querySelector('[data-landing-location]');
      const homeGps=content.querySelector('[data-home-gps]');
      let homeRegion=null;
      if(homeLocation)homeLocation.addEventListener('input',function(){homeRegion=null;});
      if(homeGps)homeGps.addEventListener('click',async function(){
        homeGps.disabled=true;
        try{const pos=await global.QFGeo.currentPosition();homeRegion=await global.QFGeo.reverseGeocode(pos.latitude,pos.longitude);homeLocation.value=homeRegion.cidade+(homeRegion.uf?' / '+homeRegion.uf:'');}
        catch(err){PU.toast(err.message||'Digite sua cidade ou CEP.','danger');}
        finally{homeGps.disabled=false;}
      });
      async function saveHomeDraft(){
        const raw=homeLocation?homeLocation.value.trim():'';
        let region=homeRegion;
        if(!region&&/^\d{5}-?\d{3}$/.test(raw))region=await global.QFGeo.lookupCep(raw);
        else if(!region&&raw){const parts=raw.match(/^(.*?)\s*[,/–-]\s*([A-Za-z]{2})$/);region={cidade:parts?parts[1].trim():raw,uf:parts?parts[2].toUpperCase():''};}
        global.QFHomeDraft={service:landingSearch?landingSearch.value.trim():'',region:region||{cidade:'',uf:''}};
      }

      function landingNorm(v){return String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();}
      const landingAliases={
        cat_eletricista:'eletrica eletrico eletricidade tomada chuveiro nao esquenta sem energia curto luz lampada disjuntor fiacao fio instalar ventilador',
        cat_encanador:'encanamento hidraulica vazamento vazando torneira cano pia entupida entupido vaso descarga agua',
        cat_montador:'montagem montar moveis movel guarda roupa guarda-roupa armario cama mesa desmontar',
        cat_diarista:'faxina limpeza limpar casa apartamento sujeira diarista domestica',
        cat_pintor:'pintura pintar parede teto tinta descascando mofo',
        cat_pedreiro:'reforma obra construcao construir alvenaria piso azulejo reboco quebrar parede',
        cat_jardinagem:'jardim jardinagem jardineiro grama cortar grama poda podar arvore',
        cat_arcondicionado:'ar condicionado ar-condicionado climatizacao gelar nao gela limpeza instalar',
        cat_chaveiro:'chave fechadura porta trancada perdi chave abrir porta trocar fechadura',
        cat_mecanico:'mecanica carro automovel veiculo nao pega motor barulho pane',
        cat_borracheiro:'pneu furado pneu murcho borracharia trocar pneu',
        cat_frete:'frete carreto mudanca transporte levar sofa geladeira',
        cat_informatica:'computador notebook pc informatica formatar lento nao liga internet',
        cat_soldador:'solda soldagem portao quebrado ferro',
        cat_vidraceiro:'vidro janela box espelho vidro quebrado',
        cat_serralheiro:'serralheria portao grade ferro portao travado',
        cat_marceneiro:'marcenaria madeira armario planejado movel madeira',
        cat_guincho:'reboque guincho carro parado pane rebocar',
        cat_entregador:'entrega entregador motoboy levar pacote documento'
      };
      function landingMatches(raw){
        const q=landingNorm(raw); if(q.length<2)return [];
        const tokens=q.replace(/[^a-z0-9]+/g,' ').split(/\s+/).filter(function(x){return x.length>1 && ['de','da','do','das','dos','em','para','que','nao','uma','um','meu','minha'].indexOf(x)===-1;});
        return DB.categories().filter(function(cat){return cat && cat.id!=='cat_outros';}).map(function(cat){
          const hay=landingNorm((cat.nome||'')+' '+(landingAliases[cat.id]||''));
          let score=landingNorm(cat.nome)===q?100:0;
          tokens.forEach(function(t){if(hay.indexOf(t)!==-1)score+=20;});
          if(hay.indexOf(q)!==-1)score+=35;
          return {cat:cat,score:score};
        }).filter(function(x){return x.score>0;}).sort(function(a,b){return b.score-a.score;}).slice(0,6).map(function(x){return x.cat;});
      }
      let landingSelectedCat=null;
      function landingSelect(cat){
        if(!cat)return;
        landingSelectedCat=cat;
        if(landingSearch)landingSearch.value=cat.nome||'';
        if(landingSuggestions){landingSuggestions.hidden=true;landingSuggestions.innerHTML='';}
        if(homeLocation&&!homeLocation.value.trim())homeLocation.focus();
      }
      async function landingGo(cat){
        if(!cat)return;
        const rawLocation=homeLocation?homeLocation.value.trim():'';
        if(!rawLocation&&!homeRegion){PU.toast('Informe sua cidade ou CEP para continuar.','danger');if(homeLocation)homeLocation.focus();return;}
        try{await saveHomeDraft();}catch(err){PU.toast(err.message||"Confira o CEP.","danger");return;}
        try{sessionStorage.setItem('qf_pending_category',cat.id);}catch(_){}
        const submitBtn=landingSearchForm&&landingSearchForm.querySelector('button[type="submit"]');
        if(submitBtn){submitBtn.disabled=true;submitBtn.innerHTML='<span>Buscando profissionais na sua região...</span>';}
        setTimeout(function(){global.navigate('/auth/cliente/cadastro',true);},2200);
      }
      function renderLandingSuggestions(){
        if(!landingSearch||!landingSuggestions)return;
        const list=landingMatches(landingSearch.value);
        if(!list.length){landingSuggestions.hidden=true;landingSuggestions.innerHTML='';return;}
        landingSuggestions.innerHTML=list.map(function(cat){
          return '<button type="button" class="qf-service-suggestion" data-landing-search-cat="'+PU.escapeHtml(cat.id)+'"><span class="qf-service-suggestion__icon">'+icon(cat.icon||'briefcase')+'</span><span class="qf-service-suggestion__body"><span class="qf-service-suggestion__name">'+PU.escapeHtml(cat.nome)+'</span><span class="qf-service-suggestion__group">'+PU.escapeHtml(cat.grupo||'Serviço')+'</span></span>'+icon('chevronRight','qf-service-suggestion__chevron')+'</button>';
        }).join('');
        landingSuggestions.hidden=false;
      }
      if(landingSearch)landingSearch.addEventListener('input',renderLandingSuggestions);
      if(landingSuggestions)landingSuggestions.addEventListener('click',function(e){
        const btn=e.target.closest('[data-landing-search-cat]');if(!btn)return;
        landingSelect(DB.categoryById(btn.getAttribute('data-landing-search-cat')));
      });
      if(landingSearchForm)landingSearchForm.addEventListener('submit',async function(e){
        e.preventDefault();
        try{await saveHomeDraft();}catch(err){PU.toast(err.message||'Confira o CEP.','danger');return;}
        const list=landingMatches(landingSearch&&landingSearch.value);
        const chosen=landingSelectedCat||(list.length?list[0]:null);
        if(chosen){landingGo(chosen);return;}
        PU.toast('Escolha o serviço que você precisa.','danger');
        if(landingSearch)landingSearch.focus();
      });
      // Botão fixo de baixo: aparece só quando o campo de busca sai da tela.
      const landingSticky=content.querySelector('[data-landing-sticky]');
      if(landingSticky&&landingSearchForm){
        const landingStickyUpdate=function(){
          if(!landingSticky.isConnected){window.removeEventListener('scroll',landingStickyUpdate,true);return;}
          landingSticky.hidden=landingSearchForm.getBoundingClientRect().bottom>64;
        };
        window.addEventListener('scroll',landingStickyUpdate,{capture:true,passive:true});
        landingStickyUpdate();
      }
      content.addEventListener('click', function (e) {
        const cat=e.target.closest('[data-landing-cat]');
        if(cat){try{sessionStorage.setItem('qf_pending_category',cat.getAttribute('data-landing-cat'));}catch(_){} global.navigate('/auth/cliente/cadastro',true);return;}
        if(e.target.closest('[data-home-services]')){landingSearch.scrollIntoView({block:'center'});landingSearch.focus();renderLandingSuggestions();return;}
        if(e.target.closest('[data-action="landing-login"]')){PU.openSheet('<div class="stack"><h3 class="sheet__title">Entrar no QuemFaz</h3><button class="btn btn--primary" id="qf-login-cliente">Entrar como cliente</button><button class="btn btn--outline" id="qf-login-prof">Entrar como profissional</button></div>');const c=document.getElementById('qf-login-cliente'),p=document.getElementById('qf-login-prof');if(c)c.onclick=function(){PU.closeSheet();global.navigate('/auth/cliente/login',true)};if(p)p.onclick=function(){PU.closeSheet();global.navigate('/auth/profissional/login',true)};return;}
        if(e.target.closest('[data-action="landing-all-services"]')) global.navigate('/auth/cliente/cadastro',true);

          if (String(fd.get('senha') || '').length < 6) { PU.toast('Crie uma senha com pelo menos 6 letras ou números.', 'danger'); marcarErro('senha'); return false; }
        }

          const cidadeTxt = normCidade(fd.get('cidade'));
          if (!cidadeTxt) { PU.toast('Digite sua cidade.', 'danger'); marcarErro('cidade'); return false; }

        }
        return true;
      }
      let avancando = false;
      async function avancar() {
        if (avancando || !validarEtapa(stepAtual)) return;
        avancando = true;
        try {
          if (stepAtual === 3 && !(await confirmarCidade())) return;
          goStep(Math.min(4, stepAtual + 1));
        } finally { avancando = false; }
      }

        if (!validPhone(fd.get('telefone'))) { PU.toast('Informe um WhatsApp/celular com DDD.', 'danger'); return; }
        if (!global.QFGeo.normalizeCep(fd.get('cep'))) { PU.toast('Digite um CEP válido da sua base.', 'danger'); return; }
        if (!String(fd.get('rua') || '').trim() || !String(fd.get('numero') || '').trim() || !String(fd.get('bairro') || '').trim()) {

          bairro: String(fd.get('bairro') || '').trim(), cidade: normCidade(fd.get('cidade')), uf: fd.get('uf'),

          categorias: selected, categoriasPersonalizadas: customCategories, cidade: enderecoProf.cidade, uf: enderecoProf.uf, cep: enderecoProf.cep, endereco: enderecoProf,
          latitude: enderecoProf.latitude, longitude: enderecoProf.longitude, raioKm: Number(fd.get('raioKm')),

      ic = 'document';

    const regionLabel = searchRegion && searchRegion.cidade ? (searchRegion.cidade + (searchRegion.uf ? '/' + searchRegion.uf : '')) : '';
    const disponiveis = cloudMode ? [] : DB.state.users.profissionais.filter(function (p) {
      return p.statusAprovacao === 'aprovado' && p.online && p.categorias.indexOf(cat.id) !== -1;
    });
    return (
      '<div class="view">' +
        '<div class="row">' +

        '</div>' +

        '<div class="section">' +
          '<button class="btn btn--primary" data-nav="/cliente/novo-pedido/' + cat.id + '">' + icon('plus') + ' Solicitar ' + PU.escapeHtml(cat.nome.toLowerCase()) + '</button>' +
        '</div>' +

        (cloudMode ? '<div class="section"><div class="card stack--sm">' +
            '<div class="row" style="align-items:flex-start;"><div class="icon-tile icon-tile--ghost">' + icon('shieldCheck') + '</div><div><div class="text--strong">Como funciona</div><div class="text--sm text--secondary">Seu pedido é gratuito. Profissionais de ' + PU.escapeHtml(cat.nome.toLowerCase()) + ' próximos são avisados na hora. Quando um deles assumir, você vê foto, avaliação e WhatsApp dele para combinar o orçamento.</div></div></div>' +
          '</div></div>' : '') +
        (cloudMode ? '' : '<div class="section">' +

                  '<div class="avatar">' + PU.initials(p.nome) + '</div>' +

                  '<span class="badge badge--success"><span class="badge__dot"></span>Online</span>' +
                '</div>';
              }).join('') + '</div>'
            : '<div class="empty-state"><div class="icon-tile icon-tile--ghost">' + icon('info') + '</div><p class="text text--secondary">Nenhum profissional online nesta categoria agora, mas você ainda pode solicitar — chamamos assim que alguém ficar disponível.</p></div>') +
        '</div>') +
      '</div>'
    );
  };

  function starsDisplay(nota) {
    nota = Math.round(nota || 0);
    let s = '<span class="stars-display">';
    for (let i = 1; i <= 5; i++) s += icon(i <= nota ? 'starFilled' : 'star');
    return s + '</span>';
  }

    const all = DB.requestsByCliente(user.id);
    const ativos = all.filter(function (r) { return ACTIVE_STATUSES.indexOf(r.status) !== -1; });
    const historico = all.filter(function (r) { return ACTIVE_STATUSES.indexOf(r.status) === -1 && hidden.indexOf(r.id) === -1; });
    if (!ativos.length && !historico.length) {
      return '<div class="view">' + emptyPedidos() + '</div>';
    }
    return (
      '<div class="view">' +
        (ativos.length ? '<div class="section"><div class="section-head"><h2 class="h3">Em andamento</h2></div><div class="stack--sm">' + ativos.map(pedidoCard).join('') + '</div></div>' : '') +
        (historico.length ? '<div class="section"><div class="section-head"><h2 class="h3">Histórico</h2></div><div class="stack--sm">' + historico.map(function (r) {
          return '<div class="history-entry">' + pedidoCard(r) +
            '<button class="history-delete" type="button" data-hide-pedido="' + PU.escapeHtml(r.id) + '" aria-label="Excluir pedido do histórico" title="Excluir do histórico">' + icon('xCircle') + '</button></div>';
        }).join('') + '</div></div>' : '') +
      '</div>'
    );
  };

  function emptyPedidos() {
    return '<div class="empty-state">' +
      '<div class="icon-tile icon-tile--lg icon-tile--ghost">' + icon('clipboard') + '</div>' +
      '<h2 class="h3">Nenhum pedido ainda</h2>' +
      '<p class="text text--secondary">Digite o serviço na tela Início para solicitar seu primeiro serviço.</p>' +
      '<button class="btn btn--primary btn--block-auto" data-nav="/cliente/home" style="margin-top:6px;">Buscar serviço</button>' +
    '</div>';
  }

  // ---------------- Detalhe / acompanhamento do pedido ----------------

  Screens.clientePedidoDetalheRender = function (params, user) {
    const req = DB.requestById(params.id);
    if (!req || req.clienteId !== user.id) return '<div class="view"><p class="text">Pedido não encontrado.</p></div>';
    const cat = DB.categoryById(req.categoriaId);
    const prof = req.profissionalId ? DB.profissionalById(req.profissionalId) : null;

    return (
      '<div class="view" data-request-id="' + req.id + '">' +
        '<div class="row-between">' +
          '<div class="row">' +
            '<div class="icon-tile">' + icon(cat ? cat.icon : 'tag') + '</div>' +
            '<div class="h3">' + PU.escapeHtml(cat ? cat.nome : 'Serviço') + '</div>' +
          '</div>' +
          '<div class="row" style="gap:6px;">' + (req.prioridade ? '<span class="badge badge--orange"><span class="badge__dot"></span>Prioritário</span>' : '') + statusBadge(req.status) + '</div>' +
        '</div>' +

        buscandoBlock(req) +
        semProfissionalBlock(req) +
        profissionalEncontradoBlock(req, prof) +
        orcamentoBlock(req, prof) +
        avaliacaoBlock(req, prof) +
        canceladoBlock(req) +

        '<div class="section">' +
          '<div class="section-head"><h2 class="h3">Detalhes</h2></div>' +
          '<div class="card stack--sm">' +
            '<div class="text text--sm text--secondary">' + PU.escapeHtml(req.descricao) + '</div>' +
            (req.fotos && req.fotos.length ? '<div class="upload-row">' + req.fotos.map(renderCallMedia).join('') + '</div>' : '') +
            '<hr class="hairline">' +
            '<div class="row text--sm text--secondary">' + icon('mapPin', 'list-item__chevron') + '<span>' + PU.escapeHtml(req.endereco.rua) + ', ' + PU.escapeHtml(req.endereco.bairro) + '</span></div>' +
          '</div>' +
        '</div>' +

        statusTrackSection(req) +

        (canCancel(req.status)
          ? '<div class="section"><button class="btn btn--danger-ghost" data-action="cancelar-pedido">' + icon('xCircle') + ' Cancelar pedido</button></div>'
          : '') +
        (req.status === STATUS.CANCELADO
          ? '<div class="section"><button class="btn btn--primary" data-action="refazer-pedido">' + icon('refresh') + ' Refazer o mesmo pedido</button><div class="text--sm text--secondary" style="margin-top:7px;">Descrição, endereço e mídias serão reaproveitados. Você pode revisar antes de publicar.</div></div>'
          : '') +
      '</div>'
    );
  };

  function canCancel(status) {
    return [STATUS.BUSCANDO, STATUS.SEM_PROFISSIONAL, STATUS.AGUARDANDO_ACEITE, STATUS.AGUARDANDO_ORCAMENTO, STATUS.ORCAMENTO_ENVIADO, STATUS.ORCAMENTO_RECUSADO, STATUS.APROVADO].indexOf(status) !== -1;
  }

  function buscandoBlock(req) {
    if (req.status !== STATUS.BUSCANDO && req.status !== STATUS.AGUARDANDO_ACEITE) return '';
    return (
      '<div class="section">' +
        '<div class="card" style="display:flex;flex-direction:column;align-items:center;text-align:center;padding:30px 16px;">' +
          '<div class="icon-tile icon-tile--lg icon-tile--orange">' + icon(req.prioridade ? 'bolt' : 'bell') + '</div>' +
          '<h2 class="h3" style="margin-top:14px;">' + (req.prioridade ? 'Chamado prioritário publicado' : 'Chamado publicado') + '</h2>' +
          '<p class="text text--secondary text--sm" style="margin-top:4px;">Profissionais próximos podem visualizar seu pedido. Até 3 podem desbloquear e chamar você no WhatsApp ou pelo chat.</p>' +
          '<div class="qf-search-radar" data-search-radar data-created="' + PU.escapeHtml(String(req.criadoEm || '')) + '">' +
            '<div class="qf-search-radar__visual" aria-hidden="true">' +
              '<span class="qf-search-radar__ring"></span><span class="qf-search-radar__ring qf-search-radar__ring--2"></span><span class="qf-search-radar__ring qf-search-radar__ring--3"></span>' +
              '<span class="qf-search-radar__center">' + icon('mapPin') + '</span>' +
            '</div>' +
            '<div class="qf-search-radar__stage" data-search-stage>Buscando profissionais na sua cidade</div>' +
            '<div class="qf-search-radar__sub" data-search-sub>Começando pela cidade escolhida</div>' +
            '<div class="qf-search-radar__km" data-search-km>Cidade</div>' +
          '</div>' +
          '<div class="qf-call-reach" data-call-reach data-call-id="' + PU.escapeHtml(req.id) + '"><span data-call-reach-copy>Avisando profissionais compatíveis…</span></div>' +
          (!req.prioridade && !(req.pagamentoPrioridade && req.pagamentoPrioridade.status === 'pendente')
            ? '<div class="qf-radar-priority"><div class="qf-radar-priority__top"><span class="qf-radar-priority__icon">' + icon('bolt') + '</span><div class="qf-radar-priority__copy"><div class="qf-radar-priority__title">Quer encontrar mais rápido?</div><div class="qf-radar-priority__sub">A busca amplia o alcance mais rápido e seu chamado ganha prioridade.</div></div></div><button class="btn btn--primary" type="button" data-action="ativar-busca-prioritaria">' + icon('bolt') + ' Acelerar busca — R$ 4,90</button></div>'
            : '') +
          '<div class="qf-still-searching" data-still-searching data-created="' + PU.escapeHtml(String(req.criadoEm || '')) + '" hidden><div class="text--strong">Ainda estamos procurando</div><div class="text--sm">Avisamos mais profissionais perto de você. Você não precisa fazer nada; vamos te avisar quando chegarem novos orçamentos.</div><button class="btn btn--outline btn--sm" type="button" data-support-open>' + icon('info') + ' Falar com o suporte</button></div>' +
          (req.prioridade
            ? '<div class="badge badge--orange" style="margin-top:12px;"><span class="badge__dot"></span>Prioridade paga e ativa</div>'
            : (req.pagamentoPrioridade && req.pagamentoPrioridade.status === 'pendente'
              ? '<div class="badge badge--orange" style="margin-top:12px;"><span class="badge__dot"></span>Prioridade aguardando pagamento · ' + PU.formatCurrency(req.pagamentoPrioridade.valor || 490) + '</div>'
              : '<div class="badge badge--success" style="margin-top:12px;"><span class="badge__dot"></span>Chamado normal gratuito</div>')) +
          (req.pagamentoPrioridade && req.pagamentoPrioridade.status === 'pendente' && req.pagamentoPrioridade.checkoutUrl
            ? '<a class="btn btn--primary btn--block-auto" href="' + PU.escapeHtml(req.pagamentoPrioridade.checkoutUrl) + '" rel="noopener" style="margin-top:12px;">' + icon('bolt') + ' Pagar prioridade</a>'
            : (req.pagamentoPrioridade && req.pagamentoPrioridade.status === 'pendente' && req.pagamentoPrioridade.id
              ? '<button class="btn btn--primary btn--block-auto" data-action="gerar-pagamento-prioridade" data-payment-id="' + PU.escapeHtml(req.pagamentoPrioridade.id) + '" style="margin-top:12px;">' + icon('bolt') + ' Gerar pagamento</button>'
              : '')) +
        '</div>' +
      '</div>'
    );
  }

  function semProfissionalBlock(req) {
    if (req.status !== STATUS.SEM_PROFISSIONAL) return '';
    return (
      '<div class="section">' +
        '<div class="card" style="text-align:center;padding:28px 16px;">' +
          '<div class="icon-tile icon-tile--ghost" style="margin:0 auto 12px;">' + icon('alertTriangle') + '</div>' +
          '<h2 class="h3">Nenhum profissional disponível agora</h2>' +
          '<p class="text text--secondary text--sm" style="margin-top:4px;">Tente novamente em instantes ou aguarde — avisamos assim que alguém ficar online.</p>' +
          '<button class="btn btn--primary" data-action="tentar-novamente" style="margin-top:14px;">' + icon('refresh') + ' Tentar novamente</button>' +
        '</div>' +
      '</div>'
    );
  }

  function whatsappHref(phone, message) {
    let d = String(phone || '').replace(/\D/g, '');
    if (!d) return '';
    if (d.length === 10 || d.length === 11) d = '55' + d;
    return 'https://wa.me/' + d + (message ? '?text=' + encodeURIComponent(message) : '');
  }
  global.QFUI = global.QFUI || {};
  global.QFUI.whatsappHref = whatsappHref;
  // V11.20: mensagem pronta que o profissional envia ao cliente pelo WhatsApp logo após desbloquear.
  global.QFUI.primeiroContatoMsg = function (cliente, user, cat) {
    const nome = String((cliente && cliente.nome) || '').trim().split(/\s+/)[0] || '';
    const servico = cat && cat.nome ? ' de ' + cat.nome : '';
    return 'Olá' + (nome ? ', ' + nome : '') + '! Sou ' + ((user && user.nome) || 'profissional') + ', profissional pelo QuemFaz. Vi seu pedido' + servico + ' e estou disponível. Podemos combinar por aqui o valor, o horário e os detalhes do serviço?';
  };
  global.QFUI.telHref = telHref;
  global.QFUI.personAvatar = personAvatar;
  function telHref(phone) {
    let d = String(phone || '').replace(/\D/g, '');
    if (!d) return '';
    if (d.length === 10 || d.length === 11) d = '55' + d;
    return 'tel:+' + d;
  }
  function personAvatar(person, cls) {
    cls = cls || '';
    const photo = person && person.fotoUrl ? String(person.fotoUrl) : '';
    return '<div class="avatar ' + cls + '">' + (photo ? '<img src="' + PU.escapeHtml(photo) + '" alt="Foto de ' + PU.escapeHtml(person.nome || 'profissional') + '">' : PU.initials((person || {}).nome || '?')) + '</div>';
  }

  function profCard(prof, extra) {
    if (!prof) return '';
    const wa = whatsappHref(prof.telefone, 'Olá ' + (prof.nome || '') + ', estou falando pelo QuemFaz sobre meu chamado.');
    return (
      '<div class="card prof-safety-card">' +
        '<div class="row" style="align-items:flex-start;">' +
          personAvatar(prof, 'avatar--lg') +
          '<div class="spacer">' +
            '<div class="row" style="gap:7px;flex-wrap:wrap;"><div class="text--strong">' + PU.escapeHtml(prof.nome) + '</div>' +
              (prof.verificado ? '<span class="badge badge--success"><span class="badge__dot"></span>Verificado</span>' : (prof.fotoUrl ? '<span class="badge badge--warning"><span class="badge__dot"></span>Identificação cadastrada</span>' : '')) +
            '</div>' +
            '<div class="row text--sm text--secondary qf-rating" style="gap:6px;margin-top:4px;">' + global.QFRating(prof.avaliacaoMedia, prof.totalAvaliacoes) + '</div>' +
            ((prof.cidadeNome || prof.uf) ? '<div class="text--sm text--secondary" style="margin-top:4px;">' + icon('mapPin', 'list-item__chevron') + ' ' + PU.escapeHtml([prof.cidadeNome, prof.uf].filter(Boolean).join(' · ')) + '</div>' : '') +
            '<div class="text--sm text--secondary" style="margin-top:4px;">Foto e dados do perfil exibidos para sua segurança.</div>' +
            (extra || '') +
          '</div>' +
        '</div>' +
        (wa ? '<div class="btn-row" style="margin-top:12px;"><a class="btn btn--whatsapp" data-contact="whatsapp" href="' + wa + '" target="_blank" rel="noopener">' + icon('whatsapp') + ' WhatsApp</a>' +
          '<a class="btn btn--outline" data-contact="ligar" href="' + telHref(prof.telefone) + '">' + icon('phoneCall') + ' Ligar</a></div>' : '') +
      '</div>'
    );
  }

  function profissionalEncontradoBlock(req, prof) {
    if (req.status !== STATUS.AGUARDANDO_ORCAMENTO) return '';
    return (
      '<div class="section">' +
        '<div class="card" style="display:flex;flex-direction:column;align-items:center;text-align:center;padding:24px 16px;">' +
          '<div class="icon-tile icon-tile--lg icon-tile--orange">' + icon('document') + '</div>' +
          '<h2 class="h3" style="margin-top:12px;">Profissional em contato</h2>' +
          '<p class="text text--secondary text--sm" style="margin-top:4px;">Até 3 profissionais podem desbloquear seu pedido e chamar você no WhatsApp: fique de olho nas mensagens. Você também pode conversar pelo chat daqui e fechar com quem preferir.</p>' +
          '<div class="qf-search-radar" data-search-radar data-created="' + PU.escapeHtml(String(req.criadoEm || '')) + '">' +
            '<div class="qf-search-radar__visual" aria-hidden="true">' +
              '<span class="qf-search-radar__ring"></span><span class="qf-search-radar__ring qf-search-radar__ring--2"></span><span class="qf-search-radar__ring qf-search-radar__ring--3"></span>' +
              '<span class="qf-search-radar__center">' + icon('mapPin') + '</span>' +
            '</div>' +
            '<div class="qf-search-radar__stage" data-search-stage>Profissional em contato</div>' +
            '<div class="qf-search-radar__sub" data-search-sub>Até 3 profissionais podem chamar você no WhatsApp</div>' +
            '<div class="qf-search-radar__km" data-search-km>Até 3 profissionais</div>' +
          '</div>' +
          '<div class="qf-call-reach" data-call-reach data-call-id="' + PU.escapeHtml(req.id) + '" data-orcamentos="0"><span data-call-reach-copy>O profissional vai chamar você no WhatsApp.</span></div>' +
        '</div>' +
      '</div>'
    );
  }

  function quoteProfessional(req, q, fallback) {
    return (q && q.profissionalId && DB.profissionalById(q.profissionalId)) ||
      (q && q.profissional) || fallback || null;
  }

  function quoteValueCard(q) {
    const taxa = Number((q && q.taxaVisita) || 0);
    return '<div class="card stack--sm" style="margin-top:10px;">' +
      (taxa ? rowValor('Taxa de visita', taxa) : '') +
      rowValor('Mão de obra', Number((q && q.maoDeObra) || 0)) +
      rowValor('Material', Number((q && q.material) || 0)) +
      '<hr class="hairline">' +
      rowValor('Total', Number((q && q.total) || 0) + taxa, true) +
    '</div>';
  }

  function orcamentoBlock(req, prof) {
    let list = Array.isArray(req.orcamentos) ? req.orcamentos.slice() : [];
    if (!list.length && req.orcamento) list = [req.orcamento];
    if (!list.length) return '';

    const accepted = list.find(function (q) { return q.status === 'aprovado'; });
    if (accepted) {
      const escolhido = quoteProfessional(req, accepted, prof);
      const combinadoNoChat = Number(accepted.total || 0) === 0 &&
        Number(accepted.maoDeObra || 0) === 0 && Number(accepted.material || 0) === 0 &&
        Number(accepted.taxaVisita || 0) === 0;
      return (
        '<div class="section">' +
          '<div class="section-head"><h2 class="h3">Profissional escolhido</h2><span class="badge badge--success"><span class="badge__dot"></span>' + (combinadoNoChat ? 'Combinado no chat' : 'Proposta aprovada') + '</span></div>' +
          profCard(escolhido) +
          (combinadoNoChat
            ? '<div class="card card--tight" style="margin-top:10px;background:var(--success-100);border:none;"><div class="text--strong" style="color:var(--success-600);">Serviço combinado pelo chat</div><div class="text--sm text--secondary" style="margin-top:4px;">Valor, horário e detalhes podem ser consultados na conversa com o profissional.</div></div>'
            : quoteValueCard(accepted)) +
        '</div>'
      );
    }

    const pendentes = list.filter(function (q) { return q.status === 'pendente'; });
    const recusados = list.filter(function (q) { return q.status === 'recusado'; });
    if (!pendentes.length && !recusados.length) return '';

    return (
      '<div class="section">' +
        '<div class="section-head"><div><h2 class="h3">Propostas recebidas (opcional)</h2><p class="text--sm text--secondary" style="margin-top:3px;">A proposta é opcional. Você pode conversar pelo chat, combinar os detalhes e confirmar o profissional.</p></div>' +
          (pendentes.length ? '<span class="badge badge--orange">' + pendentes.length + (pendentes.length === 1 ? ' proposta' : ' propostas') + '</span>' : '') +
        '</div>' +
        '<div class="qf-call-reach" data-call-reach data-call-id="' + PU.escapeHtml(req.id) + '" data-orcamentos="' + pendentes.length + '" style="margin-bottom:10px;"><span data-call-reach-copy>' + (pendentes.length ? pendentes.length + (pendentes.length === 1 ? ' orçamento recebido' : ' orçamentos recebidos') : 'Aguardando propostas…') + '</span></div>' +
        '<div class="stack--sm">' +
          pendentes.map(function (q) {
            const p = quoteProfessional(req, q, null);
            const dist = q.distanciaKm == null ? '' : '<div class="text--sm text--secondary" style="margin-top:7px;">' + icon('mapPin', 'list-item__chevron') + ' Aproximadamente ' + Number(q.distanciaKm).toFixed(1).replace('.', ',') + ' km de você</div>';
            return '<div class="card" style="border:1px solid var(--border);">' +
              profCard(p, dist) +
              quoteValueCard(q) +
              '<div class="btn-row" style="margin-top:12px;">' +
                '<button class="btn btn--outline" data-action="recusar-orcamento" data-quote-id="' + PU.escapeHtml(q.id) + '">Não escolher</button>' +
                '<button class="btn btn--primary" data-action="aprovar-orcamento" data-quote-id="' + PU.escapeHtml(q.id) + '">' + icon('check') + ' Escolher profissional</button>' +
              '</div>' +
            '</div>';
          }).join('') +
        '</div>' +
        (recusados.length ? '<div class="text--sm text--secondary" style="margin-top:10px;">' + recusados.length + (recusados.length === 1 ? ' proposta descartada.' : ' propostas descartadas.') + '</div>' : '') +
      '</div>'
    );
  }

  function rowValor(label, cents, strong) {
    return '<div class="row-between"><span class="text' + (strong ? ' text--strong' : ' text--secondary text--sm') + '">' + label + '</span><span class="text' + (strong ? ' h3' : ' text--sm') + '">' + PU.formatCurrency(cents) + '</span></div>';
  }

  function pagamentoBlock(req) {
    if (req.status !== STATUS.SERVICO_CONCLUIDO) return '';
    return (
      '<div class="section">' +
        '<div class="card" style="text-align:center;padding:26px 16px;background:var(--warning-100);border:1px solid rgba(181,114,11,.22);">' +
          '<div class="icon-tile icon-tile--lg icon-tile--orange" style="margin:0 auto 12px;">' + icon('checkCircle') + '</div>' +
          '<h2 class="h3">Falta finalizar no QuemFaz</h2>' +
          '<p class="text text--secondary text--sm" style="margin-top:4px;">O profissional marcou o serviço como concluído. Para continuar usando o app, confirme a finalização e avalie o atendimento abaixo.</p>' +
          '<div class="text--sm text--secondary" style="margin-top:10px;">O pagamento do serviço continua sendo combinado diretamente com o profissional.</div>' +
        '</div>' +
      '</div>'
    );
  }

  function avaliacaoBlock(req, prof) {
    if ((req.status === STATUS.SERVICO_CONCLUIDO || req.status === STATUS.PAGO) && !req.avaliacaoCliente) {
      return (
        '<div class="section">' +
          '<div class="section-head"><h2 class="h3">Finalizar e avaliar serviço</h2></div>' +
          '<div class="card stack" id="avaliacao-form" style="border:2px solid var(--orange-500);">' +
            '<div class="text--strong">Como foi o serviço?</div>' +
            '<div class="text--sm text--secondary">Confirme que o serviço terminou e avalie ' + PU.escapeHtml((prof || {}).nome || 'o profissional') + '. Sua avaliação ajuda outros clientes a escolher.</div>' +
            '<div class="star-picker" id="cliente-star-picker">' +
              [1, 2, 3, 4, 5].map(function (n) { return '<button type="button" data-star="' + n + '" aria-label="' + n + ' estrelas">' + icon('starFilled') + '</button>'; }).join('') +
            '</div>' +
            '<textarea class="textarea" id="cliente-avaliacao-comentario" placeholder="Conte como foi (opcional)"></textarea>' +
            '<button class="btn btn--primary" data-action="enviar-avaliacao">' + icon('checkCircle') + ' Finalizar e enviar avaliação</button>' +
          '</div>' +
        '</div>'
      );
    }
    if ((req.status === STATUS.SERVICO_CONCLUIDO || req.status === STATUS.PAGO) && req.avaliacaoCliente) {
      return (
        '<div class="section">' +
          '<div class="card card--tight" style="background:var(--success-100);border:none;">' +
            '<div class="text--strong" style="color:var(--success-600);">Sua parte foi concluída</div>' +
            '<div class="text--sm" style="color:var(--success-600);margin-top:4px;">Sua avaliação foi enviada. O serviço será encerrado no sistema quando o profissional também concluir a avaliação dele.</div>' +
          '</div>' +
        '</div>'
      );
    }
    if (req.status === STATUS.FINALIZADO && req.avaliacaoCliente) {
      return (
        '<div class="section">' +
          '<div class="section-head"><h2 class="h3">Serviço finalizado</h2></div>' +
          '<div class="card stack--sm">' +
            '<div class="text--sm text--secondary">Cliente e profissional concluíram o fluxo no QuemFaz.</div>' +
            starsDisplay(req.avaliacaoCliente.nota) +
            (req.avaliacaoCliente.comentario ? '<p class="text text--sm">' + PU.escapeHtml(req.avaliacaoCliente.comentario) + '</p>' : '') +
          '</div>' +
        '</div>'
      );
    }
    return '';
  }

  function canceladoBlock(req) {
    if (req.status !== STATUS.CANCELADO) return '';
    return (
      '<div class="section">' +
        '<div class="card" style="background:var(--danger-100);border:none;">' +
          '<div class="row"><div class="icon-tile" style="background:var(--danger-600);">' + icon('xCircle') + '</div>' +
          '<div><div class="text--strong" style="color:var(--danger-600);">Pedido cancelado</div>' +
          '<div class="text--sm" style="color:var(--danger-600);">' + (req.motivoCancelamento ? PU.escapeHtml(req.motivoCancelamento) : 'Sem motivo informado.') + '</div></div></div>' +
        '</div>' +

              '<div class="status-step__rail">' +
                '<div class="status-step__dot">' + (s.state === 'done' ? icon('check') : '') + '</div>' +
                (i < steps.length - 1 ? '<div class="status-step__line"></div>' : '') +

              '<div class="status-step__body">' +
                '<div class="status-step__title">' + s.title + '</div>' +
                (s.sub ? '<div class="status-step__sub">' + s.sub + (s.state === 'current' && s.working ? '<span class="status-step__waiting-dots" aria-hidden="true"><i></i><i></i><i></i></span>' : '') + '</div>' : '') +
                (s.state === 'current' && s.working ? '<div class="status-step__activity" aria-hidden="true"></div>' : '') +
              '</div>' +
            '</div>';
          }).join('') +
        '</div>' +

    );

  function buildTrackSteps(req) {
    if (req.status === STATUS.CANCELADO) {
      return [
        { title: 'Pedido criado', sub: PU.formatDateTime(req.criadoEm), state: 'done' },
        { title: 'Cancelado', sub: PU.formatDateTime(req.atualizadoEm), state: 'current' },
      ];
    }
    // V11.22: fluxo simples, sem as etapas de orçamento.
    const order = [STATUS.BUSCANDO, STATUS.AGUARDANDO_ORCAMENTO, STATUS.SERVICO_CONCLUIDO, STATUS.FINALIZADO];
    const titles = {
      buscando: 'Pedido publicado', aguardando_orcamento: 'Profissional em contato',
      servico_concluido: 'Serviço concluído', finalizado: 'Avaliação concluída',
    };
    const activity = {
      buscando: 'Buscando profissionais próximos',
      aguardando_orcamento: 'O profissional vai chamar você no WhatsApp',
      servico_concluido: 'Aguardando sua avaliação',
      finalizado: 'Processo finalizado'
    };
    let effectiveStatus = req.status;
    if ([STATUS.AGUARDANDO_ACEITE, STATUS.SEM_PROFISSIONAL].indexOf(req.status) !== -1) effectiveStatus = STATUS.BUSCANDO;
    if (DB.STATUS_DESBLOQUEADO.indexOf(req.status) !== -1) effectiveStatus = STATUS.AGUARDANDO_ORCAMENTO;
    if (req.status === STATUS.PAGO) effectiveStatus = STATUS.SERVICO_CONCLUIDO;
    const idx = order.indexOf(effectiveStatus);
    const fluxoFinalizado = effectiveStatus === STATUS.FINALIZADO;
    return order.map(function (st, i) {
      const state = fluxoFinalizado ? 'done' : (i < idx ? 'done' : i === idx ? 'current' : 'pending');
      return {
        title: titles[st],
        sub: state === 'current' ? activity[st] : '',
        working: state === 'current' && !fluxoFinalizado,
        state: state
      };
    });
  }

  function bindCategoryBrowser(content) {
    const input = content.querySelector('[data-category-search]');
    const cityInput = content.querySelector('[data-service-city]');
    const ufInput = content.querySelector('[data-service-uf]');
    const cepInput = content.querySelector('[data-service-cep]');
    const cepBtn = content.querySelector('[data-service-lookup-cep]');
    const regionStatus = content.querySelector('[data-service-region-status]');
    const matchStatus = content.querySelector('[data-service-match-status]');
    const suggestionsBox = content.querySelector('[data-service-suggestions]');
    const cats = DB.categories();
    if (!input || !cats.length) return;

    function norm(v) {
      return String(v || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
    }
    const aliases = {
      cat_pintor: 'pintura pintar parede paredes pintores',
      cat_eletricista: 'eletrica eletrico eletricidade instalacao eletrica tomada chuveiro',
      cat_encanador: 'encanamento hidraulica hidraulico vazamento torneira cano',
      cat_montador: 'montagem moveis montar movel armario guarda roupa guarda-roupa',
      cat_diarista: 'faxina limpeza domestica casa apartamento',
      cat_jardinagem: 'jardim jardinagem jardineiro grama',
      cat_arcondicionado: 'ar condicionado climatizacao instalar ar',
      cat_chaveiro: 'chave fechadura porta',
      cat_pedreiro: 'reforma reformar obra construcao construir alvenaria',
      cat_mecanico: 'mecanica carro automovel veículo veiculo',
      cat_borracheiro: 'pneu borracharia',
      cat_frete: 'carreto mudanca transporte frete',
      cat_informatica: 'computador notebook pc informatica',
      cat_soldador: 'solda soldagem portao portão',
      cat_vidraceiro: 'vidro janela box espelho',
      cat_serralheiro: 'serralheria portao portão grade',
      cat_marceneiro: 'marcenaria madeira armario armário',
      cat_guincho: 'reboque guincho',
      cat_motorista: 'motorista transporte',
      cat_entregador: 'entrega entregador motoboy'
    };
    const stopWords = { de:1, da:1, do:1, das:1, dos:1, em:1, para:1, e:1, a:1, o:1 };
    function queryTokens(v) {
      return norm(v).replace(/[^a-z0-9]+/g, ' ').split(/\s+/).filter(function (w) { return w.length > 1 && !stopWords[w]; });
    }
    function categoryHaystack(cat) {
      return norm((cat.nome || '') + ' ' + (aliases[cat.id] || ''));
    }
    function categoryTokens(cat) {
      return queryTokens((cat.nome || '') + ' ' + (aliases[cat.id] || ''));
    }
    function categoryScore(cat, raw) {
      const q = norm(raw);
      const qTokens = queryTokens(raw);
      if (!qTokens.length) return 0;
      const name = norm(cat.nome);
      const hay = categoryHaystack(cat);
      const tokens = categoryTokens(cat);
      let score = 0;
      if (name === q) score += 100;
      if (name.indexOf(q) === 0) score += 45;
      if (hay.indexOf(q) !== -1) score += 30;
      let matched = 0;
      qTokens.forEach(function (qt) {
        const exact = tokens.indexOf(qt) !== -1;
        const prefix = tokens.some(function (t) { return t.indexOf(qt) === 0 || qt.indexOf(t) === 0; });
        if (exact) { score += 18; matched++; }
        else if (prefix) { score += 10; matched++; }
      });
      if (matched === qTokens.length) score += 28;
      else if (matched === 0) return 0;
      return score;
    }
    function suggestedCategories(raw) {
      const q = norm(raw);
      if (q.length < 2) return [];
      return cats.map(function (cat) { return { cat: cat, score: categoryScore(cat, raw) }; })
        .filter(function (x) { return x.score > 0; })
        .sort(function (a, b) { return b.score - a.score || String(a.cat.nome).localeCompare(String(b.cat.nome)); })
        .slice(0, 6)
        .map(function (x) { return x.cat; });
    }
    function bestCategory(raw) {
      const q = norm(raw);
      if (q.length < 3) return null;
      const exact = cats.find(function (cat) { return norm(cat.nome) === q; });
      if (exact) return exact;
      const ranked = suggestedCategories(raw);
      if (!ranked.length) return null;
      const firstScore = categoryScore(ranked[0], raw);
      const secondScore = ranked[1] ? categoryScore(ranked[1], raw) : 0;
      const allTokensMatch = queryTokens(raw).every(function (qt) {
        return categoryTokens(ranked[0]).some(function (t) { return t === qt || t.indexOf(qt) === 0 || qt.indexOf(t) === 0; });
      });
      if (allTokensMatch && (firstScore >= 55 || firstScore - secondScore >= 18)) return ranked[0];
      return null;
    }
    function renderSuggestions() {
      if (!suggestionsBox) return;
      const list = suggestedCategories(input.value);
      if (!list.length || norm(input.value).length < 2) {
        suggestionsBox.hidden = true;
        suggestionsBox.innerHTML = '';
        return;
      }
      suggestionsBox.innerHTML = list.map(function (cat) {
        return '<button type="button" class="qf-service-suggestion" data-service-suggestion="' + PU.escapeHtml(cat.id) + '">' +
          '<span class="qf-service-suggestion__icon">' + icon(cat.icon || 'briefcase') + '</span>' +
          '<span class="qf-service-suggestion__body"><span class="qf-service-suggestion__name">' + PU.escapeHtml(cat.nome) + '</span>' +
          '<span class="qf-service-suggestion__group">' + PU.escapeHtml(cat.grupo || 'Serviço') + '</span></span>' +
          icon('chevronRight', 'list-item__chevron') + '</button>';
      }).join('');
      suggestionsBox.hidden = false;
    }
    function region() {
      const cidade = String(cityInput && cityInput.value || '').trim();
      const uf = String(ufInput && ufInput.value || '').trim().toUpperCase();
      const cep = global.QFGeo.normalizeCep(cepInput && cepInput.value || '');
      return { cidade: cidade, uf: uf, cep: cep ? global.QFGeo.formatCep(cep) : '' };
    }
    function saveRegion(showToast) {
      const r = region();
      if (!r.cidade || !r.uf) {
        if (showToast) PU.toast('Escolha a cidade e o estado, ou informe o CEP.', 'danger');
        return null;
      }
      try { sessionStorage.setItem('qf_client_search_region', JSON.stringify(r)); } catch (_) {}
      if (regionStatus) regionStatus.textContent = 'Região selecionada: ' + r.cidade + '/' + r.uf;
      return r;
    }
    function setMatch(message, kind, actionCat) {
      if (!matchStatus) return;
      matchStatus.className = 'qf-auto-service-status' + (kind ? ' qf-auto-service-status--' + kind : '');
      matchStatus.innerHTML = PU.escapeHtml(message || '');
      if (actionCat) {
        matchStatus.innerHTML += '<button class="btn btn--outline qf-auto-service-status__btn" type="button" data-service-continue="' + PU.escapeHtml(actionCat.id) + '">Continuar e ampliar busca</button>';
      }
    }
    function localCoverage(cat, r) {
      const cityNorm = norm(r.cidade), uf = String(r.uf || '').toUpperCase();
      const all = (DB.state.users && DB.state.users.profissionais ? DB.state.users.profissionais : []).filter(function (p) {
        if (!p || p.bloqueado || p.statusAprovacao !== 'aprovado' || !Array.isArray(p.categorias) || p.categorias.indexOf(cat.id) === -1) return false;
        const cityObj = p.cidadeId ? DB.cityById(p.cidadeId) : null;
        const pCity = norm(p.cidade || (p.endereco && p.endereco.cidade) || (cityObj && cityObj.nome) || '');
        const pUf = String(p.uf || (p.endereco && p.endereco.uf) || (cityObj && cityObj.uf) || '').toUpperCase();
        return pCity === cityNorm && (!uf || !pUf || pUf === uf);
      });
      return { total: all.length, online: all.filter(function (p) { return !!p.online; }).length, nearby: false };
    }
    async function cloudCoverage(cat, r, nearby) {
      const cl = global.QFCloud && global.QFCloud.client;
      if (!cl) return null;
      let lat = null, lng = null;
      if (nearby && global.QFGeo && typeof global.QFGeo.geocodeCity === 'function') {
        try {
          const loc = await global.QFGeo.geocodeCity(r.cidade, r.uf);
          if (loc) {
            lat = Number(loc.latitude);
            lng = Number(loc.longitude);
            if (!isFinite(lat) || !isFinite(lng)) { lat = null; lng = null; }
          }
        } catch (_) {}
      }
      const res = await cl.rpc('qf_cobertura_regiao', {
        p_categoria: cat.id,
        p_cidade: r.cidade,
        p_uf: r.uf,
        p_lat: lat,
        p_lng: lng
      });
      if (res.error || !res.data || !res.data.ok) return null;
      return {
        total: Number(res.data.profissionais || 0),
        online: Number(res.data.online_agora || 0),
        nearby: !!nearby
      };
    }

    let timer = 0;
    let seq = 0;
    let navigating = false;
    async function tryAutoOpen() {
      if (navigating) return;
      const cat = bestCategory(input.value);
      if (!cat) {
        if (norm(input.value).length >= 3) setMatch('Continue digitando para identificarmos o serviço.', '', null);
        else setMatch('Digite o serviço e escolha sua cidade. O QuemFaz identifica a categoria automaticamente.', '', null);
        return;
      }
      const r = saveRegion(false);
      if (!r) {
        setMatch('Serviço identificado: ' + cat.nome + '. Agora escolha a cidade ou informe o CEP.', 'found', null);
        return;
      }

      const my = ++seq;
      setMatch('Verificando profissionais de ' + cat.nome + ' em ' + r.cidade + '/' + r.uf + '...', 'checking', null);
      let cov = null;
      try {
        if (global.QFCloud && global.QFCloud.enabled && global.QFCloud.client) {
          cov = await cloudCoverage(cat, r, false);
          if (my !== seq) return;
          if (cov && cov.total === 0) {
            const near = await cloudCoverage(cat, r, true);
            if (my !== seq) return;
            if (near && near.total > 0) cov = near;
          }
        } else {
          cov = localCoverage(cat, r);
        }
      } catch (_) {
        cov = null;
      }
      if (my !== seq) return;

      if (cov && cov.total > 0) {
        const onlineTxt = cov.online > 0 ? (cov.online + (cov.online === 1 ? ' online agora' : ' online agora')) : (cov.total + (cov.total === 1 ? ' profissional cadastrado' : ' profissionais cadastrados'));
        setMatch((cov.nearby ? 'Encontramos profissionais próximos. ' : 'Encontramos profissional na sua região. ') + onlineTxt + '. Abrindo o pedido...', 'found', null);
        navigating = true;
        setTimeout(function () {
          global.navigate('/cliente/novo-pedido/' + encodeURIComponent(cat.id));
        }, 350);
        return;
      }

      if (cov && cov.total === 0) {
        setMatch('Ainda não encontramos ' + cat.nome.toLowerCase() + ' nessa região. Você pode continuar e o radar amplia a busca automaticamente.', 'none', cat);
        return;
      }

      setMatch('Serviço identificado: ' + cat.nome + '. Não foi possível confirmar a disponibilidade agora.', 'checking', cat);
    }
    function scheduleAutoOpen(delay) {
      clearTimeout(timer);
      timer = setTimeout(tryAutoOpen, delay == null ? 450 : delay);
    }
    async function lookupSearchCep() {
      const cep = global.QFGeo.normalizeCep(cepInput && cepInput.value || '');
      if (cep.length !== 8) { PU.toast('Digite um CEP válido.', 'danger'); return false; }
      try {
        if (cepBtn) cepBtn.disabled = true;
        const d = await global.QFGeo.lookupCep(cep);
        if (cityInput) cityInput.value = d.cidade || '';
        if (ufInput) ufInput.value = d.uf || '';
        if (cepInput) cepInput.value = global.QFGeo.formatCep(cep);
        saveRegion(false);
        PU.toast('CEP localizado: ' + (d.cidade || '') + (d.uf ? '/' + d.uf : ''), 'success');
        scheduleAutoOpen(80);
        return true;
      } catch (err) {
        PU.toast((err && err.message) || 'CEP não encontrado.', 'danger');
        return false;
      } finally {
        if (cepBtn) cepBtn.disabled = false;
      }
    }

    input.addEventListener('input', function () { renderSuggestions(); scheduleAutoOpen(450); });
    input.addEventListener('keydown', function (e) {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      clearTimeout(timer);
      tryAutoOpen();
    });
    input.addEventListener('search', function () { scheduleAutoOpen(100); });
    if (cityInput) cityInput.addEventListener('input', function () { saveRegion(false); scheduleAutoOpen(600); });
    if (ufInput) ufInput.addEventListener('change', function () { saveRegion(false); scheduleAutoOpen(120); });
    if (cepInput) {
      cepInput.addEventListener('input', function () {
        cepInput.value = global.QFGeo.formatCep(cepInput.value);
        if (global.QFGeo.normalizeCep(cepInput.value).length === 8) lookupSearchCep();
      });
    }
    if (cepBtn) cepBtn.addEventListener('click', lookupSearchCep);
    content.addEventListener('click', function (e) {
      const suggestion = e.target.closest && e.target.closest('[data-service-suggestion]');
      if (suggestion) {
        e.preventDefault();
        const catId = suggestion.getAttribute('data-service-suggestion');
        const cat = cats.find(function (x) { return x.id === catId; });
        if (!cat) return;
        input.value = cat.nome;
        if (suggestionsBox) { suggestionsBox.hidden = true; suggestionsBox.innerHTML = ''; }
        clearTimeout(timer);
        tryAutoOpen();
        return;
      }
      const btn = e.target.closest && e.target.closest('[data-service-continue]');
      if (!btn) return;
      const catId = btn.getAttribute('data-service-continue');
      const r = saveRegion(true);
      if (!catId || !r) return;
      global.navigate('/cliente/novo-pedido/' + encodeURIComponent(catId));
    });
    input.addEventListener('focus', renderSuggestions);
    input.addEventListener('blur', function () {
      setTimeout(function () { if (suggestionsBox) suggestionsBox.hidden = true; }, 180);
    });
    saveRegion(false);
  }
