      let fotos = [];
      global.QFGeo.bindAddressForm(form);

      function rawFileToDataUrl(file) {
        return new Promise(function (resolve, reject) {
          const reader = new FileReader();
          reader.onerror = function () { reject(reader.error || new Error('Falha ao ler o arquivo.')); };
          reader.onload = function () { resolve(String(reader.result || '')); };
          reader.readAsDataURL(file);
        });
      }

      function videoCount() {
        return fotos.filter(function (m) { return /^data:video\//i.test(String(m || '')); }).length;
      }

      async function addMediaFromInput(input) {
        if (!input) return;
        const selected = Array.prototype.slice.call(input.files || []);
        const room = 4 - fotos.length;
        if (room <= 0) {
          PU.toast('Você pode enviar até 4 mídias por chamado.', 'danger');
          input.value = '';
          return;
        }
        if (selected.length > room) PU.toast('Limite de 4 mídias por chamado.', 'danger');
        const files = selected.slice(0, room);

        for (const file of files) {
          try {
            let durl = '';
            if (/^image\//i.test(file.type || '')) {
              durl = await PU.fileToCompressedDataUrl(file, 640);
            } else if (/^video\//i.test(file.type || '')) {
              if (videoCount() >= 1) {
                PU.toast('Envie no máximo 1 vídeo por chamado.', 'danger');
                continue;
              }
              if (Number(file.size || 0) > 3 * 1024 * 1024) {
                PU.toast('O vídeo precisa ter no máximo 3 MB. Grave um vídeo mais curto.', 'danger');
                continue;
              }
              durl = await rawFileToDataUrl(file);
            } else {
              PU.toast('Use apenas foto ou vídeo.', 'danger');
              continue;
            }
            fotos.push(durl);
            renderThumb(durl);
          } catch (_) {
            PU.toast('Não foi possível carregar esta mídia.', 'danger');
          }
        }
        input.value = '';
      }

      [galleryInput, cameraInput, videoInput].forEach(function (input) {
        if (!input) return;
        input.addEventListener('change', function () { addMediaFromInput(input); });
      });

      function renderThumb(durl) {
        const wrap = document.createElement('div');
        wrap.className = 'upload-thumb-wrap';
        const safe = PU.escapeHtml(String(durl || ''));
        const media = /^data:video\//i.test(String(durl || ''))
          ? '<video class="upload-thumb" src="' + safe + '" controls playsinline muted preload="metadata" aria-label="Vídeo do serviço"></video>'
          : '<img class="upload-thumb" src="' + safe + '" alt="Foto do serviço">';
        wrap.innerHTML = media + '<span class="upload-thumb-remove" role="button" tabindex="0" aria-label="Remover mídia">' + icon('x') + '</span>';
        wrap.querySelector('.upload-thumb-remove').addEventListener('click', function () {
          fotos = fotos.filter(function (f) { return f !== durl; });
          wrap.remove();
        });
        uploadRow.appendChild(wrap);
      }

      (function applyRepeatOrderDraft() {
        let draft = null;
        try {
          const raw = sessionStorage.getItem('qf_repeat_order_draft');
          if (raw) draft = JSON.parse(raw);
        } catch (_) { draft = null; }
        if (!draft || String(draft.categoriaId || '') !== String(params.catId || '')) return;

        const setField = function (name, value) {
          const el = form.querySelector('[name="' + name + '"]');
          if (el && value != null) el.value = String(value);
        };
        setField('descricao', draft.descricao || '');

        const end = draft.endereco || {};
        setField('cep', end.cep || '');
        setField('rua', end.rua || '');
        setField('bairro', end.bairro || '');
        setField('cidade', end.cidade || '');
        setField('uf', end.uf || '');
        setField('complemento', end.complemento || '');
        setField('latitude', end.latitude != null ? end.latitude : '');
        setField('longitude', end.longitude != null ? end.longitude : '');

        fotos = Array.isArray(draft.fotos) ? draft.fotos.slice(0, 4) : [];
        fotos.forEach(function (media) { renderThumb(media); });

        try { sessionStorage.removeItem('qf_repeat_order_draft'); } catch (_) {}
        PU.toast('Pedido anterior carregado. Revise e publique quando quiser.', 'success');
      })();

      form.addEventListener('submit', async function (e) {
      e.preventDefault();
      const fd = new FormData(form);
      const cep = fd.get('cep').trim();
      if (!global.QFGeo.normalizeCep(cep)) { PU.toast('Informe um CEP válido para localizar o chamado corretamente.', 'danger'); return; }
      const cidade = fd.get('cidade').trim(); const uf = fd.get('uf');
      if (!cidade || !uf) { PU.toast('Informe cidade e estado.', 'danger'); return; }
      let localCity = DB.cities().find(function (c) { return String(c.nome).toLowerCase() === cidade.toLowerCase() && c.uf === uf; });
      if (!localCity) localCity = DB.criarCidade(cidade, uf);
      const endereco = {
        id: PU.uid('end'), rua: fd.get('rua').trim(), bairro: fd.get('bairro').trim(), cidade: cidade, uf: uf,
        cidadeId: localCity.id, cep: global.QFGeo.formatCep(cep), complemento: fd.get('complemento').trim(),
        latitude: Number(fd.get('latitude')) || null, longitude: Number(fd.get('longitude')) || null
      };
      const prioridade = fd.get('prioridade') === '1';
      const prioridadeMetodo = fd.get('prioridadeMetodo') || 'pix';
      const btn = form.querySelector('button[type="submit"]');
      const btnHtml = btn ? btn.innerHTML : '';
      if (btn) { btn.disabled = true; btn.textContent = 'Publicando chamado…'; }
      try {
        const dados = { clienteId: user.id, categoriaId: params.catId, descricao: fd.get('descricao').trim(), fotos: fotos, endereco: endereco, prioridade: prioridade, prioridadeMetodo: prioridadeMetodo };
        const req = (global.QFCloud && global.QFCloud.enabled)
          ? await global.QFCloud.createCall(dados)
          : DB.criarPedido(dados);
        if (prioridade) {
          const pp = req.pagamentoPrioridade || {};
          if (pp.status === 'aprovado') PU.toast('Pagamento confirmado. Prioridade ativada!', 'success');
          else if (pp.status === 'erro') PU.toast('Chamado publicado normalmente. A prioridade não foi ativada porque o pagamento não pôde ser iniciado.', 'danger');
          else PU.toast('Chamado publicado. A prioridade ficará ativa somente depois do pagamento.', 'success');
        } else {
          PU.toast('Chamado criado grátis! O sistema começou a procurar os profissionais mais próximos da categoria.', 'success');
        }
        global.navigate('/cliente/pedido/' + req.id, true);
      } catch (err) {
        PU.toast('Não foi possível criar o chamado. ' + (err && err.message ? err.message : ''), 'danger');
      } finally {
        if (btn) { btn.disabled = false; btn.innerHTML = btnHtml; }
      }
    });
  }

  let qfReachTimer=null;
  function stopCallReachPolling(){if(qfReachTimer){clearInterval(qfReachTimer);qfReachTimer=null;}}
  function renderCallReach(el,req,data){
    if(!el||!req||!data)return;
    const avisados=Number(data.avisados||0),online=Number(data.online_na_regiao||0);
    if(avisados>0){el.innerHTML='<strong>'+avisados+' profissional'+(avisados===1?'':'is')+' perto de você '+(avisados===1?'já foi avisado':'já foram avisados')+'</strong>';return;}
    if(online>0){el.textContent='Avisando os profissionais mais próximos…';return;}
    const created=typeof req.criadoEm==='number'?req.criadoEm:Date.parse(req.criadoEm||'');
    if(!Number.isFinite(created)||Date.now()-created<120000){el.textContent='Procurando profissionais online na sua região…';return;}
    const cat=DB.categoryById(req.categoriaId);
    el.innerHTML='<div class="qf-no-coverage"><div class="text--strong">Nenhum profissional online agora</div><div class="text--sm text--secondary" style="margin-top:4px;">No momento não há profissionais de '+PU.escapeHtml((cat&&cat.nome)||'serviço')+' online na sua região. Seu pedido continua publicado e avisaremos assim que alguém ficar disponível.</div><button class="btn btn--outline" type="button" data-support-open>Falar com o QuemFaz</button><button class="btn btn--primary" type="button" data-action="manter-pedido">Manter pedido</button></div>';
  }
  function startCallReachPolling(content,req){
    stopCallReachPolling();
    if(!req||(req.status!==STATUS.BUSCANDO&&req.status!==STATUS.AGUARDANDO_ACEITE))return;
    const el=content.querySelector('[data-call-reach]');
    if(!el||!(global.QFCloud&&global.QFCloud.client))return;
    async function load(){
      if(location.hash!=='#/cliente/pedido/'+req.id){stopCallReachPolling();return;}
      try{const res=await global.QFCloud.client.rpc('qf_chamado_alcance',{p_chamado_id:req.id});if(res.error)throw res.error;renderCallReach(el,req,res.data||{});}catch(err){console.warn('QuemFaz alcance do chamado',err);}
    }
    load();qfReachTimer=setInterval(load,15000);
  }

  function bindPedidoDetalhe(content, params, user) {
    const req = DB.requestById(params.id);
    if (!req) return;
    startCallReachPolling(content, req);

    if (req.status === STATUS.BUSCANDO && !(global.QFCloud && global.QFCloud.enabled)) {
      setTimeout(function () {
        if (location.hash !== '#/cliente/pedido/' + req.id) return;
        DB.buscarProfissional(req.id);
        global.navigate('/cliente/pedido/' + req.id, true);
      }, 1600);
    }

    content.addEventListener('click', function (e) {
      const action = e.target.closest('[data-action]');
      if (!action) return;
      const act = action.getAttribute('data-action');

      if (act === 'manter-pedido') {
        const box=action.closest('.qf-no-coverage');
        if(box)box.innerHTML='<div class="text--sm text--secondary">Pedido mantido. Continuaremos procurando e avisaremos quando houver profissional disponível.</div>';
        return;
      }
      if (act === 'tentar-novamente') {
        if (global.QFCloud && global.QFCloud.enabled) {
          global.QFCloud.syncForCurrentSession(true).then(function () { global.navigate('/cliente/pedido/' + req.id, true); });
        } else {
          DB.buscarProfissional(req.id);
          global.navigate('/cliente/pedido/' + req.id, true);
        }
      }
      if (act === 'refazer-pedido') {
        try {
          sessionStorage.setItem('qf_repeat_order_draft', JSON.stringify({
            sourceId: req.id,
            categoriaId: req.categoriaId,
            descricao: req.descricao || '',
            fotos: Array.isArray(req.fotos) ? req.fotos.slice(0, 4) : [],
            endereco: req.endereco || null
          }));
        } catch (_) {}
        global.navigate('/cliente/novo-pedido/' + encodeURIComponent(req.categoriaId));
      }
      if (act === 'gerar-pagamento-prioridade') {
        if (!(global.QFCloud && global.QFCloud.enabled)) return;
        const paymentId = action.getAttribute('data-payment-id');
        action.disabled = true;
        const oldHtml = action.innerHTML;
        action.textContent = 'Gerando pagamento...';
        (async function () {
          try {
            const out = await global.QFCloud.startEfiCheckout('prioridade', paymentId);
            if (!out.checkout_url) throw new Error('O link de pagamento não foi gerado.');
            if (req.pagamentoPrioridade) req.pagamentoPrioridade.checkoutUrl = out.checkout_url;
            DB.persist();
            location.href = out.checkout_url;
          } catch (err) {
            PU.toast((err && err.message) || 'Não foi possível gerar o pagamento.', 'danger');
            action.disabled = false;
            action.innerHTML = oldHtml;
          }
        })();
      }
      if (act === 'cancelar-pedido') {
        PU.confirmDialog({ title: 'Cancelar pedido', message: 'Tem certeza que deseja cancelar este pedido?', okLabel: 'Cancelar pedido', danger: true }).then(function (ok) {
          if (!ok) return;
          if (global.QFCloud && global.QFCloud.enabled) {
            global.QFCloud.cancelClientCall(req.id).then(function () {
              PU.toast('Pedido cancelado.', 'danger');
              global.navigate('/cliente/pedido/' + req.id, true);
            }).catch(function (err) {
              PU.toast('Não foi possível cancelar. ' + (err && err.message ? err.message : ''), 'danger');
            });
          } else {
            DB.cancelarPedido(req.id, 'cliente', 'Cancelado pelo cliente.');
            PU.toast('Pedido cancelado.', 'danger');
            global.navigate('/cliente/pedido/' + req.id, true);
          }
        });
      }
      if (act === 'aprovar-orcamento') {
        (async function () {
          try {
            if (global.QFCloud && global.QFCloud.enabled) await global.QFCloud.respondQuote(req.id, 'aceitar', '');
            else DB.aprovarOrcamento(req.id);
            PU.toast('Orçamento aprovado!', 'success');
            global.navigate('/cliente/pedido/' + req.id, true);
          } catch (err) {
            PU.toast('Não foi possível aprovar o orçamento. ' + (err && err.message ? err.message : ''), 'danger');
          }
        })();
      }
      if (act === 'recusar-orcamento') {
        PU.openSheet(
          '<h3 class="sheet__title">Orçamento acima do esperado?</h3>' +
          '<p class="text text--secondary text--sm">Você pode pedir um novo valor ao mesmo profissional ou voltar o chamado para buscar outro profissional.</p>' +
          '<textarea class="textarea" id="motivo-recusa" placeholder="Motivo opcional. Ex: valor acima do esperado"></textarea>' +
          '<div class="stack--sm" style="margin-top:14px;">' +
            '<button class="btn btn--outline" id="pedir-novo-valor">' + icon('refresh') + ' Pedir novo valor</button>' +
            '<button class="btn btn--primary" id="buscar-outro-profissional">' + icon('search') + ' Buscar outro profissional</button>' +
          '</div>'
        );

        async function processarRecusa(acao) {
          const campo = document.getElementById('motivo-recusa');
          const motivo = campo ? campo.value.trim() : '';
          PU.closeSheet();
          try {
            if (global.QFCloud && global.QFCloud.enabled) {
              await global.QFCloud.respondQuote(req.id, acao, motivo);
            } else if (acao === 'buscar_outro') {
              DB.buscarOutroProfissional(req.id, motivo);
            } else {
              DB.recusarOrcamento(req.id, motivo);
            }

            if (acao === 'buscar_outro') {
              PU.toast('Chamado voltou para a busca de outro profissional.', 'success');
            } else {
              PU.toast('Pedido de novo valor enviado ao profissional.', 'success');
            }
            global.navigate('/cliente/pedido/' + req.id, true);
          } catch (err) {
            PU.toast('Não foi possível atualizar o orçamento. ' + (err && err.message ? err.message : ''), 'danger');
          }
        }

        document.getElementById('pedir-novo-valor').addEventListener('click', function () {
          processarRecusa('recusar');
        });
        document.getElementById('buscar-outro-profissional').addEventListener('click', function () {
          processarRecusa('buscar_outro');
        });
      }
      if (act === 'enviar-avaliacao') {
        const picker = content.querySelector('#cliente-star-picker');
        const nota = Number(picker.getAttribute('data-nota') || 0);
        if (!nota) { PU.toast('Selecione uma nota de 1 a 5 estrelas.', 'danger'); return; }
        const comentario = content.querySelector('#cliente-avaliacao-comentario').value.trim();
        (async function () {
          try {
            if (global.QFCloud && global.QFCloud.enabled) await global.QFCloud.submitEvaluation(req.id, nota, comentario);
            else DB.avaliarComoCliente(req.id, nota, comentario);
            PU.toast('Obrigado pela avaliação!', 'success');
            global.navigate('/cliente/pedido/' + req.id, true);
          } catch (err) {
            PU.toast((err && err.message) || 'Não foi possível enviar a avaliação.', 'danger');
          }
        })();
      }
    });

    const picker = content.querySelector('#cliente-star-picker');
    if (picker) {
      picker.addEventListener('click', function (e) {
        const btn = e.target.closest('[data-star]');
        if (!btn) return;
        const n = Number(btn.getAttribute('data-star'));
        picker.setAttribute('data-nota', n);
        Array.prototype.forEach.call(picker.querySelectorAll('[data-star]'), function (b) {
          b.classList.toggle('is-active', Number(b.getAttribute('data-star')) <= n);
        });
      });
    }
  }

  function bindEndereco(content, user) {
    const form = content.querySelector('#endereco-form');
    global.QFGeo.bindAddressForm(form);
    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      const fd = new FormData(form);
      if (!global.QFGeo.normalizeCep(fd.get('cep'))) { PU.toast('Digite um CEP válido.', 'danger'); return; }
      const cidade = fd.get('cidade').trim(); const uf = fd.get('uf');
      if (!cidade || !uf) { PU.toast('Informe cidade e UF.', 'danger'); return; }
      let localCity = DB.cities().find(function (c) { return String(c.nome).toLowerCase() === cidade.toLowerCase() && c.uf === uf; });
      if (!localCity) localCity = DB.criarCidade(cidade, uf);
      const endereco = {
        id: PU.uid('end'), rua: fd.get('rua').trim(), bairro: fd.get('bairro').trim(), cidade: cidade, uf: uf,
        cidadeId: localCity.id, cep: global.QFGeo.formatCep(fd.get('cep')), complemento: fd.get('complemento').trim(),
        latitude: Number(fd.get('latitude')) || null, longitude: Number(fd.get('longitude')) || null
      };
      try {
        if (global.QFCloud && global.QFCloud.enabled) await global.QFCloud.saveClientAddress(endereco);
        user.enderecos = [endereco]; DB.persist();
        PU.toast('Endereço validado e salvo!', 'success');
        global.navigate('/cliente/perfil', true);
      } catch (err) { PU.toast('Não foi possível salvar o endereço. ' + ((err && err.message) || ''), 'danger'); }
    });
  }
})(window);


/* QuemFaz — telas da área Profissional */

(function (global) {

  const STATUS = DB.STATUS;

  // ---------------- Início / chamadas ----------------

  function qfLocalFlag(key){try{return localStorage.getItem(key)==='1';}catch(_){return false;}}
  function profileProgressHtml(user){

    const regionOk=!!((user.areasAtendimento&&user.areasAtendimento.some(function(a){return a&&a.cidade&&a.uf;}))||user.cidadeId);
    const pushOk=!!(global.QFPush&&global.QFPush.permission()==='granted'&&global.QFPush.isActive());

  }

  Screens.profHomeRender = function (params, user) {
    const chamadas=DB.chamadasPendentes(user.id);
    const podeFicarOnline=user.statusAprovacao==='aprovado'&&!!user.fotoUrl;
    const adPlans=(DB.state.settings&&DB.state.settings.adPlans)||{};
    const meusAnuncios=(DB.state.ads||[]).filter(function(a){return a.anuncianteId===user.id;}).sort(function(a,b){return new Date(b.criadoEm||0)-new Date(a.criadoEm||0);});
    const firstCat=user.categorias&&user.categorias.length?DB.categoryById(user.categorias[0]):null;
    const area=user.areasAtendimento&&user.areasAtendimento.length?user.areasAtendimento[0]:null;
    const raio=Number((area&&area.raioKm)||user.raioKm||10);
    const extraCats=user.categorias&&user.categorias.length>1?' e mais '+(user.categorias.length-1):'';
    function adStatusLabel(a){if(!a)return '';if(a.status==='ativo')return '<span class="badge badge--success"><span class="badge__dot"></span>No ar</span>';if(a.status==='reprovado')return '<span class="badge badge--danger"><span class="badge__dot"></span>Reprovado</span>';if(a.status==='pausado')return '<span class="badge badge--warning"><span class="badge__dot"></span>Pausado</span>';return '<span class="badge badge--warning"><span class="badge__dot"></span>Aguardando aprovação</span>';}
    return '<div class="view">'+
      pendingGate(user)+
      '<div class="card qf-prof-status'+(user.online?' is-online':'')+'"><div class="qf-prof-status__title">'+(user.online?'Você está online':'Você está offline')+'</div><div class="qf-prof-status__sub">'+(user.online?'Recebendo chamados de '+PU.escapeHtml(firstCat?firstCat.nome:'suas categorias')+extraCats+' até '+raio+' km':'Fique online para receber chamados perto de você')+'</div><input type="checkbox" id="toggle-online" aria-label="Ficar online" style="display:none;" '+(user.online?'checked':'')+(podeFicarOnline||user.online?'':' data-blocked="1"')+'>'+(user.online?'<button class="btn btn--online-off" type="button" data-action="ficar-offline-agora">Ficar offline</button>':'<button class="btn btn--primary" type="button" data-action="ficar-online-agora">FICAR ONLINE</button>')+'</div>'+
      profileProgressHtml(user)+
      (Number(user.bonusDesbloqueios||0)>0?'<div class="card" style="margin-top:12px;background:var(--success-100);border:1px solid #bfe8d6;"><div class="row" style="align-items:flex-start;"><div class="icon-tile" style="background:var(--success-600);">'+icon('unlock')+'</div><div class="spacer"><div class="text--strong" style="color:var(--success-600);">Seu 1º chamado é GRÁTIS</div><div class="text--sm text--secondary" style="margin-top:3px;">O primeiro desbloqueio é por nossa conta. Depois, mantenha saldo na Carteira QuemFaz para abrir novos chamados.</div></div></div></div>':'')+
      '<div class="section" id="chamados-disponiveis"><div class="section-head"><h2 class="h3">Chamados disponíveis'+(chamadas.length?' <span class="badge badge--orange">'+chamadas.length+'</span>':'')+'</h2></div>'+(chamadas.length?'<div class="stack--sm">'+chamadas.map(function(req){return chamadaCard(req,user);}).join('')+'</div>':'<div class="empty-state"><div class="icon-tile icon-tile--ghost">'+icon('phoneCall')+'</div><p class="text text--secondary">Nenhuma oportunidade no momento.'+(user.online?' Você será avisado quando surgir um chamado da sua categoria dentro da sua área de atendimento.':' Fique online para visualizar oportunidades.')+'</p></div>')+'</div>'+
      '<div class="section"><div class="card row-between" style="background:var(--navy-100);border:none;"><div><div class="text--sm text--secondary">Carteira QuemFaz</div><div class="h2" style="color:var(--navy-900);">'+PU.formatCurrency(user.creditos||0)+'</div></div><button class="btn btn--sm btn--outline btn--block-auto" data-nav="/profissional/carteira">Adicionar</button></div></div>'+
      '<div class="section"><div class="section-head"><div><h2 class="h3">Divulgue seus serviços</h2><div class="text--sm text--secondary">Profissionais também podem anunciar no carrossel do QuemFaz.</div></div></div><div class="ad-plan-grid">'+['local','destaque','premium'].map(function(key){const p=adPlans[key]||{nome:key,valor:0};return '<div class="ad-plan" style="cursor:default;"><div class="row-between"><span class="ad-plan__name">'+PU.escapeHtml(p.nome||key)+'</span><span class="ad-plan__price">'+PU.formatCurrency(p.valor||0)+'</span></div><div class="text--sm text--secondary" style="margin-top:4px;">30 dias</div></div>';}).join('')+'</div><button class="btn btn--primary" data-nav="/profissional/anuncie" style="margin-top:12px;">'+icon('briefcase')+' Criar anúncio</button>'+(meusAnuncios.length?'<div class="card card--tight" style="margin-top:12px;"><div class="row-between"><div><div class="text--strong">Seu último anúncio</div><div class="text--sm text--secondary">'+PU.escapeHtml(meusAnuncios[0].empresa||'Anúncio')+'</div></div>'+adStatusLabel(meusAnuncios[0])+'</div></div>':'')+'</div>'+
      '</div>';
  };

  function distanceHighlight(req) {
    if (!Number.isFinite(Number(req && req.distanciaKm))) return '';
    const km = Number(req.distanciaKm).toFixed(1).replace('.', ',');
    return '<div style="margin-top:8px;padding:10px 12px;border-radius:12px;background:var(--orange-100);border:1px solid rgba(234,88,12,.22);display:flex;align-items:center;gap:8px;color:var(--orange-800);font-weight:700;">' +
      icon('mapPin', 'list-item__chevron') +
      '<span>Este pedido está a <strong>' + km + ' km</strong> de você</span>' +
    '</div>';
  }

  function chamadaCard(req, user) {
    const cat = DB.categoryById(req.categoriaId);
    const cidade = DB.cityById(req.cidadeId);
    const valor = DB.leadFeeForRequest(req);
    const primeiraGratis = false;
    const criadoMs = typeof req.criadoEm === 'number' ? req.criadoEm : Date.parse(req.criadoEm || '');
    const novoChamado = Number.isFinite(criadoMs) && (Date.now() - criadoMs) >= 0 && (Date.now() - criadoMs) <= 180000;
    return (
      '<button class="card card--pressable' + (novoChamado ? ' qf-new-call-alert' : '') + '" style="width:100%;text-align:left;" data-nav="/profissional/chamada/' + req.id + '">' +
        '<div class="row">' +
          '<div class="icon-tile icon-tile--orange">' + icon(cat ? cat.icon : 'tag') + '</div>' +
          '<div class="spacer">' +
            '<div class="row" style="gap:7px;"><div class="h3">' + PU.escapeHtml(cat ? cat.nome : 'Serviço') + '</div>' + (req.prioridade ? '<span class="badge badge--orange">Prioridade</span>' : '') + '</div>' +
            '<div class="text--sm text--secondary">' + PU.escapeHtml(req.endereco.bairro || 'Região informada') + ' · ' + PU.escapeHtml((cidade || {}).nome || '') + '</div>' +
            distanceHighlight(req) +
            '<div class="text--sm text--strong" style="margin-top:7px;color:' + (primeiraGratis ? 'var(--success-600)' : 'var(--orange-700)') + ';">' +
              (primeiraGratis ? '1º desbloqueio GRÁTIS' : 'Desbloquear por ' + PU.formatCurrency(valor)) +
            '</div>' +
            (novoChamado ? '<div class="qf-new-call-badge">Novo chamado</div>' : '') +
          '</div>' +
          '<span class="text--sm text--muted">' + PU.timeAgo(req.criadoEm) + '</span>' +
        '</div>' +
      '</button>'
    );
  }

  Screens.profChamadaRender = function (params, user) {
    const req = DB.requestById(params.id);
    const disponivel = req && req.status === STATUS.BUSCANDO && !req.profissionalId &&
      user.online && user.statusAprovacao === 'aprovado' && !user.bloqueado &&
      user.categorias.indexOf(req.categoriaId) !== -1 &&
      (req.recusadoPor || []).indexOf(user.id) === -1;
    if (!disponivel) {
      const emNegociacao = req && [STATUS.AGUARDANDO_ORCAMENTO, STATUS.ORCAMENTO_ENVIADO, STATUS.ORCAMENTO_RECUSADO, STATUS.APROVADO, STATUS.EM_ANDAMENTO].indexOf(req.status) !== -1;
      return '<div class="view"><div class="empty-state"><div class="icon-tile icon-tile--ghost">' + icon(emNegociacao ? 'clock' : 'lock') + '</div><h2 class="h3">' + (emNegociacao ? 'Pedido em negociação' : 'Chamado indisponível') + '</h2><p class="text text--secondary">' + (emNegociacao ? 'Outro profissional já assumiu este pedido. Se ele voltar para a busca, o chamado poderá aparecer novamente para profissionais elegíveis.' : 'Esta oportunidade já foi assumida ou não está mais disponível.') + '</p></div></div>';
    }
    const cat = DB.categoryById(req.categoriaId);
    const cidade = DB.cityById(req.cidadeId);
    const valor = DB.leadFeeForRequest(req);
    const primeiraGratis = false;
    return (
      '<div class="view">' +
        '<div class="row-between">' +
          '<div class="row"><div class="icon-tile icon-tile--lg icon-tile--orange">' + icon(cat ? cat.icon : 'tag') + '</div><div><div class="h2">' + PU.escapeHtml(cat ? cat.nome : 'Serviço') + '</div><div class="text--sm text--secondary">Solicitado ' + PU.timeAgo(req.criadoEm) + '</div></div></div>' +
          (req.prioridade ? '<span class="badge badge--orange"><span class="badge__dot"></span>Prioritário</span>' : '') +
        '</div>' +

        '<div class="section card stack--sm">' +
          '<div class="row"><div class="avatar avatar--sm">?</div><div><div class="text--strong">Cliente verificado</div><div class="text--sm text--muted">Identidade protegida até o desbloqueio</div></div></div>' +
          '<hr class="hairline">' +
          '<div class="text--sm text--secondary">' + PU.escapeHtml(req.descricao) + '</div>' +
          (req.fotos && req.fotos.length ? '<div class="upload-row">' + req.fotos.map(renderCallMedia).join('') + '</div>' : '') +
          '<hr class="hairline">' +
          '<div class="row text--sm text--secondary">' + icon('mapPin', 'list-item__chevron') + '<span>' + PU.escapeHtml(req.endereco.bairro || 'Bairro informado') + ' — ' + PU.escapeHtml((cidade || {}).nome || '') + '</span></div>' +
          distanceHighlight(req) +
        '</div>' +

        '<div class="section card stack--sm" style="background:var(--navy-900);border:none;">' +
          '<div class="row-between"><div><div class="text--sm" style="color:var(--text-on-navy-muted);">' + (primeiraGratis ? 'Benefício de boas-vindas' : 'Taxa para desbloquear') + '</div><div class="h1" style="color:#fff;">' + (primeiraGratis ? 'GRÁTIS' : PU.formatCurrency(valor)) + '</div></div><div class="icon-tile icon-tile--orange">' + icon('unlock') + '</div></div>' +
          '<p class="text--sm" style="color:var(--text-on-navy-muted);">' +
            (primeiraGratis
              ? 'Este é o seu primeiro desbloqueio e não usa saldo. Depois dele, para abrir novos chamados, visualizar os dados do cliente e enviar orçamento, você precisará ter saldo na carteira.'
              : 'Ao desbloquear, usamos os créditos da carteira e liberamos nome, telefone/WhatsApp e endereço exato. O chamado fica reservado para você.') +
          '</p>' +
          '<div class="row-between"><span class="text--sm" style="color:var(--text-on-navy-muted);">Seus créditos</span><span class="text--strong" style="color:#fff;">' + PU.formatCurrency(user.creditos || 0) + '</span></div>' +
        '</div>' +

        '<div class="section btn-row">' +
          '<button class="btn btn--outline" data-action="recusar-chamada">Agora não</button>' +
          '<button class="btn btn--primary" data-action="desbloquear-chamada">' + icon('unlock') + ' ' + (primeiraGratis ? 'Desbloquear grátis' : 'Desbloquear ' + PU.formatCurrency(valor)) + '</button>' +
        '</div>' +
      '</div>'
    );
  };

  // ---------------- Meus serviços ----------------

  const ATIVOS_PROF = [STATUS.AGUARDANDO_ORCAMENTO, STATUS.ORCAMENTO_ENVIADO, STATUS.ORCAMENTO_RECUSADO, STATUS.APROVADO, STATUS.EM_ANDAMENTO, STATUS.SERVICO_CONCLUIDO, STATUS.PAGO];
  function profHiddenHistory(userId) {
    try { return JSON.parse(localStorage.getItem('quemfaz_hidden_history_v1_profissional_' + userId) || '[]') || []; } catch (_) { return []; }
  }
  function hideProfHistory(userId, requestId) {
    const ids = profHiddenHistory(userId);
    if (ids.indexOf(requestId) === -1) ids.push(requestId);
    try { localStorage.setItem('quemfaz_hidden_history_v1_profissional_' + userId, JSON.stringify(ids.slice(-250))); } catch (_) {}
  }

  Screens.profServicosRender = function (params, user) {
    const hidden = profHiddenHistory(user.id);
    const all = DB.requestsByProfissional(user.id);
    const ativos = all.filter(function (r) { return ATIVOS_PROF.indexOf(r.status) !== -1; });
    const historico = all.filter(function (r) { return ATIVOS_PROF.indexOf(r.status) === -1 && hidden.indexOf(r.id) === -1; });
    if (!ativos.length && !historico.length) {
      return '<div class="view"><div class="empty-state"><div class="icon-tile icon-tile--lg icon-tile--ghost">' + icon('clipboard') + '</div><h2 class="h3">Nenhum serviço ainda</h2><p class="text text--secondary">Fique online para começar a receber chamados de clientes.</p></div></div>';
    }
    return (
      '<div class="view">' +
        (ativos.length ? '<div class="section"><div class="section-head"><h2 class="h3">Em andamento</h2></div><div class="stack--sm">' + ativos.map(servicoCard).join('') + '</div></div>' : '') +
        (historico.length ? '<div class="section"><div class="section-head"><h2 class="h3">Histórico</h2></div><div class="stack--sm">' + historico.map(function (r) {
          return '<div class="history-entry">' + servicoCard(r) +
            '<button class="history-delete" type="button" data-hide-servico="' + PU.escapeHtml(r.id) + '" aria-label="Excluir serviço do histórico" title="Excluir do histórico">' + icon('xCircle') + '</button></div>';
        }).join('') + '</div></div>' : '') +
      '</div>'
    );
  };

  function servicoCard(req) {
    const cat = DB.categoryById(req.categoriaId);
    const cliente = DB.clienteById(req.clienteId);
    return (
      '<button class="card card--pressable" style="width:100%;text-align:left;" data-nav="/profissional/pedido/' + req.id + '">' +
        '<div class="row-between">' +
          '<div class="row"><div class="icon-tile">' + icon(cat ? cat.icon : 'tag') + '</div>' +
          '<div><div class="h3">' + PU.escapeHtml(cat ? cat.nome : 'Serviço') + '</div><div class="text--sm text--secondary">' + PU.escapeHtml((cliente || {}).nome || '') + '</div></div></div>' +
          icon('chevronRight', 'list-item__chevron') +
        '</div>' +
        '<div class="row-between" style="margin-top:12px;">' + statusBadge(req.status) + '<span class="text--sm text--muted">' + PU.timeAgo(req.criadoEm) + '</span></div>' +
      '</button>'
    );
  }

  Screens.profPedidoDetalheRender = function (params, user) {
    const req = DB.requestById(params.id);
    if (!req || req.profissionalId !== user.id) return '<div class="view"><p class="text">Serviço não encontrado.</p></div>';
    const cat = DB.categoryById(req.categoriaId);
    const cliente = DB.clienteById(req.clienteId);
    return (
      '<div class="view">' +
        '<div class="row-between">' +
          '<div class="row"><div class="icon-tile">' + icon(cat ? cat.icon : 'tag') + '</div><div class="h3">' + PU.escapeHtml(cat ? cat.nome : 'Serviço') + '</div></div>' +
          statusBadge(req.status) +
        '</div>' +

        '<div class="section card stack--sm">' +
          '<div class="row-between"><div class="row"><div class="avatar avatar--sm">' + PU.initials((cliente || {}).nome || '?') + '</div><div><div class="text--strong">' + PU.escapeHtml((cliente || {}).nome || '') + '</div><div class="text--sm text--secondary">Contato liberado</div></div></div><span class="badge badge--success"><span class="badge__dot"></span>Desbloqueado</span></div>' +
          '<div class="row text--sm text--secondary">' + icon('phoneCall', 'list-item__chevron') + ((cliente || {}).telefone ? '<a href="' + telHref(cliente.telefone) + '">' + PU.escapeHtml(cliente.telefone) + '</a>' : '<span>Telefone não informado</span>') + '</div>' +
          ((cliente || {}).telefone ? '<a class="btn btn--whatsapp btn--lg" data-contact="whatsapp" href="' + whatsappHref(cliente.telefone, 'Olá ' + (cliente.nome || '') + ', sou ' + user.nome + ' do QuemFaz. Desbloqueei seu chamado e estou entrando em contato sobre o serviço.') + '" target="_blank" rel="noopener">' + icon('whatsapp') + ' Chamar no WhatsApp</a>' +
            '<a class="btn btn--outline" data-contact="ligar" href="' + telHref(cliente.telefone) + '">' + icon('phoneCall') + ' Ligar para o cliente</a>' : '') +
          '<div class="text--sm text--secondary">' + PU.escapeHtml(req.descricao) + '</div>' +
          (req.fotos && req.fotos.length ? '<div class="upload-row">' + req.fotos.map(renderCallMedia).join('') + '</div>' : '') +
          '<div class="row text--sm text--secondary">' + icon('mapPin', 'list-item__chevron') + '<span>' + PU.escapeHtml(req.endereco.rua) + ', ' + PU.escapeHtml(req.endereco.bairro) + (req.endereco.complemento ? ' · ' + PU.escapeHtml(req.endereco.complemento) : '') + '</span></div>' +
        '</div>' +

        (req.orcamento ? orcamentoResumo(req) : '') +
        acoesPorStatus(req) +
      '</div>'
    );
  };

  function orcamentoResumo(req) {
    const o = req.orcamento;
    return (
      '<div class="section">' +
        '<div class="section-head"><h2 class="h3">Orçamento enviado</h2></div>' +
        '<div class="card stack--sm">' +
          (req.taxaVisita ? rowValor('Taxa de visita', req.taxaVisita) : '') +
          rowValor('Mão de obra', o.maoDeObra) +
          rowValor('Material', o.material) +
          '<hr class="hairline">' +
          rowValor('Total', o.total + (req.taxaVisita || 0), true) +
          (o.status === 'recusado' && o.motivoRecusa ? '<p class="text--sm" style="color:var(--danger-600);margin-top:4px;">Motivo da recusa: ' + PU.escapeHtml(o.motivoRecusa) + '</p>' : '') +
        '</div>' +
      '</div>'
    );
  }
  function rowValor(label, cents, strong) {
    return '<div class="row-between"><span class="text' + (strong ? ' text--strong' : ' text--secondary text--sm') + '">' + label + '</span><span class="text' + (strong ? ' h3' : ' text--sm') + '">' + PU.formatCurrency(cents) + '</span></div>';
  }

  function acoesPorStatus(req) {
    const s = req.status;
    if (s === STATUS.AGUARDANDO_ORCAMENTO) {
      return '<div class="section"><button class="btn btn--primary" data-nav="/profissional/orcamento/' + req.id + '">' + icon('document') + ' Criar orçamento</button></div>';
    }
    if (s === STATUS.ORCAMENTO_ENVIADO) {
      return '<div class="section"><div class="card card--tight" style="background:var(--navy-100);border:none;"><p class="text text--sm" style="color:var(--navy-800);">Aguardando aprovação do cliente.</p></div></div>';
    }
    if (s === STATUS.ORCAMENTO_RECUSADO) {
      return '<div class="section stack--sm">' +
        '<button class="btn btn--primary" data-nav="/profissional/orcamento/' + req.id + '">' + icon('edit') + ' Enviar novo orçamento</button>' +
        '<button class="btn btn--danger-ghost" data-action="cancelar-servico">Cancelar serviço</button>' +
      '</div>';
    }
    if (s === STATUS.APROVADO) {
      return '<div class="section"><button class="btn btn--primary" data-action="iniciar-servico">' + icon('checkCircle') + ' Iniciar serviço</button></div>';
    }
    if (s === STATUS.EM_ANDAMENTO) {
      return '<div class="section"><button class="btn btn--primary" data-action="finalizar-servico">' + icon('check') + ' Concluir serviço</button></div>';
    }
    if (s === STATUS.SERVICO_CONCLUIDO || s === STATUS.PAGO) {
      return (
        '<div class="section"><div class="card card--tight" style="background:var(--success-100);border:none;margin-bottom:12px;"><p class="text text--sm" style="color:var(--success-600);">Serviço marcado como concluído. O pagamento do serviço é combinado diretamente com o cliente.</p></div></div>' +
        '<div class="section">' +
          '<div class="section-head"><h2 class="h3">Avalie o cliente</h2></div>' +
          '<div class="card stack">' +
            '<div class="star-picker" id="prof-star-picker">' + [1, 2, 3, 4, 5].map(function (n) { return '<button type="button" data-star="' + n + '">' + icon('starFilled') + '</button>'; }).join('') + '</div>' +
            '<textarea class="textarea" id="prof-avaliacao-comentario" placeholder="Como foi atender este cliente? (opcional)"></textarea>' +
            '<button class="btn btn--primary" data-action="enviar-avaliacao-cliente">Enviar avaliação</button>' +
          '</div>' +
        '</div>'
      );
    }
    if (s === STATUS.FINALIZADO) {
      return '<div class="section"><div class="card card--tight" style="background:var(--success-100);border:none;"><p class="text text--sm" style="color:var(--success-600);">Serviço concluído e avaliado.</p></div></div>';
    }
    if (s === STATUS.CANCELADO) {
      return '<div class="section"><div class="card card--tight" style="background:var(--danger-100);border:none;"><p class="text text--sm" style="color:var(--danger-600);">' + PU.escapeHtml(req.motivoCancelamento || 'Serviço cancelado.') + '</p></div></div>';
    }
    return '';
  }

  Screens.profOrcamentoFormRender = function (params, user) {
    const req = DB.requestById(params.id);
    if (!req) return '<div class="view"><p class="text">Serviço não encontrado.</p></div>';
    return (
      '<div class="view">' +
        '<form id="orcamento-form" class="stack" novalidate>' +
          '<label class="field"><span class="field__label">Taxa de visita</span><input class="input" name="taxaVisita" inputmode="decimal" value="' + (req.taxaVisita ? (req.taxaVisita / 100).toFixed(2).replace('.', ',') : '') + '" placeholder="R$ 0,00"></label>' +
          '<label class="field"><span class="field__label">Mão de obra</span><input class="input" name="maoDeObra" inputmode="decimal" required placeholder="R$ 0,00" value="' + (req.orcamento ? (req.orcamento.maoDeObra / 100).toFixed(2).replace('.', ',') : '') + '"></label>' +
          '<label class="field"><span class="field__label">Material</span><input class="input" name="material" inputmode="decimal" placeholder="R$ 0,00" value="' + (req.orcamento ? (req.orcamento.material / 100).toFixed(2).replace('.', ',') : '') + '"></label>' +
          '<div class="card row-between" style="background:var(--navy-100);border:none;">' +            '<span class="text--strong" style="color:var(--navy-900);">Total</span>' +
            '<span class="h2" id="orcamento-total" style="color:var(--navy-900);">R$ 0,00</span>' +
          '</div>' +
          '<button class="btn btn--primary" type="submit">' + icon('arrowRight') + ' Enviar orçamento ao cliente</button>' +
        '</form>' +
      '</div>'
    );
  };

  // ---------------- Carteira ----------------

  // ---------------- Interações pós-render ----------------

  const prevAfterRender = Screens.afterRender;
  Screens.afterRender = function (pattern, content, params, user) {
    if (prevAfterRender) prevAfterRender(pattern, content, params, user);

    if (pattern === '/profissional/home') bindHome(content, user);
    if (pattern === '/profissional/chamada/:id') bindChamada(content, params, user);
    if (pattern === '/profissional/servicos') bindProfServicos(content, user);
    if (pattern === '/profissional/pedido/:id') bindPedidoDetalhe(content, params, user);
    if (pattern === '/profissional/orcamento/:id') bindOrcamentoForm(content, params, user);
    if (pattern === '/profissional/perfil') bindPerfil(content, user);
    if (pattern === '/profissional/carteira') bindCarteira(content, user);
    if (pattern === '/cliente/home') { bindAnunciosHome(content); bindNotificationActivation(content); }
    if (pattern === '/anuncie' || pattern === '/cliente/anuncie' || pattern === '/profissional/anuncie') bindAnuncie(content);
  };

  function bindAnunciosHome(content) {
    const cards = Array.prototype.slice.call(content.querySelectorAll('[data-ad-click]'));
    if (cards.length) DB.registrarImpressoesAnuncios(cards.map(function (c) { return c.getAttribute('data-ad-click'); }));
    content.addEventListener('click', function (e) {
      const el = e.target.closest('[data-ad-click]');
      if (!el) return;
      const id = el.getAttribute('data-ad-click');
      DB.registrarCliqueAnuncio(id);
      const href = el.getAttribute('data-ad-href');
      if (href && /^https?:\/\//i.test(href)) window.open(href, '_blank', 'noopener');
    });
  }

  function bindAnuncie(content) {
    const form = content.querySelector('#anuncio-form');
    if (!form) return;
    let imageData = '';
    const input = content.querySelector('#ad-image');
    const preview = content.querySelector('#ad-preview');

    // V10.7: mantém o anúncio preenchido quando o visitante precisa entrar/criar conta.
    try {
      const saved = JSON.parse(sessionStorage.getItem('qf_pending_ad_draft') || 'null');
      if (saved && saved.fields) {
        Array.prototype.forEach.call(form.querySelectorAll('[name]'), function (ctrl) {
          const name = ctrl.name;
          if (!name || !(name in saved.fields) || ctrl.type === 'file') return;
          if (ctrl.type === 'radio') ctrl.checked = String(ctrl.value) === String(saved.fields[name]);
          else if (ctrl.type === 'checkbox') ctrl.checked = !!saved.fields[name];
          else ctrl.value = saved.fields[name] == null ? '' : saved.fields[name];
        });
        imageData = String(saved.imageData || '');
        if (imageData) preview.innerHTML = '<img src="' + imageData + '" alt="Prévia do anúncio">';
        Array.prototype.forEach.call(form.querySelectorAll('input[name="regiaoTipo"]'), function (r) {
          const item = r.closest('.segmented__item');
          if (item) item.classList.toggle('is-active', r.checked);
        });
        const savedPay = String(saved.fields.formaPagamento || '');
        Array.prototype.forEach.call(content.querySelectorAll('#ad-payment [data-pay]'), function (b) {
          b.classList.toggle('is-active', b.getAttribute('data-pay') === savedPay);
        });
        PU.toast('Seu anúncio foi recuperado. Continue de onde parou.', 'success');
      }
    } catch (_) {}
    input.addEventListener('change', function () {
      const f = input.files && input.files[0];
      if (!f) return;
      if (f.size > 900 * 1024) { input.value = ''; PU.toast('A imagem deve ter no máximo 900 KB nesta versão.', 'danger'); return; }
      const reader = new FileReader();
      reader.onload = function () { imageData = String(reader.result || ''); preview.innerHTML = '<img src="' + imageData + '" alt="Prévia do anúncio">'; };
      reader.readAsDataURL(f);
    });
    Array.prototype.forEach.call(form.querySelectorAll('input[name="regiaoTipo"]'), function (radio) {
      radio.addEventListener('change', function () {
        Array.prototype.forEach.call(form.querySelectorAll('input[name="regiaoTipo"]'), function (r) { r.closest('.segmented__item').classList.toggle('is-active', r.checked); });
        const cityRow = form.querySelector('[name="cidadeAnuncio"]');
        if (cityRow && radio.value === 'cidade' && radio.checked) cityRow.focus();
      });
    });
    const pay = content.querySelector('#ad-payment');
    pay.addEventListener('click', function (e) {
      const b = e.target.closest('[data-pay]'); if (!b) return;
      Array.prototype.forEach.call(pay.querySelectorAll('.segmented__item'), function (x) { x.classList.remove('is-active'); });
      b.classList.add('is-active'); form.elements.formaPagamento.value = b.getAttribute('data-pay');
    });
    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      const fd = new FormData(form);
      if (!String(fd.get('empresa') || '').trim() || !String(fd.get('chamada') || '').trim() || !String(fd.get('whatsapp') || '').trim()) { PU.toast('Preencha empresa, chamada e WhatsApp.', 'danger'); return; }
      if (!imageData) { PU.toast('Adicione a imagem do anúncio.', 'danger'); return; }

      if (!DB.getSession()) {
        const draftFields = {};
        fd.forEach(function (value, key) {
          if (typeof value === 'string') draftFields[key] = value;
        });
        try {
          sessionStorage.setItem('qf_pending_ad_draft', JSON.stringify({ fields: draftFields, imageData: imageData, savedAt: Date.now() }));
        } catch (_) {}

        PU.openSheet(
          '<div class="stack">' +
            '<div class="icon-tile icon-tile--lg icon-tile--orange" style="margin:0 auto;">' + icon('user') + '</div>' +
            '<h3 class="sheet__title" style="text-align:center;">Entre para continuar</h3>' +
            '<p class="text text--secondary" style="text-align:center;">Seu anúncio já está salvo neste aparelho. Entre ou crie sua conta e você volta para finalizar sem preencher tudo de novo.</p>' +
            '<button class="btn btn--primary" id="qf-ad-login-cliente">Entrar como cliente</button>' +
            '<button class="btn btn--outline" id="qf-ad-login-prof">Entrar como profissional</button>' +
            '<div class="divider-label">primeiro acesso?</div>' +
            '<div class="btn-row"><button class="btn btn--outline" id="qf-ad-cad-cliente">Criar conta cliente</button><button class="btn btn--outline" id="qf-ad-cad-prof">Criar conta profissional</button></div>' +
            '<button class="btn btn--ghost" id="qf-ad-voltar">Continuar editando</button>' +
          '</div>',
          { persistent: true }
        );
        document.getElementById('qf-ad-login-cliente').onclick = function () { PU.closeSheet(); global.navigate('/auth/cliente/login', true); };
        document.getElementById('qf-ad-login-prof').onclick = function () { PU.closeSheet(); global.navigate('/auth/profissional/login', true); };
        document.getElementById('qf-ad-cad-cliente').onclick = function () { PU.closeSheet(); global.navigate('/auth/cliente/cadastro', true); };
        document.getElementById('qf-ad-cad-prof').onclick = function () { PU.closeSheet(); global.navigate('/auth/profissional/cadastro', true); };
        document.getElementById('qf-ad-voltar').onclick = function () { PU.closeSheet(); };
        return;
      }

      const btn = form.querySelector('button[type="submit"]');
      if (btn) { btn.disabled = true; btn.textContent = 'Enviando...'; }
      try {
        const regiaoTipo = fd.get('regiaoTipo') || 'all';
        const cidadeAnuncio = String(fd.get('cidadeAnuncio') || '').trim();
        const ufAnuncio = String(fd.get('ufAnuncio') || '').trim();
        if (regiaoTipo === 'cidade' && (!cidadeAnuncio || !ufAnuncio)) { PU.toast('Informe cidade e UF do anúncio.', 'danger'); return; }
        const regiao = regiaoTipo === 'all' ? 'all' : global.QFGeo.regionKey(cidadeAnuncio, ufAnuncio);
        const dados = { empresa: fd.get('empresa'), chamada: fd.get('chamada'), cidadeId: regiao, plano: fd.get('plano'), imagem: imageData, whatsapp: fd.get('whatsapp'), link: fd.get('link'), formaPagamento: fd.get('formaPagamento') };
        let ad, pagamento;
        if (global.QFCloud && global.QFCloud.enabled) {
          const out = await global.QFCloud.submitAd(dados);
          ad = out.ad; pagamento = out.pagamento || {};
        } else {
          throw new Error('Pagamento real exige conexão com o servidor. Verifique a internet e tente novamente.');
        }
        const p = DB.adPlan((ad && ad.plano) || dados.plano);
        const valor = Number(pagamento.valor_centavos != null ? pagamento.valor_centavos : p.valor || 0);
        try { sessionStorage.removeItem('qf_pending_ad_draft'); } catch (_) {}

        const pixCode = String(pagamento.pix_copy_paste || '');
        const checkoutUrl = String(pagamento.checkout_url || '');
        const qrImage = String(pagamento.qr_image || '');
        PU.openSheet(
          '<div class="stack">' +
            '<div class="icon-tile icon-tile--lg icon-tile--orange" style="margin:0 auto;">' + icon('wallet') + '</div>' +
            '<h3 class="sheet__title" style="text-align:center;">Pix gerado na Efí</h3>' +
            '<p class="text text--secondary" style="text-align:center;">Valor: <strong>' + PU.formatCurrency(valor) + '</strong>. Pague o Pix abaixo. O anúncio só será liberado como pago depois da confirmação bancária.</p>' +
            (qrImage ? '<img src="' + PU.escapeHtml(qrImage) + '" alt="QR Code Pix" style="width:220px;height:220px;object-fit:contain;margin:0 auto;border-radius:16px;background:#fff;padding:8px;">' : '') +
            (pixCode ? '<label class="field"><span class="field__label">Pix Copia e Cola</span><textarea class="textarea" id="qf-ad-pix-code" readonly style="min-height:96px;">' + PU.escapeHtml(pixCode) + '</textarea></label><button class="btn btn--primary" id="qf-ad-copy-pix">' + icon('clipboard') + ' Copiar Pix</button>' : '') +

  function pushJaAtivo() {
    try { return global.QFPush.isActive(); } catch (_) { return false; }
  }

  function garantirNotificacoesParaOnline() {
    const P = global.QFPush;
    if (!P) return Promise.resolve(true);
    if (P.supported() && pushJaAtivo()) return Promise.resolve(true);
    return new Promise(function (resolve) {
      const suportado = P.supported();
      const negado = P.permission() === 'denied';
      let corpo;
      if (!suportado) {
        corpo = '<p class="text text--secondary" style="text-align:center;">Este aparelho ou esta forma de abrir o QuemFaz não permite avisos com o app fechado (por exemplo, arquivo local ou navegador sem suporte). Instale o app pelo endereço oficial (HTTPS) para receber chamados em segundo plano.</p>' +
          '<button class="btn btn--primary" id="qf-notif-continuar">Continuar com o app aberto</button>' +
          '<button class="btn btn--outline" id="qf-notif-cancelar">Agora não</button>';
      } else if (negado) {
        corpo = '<p class="text text--secondary" style="text-align:center;">Ative as notificações para receber novos chamados mesmo quando não estiver usando o app.</p>' +
          '<div class="card card--tight" style="background:var(--danger-100);border:none;"><div class="text--sm" style="color:var(--danger-600);">As notificações estão bloqueadas para o QuemFaz. Abra as configurações do aparelho &gt; Apps/Sites &gt; QuemFaz &gt; Notificações e permita. Depois toque em ATIVAR NOTIFICAÇÕES.</div></div>' +
          '<button class="btn btn--primary" id="qf-notif-ativar">' + icon('bell') + ' ATIVAR NOTIFICAÇÕES</button>' +
          '<button class="btn btn--outline" id="qf-notif-cancelar">Agora não</button>';
      } else {
        corpo = '<p class="text text--secondary" style="text-align:center;">Ative as notificações para receber novos chamados mesmo quando não estiver usando o app.</p>' +
          '<button class="btn btn--primary" id="qf-notif-ativar">' + icon('bell') + ' ATIVAR NOTIFICAÇÕES</button>' +
          '<button class="btn btn--outline" id="qf-notif-cancelar">Agora não</button>';
      }
      PU.openSheet('<div class="stack" id="qf-notif-sheet"><div class="icon-tile icon-tile--lg icon-tile--orange" style="margin:0 auto;">' + icon('bell') + '</div>' +
        '<h3 class="sheet__title" style="text-align:center;">Ative as notificações</h3>' + corpo +
        '<div class="text--sm" id="qf-notif-erro" role="alert" style="color:var(--danger-600);text-align:center;"></div></div>', { persistent: true });
      const cancelar = document.getElementById('qf-notif-cancelar');
      const continuar = document.getElementById('qf-notif-continuar');
      const ativar = document.getElementById('qf-notif-ativar');
      if (cancelar) cancelar.onclick = function () { PU.closeSheet(); resolve(false); };
      if (continuar) continuar.onclick = function () { PU.closeSheet(); resolve(true); };
      if (ativar) ativar.onclick = async function () {
        ativar.disabled = true;
        const erro = document.getElementById('qf-notif-erro');
        try {
          await P.activate();
          PU.closeSheet();
          PU.toast('Notificações ativadas. Você receberá novos chamados mesmo com o app fechado.', 'success');
          resolve(true);
        } catch (err) {
          if (erro) erro.textContent = (err && err.message) || 'Não foi possível ativar as notificações.';
          ativar.disabled = false;
        }
      };
    });
  }

  function bindHome(content, user) {
    bindNotificationActivation(content);
    const toggle = content.querySelector('#toggle-online');
    if (toggle) {
      const onlineNow=content.querySelector('[data-action="ficar-online-agora"]');
      const offlineNow=content.querySelector('[data-action="ficar-offline-agora"]');
      if(onlineNow)onlineNow.addEventListener('click',function(){if(toggle.disabled)return;toggle.checked=true;toggle.dispatchEvent(new Event('change',{bubbles:true}));});
      if(offlineNow)offlineNow.addEventListener('click',function(){if(toggle.disabled)return;toggle.checked=false;toggle.dispatchEvent(new Event('change',{bubbles:true}));});
      const locationBtn=content.querySelector('[data-action="qf-progress-location"]');
      if(locationBtn)locationBtn.addEventListener('click',function(){
        locationBtn.disabled=true;
        if(!navigator.geolocation){PU.toast('Localização não disponível neste aparelho.','danger');locationBtn.disabled=false;return;}
        navigator.geolocation.getCurrentPosition(function(){try{localStorage.setItem('qf_location_ready','1');}catch(_){}PU.toast('Localização permitida.','success');global.navigate('/profissional/home',true);},function(){PU.toast('Permita a localização nas configurações do aparelho/navegador.','danger');locationBtn.disabled=false;},{enableHighAccuracy:true,timeout:9000,maximumAge:0});
      });
      const batteryBtn=content.querySelector('[data-action="qf-progress-battery"]');
      if(batteryBtn)batteryBtn.addEventListener('click',function(){if(global.QFPush&&global.QFPush.requestBattery)global.QFPush.requestBattery();});
      toggle.addEventListener('change', async function () {
        const querOnline = toggle.checked;
        toggle.checked = !querOnline; // só muda depois de confirmar no servidor
        toggle.disabled = true;
        try {
          if (querOnline && !user.fotoUrl) { explicarSelfieObrigatoria(); return; }
          if (querOnline) {
            const ok = await garantirNotificacoesParaOnline();
            if (!ok) return;
          }
          PU.unlockNotificationAudio();
          if (global.QFCloud && global.QFCloud.enabled) await global.QFCloud.setOnline(querOnline);
          else DB.setOnlineStatus(user.id, querOnline);
          toggle.checked = querOnline;
          PU.toast(querOnline ? 'Você está online.' : 'Você está offline.', querOnline ? 'success' : null);
          global.navigate('/profissional/home', true);
        } catch (err) {
          PU.toast('Não foi possível atualizar seu status. ' + (err && err.message ? err.message : ''), 'danger');
        } finally {
          toggle.disabled = false;
        }
      });
    }
  }

  function bindChamada(content, params, user) {
    content.addEventListener('click', function (e) {
      const action = e.target.closest('[data-action]');
      if (!action) return;
      const act = action.getAttribute('data-action');
      if (act === 'desbloquear-chamada') {
        const req = DB.requestById(params.id);
        const valor = req ? DB.leadFeeForRequest(req) : 0;
        const primeiraGratis = false;
        PU.confirmDialog({
          title: primeiraGratis ? 'Seu primeiro desbloqueio é grátis' : 'Desbloquear chamado',
          message: primeiraGratis
            ? 'Nenhum crédito será usado neste primeiro chamado. O contato e o endereço completo do cliente serão liberados. Nos próximos chamados, será necessário ter saldo na Carteira QuemFaz.'
            : 'Serão usados ' + PU.formatCurrency(valor) + ' dos seus créditos. Depois disso, o contato e o endereço completo do cliente serão liberados para você.',
          okLabel: primeiraGratis ? 'Desbloquear grátis' : 'Pagar e desbloquear'
        }).then(async function (ok) {
          if (!ok) return;
          const result = (global.QFCloud && global.QFCloud.enabled)
            ? await global.QFCloud.unlockCall(params.id, user.id)
            : DB.desbloquearChamado(params.id, user.id);
          if (result && result.ok) {
            PU.toast(result.usouBonus ? 'Primeiro chamado desbloqueado GRÁTIS! Contato liberado.' : 'Chamado desbloqueado! Contato do cliente liberado.', 'success');
            global.navigate('/profissional/pedido/' + params.id, true);
            return;
          }
          if (result && result.reason === 'saldo') {
            PU.openSheet(
              '<div class="stack"><h3 class="sheet__title">Créditos insuficientes</h3>' +
              '<p class="text text--secondary">Você tem ' + PU.formatCurrency(result.saldo) + ' e precisa de ' + PU.formatCurrency(result.valor) + ' para este chamado.</p>' +
              '<button class="btn btn--primary" id="ir-carteira">Adicionar créditos</button>' +
              '<div class="text--sm text--secondary" style="text-align:center;">Pix, cartão ou boleto</div></div>'
            );
            document.getElementById('ir-carteira').onclick = function () {
              PU.closeSheet();
              global.navigate('/profissional/carteira', true);
            };
          } else {
            PU.toast((result && result.error) ? result.error : 'Este chamado não está mais disponível.', 'danger');
            global.navigate('/profissional/home', true);
          }
        }).catch(function (err) {
          PU.toast('Não foi possível desbloquear. ' + (err && err.message ? err.message : ''), 'danger');
        });
      }
      if (act === 'recusar-chamada') {
        DB.recusarChamada(params.id, user.id);
        PU.toast('Oportunidade removida da sua lista.', null);
        global.navigate('/profissional/home', true);
      }
    });
  }

  function bindCarteira(content, user) {

    const valuesWrap = content.querySelector('#wallet-values');
    const methodsWrap = content.querySelector('#wallet-methods');
    const custom = content.querySelector('#wallet-custom-value');

    function selectedValue() {
      const customCents = PU.parseCurrencyInput(custom.value);
      return customCents > 0 ? customCents : Number(action.getAttribute('data-wallet-selected-value') || 5000);
    }
    function updateActionLabel() {
      action.innerHTML = icon('plus') + ' Adicionar ' + PU.formatCurrency(selectedValue());
    }

    valuesWrap.addEventListener('click', function (e) {
      const chip = e.target.closest('[data-wallet-value]');
      if (!chip) return;
      Array.prototype.forEach.call(valuesWrap.querySelectorAll('[data-wallet-value]'), function (c) { c.classList.remove('is-selected'); });
      chip.classList.add('is-selected');
      action.setAttribute('data-wallet-selected-value', chip.getAttribute('data-wallet-value'));
      custom.value = '';
      updateActionLabel();
    });
    custom.addEventListener('input', updateActionLabel);

    methodsWrap.addEventListener('click', function (e) {
      const btn = e.target.closest('[data-wallet-method]');

      action.setAttribute('data-wallet-selected-method', btn.getAttribute('data-wallet-method'));
      Array.prototype.forEach.call(methodsWrap.querySelectorAll('[data-wallet-method]'), function (b) {
        b.style.borderColor = '';
        b.style.boxShadow = '';
        const tile = b.querySelector('.icon-tile');
        tile.classList.remove('icon-tile--orange');
        tile.classList.add('icon-tile--ghost');
        const badge = b.querySelector('.badge');
        badge.className = 'badge badge--muted';
        badge.textContent = 'Escolher';
      });
      btn.style.borderColor = 'var(--orange-500)';
      btn.style.boxShadow = '0 0 0 1px var(--orange-500)';
      const tile = btn.querySelector('.icon-tile');
      tile.classList.remove('icon-tile--ghost');
      tile.classList.add('icon-tile--orange');
      const badge = btn.querySelector('.badge');
      badge.className = 'badge badge--success';
      badge.textContent = 'Selecionado';
    });

    action.addEventListener('click', function () {
      const valor = selectedValue();
      if (valor < 500) { PU.toast('A recarga mínima é R$ 5,00.', 'danger'); return; }

  function openRechargeSheet(user, valor, method) {
    const displayValue = PU.formatCurrency(valor);
    if (global.QFCloud && global.QFCloud.enabled) {
      const methodLabel = method === 'cartao' ? 'cartão de crédito' : (method === 'boleto' ? 'boleto' : 'Pix');
      PU.openSheet(
        '<div class="stack"><div class="icon-tile icon-tile--lg icon-tile--orange" style="margin:0 auto;">' + icon('wallet') + '</div>' +
        '<h3 class="sheet__title" style="text-align:center;">Gerando pagamento</h3>' +
        '<p class="text text--secondary" style="text-align:center;">Preparando ' + methodLabel + ' de <strong>' + displayValue + '</strong> no Efí Bank...</p>' +
        '<div class="text--sm text--secondary" style="text-align:center;">O saldo só entra após a confirmação do pagamento.</div></div>'
      );
      (async function () {
        try {
          const rec = await global.QFCloud.createRecharge(valor, method);
          if (!rec.checkoutUrl) throw new Error('O link de pagamento não foi gerado.');
          PU.openSheet(
            '<div class="stack"><div class="icon-tile icon-tile--lg icon-tile--orange" style="margin:0 auto;">' + icon(method === 'cartao' ? 'creditCard' : (method === 'boleto' ? 'document' : 'bolt')) + '</div>' +

    div.innerHTML = '<div class="icon-tile icon-tile--orange" style="width:38px;height:38px;">' + icon('download') + '</div><div class="spacer"><div class="text--strong" style="color:#fff;">Atualização disponível</div><div class="text--sm" style="color:var(--text-on-navy-muted);">' + (swReady ? 'Toque para carregar a nova versão.' : 'Uma nova versão do QuemFaz está pronta.') + '</div></div><button class="btn" type="button" id="qf-soft-update">Atualizar</button>';
    content.insertBefore(div, content.firstChild);
    div.querySelector('#qf-soft-update').addEventListener('click', async function () {
      const btn = this;
      if (btn.disabled) return;
      btn.disabled = true;
      const original = btn.innerHTML;
      btn.textContent = 'Atualizando...';
      try {
        const out = await runUpdate(softEv, null);
        if (out && out.ok === false) {
          PU.toast(out.reason || 'Não foi possível atualizar agora.', 'danger');
          btn.disabled = false; btn.innerHTML = original;
        }
      } catch (err) {

  async function checkVersion(force) {

    let cfg = null;

    const ev = evaluate(cfg);
    if (ev.state === 'ok') { try { Object.keys(sessionStorage).forEach(function (k) { if (k.indexOf('qf_update_attempts_') === 0) sessionStorage.removeItem(k); }); } catch (_) {} }

      '<button class="btn btn--primary" type="button" data-install-app>' + icon('download') + ' Instalar App</button></div>';

  function fillInstallSlots(root) {

/* QuemFaz V11.2 — tela cheia de novo chamado com o app aberto */
(function (global) {
  const DB=global.DB,PU=global.PU,icon=global.icon;
  let queue=[],activeId='',countdown=null,seconds=30,audio=null,retryCount=0;

  function editing(){try{return !!(global.PROAKI_APP&&global.PROAKI_APP.userIsEditing&&global.PROAKI_APP.userIsEditing());}catch(_){return false;}}
  function requestById(id){try{return DB.requestById(id);}catch(_){return null;}}
  function sortReqs(a,b){
    if(!!a.prioridade!==!!b.prioridade)return a.prioridade?-1:1;
    const da=Number.isFinite(Number(a.distanciaKm))?Number(a.distanciaKm):999999;
    const db=Number.isFinite(Number(b.distanciaKm))?Number(b.distanciaKm):999999;
    if(da!==db)return da-db;
    return new Date(a.criadoEm||0)-new Date(b.criadoEm||0);
  }
  function stopAudio(){if(!audio)return;try{audio.pause();audio.currentTime=0;}catch(_){}audio=null;}
  function startAudio(){stopAudio();try{audio=new Audio('./quemfaz_chamado.mp3');audio.loop=true;audio.volume=1;const p=audio.play();if(p&&p.catch)p.catch(function(){});}catch(_){}}
  function stopTimer(){if(countdown){clearInterval(countdown);countdown=null;}}
  function close(clearAll){stopTimer();stopAudio();const el=document.getElementById('qf-call-overlay');if(el)el.remove();if(clearAll)queue=[];activeId='';seconds=30;}
  function updateTimer(){
    const txt=document.querySelector('#qf-call-overlay [data-call-seconds]');
    const fill=document.querySelector('#qf-call-overlay [data-call-fill]');
    if(txt)txt.textContent=seconds+' s';
    if(fill)fill.style.width=Math.max(0,seconds/30*100)+'%';
    if(seconds<=0)close(true);
  }
  function render(){
    if(editing())return false;
    const reqs=queue.map(requestById).filter(function(r){return r&&!r.profissionalId&&(r.status===DB.STATUS.BUSCANDO||r.status===DB.STATUS.AGUARDANDO_ACEITE);}).sort(sortReqs);
    if(!reqs.length){
      if(queue.length&&retryCount<4){retryCount++;setTimeout(render,850);return false;}
      queue=[];retryCount=0;return false;
    }
    retryCount=0;
    const req=reqs[0],cat=DB.categoryById(req.categoriaId),city=DB.cityById(req.cidadeId);
    activeId=req.id;
    const bairro=(req.endereco&&req.endereco.bairro)||'';
    const cidade=(req.endereco&&req.endereco.cidade)||(city&&city.nome)||'';
    const dist=Number.isFinite(Number(req.distanciaKm))?Number(req.distanciaKm).toFixed(1).replace('.',',')+' km':'—';
    const price=DB.leadFeeForRequest(req);
    let el=document.getElementById('qf-call-overlay');
    if(!el){el=document.createElement('div');el.id='qf-call-overlay';el.className='qf-call-overlay';document.body.appendChild(el);}
    el.innerHTML='<div class="qf-call-overlay__inner" role="alertdialog" aria-modal="true" aria-labelledby="qf-new-call-title">'+
      '<div class="qf-call-overlay__icon">'+icon(cat?cat.icon:'phoneCall')+'</div><div class="qf-call-overlay__eyebrow">Novo chamado</div>'+
      '<h2 class="qf-call-overlay__title" id="qf-new-call-title">'+PU.escapeHtml(cat?cat.nome:'Serviço')+'</h2>'+
      '<div class="qf-call-overlay__place">'+PU.escapeHtml([bairro,cidade].filter(Boolean).join(' · '))+'</div>'+
      (req.prioridade?'<div class="qf-call-overlay__priority">PRIORITÁRIO</div>':'')+
      '<div class="qf-call-overlay__facts"><div class="qf-call-overlay__fact"><strong>'+PU.escapeHtml(dist)+'</strong><span>de você</span></div><div class="qf-call-overlay__fact"><strong>'+PU.formatCurrency(price)+'</strong><span>para desbloquear</span></div></div>'+
      (reqs.length>1?'<div class="qf-call-overlay__others">+'+(reqs.length-1)+' outro'+(reqs.length-1===1?'':'s')+' chamado'+(reqs.length-1===1?'':'s')+'</div>':'')+
      '<button class="btn btn--primary qf-call-overlay__accept" type="button" data-call-accept>VER E ACEITAR</button><button class="qf-call-overlay__later" type="button" data-call-later>Agora não</button>'+
      '<div class="qf-call-timer"><div class="qf-call-timer__bar"><div class="qf-call-timer__fill" data-call-fill></div></div><div class="qf-call-timer__txt">Fecha em <span data-call-seconds>30 s</span></div></div></div>';
    const accept=el.querySelector('[data-call-accept]'),later=el.querySelector('[data-call-later]');
    if(accept)accept.onclick=function(){const id=activeId;close(true);if(global.navigate)global.navigate('/profissional/chamada/'+id);};
    if(later)later.onclick=function(){close(true);};
    if(!countdown){seconds=30;updateTimer();startAudio();countdown=setInterval(function(){seconds--;updateTimer();},1000);}
    return true;
  }

    if(!id)return false;

  }

(function (global) {

    if (noticeBatch) {
      items.unshift({ id: PU.uid('notice'), eventKey: eventKey, title: title, body: body || '', route: route || '', createdAt: new Date().toISOString(), read: false });
      saveNotices(session, items);
      noticeBatch.push({ title: title, body: body, strong: strong });

      id: PU.uid('notice'), eventKey: eventKey, title: title, body: body || '', route: route || '',

  async function syncPersistentProfessionalNotices(session, alertNew) {
    if (!session || session.role !== 'profissional') return false;

    const rows = await global.QFCloud.professionalNotices();
    const current = loadNotices(session);
    const existing = Object.create(null);
    current.forEach(function (n) { existing[n.eventKey] = true; });
    const fresh = [];
    (rows || []).forEach(function (r) {
      const eventKey = 'server_notice:' + r.id;
      if (existing[eventKey]) return;
      fresh.push({
        id: PU.uid('notice'),
        serverId: r.id,
        eventKey: eventKey,
        title: r.titulo || 'Aviso',
        body: r.corpo || '',

        createdAt: r.criado_em || new Date().toISOString(),
        read: false

    });
    if (!fresh.length) return false;
    saveNotices(session, fresh.concat(current));

  function requestStateMap() {

  function describeRequest(r) {

  function detectNotices(session, before, after) {

        const title = batch.length === 1 ? batch[0].title : (novos === batch.length ? novos + ' novos chamados perto de você' : batch.length + ' novas atualizações');
        const body = batch.length === 1 ? (batch[0].body || '') : 'Abra Avisos para ver todos.';

  function detectNoticesInner(session, before, after) {

      catch (err) { console.warn('QuemFaz avisos persistentes', err); }

        renderAnon(found);
        return;

      if (session) {
