  }

  function login(role, email, senha) {
    const u = findUserByEmail(role, email);
    if (!u) return { ok: false, error: 'E-mail não encontrado.' };
    if (u.senha !== senha) return { ok: false, error: 'Senha incorreta.' };
    if (u.bloqueado) return { ok: false, error: 'Este acesso foi bloqueado pelo administrador.' };
    const sess = { role: role, userId: u.id };
    setSession(sess);
    return { ok: true, user: u, session: sess };
  }

  function logout() { setSession(null); }

  // ---------------------------------------------------------------
  // Fluxo do pedido — Cliente
  // ---------------------------------------------------------------

  function criarPedido(data) {
    const req = {
      id: PU.uid('req'), clienteId: data.clienteId, categoriaId: data.categoriaId,
      descricao: data.descricao, fotos: data.fotos || [], endereco: data.endereco, cidadeId: data.endereco.cidadeId,
      status: STATUS.BUSCANDO, profissionalId: null,
      criadoEm: nowIso(), atualizadoEm: nowIso(),
      prazo: data.prazo || null, prazoDia: data.prazoDia || null, periodo: data.periodo || null,
      // Prioridade nunca é concedida gratuitamente. No modo offline ela fica apenas solicitada/pending.
      prioridade: false,
      pagamentoPrioridade: data.prioridade ? { status: 'pendente', valor: 490, metodo: data.prioridadeMetodo || 'pix', criadoEm: nowIso() } : null,
      leadUnlock: null,
      taxaVisita: 0, orcamento: null, pagamento: null, avaliacaoCliente: null, avaliacaoProfissional: null,
      recusadoPor: [], canceladoPor: null, motivoCancelamento: null,
      historico: [historicoItem(data.prioridade ? 'Pedido criado; prioridade aguardando pagamento' : 'Pedido criado gratuitamente')],
    };
    state.requests.push(req);
    persist();
    return req;
  }

  function buscarProfissional(requestId) {
    const req = requestById(requestId);
    if (!req) return null;
    const excluidos = req.recusadoPor || [];
    const candidatos = state.users.profissionais.filter(function (p) {
      return p.statusAprovacao === 'aprovado' && p.online && !p.bloqueado &&
        p.categorias.indexOf(req.categoriaId) !== -1 &&
        excluidos.indexOf(p.id) === -1;
    });

    req.profissionalId = null;
    req.atualizadoEm = nowIso();
    if (!candidatos.length) {
      req.status = STATUS.SEM_PROFISSIONAL;
      req.historico.push(historicoItem('Nenhum profissional disponível no momento'));
    } else {
      req.status = STATUS.BUSCANDO;
      req.historico.push(historicoItem('Chamado publicado para ' + candidatos.length + ' profissional(is) disponível(is)'));
    }
    persist();
    return req;
  }

  function desbloquearChamado(requestId, profissionalId) {
    const req = requestById(requestId);
    const prof = profissionalById(profissionalId);
    if (!req || !prof) return { ok: false, reason: 'nao_encontrado' };
    if (req.status !== STATUS.BUSCANDO || req.profissionalId) return { ok: false, reason: 'indisponivel' };
    if (prof.statusAprovacao !== 'aprovado' || !prof.online || prof.bloqueado || prof.categorias.indexOf(req.categoriaId) === -1) {
      return { ok: false, reason: 'nao_elegivel' };
    }
    const valor = leadFeeForRequest(req);
    const saldo = Number(prof.creditos || 0);
    const primeiraGratis = false;
    if (!primeiraGratis && saldo < valor) return { ok: false, reason: 'saldo', valor: valor, saldo: saldo };

    if (!primeiraGratis) prof.creditos = saldo - valor;
    prof.bonusDesbloqueios = 0;

    req.profissionalId = profissionalId;
    req.leadUnlock = {
      profissionalId: profissionalId,
      valor: primeiraGratis ? 0 : valor,
      valorTabela: valor,
      forma: primeiraGratis ? 'bonus' : 'creditos',
      status: 'pago',
      criadoEm: nowIso()
    };
    req.status = STATUS.AGUARDANDO_ORCAMENTO;
    req.atualizadoEm = nowIso();
    req.historico.push(historicoItem(
      primeiraGratis
        ? prof.nome + ' usou o primeiro desbloqueio grátis'
        : prof.nome + ' desbloqueou o chamado por ' + PU.formatCurrency(valor)
    ));
    state.transactions.push({
      id: PU.uid('tx'), profissionalId: profissionalId, requestId: requestId,
      tipo: primeiraGratis ? 'bonus' : 'debito',
      valor: valor, valorTabela: valor, status: 'pago', criadoEm: nowIso(),
      descricao: primeiraGratis
        ? 'Primeiro desbloqueio grátis'
        : 'Desbloqueio de chamado de ' + ((categoryById(req.categoriaId) || {}).nome || 'serviço'),
    });
    persist();
    return {
      ok: true, request: req, valor: primeiraGratis ? 0 : valor, valorTabela: valor,
      usouBonus: primeiraGratis, saldo: prof.creditos, bonusDesbloqueios: 0
    };
  }

  function recarregarCreditos(profissionalId, valor, metodo) {
    const prof = profissionalById(profissionalId);
    valor = Number(valor) || 0;
    if (!prof || valor <= 0) return null;
    metodo = metodo || 'Pix';
    prof.creditos = Number(prof.creditos || 0) + valor;
    state.transactions.push({
      id: PU.uid('tx'), profissionalId: profissionalId, requestId: null, tipo: 'recarga', status: 'pago', metodo: metodo,
      valor: valor, criadoEm: nowIso(), descricao: 'Recarga via ' + metodo,
    });
    persist();
    return prof.creditos;
  }

  function criarRecargaPendente(profissionalId, valor, metodo) {
    const prof = profissionalById(profissionalId);
    valor = Number(valor) || 0;
    if (!prof || valor <= 0) return null;
    const tx = {
      id: PU.uid('tx'), profissionalId: profissionalId, requestId: null, tipo: 'recarga_pendente', status: 'pendente',
      metodo: metodo || 'Boleto', valor: valor, criadoEm: nowIso(), descricao: 'Recarga via ' + (metodo || 'Boleto') + ' — aguardando compensação'
    };
    state.transactions.push(tx);
    persist();
    return tx;
  }

  function confirmarRecargaPendente(transactionId) {
    const tx = state.transactions.find(function (t) { return t.id === transactionId; });
    if (!tx || tx.tipo !== 'recarga_pendente' || tx.status !== 'pendente') return null;
    const prof = profissionalById(tx.profissionalId);
    if (!prof) return null;
    prof.creditos = Number(prof.creditos || 0) + Number(tx.valor || 0);
    tx.tipo = 'recarga';
    tx.status = 'pago';
    tx.compensadoEm = nowIso();
    tx.descricao = 'Recarga via ' + (tx.metodo || 'Boleto');
    persist();
    return { transaction: tx, saldo: prof.creditos };
  }

  function cancelarPedido(requestId, por, motivo) {
    const req = requestById(requestId);
    if (!req) return null;
    req.status = STATUS.CANCELADO;
    req.canceladoPor = por;
    req.motivoCancelamento = motivo || '';
    req.atualizadoEm = nowIso();
    req.historico.push(historicoItem('Pedido cancelado por ' + (por === 'cliente' ? 'cliente' : por === 'profissional' ? 'profissional' : 'administrador') + (motivo ? ': ' + motivo : '')));
    persist();
    return req;
  }

  function aprovarOrcamento(requestId) {
    const req = requestById(requestId);
    if (!req || !req.orcamento) return null;
    req.orcamento.status = 'aprovado';
    req.status = STATUS.APROVADO;
    req.atualizadoEm = nowIso();
    req.historico.push(historicoItem('Cliente aprovou o orçamento'));
    persist();
    return req;
  }

  function recusarOrcamento(requestId, motivo) {
    const req = requestById(requestId);
    if (!req || !req.orcamento) return null;
    req.orcamento.status = 'recusado';
    req.orcamento.motivoRecusa = motivo || '';
    req.status = STATUS.ORCAMENTO_RECUSADO;
    req.atualizadoEm = nowIso();
    req.historico.push(historicoItem('Cliente recusou o orçamento e pediu novo valor' + (motivo ? ': ' + motivo : '')));
    persist();
    return req;
  }

  function buscarOutroProfissional(requestId, motivo) {
    const req = requestById(requestId);
    if (!req || !req.orcamento) return null;

    const profissionalAnterior = req.profissionalId;
    req.orcamento.status = 'recusado';
    req.orcamento.motivoRecusa = motivo || '';

    req.recusadoPor = req.recusadoPor || [];
    if (profissionalAnterior && req.recusadoPor.indexOf(profissionalAnterior) === -1) {
      req.recusadoPor.push(profissionalAnterior);
    }

    if (req.leadUnlock) {
      req.desbloqueiosAnteriores = req.desbloqueiosAnteriores || [];
      req.desbloqueiosAnteriores.push(Object.assign({}, req.leadUnlock, { encerradoEm: nowIso() }));
    }

    req.profissionalId = null;
    req.leadUnlock = null;
    req.orcamento = null;
    req.status = STATUS.BUSCANDO;
    req.atualizadoEm = nowIso();
    req.historico.push(historicoItem('Cliente recusou o orçamento e voltou o chamado para buscar outro profissional' + (motivo ? ': ' + motivo : '')));
    persist();
    return buscarProfissional(requestId) || req;
  }

  function pagarPedido(requestId) {
    // Mantido apenas por compatibilidade com versões anteriores do protótipo.
    // O QuemFaz não cobra o valor do serviço: cliente e profissional combinam
    // o pagamento diretamente entre si. A receita da plataforma vem do
    // desbloqueio do chamado e da prioridade opcional do cliente.
    const req = requestById(requestId);
    if (!req || req.status !== STATUS.SERVICO_CONCLUIDO) return null;
    req.status = STATUS.PAGO;
    req.atualizadoEm = nowIso();
    req.historico.push(historicoItem('Pagamento do serviço tratado diretamente entre cliente e profissional'));
    persist();
    return req;
  }

  function avaliarComoCliente(requestId, nota, comentario) {
    const req = requestById(requestId);
    if (!req) return null;
    req.avaliacaoCliente = { nota: nota, comentario: comentario || '', criadoEm: nowIso() };
    req.atualizadoEm = nowIso();
    req.historico.push(historicoItem('Cliente finalizou e avaliou o serviço com nota ' + nota));
    state.reviews.push({ id: PU.uid('rev'), requestId: req.id, de: 'cliente', profissionalId: req.profissionalId, nota: nota, comentario: comentario || '', criadoEm: nowIso() });
    const prof = profissionalById(req.profissionalId);
    if (prof) {
      const total = prof.totalAvaliacoes || 0;
      const media = prof.avaliacaoMedia || 0;
      const novoTotal = total + 1;
      prof.avaliacaoMedia = ((media * total) + nota) / novoTotal;
      prof.totalAvaliacoes = novoTotal;
    }
    if (req.avaliacaoProfissional) req.status = STATUS.FINALIZADO;
    persist();
    return req;
  }

  function avaliarComoProfissional(requestId, nota, comentario) {
    const req = requestById(requestId);
    if (!req) return null;
    req.avaliacaoProfissional = { nota: nota, comentario: comentario || '', criadoEm: nowIso() };
    req.historico.push(historicoItem('Profissional finalizou e avaliou o cliente com nota ' + nota));
    if (req.avaliacaoCliente) req.status = STATUS.FINALIZADO;
    persist();
    return req;
  }

  // ---------------------------------------------------------------
  // Fluxo do pedido — Profissional
  // ---------------------------------------------------------------

  function aceitarChamada(requestId, profissionalId) {
    const result = desbloquearChamado(requestId, profissionalId);
    return result && result.ok ? result.request : null;
  }

  function recusarChamada(requestId, profissionalId) {
    try {
      const list = dismissedCalls(profissionalId);
      if (list.indexOf(requestId) === -1) list.unshift(requestId);
      writeRaw(dismissedKey(profissionalId), JSON.stringify(list.slice(0, 200)));
    } catch (_) {}
    const req = requestById(requestId);
    if (!req) return null;
    req.recusadoPor = req.recusadoPor || [];
    if (req.recusadoPor.indexOf(profissionalId) === -1) req.recusadoPor.push(profissionalId);
    req.atualizadoEm = nowIso();
    req.historico.push(historicoItem('Um profissional dispensou a oportunidade'));
    persist();
    return req;
  }

  function enviarOrcamento(requestId, dados) {
    const req = requestById(requestId);
    if (!req) return null;
    const versaoAnterior = req.orcamento ? req.orcamento.versao : 0;
    req.orcamento = {
      maoDeObra: dados.maoDeObra, material: dados.material, total: dados.maoDeObra + dados.material,
      criadoEm: nowIso(), status: 'pendente', versao: versaoAnterior + 1,
    };
    if (typeof dados.taxaVisita === 'number') req.taxaVisita = dados.taxaVisita;
    req.status = STATUS.ORCAMENTO_ENVIADO;
    req.atualizadoEm = nowIso();
    req.historico.push(historicoItem('Orçamento enviado — ' + PU.formatCurrency(req.orcamento.total)));
    persist();
    return req;
  }

  function iniciarServico(requestId) {
    const req = requestById(requestId);
    if (!req || req.status !== STATUS.APROVADO) return null;
    req.status = STATUS.EM_ANDAMENTO;
    req.atualizadoEm = nowIso();
    req.historico.push(historicoItem('Profissional iniciou o serviço'));
    persist();
    return req;
  }

  function finalizarServico(requestId) {
    const req = requestById(requestId);
    if (!req || req.status !== STATUS.EM_ANDAMENTO) return null;
    req.status = STATUS.SERVICO_CONCLUIDO;
    req.atualizadoEm = nowIso();
    req.historico.push(historicoItem('Profissional marcou o serviço como concluído'));
    persist();
    return req;
  }

  // V11.22: o profissional informa como terminou o chamado desbloqueado.
  const STATUS_DESBLOQUEADO = [STATUS.AGUARDANDO_ORCAMENTO, STATUS.ORCAMENTO_ENVIADO, STATUS.ORCAMENTO_RECUSADO, STATUS.APROVADO, STATUS.EM_ANDAMENTO];
  function fecharChamadoProfissional(requestId, fechou) {
    const req = requestById(requestId);
    if (!req || STATUS_DESBLOQUEADO.indexOf(req.status) === -1) return null;
    req.desfecho = fechou ? 'fechado' : 'nao_fechado';
    req.atualizadoEm = nowIso();
    if (fechou) {
      req.status = STATUS.SERVICO_CONCLUIDO;
      req.historico.push(historicoItem('Profissional informou que fechou o serviço'));
    } else {
      req.status = STATUS.CANCELADO;
      req.canceladoPor = 'profissional';
      req.motivoCancelamento = 'O profissional informou que não fechou o serviço.';
      req.historico.push(historicoItem('Profissional informou que não fechou o serviço'));
    }
    persist();
    return req;
  }

  function setOnlineStatus(profissionalId, online) {
    const p = profissionalById(profissionalId);
    if (!p) return null;
    p.online = !!online;
    persist();
    return p;
  }

  function atualizarPerfilProfissional(profissionalId, data) {
    const p = profissionalById(profissionalId);
    if (!p) return null;
    Object.assign(p, data);
    persist();
    return p;
  }

  function enviarDocumento(profissionalId, doc) {
    const p = profissionalById(profissionalId);
    if (!p) return null;
    p.documentos[doc] = true;
    if (p.statusAprovacao === 'reprovado') { p.statusAprovacao = 'pendente'; delete p.motivoReprovacao; }
    persist();
    return p;
  }

  // ---------------------------------------------------------------
  // Anúncios patrocinados
  // ---------------------------------------------------------------

  function adPlan(key) {
    const plans = (state.settings && state.settings.adPlans) || {};
    return plans[key] || plans.local || { nome: 'Local', valor: 7900, dias: 30 };
  }

  function anuncioById(id) { return (state.ads || []).find(function (a) { return a.id === id; }); }

  function isAdActive(a) {
    if (!a || a.status !== 'ativo' || a.pagamentoStatus !== 'aprovado') return false;
    if (a.inicioEm && new Date(a.inicioEm) > new Date()) return false;
    if (a.fimEm && new Date(a.fimEm) < new Date()) return false;
    return true;
  }

  function activeAdsForCity(cityId) {
    const rank = { premium: 0, destaque: 1, local: 2 };
    const max = Number((state.settings || {}).adMaxSlots || 4);
    const eligible = (state.ads || []).filter(function (a) {
      return isAdActive(a) && (a.cidadeId === 'all' || !cityId || a.cidadeId === cityId);
    });
    const fixed = eligible.filter(function (a) { return !!a.fixo; }).sort(function (a, b) {
      return new Date(b.aprovadoEm || b.criadoEm) - new Date(a.aprovadoEm || a.criadoEm);
    });
    const regular = eligible.filter(function (a) { return !a.fixo; }).sort(function (a, b) {
      const p = (rank[a.plano] == null ? 9 : rank[a.plano]) - (rank[b.plano] == null ? 9 : rank[b.plano]);
      if (p) return p;
      return new Date(b.aprovadoEm || b.criadoEm) - new Date(a.aprovadoEm || a.criadoEm);
    }).slice(0, max);
    return fixed.concat(regular);
  }

  function criarAnuncio(dados) {
    const plan = adPlan(dados.plano || 'local');
    const ad = {
      id: PU.uid('ad'), empresa: String(dados.empresa || '').trim(), chamada: String(dados.chamada || '').trim(),
      cidadeId: dados.cidadeId || 'all', plano: dados.plano || 'local', imagem: dados.imagem || '',
      whatsapp: String(dados.whatsapp || '').trim(), link: String(dados.link || '').trim(),
      formaPagamento: dados.formaPagamento || 'pix', valorPago: Number(plan.valor || 0), pagamentoStatus: 'aprovado',
      status: 'aguardando_aprovacao', criadoEm: nowIso(), pagoEm: nowIso(), inicioEm: null, fimEm: null,
      impressoes: 0, cliques: 0, motivoReprovacao: ''
    };
    state.ads.push(ad);
    persist();
    return ad;
  }

  function registrarImpressoesAnuncios(ids) {
    const seen = {};
    (ids || []).forEach(function (id) {
      if (seen[id]) return;
      seen[id] = true;
      const a = anuncioById(id);
      if (a && isAdActive(a)) a.impressoes = Number(a.impressoes || 0) + 1;
    });
    persist();
  }

  function registrarCliqueAnuncio(id) {
    const a = anuncioById(id);
    if (!a) return null;
    a.cliques = Number(a.cliques || 0) + 1;
    persist();
    return a;
  }

  // ---------------------------------------------------------------
  // Administração
  // ---------------------------------------------------------------

  function aprovarProfissional(profissionalId) {
    const p = profissionalById(profissionalId);
    if (!p) return null;
    p.statusAprovacao = 'aprovado';
    delete p.motivoReprovacao;
    persist();
    return p;
  }
  function reprovarProfissional(profissionalId, motivo) {
    const p = profissionalById(profissionalId);
    if (!p) return null;
    p.statusAprovacao = 'reprovado';
    p.motivoReprovacao = motivo || 'Cadastro reprovado pelo administrador.';
    p.online = false;
    persist();
    return p;
  }
  function bloquearUsuario(role, id, bloqueado) {
    const u = role === 'cliente' ? clienteById(id) : profissionalById(id);
    if (!u) return null;
    u.bloqueado = !!bloqueado;
    if (bloqueado && role === 'profissional') u.online = false;
    persist();
    return u;
  }

  function criarCategoria(nome, icon) {
    const c = { id: PU.uid('cat'), nome: nome, icon: icon || 'tag', leadTier: 'padrao' };
    state.categories.push(c);
    persist();
    return c;
  }
  function removerCategoria(id) {
    state.categories = state.categories.filter(function (c) { return c.id !== id; });
    persist();
  }
  function criarCidade(nome, uf) {
    const c = { id: PU.uid('city'), nome: nome, uf: uf || 'MG' };
    state.cities.push(c);
    persist();
    return c;
  }
  function removerCidade(id) {
    state.cities = state.cities.filter(function (c) { return c.id !== id; });
    persist();
  }
  function setLeadFees(values) {
    state.settings.leadFees = state.settings.leadFees || {};
    ['padrao', 'medio', 'premium'].forEach(function (k) {
      if (values[k] != null) state.settings.leadFees[k] = Math.max(0, Number(values[k]) || 0);
    });
    if (values.prioridadeCliente != null) state.settings.prioridadeCliente = Math.max(0, Number(values.prioridadeCliente) || 0);
    persist();
    return state.settings;

      dataPreferida: row.data_preferida || null,
      // V11.29: prazo escolhido pelo cliente (dia real em prazoDia, AAAA-MM-DD).
      prazo: row.prazo || null,
      prazoDia: row.prazo_dia || null,
      periodo: row.periodo || null,
      participantes: row.participantes == null ? null : Number(row.participantes),
      limiteParticipantes: row.limite == null ? 3 : Number(row.limite),
      // V11.32: pedido aberto a todos (motivo) e distância aproximada quando o profissional não tem localização salva.
      abertoTodos: row.aberto_todos || null,
      distanciaAprox: !!row.distancia_aprox,
      mesmaCidade: !!row.mesma_cidade,
      status: localStatus(row.status),
      profissionalId: professionalId || null,
      criadoEm: row.criado_em,
      atualizadoEm: row.atualizado_em || row.criado_em,
      prioridade: !!row.prioridade,
      pagamentoPrioridade: row.prioridade_pagamento_status ? {
        id: row.prioridade_pagamento_id || null,
        status: row.prioridade_pagamento_status,
        valor: Number(row.prioridade_valor_centavos || 0),
        checkoutUrl: row.prioridade_checkout_url || null,
        criadoEm: row.atualizado_em || row.criado_em
      } : null,
      leadUnlock: professionalId ? { profissionalId: professionalId, valor: 0, status: 'pago', criadoEm: row.atualizado_em || row.criado_em } : null,
      taxaVisita: 0,
      orcamento: null,
      orcamentos: [],
      pagamento: null,
      avaliacaoCliente: null,
      avaliacaoProfissional: null,
      recusadoPor: [],
      canceladoPor: null,
      motivoCancelamento: row.status === 'expirado' ? 'O pedido expirou depois de 3 dias sem resposta. Toque em "Refazer o mesmo pedido" para publicar de novo.' : null,
      historico: []
    };
  }


  function quoteFromCloud(row) {
    if (!row) return null;
    const rawStatus = String(row.status || '');
    const profId = row.profissional_id || null;
    return {
      id: row.orcamento_id || row.id,
      profissionalId: profId,
      maoDeObra: Number(row.mao_obra_centavos || 0),
      material: Number(row.material_centavos || 0),
      taxaVisita: Number(row.taxa_visita_centavos || 0),
      total: Number(row.valor_centavos || 0),
      criadoEm: row.criado_em,
      atualizadoEm: row.atualizado_em || row.criado_em,
      status: rawStatus === 'aceito' ? 'aprovado' :
        (rawStatus === 'recusado' ? 'recusado' :
        (rawStatus === 'nao_selecionado' ? 'nao_selecionado' : 'pendente')),
      statusBanco: rawStatus,
      versao: 1,
      motivoRecusa: row.motivo_recusa || '',
      distanciaKm: row.distancia_km == null ? null : Number(row.distancia_km),
      profissional: profId ? {
        id: profId,
        nome: row.profissional_nome || 'Profissional',
        telefone: row.profissional_telefone || row.profissional_whatsapp || '',
        fotoUrl: row.profissional_foto_url || '',
        verificado: !!row.profissional_verificado,
        cidadeNome: row.profissional_cidade || '',
        uf: row.profissional_uf || '',
        avaliacaoMedia: Number(row.profissional_avaliacao || 0),
        totalAvaliacoes: Number(row.profissional_total_avaliacoes || 0)
      } : null
    };
  }

  function upsertQuoteProfessional(row, req) {
    const id = row && row.profissional_id;
    if (!id) return null;
    let p = DB.state.users.profissionais.find(function (x) { return x.id === id; });
    const data = {
      id: id,
      nome: row.profissional_nome || (p && p.nome) || 'Profissional',
      email: '',
      telefone: row.profissional_telefone || row.profissional_whatsapp || (p && p.telefone) || '',
      fotoUrl: row.profissional_foto_url || (p && p.fotoUrl) || '',
      verificado: row.profissional_verificado == null ? !!(p && p.verificado) : !!row.profissional_verificado,
      cidadeNome: row.profissional_cidade || (p && p.cidadeNome) || '',
      uf: row.profissional_uf || (p && p.uf) || '',
      categorias: [req ? req.categoriaId : (p && p.categorias && p.categorias[0])].filter(Boolean),
      cidadeId: cityIdFromCloud(row.profissional_cidade || '', row.profissional_uf || ''),
      raioKm: 20,
      statusAprovacao: 'aprovado',
      online: true,
      creditos: 0,
      bonusDesbloqueios: 0,
      avaliacaoMedia: Number(row.profissional_avaliacao || (p && p.avaliacaoMedia) || 0),
      totalAvaliacoes: Number(row.profissional_total_avaliacoes || (p && p.totalAvaliacoes) || 0),
      bloqueado: false
    };
    if (p) Object.assign(p, data);
    else { p = data; DB.state.users.profissionais.push(p); }
    return p;
  }

  function applyCloudQuote(req, row) {
    if (!req || !row) return req;
    const q = quoteFromCloud(row);
    req.orcamento = q;
    req.taxaVisita = q ? q.taxaVisita : 0;
    if (q && q.profissionalId && !req.profissionalId && q.status === 'aprovado') req.profissionalId = q.profissionalId;

    // Para o profissional, a visão sintética "não selecionado" precisa encerrar
    // a proposta dele sem liberar o contato do cliente.
    if (q && q.status === 'nao_selecionado') {
      req.status = DB.STATUS.NAO_SELECIONADO;
    } else if (req.status === DB.STATUS.AGUARDANDO_ORCAMENTO) {
      if (row.status === 'enviado') req.status = DB.STATUS.ORCAMENTO_ENVIADO;
      else if (row.status === 'recusado') req.status = DB.STATUS.ORCAMENTO_RECUSADO;
      else if (row.status === 'aceito') req.status = DB.STATUS.APROVADO;
    }
    return req;
  }

  async function attachCallPhotos(reqs) {
    reqs = reqs || [];
    const ids = reqs.map(function (r) { return r.id; }).filter(Boolean);
    if (!ids.length) return reqs;
    const pRes = await client.rpc('qf_chamado_fotos', { p_ids: ids });
    if (pRes.error) throw pRes.error;
    const map = Object.create(null);
    (pRes.data || []).forEach(function (r) {
      map[r.chamado_id] = Array.isArray(r.fotos) ? r.fotos : [];
    });
    reqs.forEach(function (req) {
      if (Object.prototype.hasOwnProperty.call(map, req.id)) req.fotos = map[req.id];
    });
    return reqs;
  }

  async function attachLatestQuotes(reqs) {
    reqs = reqs || [];
    const ids = reqs.map(function (r) { return r.id; }).filter(Boolean);
    if (!ids.length) return reqs;
    const sess = DB.getSession();

    if (sess && sess.role === 'cliente') {
      const qRes = await client.rpc('qf_cliente_orcamentos');
      if (qRes.error) throw qRes.error;
      const grouped = Object.create(null);
      (qRes.data || []).forEach(function (row) {
        if (ids.indexOf(row.chamado_id) === -1) return;
        const req = reqs.find(function (r) { return r.id === row.chamado_id; });
        if (!req) return;
        upsertQuoteProfessional(row, req);
        const q = quoteFromCloud(row);
        if (!q) return;
        (grouped[row.chamado_id] = grouped[row.chamado_id] || []).push(q);
      });

      reqs.forEach(function (req) {
        const list = (grouped[req.id] || []).sort(function (a, b) {
          if (a.status === 'aprovado' && b.status !== 'aprovado') return -1;
          if (b.status === 'aprovado' && a.status !== 'aprovado') return 1;
          return new Date(b.criadoEm || 0) - new Date(a.criadoEm || 0);
        });
        req.orcamentos = list;
        const accepted = list.find(function (q) { return q.status === 'aprovado'; });
        const sent = list.filter(function (q) { return q.status === 'pendente'; });
        if (accepted) {
          req.orcamento = accepted;
          req.profissionalId = accepted.profissionalId;
          req.taxaVisita = accepted.taxaVisita || 0;
        } else if (sent.length) {
          req.orcamento = sent[0];
          req.taxaVisita = sent[0].taxaVisita || 0;
          if (req.status === DB.STATUS.AGUARDANDO_ORCAMENTO) req.status = DB.STATUS.ORCAMENTO_ENVIADO;
        }
      });
      return reqs;
    }

    const qRes = await client.from('qf_orcamentos')
      .select('id,chamado_id,profissional_id,valor_centavos,mao_obra_centavos,material_centavos,taxa_visita_centavos,status,motivo_recusa,criado_em,atualizado_em')
      .in('chamado_id', ids)
      .order('criado_em', { ascending: false });
    if (qRes.error) throw qRes.error;
    const latest = Object.create(null);
    (qRes.data || []).forEach(function (q) {
      if (!latest[q.chamado_id]) latest[q.chamado_id] = q;
    });
    reqs.forEach(function (req) {
      if (latest[req.id]) applyCloudQuote(req, latest[req.id]);
    });
    return reqs;
  }

  async function attachEvaluations(reqs) {
    reqs = reqs || [];
    const ids = reqs.map(function (r) { return r.id; }).filter(Boolean);
    if (!ids.length) return reqs;
    const aRes = await client.from('qf_avaliacoes')
      .select('id,chamado_id,cliente_id,profissional_id,nota,comentario,autor_tipo,criado_em')
      .in('chamado_id', ids)
      .order('criado_em', { ascending: false });
    if (aRes.error) throw aRes.error;
    (aRes.data || []).forEach(function (a) {
      const req = reqs.find(function (r) { return r.id === a.chamado_id; });
      if (!req) return;
      const local = { id: a.id, nota: Number(a.nota || 0), comentario: a.comentario || '', criadoEm: a.criado_em };
      if (a.autor_tipo === 'profissional') req.avaliacaoProfissional = local;
      else req.avaliacaoCliente = local;
    });
    reqs.forEach(function (req) {
      if (req.avaliacaoCliente && req.avaliacaoProfissional &&
          (req.status === DB.STATUS.SERVICO_CONCLUIDO || req.status === DB.STATUS.PAGO || req.status === DB.STATUS.FINALIZADO)) {
        req.status = DB.STATUS.FINALIZADO;
      }
    });
    return reqs;
  }

  function rebuildCloudReviews(reqs, profissionalId) {
    DB.state.reviews = [];
    (reqs || []).forEach(function (req) {
      if (!req.avaliacaoCliente) return;
      DB.state.reviews.push({
        id: req.avaliacaoCliente.id || ('rev_' + req.id),
        requestId: req.id,
        de: 'cliente',
        profissionalId: profissionalId || req.profissionalId,
        nota: Number(req.avaliacaoCliente.nota || 0),
        comentario: req.avaliacaoCliente.comentario || '',
        criadoEm: req.avaliacaoCliente.criadoEm
      });
    });
  }

  async function syncClientCalls(userId) {
    const res = await client.rpc('qf_cliente_chamados');
    if (res.error) throw res.error;
    await attachPrazos(res.data);
    DB.state.requests = (res.data || []).map(function (r) {
      return requestFromCloud(r, r.profissional_id || null);
    });

    // Primeiro registra o profissional já escolhido (se houver). Em seguida,
    // attachLatestQuotes acrescenta todos os demais profissionais que enviaram orçamento.
    DB.state.users.profissionais = [];
    (res.data || []).forEach(function (r) {
      if (!r.profissional_id) return;
      upsertQuoteProfessional({
        profissional_id: r.profissional_id,
        profissional_nome: r.profissional_nome,
        profissional_telefone: r.profissional_telefone,
        profissional_foto_url: r.profissional_foto_url,
        profissional_verificado: r.profissional_verificado,
        profissional_cidade: r.profissional_cidade,
        profissional_uf: r.profissional_uf,
        profissional_avaliacao: r.profissional_avaliacao,
        profissional_total_avaliacoes: r.profissional_total_avaliacoes
      }, DB.requestById(r.id));
    });

    await attachCallPhotos(DB.state.requests);
    await attachLatestQuotes(DB.state.requests);
    await attachEvaluations(DB.state.requests);

    const local = DB.clienteById(userId);
    if (local && res.data && res.data[0]) {
      const r = res.data[0];
      local.enderecos = [{
        id: 'cloud_latest', rua: r.endereco_completo || '', bairro: r.bairro || '',
        cidadeId: cityIdFromCloud(r.cidade, r.uf), cidade: r.cidade || '', uf: r.uf || '',
        cep: global.QFGeo ? global.QFGeo.formatCep(r.cep || '') : (r.cep || ''), complemento: '',
        latitude: r.latitude == null ? null : Number(r.latitude), longitude: r.longitude == null ? null : Number(r.longitude)
      }];
    }
    DB.persist();
  }

  // V11.32.1: os pedidos "abertos a todos" vêm por uma consulta própria (a lista normal não os traz,
  // para que nenhum deles dispare o alerta de chamado). Junto vêm os números da faixa de movimento.
  // Se a consulta falhar, a tela aparece como antes (só os pedidos da categoria do profissional).
  async function fetchAbertos() {
    if (!client) return [];
    try {
      const res = await Promise.all([client.rpc('qf_portfolio_abertos_todos'), client.rpc('qf_movimento_pedidos')]);
      if (!res[1].error && res[1].data && res[1].data.ok) global.QFMovimento = res[1].data;
      if (res[0].error) throw res[0].error;
      return (res[0].data || []).filter(function (r) { return r && r.id && r.aberto_todos; });
    } catch (err) { console.warn('QuemFaz pedidos abertos a todos', err); return []; }
  }

  async function syncProfessionalCalls(userId) {
    const localProf = DB.profissionalById(userId);
    if (localProf && localProf.online) {
      try { await refreshProfessionalLocation(false); } catch (err) { console.warn('QuemFaz localização', err); }
    }
    const available = await client.rpc('qf_portfolio_servicos');
    if (available.error) throw available.error;
    const unlocked = await client.from('qf_chamados_desbloqueados').select('*').order('criado_em', { ascending: false });
    if (unlocked.error) throw unlocked.error;
    const abertosRows = await fetchAbertos();
    await attachPrazos((available.data || []).concat(abertosRows).concat(unlocked.data || []));

    const reqs = [];
    (available.data || []).forEach(function (r) { reqs.push(requestFromCloud(r, null)); });
    abertosRows.forEach(function (r) {
      if (!reqs.some(function (x) { return x.id === r.id; })) reqs.push(requestFromCloud(r, null));
    });
    (unlocked.data || []).forEach(function (r) {
      reqs.push(requestFromCloud(r, userId));
      if (r.cliente_id) {
        const existing = DB.state.users.clientes.find(function (u) { return u.id === r.cliente_id; });
        const clientLocal = {
          id: r.cliente_id,
          nome: r.cliente_nome || 'Cliente',
          email: '',
          telefone: r.cliente_whatsapp || r.cliente_telefone || '',
          bloqueado: false,
          criadoEm: r.criado_em,
          enderecos: []
        };
        if (existing) Object.assign(existing, clientLocal); else DB.state.users.clientes.push(clientLocal);
      }
    });
    await attachCallPhotos(reqs);
    await attachLatestQuotes(reqs);
    await attachEvaluations(reqs);
    DB.state.requests = reqs;
    rebuildCloudReviews(reqs, userId);

    const txRes = await client.from('qf_movimentacoes_carteira').select('*').eq('profissional_id', userId).order('criado_em', { ascending: false }).limit(100);
    const recRes = await client.from('qf_recargas')
      .select('id,profissional_id,valor_centavos,metodo,status,checkout_url,criado_em,aprovado_em')
      .eq('profissional_id', userId)
      .neq('status', 'aprovado')
      .order('criado_em', { ascending: false })
      .limit(50);
    if (!txRes.error) {
      DB.state.transactions = (txRes.data || []).map(function (t) {
        return {
          id: t.id,
          profissionalId: userId,
          requestId: t.referencia_tipo === 'chamado' ? t.referencia_id : null,
          tipo: t.tipo,
          status: 'pago',
          valor: Number(t.valor_centavos || 0),
          criadoEm: t.criado_em,
          descricao: t.descricao || 'Movimentação da carteira'
        };
      });
      if (!recRes.error) {
        (recRes.data || []).forEach(function (r) {
          const label = r.metodo === 'cartao' ? 'Cartão' : (r.metodo === 'boleto' ? 'Boleto' : 'Pix');
          DB.state.transactions.push({
            id: r.id,
            profissionalId: userId,
            requestId: null,
            tipo: 'recarga_pendente',
            status: r.status,
            valor: Number(r.valor_centavos || 0),
            metodo: label,
            criadoEm: r.criado_em,
            checkoutUrl: r.checkout_url || null,
            descricao: 'Recarga via ' + label
          });
        });
        DB.state.transactions.sort(function (a, b) { return new Date(b.criadoEm || 0) - new Date(a.criadoEm || 0); });
      }
    }
    DB.persist();
  }

  async function submitAd(dados) {
    if (!client) throw new Error('Conexão com o Supabase indisponível.');
    const sRes = await client.auth.getSession();
    if (sRes.error) throw sRes.error;
    if (!sRes.data.session) throw new Error('Entre na sua conta antes de anunciar. Cliente e profissional podem anunciar.');
    const res = await client.rpc('qf_enviar_anuncio', {
      p_empresa: String(dados.empresa || '').trim(),
      p_chamada: String(dados.chamada || '').trim(),
      p_regiao: dados.cidadeId || 'all',
      p_plano: dados.plano || 'local',
      p_imagem_data: dados.imagem || '',
      p_whatsapp: String(dados.whatsapp || '').trim(),
      p_link: String(dados.link || '').trim() || null,
      p_metodo: dados.formaPagamento || 'pix'
    });
    if (res.error) throw res.error;
    const out = res.data || {};
    if (!out.ok) throw new Error(out.reason || 'Não foi possível enviar o anúncio.');
    if (!out.pagamento_id) throw new Error('Pagamento do anúncio não foi criado.');
    if (dados.arteConfig) {
      const artSave = await client.rpc('qf_editar_anuncio_proprio', {
        p_anuncio_id: out.anuncio_id,
        p_empresa: String(dados.empresa || '').trim(),
        p_chamada: String(dados.chamada || '').trim(),
        p_imagem_data: dados.imagem || '',
        p_whatsapp: String(dados.whatsapp || '').trim(),
        p_link: String(dados.link || '').trim() || null,
        p_arte_config: dados.arteConfig
      });
      if (artSave.error) throw artSave.error;
    }
    const checkout = await startEfiCheckout('anuncio', out.pagamento_id);
    out.checkout_url = checkout.checkout_url || null;
    out.pix_copy_paste = checkout.pix_copy_paste || null;
    out.qr_image = checkout.qr_image || null;
    out.charge_id = checkout.charge_id || null;
    out.provider = checkout.provider || 'efi';
    out.pagamento_status = checkout.status || out.pagamento_status || 'pendente';
    await syncPublicAds();
    const ad = DB.anuncioById(out.anuncio_id);
    return { ad: ad, pagamento: out };
  }

  async function editAd(dados) {
    if (!client) throw new Error('Conexão com o Supabase indisponível.');
    const res = await client.rpc('qf_editar_anuncio_proprio', {
      p_anuncio_id: dados.id,
      p_empresa: String(dados.empresa || '').trim(),
      p_chamada: String(dados.chamada || '').trim(),
      p_imagem_data: dados.imagem || '',
      p_whatsapp: String(dados.whatsapp || '').trim(),
      p_link: String(dados.link || '').trim() || null,
      p_arte_config: dados.arteConfig || {}
    });
    if (res.error) throw res.error;
    await syncPublicAds();
    return DB.anuncioById(dados.id);
  }

  function pendingCpfKey(email) { return 'qf_pending_cpf_' + String(email || '').trim().toLowerCase(); }
  function pendingCnpjKey(email) { return 'qf_pending_cnpj_' + String(email || '').trim().toLowerCase(); }
  function pendingProfessionalProfileKey(email) { return 'qf_pending_prof_profile_' + String(email || '').trim().toLowerCase(); }
  function pendingAddressKey(email) { return 'qf_pending_address_' + String(email || '').trim().toLowerCase(); }
  function pendingSelfieKey(email) { return 'qf_pending_selfie_' + String(email || '').trim().toLowerCase(); }
  async function saveCpf(cpf) {
    if (!client || !cpf) return null;

  async function saveClientAddress(endereco) {
    if (!client) throw new Error('Conexão indisponível.');
    const uRes = await client.auth.getUser();
    if (uRes.error || !uRes.data.user) throw new Error('Entre na sua conta para salvar o endereço.');
    const e = endereco || {};
    const row = {
      user_id: uRes.data.user.id,
      cep: global.QFGeo ? global.QFGeo.normalizeCep(e.cep) : String(e.cep || '').replace(/\D/g,''),
      rua: String(e.rua || '').trim(), numero: String(e.numero || '').trim() || null, bairro: String(e.bairro || '').trim(),
      cidade: String(e.cidade || '').trim(), uf: String(e.uf || '').trim().toUpperCase(),
      complemento: String(e.complemento || '').trim() || null,
      latitude: (e.latitude !== null && e.latitude !== undefined && String(e.latitude).trim() !== '' && Number.isFinite(Number(e.latitude)) && Math.abs(Number(e.latitude)) <= 90) ? Number(e.latitude) : null,
      longitude: (e.longitude !== null && e.longitude !== undefined && String(e.longitude).trim() !== '' && Number.isFinite(Number(e.longitude)) && Math.abs(Number(e.longitude)) <= 180) ? Number(e.longitude) : null,
      atualizado_em: new Date().toISOString()
    };
    const res = await client.from('qf_enderecos').upsert(row, { onConflict: 'user_id' }).select('*').single();
    if (res.error) throw res.error;
    return res.data;
  }
  async function loadOwnAddress() {
    if (!client) return null;
    const uRes = await client.auth.getUser();
    if (uRes.error || !uRes.data.user) return null;
    const res = await client.from('qf_enderecos').select('*').eq('user_id', uRes.data.user.id).maybeSingle();
    if (res.error) throw res.error;
    return res.data || null;
  }
  async function applyPendingIdentity(email, role) {
    try {
      const k = pendingCpfKey(email); const cpf = localStorage.getItem(k);
      if (cpf) { await saveCpf(cpf); localStorage.removeItem(k); }
    } catch (e) { console.warn('QuemFaz CPF pendente', e); }
    try {
      const kc = pendingCnpjKey(email); const cnpj = localStorage.getItem(kc);
      if (cnpj) { await saveCnpj(cnpj); localStorage.removeItem(kc); }
    } catch (e) { console.warn('QuemFaz CNPJ pendente', e); }
    try {
      const kp = pendingProfessionalProfileKey(email); const rawProfile = localStorage.getItem(kp);
      if (rawProfile && role === 'profissional') {
        const metaProf = JSON.parse(rawProfile);
        const uRes = await client.auth.getUser();
        if (uRes && uRes.data && uRes.data.user) {
          const up = await client.from('qf_profiles').update({
            tipo_pessoa: metaProf.tipoPessoa === 'cnpj' ? 'cnpj' : 'cpf',
            nome_fantasia: String(metaProf.nomeFantasia || '').trim() || null,
            atualizado_em: new Date().toISOString()
          }).eq('id', uRes.data.user.id);
          if (up.error) throw up.error;
          localStorage.removeItem(kp);
        }
      }
    } catch (e) { console.warn('QuemFaz dados profissionais pendentes', e); }
    try {
      const k2 = pendingAddressKey(email); const raw = localStorage.getItem(k2);
      if (raw) { await saveClientAddress(JSON.parse(raw)); localStorage.removeItem(k2); }
    } catch (e) { console.warn('QuemFaz endereço pendente', e); }
    try {
      const k3 = pendingSelfieKey(email); const selfie = localStorage.getItem(k3);
      if (selfie) {
        const uRes = await client.auth.getUser();
        if (uRes && uRes.data && uRes.data.user) {
          const up = await client.from('qf_profiles').update({ foto_url: selfie, atualizado_em: new Date().toISOString() }).eq('id', uRes.data.user.id);
          if (up.error) throw up.error;
          localStorage.removeItem(k3);
        }
      }
    } catch (e) { console.warn('QuemFaz selfie pendente', e); }
    try {
      const rawMarketing = localStorage.getItem('qf_marketing_attribution');
      if (rawMarketing && (role === 'cliente' || role === 'profissional')) {
        const marketing = JSON.parse(rawMarketing);
        const uRes = await client.auth.getUser();
        if (uRes && uRes.data && uRes.data.user) {
          const row = {
            user_id: uRes.data.user.id,
            role: role,
            source: String(marketing.source || '').slice(0, 120) || null,
            medium: String(marketing.medium || '').slice(0, 120) || null,
            campaign: String(marketing.campaign || '').slice(0, 240) || null,
            content: String(marketing.content || '').slice(0, 240) || null,
            term: String(marketing.term || '').slice(0, 240) || null,
            click_id: String(marketing.click_id || '').slice(0, 512) || null,
            landing_url: String(marketing.landing_url || '').slice(0, 2000) || null,
            referrer: String(marketing.referrer || '').slice(0, 2000) || null,
            first_seen_at: marketing.first_seen_at || new Date().toISOString(),
            updated_at: new Date().toISOString()
          };
          const mr = await client.from('qf_marketing_attribution').upsert(row, { onConflict: 'user_id' });
          if (mr.error) throw mr.error;
          localStorage.removeItem('qf_marketing_attribution');
          try {
            if (role === 'profissional' && typeof global.fbq === 'function') {
              global.fbq('track', 'CompleteRegistration', {
                content_name: role === 'profissional' ? 'QuemFaz Profissional' : 'QuemFaz Cliente',
                content_category: role
              });
            }
          } catch (_) {}
        }
      }
    } catch (e) { console.warn('QuemFaz origem de marketing pendente', e); }
  }

  // V11.1: consulta leve para o profissional (só ids/status); a sincronização completa roda quando algo muda.
  async function professionalQuickSignature() {
    if (!client) return null;
    const res = await Promise.all([
      client.rpc('qf_listar_chamados_disponiveis'),
      client.from('qf_chamados_desbloqueados').select('id,status,atualizado_em')
    ]);
    if (res[0].error) throw res[0].error;
    if (res[1].error) throw res[1].error;
    const a = (res[0].data || []).map(function (r) { return r.id + ':' + r.status; }).sort();
    const u = (res[1].data || []).map(function (r) { return r.id + ':' + r.status + ':' + (r.atualizado_em || ''); }).sort();
    return a.join(',') + '|' + u.join(',');
  }

  let publicAdsSync = null;
  let lastPublicAdsSyncAt = 0;
  function refreshPublicAdsInBackground() {
    if (publicAdsSync || Date.now() - lastPublicAdsSyncAt < 60000) return;
    lastPublicAdsSyncAt = Date.now();
    publicAdsSync = syncPublicAds().then(function () {
      global.dispatchEvent(new CustomEvent('qf-ads-updated'));
    }).catch(function (err) {
      console.warn('QuemFaz anúncios: atualização adiada', err && err.message);
    }).finally(function () { publicAdsSync = null; });
  }

  async function syncForCurrentSession(force) {
    if (!enabled) return null;
    prepareLocalState();
    if (syncing) return syncing;
    if (!force && Date.now() - lastSyncAt < 1200) return DB.getSession();
    syncing = (async function () {
      try {
        refreshPublicAdsInBackground();
        const sRes = await global.QFConnection.deadline(client.auth.getSession(), 10000, 'sessão');
        if (sRes.error) throw sRes.error;
        const sbSession = sRes.data.session;
        if (!sbSession) {
          DB.setSession(null);
          clearRuntimeData();
          lastSyncAt = Date.now();
          return null;
        }
        const user = sbSession.user;
        const profile = await ensureProfile(user, null, null);
        const role = profile.tipo;
        await applyPendingIdentity(user.email || '', role);
        const localUser = await syncLocalUser(user, role);
        DB.setSession({ role: role, userId: user.id });
        if (role === 'cliente') await syncClientCalls(user.id);
        if (role === 'profissional') await syncProfessionalCalls(user.id);
        lastSyncAt = Date.now();
        return { role: role, userId: user.id, user: localUser };
      } finally {
        syncing = null;
      }
    })();
    return syncing;
  }

  function traduzErroAuth(msg) {
    msg = String(msg || '');
    if (/already registered|already exists/i.test(msg)) return 'Este e-mail já está cadastrado. Entre na sua conta.';
    if (/at least 6/i.test(msg)) return 'A senha precisa ter pelo menos 6 caracteres.';
    if (/invalid email|valid email/i.test(msg)) return 'Digite um e-mail válido.';
    if (/rate limit|too many/i.test(msg)) return 'Muitas tentativas. Aguarde um minuto e tente novamente.';
    return msg || 'Não foi possível criar a conta.';
  }
  async function signUp(role, data) {
    if (!enabled) return { ok: false, error: 'Não foi possível carregar a conexão com o banco.' };
    const quickClient = role === 'cliente' && data && data.quickClient === true;
    let authPassword = String((data && data.senha) || '');
    let email = String((data && data.email) || '').trim().toLowerCase();
    let phoneDigits = '';

    if (quickClient) {
      phoneDigits = String(data.telefone || '').replace(/\D/g, '').replace(/^55(?=\d{10,11}$)/, '');
      if (!(global.QFUI && global.QFUI.validPhone ? global.QFUI.validPhone(phoneDigits) : phoneDigits.length === 11)) return { ok: false, error: 'Esse número não parece um celular válido. Digite o seu WhatsApp com DDD e o 9 na frente.' };
      data.telefone = phoneDigits;
    } else {
      if (authPassword.length < 6) return { ok: false, error: 'A senha precisa ter pelo menos 6 caracteres.' };
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return { ok: false, error: 'O e-mail é obrigatório. Digite um e-mail válido.' };
    }

    if (!String(data.nome || '').trim()) return { ok: false, error: 'Informe seu nome.' };
    if (role === 'profissional' && !/^data:image\//i.test(String(data.selfieData || ''))) {
      return { ok: false, error: 'É obrigatório enviar uma selfie do profissional ou a marca oficial da empresa representada.' };
    }

    const city = data.cidadeId ? cityFromId(data.cidadeId) : null;
    const cityName = String(data.cidade || (city ? city.nome : '') || '').trim() || null;
    const cityUf = String(data.uf || (city ? city.uf : '') || '').trim().toUpperCase() || null;
    const meta = {
      qf_role: role,
      qf_nome: data.nome,
      qf_telefone: data.telefone || '',
      qf_cidade: cityName,
      qf_uf: cityUf,
      qf_categorias: data.categorias || [],
      qf_categorias_personalizadas: data.categoriasPersonalizadas || [],
      qf_raio_km: data.raioKm || 10,
      qf_quick_client: quickClient
    };

    if (data.cpf) { try { localStorage.setItem(pendingCpfKey(email), data.cpf); } catch (_) {} }
    if (data.cnpj) { try { localStorage.setItem(pendingCnpjKey(email), data.cnpj); } catch (_) {} }
    if (role === 'profissional') {
      try { localStorage.setItem(pendingProfessionalProfileKey(email), JSON.stringify({ tipoPessoa: data.tipoPessoa || (data.cnpj ? 'cnpj' : 'cpf'), nomeFantasia: data.nomeFantasia || '' })); } catch (_) {}
    }
    if (data.endereco) { try { localStorage.setItem(pendingAddressKey(email), JSON.stringify(data.endereco)); } catch (_) {} }
    if (role === 'profissional' && data.selfieData) {
      try { localStorage.setItem(pendingSelfieKey(email), data.selfieData); } catch (_) {}
    }

    let res = null;

    if (quickClient) {
      try {
        const access = await client.functions.invoke('quemfaz-cliente-rapido', {
          body: { nome: String(data.nome || '').trim(), telefone: phoneDigits }
        });
        if (access.error) {
          let detail = null;
          try { if (access.error.context && typeof access.error.context.json === 'function') detail = await access.error.context.json(); } catch (_) {}
          return { ok: false, error: (detail && detail.error) || access.error.message || 'Não foi possível abrir seu acesso agora.' };
        }
        const payload = access.data || {};
        if (!payload.ok || !payload.token_hash) return { ok: false, error: payload.error || 'Não foi possível abrir seu acesso agora.' };

        let verified = await client.auth.verifyOtp({
          token_hash: String(payload.token_hash),
          type: String(payload.otp_type || 'magiclink')
        });
        if (verified.error && String(payload.otp_type || 'magiclink') !== 'email') {
          verified = await client.auth.verifyOtp({ token_hash: String(payload.token_hash), type: 'email' });
        }
        if (verified.error || !verified.data || !verified.data.session || !verified.data.user) {
          return { ok: false, error: 'Não foi possível validar seu acesso agora. Tente novamente.' };
        }
        res = verified;
        email = String(verified.data.user.email || '').trim().toLowerCase();
      } catch (e) {
        return { ok: false, error: (e && e.message) || 'Não foi possível abrir seu acesso agora.' };
      }
    } else {
      res = await client.auth.signUp({
        email: email,
        password: authPassword,
        options: { data: meta }
      });
      if (res.error) return { ok: false, error: traduzErroAuth(res.error.message) };
    }

    if (!res.data.session) {
      if (quickClient) return { ok: false, error: 'Não foi possível iniciar seu acesso rápido agora. Tente novamente.' };
      try { const li = await signIn(role, email, authPassword); if (li && li.ok) return li; } catch (_) {}
      return { ok: true, needsConfirmation: true, user: res.data.user };
    }

    try {
      await ensureProfile(res.data.user, role, data);
      await applyPendingIdentity(email, role);
      const local = await syncLocalUser(res.data.user, role);
      DB.setSession({ role: role, userId: res.data.user.id });
      if (role === 'cliente') await syncClientCalls(res.data.user.id); else await syncProfessionalCalls(res.data.user.id);
      return { ok: true, user: local, session: DB.getSession() };
    } catch (e) {
      return { ok: false, error: e.message || String(e) };
    }
  }

  async function signIn(expectedRole, email, senha) {
    if (!enabled) return { ok: false, error: 'Não foi possível carregar a conexão com o banco.' };
    const res = await client.auth.signInWithPassword({ email: email, password: senha });
    if (res.error) return { ok: false, error: 'Senha incorreta. Tente novamente ou use “Esqueci minha senha”.' };
    try {
      const p = await ensureProfile(res.data.user, expectedRole, null);
      await applyPendingIdentity(email, p.tipo);
      if (p.tipo !== expectedRole) {
        await client.auth.signOut();
        DB.setSession(null);
        return { ok: false, error: 'Esta conta está cadastrada como ' + (p.tipo === 'cliente' ? 'cliente' : 'profissional') + '.' };
      }
      const local = await syncLocalUser(res.data.user, p.tipo);
      DB.setSession({ role: p.tipo, userId: res.data.user.id });
      if (p.tipo === 'cliente') await syncClientCalls(res.data.user.id); else await syncProfessionalCalls(res.data.user.id);
      lastSyncAt = Date.now();
      const mustChangePassword = !!(res.data.user && res.data.user.app_metadata && res.data.user.app_metadata.qf_force_password_change);
      return { ok: true, user: local, session: DB.getSession(), mustChangePassword: mustChangePassword };
    } catch (e) {
      return { ok: false, error: e.message || String(e) };
    }
  }

  // V11.26: cliente entra com o WhatsApp + o código de acesso mostrado depois do pedido.
  async function signInClienteWhatsapp(telefone, codigo) {
    if (!enabled) return { ok: false, error: 'Não foi possível carregar a conexão com o banco.' };
    const d = String(telefone || '').replace(/\D/g, '').replace(/^55(?=\d{10,11}$)/, '');
    if (!(global.QFUI && global.QFUI.validPhone ? global.QFUI.validPhone(d) : d.length === 11)) {
      return { ok: false, error: 'Esse número não parece um celular válido. Digite o seu WhatsApp com DDD e o 9 na frente.' };
    }
    const cod = String(codigo || '').replace(/\D/g, '');
    if (cod.length !== 6) return { ok: false, error: 'Digite o código de acesso de 6 números.' };
    try {
      const access = await client.functions.invoke('quemfaz-cliente-rapido', { body: { modo: 'entrar', telefone: d, codigo: cod } });
      if (access.error) {
        let detail = null;
        try { if (access.error.context && typeof access.error.context.json === 'function') detail = await access.error.context.json(); } catch (_) {}
        return { ok: false, error: (detail && detail.error) || 'Não foi possível abrir seu acesso agora.' };
      }
      const payload = access.data || {};
      if (!payload.ok || !payload.token_hash) return { ok: false, error: payload.error || 'Não foi possível abrir seu acesso agora.' };
      let verified = await client.auth.verifyOtp({ token_hash: String(payload.token_hash), type: String(payload.otp_type || 'magiclink') });
      if (verified.error && String(payload.otp_type || 'magiclink') !== 'email') {
        verified = await client.auth.verifyOtp({ token_hash: String(payload.token_hash), type: 'email' });
      }
      if (verified.error || !verified.data || !verified.data.session || !verified.data.user) {
        return { ok: false, error: 'Não foi possível validar seu acesso agora. Tente novamente.' };
      }
      const user = verified.data.user;
      const pf = await ensureProfile(user, 'cliente', null);
      if (pf.tipo !== 'cliente') {
        await client.auth.signOut();
        DB.setSession(null);
        return { ok: false, error: 'Este número está cadastrado como profissional.' };
      }
      const local = await syncLocalUser(user, 'cliente');
      DB.setSession({ role: 'cliente', userId: user.id });
      await syncClientCalls(user.id);
      lastSyncAt = Date.now();
      return { ok: true, user: local, session: DB.getSession() };
    } catch (e) {
      return { ok: false, error: (e && e.message) || 'Não foi possível abrir seu acesso agora.' };
    }
  }

  // Código de acesso do cliente logado (6 números). Fica em memória para não piscar na tela.

  async function requestPasswordReset(email) {
    if (!enabled || !client) return { ok: false, error: 'Não foi possível carregar a conexão com o banco.' };
    email = String(email || '').trim();
    if (!email || email.indexOf('@') < 1 || email.indexOf('.') < 3) return { ok: false, error: 'Digite um e-mail válido.' };
    const redirectTo = location.origin + location.pathname;
    const res = await client.auth.resetPasswordForEmail(email, { redirectTo: redirectTo });
    if (res.error) {
      const msg = String(res.error.message || '');
      if (/rate limit|too many/i.test(msg)) return { ok: false, error: 'Muitas tentativas. Aguarde um minuto e tente novamente.' };
      return { ok: false, error: 'Não foi possível enviar o link agora. Tente novamente.' };
    }
    return { ok: true };
  }

  async function updatePassword(newPassword) {
    if (!enabled || !client) return { ok: false, error: 'Não foi possível carregar a conexão com o banco.' };
    newPassword = String(newPassword || '');
    if (newPassword.length < 6) return { ok: false, error: 'A nova senha precisa ter pelo menos 6 caracteres.' };
    const res = await client.auth.updateUser({ password: newPassword });
    if (res.error) return { ok: false, error: String(res.error.message || 'Não foi possível atualizar a senha.') };
    try { sessionStorage.removeItem('qf_password_recovery'); } catch (_) {}
    return { ok: true };
  }

  async function updateForcedPassword(newPassword) {
    if (!enabled || !client) return { ok: false, error: 'Não foi possível carregar a conexão com o banco.' };
    newPassword = String(newPassword || '');
    if (newPassword.length < 6) return { ok: false, error: 'A nova senha precisa ter pelo menos 6 caracteres.' };

    // Guarda o e-mail antes da alteração. A troca administrativa de senha pode invalidar
    // o refresh token atual; nesse caso entramos novamente automaticamente com a senha nova.
    let email = '';
    try {
      const current = await client.auth.getUser();
      email = String(current && current.data && current.data.user && current.data.user.email || '').trim();
    } catch (_) {}

    const fn = await client.functions.invoke('quemfaz-password-control', {
      body: { action: 'self_change', password: newPassword }
    });
    if (fn.error) {
      let detail = null;
      try { if (fn.error.context && typeof fn.error.context.json === 'function') detail = await fn.error.context.json(); } catch (_) {}
      return { ok: false, error: (detail && detail.error) || fn.error.message || 'Não foi possível atualizar a senha.' };
    }
    if (!fn.data || !fn.data.ok) return { ok: false, error: (fn.data && fn.data.error) || 'Não foi possível atualizar a senha.' };

    if (!email && fn.data.email) email = String(fn.data.email).trim();

    // V11.14.38: cria uma sessão nova imediatamente após a senha mudar.
    // Evita o profissional receber "sessão inválida" depois de salvar a nova senha.
    if (email) {
      const relog = await client.auth.signInWithPassword({ email: email, password: newPassword });
      if (relog.error || !relog.data || !relog.data.user || !relog.data.session) {
        try { await client.auth.signOut(); } catch (_) {}
        DB.setSession(null);
        clearRuntimeData();
        try { sessionStorage.removeItem('qf_force_password_change'); } catch (_) {}
        return { ok: true, needsLogin: true };
      }
      try {
        const p = await ensureProfile(relog.data.user, null, null);
        const local = await syncLocalUser(relog.data.user, p.tipo);
        DB.setSession({ role: p.tipo, userId: relog.data.user.id });
        if (p.tipo === 'cliente') await syncClientCalls(relog.data.user.id); else await syncProfessionalCalls(relog.data.user.id);
      } catch (e) {
        console.warn('QuemFaz sessão após troca de senha', e);
      }
    } else {
      const refreshed = await client.auth.refreshSession();
      if (refreshed.error || !refreshed.data || !refreshed.data.session) {
        try { await client.auth.signOut(); } catch (_) {}
        DB.setSession(null);
        clearRuntimeData();
        try { sessionStorage.removeItem('qf_force_password_change'); } catch (_) {}
        return { ok: true, needsLogin: true };
      }
    }

    try { sessionStorage.removeItem('qf_force_password_change'); } catch (_) {}
    return { ok: true, needsLogin: false };
  }

  async function startEfiCheckout(tipo, pagamentoId) {
    const sess = DB.getSession();
    const route = tipo === 'prioridade'
      ? '#/cliente/pedidos'
      : (tipo === 'recarga'
        ? '#/profissional/carteira'
        : (sess && sess.role === 'profissional' ? '#/profissional/home' : '#/cliente/home'));
    const returnUrl = location.origin + location.pathname + route;
    const fn = await client.functions.invoke('quemfaz-efi-checkout', {
      body: { tipo: tipo, pagamento_id: pagamentoId, return_url: returnUrl }
    });
    if (fn.error) {
      // V11.3: lê a resposta da função para log, mas nunca mostra o texto técnico ao usuário.
      let detail = null;
      try { if (fn.error.context && typeof fn.error.context.json === 'function') detail = await fn.error.context.json(); } catch (_) {}
      console.warn('QuemFaz checkout Efí', tipo, detail || fn.error);
      const e = new Error('Não foi possível iniciar o pagamento. Tente de novo em instantes.');
      e.qfCheckoutFailed = true; e.detail = detail;
      throw e;
    }
    const out = fn.data || {};
    if (!out.ok) {
      console.warn('QuemFaz checkout Efí', tipo, out);
      if (out.error === 'efi_not_configured') throw new Error('Efí Bank ainda não está configurado no servidor.');
      const e = new Error('Não foi possível iniciar o pagamento. Tente de novo em instantes.');
      e.qfCheckoutFailed = true; e.detail = out;
      throw e;
    }
    return out;
  }

  async function createRecharge(valorCentavos, metodo) {
    const pay = await client.rpc('qf_solicitar_recarga', {
      p_valor_centavos: Number(valorCentavos),
      p_metodo: metodo || 'pix'
    });
    if (pay.error) throw pay.error;
    const row = pay.data || {};
    if (!row.recarga_id) throw new Error('A recarga não foi criada.');
    let checkout;
    try {
      checkout = await startEfiCheckout('recarga', row.recarga_id);
    } catch (err) {
      // A recarga pendente continua criada; só fica sem link de pagamento.
      if ((metodo === 'cartao' || metodo === 'boleto') && err && err.qfCheckoutFailed) {
        const e = new Error('Pagamento com ' + (metodo === 'boleto' ? 'boleto' : 'cartão') + ' indisponível no momento. Use o Pix — o saldo cai na hora em que o pagamento for confirmado.');
        e.qfOfferPix = true;
        throw e;
      }
      throw err;
    }
    return {
      id: row.recarga_id,
      status: row.status || 'pendente',
      valor: Number(row.valor_centavos || valorCentavos || 0),
      metodo: row.metodo || metodo || 'pix',
      checkoutUrl: checkout.checkout_url || null,
      checkoutId: checkout.checkout_id || null,
      pixCopyPaste: checkout.pix_copy_paste || null,
      qrImage: checkout.qr_image || null,
      provider: checkout.provider || 'efi'
    };
  }

  async function createCall(data) {
    const city = cityFromId(data.endereco.cidadeId);
    const cat = DB.categoryById(data.categoriaId);
    const enderecoCompleto = [data.endereco.rua, data.endereco.complemento].filter(Boolean).join(' · ');
    const rawLat = data.endereco.latitude;
    const rawLng = data.endereco.longitude;
    const hasAddressCoords =
      rawLat !== null && rawLat !== undefined && String(rawLat).trim() !== '' &&
      rawLng !== null && rawLng !== undefined && String(rawLng).trim() !== '' &&
      Number.isFinite(Number(rawLat)) && Number.isFinite(Number(rawLng)) &&
      Math.abs(Number(rawLat)) <= 90 && Math.abs(Number(rawLng)) <= 180 &&
      !(Number(rawLat) === 0 && Number(rawLng) === 0);
    const selectedCity = data.endereco.cidade || (city ? city.nome : null);
    const selectedUf = data.endereco.uf || (city ? city.uf : null);
    // Cliente escolhe a região por cidade ou CEP. Não pede GPS nem endereço completo nesta etapa.
    // Se veio só a cidade, usa o centro geográfico dela para permitir a cascata por proximidade.
    let loc = hasAddressCoords
      ? { latitude: Number(rawLat), longitude: Number(rawLng) }
      : null;
    if (!loc && selectedCity && global.QFGeo && typeof global.QFGeo.geocodeCity === 'function') {
      try {
        const cityLoc = await global.QFGeo.geocodeCity(selectedCity, selectedUf);
        if (cityLoc && Number.isFinite(Number(cityLoc.latitude)) && Number.isFinite(Number(cityLoc.longitude))) {
          loc = { latitude: Number(cityLoc.latitude), longitude: Number(cityLoc.longitude) };
        }
      } catch (_) {}
    }
    // O chamado nasce NORMAL. Prioridade só é ativada no banco depois de pagamento aprovado.
    const row = {
      cliente_id: data.clienteId,
      categoria: data.categoriaId,
      titulo: cat ? cat.nome : 'Serviço solicitado',
      descricao: data.descricao,
      cidade: selectedCity,
      uf: selectedUf,
      bairro: data.endereco.bairro || null,
      cep: global.QFGeo ? global.QFGeo.normalizeCep(data.endereco.cep) : String(data.endereco.cep || '').replace(/\D/g,''),
      endereco_completo: enderecoCompleto || null,
      latitude: loc ? loc.latitude : null,
      longitude: loc ? loc.longitude : null,
      fotos: Array.isArray(data.fotos) ? data.fotos.slice(0, 4) : [],
      marketing_origem: global.QFClientAcquisition ? global.QFClientAcquisition.attribution() : {},
      status: 'aberto',
      data_preferida: data.dataPreferida || null,
      prioridade: false
    };
    // V11.29: prazo do pedido. Se o banco recusar por causa desses campos, publica sem eles: o pedido nunca se perde.
    const comPrazo = !!data.prazo;
    if (comPrazo) { row.prazo = data.prazo; row.prazo_dia = data.prazoDia || null; row.periodo = data.periodo || null; }
    let res = await client.from('qf_chamados').insert(row).select('*').single();
    if (res.error && comPrazo && /prazo|periodo/i.test(String(res.error.message || '') + ' ' + String(res.error.details || ''))) {
      console.warn('QuemFaz prazo não gravado', res.error);
      delete row.prazo; delete row.prazo_dia; delete row.periodo;
      res = await client.from('qf_chamados').insert(row).select('*').single();
    }
    if (res.error) throw res.error;
    if (global.QFClientAcquisition) global.QFClientAcquisition.published({ id: res.data.id }, data.categoriaId);
    // O pedido já foi salvo. Tarefas auxiliares não podem transformar sucesso em erro nem atrasar sua confirmação.
    Promise.resolve(client.from('qf_profiles').update({ cidade: row.cidade, uf: row.uf, atualizado_em: new Date().toISOString() }).eq('id', data.clienteId)).catch(function () {});
    saveClientAddress(Object.assign({}, data.endereco, { latitude: row.latitude, longitude: row.longitude })).catch(function () {});
    const req = requestFromCloud(res.data, null);
    req.fotos = Array.isArray(data.fotos) ? data.fotos.slice(0, 4) : [];

    if (data.prioridade) {
      const pay = await client.rpc('qf_solicitar_prioridade', {
        p_chamado_id: res.data.id,
        p_metodo: data.prioridadeMetodo || 'pix'
      });
      if (pay.error) {
        req.pagamentoPrioridade = { status: 'erro', valor: 490, erro: pay.error.message };
      } else {
        const out = pay.data || {};
        req.pagamentoPrioridade = {
          id: out.pagamento_id || null,
          status: out.status || 'pendente',
          valor: Number(out.valor_centavos || 490),
          checkoutUrl: out.checkout_url || null,
          criadoEm: new Date().toISOString()
        };
        req.prioridade = !!out.prioridade_ativa;
        if (!req.prioridade && req.pagamentoPrioridade.id && !req.pagamentoPrioridade.checkoutUrl) {
          try {
            const checkout = await startEfiCheckout('prioridade', req.pagamentoPrioridade.id);
            req.pagamentoPrioridade.checkoutUrl = checkout.checkout_url || null;
          } catch (checkoutErr) {
            req.pagamentoPrioridade.erro = checkoutErr && checkoutErr.message ? checkoutErr.message : String(checkoutErr || '');
          }
        }
      }
    }

    DB.state.requests = DB.state.requests.filter(function (x) { return x.id !== req.id; });
    DB.state.requests.unshift(req);
    const localClient = DB.clienteById(data.clienteId);
    if (localClient) localClient.enderecos = [data.endereco];
    DB.persist();
    if (global.QFPush) {
      try { Promise.resolve(global.QFPush.notify('new_call', req.id)).catch(function (pushErr) { console.warn('QuemFaz push do novo chamado', pushErr); }); }
      catch (pushErr) { console.warn('QuemFaz push do novo chamado', pushErr); }
    }
    return req;
  }

  async function unlockCall(chamadoId, profissionalId) {
    const res = await client.rpc('qf_desbloquear_chamado', { p_chamado_id: chamadoId });
    if (res.error) return { ok: false, reason: 'erro', error: res.error.message };
    const out = res.data || {};
    if (!out.ok) {
      if (out.reason === 'reservado') {
        try { await syncProfessionalCalls(profissionalId); } catch (_) {}
        return { ok:false, reason:'reservado' };
      }
      if (out.reason === 'saldo_insuficiente') {
        return { ok: false, reason: 'saldo', valor: Number(out.preco_centavos || 0), saldo: Number(out.saldo_centavos || 0) };
      }
      if (out.reason === 'avaliacao_pendente') {
        return { ok: false, reason: 'avaliacao_pendente', chamadoId: out.chamado_id || null };
      }
      return { ok: false, reason: out.reason || 'indisponivel' };
    }
    const uRes = await client.auth.getUser();
    if (uRes.error || !uRes.data || !uRes.data.user) {
      return { ok: false, reason: 'sessao', error: 'Sessão expirada. Entre novamente.' };
    }
    await syncLocalUser(uRes.data.user, 'profissional');
    await syncProfessionalCalls(profissionalId);
    const req = DB.requestById(chamadoId);
    const prof = DB.profissionalById(profissionalId);
    return {
      ok: true,
      request: req,
      valor: Number(out.preco_centavos || 0),
      valorTabela: Number(out.preco_tabela_centavos || out.preco_centavos || 0),
      usouBonus: out.usou_bonus === true || out.origem === 'bonus',
      origem: out.origem || 'saldo',
      planoRestantes: out.plano_restantes == null ? null : Number(out.plano_restantes),
      participantes: out.participantes == null ? null : Number(out.participantes),
      limite: out.limite == null ? 3 : Number(out.limite),
      saldo: prof ? Number(prof.creditos || 0) : Number(out.saldo_centavos || 0),
      bonusDesbloqueios: 0
    };
  }

  let onlineSemGps = false;
  async function setOnline(online, opts) {
    const automatico = !!(opts && opts.automatico);
    const uRes = await client.auth.getUser();
    if (uRes.error || !uRes.data.user) throw new Error('Sessão expirada.');
    if (online) {
      const pf = await client.from('qf_profiles').select('foto_url').eq('id', uRes.data.user.id).single();
      if (pf.error) throw pf.error;
      if (!pf.data || !String(pf.data.foto_url || '').trim()) {
        throw new Error('Imagem de identificação obrigatória: envie sua selfie ou, se representar uma empresa, a marca oficial antes de ficar online.');
      }
      // V12.1.1: fica online NA HORA. Antes o app esperava o GPS (até ~20s sem nenhum retorno na tela)
      // e o profissional achava que o botão não funcionava. Agora só checa rápido se a permissão foi
      // negada; a posição é buscada em segundo plano depois de ficar online.
      let permNegada = false;
      try {
        if (global.navigator && global.navigator.permissions && global.navigator.permissions.query) {
          const st = await Promise.race([
            global.navigator.permissions.query({ name: 'geolocation' }),
            new Promise(function (r) { setTimeout(function () { r(null); }, 1500); })
          ]);
          permNegada = !!(st && st.state === 'denied');
        }
      } catch (_) {}
      if (permNegada) {
        throw new Error('A localização está bloqueada para o QuemFaz. Abra Configurações > Apps > QuemFaz > Permissões > Localização e escolha "Permitir".');
      }
      onlineSemGps = false;
      setTimeout(function () {
        refreshProfessionalLocation(true).then(function (loc) {
          if (!loc && lastGeoErrorCode === 2 && global.PU) global.PU.toast('Você está online. Ligue a Localização (GPS) do celular para ver a distância até cada chamado.', null, 5000);
        }).catch(function (err) { console.warn('QuemFaz localização', err); });
      }, 300);
    }
    const upd = { online: !!online, atualizado_em: new Date().toISOString() };
    if (!automatico) upd.offline_manual = !online; // V11.9: tocou em "ficar offline" → o online automático respeita
    const res = await client.from('qf_profissionais').update(upd).eq('user_id', uRes.data.user.id);
    if (res.error) throw res.error;
    const p = DB.profissionalById(uRes.data.user.id);
    if (p) { p.online = !!online; if (!automatico) p.offlineManual = !online; }
    DB.persist();
    if (online) await syncProfessionalCalls(uRes.data.user.id);
    return p;
  }

  async function saveProfessionalSettings(categorias, areas, categoriasPersonalizadas) {
    const uRes = await client.auth.getUser();
    if (uRes.error || !uRes.data.user) throw new Error('Sessão expirada.');
    const uid = uRes.data.user.id;
    await ensureCustomCategories(categoriasPersonalizadas || [], uid);
    const cleanAreas = (areas || []).map(function (a) {
      return {
        cidade: String(a.cidade || '').trim(),
        uf: String(a.uf || '').trim().toUpperCase(),
        raioKm: Math.max(1, Math.min(300, Number(a.raioKm || 10)))
      };
    }).filter(function (a) { return a.cidade && a.uf; });
    if (!cleanAreas.length) throw new Error('Adicione pelo menos uma cidade de atendimento.');

    const pr = await client.from('qf_profissionais').update({
      especialidades: Array.isArray(categorias) ? categorias : [],
      raio_km: cleanAreas[0].raioKm,
      atualizado_em: new Date().toISOString()
    }).eq('user_id', uid);
    if (pr.error) throw pr.error;

    const del = await client.from('qf_profissional_cidades').delete().eq('profissional_id', uid);
    if (del.error) throw del.error;
    const ins = await client.from('qf_profissional_cidades').insert(cleanAreas.map(function (a) {
      return { profissional_id: uid, cidade: a.cidade, uf: a.uf, raio_km: a.raioKm };
    }));
    if (ins.error) throw ins.error;

    const first = cleanAreas[0];
    const prof = await client.from('qf_profiles').update({
      cidade: first.cidade,
      uf: first.uf,
      atualizado_em: new Date().toISOString()
    }).eq('id', uid);
    if (prof.error) throw prof.error;

    const local = await syncLocalUser(uRes.data.user, 'profissional');
    if (local.online) await syncProfessionalCalls(uid);
    return local;
  }

  function bindPrazoField(form) {

    }

  const CAT_GROUPS = [['casa','Casa e reforma'],['limpeza','Limpeza e cuidados da casa'],['instalacoes','Elétrica, hidráulica e gás'],['tecnica','Assistência técnica'],['auto','Automotivo'],['transporte','Transporte e mudanças'],['beleza','Beleza e bem-estar'],['pets','Pets'],['aulas','Aulas e eventos'],['outros','Outros']];
  function catNorm(v) { return String(v || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase(); }
  function customCatFromName(v) {
    const nome = String(v || '').replace(/\s+/g, ' ').trim().slice(0, 80);
    if (nome.length < 2) return null;
    const key = catNorm(nome).replace(/\s+/g, ' ').trim();
    let hash = 2166136261;
    for (let i = 0; i < key.length; i++) { hash ^= key.charCodeAt(i); hash = Math.imul(hash, 16777619); }
    const slug = key.replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '').slice(0, 38) || 'servico';
    return { id: 'cat_custom_' + slug + '_' + (hash >>> 0).toString(36), nome: nome, icon: 'briefcase', leadTier: 'padrao', grupo: 'Outros', grupoId: 'outros', custom: true };
  }
  function rememberCustomCat(cat) {
    if (!cat) return null;
    let found = DB.categories().find(function (c) { return c.id === cat.id || (c.id !== 'cat_outros' && catNorm(c.nome).trim() === catNorm(cat.nome).trim()); });
    if (found) {
      if (String(found.id || '').indexOf('cat_custom_') === 0) {
        found.nome = cat.nome; found.icon = 'briefcase'; found.leadTier = 'padrao'; found.grupo = 'Outros'; found.grupoId = 'outros'; found.custom = true;
        DB.persist();
      }
      return found;
    }
    DB.state.categories.push(cat);
    DB.persist();
    return cat;
  }

      '<label class="qf-catpick__search">' + icon('search') + '<input class="input" type="search" placeholder="Buscar profissão na lista" autocomplete="off" enterkeyhint="search" data-catpick-search aria-label="Buscar profissão"></label>' +
      '<div class="qf-catpick__summary" data-catpick-summary aria-live="polite"></div>' +
      groups + '<div class="qf-catpick__empty" data-catpick-empty hidden><div class="qf-catpick__empty-title">Profissão não encontrada na lista.</div><div class="qf-catpick__empty-text">Toque em “Adicionar profissão” acima para incluir a sua.</div></div></div>';
