      buttons.forEach(function (b) { b.classList.toggle('is-active', b.getAttribute('data-qf-exec')===mode); });
      let d = new Date();
      if (mode==='today') {
        hidden.value = d.toISOString();
        customWrap.hidden = true;
      } else if (mode==='tomorrow') {
        d.setDate(d.getDate()+1); d.setHours(9,0,0,0);
        hidden.value = d.toISOString(); customWrap.hidden = true;
      } else {
        d.setDate(d.getDate()+(mode==='week'?3:2)); d.setHours(9,0,0,0);
        if (!custom.value) custom.value = localInputValue(d);
        customWrap.hidden = false;
        const x = new Date(custom.value);
        hidden.value = isNaN(x.getTime()) ? '' : x.toISOString();
      }
    }
    buttons.forEach(function (b) { b.addEventListener('click', function () { set(b.getAttribute('data-qf-exec')); }); });
    custom.addEventListener('change', function () {
      const d = new Date(custom.value);
      hidden.value = isNaN(d.getTime()) ? '' : d.toISOString();
    });
    set('today');
  }

  function bindPortfolio(content) {
    const root = content.querySelector('#chamados-disponiveis');
    if (!root) return;
    const period = root.querySelector('[data-qf-portfolio-period]');
    const search = root.querySelector('[data-qf-portfolio-search]');
    const cards = Array.prototype.slice.call(root.querySelectorAll('[data-qf-portfolio-card]'));
    function apply() {
      const q = String(search && search.value || '').trim().toLowerCase();
      const p = period ? period.value : 'all';
      const now = new Date();
      const tomorrow = new Date(now); tomorrow.setDate(now.getDate()+1);
      const limit7 = new Date(now); limit7.setDate(now.getDate()+7);
      cards.forEach(function (card) {
        const txt = (card.textContent || '').toLowerCase();
        const raw = card.getAttribute('data-qf-execucao') || '';
        const d = raw ? new Date(raw) : null;
        // V11.29: "sem pressa" não entra em Hoje; pedido com o dia já vencido continua aparecendo em Hoje e em 7 dias.
        const semPressa = card.hasAttribute('data-qf-sem-pressa');
        const vencido = !!d && d < now && !sameDay(d,now);
        let dateOk = true;
        if (p==='today') dateOk = d ? (sameDay(d,now) || vencido) : !semPressa;
        else if (p==='tomorrow') dateOk = !!d && sameDay(d,tomorrow);
        else if (p==='7d') dateOk = !d || vencido || (d>=now && d<=limit7) || sameDay(d,now);
        card.style.display = ((!q || txt.indexOf(q)!==-1) && dateOk) ? '' : 'none';
      });
    }
    if (period) period.addEventListener('change',apply);
    if (search) search.addEventListener('input',apply);
  }

  // V11.28: até 3 profissionais podem desbloquear o pedido; o cliente vê um cartão para cada um.
  function renderConversationCards(rows, req) {
    if (!rows.length) return clienteVagasHtml(0, req) + '<div class="card text--sm text--secondary" style="margin-top:10px;">Seu pedido está no portfólio aguardando um profissional desbloquear.</div>';
    const escolhido = rows.filter(function (r) { return !!r.selecionado; })[0] || null;
    const n = rows.length;
    function cartao(r) {
      const ver = !!r.profissional_verificado;
      const photo = global.QFUI.personAvatar({nome:r.profissional_nome, fotoUrl:r.profissional_foto_url}, 'avatar--sm' + (ver ? ' qf-avatar--ver' : ''));
      const last = r.ultima_mensagem ? '<div class="text--sm text--secondary" style="margin-top:6px;">' + esc(r.ultima_mensagem) + '</div>' : '<div class="text--sm text--secondary" style="margin-top:6px;">O chat está liberado para vocês combinarem o serviço.</div>';
      return '<div class="card qf-conversation-card' + (ver ? ' qf-ver-card' : '') + '">' + (ver && global.QFSeloVer ? global.QFSeloVer() : '') +
        '<div class="row-between"><div class="row">' + photo + '<div><div class="text--strong">' + esc(r.profissional_nome || 'Profissional') + '</div>' + (r.plano_livre_ativo === true ? '<span class="badge badge--navy">Quem Faz Livre</span>' : '') +
        '<div class="text--sm text--secondary">' + (r.profissional_cidade ? esc(r.profissional_cidade + (r.profissional_uf ? '/' + r.profissional_uf : '')) : 'Profissional do QuemFaz') + '</div></div></div>' +
        (r.nao_lidas ? '<span class="badge badge--orange">' + Number(r.nao_lidas) + ' nova</span>' : '') + '</div>' +
        last +
        (r.tem_proposta ? '<div class="text--sm" style="color:var(--orange-700);margin-top:6px;font-weight:700;">Proposta disponível (opcional)</div>' : '') +
        '<div class="btn-row" style="margin-top:10px;"><button class="btn btn--outline" data-nav="/cliente/chat/' + esc(req.id) + '/' + esc(r.profissional_id) + '">' + icon('message') + ' Conversar</button>' +
        (escolhido ? '' : '<button class="btn btn--primary" type="button" data-qf-choose-prof="' + esc(r.profissional_id) + '" data-qf-prof-name="' + esc(r.profissional_nome || 'profissional') + '">Fechei com este</button>') +
        '</div>' +
      '</div>';
    }
    return (escolhido ? '' : clienteVagasHtml(n, req) + '<div style="height:10px;"></div>') + '<div class="card qf-client-decision">' +
        '<div class="text--strong">' + (escolhido ? 'Serviço confirmado' : (n === 1 ? 'Um profissional desbloqueou seu pedido' : n + ' profissionais desbloquearam seu pedido')) + '</div>' +
        '<div class="text--sm text--secondary" style="margin-top:4px;">' + (escolhido ? 'Você escolheu este profissional. Continue combinando os detalhes pelo chat.' : 'Até ' + orcMax(req) + ' profissionais podem desbloquear seu pedido e chamar você no WhatsApp. Converse, compare e toque em “Fechei com este” no profissional que você escolher.') + '</div>' +
      '</div>' +
      '<div class="section-head" style="margin-top:14px;"><h2 class="h3">' + (escolhido || n === 1 ? 'Profissional em conversa' : 'Profissionais em conversa') + '</h2>' + (escolhido ? '<span class="badge badge--success">Escolhido</span>' : '<span class="badge badge--orange">' + n + ' de 3</span>') + '</div>' +
      (escolhido ? [escolhido] : rows).map(cartao).join('');
  }

  function orcMax(req) { return global.QFMaxOrc ? global.QFMaxOrc(req) : 3; }
  // V11.71: "Você pediu até N orçamentos" com uma barrinha por vaga, que vai enchendo.
  function clienteVagasHtml(n, req) {
    const max = orcMax(req), oc = Math.max(0, Math.min(max, n));
    let barras = '';
    for (let i = 0; i < max; i++) barras += '<i' + (i < oc ? ' class="is-on"' : '') + '></i>';
    const faltam = max - oc;
    return '<div class="card qf-cli-vagas" data-qf-cli-vagas="' + oc + '/' + max + '">' +
      '<div class="text--strong">Você pediu ' + (max === 1 ? '1 orçamento' : 'até ' + max + ' orçamentos') + '</div>' +
      '<div class="qf-cli-vagas__barras" aria-hidden="true">' + barras + '</div>' +
      '<div class="text--sm text--secondary"><strong style="color:var(--navy-900);">' + oc + ' de ' + max + '</strong> ' + (oc === 1 ? 'profissional já pegou seu pedido' : 'profissionais já pegaram seu pedido') +
      (faltam > 0 ? ' · ' + (faltam === 1 ? 'falta 1 vaga' : 'faltam ' + faltam + ' vagas') : ' · vagas preenchidas') + '</div></div>';
  }
  const conversationCache = new Map();
  async function fillClientConversations(content, params) {
    const slot = content.querySelector('[data-qf-client-conversations]');
    const req = DB.requestById(params.id);
    if (!slot || !req || !Cloud || !Cloud.clientConversations) return;
    const key = req.clienteId + ':' + req.id;
    function paint(rows) {
      const html = renderConversationCards(rows, DB.requestById(params.id) || req);
      if (slot.qfMarkup !== html) { slot.innerHTML = html; slot.qfMarkup = html; }
    }
    if (conversationCache.has(key)) paint(conversationCache.get(key));
    if (slot.qfLoading) return;
    slot.qfLoading = true;
    try {
      const rows = await Cloud.clientConversations(req.id);
      if (!document.body.contains(slot)) return;
      conversationCache.set(key, rows);
      paint(rows);
    } catch (e) {
      if (!conversationCache.has(key) && !slot.innerHTML) slot.innerHTML = '<div class="card text--sm text--secondary">Não foi possível carregar as conversas agora.</div>';
    } finally { slot.qfLoading = false; }
  }

  function openAddressSheet(req, profId, profName) {

    PU.openSheet(

        '<div><h3 class="sheet__title">Fechar serviço com ' + esc(profName || 'este profissional') + '</h3><p class="text text--secondary text--sm">Agora informe o endereço exato. Ele só será liberado para o profissional escolhido.</p></div>' +
        '<div class="row" style="gap:8px;"><input class="input" name="cep" inputmode="numeric" maxlength="9" placeholder="CEP" value="' + esc(end.cep || '') + '"><button class="btn btn--outline" type="button" data-lookup-cep>Localizar</button></div>' +
        '<input class="input" name="rua" required placeholder="Rua / Avenida" value="' + esc(end.rua || '') + '">' +
        '<div class="qf-address-grid"><input class="input" name="numero" required placeholder="Número"><input class="input" name="complemento" placeholder="Compl."></div>' +
        '<input class="input" name="bairro" required placeholder="Bairro" value="' + esc(end.bairro || '') + '">' +
        '<div class="qf-address-grid"><input class="input" name="cidade" required placeholder="Cidade" value="' + esc(end.cidade || '') + '"><select class="select" name="uf" required><option value="">UF</option>' + (global.QFGeo ? global.QFGeo.ufOptions(end.uf || '') : '') + '</select></div>' +
        '<input type="hidden" name="latitude" value="' + esc(end.latitude == null ? '' : end.latitude) + '"><input type="hidden" name="longitude" value="' + esc(end.longitude == null ? '' : end.longitude) + '">' +
        '<button class="btn btn--primary" type="submit">Confirmar profissional e liberar endereço</button>' +
      '</form>'
    );
    const form = document.getElementById('qf-confirm-address-form');
    if (global.QFGeo && global.QFGeo.bindAddressForm) global.QFGeo.bindAddressForm(form, { buscarAoCompletar:true });
    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      const fd = new FormData(form);

          cep:String(fd.get('cep')||''), rua:String(fd.get('rua')||''), numero:String(fd.get('numero')||''),
          complemento:String(fd.get('complemento')||''), bairro:String(fd.get('bairro')||''),
          cidade:String(fd.get('cidade')||''), uf:String(fd.get('uf')||''),
          latitude:String(fd.get('latitude')||''), longitude:String(fd.get('longitude')||'')
        };
        await Cloud.confirmProfessional(req.id, profId, address);
        PU.closeSheet();
        PU.toast('Serviço confirmado. Endereço e contato liberados para o profissional.', 'success');
        global.navigate('/cliente/pedido/' + req.id, true);
      } catch (err) {
        PU.toast('Não foi possível confirmar. ' + ((err && err.message) || ''), 'danger');
        btn.disabled = false; btn.textContent = 'Confirmar profissional e liberar endereço';
      }
    });
  }

  function bindClientDetailFeature(content, params) {
    const req = DB.requestById(params.id);
    if (!req) return;
    fillClientConversations(content, params);
    const conversationTimer = setInterval(function () {
      if (!document.body.contains(content)) { clearInterval(conversationTimer); return; }
      if (!document.hidden) fillClientConversations(content, params);
    }, 5000);
    content.addEventListener('click', function (e) {
      const cont = e.target.closest('[data-qf-continue-search]');
      if (!cont) return;
      e.preventDefault();
      PU.confirmDialog({
        title:'Continuar procurando?',
        message:'Este profissional sai da reserva e seu pedido volta ao portfólio para outros profissionais.',
        okLabel:'Voltar ao portfólio'
      }).then(async function(ok){
        if(!ok) return;
        cont.disabled=true;
        try{
          await Cloud.continueSearching(req.id);

      const q = list.find(function (x) { return String(x.id)===String(quoteId); }) || req.orcamento;
      if (!q || !q.profissionalId) { PU.toast('Profissional não encontrado.', 'danger'); return; }
      const p = DB.profissionalById(q.profissionalId);

  function renderChatRows(rows,userId) {
    if (!rows.length) return '<div class="text--sm text--secondary" style="text-align:center;padding:24px 8px;">A conversa começa aqui.</div>';
    return rows.map(function (r) {
      if (r.tipo==='sistema') return '<div class="qf-chat-bubble is-system">' + esc(r.mensagem) + '</div>';
      const mine = String(r.remetente_id)===String(userId);
      return '<div class="qf-chat-bubble' + (mine?' is-me':'') + '"><div>' + esc(r.mensagem).replace(/\n/g,'<br>') + '</div><small>' + new Date(r.criado_em).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}) + '</small></div>';
    }).join('');
  }

  // V11.16.33: chat ao vivo — só redesenha quando muda e toca quando chega mensagem do outro.
  function chatRowsKey(rows) { return rows.length + ':' + (rows.length ? rows[rows.length - 1].id : ''); }
  function chatIncoming(seen, rows, userId) {
    let n = 0;
    rows.forEach(function (r) {
      const id = String(r.id);
      if (seen.has(id)) return;
      seen.add(id);
      if (String(r.remetente_id) !== String(userId)) n++;
    });
    return n;
  }
  global.QFChatLive = { rowsKey: chatRowsKey, incoming: chatIncoming };

  function bindChat(content, params, user, role) {
    const root = content.querySelector('[data-qf-chat-root]');
    if (!root || !Cloud || !Cloud.chatConversation) return;
    const list = root.querySelector('[data-qf-chat-list]');
    const form = root.querySelector('[data-qf-chat-form]');
    const input = root.querySelector('[data-qf-chat-input]');
    const profId = role==='profissional' ? user.id : params.profId;
    const req = DB.requestById(params.id);
    let loading = false, again = false, ready = false, titled = false, lastKey = null, closed = false;
    const seen = new Set();

    // A caixa de digitar fica presa embaixo: a última mensagem tem que parar logo acima dela.
    function nearEnd() {
      try {
        const last = list.lastElementChild;
        return !last || last.getBoundingClientRect().bottom <= form.getBoundingClientRect().top + 140;
      } catch (_) { return true; }
    }
    function scrollToEnd() {
      try {
        const last = list.lastElementChild;
        if (!last) return;
        last.style.scrollMarginBottom = (form.offsetHeight + 12) + 'px';
        last.scrollIntoView({ block:'end' });
      } catch (_) {}
    }
    function chime() {
      try { PU.playNotificationSound(false); } catch (_) {}
      try { if (navigator.vibrate) navigator.vibrate(70); } catch (_) {}
    }

    if (role === 'profissional') {
      let justUnlocked = false;
      try {
        justUnlocked = sessionStorage.getItem('qf_chat_unlocked_notice') === String(params.id);
        if (justUnlocked) sessionStorage.removeItem('qf_chat_unlocked_notice');
      } catch (_) {}
      if (justUnlocked) {
        setTimeout(function () {
          const waCard = root.querySelector('[data-qf-wa-card]');
          if (waCard) {
            PU.toast('Chamado desbloqueado. Toque no botão verde para chamar o cliente no WhatsApp.', 'success', 6000);
            try { waCard.scrollIntoView({ behavior:'smooth', block:'center' }); } catch (_) {}
            return;
          }
          PU.toast('Chat liberado para negociação. Envie sua primeira mensagem ao cliente.', 'success', 5000);
          if (input) {
            try { input.scrollIntoView({ behavior:'smooth', block:'center' }); } catch (_) {}
            try { input.focus({ preventScroll:true }); } catch (_) { try { input.focus(); } catch (_) {} }
          }
        }, 350);
      }
    }

    async function load(first) {
      if (closed || !document.body.contains(root)) return;
      if (loading) { again = true; return; }
      loading = true;
      try {
        const rows = await Cloud.chatConversation(params.id, role==='profissional' ? null : profId);
        if (closed) return;
        const key = chatRowsKey(rows);
        if (key !== lastKey) {
          const stick = !ready || nearEnd();
          const incoming = chatIncoming(seen, rows, user.id);
          list.innerHTML = renderChatRows(rows,user.id);
          lastKey = key;
          if (stick || !incoming) scrollToEnd();
          if (ready && incoming && !document.hidden) chime();
        }
        ready = true;
        if (first && role==='profissional' && !rows.length && input && !input.value) {
          const cli = req ? DB.clienteById(req.clienteId) : null;
          input.value = 'Olá' + (cli && cli.nome ? ', ' + firstName(cli.nome) : '') + '! Sou ' + (user.nome || 'profissional') + ', profissional pelo QuemFaz. Vi seu pedido e estou disponível. Podemos conversar por aqui para combinar valor, horário e os detalhes do serviço.';
        }
        if (role==='cliente' && !titled) {
          try {
            const rowsP = await Cloud.clientConversations(params.id);
            const p = rowsP.find(function (x) { return String(x.profissional_id)===String(profId); });
            const title = root.querySelector('[data-qf-chat-title]');
            if (title && p) { title.textContent = 'Conversa com ' + (p.profissional_nome || 'profissional'); titled = true; }
          } catch (_) {}
        }
      } catch (err) {
        // Falha passageira não apaga a conversa que já está na tela.
        if (!ready) list.innerHTML = '<div class="text--sm text--secondary" style="text-align:center;padding:20px;">Não foi possível carregar a conversa.</div>';
      } finally {
        loading = false;
        if (again) { again = false; load(false); }
      }
    }

    // Canal ao vivo: quem envia dá um sinal e o outro lado atualiza na hora (a conferência a cada 2 s fica de reserva).
    let channel = null;
    try {
      if (Cloud.client && Cloud.client.channel) {
        channel = Cloud.client.channel('qf-chat-' + params.id + '-' + profId, { config: { broadcast: { self: false } } });
        channel.on('broadcast', { event: 'msg' }, function () { load(false); }).subscribe();
      }
    } catch (_) { channel = null; }
    function signal() {
      try {
        if (!channel) return;
        const q = channel.send({ type:'broadcast', event:'msg', payload:{} });
        if (q && q.catch) q.catch(function () {});
      } catch (_) {}
    }
    function leave() {
      if (Cloud.chatLeave) Cloud.chatLeave(params.id, profId);
    }
    function onVisibility() {
      if (document.hidden) leave(); else load(false);
    }
    function onRefresh() { load(false); }
    document.addEventListener('visibilitychange', onVisibility);
    global.addEventListener('qf-chat-refresh', onRefresh);
    function close() {
      if (closed) return;
      closed = true;
      clearInterval(timer);
      document.removeEventListener('visibilitychange', onVisibility);
      global.removeEventListener('qf-chat-refresh', onRefresh);
      try { if (channel && Cloud.client.removeChannel) Cloud.client.removeChannel(channel); } catch (_) {}
      leave();
    }

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      const msg = String(input.value || '').trim();
      if (!msg) return;
      const btn = form.querySelector('button[type="submit"]');
      btn.disabled = true;
      try {
        await Cloud.sendChatMessage(params.id, role==='profissional' ? null : profId, msg);
        input.value = '';
        signal();
        await load(false);
        scrollToEnd();
      } catch (err) {
        PU.toast('Não foi possível enviar. ' + ((err && err.message) || ''), 'danger');
      } finally { btn.disabled = false; }
    });
    const timer = setInterval(function () {
      if (!document.body.contains(root)) { close(); return; }
      if (!document.hidden) load(false);
    },2000);
    load(true);
  }

  async function fillProfCompetition(content, params) {
    const el = content.querySelector('[data-qf-prof-competition]');
    if (!el || !Cloud || !Cloud.participantCount) return;
    try {
      const d = await Cloud.participantCount(params.id);
      if (!d.ok) return;
      const n = Number(d.participantes || 0);
      const lim = Number(d.limite || 3) || 3;
      if (n >= 2) el.textContent = n + ' de ' + lim + ' profissionais desbloquearam este pedido. O cliente fecha com quem preferir: chame logo no WhatsApp.';
      else if (n === 1) el.textContent = 'Só você desbloqueou este pedido até agora. Até ' + lim + ' profissionais podem desbloquear.';
    } catch (_) {}
  }

  // Pedidos abrem no aparelho onde foram publicados, sem pedir código.
  const prevAfter = Screens.afterRender;
  Screens.refreshDetail = function (pattern, content, params) {
    if (pattern === '/cliente/pedido/:id') { fillClientConversations(content, params); }
    if (pattern === '/profissional/pedido/:id') fillProfCompetition(content, params);
  };
  Screens.afterRender = function (pattern,content,params,user) {
    if (prevAfter) prevAfter(pattern,content,params,user);
    if (pattern==='/cliente/novo-pedido/:catId') bindSchedule(content);
    if (pattern==='/profissional/home' || pattern==='/profissional/servicos/disponiveis') bindPortfolio(content);
    if (pattern==='/cliente/pedido/:id') bindClientDetailFeature(content,params);
    if (pattern==='/profissional/pedido/:id') fillProfCompetition(content,params);
    if ((pattern==='/profissional/pedido/:id' || pattern==='/profissional/chat/:id') && global.QFValor) { try { global.QFValor.carregarConfig().then(function () { global.QFValor.montarBaixa(content, params.id); }); } catch (_) {} }
    if (pattern==='/profissional/chat/:id') bindChat(content,params,user,'profissional');
    if (pattern==='/cliente/chat/:id/:profId') bindChat(content,params,user,'cliente');
    if (pattern==='/profissional/home') fillPedidosPerdidos(content);
  };

  // V12.2: profissional usando pelo navegador Android vê os pedidos que perdeu nas últimas 24h
  // (chegaram para ele e outro profissional pegou) e o convite para instalar o app da Play Store.
  const QF_PERDIDOS_DIA = 'qf_perdidos_ocultar_dia';
  function tempoAtras(iso) {
    const t = Date.parse(iso || '');
    if (!Number.isFinite(t)) return '';

    { pattern: '/profissional/pedido/:id', role: 'profissional', title: 'Detalhes do serviço', back: '/profissional/servicos', render: Screens.profPedidoDetalheRender },
    { pattern: '/profissional/chat/:id', role: 'profissional', title: 'Conversa com cliente', back: '/profissional/servicos', render: Screens.profChatRender },
    { pattern: '/profissional/orcamento/:id', role: 'profissional', title: 'Enviar proposta', back: '/profissional/servicos', render: Screens.profOrcamentoFormRender },
    { pattern: '/profissional/carteira', role: 'profissional', tab: 'carteira', title: 'Carteira', render: Screens.profCarteiraRender },
    { pattern: '/profissional/planos', role: 'profissional', tab: 'planos', title: 'Planos', render: Screens.profPlanosRender },
    { pattern: '/profissional/configuracoes', role: 'profissional', tab: 'config', title: 'Configurações', render: Screens.profConfigRender },
    { pattern: '/profissional/como-funciona', role: 'profissional', title: 'Como funciona e planos', back: '/profissional/planos', render: Screens.comoFuncionaRender },
    { pattern: '/profissional/anuncie', role: 'profissional', title: 'Anuncie no QuemFaz', back: '/profissional/home', render: Screens.anuncieRender },
    { pattern: '/profissional/perfil', role: 'profissional', tab: 'perfil', title: 'Perfil profissional', render: Screens.profPerfilRender },
    { pattern: '/profissional/avaliacoes', role: 'profissional', title: 'Avaliações', back: '/profissional/perfil', render: Screens.profAvaliacoesRender },

  ];

  function compilePattern(pattern) {
    const keys = [];
    const re = new RegExp('^' + pattern.replace(/:[^/]+/g, function (m) { keys.push(m.slice(1)); return '([^/]+)'; }) + '$');
    return { re: re, keys: keys };
  }
  routes.forEach(function (r) { const c = compilePattern(r.pattern); r._re = c.re; r._keys = c.keys; });

  function matchRoute(path) {
    for (let i = 0; i < routes.length; i++) {
      const r = routes[i];
      const m = r._re.exec(path);
      if (m) {
        const params = {};
        r._keys.forEach(function (k, idx) { params[k] = decodeURIComponent(m[idx + 1]); });
        return { route: r, params: params };
      }
    }
    return null;
  }

  function currentPath() {
    let h = location.hash || '#/';
    h = h.slice(1);
    if (!h) h = '/';
    return h;
  }

  let routeRevision = 0;
  let readySessionKey = '';
  function sessionKey(session) { return session ? session.role + ':' + session.userId : ''; }

  async function route() {
    const revision = ++routeRevision;
    const path = currentPath();
    const stale = function () { return revision !== routeRevision || path !== currentPath(); };
    // Antigos links de login do cliente voltam para o pedido gratuito.
    if (path === '/auth/cliente/login') { navigate('/', true); return; }
    const found = matchRoute(path);
    if (found && found.route.publicPage) { renderAnon(found); return; }
    if (found && found.route.anon && global.QFCloud && !currentSession()) {
      renderAnon(found);
      if (global.QFCloud.refreshPublicAds) global.QFCloud.refreshPublicAds();
      return;
    }
    // Navegação usa a conta já validada nesta abertura. A rede atualiza depois,
    // sem deixar o clique esperando dados, push e avisos em sequência.
    const cachedSession = currentSession();
    const cachedUser = currentUser();
    const immediate = !!(found && !found.route.anon && cachedSession && cachedUser &&
      !cachedUser.bloqueado && found.route.role === cachedSession.role &&
      readySessionKey === sessionKey(cachedSession));
    if (immediate) {
      renderApp(found, cachedUser, cachedSession);
      await new Promise(function (resolve) { setTimeout(resolve, 0); });
      if (stale()) return;
    }
    if (global.QFCloud && global.QFCloud.enabled) {
      try {
        await global.QFConnection.deadline(global.QFCloud.syncForCurrentSession(false), 15000, 'dados da conta');
      } catch (err) {
        if (stale()) return;
        console.error('QuemFaz sync error', err);
        if (!immediate) renderConnectionError();
        return;
      }
    }
    if (stale()) return;
    if (global.QFPush) {
      try { await global.QFConnection.deadline(global.QFPush.refreshStatus(), 3000, 'permissão de notificações'); } catch (_) {}
    }
    if (stale()) return;
    const session = currentSession();
    if (session && session.role === 'profissional') {
      try { await global.QFConnection.deadline(syncPersistentProfessionalNotices(session, false), 5000, 'avisos'); }
      catch (err) { console.warn('QuemFaz avisos persistentes', err); }
    }

    if (stale()) return;
    if (session && global.QFCloud && global.QFCloud.enabled && global.QFCloud.pendingFlow) {
      try {
        const pending = await global.QFConnection.deadline(global.QFCloud.pendingFlow(), 5000, 'serviço pendente');
        if (stale()) return;
        if (pending && pending.pending && pending.chamado_id) {
          const target = session.role === 'profissional'
            ? '/profissional/pedido/' + pending.chamado_id
            : '/cliente/pedido/' + pending.chamado_id;
          if (path !== target) {
            let warned = false;
            try { warned = sessionStorage.getItem('qf_fluxo_obrigatorio_' + pending.chamado_id) === '1'; } catch (_) {}
            if (!warned) {
              PU.toast(session.role === 'profissional'
                ? 'Finalize e avalie o serviço pendente para continuar usando o app.'
                : 'Finalize e avalie o serviço pendente para continuar usando o app.', 'danger');
              try { sessionStorage.setItem('qf_fluxo_obrigatorio_' + pending.chamado_id, '1'); } catch (_) {}
            }
            navigate(target, true);
            return;
          }
        }
      } catch (err) {
        console.warn('QuemFaz fluxo obrigatório', err);
      }
    }

    if (stale()) return;
    if (immediate && sessionKey(currentSession()) !== sessionKey(cachedSession)) { navigate('/', true); return; }
    if (!found) { navigate('/', true); return; }

    if (found.route.anon) {
      if (session && session.role === 'admin') {
        DB.logout();
        renderAnon(found);
        return;
      }
      if (session) {
        // Profissional que abriu o convite já autenticado: ativar antes de mostrar planos.
        if (session.role === 'profissional' && path === '/auth/profissional/cadastro'
          && global.QFConvite24h && global.QFConvite24h.token()) {
          try {
            const token = global.QFConvite24h.token();
            const res = await global.QFCloud.client.rpc('qf_convite_24h_resgatar',{p_token:token});
            if (res.error || !res.data || !res.data.ok) {
              PU.toast('Não foi possível ativar o convite nesta conta. Confira se é o e-mail convidado.', 'danger', 8000);
            } else {
              global.QFConvite24h.limpar();
              PU.toast('Convite de 24 horas ativado! Acesse suas oportunidades.', 'success', 7000);
            }
          } catch (_) {
            PU.toast('Falha ao conferir convite. Reabra o link quando a conexão voltar.', 'danger');
          }
        }
        navigate('/' + session.role + '/home', true);
        return;
      }
      renderAnon(found);
      return;
    }

    if (!session || session.role !== found.route.role) {
      // V11.9: link direto do chamado (WhatsApp/push) sem sessão: entra e volta direto para o chamado.
      if (!session && found.route.role === 'profissional' && /^\/profissional\/chamada\//.test(path)) {
        try { sessionStorage.setItem('qf_pos_login', path); } catch (_) {}
        navigate('/auth/profissional/login', true);
        return;
      }
      navigate('/', true);
      return;
    }
    const user = currentUser();
    if (!user) { DB.logout(); navigate('/', true); return; }
    if (user.bloqueado) {
      PU.toast('Seu acesso foi bloqueado pelo administrador.', 'danger');
      DB.logout();
      navigate('/', true);
      return;
    }
    readySessionKey = sessionKey(session);
    if (!immediate) { renderApp(found, user, session); return; }
    // Não apaga campos, conversas ou janelas abertas enquanto a rede termina.
    // Abas de consulta recebem dados novos somente quando o conteúdo mudou.
    if (!found.route.tab || userIsEditing() || document.querySelector('#app-content form')) return;
    const content = document.getElementById('app-content');
    if (content && content.qfPath === path && content.qfRenderedHtml !== found.route.render(found.params, user)) {
      const y = window.scrollY;
      renderApp(found, user, session, { background: true });
      window.scrollTo(0, y);
    }
  }

  // V10.6: identifica a tela no #app-shell para o layout de computador/tablet.
  function routeKey(pattern) {
    return String(pattern || '/').replace(/:[^/]+/g, '').replace(/[^a-z0-9]+/gi, '-').replace(/^-+|-+$/g, '') || 'inicio';
  }

  function renderAnon(found) {
    const shell = document.getElementById('app-shell');
    shell.setAttribute('data-route', routeKey(found.route.pattern));
    shell.setAttribute('data-role', 'anon');
    const isLanding = found.route.pattern === '/';
    if (global.QFEarly) global.QFEarly.capture();
    const reuseHome = isLanding && shell.getAttribute('data-qf-prerender') === 'home' && !!shell.querySelector('[data-landing-service-form]');
    shell.removeAttribute('data-qf-prerender');
    if (!reuseHome) shell.innerHTML = '<div id="app-content"></div>' + (!isLanding && global.QFSupport ? global.QFSupport.buttonHtml() : '');
    const content = document.getElementById('app-content');
    content.style.paddingBottom = isLanding ? '0' : 'calc(env(safe-area-inset-bottom, 0px) + 96px)';
    if (!reuseHome) content.innerHTML = found.route.render(found.params);
    bindGlobalDelegation(content);
    if (Screens.afterRenderAnon) Screens.afterRenderAnon(found.route.pattern, content, found.params);
    if (global.QFEarly) global.QFEarly.restore(content);
    if (global.QFApp) { global.QFApp.fillInstallSlots(content); global.QFApp.afterRender(); }
    window.scrollTo(0, 0);
  }

  // V11.16.7 — atualização em segundo plano sem remontar a tela inteira.
  // O servidor pode renovar timestamps a cada sincronização. Esses campos não mudam
  // o que o usuário está vendo e não podem provocar um novo DOM a cada 4 segundos.
  function detailRefreshSignature(found) {
    if (!found || !found.params || !found.params.id) return '';
    const req = DB.requestById(found.params.id);
    if (!req) return '';
    function quoteSig(q) {
      if (!q) return null;
      return [
        q.id || '', q.profissionalId || q.profissional_id || '', q.status || '',
        Number(q.maoDeObra || q.mao_de_obra || 0), Number(q.material || 0),
        Number(q.taxaVisita || q.taxa_visita || 0), Number(q.total || 0),
        q.mensagem || q.observacao || ''
      ];
    }
    const quotes = Array.isArray(req.orcamentos) ? req.orcamentos.map(quoteSig) : (req.orcamento ? [quoteSig(req.orcamento)] : []);
    const end = req.endereco || {};
    const pay = req.pagamentoPrioridade || {};
    const avCli = req.avaliacaoCliente || {};
    const avPro = req.avaliacaoProfissional || {};
    return JSON.stringify([
      req.id || '', req.status || '', req.categoriaId || '', req.profissionalId || '',
      !!req.prioridade, req.urgencia || '', req.dataPreferida || '', req.prazo || '', req.prazoDia || '', req.periodo || '', req.descricao || '',
      Number(req.distanciaKm || 0), Number(req.valorDesbloqueio || req.leadValor || 0),
      end.cep || '', end.rua || '', end.numero || '', end.bairro || '', end.cidade || '', end.uf || '',
      pay.id || '', pay.status || '', Number(pay.valor || 0), pay.checkoutUrl || '',
      req.motivoCancelamento || '',
      avCli.nota || '', avCli.comentario || '', avPro.nota || '', avPro.comentario || '',
      quotes
    ]);
  }

  function renderApp(found, user, session, options) {
    const previous = document.getElementById('app-content');
    const detail = found.route.pattern === '/cliente/pedido/:id' || found.route.pattern === '/profissional/pedido/:id';
    const keepDetail = options && options.background && detail && previous && previous.qfPath === currentPath() && previous.qfUserId === user.id;
    const detailSig = detail ? detailRefreshSignature(found) : '';

    // Enquanto o pedido continua no mesmo estado visual, atualiza somente os blocos
    // dinâmicos (chat/concorrência). Mantém o DOM principal intacto e elimina o pisca-pisca.
    if (keepDetail && previous.qfDetailSig === detailSig) {
      if (Screens.refreshDetail) Screens.refreshDetail(found.route.pattern, previous, found.params);
      return;
    }

    const html = keepDetail ? found.route.render(found.params, user) : null;
    if (keepDetail && previous.qfRenderedHtml === html) {
      previous.qfDetailSig = detailSig;
      if (Screens.refreshDetail) Screens.refreshDetail(found.route.pattern, previous, found.params);
      return;
    }
    if (keepDetail) {
      const y = window.scrollY;
      const content = previous.cloneNode(false);
      content.innerHTML = html;
      content.qfRenderedHtml = html;
      content.qfDetailSig = detailSig;
      content.qfPath = currentPath();
      content.qfUserId = user.id;
      const view = content.querySelector('.view');
      if (view) view.style.animation = 'none';
      previous.replaceWith(content);
      bindGlobalDelegation(content);
      if (Screens.afterRender) Screens.afterRender(found.route.pattern, content, found.params, user);
      if (global.QFApp) { global.QFApp.fillInstallSlots(content); global.QFApp.afterRender(); }
      window.scrollTo(0, y);
      return;
    }
    if (found.route.tab === 'avisos') markNoticesRead(session);
    const shell = document.getElementById('app-shell');
    const tabs = TABS[session.role] || [];
    const showTabbar = !!found.route.tab || tabs.some(function (t) { return t.route === '/' + session.role + currentPath().replace('/' + session.role, ''); });
    const isTabRoute = !!found.route.tab;

    // V12: cabeçalho único (QFUI.appHeader). Telas de aba mostram o logo oficial no topo azul-marinho
    // e o nome da tela logo abaixo, como título da página; telas internas mantêm voltar + título.
    let topbarHtml = '';
    let pageTitleHtml = '';
    const routeTitle = typeof found.route.title === 'function' ? found.route.title(found.params) : found.route.title;
    if (found.route.back) {
      topbarHtml = QFUI.appHeader({ back: found.route.back, title: routeTitle });
    } else if (isTabRoute) {
      topbarHtml = QFUI.appHeader({
        title: routeTitle,
        actionsHtml: (global.QFApp && global.QFApp.topInstallHtml ? global.QFApp.topInstallHtml() : '') + topbarBellHtml(session, found.route.tab),
      });
      if (routeTitle && routeTitle !== 'QuemFaz') pageTitleHtml = QFUI.pageTitle(routeTitle);
    }

    // V11.1: profissional online sem notificações ativas só recebe chamados com o app aberto — avisa no topo.
    let pushBannerHtml = '';
    if (session.role === 'profissional' && user && global.QFPush && global.QFPush.permission() !== 'checking' && !global.QFPush.isActive()) {
      // V11.61: aviso forte (vermelho) — sem notificação o celular não toca quando chega pedido.
      pushBannerHtml = '<div class="qf-push-banner qf-push-banner--forte" role="alert"><div class="qf-push-banner__txt"><strong>Ative os avisos de novos pedidos</strong><span>Ative as notificações deste aparelho. Para receber pedidos compatíveis, fique online e confira seu horário de atendimento.</span></div>' +
        '<button class="btn btn--primary" type="button" data-action="ativar-notificacoes-faixa">' + icon('bell') + ' Ativar notificações agora</button></div>';
    }

    if (global.QFApp && global.QFApp.apkStripHtml) pushBannerHtml += global.QFApp.apkStripHtml(session.role);
    // V11.5.0: cliente sem notificação ativa vê a faixa em toda abertura do app (o X esconde só até fechar o app).
    let clientNotifHtml = '';
    if (session.role === 'cliente' && global.QFPush && global.QFPush.needsPermission()) {
      let hidden = false;
      try { hidden = sessionStorage.getItem('qf_cli_notif_x') === '1'; } catch (_) {}
      if (!hidden) clientNotifHtml = '<div class="qf-cli-notif" role="status">' + icon('bell') + '<span class="qf-cli-notif__txt">Ative as notificações para saber na hora quando um profissional responder</span>' +
        '<button class="qf-cli-notif__btn" type="button" data-action="cli-notif-ativar">Ativar</button>' +
        '<button class="qf-cli-notif__x" type="button" data-action="cli-notif-fechar" aria-label="Fechar aviso">' + icon('x') + '</button></div>';
    }

    shell.setAttribute('data-route', routeKey(found.route.pattern));
    shell.setAttribute('data-role', session.role);
    shell.innerHTML =
      '<a href="#app-content" class="skip-link">Pular para conteúdo</a>' +
      pushBannerHtml +
      topbarHtml +
      clientNotifHtml +
      pageTitleHtml +
      '<main id="app-content" role="main"></main>' +
      renderTabbar(tabs, found.route.tab);

    const pushBannerBtn = shell.querySelector('[data-action="ativar-notificacoes-faixa"]');
    if (pushBannerBtn) pushBannerBtn.addEventListener('click', async function () {
      pushBannerBtn.disabled = true;
      try {
        const activated = await global.QFPush.activate();
        if (!activated) { pushBannerBtn.disabled = false; return; }
        PU.toast('Notificações ativadas. Você receberá novos chamados mesmo com o app fechado.', 'success');
        navigate(currentPath(), true);
      } catch (err) {
        PU.toast((err && err.message) || 'Não foi possível ativar as notificações.', 'danger');
        pushBannerBtn.disabled = false;
      }
    });

    const content = document.getElementById('app-content');
    const renderedHtml = found.route.render(found.params, user);
    content.innerHTML = renderedHtml;
    content.qfRenderedHtml = renderedHtml;
    content.qfDetailSig = detail ? detailSig : '';
    content.qfPath = currentPath();
    content.qfUserId = user.id;
    bindGlobalDelegation(content);
    // V12: se a própria tela já abre com o mesmo título, não repete o título da página.
    if (pageTitleHtml) {
      const first = content.querySelector('h1, h2, .h1, .h2, .h3');
      const norm = function (t) { return String(t || '').replace(/\s+/g, ' ').trim().toLowerCase(); };
      if (first && norm(first.textContent) === norm(routeTitle)) { const pt = shell.querySelector('.qf-ui-page-title'); if (pt) pt.remove(); }
    }
    if (Screens.afterRender) Screens.afterRender(found.route.pattern, content, found.params, user);
    if (global.QFApp) { global.QFApp.fillInstallSlots(content); global.QFApp.afterRender(); }
    window.scrollTo(0, 0);
  }

  // V11.13: sininho de Avisos no topo (celular) para o profissional.
  function topbarBellHtml(session, activeTab) {
    if (!session || session.role !== 'profissional') return '';
    const count = unreadNotices(session);
    return '<button class="qf-topbar-bell' + (activeTab === 'avisos' ? ' is-active' : '') + '" type="button" data-nav="/profissional/avisos" aria-label="Avisos' + (count ? ' (' + count + ' não lidos)' : '') + '">' + icon('bell') +
      (count ? '<span class="qf-topbar-bell__badge">' + (count > 9 ? '9+' : count) + '</span>' : '') + '</button>';
  }

  function renderTabbar(tabs, activeId) {
    if (!tabs.length) return '';
    return '<nav class="tabbar" aria-label="Navegação principal">' +
      '<button class="tabbar__brand" data-nav="' + tabs[0].route + '" aria-label="QuemFaz — início">' + QF_BRAND_MARK + '</button>' +
      tabs.map(function (t) {
        return QFUI.bottomNavItem(t, t.id === activeId, t.id === 'avisos' ? unreadNotices(currentSession()) : 0);
      }).join('') +
      (global.QFApp && global.QFApp.topInstallHtml ? '<span class="qf-tabbar-dl">' + global.QFApp.topInstallHtml() + '</span>' : '') +
      '</nav>';
  }

  // ---------------- Delegação global de eventos ----------------

  function bindGlobalDelegation(root) {
    root.addEventListener('click', function (e) {
      const navEl = e.target.closest('[data-nav]');
      if (navEl) { e.preventDefault(); navigate(navEl.getAttribute('data-nav')); return; }
    });
  }

  function notifSteps() {
    const P = global.QFPush;
    const nativo = !!(P && P.isNative && P.isNative()) || !!(global.QFApp && global.QFApp.isNativeApp && global.QFApp.isNativeApp());
    const ios = /iphone|ipad|ipod/i.test(navigator.userAgent || '');
    let passos;
    if (P && !P.supported()) {
      passos = ios
        ? '1. Abra o QuemFaz no <strong>Safari</strong>.<br>2. Toque em <strong>Compartilhar</strong> &gt; <strong>Adicionar à Tela de Início</strong>.<br>3. Abra pelo ícone e toque em <strong>Ativar</strong>.'
        : 'Este navegador não recebe notificações. Toque no botão de baixar no topo da tela, instale o QuemFaz e entre com sua conta.';
    } else if (nativo) {
      passos = '1. Abra <strong>Configurações</strong> do celular.<br>2. Toque em <strong>Apps</strong> &gt; <strong>QuemFaz</strong> &gt; <strong>Notificações</strong>.<br>3. Ligue <strong>Permitir notificações</strong> e volte ao QuemFaz.';
    } else {
      passos = '1. Toque no <strong>cadeado</strong> (ou nos ajustes) ao lado do endereço do site.<br>2. Toque em <strong>Permissões</strong> &gt; <strong>Notificações</strong>.<br>3. Escolha <strong>Permitir</strong> e volte ao QuemFaz.';
    }
    PU.openSheet('<div class="stack"><div class="icon-tile icon-tile--lg icon-tile--orange" style="margin:0 auto;">' + icon('bell') + '</div>' +
      '<h3 class="sheet__title" style="text-align:center;">' + (P && !P.supported() ? 'Receba avisos no celular' : 'Libere as notificações') + '</h3>' +
      '<p class="text text--secondary">' + passos + '</p><button class="btn btn--primary" id="qf-notif-steps-ok">Entendi</button></div>');
    const ok = document.getElementById('qf-notif-steps-ok');
    if (ok) ok.onclick = function () { PU.closeSheet(); };
  }
  document.addEventListener('click', async function (e) {
    const cliNotifX = e.target.closest && e.target.closest('[data-action="cli-notif-fechar"]');
    if (cliNotifX) { e.preventDefault(); try { sessionStorage.setItem('qf_cli_notif_x', '1'); } catch (_) {} const bar = cliNotifX.closest('.qf-cli-notif'); if (bar) bar.remove(); return; }
    const cliNotifOn = e.target.closest && e.target.closest('[data-action="cli-notif-ativar"]');
    if (cliNotifOn) {
      e.preventDefault();
      const P = global.QFPush;
      if (!P || !P.supported() || P.permission() === 'denied') { notifSteps(); return; }
      cliNotifOn.disabled = true;
      try {
        await P.activate();
        PU.toast('Notificações ativadas! Você será avisado quando um profissional responder.', 'success');
        navigate(currentPath(), true);
      } catch (err) {
        if (P.permission() === 'denied') notifSteps();
        else PU.toast((err && err.message) || 'Não foi possível ativar as notificações.', 'danger');
        cliNotifOn.disabled = false;
      }
      return;
    }
    const dismiss=e.target.closest&&e.target.closest('[data-dismiss-pendencia]');
    if(dismiss){e.preventDefault();const tipo=dismiss.getAttribute('data-dismiss-pendencia');try{localStorage.setItem('qf_dismiss_'+tipo,String(Date.now()));}catch(_){}const bar=dismiss.closest('.qf-pendencia');if(bar)bar.remove();return;}
    const deleteNotice = e.target.closest('[data-delete-notice]');
    if (deleteNotice) {
      e.preventDefault();
      e.stopPropagation();
      const session = currentSession();
      const id = deleteNotice.getAttribute('data-delete-notice');
      const serverId = deleteNotice.getAttribute('data-server-notice-id');
      if (serverId && global.QFCloud && global.QFCloud.deleteProfessionalNotice) {
        try { await global.QFCloud.deleteProfessionalNotice(serverId); }
        catch (err) { PU.toast('Não foi possível excluir este aviso do servidor.', 'danger'); return; }
      }
      const items = loadNotices(session).filter(function (n) { return n.id !== id; });
      saveNotices(session, items);
      PU.toast('Aviso excluído.', 'success');
      navigate('/' + session.role + '/avisos', true);
      return;
    }
    const clearNotices = e.target.closest('[data-clear-notices]');
    if (clearNotices) {
      e.preventDefault();
      const session = currentSession();
      PU.confirmDialog({ title: 'Excluir todos os avisos', message: 'Deseja limpar todos os avisos desta conta?', okLabel: 'Excluir todos', danger: true }).then(async function (ok) {
        if (!ok) return;
        if (session.role === 'profissional' && global.QFCloud && global.QFCloud.clearProfessionalNotices) {
          try { await global.QFCloud.clearProfessionalNotices(); }
          catch (err) { PU.toast('Não foi possível excluir todos os avisos do servidor.', 'danger'); return; }
        }
        saveNotices(session, []);
        PU.toast('Avisos excluídos.', 'success');
        navigate('/' + session.role + '/avisos', true);
      });
      return;
    }
    const navEl = e.target.closest('[data-nav]');
    if (navEl && navEl.closest('.tabbar, .topbar')) { e.preventDefault(); navigate(navEl.getAttribute('data-nav')); }
    const logoutEl = e.target.closest('[data-logout]');
    if (logoutEl) {
      e.preventDefault();
      const u = currentUser();
      const quickClient = !!(u && currentSession() && currentSession().role === 'cliente' && !u.email);
      const msg = quickClient
        ? 'Deseja sair deste cliente? Como este acesso foi criado só com nome e WhatsApp, ao sair você não terá uma senha para voltar a este mesmo acesso.'
        : 'Deseja realmente sair?';
      PU.confirmDialog({ title: 'Sair da conta', message: msg, okLabel: 'Sair' }).then(async function (ok) {
        if (!ok) return;
        if (global.QFCloud && global.QFCloud.enabled) await global.QFCloud.signOut();
        else DB.logout();
        navigate('/', true);
      });
    }
  });

  window.addEventListener('hashchange', route);
  // V11.4: sombra na barra de cima quando a página rola; nome completo no cartão de categoria (title)
  (function () {
    let on = false;
    function upd() { const s = (window.scrollY || 0) > 4; if (s !== on) { on = s; document.documentElement.classList.toggle('qf-scrolled', s); } }
    window.addEventListener('scroll', upd, { passive: true });
    upd();
  })();
  function titleCategoryTiles(root) {
    Array.prototype.forEach.call((root || document).querySelectorAll('.category-tile'), function (t) {
      if (t.title) return;
      const l = t.querySelector('.category-tile__label');
      if (l) t.title = l.textContent.trim();
    });
  }
  // V11.4.1: a barra de cima fica FIXA (position: fixed). O sticky rolava junto no Chrome do Android.
  // Celular: .qf-landing-topbar (início) ou .topbar (telas logadas). Computador: .qf-landing-topbar ou a
  // barra de navegação (.tabbar), que no desktop fica em cima. O #app-shell ganha um espaço do tamanho exato da barra.
  let fixedBar = null, barRaf = 0, lastBarKey = '';
  const barRO = typeof ResizeObserver !== 'undefined' ? new ResizeObserver(function () { scheduleBarSync(); }) : null;
  function pickTopBar(shell) {
    const desk = window.innerWidth >= 768;
    const list = [shell.querySelector('.qf-request-header'), shell.querySelector('.qf-landing-topbar'), desk ? shell.querySelector('.tabbar') : shell.querySelector('.topbar')];
    for (let i = 0; i < list.length; i++) {
      const el = list[i];
      if (el && getComputedStyle(el).display !== 'none') return el;
    }
    return null;
  }
  function syncFixedBar() {
    barRaf = 0;
    const shell = document.getElementById('app-shell');
    if (!shell) return;
    const bar = pickTopBar(shell);
    if (fixedBar && fixedBar !== bar) {
      fixedBar.classList.remove('qf-fixed-bar');
      fixedBar.style.left = fixedBar.style.width = '';
      if (barRO) barRO.unobserve(fixedBar);
    }
    fixedBar = bar;
    const content = document.getElementById('app-content');
    if (!bar) {
      shell.style.paddingTop = '';
      if (content) content.style.removeProperty('padding-top');
      document.documentElement.style.setProperty('--qf-bar-h', '0px');
      return;
    }
    if (!bar.classList.contains('qf-fixed-bar')) { bar.classList.add('qf-fixed-bar'); if (barRO) barRO.observe(bar); }
    // alinha a barra com a largura do app (moldura do celular ou coluna do computador)
    const landingDesk = bar.classList.contains('qf-landing-topbar') && window.innerWidth >= 900 && content;
    let left, width;
    if (landingDesk) {
      const cs = getComputedStyle(content), r = content.getBoundingClientRect();
      left = r.left + parseFloat(cs.paddingLeft); width = r.width - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    } else if (bar.classList.contains('tabbar')) {
      left = 0; width = document.documentElement.clientWidth;
    } else {
      const r = shell.getBoundingClientRect(); left = r.left; width = r.width;
    }
    bar.style.left = Math.round(left) + 'px';
    bar.style.width = Math.round(width) + 'px';
    const hgt = Math.round(bar.getBoundingClientRect().height);
    shell.style.paddingTop = hgt + 'px';
    if (landingDesk) content.style.setProperty('padding-top', '0px', 'important'); else if (content) content.style.removeProperty('padding-top');
    document.documentElement.style.setProperty('--qf-bar-h', hgt + 'px');
    lastBarKey = hgt + ':' + left + ':' + width;
  }
  function scheduleBarSync() {
    if (barRaf) return;
    barRaf = requestAnimationFrame(syncFixedBar);
    // rAF fica pausado com a aba escondida; garante a sincronização mesmo assim
    setTimeout(function () { if (barRaf) { cancelAnimationFrame(barRaf); syncFixedBar(); } }, 120);
  }
  window.addEventListener('resize', scheduleBarSync);
  new MutationObserver(function () { titleCategoryTiles(document.getElementById('app-shell')); if (barRaf) { cancelAnimationFrame(barRaf); } syncFixedBar(); })
    .observe(document.documentElement, { childList: true, subtree: true });

  let liveCallsBusy = false;
  let pendingRefresh = false;
  let lastQuickSig = '';
  let lastFullLiveSyncAt = 0;
  let lastLiveSyncPath = '';
  // Economiza tráfego: a conversa tem sua própria atualização rápida; não refazer a conta inteira a cada 4s.
  const QF_LIVE_POLL_MS = 10000;
  const QF_CLIENT_FULL_MS = 20000;
  const QF_PRO_FULL_MS = 90000;
  const QF_WALLET_FULL_MS = 30000;
  // V10.2: não re-renderiza a tela enquanto o usuário digita ou com uma janela aberta
  // (antes, um chamado novo apagava o orçamento/formulário que estava sendo preenchido).
  function userIsEditing() {
    const overlay = document.getElementById('sheet-overlay');
    if (overlay && !overlay.classList.contains('is-hidden')) return true;
    const a = document.activeElement;
    if (a && a.closest && a.closest('#app-content') && (a.tagName === 'TEXTAREA' || a.tagName === 'SELECT' || (a.tagName === 'INPUT' && !/^(checkbox|radio|range|file|button|submit|hidden)$/i.test(a.type)))) return true;
    const forms = document.querySelectorAll('#app-content form');
    for (let i = 0; i < forms.length; i++) { if (forms[i].dataset.dirty === '1') return true; }
    return false;
  }
  document.addEventListener('input', function (e) {
    const t = e.target;
    if (!t || !t.closest || /^(checkbox|radio|range)$/i.test(t.type || '')) return;
    const f = t.closest('#app-content form');
    if (f) f.dataset.dirty = '1';
  }, true);
  function requestStateSignature() {
    // V11.16.9: não usa timestamps na assinatura visual.
    // O servidor pode atualizar "atualizadoEm" sem mudar nada que o cliente vê;
    // comparar esse campo fazia todas as telas do cliente serem remontadas a cada sincronização.
    return JSON.stringify((DB.state.requests || []).map(function (r) {
      return [
        r.id,
        r.status,
        r.profissionalId || null,
        r.orcamento && r.orcamento.id,
        r.orcamento && r.orcamento.status,
        r.participantes, r.limiteParticipantes, !!r.foraRaio, r.distanciaKm
      ];
    }));
  }
  setInterval(async function () {
    if (liveCallsBusy || document.hidden) return;
    if (!(global.QFCloud && global.QFCloud.enabled)) return;
    const session = currentSession();
    if (!session) return;
    const path = currentPath();
    const shouldRefresh = path.indexOf('/' + session.role + '/') === 0;
    if (!shouldRefresh) return;
    // Cliente mantém resposta rápida; evita carregar novamente todo o cadastro sem necessidade.
    if (session.role === 'cliente' && path === lastLiveSyncPath &&
        Date.now() - lastFullLiveSyncAt < QF_CLIENT_FULL_MS && !pendingRefresh) return;

    liveCallsBusy = true;
    const beforeMap = requestStateMap();
    const before = requestStateSignature();
    const y = window.scrollY;
    try {
      // Profissional: busca leve a cada 10s. Busca completa só se mudou algo,
      // se entrou em outra tela ou após 90s (30s na Carteira para confirmar Pix).
      if (session.role === 'profissional' && global.QFCloud.professionalQuickSignature) {
        const quick = await global.QFCloud.professionalQuickSignature();
        const quickKey = session.userId + '#' + quick;
        const fullInterval = /^\/profissional\/carteira(?:$|\/)/.test(path) ? QF_WALLET_FULL_MS : QF_PRO_FULL_MS;
        const due = path !== lastLiveSyncPath || Date.now() - lastFullLiveSyncAt >= fullInterval;
        if (quickKey === lastQuickSig && !due && !pendingRefresh) return;
        lastQuickSig = quickKey;
      }
      lastLiveSyncPath = path;
      lastFullLiveSyncAt = Date.now();
      await global.QFCloud.syncForCurrentSession(true);
      let serverNoticesChanged = false;
      if (session.role === 'profissional') {
        try { serverNoticesChanged = await syncPersistentProfessionalNotices(session, true); }
        catch (err) { console.warn('QuemFaz avisos persistentes', err); }
      }
      const afterMap = requestStateMap();
      const after = requestStateSignature();
      if (before !== after) detectNotices(session, beforeMap, afterMap);
      if (currentPath() !== path) { pendingRefresh = false; return; }
      if (before === after && !pendingRefresh && !serverNoticesChanged) return;
      if (userIsEditing()) { pendingRefresh = true; return; }
      pendingRefresh = false;
      const found = matchRoute(path);
      const freshSession = currentSession();
      const freshUser = currentUser();
      if (found && freshSession && freshUser) {
        renderApp(found, freshUser, freshSession, { background: true });
        requestAnimationFrame(function () { window.scrollTo(0, y); });
      }
    } catch (err) {
      console.warn('QuemFaz atualização em tempo real', err);
    } finally {
      liveCallsBusy = false;
    }
  }, QF_LIVE_POLL_MS);
  // Ao voltar ao aplicativo, atualiza a próxima vez sem precisar aguardar 90s.
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) { lastFullLiveSyncAt = 0; lastLiveSyncPath = ''; }
  });

  // Atualiza a tela após os anúncios chegarem sem apagar um formulário em edição.
  global.addEventListener('qf-push-state', function () {
    const P = global.QFPush;
    if (!P) return;
    if (!P.needsPermission()) {
      document.querySelectorAll('.qf-cli-notif,.qf-no-notif-strip,[data-pendencia="notificacoes"]').forEach(function (el) { el.remove(); });
    }
    if (P.isActive()) document.querySelectorAll('.qf-push-banner').forEach(function (el) { el.remove(); });
    const session = currentSession();
    if (session) document.querySelectorAll('.notify-required,.notify-reconnect,.notify-ok').forEach(function (el) {
      const html = P.card(session.role);
      if (el.outerHTML !== html) el.outerHTML = html;
    });
  });

  // V11.16.30: "Ver mais movimentações" na Carteira — libera mais 20 linhas por clique.
  document.addEventListener('click', function (ev) {
    const btn = ev.target && ev.target.closest ? ev.target.closest('[data-tx-more]') : null;
    if (!btn) return;
    const list = btn.previousElementSibling;
    if (!list || !list.classList.contains('qf-tx-list')) return;
    const total = list.children.length;
    const show = Math.min(total, (Number(list.getAttribute('data-show')) || 5) + 20);
    list.setAttribute('data-show', String(show));
    Array.prototype.forEach.call(list.children, function (row, i) { row.style.display = i < show ? '' : 'none'; });
    if (show >= total) btn.remove(); else btn.textContent = 'Ver mais movimentações (' + (total - show) + ')';
  });

  global.addEventListener('qf-ads-updated', function () {
    const content = document.getElementById('app-content');
    const path = currentPath();
    if (!content || userIsEditing()) return;
    if (path !== '/auth/cliente/cadastro' && path !== '/cliente/home') return;
    const found = matchRoute(path), session = currentSession(), user = currentUser();
    const y = window.scrollY;
    if (found && found.route.anon && !session) renderAnon(found);
    else if (found && session && user) renderApp(found, user, session);
    window.scrollTo(0, y);
  });

  // V11.9.1: modo demonstração (dados locais de exemplo) só em ambiente local, nunca no site publicado.
  function isDemoMode() { try { return ['localhost', '127.0.0.1', '[::1]'].indexOf(location.hostname) !== -1 && new URLSearchParams(location.search).get('demo') === '1'; } catch (_) { return false; } }
  function renderConnectionError() {
    const shell = document.getElementById('app-shell');
    shell.innerHTML = '<div class="qf-conn-error"><img src="./icon.svg" alt="QuemFaz" style="width:72px;height:72px;border-radius:18px;">' +
      '<h1 class="h2">Sem conexão com o QuemFaz</h1><p class="text text--secondary" style="max-width:340px;">A conexão demorou e seus dados não puderam ser carregados. Tente novamente em instantes.</p>' +
      '<button class="btn btn--primary" style="max-width:320px;" id="qf-retry">' + icon('refresh') + ' Tentar novamente</button></div>';
    document.getElementById('qf-retry').onclick = function () { location.reload(); };
  }

  window.addEventListener('DOMContentLoaded', async function () {
    DB.load();
    if (global.QFClientAcquisition) global.QFClientAcquisition.applyDestination();
    if (global.QFApp) global.QFApp.registerSW();
    if (!(global.QFCloud && global.QFCloud.enabled) && !isDemoMode()) {
      // V10.2: sem a biblioteca do Supabase o app NÃO cai mais em dados de demonstração.
      renderConnectionError();
      global.addEventListener('online', function () { location.reload(); }, { once: true });
      return;
    }
    if (global.QFCloud && global.QFCloud.enabled) global.QFCloud.prepareLocalState();
    await route();
    if (global.QFEarly) global.QFEarly.finish();
    try {
      const mustChange = !!(global.QFCloud && global.QFCloud.enabled && global.QFCloud.needsForcedPasswordChange && await global.QFCloud.needsForcedPasswordChange());
      if (mustChange && global.QFPasswordRecovery && global.QFPasswordRecovery.openForcedPassword) {
        try { sessionStorage.setItem('qf_force_password_change', '1'); } catch (_) {}
        global.QFPasswordRecovery.openForcedPassword();
      } else if (sessionStorage.getItem('qf_password_recovery') === '1' && global.QFPasswordRecovery) {
        global.QFPasswordRecovery.openNewPassword();
      }
    } catch (_) {}
    if (global.QFApp) global.QFApp.checkVersion(true).catch(function () {});
    if (global.QFPush) global.QFPush.restore().catch(function () {});
  });

  async function refreshNow() {
    if (!(global.QFCloud && global.QFCloud.enabled) || liveCallsBusy) return;
    const session = currentSession();
    if (!session) return;
    liveCallsBusy = true;
    const path = currentPath();
    const beforeMap = requestStateMap();
    const before = requestStateSignature();
    try {
      await global.QFCloud.syncForCurrentSession(true);
      const after = requestStateSignature();
      if (before !== after) detectNotices(session, beforeMap, requestStateMap());
      if (before !== after && currentPath() === path && !userIsEditing()) {
        const found = matchRoute(path); const u = currentUser(); const s2 = currentSession();
        if (found && u && s2 && found.route.role) renderApp(found, u, s2, { background: true });
      }
    } catch (err) { console.warn('QuemFaz atualização', err); }
    finally { liveCallsBusy = false; }
  }
  document.addEventListener('visibilitychange', function () { if (!document.hidden) refreshNow(); });

  global.PROAKI_APP = { navigate, currentSession, currentUser, route, TABS, refreshNow, userIsEditing };
})(window);

/* QuemFaz V11.17.0 — aviso geral na tela: comunicado que o admin publica e aparece uma vez para cada pessoa. */
(function (global) {
  const SEEN_KEY = 'qf_aviso_geral_visto';
  let lastCheck = 0, busy = false, retry = null;
  function client() { return global.QFCloud && global.QFCloud.enabled ? global.QFCloud.client : null; }
  // V11.18.0: "já vi" vale por pessoa (aparelho compartilhado) e o "Entendi" de quem está logado é registrado no servidor.
  function uid() { try { const se = global.PROAKI_APP && global.PROAKI_APP.currentSession(); return se && se.userId ? String(se.userId) : ''; } catch (_) { return ''; } }
  function seenKey(id) { return String(id) + ':' + (uid() || 'visitante'); }
  function seen() { try { return localStorage.getItem(SEEN_KEY) || ''; } catch (_) { return ''; } }
  function markSeen(id) { try { localStorage.setItem(SEEN_KEY, seenKey(id)); } catch (_) {} }
  function markRead(id) {
    const c = client();
    if (!c || !uid()) return;
    try { Promise.resolve(c.rpc('qf_aviso_geral_marcar_lido', { p_id: id })).catch(function () {}); } catch (_) {}
  }
  function esc(v) { return String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
  // Não cobre chamada tocando, conversa aberta nem formulário que a pessoa está preenchendo.
  function busyScreen() {
    const path = String(location.hash || '').replace(/^#/, '').split('?')[0];
    if (/\/(chamada|chat)\//.test(path)) return true;
    if (document.querySelector('.qf-call-overlay')) return true;
    try { if (global.PROAKI_APP && global.PROAKI_APP.userIsEditing()) return true; } catch (_) {}
    return false;
  }
  function close() { const el = document.getElementById('qf-aviso-overlay'); if (el) el.remove(); }
  function show(aviso) {
    if (!aviso || !aviso.id || document.getElementById('qf-aviso-overlay')) return;
    const el = document.createElement('div');
    el.id = 'qf-aviso-overlay';
    el.className = 'qf-aviso-overlay';
    el.setAttribute('role', 'dialog');
    el.setAttribute('aria-modal', 'true');
    el.setAttribute('aria-labelledby', 'qf-aviso-title');
    el.innerHTML = '<div class="qf-aviso"><div class="qf-aviso__head"><div class="qf-aviso__tag">Aviso do QuemFaz</div><h2 class="qf-aviso__title" id="qf-aviso-title">' + esc(aviso.titulo) + '</h2></div>' +
      '<div class="qf-aviso__body">' + esc(aviso.mensagem) + '</div>' +
      '<div class="qf-aviso__foot"><button type="button" class="btn btn--primary" data-aviso-ok>Entendi</button></div></div>';
    if (/notifica|celular.*tocando/i.test(String(aviso.titulo) + ' ' + String(aviso.mensagem)) && global.QFPush && !global.QFPush.isActive()) {
      const activateButton = document.createElement('button');
      activateButton.type = 'button'; activateButton.className = 'btn btn--primary';
      activateButton.textContent = 'Ativar notificações';
      el.querySelector('[data-aviso-ok]').className = 'btn btn--outline';
      el.querySelector('.qf-aviso__foot').prepend(activateButton);
      activateButton.addEventListener('click', async function () {
        activateButton.disabled = true;
        try {
          const activated = await global.QFPush.activate();
          if (activated) { markSeen(aviso.id); markRead(aviso.id); close(); global.PU.toast('Notificações ativadas neste aparelho.', 'success'); }
        } catch (error) { global.PU.toast(error.message || 'Não foi possível ativar. Tente novamente.', 'danger'); }
        finally { activateButton.disabled = false; }
      });
    }
    el.querySelector('[data-aviso-ok]').addEventListener('click', function () { markSeen(aviso.id); markRead(aviso.id); close(); });
    document.body.appendChild(el);
  }
  async function check(force) {
    const c = client();
    if (!c || busy) return;
    if (!force && Date.now() - lastCheck < 120000) return;
    busy = true; lastCheck = Date.now();
    try {
      const r = await c.rpc('qf_aviso_geral_atual');
      const aviso = r && !r.error && r.data ? r.data.aviso : null;
      if (!aviso || !aviso.id) { close(); return; }
      // Já tocou em "Entendi" neste aparelho, mas o servidor ainda não sabe (estava sem internet): registra agora, sem abrir de novo.
      if (seenKey(aviso.id) === seen()) { markRead(aviso.id); return; }
      if (busyScreen()) { clearTimeout(retry); retry = setTimeout(function () { check(true); }, 20000); return; }
      show(aviso);
    } catch (_) {}
    finally { busy = false; }
  }
  global.addEventListener('DOMContentLoaded', function () { setTimeout(function () { check(true); }, 2500); });
  document.addEventListener('visibilitychange', function () { if (!document.hidden) check(false); });
  global.addEventListener('hashchange', function () { setTimeout(function () { check(false); }, 800); });
  setInterval(function () { if (!document.hidden) check(false); }, 300000);
  global.QFAvisoGeral = { check: check, show: show, close: close };
})(window);

<script id="qf-launch-countdown">
(function(){
  // Data interna da contagem: quatro dias a partir de 08/10/2026, horário de Brasília.
  var deadline = Date.parse('2026-10-12T00:00:00-03:00');
  function tick(){
    var box=document.querySelector('[data-qf-launch-clock]');if(!box)return;
    var remaining=Math.max(0,Math.floor((deadline-Date.now())/1000));
    var vals=[Math.floor(remaining/86400),Math.floor(remaining%86400/3600),Math.floor(remaining%3600/60),remaining%60];
    ['days','hours','minutes','seconds'].forEach(function(k,i){var el=box.querySelector('[data-qf-'+k+']');if(el)el.textContent=String(vals[i]).padStart(2,'0');});
    
  }
  tick();setInterval(tick,1000);
})();
</script>
