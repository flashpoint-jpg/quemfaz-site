    const req = DB.requestById(params.id);
    const disponivel = req && req.status === STATUS.BUSCANDO && !req.profissionalId &&
      user.online && user.statusAprovacao === 'aprovado' && !user.bloqueado &&
      user.categorias.indexOf(req.categoriaId) !== -1 &&
      (req.recusadoPor || []).indexOf(user.id) === -1;
    if (!disponivel) {
      const emNegociacao = req && [STATUS.AGUARDANDO_ORCAMENTO, STATUS.ORCAMENTO_ENVIADO, STATUS.ORCAMENTO_RECUSADO, STATUS.APROVADO, STATUS.EM_ANDAMENTO].indexOf(req.status) !== -1;
      return '<div class="view"><div class="empty-state"><div class="icon-tile icon-tile--ghost">' + icon(emNegociacao ? 'clock' : 'lock') + '</div><h2 class="h3">' + (emNegociacao ? 'Pedido em negociação' : 'Chamado indisponível') + '</h2><p class="text text--secondary">' + (emNegociacao ? 'Outro profissional já assumiu este pedido. Se ele voltar para a busca, o chamado poderá aparecer novamente para profissionais elegíveis.' : 'Esta oportunidade já foi assumida ou não está mais disponível.') + '</p></div></div>';
    }
    const cat = DB.categoryById(req.categoriaId);
    const cidade = DB.cityById(req.cidadeId);
    const valor = DB.leadFeeForRequest(req);
    const primeiraGratis = false;
    return (
      '<div class="view">' +
        '<div class="row-between">' +
          '<div class="row"><div class="icon-tile icon-tile--lg icon-tile--orange">' + icon(cat ? cat.icon : 'tag') + '</div><div><div class="h2">' + PU.escapeHtml(cat ? cat.nome : 'Serviço') + '</div><div class="text--sm text--secondary">Solicitado ' + PU.timeAgo(req.criadoEm) + '</div></div></div>' +
          (req.prioridade ? '<span class="badge badge--orange"><span class="badge__dot"></span>Prioritário</span>' : '') +
        '</div>' +

        '<div class="section card stack--sm">' +
          '<div class="row"><div class="avatar avatar--sm">?</div><div><div class="text--strong">Cliente verificado</div><div class="text--sm text--muted">Identidade protegida até o desbloqueio</div></div></div>' +
          '<hr class="hairline">' +
          '<div class="text--sm text--secondary">' + PU.escapeHtml(req.descricao) + '</div>' +
          (req.fotos && req.fotos.length ? '<div class="upload-row">' + req.fotos.map(renderCallMedia).join('') + '</div>' : '') +
          '<hr class="hairline">' +
          '<div class="row text--sm text--secondary">' + icon('mapPin', 'list-item__chevron') + '<span>' + PU.escapeHtml(req.endereco.bairro || 'Bairro informado') + ' — ' + PU.escapeHtml((cidade || {}).nome || '') + '</span></div>' +
          distanceHighlight(req) +
        '</div>' +

        '<div class="section card stack--sm" style="background:var(--navy-900);border:none;">' +
          '<div class="row-between"><div><div class="text--sm" style="color:var(--text-on-navy-muted);">' + (primeiraGratis ? 'Benefício de boas-vindas' : 'Taxa para desbloquear') + '</div><div class="h1" style="color:#fff;">' + (primeiraGratis ? 'GRÁTIS' : PU.formatCurrency(valor)) + '</div></div><div class="icon-tile icon-tile--orange">' + icon('unlock') + '</div></div>' +
          '<p class="text--sm" style="color:var(--text-on-navy-muted);">' +
            (primeiraGratis
              ? 'Este é o seu primeiro desbloqueio e não usa saldo. Depois dele, para abrir novos chamados, visualizar os dados do cliente e enviar orçamento, você precisará ter saldo na carteira.'
              : 'Ao desbloquear, usamos os créditos da carteira e liberamos nome, telefone/WhatsApp e endereço exato. O chamado fica reservado para você.') +
          '</p>' +
          '<div class="row-between"><span class="text--sm" style="color:var(--text-on-navy-muted);">Seus créditos</span><span class="text--strong" style="color:#fff;">' + PU.formatCurrency(user.creditos || 0) + '</span></div>' +
        '</div>' +

        '<div class="section btn-row">' +
          '<button class="btn btn--outline" data-action="recusar-chamada">Agora não</button>' +
          '<button class="btn btn--primary" data-action="desbloquear-chamada">' + icon('unlock') + ' ' + (primeiraGratis ? 'Desbloquear grátis' : 'Desbloquear ' + PU.formatCurrency(valor)) + '</button>' +
        '</div>' +
      '</div>'
    );
  };

  // ---------------- Meus serviços ----------------

  const ATIVOS_PROF = [STATUS.AGUARDANDO_ORCAMENTO, STATUS.ORCAMENTO_ENVIADO, STATUS.ORCAMENTO_RECUSADO, STATUS.APROVADO, STATUS.EM_ANDAMENTO, STATUS.SERVICO_CONCLUIDO, STATUS.PAGO];
  function profHiddenHistory(userId) {
    try { return JSON.parse(localStorage.getItem('quemfaz_hidden_history_v1_profissional_' + userId) || '[]') || []; } catch (_) { return []; }
  }
  function hideProfHistory(userId, requestId) {
    const ids = profHiddenHistory(userId);
    if (ids.indexOf(requestId) === -1) ids.push(requestId);
    try { localStorage.setItem('quemfaz_hidden_history_v1_profissional_' + userId, JSON.stringify(ids.slice(-250))); } catch (_) {}
  }

  Screens.profServicosRender = function (params, user) {
    const hidden = profHiddenHistory(user.id);
    const all = DB.requestsByProfissional(user.id);
    const ativos = all.filter(function (r) { return ATIVOS_PROF.indexOf(r.status) !== -1; });
    const historico = all.filter(function (r) { return ATIVOS_PROF.indexOf(r.status) === -1 && hidden.indexOf(r.id) === -1; });
    if (!ativos.length && !historico.length) {
      return '<div class="view"><div class="empty-state"><div class="icon-tile icon-tile--lg icon-tile--ghost">' + icon('clipboard') + '</div><h2 class="h3">Nenhum serviço ainda</h2><p class="text text--secondary">Fique online para começar a receber chamados de clientes.</p></div></div>';
    }
    return (
      '<div class="view">' +
        (ativos.length ? '<div class="section"><div class="section-head"><h2 class="h3">Em andamento</h2></div><div class="stack--sm">' + ativos.map(servicoCard).join('') + '</div></div>' : '') +
        (historico.length ? '<div class="section"><div class="section-head"><h2 class="h3">Histórico</h2></div><div class="stack--sm">' + historico.map(function (r) {
          return '<div class="history-entry">' + servicoCard(r) +
            '<button class="history-delete" type="button" data-hide-servico="' + PU.escapeHtml(r.id) + '" aria-label="Excluir serviço do histórico" title="Excluir do histórico">' + icon('xCircle') + '</button></div>';
        }).join('') + '</div></div>' : '') +
      '</div>'
    );
  };

  function servicoCard(req) {
    const cat = DB.categoryById(req.categoriaId);
    const cliente = DB.clienteById(req.clienteId);
    return (
      '<button class="card card--pressable" style="width:100%;text-align:left;" data-nav="/profissional/pedido/' + req.id + '">' +
        '<div class="row-between">' +
          '<div class="row"><div class="icon-tile">' + icon(cat ? cat.icon : 'tag') + '</div>' +
          '<div><div class="h3">' + PU.escapeHtml(cat ? cat.nome : 'Serviço') + '</div><div class="text--sm text--secondary">' + PU.escapeHtml((cliente || {}).nome || '') + '</div></div></div>' +
          icon('chevronRight', 'list-item__chevron') +
        '</div>' +
        '<div class="row-between" style="margin-top:12px;">' + statusBadge(req.status) + '<span class="text--sm text--muted">' + PU.timeAgo(req.criadoEm) + '</span></div>' +
      '</button>'
    );
  }

  Screens.profPedidoDetalheRender = function (params, user) {
    const req = DB.requestById(params.id);
    if (!req || req.profissionalId !== user.id) return '<div class="view"><p class="text">Serviço não encontrado.</p></div>';
    const cat = DB.categoryById(req.categoriaId);
    const cliente = DB.clienteById(req.clienteId);
    return (
      '<div class="view">' +
        '<div class="row-between">' +
          '<div class="row"><div class="icon-tile">' + icon(cat ? cat.icon : 'tag') + '</div><div class="h3">' + PU.escapeHtml(cat ? cat.nome : 'Serviço') + '</div></div>' +
          statusBadge(req.status) +
        '</div>' +

        '<div class="section card stack--sm">' +
          '<div class="row-between"><div class="row"><div class="avatar avatar--sm">' + PU.initials((cliente || {}).nome || '?') + '</div><div><div class="text--strong">' + PU.escapeHtml((cliente || {}).nome || '') + '</div><div class="text--sm text--secondary">Contato liberado</div></div></div><span class="badge badge--success"><span class="badge__dot"></span>Desbloqueado</span></div>' +
          '<div class="row text--sm text--secondary">' + icon('phoneCall', 'list-item__chevron') + ((cliente || {}).telefone ? '<a href="' + telHref(cliente.telefone) + '">' + PU.escapeHtml(cliente.telefone) + '</a>' : '<span>Telefone não informado</span>') + '</div>' +
          ((cliente || {}).telefone ? '<a class="btn btn--whatsapp btn--lg" data-contact="whatsapp" href="' + whatsappHref(cliente.telefone, 'Olá ' + (cliente.nome || '') + ', sou ' + user.nome + ' do QuemFaz. Desbloqueei seu chamado e estou entrando em contato sobre o serviço.') + '" target="_blank" rel="noopener">' + icon('whatsapp') + ' Chamar no WhatsApp</a>' +
            '<a class="btn btn--outline" data-contact="ligar" href="' + telHref(cliente.telefone) + '">' + icon('phoneCall') + ' Ligar para o cliente</a>' : '') +
          '<div class="text--sm text--secondary">' + PU.escapeHtml(req.descricao) + '</div>' +
          (req.fotos && req.fotos.length ? '<div class="upload-row">' + req.fotos.map(renderCallMedia).join('') + '</div>' : '') +
          '<div class="row text--sm text--secondary">' + icon('mapPin', 'list-item__chevron') + '<span>' + PU.escapeHtml(req.endereco.rua) + ', ' + PU.escapeHtml(req.endereco.bairro) + (req.endereco.complemento ? ' · ' + PU.escapeHtml(req.endereco.complemento) : '') + '</span></div>' +
        '</div>' +

        (req.orcamento ? orcamentoResumo(req) : '') +
        acoesPorStatus(req) +
      '</div>'
    );
  };

  function orcamentoResumo(req) {
    const o = req.orcamento;
    return (
      '<div class="section">' +
        '<div class="section-head"><h2 class="h3">Orçamento enviado</h2></div>' +
        '<div class="card stack--sm">' +
          (req.taxaVisita ? rowValor('Taxa de visita', req.taxaVisita) : '') +
          rowValor('Mão de obra', o.maoDeObra) +
          rowValor('Material', o.material) +
          '<hr class="hairline">' +
          rowValor('Total', o.total + (req.taxaVisita || 0), true) +
          (o.status === 'recusado' && o.motivoRecusa ? '<p class="text--sm" style="color:var(--danger-600);margin-top:4px;">Motivo da recusa: ' + PU.escapeHtml(o.motivoRecusa) + '</p>' : '') +
        '</div>' +
      '</div>'
    );
  }
  function rowValor(label, cents, strong) {
    return '<div class="row-between"><span class="text' + (strong ? ' text--strong' : ' text--secondary text--sm') + '">' + label + '</span><span class="text' + (strong ? ' h3' : ' text--sm') + '">' + PU.formatCurrency(cents) + '</span></div>';
  }

  function acoesPorStatus(req) {
    const s = req.status;
    if (s === STATUS.AGUARDANDO_ORCAMENTO) {
      return '<div class="section"><button class="btn btn--primary" data-nav="/profissional/orcamento/' + req.id + '">' + icon('document') + ' Criar orçamento</button></div>';
    }
    if (s === STATUS.ORCAMENTO_ENVIADO) {
      return '<div class="section"><div class="card card--tight" style="background:var(--navy-100);border:none;"><p class="text text--sm" style="color:var(--navy-800);">Aguardando aprovação do cliente.</p></div></div>';
    }
    if (s === STATUS.ORCAMENTO_RECUSADO) {
      return '<div class="section stack--sm">' +
        '<button class="btn btn--primary" data-nav="/profissional/orcamento/' + req.id + '">' + icon('edit') + ' Enviar novo orçamento</button>' +
        '<button class="btn btn--danger-ghost" data-action="cancelar-servico">Cancelar serviço</button>' +
      '</div>';
    }
    if (s === STATUS.APROVADO) {
      return '<div class="section"><button class="btn btn--primary" data-action="iniciar-servico">' + icon('checkCircle') + ' Iniciar serviço</button></div>';
    }
    if (s === STATUS.EM_ANDAMENTO) {
      return '<div class="section"><button class="btn btn--primary" data-action="finalizar-servico">' + icon('check') + ' Concluir serviço</button></div>';
    }
    if (s === STATUS.SERVICO_CONCLUIDO || s === STATUS.PAGO) {
      return (
        '<div class="section"><div class="card card--tight" style="background:var(--success-100);border:none;margin-bottom:12px;"><p class="text text--sm" style="color:var(--success-600);">Serviço marcado como concluído. O pagamento do serviço é combinado diretamente com o cliente.</p></div></div>' +
        '<div class="section">' +
          '<div class="section-head"><h2 class="h3">Avalie o cliente</h2></div>' +
          '<div class="card stack">' +
            '<div class="star-picker" id="prof-star-picker">' + [1, 2, 3, 4, 5].map(function (n) { return '<button type="button" data-star="' + n + '">' + icon('starFilled') + '</button>'; }).join('') + '</div>' +
            '<textarea class="textarea" id="prof-avaliacao-comentario" placeholder="Como foi atender este cliente? (opcional)"></textarea>' +
            '<button class="btn btn--primary" data-action="enviar-avaliacao-cliente">Enviar avaliação</button>' +
          '</div>' +
        '</div>'
      );
    }
    if (s === STATUS.FINALIZADO) {
      return '<div class="section"><div class="card card--tight" style="background:var(--success-100);border:none;"><p class="text text--sm" style="color:var(--success-600);">Serviço concluído e avaliado.</p></div></div>';
    }
    if (s === STATUS.CANCELADO) {
      return '<div class="section"><div class="card card--tight" style="background:var(--danger-100);border:none;"><p class="text text--sm" style="color:var(--danger-600);">' + PU.escapeHtml(req.motivoCancelamento || 'Serviço cancelado.') + '</p></div></div>';
    }
    return '';
  }

  Screens.profOrcamentoFormRender = function (params, user) {
    const req = DB.requestById(params.id);
    if (!req) return '<div class="view"><p class="text">Serviço não encontrado.</p></div>';
    return (
      '<div class="view">' +
        '<form id="orcamento-form" class="stack" novalidate>' +
          '<label class="field"><span class="field__label">Taxa de visita</span><input class="input" name="taxaVisita" inputmode="decimal" value="' + (req.taxaVisita ? (req.taxaVisita / 100).toFixed(2).replace('.', ',') : '') + '" placeholder="R$ 0,00"></label>' +
          '<label class="field"><span class="field__label">Mão de obra</span><input class="input" name="maoDeObra" inputmode="decimal" required placeholder="R$ 0,00" value="' + (req.orcamento ? (req.orcamento.maoDeObra / 100).toFixed(2).replace('.', ',') : '') + '"></label>' +
          '<label class="field"><span class="field__label">Material</span><input class="input" name="material" inputmode="decimal" placeholder="R$ 0,00" value="' + (req.orcamento ? (req.orcamento.material / 100).toFixed(2).replace('.', ',') : '') + '"></label>' +
          '<div class="card row-between" style="background:var(--navy-100);border:none;">' +            '<span class="text--strong" style="color:var(--navy-900);">Total</span>' +
            '<span class="h2" id="orcamento-total" style="color:var(--navy-900);">R$ 0,00</span>' +
          '</div>' +
          '<button class="btn btn--primary" type="submit">' + icon('arrowRight') + ' Enviar orçamento ao cliente</button>' +
        '</form>' +
      '</div>'
    );
  };

                const positive = t.tipo === 'recarga' || t.tipo === 'credito';
                const valueText = bonusTx ? 'GRÁTIS' : (debit ? '−' : (positive ? '+' : '')) + PU.formatCurrency(t.valor || 0);

                const statusText = pending ? ' · aguardando pagamento' : (failed ? ' · ' + t.status : '');
                return '<div class="list-item"><div class="icon-tile icon-tile--ghost">' + icon(debit || bonusTx ? 'unlock' : (t.metodo === 'Cartão' ? 'creditCard' : t.metodo === 'Boleto' ? 'document' : 'money')) + '</div>' +

      '</div>'

            '<label class="btn btn--outline" style="cursor:pointer;">' + icon('camera') + ' Tirar selfie do profissional<input type="file" id="perfil-selfie" accept="image/*" capture="user" style="display:none;"></label>' +
            '<label class="btn btn--outline" style="cursor:pointer;">' + icon('image') + ' Sou empresa: escolher logo/marca<input type="file" id="perfil-empresa-logo" accept="image/*" style="display:none;"></label>' +

            '<div class="spacer"><div class="text--strong">' + (user.avaliacaoMedia ? user.avaliacaoMedia.toFixed(1) : '—') + '</div><div class="text--sm text--secondary">' + (user.totalAvaliacoes || 0) + ' avaliações recebidas</div></div>' +

            '<button class="btn btn--outline" type="button" id="adicionar-area">' + icon('plus') + ' Adicionar outra cidade</button>' +
            '<label class="field"><span class="field__label">Taxa de visita padrão</span><input class="input" id="perfil-taxa" inputmode="decimal" value="' + (user.taxaVisitaPadrao ? (user.taxaVisitaPadrao / 100).toFixed(2).replace('.', ',') : '') + '" placeholder="R$ 0,00"></label>' +
            '<button class="btn btn--primary" id="salvar-atendimento">Salvar cidades e raio</button>' +
          '</div>' +
        '</div>' +

        ((global.QFCloud && global.QFCloud.enabled) ? '' : '<div class="section">' +
          '<div class="section-head"><h2 class="h3">Documentos (simulados)</h2></div>' +
          '<div class="card" style="padding:4px 16px;">' +
            documentoItem('rg', 'RG', docs.rg) +
            documentoItem('cpf', 'CPF', docs.cpf) +
            documentoItem('comprovanteEndereco', 'Comprovante de endereço', docs.comprovanteEndereco) +
          '</div>' +
        '</div>') +

        '<div class="section" data-install-slot style="display:none;"></div>' +
        '<div class="section">' +
          '<button class="btn btn--outline" data-logout>' + icon('logout') + ' Sair da conta</button>' +
        '</div>' +
        '<p class="text--sm text--muted" style="text-align:center;margin-top:14px;">QuemFaz versão ' + (global.QFApp ? global.QFApp.VERSION : '') + '</p>' +
      '</div>'
    );
  };

  function ufOptions(selected) {
    const ufs = ['AC','AL','AP','AM','BA','CE','DF','ES','GO','MA','MT','MS','MG','PA','PB','PR','PE','PI','RJ','RN','RS','RO','RR','SC','SP','SE','TO'];
    return '<option value="">UF</option>' + ufs.map(function (uf) { return '<option value="' + uf + '"' + (uf === selected ? ' selected' : '') + '>' + uf + '</option>'; }).join('');
  }

  function renderServiceAreaRow(area, index) {
    area = area || {};
    const raio = Math.max(1, Math.min(200, Number(area.raioKm || 10)));
    return '<div class="service-area-row card card--tight stack--sm" data-area-row style="background:var(--bg-sunken);border:none;margin-bottom:10px;">' +
      '<div class="row"><div class="text--strong spacer">Região ' + (index + 1) + '</div>' + (index ? '<button class="icon-btn" type="button" data-remove-area aria-label="Remover cidade">' + icon('x') + '</button>' : '') + '</div>' +
      '<label class="field"><span class="field__label">Cidade</span><input class="input" data-area-city required value="' + PU.escapeHtml(area.cidade || '') + '" placeholder="Ex.: Campinas"></label>' +
      '<label class="field"><span class="field__label">Estado</span><select class="select" data-area-uf>' + ufOptions(String(area.uf || '').toUpperCase()) + '</select></label>' +
      '<label class="field"><span class="field__label">Raio: <strong data-area-radius-label>' + raio + '</strong> km</span><input class="input" type="range" min="1" max="200" step="1" value="' + raio + '" data-area-radius></label>' +
    '</div>';
  }

  function renderServiceAreas(areas) {
    return (areas && areas.length ? areas : [{ cidade: '', uf: '', raioKm: 10 }]).map(renderServiceAreaRow).join('');
  }

  function documentoItem(key, label, enviado) {
    return (
      '<div class="list-item">' +
        '<div class="icon-tile icon-tile--ghost">' + icon('id') + '</div>' +
        '<div class="list-item__body"><div class="list-item__title">' + label + '</div><div class="list-item__sub">' + (enviado ? 'Enviado' : 'Pendente de envio') + '</div></div>' +
        (enviado
          ? '<span class="badge badge--success"><span class="badge__dot"></span>OK</span>'
          : '<button class="btn btn--sm btn--outline btn--block-auto" data-doc="' + key + '">Enviar</button>') +
      '</div>'
    );
  }

  Screens.profAvaliacoesRender = function (params, user) {
    const revs = DB.reviewsForProfissional(user.id);
    return (
      '<div class="view">' +
        (revs.length ? '<div class="stack--sm">' + revs.map(function (r) {
          return '<div class="card stack--sm">' + starsDisplay(r.nota) + (r.comentario ? '<p class="text text--sm">' + PU.escapeHtml(r.comentario) + '</p>' : '') + '<span class="text--sm text--muted">' + PU.formatDate(r.criadoEm) + '</span></div>';
        }).join('') + '</div>'
          : '<div class="empty-state"><div class="icon-tile icon-tile--ghost">' + icon('star') + '</div><p class="text text--secondary">Nenhuma avaliação recebida ainda.</p></div>') +
      '</div>'
    );
  };

  // ---------------- Interações pós-render ----------------

  const prevAfterRender = Screens.afterRender;
  Screens.afterRender = function (pattern, content, params, user) {
    if (prevAfterRender) prevAfterRender(pattern, content, params, user);

    if (pattern === '/profissional/home') bindHome(content, user);
    if (pattern === '/profissional/chamada/:id') bindChamada(content, params, user);
    if (pattern === '/profissional/servicos') bindProfServicos(content, user);
    if (pattern === '/profissional/pedido/:id') bindPedidoDetalhe(content, params, user);
    if (pattern === '/profissional/orcamento/:id') bindOrcamentoForm(content, params, user);
    if (pattern === '/profissional/perfil') bindPerfil(content, user);
    if (pattern === '/profissional/carteira') bindCarteira(content, user);
    if (pattern === '/cliente/home') { bindAnunciosHome(content); bindNotificationActivation(content); }
    if (pattern === '/anuncie' || pattern === '/cliente/anuncie' || pattern === '/profissional/anuncie') bindAnuncie(content);
  };

  function bindAnunciosHome(content) {
    const cards = Array.prototype.slice.call(content.querySelectorAll('[data-ad-click]'));
    if (cards.length) DB.registrarImpressoesAnuncios(cards.map(function (c) { return c.getAttribute('data-ad-click'); }));
    content.addEventListener('click', function (e) {
      const el = e.target.closest('[data-ad-click]');
      if (!el) return;
      const id = el.getAttribute('data-ad-click');
      DB.registrarCliqueAnuncio(id);
      const href = el.getAttribute('data-ad-href');
      if (href && /^https?:\/\//i.test(href)) window.open(href, '_blank', 'noopener');
    });
  }

  function bindAnuncie(content) {
    const form = content.querySelector('#anuncio-form');
    if (!form) return;
    let imageData = '';
    const input = content.querySelector('#ad-image');
    const preview = content.querySelector('#ad-preview');

    // V10.7: mantém o anúncio preenchido quando o visitante precisa entrar/criar conta.
    try {
      const saved = JSON.parse(sessionStorage.getItem('qf_pending_ad_draft') || 'null');
      if (saved && saved.fields) {
        Array.prototype.forEach.call(form.querySelectorAll('[name]'), function (ctrl) {
          const name = ctrl.name;
          if (!name || !(name in saved.fields) || ctrl.type === 'file') return;
          if (ctrl.type === 'radio') ctrl.checked = String(ctrl.value) === String(saved.fields[name]);
          else if (ctrl.type === 'checkbox') ctrl.checked = !!saved.fields[name];
          else ctrl.value = saved.fields[name] == null ? '' : saved.fields[name];
        });
        imageData = String(saved.imageData || '');
        if (imageData) preview.innerHTML = '<img src="' + imageData + '" alt="Prévia do anúncio">';
        Array.prototype.forEach.call(form.querySelectorAll('input[name="regiaoTipo"]'), function (r) {
          const item = r.closest('.segmented__item');
          if (item) item.classList.toggle('is-active', r.checked);
        });
        const savedPay = String(saved.fields.formaPagamento || '');
        Array.prototype.forEach.call(content.querySelectorAll('#ad-payment [data-pay]'), function (b) {
          b.classList.toggle('is-active', b.getAttribute('data-pay') === savedPay);
        });
        PU.toast('Seu anúncio foi recuperado. Continue de onde parou.', 'success');
      }
    } catch (_) {}
    input.addEventListener('change', function () {
      const f = input.files && input.files[0];
      if (!f) return;
      if (f.size > 900 * 1024) { input.value = ''; PU.toast('A imagem deve ter no máximo 900 KB nesta versão.', 'danger'); return; }
      const reader = new FileReader();
      reader.onload = function () { imageData = String(reader.result || ''); preview.innerHTML = '<img src="' + imageData + '" alt="Prévia do anúncio">'; };
      reader.readAsDataURL(f);
    });
    Array.prototype.forEach.call(form.querySelectorAll('input[name="regiaoTipo"]'), function (radio) {
      radio.addEventListener('change', function () {
        Array.prototype.forEach.call(form.querySelectorAll('input[name="regiaoTipo"]'), function (r) { r.closest('.segmented__item').classList.toggle('is-active', r.checked); });
        const cityRow = form.querySelector('[name="cidadeAnuncio"]');
        if (cityRow && radio.value === 'cidade' && radio.checked) cityRow.focus();
      });
    });
    const pay = content.querySelector('#ad-payment');
    pay.addEventListener('click', function (e) {
      const b = e.target.closest('[data-pay]'); if (!b) return;
      Array.prototype.forEach.call(pay.querySelectorAll('.segmented__item'), function (x) { x.classList.remove('is-active'); });
      b.classList.add('is-active'); form.elements.formaPagamento.value = b.getAttribute('data-pay');
    });
    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      const fd = new FormData(form);
      if (!String(fd.get('empresa') || '').trim() || !String(fd.get('chamada') || '').trim() || !String(fd.get('whatsapp') || '').trim()) { PU.toast('Preencha empresa, chamada e WhatsApp.', 'danger'); return; }
      if (!imageData) { PU.toast('Adicione a imagem do anúncio.', 'danger'); return; }

      if (!DB.getSession()) {
        const draftFields = {};
        fd.forEach(function (value, key) {
          if (typeof value === 'string') draftFields[key] = value;
        });
        try {
          sessionStorage.setItem('qf_pending_ad_draft', JSON.stringify({ fields: draftFields, imageData: imageData, savedAt: Date.now() }));
        } catch (_) {}

        PU.openSheet(
          '<div class="stack">' +
            '<div class="icon-tile icon-tile--lg icon-tile--orange" style="margin:0 auto;">' + icon('user') + '</div>' +
            '<h3 class="sheet__title" style="text-align:center;">Entre para continuar</h3>' +
            '<p class="text text--secondary" style="text-align:center;">Seu anúncio já está salvo neste aparelho. Entre ou crie sua conta e você volta para finalizar sem preencher tudo de novo.</p>' +
            '<button class="btn btn--primary" id="qf-ad-login-cliente">Entrar como cliente</button>' +
            '<button class="btn btn--outline" id="qf-ad-login-prof">Entrar como profissional</button>' +
            '<div class="divider-label">primeiro acesso?</div>' +
            '<div class="btn-row"><button class="btn btn--outline" id="qf-ad-cad-cliente">Criar conta cliente</button><button class="btn btn--outline" id="qf-ad-cad-prof">Criar conta profissional</button></div>' +
            '<button class="btn btn--ghost" id="qf-ad-voltar">Continuar editando</button>' +
          '</div>',
          { persistent: true }
        );
        document.getElementById('qf-ad-login-cliente').onclick = function () { PU.closeSheet(); global.navigate('/auth/cliente/login', true); };
        document.getElementById('qf-ad-login-prof').onclick = function () { PU.closeSheet(); global.navigate('/auth/profissional/login', true); };
        document.getElementById('qf-ad-cad-cliente').onclick = function () { PU.closeSheet(); global.navigate('/auth/cliente/cadastro', true); };
        document.getElementById('qf-ad-cad-prof').onclick = function () { PU.closeSheet(); global.navigate('/auth/profissional/cadastro', true); };
        document.getElementById('qf-ad-voltar').onclick = function () { PU.closeSheet(); };
        return;
      }

      const btn = form.querySelector('button[type="submit"]');
      if (btn) { btn.disabled = true; btn.textContent = 'Enviando...'; }
      try {
        const regiaoTipo = fd.get('regiaoTipo') || 'all';
        const cidadeAnuncio = String(fd.get('cidadeAnuncio') || '').trim();
        const ufAnuncio = String(fd.get('ufAnuncio') || '').trim();
        if (regiaoTipo === 'cidade' && (!cidadeAnuncio || !ufAnuncio)) { PU.toast('Informe cidade e UF do anúncio.', 'danger'); return; }
        const regiao = regiaoTipo === 'all' ? 'all' : global.QFGeo.regionKey(cidadeAnuncio, ufAnuncio);
        const dados = { empresa: fd.get('empresa'), chamada: fd.get('chamada'), cidadeId: regiao, plano: fd.get('plano'), imagem: imageData, whatsapp: fd.get('whatsapp'), link: fd.get('link'), formaPagamento: fd.get('formaPagamento') };
        let ad, pagamento;
        if (global.QFCloud && global.QFCloud.enabled) {
          const out = await global.QFCloud.submitAd(dados);
          ad = out.ad; pagamento = out.pagamento || {};
        } else {
          throw new Error('Pagamento real exige conexão com o servidor. Verifique a internet e tente novamente.');
        }
        const p = DB.adPlan((ad && ad.plano) || dados.plano);
        const valor = Number(pagamento.valor_centavos != null ? pagamento.valor_centavos : p.valor || 0);
        try { sessionStorage.removeItem('qf_pending_ad_draft'); } catch (_) {}

        const pixCode = String(pagamento.pix_copy_paste || '');
        const checkoutUrl = String(pagamento.checkout_url || '');
        const qrImage = String(pagamento.qr_image || '');
        PU.openSheet(
          '<div class="stack">' +
            '<div class="icon-tile icon-tile--lg icon-tile--orange" style="margin:0 auto;">' + icon('wallet') + '</div>' +
            '<h3 class="sheet__title" style="text-align:center;">Pix gerado na Efí</h3>' +
            '<p class="text text--secondary" style="text-align:center;">Valor: <strong>' + PU.formatCurrency(valor) + '</strong>. Pague o Pix abaixo. O anúncio só será liberado como pago depois da confirmação bancária.</p>' +
            (qrImage ? '<img src="' + PU.escapeHtml(qrImage) + '" alt="QR Code Pix" style="width:220px;height:220px;object-fit:contain;margin:0 auto;border-radius:16px;background:#fff;padding:8px;">' : '') +
            (pixCode ? '<label class="field"><span class="field__label">Pix Copia e Cola</span><textarea class="textarea" id="qf-ad-pix-code" readonly style="min-height:96px;">' + PU.escapeHtml(pixCode) + '</textarea></label><button class="btn btn--primary" id="qf-ad-copy-pix">' + icon('clipboard') + ' Copiar Pix</button>' : '') +
            (checkoutUrl ? '<button class="btn btn--outline" id="qf-ad-open-pix">Abrir página do Pix</button>' : '') +
            '<div class="card card--tight" style="background:var(--navy-100);border:none;"><div class="text--sm text--secondary">A confirmação é automática. Depois do pagamento, o sistema verifica a Efí e atualiza o anúncio.</div></div>' +
            '<button class="btn btn--outline" id="fechar-anuncio">Fechar</button>' +
          '</div>',
          { persistent: true }
        );
        const copyPix = document.getElementById('qf-ad-copy-pix');
        if (copyPix) copyPix.onclick = async function () {
          try {
            await navigator.clipboard.writeText(pixCode);
            PU.toast('Pix copiado.', 'success');
          } catch (_) {
            const area = document.getElementById('qf-ad-pix-code');
            if (area) { area.focus(); area.select(); document.execCommand('copy'); PU.toast('Pix copiado.', 'success'); }
          }
        };
        const openPix = document.getElementById('qf-ad-open-pix');
        if (openPix) openPix.onclick = function () { location.href = checkoutUrl; };
        document.getElementById('fechar-anuncio').onclick = function () {
          PU.closeSheet();
          const sess = DB.getSession();
          global.navigate(sess && sess.role === 'profissional' ? '/profissional/home' : '/cliente/home', true);
        };
      } catch (err) {
        const msg = (err && err.message) ? err.message : String(err);
        if (msg.indexOf('authentication') !== -1 || msg.indexOf('Entre na sua conta') !== -1) {
          try {
            const retryFields = {};
            new FormData(form).forEach(function (value, key) { if (typeof value === 'string') retryFields[key] = value; });
            sessionStorage.setItem('qf_pending_ad_draft', JSON.stringify({ fields: retryFields, imageData: imageData, savedAt: Date.now() }));
          } catch (_) {}
          PU.openSheet(
            '<div class="stack"><h3 class="sheet__title" style="text-align:center;">Sua sessão expirou</h3>' +
            '<p class="text text--secondary" style="text-align:center;">Seu anúncio está salvo. Entre novamente para continuar.</p>' +
            '<button class="btn btn--primary" id="qf-ad-relogin-cliente">Entrar como cliente</button>' +
            '<button class="btn btn--outline" id="qf-ad-relogin-prof">Entrar como profissional</button></div>'
          );
          document.getElementById('qf-ad-relogin-cliente').onclick = function () { PU.closeSheet(); global.navigate('/auth/cliente/login', true); };
          document.getElementById('qf-ad-relogin-prof').onclick = function () { PU.closeSheet(); global.navigate('/auth/profissional/login', true); };
        } else {
          PU.toast('Não foi possível enviar o anúncio: ' + msg, 'danger');
        }
      } finally {
        if (btn) { btn.disabled = false; btn.textContent = 'Gerar Pix e enviar anúncio'; }
      }
    });
  }

  Screens.bindAnunciePublic = bindAnuncie;
  const prevAnonForAds = Screens.afterRenderAnon;
  Screens.afterRenderAnon = function (pattern, content, params) {
    if (prevAnonForAds) prevAnonForAds(pattern, content, params);
    if (pattern === '/anuncie') bindAnuncie(content);
  };

  function bindNotificationActivation(content) {
    const btn = content.querySelector('[data-action="ativar-notificacoes"]');
    if (!btn || !global.QFPush) return;
    btn.addEventListener('click', async function () {
      btn.disabled = true;
      try {
        await global.QFPush.activate();
        PU.toast('Notificações ativadas! Você receberá avisos importantes.', 'success');
        global.navigate(location.hash.replace(/^#/, '') || '/', true);
      } catch (err) {
        PU.toast((err && err.message) || 'Não foi possível ativar as notificações.', 'danger');
      } finally { btn.disabled = false; }
    });
  }

  // V10.2: antes de ficar online, garante selfie e notificações (com tela explicativa clara).
  function explicarSelfieObrigatoria() {
    PU.openSheet(
      '<div class="stack"><div class="icon-tile icon-tile--lg icon-tile--orange" style="margin:0 auto;">' + icon('camera') + '</div>' +
      '<h3 class="sheet__title" style="text-align:center;">Identificação obrigatória</h3>' +
      '<p class="text text--secondary" style="text-align:center;">Antes de ficar online, envie sua selfie. Se você representa uma empresa, pode usar a marca ou logotipo oficial da empresa. A imagem pode aparecer para o cliente quando você assumir o chamado.</p>' +
      '<button class="btn btn--primary" id="qf-ir-selfie">' + icon('camera') + ' Cadastrar identificação</button>' +
      '<button class="btn btn--outline" id="qf-selfie-depois">Agora não</button></div>'
    );
    document.getElementById('qf-ir-selfie').onclick = function () { PU.closeSheet(); global.navigate('/profissional/perfil', true); };
    document.getElementById('qf-selfie-depois').onclick = function () { PU.closeSheet(); };
  }

  function pushJaAtivo() {
    try { return global.QFPush.isActive(); } catch (_) { return false; }
  }

  function garantirNotificacoesParaOnline() {
    const P = global.QFPush;
    if (!P) return Promise.resolve(true);
    if (P.supported() && pushJaAtivo()) return Promise.resolve(true);
    return new Promise(function (resolve) {
      const suportado = P.supported();
      const negado = P.permission() === 'denied';
      let corpo;
      if (!suportado) {
        corpo = '<p class="text text--secondary" style="text-align:center;">Este aparelho ou esta forma de abrir o QuemFaz não permite avisos com o app fechado (por exemplo, arquivo local ou navegador sem suporte). Instale o app pelo endereço oficial (HTTPS) para receber chamados em segundo plano.</p>' +
          '<button class="btn btn--primary" id="qf-notif-continuar">Continuar com o app aberto</button>' +
          '<button class="btn btn--outline" id="qf-notif-cancelar">Agora não</button>';
      } else if (negado) {
        corpo = '<p class="text text--secondary" style="text-align:center;">Ative as notificações para receber novos chamados mesmo quando não estiver usando o app.</p>' +
          '<div class="card card--tight" style="background:var(--danger-100);border:none;"><div class="text--sm" style="color:var(--danger-600);">As notificações estão bloqueadas para o QuemFaz. Abra as configurações do aparelho &gt; Apps/Sites &gt; QuemFaz &gt; Notificações e permita. Depois toque em ATIVAR NOTIFICAÇÕES.</div></div>' +
          '<button class="btn btn--primary" id="qf-notif-ativar">' + icon('bell') + ' ATIVAR NOTIFICAÇÕES</button>' +
          '<button class="btn btn--outline" id="qf-notif-cancelar">Agora não</button>';
      } else {
        corpo = '<p class="text text--secondary" style="text-align:center;">Ative as notificações para receber novos chamados mesmo quando não estiver usando o app.</p>' +
          '<button class="btn btn--primary" id="qf-notif-ativar">' + icon('bell') + ' ATIVAR NOTIFICAÇÕES</button>' +
          '<button class="btn btn--outline" id="qf-notif-cancelar">Agora não</button>';
      }
      PU.openSheet('<div class="stack" id="qf-notif-sheet"><div class="icon-tile icon-tile--lg icon-tile--orange" style="margin:0 auto;">' + icon('bell') + '</div>' +

  function bindHome(content, user) {
    bindNotificationActivation(content);
    const toggle = content.querySelector('#toggle-online');
    if (toggle) {
      const onlineNow=content.querySelector('[data-action="ficar-online-agora"]');
      const offlineNow=content.querySelector('[data-action="ficar-offline-agora"]');
      if(onlineNow)onlineNow.addEventListener('click',function(){if(toggle.disabled)return;toggle.checked=true;toggle.dispatchEvent(new Event('change',{bubbles:true}));});
      if(offlineNow)offlineNow.addEventListener('click',function(){if(toggle.disabled)return;toggle.checked=false;toggle.dispatchEvent(new Event('change',{bubbles:true}));});
      const locationBtn=content.querySelector('[data-action="qf-progress-location"]');
      if(locationBtn)locationBtn.addEventListener('click',function(){
        locationBtn.disabled=true;
        if(!navigator.geolocation){PU.toast('Localização não disponível neste aparelho.','danger');locationBtn.disabled=false;return;}
        navigator.geolocation.getCurrentPosition(function(){try{localStorage.setItem('qf_location_ready','1');}catch(_){}PU.toast('Localização permitida.','success');global.navigate('/profissional/home',true);},function(){PU.toast('Permita a localização nas configurações do aparelho/navegador.','danger');locationBtn.disabled=false;},{enableHighAccuracy:true,timeout:9000,maximumAge:0});
      });
      const batteryBtn=content.querySelector('[data-action="qf-progress-battery"]');
      if(batteryBtn)batteryBtn.addEventListener('click',function(){if(global.QFPush&&global.QFPush.requestBattery)global.QFPush.requestBattery();});
      toggle.addEventListener('change', async function () {
        const querOnline = toggle.checked;
        toggle.checked = !querOnline; // só muda depois de confirmar no servidor
        toggle.disabled = true;
        try {
          if (querOnline && !user.fotoUrl) { explicarSelfieObrigatoria(); return; }
          if (querOnline) {
            const ok = await garantirNotificacoesParaOnline();
            if (!ok) return;
          }
          PU.unlockNotificationAudio();
          if (global.QFCloud && global.QFCloud.enabled) await global.QFCloud.setOnline(querOnline);
          else DB.setOnlineStatus(user.id, querOnline);
          toggle.checked = querOnline;
          PU.toast(querOnline ? 'Você está online.' : 'Você está offline.', querOnline ? 'success' : null);
          global.navigate('/profissional/home', true);
        } catch (err) {
          PU.toast('Não foi possível atualizar seu status. ' + (err && err.message ? err.message : ''), 'danger');
        } finally {
          toggle.disabled = false;
        }
      });
    }
  }

  function bindChamada(content, params, user) {
    content.addEventListener('click', function (e) {
      const action = e.target.closest('[data-action]');
      if (!action) return;
      const act = action.getAttribute('data-action');
      if (act === 'desbloquear-chamada') {
        const req = DB.requestById(params.id);
        const valor = req ? DB.leadFeeForRequest(req) : 0;
        const primeiraGratis = false;
        PU.confirmDialog({
          title: primeiraGratis ? 'Seu primeiro desbloqueio é grátis' : 'Desbloquear chamado',
          message: primeiraGratis
            ? 'Nenhum crédito será usado neste primeiro chamado. O contato e o endereço completo do cliente serão liberados. Nos próximos chamados, será necessário ter saldo na Carteira QuemFaz.'
            : 'Serão usados ' + PU.formatCurrency(valor) + ' dos seus créditos. Depois disso, o contato e o endereço completo do cliente serão liberados para você.',
          okLabel: primeiraGratis ? 'Desbloquear grátis' : 'Pagar e desbloquear'
        }).then(async function (ok) {
          if (!ok) return;
          const result = (global.QFCloud && global.QFCloud.enabled)
            ? await global.QFCloud.unlockCall(params.id, user.id)
            : DB.desbloquearChamado(params.id, user.id);
          if (result && result.ok) {
            PU.toast(result.usouBonus ? 'Primeiro chamado desbloqueado GRÁTIS! Contato liberado.' : 'Chamado desbloqueado! Contato do cliente liberado.', 'success');
            global.navigate('/profissional/pedido/' + params.id, true);
            return;
          }
          if (result && result.reason === 'saldo') {
            PU.openSheet(
              '<div class="stack"><h3 class="sheet__title">Créditos insuficientes</h3>' +
              '<p class="text text--secondary">Você tem ' + PU.formatCurrency(result.saldo) + ' e precisa de ' + PU.formatCurrency(result.valor) + ' para este chamado.</p>' +
              '<button class="btn btn--primary" id="ir-carteira">Adicionar créditos</button>' +
              '<div class="text--sm text--secondary" style="text-align:center;">Pix, cartão ou boleto</div></div>'
            );
            document.getElementById('ir-carteira').onclick = function () {
              PU.closeSheet();
              global.navigate('/profissional/carteira', true);
            };
          } else {
            PU.toast((result && result.error) ? result.error : 'Este chamado não está mais disponível.', 'danger');
            global.navigate('/profissional/home', true);
          }
        }).catch(function (err) {
          PU.toast('Não foi possível desbloquear. ' + (err && err.message ? err.message : ''), 'danger');
        });
      }
      if (act === 'recusar-chamada') {
        DB.recusarChamada(params.id, user.id);
        PU.toast('Oportunidade removida da sua lista.', null);
        global.navigate('/profissional/home', true);
      }
    });
  }

    const methodsWrap = content.querySelector('#wallet-methods');

    const chips = content.querySelector('#perfil-cats');
    chips.addEventListener('click', function (e) {
      const chip = e.target.closest('[data-chip-cat]');
      if (!chip) return;
      const id = chip.getAttribute('data-chip-cat');
      let cats = user.categorias.slice();
      if (cats.indexOf(id) === -1) cats.push(id); else cats = cats.filter(function (x) { return x !== id; });

      chip.classList.toggle('is-selected');
    });

    const addArea = content.querySelector('#adicionar-area');

    function bindAreaRanges() {
      Array.prototype.forEach.call(areasWrap.querySelectorAll('[data-area-radius]'), function (range) {
        if (range.dataset.bound) return;
        range.dataset.bound = '1';
        range.addEventListener('input', function () {
          const row = range.closest('[data-area-row]');
          const label = row && row.querySelector('[data-area-radius-label]');
          if (label) label.textContent = range.value;
        });
      });
    }
    bindAreaRanges();

    addArea.addEventListener('click', function () {
      const count = areasWrap.querySelectorAll('[data-area-row]').length;

        } else {

    if(!!a.prioridade!==!!b.prioridade)return a.prioridade?-1:1;
    const da=Number.isFinite(Number(a.distanciaKm))?Number(a.distanciaKm):999999;
    const db=Number.isFinite(Number(b.distanciaKm))?Number(b.distanciaKm):999999;

      '<div class="qf-call-overlay__place">'+PU.escapeHtml([bairro,cidade].filter(Boolean).join(' · '))+'</div>'+

      (reqs.length>1?'<div class="qf-call-overlay__others">+'+(reqs.length-1)+' outro'+(reqs.length-1===1?'':'s')+' chamado'+(reqs.length-1===1?'':'s')+'</div>':'')+

      '<div class="qf-call-timer"><div class="qf-call-timer__bar"><div class="qf-call-timer__fill" data-call-fill></div></div><div class="qf-call-timer__txt">Fecha em <span data-call-seconds>30 s</span></div></div></div>';

          if (a.status === DB.STATUS.APROVADO) pushNotice(session, 'orc_aprovado:' + id, 'Orçamento aprovado', detail + ' · você já pode iniciar o serviço', '/profissional/pedido/' + id, true);
          if (a.status === DB.STATUS.ORCAMENTO_RECUSADO) pushNotice(session, 'orc_recusado:' + id, 'Cliente respondeu ao orçamento', detail + ' · veja o motivo e envie uma nova proposta', '/profissional/pedido/' + id, false);
        }
      } else if (session.role === 'cliente') {
        if (b && !b.profissionalId && a.profissionalId) {
          pushNotice(session, 'prof_encontrado:' + id, 'Profissional encontrado', detail + ' · o profissional está preparando seu orçamento', '/cliente/pedido/' + id, true);
        }
        if (b && b.status !== a.status) {
          if (a.status === DB.STATUS.ORCAMENTO_ENVIADO) pushNotice(session, 'orc_recebido:' + id, 'Novo orçamento recebido', detail + ' · abra para aprovar ou recusar', '/cliente/pedido/' + id, true);
          if (a.status === DB.STATUS.EM_ANDAMENTO) pushNotice(session, 'servico_iniciado:' + id, 'Serviço iniciado', detail + ' · o profissional começou o atendimento', '/cliente/pedido/' + id, false);
          if (a.status === DB.STATUS.CANCELADO && b.profissionalId) pushNotice(session, 'cancelado:' + id, 'Serviço cancelado pelo profissional', detail, '/cliente/pedido/' + id, true);
          if (a.status === DB.STATUS.SERVICO_CONCLUIDO) pushNotice(session, 'servico_concluido:' + id, 'Serviço concluído', detail + ' · avalie o profissional', '/cliente/pedido/' + id, true);
        }
      }
    });
  }

  Screens.notificacoesRender = function () {
    const session = currentSession();
    const items = loadNotices(session);
    return '<div class="view">' +
      '<div class="section-head"><div><h2 class="h2">Avisos</h2><p class="text text--sm text--secondary">Chamados, profissionais e atualizações importantes.</p></div></div>' +
      (items.length ? '<div class="notice-toolbar"><button type="button" class="notice-clear" data-clear-notices>Excluir todos</button></div>' +
        '<div class="stack--sm">' + items.map(function (n) {
          return '<div class="notice-card' + (n.read ? '' : ' is-unread') + '">' +

        : '<div class="empty-state"><div class="icon-tile icon-tile--ghost">' + icon('bell') + '</div><p class="text text--secondary">Nenhum aviso novo.</p></div>') +
    '</div>';
  };

  function currentSession() { return DB.getSession(); }

  function currentUser() {
    const s = currentSession();
    if (!s) return null;
    if (s.role === 'cliente') return DB.clienteById(s.userId);
    if (s.role === 'profissional') return DB.profissionalById(s.userId);
    return null;
  }

  function navigate(hash, replace) {
    if (replace) {
      const url = location.pathname + location.search + '#' + hash;
      history.replaceState(null, '', url);
      route();
    } else {
      location.hash = hash;
    }
  }
  global.navigate = navigate;

  // ---------------- Rotas ----------------

  const routes = [
    { pattern: '/', anon: true, render: function () { return Screens.landing(); } },
    { pattern: '/auth/:role/login', anon: true, render: function (p) { return Screens.authLogin(p); } },
    { pattern: '/auth/:role/cadastro', anon: true, render: function (p) { return Screens.authCadastro(p); } },

    { pattern: '/anuncie', anon: true, title: 'Anuncie no QuemFaz', render: Screens.anuncieRender },

    { pattern: '/cliente/home', role: 'cliente', tab: 'home', title: 'QuemFaz', render: Screens.clienteHomeRender },
    { pattern: '/cliente/categoria/:catId', role: 'cliente', title: 'Categoria', back: '/cliente/home', render: Screens.clienteCategoriaRender },
    { pattern: '/cliente/novo-pedido/:catId', role: 'cliente', title: 'Solicitar serviço', back: '/cliente/home', render: Screens.clienteNovoPedidoRender },
    { pattern: '/cliente/pedidos', role: 'cliente', tab: 'pedidos', title: 'Meus pedidos', render: Screens.clientePedidosRender },
    { pattern: '/cliente/avisos', role: 'cliente', tab: 'avisos', title: 'Avisos', render: Screens.notificacoesRender },
    { pattern: '/cliente/pedido/:id', role: 'cliente', title: 'Acompanhar pedido', back: '/cliente/pedidos', render: Screens.clientePedidoDetalheRender },
    { pattern: '/cliente/perfil', role: 'cliente', tab: 'perfil', title: 'Perfil', render: Screens.clientePerfilRender },
    { pattern: '/cliente/endereco', role: 'cliente', title: 'Meu endereço', back: '/cliente/perfil', render: Screens.clienteEnderecoRender },

    { pattern: '/cliente/anuncie', role: 'cliente', title: 'Anuncie no QuemFaz', back: '/cliente/home', render: Screens.anuncieRender },

    { pattern: '/profissional/home', role: 'profissional', tab: 'home', title: 'Chamadas', render: Screens.profHomeRender },

    { pattern: '/profissional/servicos', role: 'profissional', tab: 'servicos', title: 'Meus serviços', render: Screens.profServicosRender },
    { pattern: '/profissional/avisos', role: 'profissional', tab: 'avisos', title: 'Avisos', render: Screens.notificacoesRender },
    { pattern: '/profissional/pedido/:id', role: 'profissional', title: 'Detalhes do serviço', back: '/profissional/servicos', render: Screens.profPedidoDetalheRender },
    { pattern: '/profissional/orcamento/:id', role: 'profissional', title: 'Criar orçamento', back: '/profissional/servicos', render: Screens.profOrcamentoFormRender },
    { pattern: '/profissional/carteira', role: 'profissional', tab: 'carteira', title: 'Carteira', render: Screens.profCarteiraRender },
    { pattern: '/profissional/anuncie', role: 'profissional', title: 'Anuncie no QuemFaz', back: '/profissional/home', render: Screens.anuncieRender },
    { pattern: '/profissional/perfil', role: 'profissional', tab: 'perfil', title: 'Perfil profissional', render: Screens.profPerfilRender },
    { pattern: '/profissional/avaliacoes', role: 'profissional', title: 'Avaliações', back: '/profissional/perfil', render: Screens.profAvaliacoesRender },

  ];

  function compilePattern(pattern) {
    const keys = [];
    const re = new RegExp('^' + pattern.replace(/:[^/]+/g, function (m) { keys.push(m.slice(1)); return '([^/]+)'; }) + '$');
    return { re: re, keys: keys };
  }
  routes.forEach(function (r) { const c = compilePattern(r.pattern); r._re = c.re; r._keys = c.keys; });

  function matchRoute(path) {
    for (let i = 0; i < routes.length; i++) {
      const r = routes[i];
      const m = r._re.exec(path);
      if (m) {
        const params = {};
        r._keys.forEach(function (k, idx) { params[k] = decodeURIComponent(m[idx + 1]); });
        return { route: r, params: params };
      }
    }
    return null;
  }

  function currentPath() {
    let h = location.hash || '#/';
    h = h.slice(1);
    if (!h) h = '/';
    return h;
  }

  async function route() {
    const path = currentPath();
    const found = matchRoute(path);
    if (global.QFCloud && global.QFCloud.enabled) {
      try {
        await global.QFCloud.syncForCurrentSession(false);
      } catch (err) {
        console.error('QuemFaz sync error', err);
        PU.toast('Não foi possível sincronizar com o banco agora.', 'danger');
      }
    }
    const session = currentSession();
    if (session && session.role === 'profissional') {
      try { await syncPersistentProfessionalNotices(session, false); }
      catch (err) { console.warn('QuemFaz avisos persistentes', err); }
    }

    if (!found) { navigate('/', true); return; }

    if (found.route.anon) {
      if (session && session.role === 'admin') {
        DB.logout();
        renderAnon(found);
        return;
      }
      if (session) {
        navigate('/' + session.role + '/home', true);
        return;
      }
      renderAnon(found);
      return;
    }

    if (!session || session.role !== found.route.role) {
      navigate('/', true);
      return;
    }
    const user = currentUser();
    if (!user) { DB.logout(); navigate('/', true); return; }
    if (user.bloqueado) {
      PU.toast('Seu acesso foi bloqueado pelo administrador.', 'danger');
      DB.logout();
      navigate('/', true);
      return;
    }
    renderApp(found, user, session);
  }

  // V10.6: identifica a tela no #app-shell para o layout de computador/tablet.
  function routeKey(pattern) {
    return String(pattern || '/').replace(/:[^/]+/g, '').replace(/[^a-z0-9]+/gi, '-').replace(/^-+|-+$/g, '') || 'inicio';
  }

  function renderAnon(found) {
    const shell = document.getElementById('app-shell');
    shell.setAttribute('data-route', routeKey(found.route.pattern));
    shell.setAttribute('data-role', 'anon');
    const isLanding = found.route.pattern === '/';
    shell.innerHTML = '<div id="app-content"></div>' + (!isLanding && global.QFSupport ? global.QFSupport.buttonHtml() : '');
    const content = document.getElementById('app-content');
    content.style.paddingBottom = isLanding ? '0' : '72px';
    content.innerHTML = found.route.render(found.params);
    bindGlobalDelegation(content);
    if (Screens.afterRenderAnon) Screens.afterRenderAnon(found.route.pattern, content, found.params);
    if (global.QFApp) { global.QFApp.fillInstallSlots(content); global.QFApp.afterRender(); }
    window.scrollTo(0, 0);
  }

  function renderApp(found, user, session) {
    if (found.route.tab === 'avisos') markNoticesRead(session);
    const shell = document.getElementById('app-shell');
    const tabs = TABS[session.role] || [];
    const showTabbar = !!found.route.tab || tabs.some(function (t) { return t.route === '/' + session.role + currentPath().replace('/' + session.role, ''); });
    const isTabRoute = !!found.route.tab;

    let topbarHtml = '';
    if (found.route.back) {
      topbarHtml =
        '<div class="topbar">' +
        '<button class="topbar__back" data-nav="' + found.route.back + '" aria-label="Voltar">' + icon('chevronLeft') + '</button>' +
        '<h1 class="topbar__title">' + PU.escapeHtml(typeof found.route.title === 'function' ? found.route.title(found.params) : found.route.title) + '</h1>' +
        '<button class="qf-topbar-support" type="button" data-support-open aria-label="Abrir suporte">' + icon('info') + '</button>' +
        '</div>';
    } else if (isTabRoute) {
      const tabTitle = typeof found.route.title === 'function' ? found.route.title(found.params) : found.route.title;
      topbarHtml =
        '<div class="topbar">' +
        (tabTitle === 'QuemFaz'
          ? '<h1 class="topbar__title topbar__title--brand">' + QF_BRAND_MARK + '<span>Quem<span>Faz</span></span></h1>'
          : '<h1 class="topbar__title">' + PU.escapeHtml(tabTitle) + '</h1>') +
        '<button class="qf-topbar-support" type="button" data-support-open aria-label="Abrir suporte">' + icon('info') + '</button>' +
        '</div>';
    }

    // V11.1: profissional online sem notificações ativas só recebe chamados com o app aberto — avisa no topo.
    let pushBannerHtml = '';
    if (session.role === 'profissional' && user && user.online && global.QFPush && !global.QFPush.isActive()) {
      pushBannerHtml = '<div class="qf-push-banner" role="status"><span>Você está online, mas só recebe chamados com o app aberto.</span>' +
        '<button class="btn btn--primary btn--sm" type="button" data-action="ativar-notificacoes-faixa">' + icon('bell') + ' Ativar notificações</button></div>';
    }

    shell.setAttribute('data-route', routeKey(found.route.pattern));
    shell.setAttribute('data-role', session.role);
    shell.innerHTML =
      '<a href="#app-content" class="skip-link">Pular para conteúdo</a>' +
      pushBannerHtml +
      topbarHtml +
      '<main id="app-content" role="main"></main>' +
      renderTabbar(tabs, found.route.tab);

    const pushBannerBtn = shell.querySelector('[data-action="ativar-notificacoes-faixa"]');
    if (pushBannerBtn) pushBannerBtn.addEventListener('click', async function () {
      pushBannerBtn.disabled = true;
      try {
        await global.QFPush.activate();
        PU.toast('Notificações ativadas. Você receberá novos chamados mesmo com o app fechado.', 'success');
        navigate(currentPath(), true);
      } catch (err) {
        PU.toast((err && err.message) || 'Não foi possível ativar as notificações.', 'danger');
        pushBannerBtn.disabled = false;
      }
    });

    const content = document.getElementById('app-content');
    content.innerHTML = found.route.render(found.params, user);
    bindGlobalDelegation(content);
    if (Screens.afterRender) Screens.afterRender(found.route.pattern, content, found.params, user);
    if (global.QFApp) { global.QFApp.fillInstallSlots(content); global.QFApp.afterRender(); }
    window.scrollTo(0, 0);
  }

  function renderTabbar(tabs, activeId) {
    if (!tabs.length) return '';
    return '<nav class="tabbar" aria-label="Navegação principal">' +
      '<button class="tabbar__brand" data-nav="' + tabs[0].route + '" aria-label="QuemFaz — início">' + QF_BRAND_MARK + '<span class="tabbar__brand-word">Quem<span>Faz</span></span></button>' +
      tabs.map(function (t) {
        const count = t.id === 'avisos' ? unreadNotices(currentSession()) : 0;
        return '<button class="tabbar__item' + (t.id === activeId ? ' is-active' : '') + '" data-nav="' + t.route + '" aria-current="' + (t.id === activeId ? 'page' : 'false') + '">' +
          icon(t.icon) + (count ? '<span class="tabbar__notice-badge" aria-label="' + count + ' avisos não lidos">' + (count > 9 ? '9+' : count) + '</span>' : '') + '<span>' + t.label + '</span></button>';
      }).join('') +
      '</nav>';
  }

  // ---------------- Delegação global de eventos ----------------

  function bindGlobalDelegation(root) {
    root.addEventListener('click', function (e) {
      const navEl = e.target.closest('[data-nav]');
      if (navEl) { e.preventDefault(); navigate(navEl.getAttribute('data-nav')); return; }
    });
  }

  document.addEventListener('click', async function (e) {
    const dismiss=e.target.closest&&e.target.closest('[data-dismiss-pendencia]');
    if(dismiss){e.preventDefault();const tipo=dismiss.getAttribute('data-dismiss-pendencia');try{localStorage.setItem('qf_dismiss_'+tipo,String(Date.now()));}catch(_){}const bar=dismiss.closest('.qf-pendencia');if(bar)bar.remove();return;}
    const deleteNotice = e.target.closest('[data-delete-notice]');
    if (deleteNotice) {
      e.preventDefault();
      e.stopPropagation();
      const session = currentSession();
      const id = deleteNotice.getAttribute('data-delete-notice');
      const serverId = deleteNotice.getAttribute('data-server-notice-id');
      if (serverId && global.QFCloud && global.QFCloud.deleteProfessionalNotice) {
        try { await global.QFCloud.deleteProfessionalNotice(serverId); }
        catch (err) { PU.toast('Não foi possível excluir este aviso do servidor.', 'danger'); return; }
      }
      const items = loadNotices(session).filter(function (n) { return n.id !== id; });
      saveNotices(session, items);
      PU.toast('Aviso excluído.', 'success');
      navigate('/' + session.role + '/avisos', true);
      return;
    }
    const clearNotices = e.target.closest('[data-clear-notices]');
    if (clearNotices) {
      e.preventDefault();
      const session = currentSession();
      PU.confirmDialog({ title: 'Excluir todos os avisos', message: 'Deseja limpar todos os avisos desta conta?', okLabel: 'Excluir todos', danger: true }).then(async function (ok) {
        if (!ok) return;
        if (session.role === 'profissional' && global.QFCloud && global.QFCloud.clearProfessionalNotices) {
          try { await global.QFCloud.clearProfessionalNotices(); }
          catch (err) { PU.toast('Não foi possível excluir todos os avisos do servidor.', 'danger'); return; }
        }
        saveNotices(session, []);
        PU.toast('Avisos excluídos.', 'success');
        navigate('/' + session.role + '/avisos', true);
      });
      return;
    }
    const navEl = e.target.closest('[data-nav]');
    if (navEl && navEl.closest('.tabbar, .topbar')) { e.preventDefault(); navigate(navEl.getAttribute('data-nav')); }
    const logoutEl = e.target.closest('[data-logout]');
    if (logoutEl) {
      e.preventDefault();
      PU.confirmDialog({ title: 'Sair da conta', message: 'Deseja realmente sair?', okLabel: 'Sair' }).then(async function (ok) {
        if (!ok) return;
        if (global.QFCloud && global.QFCloud.enabled) await global.QFCloud.signOut();
        else DB.logout();
        navigate('/', true);
      });
    }
  });

  window.addEventListener('hashchange', route);

  let liveCallsBusy = false;
  let pendingRefresh = false;
  let lastQuickSig = '';
  let lastFullLiveSyncAt = 0;
  // V10.2: não re-renderiza a tela enquanto o usuário digita ou com uma janela aberta
  // (antes, um chamado novo apagava o orçamento/formulário que estava sendo preenchido).
  function userIsEditing() {
    const overlay = document.getElementById('sheet-overlay');
    if (overlay && !overlay.classList.contains('is-hidden')) return true;
    const a = document.activeElement;
    if (a && a.closest && a.closest('#app-content') && (a.tagName === 'TEXTAREA' || a.tagName === 'SELECT' || (a.tagName === 'INPUT' && !/^(checkbox|radio|range|file|button|submit|hidden)$/i.test(a.type)))) return true;
    const forms = document.querySelectorAll('#app-content form');
    for (let i = 0; i < forms.length; i++) { if (forms[i].dataset.dirty === '1') return true; }
    return false;
  }
  document.addEventListener('input', function (e) {
    const t = e.target;
    if (!t || !t.closest || /^(checkbox|radio|range)$/i.test(t.type || '')) return;
    const f = t.closest('#app-content form');
    if (f) f.dataset.dirty = '1';
  }, true);
  function requestStateSignature() {
    return JSON.stringify((DB.state.requests || []).map(function (r) {
      return [r.id, r.status, r.atualizadoEm, r.orcamento && r.orcamento.id, r.orcamento && r.orcamento.status, r.orcamento && r.orcamento.atualizadoEm];
    }));
  }
  setInterval(async function () {
    if (liveCallsBusy || document.hidden) return;
    if (!(global.QFCloud && global.QFCloud.enabled)) return;
    const session = currentSession();
    if (!session) return;
    const path = currentPath();
    const shouldRefresh = path.indexOf('/' + session.role + '/') === 0;
    if (!shouldRefresh) return;

    liveCallsBusy = true;
    const beforeMap = requestStateMap();
    const before = requestStateSignature();
    const y = window.scrollY;
    try {
      // V11.1: profissional — primeiro só a consulta leve; sincronização completa se algo mudou ou a cada 30 s.
      if (session.role === 'profissional' && global.QFCloud.professionalQuickSignature) {
        const quick = await global.QFCloud.professionalQuickSignature();
        const quickKey = session.userId + '#' + quick;
        const due = Date.now() - lastFullLiveSyncAt >= 30000;
        if (quickKey === lastQuickSig && !due && !pendingRefresh) return;
        lastQuickSig = quickKey;
      }
      lastFullLiveSyncAt = Date.now();
      await global.QFCloud.syncForCurrentSession(true);
      let serverNoticesChanged = false;
      if (session.role === 'profissional') {
        try { serverNoticesChanged = await syncPersistentProfessionalNotices(session, true); }
        catch (err) { console.warn('QuemFaz avisos persistentes', err); }
      }
      const afterMap = requestStateMap();
      const after = requestStateSignature();
      if (before !== after) detectNotices(session, beforeMap, afterMap);
      if (currentPath() !== path) { pendingRefresh = false; return; }
      if (before === after && !pendingRefresh && !serverNoticesChanged) return;
      if (userIsEditing()) { pendingRefresh = true; return; }
      pendingRefresh = false;
      const found = matchRoute(path);
      const freshSession = currentSession();
      const freshUser = currentUser();
      if (found && freshSession && freshUser) {
        renderApp(found, freshUser, freshSession);
        requestAnimationFrame(function () { window.scrollTo(0, y); });
      }
    } catch (err) {
      console.warn('QuemFaz atualização em tempo real', err);
    } finally {
      liveCallsBusy = false;
    }
  }, 4000);

  function isDemoMode() { try { return new URLSearchParams(location.search).get('demo') === '1'; } catch (_) { return false; } }
  function renderConnectionError() {
    const shell = document.getElementById('app-shell');
    shell.innerHTML = '<div class="qf-conn-error"><img src="./icon.svg" alt="QuemFaz" style="width:72px;height:72px;border-radius:18px;">' +
      '<h1 class="h2">Sem conexão com o QuemFaz</h1><p class="text text--secondary" style="max-width:340px;">Não foi possível conectar ao servidor. Verifique sua internet e tente novamente.</p>' +
      '<button class="btn btn--primary" style="max-width:320px;" id="qf-retry">' + icon('refresh') + ' Tentar novamente</button></div>';
    document.getElementById('qf-retry').onclick = function () { location.reload(); };
  }

  window.addEventListener('DOMContentLoaded', async function () {
    DB.load();
    if (global.QFApp) global.QFApp.registerSW();
    if (!(global.QFCloud && global.QFCloud.enabled) && !isDemoMode()) {
      // V10.2: sem a biblioteca do Supabase o app NÃO cai mais em dados de demonstração.
      renderConnectionError();
      global.addEventListener('online', function () { location.reload(); }, { once: true });
      return;
    }
    if (global.QFCloud && global.QFCloud.enabled) global.QFCloud.prepareLocalState();
    await route();
    try {
      if (sessionStorage.getItem('qf_password_recovery') === '1' && global.QFPasswordRecovery) {
        global.QFPasswordRecovery.openNewPassword();
      }
    } catch (_) {}
    if (global.QFApp) global.QFApp.checkVersion(true).catch(function () {});
    if (global.QFPush) global.QFPush.restore().catch(function () {});
  });

  async function refreshNow() {
    if (!(global.QFCloud && global.QFCloud.enabled) || liveCallsBusy) return;
    const session = currentSession();
    if (!session) return;
    liveCallsBusy = true;
    const path = currentPath();
    const beforeMap = requestStateMap();
    const before = requestStateSignature();
    try {
      await global.QFCloud.syncForCurrentSession(true);
      const after = requestStateSignature();
      if (before !== after) detectNotices(session, beforeMap, requestStateMap());
      if (before !== after && currentPath() === path && !userIsEditing()) {
        const found = matchRoute(path); const u = currentUser(); const s2 = currentSession();
        if (found && u && s2 && found.route.role) renderApp(found, u, s2);
      }
    } catch (err) { console.warn('QuemFaz atualização', err); }
    finally { liveCallsBusy = false; }
