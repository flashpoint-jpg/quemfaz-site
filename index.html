  function login(role, email, senha) {
    const u = findUserByEmail(role, email);
    if (!u) return { ok: false, error: 'E-mail não encontrado.' };
    if (u.senha !== senha) return { ok: false, error: 'Senha incorreta.' };
    if (u.bloqueado) return { ok: false, error: 'Este acesso foi bloqueado pelo administrador.' };
    const sess = { role: role, userId: u.id };
    setSession(sess);
    return { ok: true, user: u, session: sess };
  }

  function logout() { setSession(null); }

  // ---------------------------------------------------------------
  // Fluxo do pedido — Cliente
  // ---------------------------------------------------------------

  function criarPedido(data) {
    const req = {
      id: PU.uid('req'), clienteId: data.clienteId, categoriaId: data.categoriaId,
      descricao: data.descricao, fotos: data.fotos || [], endereco: data.endereco, cidadeId: data.endereco.cidadeId,
      status: STATUS.BUSCANDO, profissionalId: null,
      criadoEm: nowIso(), atualizadoEm: nowIso(),
      // Prioridade nunca é concedida gratuitamente. No modo offline ela fica apenas solicitada/pending.
      prioridade: false,
      pagamentoPrioridade: data.prioridade ? { status: 'pendente', valor: state.settings.prioridadeCliente || 690, metodo: data.prioridadeMetodo || 'pix', criadoEm: nowIso() } : null,
      leadUnlock: null,
      taxaVisita: 0, orcamento: null, pagamento: null, avaliacaoCliente: null, avaliacaoProfissional: null,
      recusadoPor: [], canceladoPor: null, motivoCancelamento: null,
      historico: [historicoItem(data.prioridade ? 'Pedido criado; prioridade aguardando pagamento' : 'Pedido criado gratuitamente')],
    };
    state.requests.push(req);
    persist();
    return req;
  }

  function buscarProfissional(requestId) {
    const req = requestById(requestId);
    if (!req) return null;
    const excluidos = req.recusadoPor || [];
    const candidatos = state.users.profissionais.filter(function (p) {
      return p.statusAprovacao === 'aprovado' && p.online && !p.bloqueado &&
        p.categorias.indexOf(req.categoriaId) !== -1 &&
        excluidos.indexOf(p.id) === -1;
    });

    req.profissionalId = null;
    req.atualizadoEm = nowIso();
    if (!candidatos.length) {
      req.status = STATUS.SEM_PROFISSIONAL;
      req.historico.push(historicoItem('Nenhum profissional disponível no momento'));
    } else {
      req.status = STATUS.BUSCANDO;
      req.historico.push(historicoItem('Chamado publicado para ' + candidatos.length + ' profissional(is) disponível(is)'));
    }
    persist();
    return req;
  }

  function desbloquearChamado(requestId, profissionalId) {
    const req = requestById(requestId);
    const prof = profissionalById(profissionalId);
    if (!req || !prof) return { ok: false, reason: 'nao_encontrado' };
    if (req.status !== STATUS.BUSCANDO || req.profissionalId) return { ok: false, reason: 'indisponivel' };
    if (prof.statusAprovacao !== 'aprovado' || !prof.online || prof.bloqueado || prof.categorias.indexOf(req.categoriaId) === -1) {
      return { ok: false, reason: 'nao_elegivel' };
    }
    const valor = leadFeeForRequest(req);
    const saldo = Number(prof.creditos || 0);
    const primeiraGratis = false;
    if (!primeiraGratis && saldo < valor) return { ok: false, reason: 'saldo', valor: valor, saldo: saldo };

    if (!primeiraGratis) prof.creditos = saldo - valor;
    prof.bonusDesbloqueios = 0;

    req.profissionalId = profissionalId;
    req.leadUnlock = {
      profissionalId: profissionalId,
      valor: primeiraGratis ? 0 : valor,
      valorTabela: valor,
      forma: primeiraGratis ? 'bonus' : 'creditos',
      status: 'pago',
      criadoEm: nowIso()
    };
    req.status = STATUS.AGUARDANDO_ORCAMENTO;
    req.atualizadoEm = nowIso();
    req.historico.push(historicoItem(
      primeiraGratis
        ? prof.nome + ' usou o primeiro desbloqueio grátis'
        : prof.nome + ' desbloqueou o chamado por ' + PU.formatCurrency(valor)
    ));
    state.transactions.push({
      id: PU.uid('tx'), profissionalId: profissionalId, requestId: requestId,
      tipo: primeiraGratis ? 'bonus' : 'debito',
      valor: valor, valorTabela: valor, status: 'pago', criadoEm: nowIso(),
      descricao: primeiraGratis
        ? 'Primeiro desbloqueio grátis'
        : 'Desbloqueio de chamado de ' + ((categoryById(req.categoriaId) || {}).nome || 'serviço'),
    });
    persist();
    return {
      ok: true, request: req, valor: primeiraGratis ? 0 : valor, valorTabela: valor,
      usouBonus: primeiraGratis, saldo: prof.creditos, bonusDesbloqueios: 0
    };
  }

  function recarregarCreditos(profissionalId, valor, metodo) {
    const prof = profissionalById(profissionalId);
    valor = Number(valor) || 0;
    if (!prof || valor <= 0) return null;
    metodo = metodo || 'Pix';
    prof.creditos = Number(prof.creditos || 0) + valor;
    state.transactions.push({
      id: PU.uid('tx'), profissionalId: profissionalId, requestId: null, tipo: 'recarga', status: 'pago', metodo: metodo,
      valor: valor, criadoEm: nowIso(), descricao: 'Recarga via ' + metodo,
    });
    persist();
    return prof.creditos;
  }

  function criarRecargaPendente(profissionalId, valor, metodo) {
    const prof = profissionalById(profissionalId);
    valor = Number(valor) || 0;
    if (!prof || valor <= 0) return null;
    const tx = {
      id: PU.uid('tx'), profissionalId: profissionalId, requestId: null, tipo: 'recarga_pendente', status: 'pendente',
      metodo: metodo || 'Boleto', valor: valor, criadoEm: nowIso(), descricao: 'Recarga via ' + (metodo || 'Boleto') + ' — aguardando compensação'
    };
    state.transactions.push(tx);
    persist();
    return tx;
  }

  function confirmarRecargaPendente(transactionId) {
    const tx = state.transactions.find(function (t) { return t.id === transactionId; });
    if (!tx || tx.tipo !== 'recarga_pendente' || tx.status !== 'pendente') return null;
    const prof = profissionalById(tx.profissionalId);
    if (!prof) return null;
    prof.creditos = Number(prof.creditos || 0) + Number(tx.valor || 0);
    tx.tipo = 'recarga';
    tx.status = 'pago';
    tx.compensadoEm = nowIso();
    tx.descricao = 'Recarga via ' + (tx.metodo || 'Boleto');
    persist();
    return { transaction: tx, saldo: prof.creditos };
  }

  function cancelarPedido(requestId, por, motivo) {
    const req = requestById(requestId);
    if (!req) return null;
    req.status = STATUS.CANCELADO;

          latitude: enderecoCloud.latitude == null ? null : Number(enderecoCloud.latitude), longitude: enderecoCloud.longitude == null ? null : Number(enderecoCloud.longitude)
        }] : []
      };

    };
    DB.state.users.profissionais = [local];

  function applyCloudQuote(req, row) {
    if (!req || !row) return req;
    req.orcamento = {
      id: row.id,
      maoDeObra: Number(row.mao_obra_centavos || 0),
      material: Number(row.material_centavos || 0),
      total: Number(row.valor_centavos || 0),
      criadoEm: row.criado_em,
      atualizadoEm: row.atualizado_em || row.criado_em,
      status: row.status === 'aceito' ? 'aprovado' : (row.status === 'recusado' ? 'recusado' : 'pendente'),
      versao: 1,
      motivoRecusa: row.motivo_recusa || ''
    };
    req.taxaVisita = Number(row.taxa_visita_centavos || 0);

    // O status do chamado no banco continua sendo o macrofluxo. Enquanto está
    // em negociação, o orçamento define a etapa visual da linha do tempo.
    if (req.status === DB.STATUS.AGUARDANDO_ORCAMENTO) {
      if (row.status === 'enviado') req.status = DB.STATUS.ORCAMENTO_ENVIADO;
      else if (row.status === 'recusado') req.status = DB.STATUS.ORCAMENTO_RECUSADO;
      else if (row.status === 'aceito') req.status = DB.STATUS.APROVADO;
    }
    return req;
  }

  async function attachCallPhotos(reqs) {
    reqs = reqs || [];
    const ids = reqs.map(function (r) { return r.id; }).filter(Boolean);
    if (!ids.length) return reqs;
    const pRes = await client.rpc('qf_chamado_fotos', { p_ids: ids });
    if (pRes.error) throw pRes.error;
    const map = Object.create(null);
    (pRes.data || []).forEach(function (r) {
      map[r.chamado_id] = Array.isArray(r.fotos) ? r.fotos : [];
    });
    reqs.forEach(function (req) {
      if (Object.prototype.hasOwnProperty.call(map, req.id)) req.fotos = map[req.id];
    });
    return reqs;
  }

  async function attachLatestQuotes(reqs) {
    reqs = reqs || [];
    const ids = reqs.map(function (r) { return r.id; }).filter(Boolean);
    if (!ids.length) return reqs;
    const qRes = await client.from('qf_orcamentos')
      .select('id,chamado_id,profissional_id,valor_centavos,mao_obra_centavos,material_centavos,taxa_visita_centavos,status,motivo_recusa,criado_em,atualizado_em')
      .in('chamado_id', ids)
      .order('criado_em', { ascending: false });
    if (qRes.error) throw qRes.error;
    const latest = Object.create(null);
    (qRes.data || []).forEach(function (q) {
      if (!latest[q.chamado_id]) latest[q.chamado_id] = q;
    });
    reqs.forEach(function (req) {
      if (latest[req.id]) applyCloudQuote(req, latest[req.id]);
    });
    return reqs;
  }

  async function attachEvaluations(reqs) {
    reqs = reqs || [];
    const ids = reqs.map(function (r) { return r.id; }).filter(Boolean);
    if (!ids.length) return reqs;
    const aRes = await client.from('qf_avaliacoes')
      .select('id,chamado_id,cliente_id,profissional_id,nota,comentario,autor_tipo,criado_em')
      .in('chamado_id', ids)
      .order('criado_em', { ascending: false });
    if (aRes.error) throw aRes.error;
    (aRes.data || []).forEach(function (a) {
      const req = reqs.find(function (r) { return r.id === a.chamado_id; });
      if (!req) return;
      const local = { id: a.id, nota: Number(a.nota || 0), comentario: a.comentario || '', criadoEm: a.criado_em };
      if (a.autor_tipo === 'profissional') req.avaliacaoProfissional = local;
      else {
        req.avaliacaoCliente = local;
        if (req.status === DB.STATUS.SERVICO_CONCLUIDO || req.status === DB.STATUS.PAGO) req.status = DB.STATUS.FINALIZADO;
      }
    });
    return reqs;
  }

      });
    });
  }

  async function syncProfessionalCalls(userId) {
    const localProf = DB.profissionalById(userId);
    if (localProf && localProf.online) {
      try { await refreshProfessionalLocation(false); } catch (err) { console.warn('QuemFaz localização', err); }
    }
    const available = await client.rpc('qf_listar_chamados_disponiveis');
    if (available.error) throw available.error;
    const unlocked = await client.from('qf_chamados_desbloqueados').select('*').order('criado_em', { ascending: false });
    if (unlocked.error) throw unlocked.error;

    const reqs = [];
    (available.data || []).forEach(function (r) { reqs.push(requestFromCloud(r, null)); });
    (unlocked.data || []).forEach(function (r) {
      reqs.push(requestFromCloud(r, userId));
      if (r.cliente_id) {
        const existing = DB.state.users.clientes.find(function (u) { return u.id === r.cliente_id; });
        const clientLocal = {
          id: r.cliente_id,
          nome: r.cliente_nome || 'Cliente',
          email: '',
          telefone: r.cliente_telefone || r.cliente_whatsapp || '',
          bloqueado: false,
          criadoEm: r.criado_em,
          enderecos: []
        };
        if (existing) Object.assign(existing, clientLocal); else DB.state.users.clientes.push(clientLocal);
      }
    });
    await attachCallPhotos(reqs);
    await attachLatestQuotes(reqs);
    await attachEvaluations(reqs);
    DB.state.requests = reqs;
    rebuildCloudReviews(reqs, userId);

    const txRes = await client.from('qf_movimentacoes_carteira').select('*').eq('profissional_id', userId).order('criado_em', { ascending: false }).limit(100);
    const recRes = await client.from('qf_recargas')
      .select('id,profissional_id,valor_centavos,metodo,status,checkout_url,criado_em,aprovado_em')
      .eq('profissional_id', userId)
      .neq('status', 'aprovado')
      .order('criado_em', { ascending: false })
      .limit(50);
    if (!txRes.error) {
      DB.state.transactions = (txRes.data || []).map(function (t) {
        return {
          id: t.id,
          profissionalId: userId,
          requestId: t.referencia_tipo === 'chamado' ? t.referencia_id : null,
          tipo: t.tipo,
          status: 'pago',
          valor: Number(t.valor_centavos || 0),
          criadoEm: t.criado_em,
          descricao: t.descricao || 'Movimentação da carteira'
        };
      });
      if (!recRes.error) {
        (recRes.data || []).forEach(function (r) {
          const label = r.metodo === 'cartao' ? 'Cartão' : (r.metodo === 'boleto' ? 'Boleto' : 'Pix');
          DB.state.transactions.push({
            id: r.id,
            profissionalId: userId,
            requestId: null,
            tipo: 'recarga_pendente',
            status: r.status,
            valor: Number(r.valor_centavos || 0),
            metodo: label,
            criadoEm: r.criado_em,
            checkoutUrl: r.checkout_url || null,
            descricao: 'Recarga via ' + label
          });
        });
        DB.state.transactions.sort(function (a, b) { return new Date(b.criadoEm || 0) - new Date(a.criadoEm || 0); });
      }
    }
    DB.persist();
  }

  async function submitAd(dados) {
    if (!client) throw new Error('Conexão com o Supabase indisponível.');
    const sRes = await client.auth.getSession();
    if (sRes.error) throw sRes.error;
    if (!sRes.data.session) throw new Error('Entre na sua conta antes de anunciar. Cliente e profissional podem anunciar.');
    const res = await client.rpc('qf_enviar_anuncio', {
      p_empresa: String(dados.empresa || '').trim(),
      p_chamada: String(dados.chamada || '').trim(),
      p_regiao: dados.cidadeId || 'all',
      p_plano: dados.plano || 'local',
      p_imagem_data: dados.imagem || '',
      p_whatsapp: String(dados.whatsapp || '').trim(),
      p_link: String(dados.link || '').trim() || null,
      p_metodo: dados.formaPagamento || 'pix'
    });
    if (res.error) throw res.error;
    const out = res.data || {};
    if (!out.ok) throw new Error(out.reason || 'Não foi possível enviar o anúncio.');
    if (!out.pagamento_id) throw new Error('Pagamento do anúncio não foi criado.');
    const checkout = await startEfiCheckout('anuncio', out.pagamento_id);
    out.checkout_url = checkout.checkout_url || null;
    out.pix_copy_paste = checkout.pix_copy_paste || null;
    out.qr_image = checkout.qr_image || null;
    out.charge_id = checkout.charge_id || null;
    out.provider = checkout.provider || 'efi';
    out.pagamento_status = checkout.status || out.pagamento_status || 'pendente';
    await syncPublicAds();
    const ad = DB.anuncioById(out.anuncio_id);
    return { ad: ad, pagamento: out };
  }

  function pendingCpfKey(email) { return 'qf_pending_cpf_' + String(email || '').trim().toLowerCase(); }
  function pendingAddressKey(email) { return 'qf_pending_address_' + String(email || '').trim().toLowerCase(); }
  function pendingSelfieKey(email) { return 'qf_pending_selfie_' + String(email || '').trim().toLowerCase(); }
  async function saveCpf(cpf) {
    if (!client || !cpf) return null;
    const res = await client.rpc('qf_salvar_cpf', { p_cpf: String(cpf) });
    if (res.error) throw res.error;
    return res.data;
  }
  async function saveClientAddress(endereco) {
    if (!client) throw new Error('Conexão indisponível.');
    const uRes = await client.auth.getUser();
    if (uRes.error || !uRes.data.user) throw new Error('Entre na sua conta para salvar o endereço.');
    const e = endereco || {};
    const row = {
      user_id: uRes.data.user.id,
      cep: global.QFGeo ? global.QFGeo.normalizeCep(e.cep) : String(e.cep || '').replace(/\D/g,''),
      rua: String(e.rua || '').trim(), bairro: String(e.bairro || '').trim(),
      cidade: String(e.cidade || '').trim(), uf: String(e.uf || '').trim().toUpperCase(),
      complemento: String(e.complemento || '').trim() || null,
      latitude: (e.latitude !== null && e.latitude !== undefined && String(e.latitude).trim() !== '' && Number.isFinite(Number(e.latitude)) && Math.abs(Number(e.latitude)) <= 90) ? Number(e.latitude) : null,
      longitude: (e.longitude !== null && e.longitude !== undefined && String(e.longitude).trim() !== '' && Number.isFinite(Number(e.longitude)) && Math.abs(Number(e.longitude)) <= 180) ? Number(e.longitude) : null,
      atualizado_em: new Date().toISOString()
    };
    const res = await client.from('qf_enderecos').upsert(row, { onConflict: 'user_id' }).select('*').single();
    if (res.error) throw res.error;
    return res.data;
  }
  async function loadOwnAddress() {
    if (!client) return null;
    const uRes = await client.auth.getUser();
    if (uRes.error || !uRes.data.user) return null;
    const res = await client.from('qf_enderecos').select('*').eq('user_id', uRes.data.user.id).maybeSingle();
    if (res.error) throw res.error;
    return res.data || null;
  }
  async function applyPendingIdentity(email, role) {
    try {
      const k = pendingCpfKey(email); const cpf = localStorage.getItem(k);
      if (cpf) { await saveCpf(cpf); localStorage.removeItem(k); }
    } catch (e) { console.warn('QuemFaz CPF pendente', e); }
    try {
      const k2 = pendingAddressKey(email); const raw = localStorage.getItem(k2);
      if (raw) { await saveClientAddress(JSON.parse(raw)); localStorage.removeItem(k2); }
    } catch (e) { console.warn('QuemFaz endereço pendente', e); }
    try {
      const k3 = pendingSelfieKey(email); const selfie = localStorage.getItem(k3);
      if (selfie) {
        const uRes = await client.auth.getUser();
        if (uRes && uRes.data && uRes.data.user) {
          const up = await client.from('qf_profiles').update({ foto_url: selfie, atualizado_em: new Date().toISOString() }).eq('id', uRes.data.user.id);
          if (up.error) throw up.error;
          localStorage.removeItem(k3);
        }
      }
    } catch (e) { console.warn('QuemFaz selfie pendente', e); }
    try {
      const rawMarketing = localStorage.getItem('qf_marketing_attribution');
      if (rawMarketing && (role === 'cliente' || role === 'profissional')) {
        const marketing = JSON.parse(rawMarketing);
        const uRes = await client.auth.getUser();

          const row = {
            user_id: uRes.data.user.id,
            role: role,
            source: String(marketing.source || '').slice(0, 120) || null,
            medium: String(marketing.medium || '').slice(0, 120) || null,
            campaign: String(marketing.campaign || '').slice(0, 240) || null,
            content: String(marketing.content || '').slice(0, 240) || null,
            term: String(marketing.term || '').slice(0, 240) || null,
            click_id: String(marketing.click_id || '').slice(0, 512) || null,
            landing_url: String(marketing.landing_url || '').slice(0, 2000) || null,
            referrer: String(marketing.referrer || '').slice(0, 2000) || null,
            first_seen_at: marketing.first_seen_at || new Date().toISOString(),

          };
          const mr = await client.from('qf_marketing_attribution').upsert(row, { onConflict: 'user_id' });

  // V11.1: consulta leve para o profissional (só ids/status); a sincronização completa roda quando algo muda.
  async function professionalQuickSignature() {
    if (!client) return null;
    const res = await Promise.all([
      client.rpc('qf_listar_chamados_disponiveis'),
      client.from('qf_chamados_desbloqueados').select('id,status,atualizado_em')
    ]);
    if (res[0].error) throw res[0].error;
    if (res[1].error) throw res[1].error;
    const a = (res[0].data || []).map(function (r) { return r.id + ':' + r.status; }).sort();
    const u = (res[1].data || []).map(function (r) { return r.id + ':' + r.status + ':' + (r.atualizado_em || ''); }).sort();
    return a.join(',') + '|' + u.join(',');
  }

  async function syncForCurrentSession(force) {
    if (!enabled) return null;
    prepareLocalState();
    if (syncing) return syncing;
    if (!force && Date.now() - lastSyncAt < 1200) return DB.getSession();
    syncing = (async function () {
      try {
        await syncPublicAds();
        const sRes = await client.auth.getSession();
        if (sRes.error) throw sRes.error;
        const sbSession = sRes.data.session;
        if (!sbSession) {
          DB.setSession(null);
          clearRuntimeData();
          return null;
        }
        const user = sbSession.user;
        const profile = await ensureProfile(user, null, null);
        const role = profile.tipo;
        await applyPendingIdentity(user.email || '', role);
        const localUser = await syncLocalUser(user, role);
        DB.setSession({ role: role, userId: user.id });
        if (role === 'cliente') await syncClientCalls(user.id);
        if (role === 'profissional') await syncProfessionalCalls(user.id);
        lastSyncAt = Date.now();
        return { role: role, userId: user.id, user: localUser };
      } finally {
        syncing = null;
      }
    })();
    return syncing;
  }

  function traduzErroAuth(msg) {
    msg = String(msg || '');
    if (/already registered|already exists/i.test(msg)) return 'Este e-mail já está cadastrado. Entre na sua conta.';
    if (/at least 6/i.test(msg)) return 'A senha precisa ter pelo menos 6 caracteres.';
    if (/invalid email|valid email/i.test(msg)) return 'Digite um e-mail válido.';
    if (/rate limit|too many/i.test(msg)) return 'Muitas tentativas. Aguarde um minuto e tente novamente.';
    return msg || 'Não foi possível criar a conta.';
  }
  async function signUp(role, data) {
    if (!enabled) return { ok: false, error: 'Não foi possível carregar a conexão com o banco.' };
    if (String(data.senha || '').length < 6) return { ok: false, error: 'A senha precisa ter pelo menos 6 caracteres.' };
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(data.email || ''))) return { ok: false, error: 'Digite um e-mail válido.' };
    if (!String(data.nome || '').trim()) return { ok: false, error: 'Informe seu nome.' };
    if (role === 'profissional' && !/^data:image\//i.test(String(data.selfieData || ''))) {
      return { ok: false, error: 'É obrigatório enviar uma selfie do profissional ou a marca oficial da empresa representada.' };
    }
    const city = data.cidadeId ? cityFromId(data.cidadeId) : null;
    const cityName = String(data.cidade || (city ? city.nome : '') || '').trim() || null;
    const cityUf = String(data.uf || (city ? city.uf : '') || '').trim().toUpperCase() || null;
    const meta = {
      qf_role: role,
      qf_nome: data.nome,
      qf_telefone: data.telefone || '',
      qf_cidade: cityName,
      qf_uf: cityUf,
      qf_categorias: data.categorias || [],
      qf_raio_km: data.raioKm || 10
    };
    if (data.cpf) { try { localStorage.setItem(pendingCpfKey(data.email), data.cpf); } catch (_) {} }
    if (data.endereco) { try { localStorage.setItem(pendingAddressKey(data.email), JSON.stringify(data.endereco)); } catch (_) {} }
    if (role === 'profissional' && data.selfieData) {
      try { localStorage.setItem(pendingSelfieKey(data.email), data.selfieData); } catch (_) {}
    }
    const res = await client.auth.signUp({
      email: data.email,
      password: data.senha,
      options: { data: meta }
    });
    if (res.error) return { ok: false, error: traduzErroAuth(res.error.message) };
    if (!res.data.session) {
      return { ok: true, needsConfirmation: true, user: res.data.user };
    }
    try {
      await ensureProfile(res.data.user, role, data);
      await applyPendingIdentity(data.email, role);
      const local = await syncLocalUser(res.data.user, role);
      DB.setSession({ role: role, userId: res.data.user.id });      if (role === 'cliente') await syncClientCalls(res.data.user.id); else await syncProfessionalCalls(res.data.user.id);
      return { ok: true, user: local, session: DB.getSession() };
    } catch (e) {
      return { ok: false, error: e.message || String(e) };
    }
  }

  async function signIn(expectedRole, email, senha) {
    if (!enabled) return { ok: false, error: 'Não foi possível carregar a conexão com o banco.' };
    const res = await client.auth.signInWithPassword({ email: email, password: senha });
    if (res.error) return { ok: false, error: 'E-mail ou senha inválidos.' };
    try {
      const p = await ensureProfile(res.data.user, expectedRole, null);
      await applyPendingIdentity(email, p.tipo);
      if (p.tipo !== expectedRole) {
        await client.auth.signOut();
        DB.setSession(null);
        return { ok: false, error: 'Esta conta está cadastrada como ' + (p.tipo === 'cliente' ? 'cliente' : 'profissional') + '.' };
      }
      const local = await syncLocalUser(res.data.user, p.tipo);
      DB.setSession({ role: p.tipo, userId: res.data.user.id });
      if (p.tipo === 'cliente') await syncClientCalls(res.data.user.id); else await syncProfessionalCalls(res.data.user.id);
      lastSyncAt = Date.now();
      return { ok: true, user: local, session: DB.getSession() };
    } catch (e) {
      return { ok: false, error: e.message || String(e) };
    }
  }

  async function requestPasswordReset(email) {
    if (!enabled || !client) return { ok: false, error: 'Não foi possível carregar a conexão com o banco.' };
    email = String(email || '').trim();
    if (!email || email.indexOf('@') < 1 || email.indexOf('.') < 3) return { ok: false, error: 'Digite um e-mail válido.' };
    const redirectTo = location.origin + location.pathname;
    const res = await client.auth.resetPasswordForEmail(email, { redirectTo: redirectTo });
    if (res.error) {
      const msg = String(res.error.message || '');
      if (/rate limit|too many/i.test(msg)) return { ok: false, error: 'Muitas tentativas. Aguarde um minuto e tente novamente.' };
      return { ok: false, error: 'Não foi possível enviar o link agora. Tente novamente.' };
    }
    return { ok: true };
  }

  async function updatePassword(newPassword) {
    if (!enabled || !client) return { ok: false, error: 'Não foi possível carregar a conexão com o banco.' };
    newPassword = String(newPassword || '');

  async function startEfiCheckout(tipo, pagamentoId) {
    const sess = DB.getSession();
    const route = tipo === 'prioridade'
      ? '#/cliente/pedidos'
      : (tipo === 'recarga'
        ? '#/profissional/carteira'
        : (sess && sess.role === 'profissional' ? '#/profissional/home' : '#/cliente/home'));
    const returnUrl = location.origin + location.pathname + route;
    const fn = await client.functions.invoke('quemfaz-efi-checkout', {
      body: { tipo: tipo, pagamento_id: pagamentoId, return_url: returnUrl }
    });
    if (fn.error) throw new Error(fn.error.message || 'Não foi possível iniciar o pagamento.');
    const out = fn.data || {};
    if (!out.ok) {
      if (out.error === 'efi_not_configured') throw new Error('Efí Bank ainda não está configurado no servidor.');
      throw new Error(out.error || 'Não foi possível gerar o checkout.');
    }
    return out;
  }

  async function createRecharge(valorCentavos, metodo) {
    const pay = await client.rpc('qf_solicitar_recarga', {
      p_valor_centavos: Number(valorCentavos),
      p_metodo: metodo || 'pix'
    });
    if (pay.error) throw pay.error;
    const row = pay.data || {};
    if (!row.recarga_id) throw new Error('A recarga não foi criada.');
    const checkout = await startEfiCheckout('recarga', row.recarga_id);
    return {
      id: row.recarga_id,
      status: row.status || 'pendente',
      valor: Number(row.valor_centavos || valorCentavos || 0),
      metodo: row.metodo || metodo || 'pix',
      checkoutUrl: checkout.checkout_url || null,
      checkoutId: checkout.checkout_id || null
    };
  }

  async function createCall(data) {
    const city = cityFromId(data.endereco.cidadeId);
    const cat = DB.categoryById(data.categoriaId);
    const enderecoCompleto = [data.endereco.rua, data.endereco.complemento].filter(Boolean).join(' · ');
    const rawLat = data.endereco.latitude;
    const rawLng = data.endereco.longitude;
    const hasAddressCoords =
      rawLat !== null && rawLat !== undefined && String(rawLat).trim() !== '' &&
      rawLng !== null && rawLng !== undefined && String(rawLng).trim() !== '' &&
      Number.isFinite(Number(rawLat)) && Number.isFinite(Number(rawLng)) &&
      Math.abs(Number(rawLat)) <= 90 && Math.abs(Number(rawLng)) <= 180 &&
      !(Number(rawLat) === 0 && Number(rawLng) === 0);
    const loc = hasAddressCoords
      ? { latitude: Number(rawLat), longitude: Number(rawLng) }
      : await getCurrentPositionSafe({ timeout: 7000, maximumAge: 20000 });
    // O chamado nasce NORMAL. Prioridade só é ativada no banco depois de pagamento aprovado.
    const row = {
      cliente_id: data.clienteId,
      categoria: data.categoriaId,
      titulo: cat ? cat.nome : 'Serviço solicitado',
      descricao: data.descricao,
      cidade: data.endereco.cidade || (city ? city.nome : null),
      uf: data.endereco.uf || (city ? city.uf : null),
      bairro: data.endereco.bairro || null,
      cep: global.QFGeo ? global.QFGeo.normalizeCep(data.endereco.cep) : String(data.endereco.cep || '').replace(/\D/g,''),
      endereco_completo: enderecoCompleto || null,
      latitude: loc ? loc.latitude : null,
      longitude: loc ? loc.longitude : null,
      fotos: Array.isArray(data.fotos) ? data.fotos.slice(0, 4) : [],
      status: 'aberto',
      prioridade: false
    };
    const res = await client.from('qf_chamados').insert(row).select('*').single();
    if (res.error) throw res.error;
    await client.from('qf_profiles').update({ cidade: row.cidade, uf: row.uf, atualizado_em: new Date().toISOString() }).eq('id', data.clienteId);
    try { await saveClientAddress(Object.assign({}, data.endereco, { latitude: row.latitude, longitude: row.longitude })); } catch (_) {}
    const req = requestFromCloud(res.data, null);
    req.fotos = Array.isArray(data.fotos) ? data.fotos.slice(0, 4) : [];

    if (data.prioridade) {
      const pay = await client.rpc('qf_solicitar_prioridade', {
        p_chamado_id: res.data.id,
        p_metodo: data.prioridadeMetodo || 'pix'
      });
      if (pay.error) {
        req.pagamentoPrioridade = { status: 'erro', valor: DB.state.settings.prioridadeCliente || 690, erro: pay.error.message };
      } else {
        const out = pay.data || {};
        req.pagamentoPrioridade = {
          id: out.pagamento_id || null,
          status: out.status || 'pendente',
          valor: Number(out.valor_centavos || DB.state.settings.prioridadeCliente || 690),
          checkoutUrl: out.checkout_url || null,
          criadoEm: new Date().toISOString()
        };
        req.prioridade = !!out.prioridade_ativa;
        if (!req.prioridade && req.pagamentoPrioridade.id && !req.pagamentoPrioridade.checkoutUrl) {
          try {
            const checkout = await startEfiCheckout('prioridade', req.pagamentoPrioridade.id);
            req.pagamentoPrioridade.checkoutUrl = checkout.checkout_url || null;
          } catch (checkoutErr) {
            req.pagamentoPrioridade.erro = checkoutErr && checkoutErr.message ? checkoutErr.message : String(checkoutErr || '');
          }
        }
      }
    }

    DB.state.requests = DB.state.requests.filter(function (x) { return x.id !== req.id; });
    DB.state.requests.unshift(req);
    const localClient = DB.clienteById(data.clienteId);
    if (localClient) localClient.enderecos = [data.endereco];
    DB.persist();
    if (global.QFPush) {
      try { await global.QFPush.notify('new_call', req.id); }
      catch (pushErr) { console.warn('QuemFaz push do novo chamado', pushErr); }
    }
    return req;
  }

  async function unlockCall(chamadoId, profissionalId) {
    const res = await client.rpc('qf_desbloquear_chamado', { p_chamado_id: chamadoId });
    if (res.error) return { ok: false, reason: 'erro', error: res.error.message };
    const out = res.data || {};
    if (!out.ok) {
      if (out.reason === 'saldo_insuficiente') {
        return { ok: false, reason: 'saldo', valor: Number(out.preco_centavos || 0), saldo: Number(out.saldo_centavos || 0) };
      }
      return { ok: false, reason: out.reason || 'indisponivel' };
    }
    const uRes = await client.auth.getUser();
    if (uRes.error || !uRes.data || !uRes.data.user) {
      return { ok: false, reason: 'sessao', error: 'Sessão expirada. Entre novamente.' };
    }
    await syncLocalUser(uRes.data.user, 'profissional');
    await syncProfessionalCalls(profissionalId);
    const req = DB.requestById(chamadoId);
    const prof = DB.profissionalById(profissionalId);
    if (global.QFPush) global.QFPush.notify('professional_connected', chamadoId).catch(function () {});
    return {
      ok: true,
      request: req,
      valor: Number(out.preco_centavos || 0),
      valorTabela: Number(out.preco_tabela_centavos || out.preco_centavos || 0),
      usouBonus: out.usou_bonus === true || out.origem === 'bonus',
      saldo: prof ? Number(prof.creditos || 0) : Number(out.saldo_centavos || 0),
      bonusDesbloqueios: 0
    };
  }

      const pf = await client.from('qf_profiles').select('foto_url').eq('id', uRes.data.user.id).single();

  async function saveProfessionalSettings(categorias, areas) {
    const uRes = await client.auth.getUser();
    if (uRes.error || !uRes.data.user) throw new Error('Sessão expirada.');
    const uid = uRes.data.user.id;
    const cleanAreas = (areas || []).map(function (a) {
      return {
        cidade: String(a.cidade || '').trim(),
        uf: String(a.uf || '').trim().toUpperCase(),
        raioKm: Math.max(1, Math.min(300, Number(a.raioKm || 10)))
      };
    }).filter(function (a) { return a.cidade && a.uf; });
    if (!cleanAreas.length) throw new Error('Adicione pelo menos uma cidade de atendimento.');

    const pr = await client.from('qf_profissionais').update({
      especialidades: Array.isArray(categorias) ? categorias : [],
      raio_km: cleanAreas[0].raioKm,
      atualizado_em: new Date().toISOString()
    }).eq('user_id', uid);
    if (pr.error) throw pr.error;

    const del = await client.from('qf_profissional_cidades').delete().eq('profissional_id', uid);
    if (del.error) throw del.error;
    const ins = await client.from('qf_profissional_cidades').insert(cleanAreas.map(function (a) {
      return { profissional_id: uid, cidade: a.cidade, uf: a.uf, raio_km: a.raioKm };
    }));
    if (ins.error) throw ins.error;

    const first = cleanAreas[0];
    const prof = await client.from('qf_profiles').update({
      cidade: first.cidade,
      uf: first.uf,
      atualizado_em: new Date().toISOString()
    }).eq('id', uid);
    if (prof.error) throw prof.error;

    const local = await syncLocalUser(uRes.data.user, 'profissional');
    if (local.online) await syncProfessionalCalls(uid);
    return local;
  }

  async function saveProfessionalSelfie(dataUrl) {
    const uRes = await client.auth.getUser();

    const uid = uRes.data.user.id;
    if (!/^data:image\//i.test(String(dataUrl || ''))) throw new Error('Foto inválida.');
    if (String(dataUrl).length > 900000) throw new Error('A selfie ficou muito grande. Tire outra foto.');
    const res = await client.from('qf_profiles').update({ foto_url: dataUrl, atualizado_em: new Date().toISOString() }).eq('id', uid);
    if (res.error) throw res.error;
    const local = await syncLocalUser(uRes.data.user, 'profissional');
    return local;
  }

  async function cancelProfessionalCall(chamadoId, motivo) {
    const res = await client.rpc('qf_profissional_cancelar_chamado', { p_chamado_id: chamadoId, p_motivo: motivo || null });
    if (res.error) {
      if (/function|does not exist|not find/i.test(res.error.message || '')) throw new Error('Atualize o banco (migration V10.2) para cancelar pelo app.');
      throw res.error;
    }
    const out = res.data || {};
    if (!out.ok) throw new Error(out.reason || 'Não foi possível cancelar o serviço.');

/* QuemFaz — telas da área Cliente */

(function (global) {

  function hiddenHistoryKey(role, userId) { return 'quemfaz_hidden_history_v1_' + role + '_' + userId; }
  function loadHiddenHistory(role, userId) {
    try { return JSON.parse(localStorage.getItem(hiddenHistoryKey(role, userId)) || '[]') || []; } catch (_) { return []; }
  }
  function hideHistoryItem(role, userId, requestId) {
    const ids = loadHiddenHistory(role, userId);

  }

  function statusBadge(status) {

  }

  function renderCategoryBrowser(cats) {
    const groupOrder = [['casa','Casa e manutenção'],['auto','Automotivo e transporte'],['tecnica','Assistência técnica'],['pessoas','Cuidados e pessoas'],['outros','Outros']];
    const filters = [['todos','Todos']].concat(groupOrder);
    function norm(v){return String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();}
    const popularNames=['Montador de móveis','Encanador','Eletricista','Diarista','Marido de aluguel','Pintor'];
    const popular=popularNames.map(function(name){return cats.find(function(c){return norm(c.nome)===norm(name);});}).filter(Boolean).slice(0,6);

            '<div class="text--sm text--secondary">' + (cloudMode ? 'Profissionais da sua região recebem o chamado na hora' : disponiveis.length + ' profissional' + (disponiveis.length === 1 ? '' : 'is') + ' online agora') + '</div>' +

    return s + '</span>';
  }

  // ---------------- Lista de pedidos ----------------

  Screens.clientePedidosRender = function (params, user) {
    const hidden = loadHiddenHistory('cliente', user.id);
    const all = DB.requestsByCliente(user.id);
    const ativos = all.filter(function (r) { return ACTIVE_STATUSES.indexOf(r.status) !== -1; });
    const historico = all.filter(function (r) { return ACTIVE_STATUSES.indexOf(r.status) === -1 && hidden.indexOf(r.id) === -1; });
    if (!ativos.length && !historico.length) {
      return '<div class="view">' + emptyPedidos() + '</div>';
    }
    return (
      '<div class="view">' +
        (ativos.length ? '<div class="section"><div class="section-head"><h2 class="h3">Em andamento</h2></div><div class="stack--sm">' + ativos.map(pedidoCard).join('') + '</div></div>' : '') +
        (historico.length ? '<div class="section"><div class="section-head"><h2 class="h3">Histórico</h2></div><div class="stack--sm">' + historico.map(function (r) {
          return '<div class="history-entry">' + pedidoCard(r) +
            '<button class="history-delete" type="button" data-hide-pedido="' + PU.escapeHtml(r.id) + '" aria-label="Excluir pedido do histórico" title="Excluir do histórico">' + icon('xCircle') + '</button></div>';
        }).join('') + '</div></div>' : '') +
      '</div>'
    );

    return '<div class="empty-state">' +
      '<div class="icon-tile icon-tile--lg icon-tile--ghost">' + icon('clipboard') + '</div>' +
      '<h2 class="h3">Nenhum pedido ainda</h2>' +
      '<p class="text text--secondary">Escolha uma categoria na Início para solicitar seu primeiro serviço.</p>' +
      '<button class="btn btn--primary btn--block-auto" data-nav="/cliente/home" style="margin-top:6px;">Ver categorias</button>' +

  // ---------------- Detalhe / acompanhamento do pedido ----------------

  Screens.clientePedidoDetalheRender = function (params, user) {
    const req = DB.requestById(params.id);
    if (!req || req.clienteId !== user.id) return '<div class="view"><p class="text">Pedido não encontrado.</p></div>';
    const cat = DB.categoryById(req.categoriaId);
    const prof = req.profissionalId ? DB.profissionalById(req.profissionalId) : null;

    return (
      '<div class="view" data-request-id="' + req.id + '">' +
        '<div class="row-between">' +
          '<div class="row">' +
            '<div class="icon-tile">' + icon(cat ? cat.icon : 'tag') + '</div>' +
            '<div class="h3">' + PU.escapeHtml(cat ? cat.nome : 'Serviço') + '</div>' +
          '</div>' +
          '<div class="row" style="gap:6px;">' + (req.prioridade ? '<span class="badge badge--orange"><span class="badge__dot"></span>Prioritário</span>' : '') + statusBadge(req.status) + '</div>' +
        '</div>' +

        buscandoBlock(req) +
        semProfissionalBlock(req) +
        profissionalEncontradoBlock(req, prof) +
        orcamentoBlock(req, prof) +
        avaliacaoBlock(req, prof) +
        canceladoBlock(req) +

        '<div class="section">' +
          '<div class="section-head"><h2 class="h3">Detalhes</h2></div>' +
          '<div class="card stack--sm">' +
            '<div class="text text--sm text--secondary">' + PU.escapeHtml(req.descricao) + '</div>' +
            (req.fotos && req.fotos.length ? '<div class="upload-row">' + req.fotos.map(renderCallMedia).join('') + '</div>' : '') +
            '<hr class="hairline">' +
            '<div class="row text--sm text--secondary">' + icon('mapPin', 'list-item__chevron') + '<span>' + PU.escapeHtml(req.endereco.rua) + ', ' + PU.escapeHtml(req.endereco.bairro) + '</span></div>' +
          '</div>' +
        '</div>' +

        statusTrackSection(req) +

        (canCancel(req.status)
          ? '<div class="section"><button class="btn btn--danger-ghost" data-action="cancelar-pedido">' + icon('xCircle') + ' Cancelar pedido</button></div>'
          : '') +
        (req.status === STATUS.CANCELADO
          ? '<div class="section"><button class="btn btn--primary" data-action="refazer-pedido">' + icon('refresh') + ' Refazer o mesmo pedido</button><div class="text--sm text--secondary" style="margin-top:7px;">Descrição, endereço e mídias serão reaproveitados. Você pode revisar antes de publicar.</div></div>'
          : '') +
      '</div>'
    );
  };

  function canCancel(status) {
    return [STATUS.BUSCANDO, STATUS.SEM_PROFISSIONAL, STATUS.AGUARDANDO_ACEITE, STATUS.AGUARDANDO_ORCAMENTO, STATUS.ORCAMENTO_ENVIADO, STATUS.ORCAMENTO_RECUSADO, STATUS.APROVADO].indexOf(status) !== -1;
  }

  function buscandoBlock(req) {
    if (req.status !== STATUS.BUSCANDO && req.status !== STATUS.AGUARDANDO_ACEITE) return '';
    return (
      '<div class="section">' +
        '<div class="card" style="display:flex;flex-direction:column;align-items:center;text-align:center;padding:30px 16px;">' +
          '<div class="icon-tile icon-tile--lg icon-tile--orange">' + icon(req.prioridade ? 'bolt' : 'bell') + '</div>' +
          '<h2 class="h3" style="margin-top:14px;">' + (req.prioridade ? 'Chamado prioritário publicado' : 'Chamado publicado') + '</h2>' +
          '<p class="text text--secondary text--sm" style="margin-top:4px;">Profissionais compatíveis e mais próximos dentro da área escolhida podem visualizar o serviço. O primeiro que desbloquear o chamado será conectado a você.</p>' +
          '<div class="qf-call-reach" data-call-reach data-call-id="' + PU.escapeHtml(req.id) + '">Avisando os profissionais mais próximos…</div>' +
          (req.prioridade
            ? '<div class="badge badge--orange" style="margin-top:12px;"><span class="badge__dot"></span>Prioridade paga e ativa</div>'
            : (req.pagamentoPrioridade && req.pagamentoPrioridade.status === 'pendente'
              ? '<div class="badge badge--orange" style="margin-top:12px;"><span class="badge__dot"></span>Prioridade aguardando pagamento · ' + PU.formatCurrency(req.pagamentoPrioridade.valor || DB.state.settings.prioridadeCliente || 690) + '</div>'
              : '<div class="badge badge--success" style="margin-top:12px;"><span class="badge__dot"></span>Chamado normal gratuito</div>')) +
          (req.pagamentoPrioridade && req.pagamentoPrioridade.status === 'pendente' && req.pagamentoPrioridade.checkoutUrl
            ? '<a class="btn btn--primary btn--block-auto" href="' + PU.escapeHtml(req.pagamentoPrioridade.checkoutUrl) + '" rel="noopener" style="margin-top:12px;">' + icon('bolt') + ' Pagar prioridade</a>'
            : (req.pagamentoPrioridade && req.pagamentoPrioridade.status === 'pendente' && req.pagamentoPrioridade.id
              ? '<button class="btn btn--primary btn--block-auto" data-action="gerar-pagamento-prioridade" data-payment-id="' + PU.escapeHtml(req.pagamentoPrioridade.id) + '" style="margin-top:12px;">' + icon('bolt') + ' Gerar pagamento</button>'
              : '')) +
        '</div>' +
      '</div>'
    );
  }

  function semProfissionalBlock(req) {
    if (req.status !== STATUS.SEM_PROFISSIONAL) return '';
    return (
      '<div class="section">' +
        '<div class="card" style="text-align:center;padding:28px 16px;">' +
          '<div class="icon-tile icon-tile--ghost" style="margin:0 auto 12px;">' + icon('alertTriangle') + '</div>' +
          '<h2 class="h3">Nenhum profissional disponível agora</h2>' +
          '<p class="text text--secondary text--sm" style="margin-top:4px;">Tente novamente em instantes ou aguarde — avisamos assim que alguém ficar online.</p>' +
          '<button class="btn btn--primary" data-action="tentar-novamente" style="margin-top:14px;">' + icon('refresh') + ' Tentar novamente</button>' +
        '</div>' +
      '</div>'
    );
  }

  function whatsappHref(phone, message) {
    let d = String(phone || '').replace(/\D/g, '');
    if (!d) return '';
    if (d.length === 10 || d.length === 11) d = '55' + d;
    return 'https://wa.me/' + d + (message ? '?text=' + encodeURIComponent(message) : '');
  }
  global.QFUI = global.QFUI || {};
  global.QFUI.whatsappHref = whatsappHref;
  global.QFUI.telHref = telHref;
  global.QFUI.personAvatar = personAvatar;
  function telHref(phone) {
    let d = String(phone || '').replace(/\D/g, '');
    if (!d) return '';
    if (d.length === 10 || d.length === 11) d = '55' + d;
    return 'tel:+' + d;
  }
  function personAvatar(person, cls) {
    cls = cls || '';
    const photo = person && person.fotoUrl ? String(person.fotoUrl) : '';
    return '<div class="avatar ' + cls + '">' + (photo ? '<img src="' + PU.escapeHtml(photo) + '" alt="Foto de ' + PU.escapeHtml(person.nome || 'profissional') + '">' : PU.initials((person || {}).nome || '?')) + '</div>';
  }

  function profCard(prof, extra) {
    if (!prof) return '';
    const wa = whatsappHref(prof.telefone, 'Olá ' + (prof.nome || '') + ', estou falando pelo QuemFaz sobre meu chamado.');
    return (
      '<div class="card prof-safety-card">' +
        '<div class="row" style="align-items:flex-start;">' +
          personAvatar(prof, 'avatar--lg') +
          '<div class="spacer">' +
            '<div class="row" style="gap:7px;flex-wrap:wrap;"><div class="text--strong">' + PU.escapeHtml(prof.nome) + '</div>' +
              (prof.verificado ? '<span class="badge badge--success"><span class="badge__dot"></span>Verificado</span>' : (prof.fotoUrl ? '<span class="badge badge--warning"><span class="badge__dot"></span>Identificação cadastrada</span>' : '')) +
            '</div>' +
            '<div class="row text--sm text--secondary" style="gap:6px;margin-top:4px;">' + starsDisplay(prof.avaliacaoMedia) + '<span>' + (prof.avaliacaoMedia ? prof.avaliacaoMedia.toFixed(1) + ' · ' + prof.totalAvaliacoes + ' avaliações' : 'Novo na plataforma') + '</span></div>' +
            ((prof.cidadeNome || prof.uf) ? '<div class="text--sm text--secondary" style="margin-top:4px;">' + icon('mapPin', 'list-item__chevron') + ' ' + PU.escapeHtml([prof.cidadeNome, prof.uf].filter(Boolean).join(' · ')) + '</div>' : '') +
            '<div class="text--sm text--secondary" style="margin-top:4px;">Foto e dados do perfil exibidos para sua segurança.</div>' +
            (extra || '') +
          '</div>' +
        '</div>' +
        (wa ? '<div class="btn-row" style="margin-top:12px;"><a class="btn btn--whatsapp" data-contact="whatsapp" href="' + wa + '" target="_blank" rel="noopener">' + icon('whatsapp') + ' WhatsApp</a>' +
          '<a class="btn btn--outline" data-contact="ligar" href="' + telHref(prof.telefone) + '">' + icon('phoneCall') + ' Ligar</a></div>' : '') +
      '</div>'
    );
  }

  function profissionalEncontradoBlock(req, prof) {
    if (req.status !== STATUS.AGUARDANDO_ORCAMENTO) return '';
    return (
      '<div class="section">' +
        '<div class="section-head"><h2 class="h3">Profissional encontrado</h2></div>' +
        profCard(prof) +
        '<div class="card card--tight" style="margin-top:10px;background:var(--navy-100);border:none;">' +
          '<p class="text text--sm" style="color:var(--navy-800);">' + PU.escapeHtml((prof || {}).nome || 'O profissional') + ' aceitou seu chamado e está preparando o orçamento. Você será avisado assim que ele chegar.</p>' +
        '</div>' +
      '</div>'
    );
  }

  function orcamentoBlock(req, prof) {
    if (!req.orcamento) return '';
    if ([STATUS.ORCAMENTO_ENVIADO, STATUS.ORCAMENTO_RECUSADO, STATUS.APROVADO, STATUS.EM_ANDAMENTO, STATUS.SERVICO_CONCLUIDO].indexOf(req.status) === -1) return '';
    const o = req.orcamento;
    return (
      '<div class="section">' +
        '<div class="section-head"><h2 class="h3">Orçamento</h2></div>' +
        profCard(prof) +

                '<div class="status-step__title">' + s.title + '</div>' +
                (s.sub ? '<div class="status-step__sub">' + s.sub + (s.state === 'current' && s.working ? '<span class="status-step__waiting-dots" aria-hidden="true"><i></i><i></i><i></i></span>' : '') + '</div>' : '') +
                (s.state === 'current' && s.working ? '<div class="status-step__activity" aria-hidden="true"></div>' : '') +
              '</div>' +

  function buildTrackSteps(req) {
    if (req.status === STATUS.CANCELADO) {
      return [
        { title: 'Pedido criado', sub: PU.formatDateTime(req.criadoEm), state: 'done' },
        { title: 'Cancelado', sub: PU.formatDateTime(req.atualizadoEm), state: 'current' },
      ];
    }
    const order = [STATUS.BUSCANDO, STATUS.AGUARDANDO_ORCAMENTO, STATUS.ORCAMENTO_ENVIADO, STATUS.APROVADO, STATUS.EM_ANDAMENTO, STATUS.SERVICO_CONCLUIDO, STATUS.FINALIZADO];
    const titles = {
      buscando: 'Chamado publicado', aguardando_orcamento: 'Profissional conectado', orcamento_enviado: 'Orçamento enviado',
      aprovado: 'Orçamento aprovado', em_andamento: 'Serviço em andamento', servico_concluido: 'Serviço concluído',
      finalizado: 'Avaliação concluída',
    };
    const activity = {
      buscando: 'Buscando profissionais próximos',
      aguardando_orcamento: 'Profissional analisando sua solicitação',
      orcamento_enviado: 'Aguardando sua aprovação do orçamento',
      aprovado: 'Aprovado — aguardando início do serviço',
      em_andamento: 'Serviço em execução',
      servico_concluido: 'Aguardando sua avaliação',
      finalizado: 'Processo finalizado'
    };
    let effectiveStatus = req.status;
    if ([STATUS.AGUARDANDO_ACEITE, STATUS.SEM_PROFISSIONAL].indexOf(req.status) !== -1) effectiveStatus = STATUS.BUSCANDO;
    if (req.status === STATUS.ORCAMENTO_RECUSADO) effectiveStatus = STATUS.AGUARDANDO_ORCAMENTO;
    const idx = order.indexOf(effectiveStatus);
    const fluxoFinalizado = effectiveStatus === STATUS.FINALIZADO;
    return order.map(function (st, i) {
      const state = fluxoFinalizado ? 'done' : (i < idx ? 'done' : i === idx ? 'current' : 'pending');
      return {
        title: titles[st],
        sub: state === 'current' ? activity[st] : '',
        working: state === 'current' && !fluxoFinalizado,
        state: state
      };
    });
  }

  function bindCategoryBrowser(content) {
    const input = content.querySelector('[data-category-search]');
    const chips = Array.prototype.slice.call(content.querySelectorAll('[data-category-filter]'));
    const groups = Array.prototype.slice.call(content.querySelectorAll('[data-category-group]'));
    const tiles = Array.prototype.slice.call(content.querySelectorAll('.category-tile[data-cat-name]'));
    const empty = content.querySelector('[data-category-empty]');
    if (!input || !tiles.length) return;
    let active = 'todos';
    function norm(v) {
      return String(v || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
    }
    function apply() {
      const q = norm(input.value);
      let visible = 0;
      tiles.forEach(function (tile) {
        const byGroup = active === 'todos' || tile.getAttribute('data-cat-group') === active;
        const byText = !q || norm(tile.getAttribute('data-cat-name')).indexOf(q) !== -1;
        const show = byGroup && byText;
        tile.style.display = show ? '' : 'none';
        if (show) visible++;
      });
      groups.forEach(function (group) {
        const has = Array.prototype.some.call(group.querySelectorAll('.category-tile'), function (tile) { return tile.style.display !== 'none'; });
        group.style.display = has ? '' : 'none';
      });
      if (empty) empty.style.display = visible ? 'none' : 'block';
    }
    input.addEventListener('input', apply);
    chips.forEach(function (chip) {
      chip.addEventListener('click', function () {
        active = chip.getAttribute('data-category-filter') || 'todos';
        chips.forEach(function (c) { c.classList.toggle('is-active', c === chip); });
        apply();
      });
    });
    apply();
  }

  function renderCallMedia(src) {
      src = String(src || '');
      const safe = PU.escapeHtml(src);
      if (/^data:video\//i.test(src)) {
        return '<video class="upload-thumb" src="' + safe + '" controls playsinline preload="metadata" aria-label="Vídeo enviado pelo cliente"></video>';
      }
      return '<img class="upload-thumb" src="' + safe + '" alt="Foto enviada pelo cliente">';
    }

    function bindNovoPedido(content, params, user) {
    const form = content.querySelector('#novo-pedido-form');
    const galleryInput = content.querySelector('#media-gallery-input');
      const cameraInput = content.querySelector('#media-camera-input');
      const videoInput = content.querySelector('#media-video-input');
      const uploadRow = content.querySelector('#upload-row');
      let fotos = [];
      global.QFGeo.bindAddressForm(form);

      function rawFileToDataUrl(file) {
        return new Promise(function (resolve, reject) {
          const reader = new FileReader();
          reader.onerror = function () { reject(reader.error || new Error('Falha ao ler o arquivo.')); };
          reader.onload = function () { resolve(String(reader.result || '')); };
          reader.readAsDataURL(file);
        });
      }

      function videoCount() {
        return fotos.filter(function (m) { return /^data:video\//i.test(String(m || '')); }).length;
      }

      async function addMediaFromInput(input) {
        if (!input) return;
        const selected = Array.prototype.slice.call(input.files || []);
        const room = 4 - fotos.length;
        if (room <= 0) {
          PU.toast('Você pode enviar até 4 mídias por chamado.', 'danger');
          input.value = '';
          return;
        }
        if (selected.length > room) PU.toast('Limite de 4 mídias por chamado.', 'danger');
        const files = selected.slice(0, room);

        for (const file of files) {
          try {
            let durl = '';
            if (/^image\//i.test(file.type || '')) {
              durl = await PU.fileToCompressedDataUrl(file, 640);
            } else if (/^video\//i.test(file.type || '')) {
              if (videoCount() >= 1) {
                PU.toast('Envie no máximo 1 vídeo por chamado.', 'danger');
                continue;
              }
              if (Number(file.size || 0) > 3 * 1024 * 1024) {
                PU.toast('O vídeo precisa ter no máximo 3 MB. Grave um vídeo mais curto.', 'danger');
                continue;
              }
              durl = await rawFileToDataUrl(file);
            } else {
              PU.toast('Use apenas foto ou vídeo.', 'danger');
              continue;
            }
            fotos.push(durl);
            renderThumb(durl);
          } catch (_) {
            PU.toast('Não foi possível carregar esta mídia.', 'danger');
          }
        }
        input.value = '';
      }

      [galleryInput, cameraInput, videoInput].forEach(function (input) {
        if (!input) return;
        input.addEventListener('change', function () { addMediaFromInput(input); });
      });

      function renderThumb(durl) {
        const wrap = document.createElement('div');
        wrap.className = 'upload-thumb-wrap';
        const safe = PU.escapeHtml(String(durl || ''));
        const media = /^data:video\//i.test(String(durl || ''))
          ? '<video class="upload-thumb" src="' + safe + '" controls playsinline muted preload="metadata" aria-label="Vídeo do serviço"></video>'
          : '<img class="upload-thumb" src="' + safe + '" alt="Foto do serviço">';
        wrap.innerHTML = media + '<span class="upload-thumb-remove" role="button" tabindex="0" aria-label="Remover mídia">' + icon('x') + '</span>';
        wrap.querySelector('.upload-thumb-remove').addEventListener('click', function () {
          fotos = fotos.filter(function (f) { return f !== durl; });
          wrap.remove();
        });
        uploadRow.appendChild(wrap);
      }

      (function applyRepeatOrderDraft() {
        let draft = null;
        try {
          const raw = sessionStorage.getItem('qf_repeat_order_draft');
          if (raw) draft = JSON.parse(raw);
        } catch (_) { draft = null; }
        if (!draft || String(draft.categoriaId || '') !== String(params.catId || '')) return;

        const setField = function (name, value) {
          const el = form.querySelector('[name="' + name + '"]');
          if (el && value != null) el.value = String(value);
        };
        setField('descricao', draft.descricao || '');

        const end = draft.endereco || {};
        setField('cep', end.cep || '');
        setField('rua', end.rua || '');
        setField('bairro', end.bairro || '');
        setField('cidade', end.cidade || '');
        setField('uf', end.uf || '');
        setField('complemento', end.complemento || '');
        setField('latitude', end.latitude != null ? end.latitude : '');
        setField('longitude', end.longitude != null ? end.longitude : '');

        fotos = Array.isArray(draft.fotos) ? draft.fotos.slice(0, 4) : [];
        fotos.forEach(function (media) { renderThumb(media); });

        try { sessionStorage.removeItem('qf_repeat_order_draft'); } catch (_) {}
        PU.toast('Pedido anterior carregado. Revise e publique quando quiser.', 'success');
      })();

      form.addEventListener('submit', async function (e) {
      e.preventDefault();
      const fd = new FormData(form);
      const cep = fd.get('cep').trim();
      if (!global.QFGeo.normalizeCep(cep)) { PU.toast('Informe um CEP válido para localizar o chamado corretamente.', 'danger'); return; }
      const cidade = fd.get('cidade').trim(); const uf = fd.get('uf');
      if (!cidade || !uf) { PU.toast('Informe cidade e estado.', 'danger'); return; }
      let localCity = DB.cities().find(function (c) { return String(c.nome).toLowerCase() === cidade.toLowerCase() && c.uf === uf; });
      if (!localCity) localCity = DB.criarCidade(cidade, uf);
      const endereco = {
        id: PU.uid('end'), rua: fd.get('rua').trim(), bairro: fd.get('bairro').trim(), cidade: cidade, uf: uf,
        cidadeId: localCity.id, cep: global.QFGeo.formatCep(cep), complemento: fd.get('complemento').trim(),
        latitude: Number(fd.get('latitude')) || null, longitude: Number(fd.get('longitude')) || null
      };
      const prioridade = fd.get('prioridade') === '1';
      const prioridadeMetodo = fd.get('prioridadeMetodo') || 'pix';
      const btn = form.querySelector('button[type="submit"]');
      const btnHtml = btn ? btn.innerHTML : '';
      if (btn) { btn.disabled = true; btn.textContent = 'Publicando chamado…'; }
      try {
        const dados = { clienteId: user.id, categoriaId: params.catId, descricao: fd.get('descricao').trim(), fotos: fotos, endereco: endereco, prioridade: prioridade, prioridadeMetodo: prioridadeMetodo };
        const req = (global.QFCloud && global.QFCloud.enabled)
          ? await global.QFCloud.createCall(dados)
          : DB.criarPedido(dados);
        if (prioridade) {
          const pp = req.pagamentoPrioridade || {};
          if (pp.status === 'aprovado') PU.toast('Pagamento confirmado. Prioridade ativada!', 'success');
          else if (pp.status === 'erro') PU.toast('Chamado publicado normalmente. A prioridade não foi ativada porque o pagamento não pôde ser iniciado.', 'danger');
          else PU.toast('Chamado publicado. A prioridade ficará ativa somente depois do pagamento.', 'success');
        } else {
          PU.toast('Chamado criado grátis! O sistema começou a procurar os profissionais mais próximos da categoria.', 'success');
        }
        global.navigate('/cliente/pedido/' + req.id, true);
      } catch (err) {
        PU.toast('Não foi possível criar o chamado. ' + (err && err.message ? err.message : ''), 'danger');
      } finally {
        if (btn) { btn.disabled = false; btn.innerHTML = btnHtml; }
      }
    });
  }

  let qfReachTimer=null;
  function stopCallReachPolling(){if(qfReachTimer){clearInterval(qfReachTimer);qfReachTimer=null;}}
  function renderCallReach(el,req,data){
    if(!el||!req||!data)return;
    const avisados=Number(data.avisados||0),online=Number(data.online_na_regiao||0);
    if(avisados>0){el.innerHTML='<strong>'+avisados+(avisados===1?' profissional':' profissionais')+' perto de você '+(avisados===1?'já foi avisado':'já foram avisados')+'</strong>';return;}
    if(online>0){el.textContent='Avisando os profissionais mais próximos…';return;}
    const created=typeof req.criadoEm==='number'?req.criadoEm:Date.parse(req.criadoEm||'');
    if(!Number.isFinite(created)||Date.now()-created<120000){el.textContent='Procurando profissionais online na sua região…';return;}
    const cat=DB.categoryById(req.categoriaId);
    el.innerHTML='<div class="qf-no-coverage"><div class="text--strong">Nenhum profissional online agora</div><div class="text--sm text--secondary" style="margin-top:4px;">No momento não há profissionais de '+PU.escapeHtml((cat&&cat.nome)||'serviço')+' online na sua região. Seu pedido continua publicado e avisaremos assim que alguém ficar disponível.</div><button class="btn btn--outline" type="button" data-support-open>Falar com o QuemFaz</button><button class="btn btn--primary" type="button" data-action="manter-pedido">Manter pedido</button></div>';
  }
  function startCallReachPolling(content,req){
    stopCallReachPolling();
    if(!req||(req.status!==STATUS.BUSCANDO&&req.status!==STATUS.AGUARDANDO_ACEITE))return;
    const el=content.querySelector('[data-call-reach]');
    if(!el||!(global.QFCloud&&global.QFCloud.client))return;
    async function load(){
      if(location.hash!=='#/cliente/pedido/'+req.id){stopCallReachPolling();return;}
      try{const res=await global.QFCloud.client.rpc('qf_chamado_alcance',{p_chamado_id:req.id});if(res.error)throw res.error;renderCallReach(el,req,res.data||{});}catch(err){console.warn('QuemFaz alcance do chamado',err);}
    }
    load();qfReachTimer=setInterval(load,15000);
  }

  function bindPedidoDetalhe(content, params, user) {
    const req = DB.requestById(params.id);
    if (!req) return;
    startCallReachPolling(content, req);

    if (req.status === STATUS.BUSCANDO && !(global.QFCloud && global.QFCloud.enabled)) {
      setTimeout(function () {
        if (location.hash !== '#/cliente/pedido/' + req.id) return;
        DB.buscarProfissional(req.id);
        global.navigate('/cliente/pedido/' + req.id, true);
      }, 1600);
    }

    content.addEventListener('click', function (e) {
      const action = e.target.closest('[data-action]');
      if (!action) return;
      const act = action.getAttribute('data-action');

      if (act === 'manter-pedido') {
        const box=action.closest('.qf-no-coverage');
        if(box)box.innerHTML='<div class="text--sm text--secondary">Pedido mantido. Continuaremos procurando e avisaremos quando houver profissional disponível.</div>';
        return;
      }
      if (act === 'tentar-novamente') {
        if (global.QFCloud && global.QFCloud.enabled) {
          global.QFCloud.syncForCurrentSession(true).then(function () { global.navigate('/cliente/pedido/' + req.id, true); });
        } else {
          DB.buscarProfissional(req.id);
          global.navigate('/cliente/pedido/' + req.id, true);
        }
      }
      if (act === 'refazer-pedido') {
        try {
          sessionStorage.setItem('qf_repeat_order_draft', JSON.stringify({
            sourceId: req.id,
            categoriaId: req.categoriaId,
            descricao: req.descricao || '',
            fotos: Array.isArray(req.fotos) ? req.fotos.slice(0, 4) : [],
            endereco: req.endereco || null
          }));
        } catch (_) {}
        global.navigate('/cliente/novo-pedido/' + encodeURIComponent(req.categoriaId));
      }
      if (act === 'gerar-pagamento-prioridade') {
        if (!(global.QFCloud && global.QFCloud.enabled)) return;
        const paymentId = action.getAttribute('data-payment-id');
        action.disabled = true;
        const oldHtml = action.innerHTML;
        action.textContent = 'Gerando pagamento...';
        (async function () {
          try {
            const out = await global.QFCloud.startEfiCheckout('prioridade', paymentId);
            if (!out.checkout_url) throw new Error('O link de pagamento não foi gerado.');
            if (req.pagamentoPrioridade) req.pagamentoPrioridade.checkoutUrl = out.checkout_url;
            DB.persist();
            location.href = out.checkout_url;
          } catch (err) {
            PU.toast((err && err.message) || 'Não foi possível gerar o pagamento.', 'danger');
            action.disabled = false;
            action.innerHTML = oldHtml;
          }
        })();
      }
      if (act === 'cancelar-pedido') {
        PU.confirmDialog({ title: 'Cancelar pedido', message: 'Tem certeza que deseja cancelar este pedido?', okLabel: 'Cancelar pedido', danger: true }).then(function (ok) {
          if (!ok) return;
          if (global.QFCloud && global.QFCloud.enabled) {
            global.QFCloud.cancelClientCall(req.id).then(function () {
              PU.toast('Pedido cancelado.', 'danger');
              global.navigate('/cliente/pedido/' + req.id, true);
            }).catch(function (err) {
              PU.toast('Não foi possível cancelar. ' + (err && err.message ? err.message : ''), 'danger');
            });
          } else {
            DB.cancelarPedido(req.id, 'cliente', 'Cancelado pelo cliente.');
            PU.toast('Pedido cancelado.', 'danger');
            global.navigate('/cliente/pedido/' + req.id, true);
          }
        });
      }
      if (act === 'aprovar-orcamento') {
        (async function () {
          try {
            if (global.QFCloud && global.QFCloud.enabled) await global.QFCloud.respondQuote(req.id, 'aceitar', '');
            else DB.aprovarOrcamento(req.id);
            PU.toast('Orçamento aprovado!', 'success');
            global.navigate('/cliente/pedido/' + req.id, true);
          } catch (err) {
            PU.toast('Não foi possível aprovar o orçamento. ' + (err && err.message ? err.message : ''), 'danger');
          }
        })();
      }
      if (act === 'recusar-orcamento') {
        PU.openSheet(
          '<h3 class="sheet__title">Orçamento acima do esperado?</h3>' +
          '<p class="text text--secondary text--sm">Você pode pedir um novo valor ao mesmo profissional ou voltar o chamado para buscar outro profissional.</p>' +
          '<textarea class="textarea" id="motivo-recusa" placeholder="Motivo opcional. Ex: valor acima do esperado"></textarea>' +
          '<div class="stack--sm" style="margin-top:14px;">' +
            '<button class="btn btn--outline" id="pedir-novo-valor">' + icon('refresh') + ' Pedir novo valor</button>' +
            '<button class="btn btn--primary" id="buscar-outro-profissional">' + icon('search') + ' Buscar outro profissional</button>' +
          '</div>'
        );

        async function processarRecusa(acao) {
          const campo = document.getElementById('motivo-recusa');
          const motivo = campo ? campo.value.trim() : '';
          PU.closeSheet();
          try {
            if (global.QFCloud && global.QFCloud.enabled) {
              await global.QFCloud.respondQuote(req.id, acao, motivo);
            } else if (acao === 'buscar_outro') {
              DB.buscarOutroProfissional(req.id, motivo);
            } else {
              DB.recusarOrcamento(req.id, motivo);
            }

            if (acao === 'buscar_outro') {
              PU.toast('Chamado voltou para a busca de outro profissional.', 'success');
            } else {
              PU.toast('Pedido de novo valor enviado ao profissional.', 'success');
            }
            global.navigate('/cliente/pedido/' + req.id, true);
          } catch (err) {
            PU.toast('Não foi possível atualizar o orçamento. ' + (err && err.message ? err.message : ''), 'danger');
          }
        }

        document.getElementById('pedir-novo-valor').addEventListener('click', function () {
          processarRecusa('recusar');
        });
        document.getElementById('buscar-outro-profissional').addEventListener('click', function () {
          processarRecusa('buscar_outro');
        });
      }
      if (act === 'enviar-avaliacao') {
        const picker = content.querySelector('#cliente-star-picker');
        const nota = Number(picker.getAttribute('data-nota') || 0);
        if (!nota) { PU.toast('Selecione uma nota de 1 a 5 estrelas.', 'danger'); return; }
        const comentario = content.querySelector('#cliente-avaliacao-comentario').value.trim();
        (async function () {
          try {
            if (global.QFCloud && global.QFCloud.enabled) await global.QFCloud.submitEvaluation(req.id, nota, comentario);
            else DB.avaliarComoCliente(req.id, nota, comentario);
            PU.toast('Obrigado pela avaliação!', 'success');
            global.navigate('/cliente/pedido/' + req.id, true);
          } catch (err) {
            PU.toast((err && err.message) || 'Não foi possível enviar a avaliação.', 'danger');
          }
        })();
      }
    });

    const picker = content.querySelector('#cliente-star-picker');
    if (picker) {
      picker.addEventListener('click', function (e) {
        const btn = e.target.closest('[data-star]');
        if (!btn) return;
        const n = Number(btn.getAttribute('data-star'));
        picker.setAttribute('data-nota', n);
        Array.prototype.forEach.call(picker.querySelectorAll('[data-star]'), function (b) {
          b.classList.toggle('is-active', Number(b.getAttribute('data-star')) <= n);
        });
      });
    }
  }

  function bindEndereco(content, user) {
    const form = content.querySelector('#endereco-form');
    global.QFGeo.bindAddressForm(form);
    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      const fd = new FormData(form);
      if (!global.QFGeo.normalizeCep(fd.get('cep'))) { PU.toast('Digite um CEP válido.', 'danger'); return; }
      const cidade = fd.get('cidade').trim(); const uf = fd.get('uf');
      if (!cidade || !uf) { PU.toast('Informe cidade e UF.', 'danger'); return; }
      let localCity = DB.cities().find(function (c) { return String(c.nome).toLowerCase() === cidade.toLowerCase() && c.uf === uf; });
      if (!localCity) localCity = DB.criarCidade(cidade, uf);
      const endereco = {
        id: PU.uid('end'), rua: fd.get('rua').trim(), bairro: fd.get('bairro').trim(), cidade: cidade, uf: uf,
        cidadeId: localCity.id, cep: global.QFGeo.formatCep(fd.get('cep')), complemento: fd.get('complemento').trim(),
        latitude: Number(fd.get('latitude')) || null, longitude: Number(fd.get('longitude')) || null
      };
      try {
        if (global.QFCloud && global.QFCloud.enabled) await global.QFCloud.saveClientAddress(endereco);
        user.enderecos = [endereco]; DB.persist();
        PU.toast('Endereço validado e salvo!', 'success');
        global.navigate('/cliente/perfil', true);
      } catch (err) { PU.toast('Não foi possível salvar o endereço. ' + ((err && err.message) || ''), 'danger'); }
    });
  }
})(window);
