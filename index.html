    function bindNovoPedido(content, params, user) {
    const form = content.querySelector('#novo-pedido-form');
    const galleryInput = content.querySelector('#media-gallery-input');
      const cameraInput = content.querySelector('#media-camera-input');
      const videoInput = content.querySelector('#media-video-input');
      const uploadRow = content.querySelector('#upload-row');
      let fotos = [];
      const locationSummary = content.querySelector('[data-order-location-summary]');
      const locationLabel = content.querySelector('[data-order-location-label]');
      const locationFields = content.querySelector('[data-order-location-fields]');
      const locationChangeBtn = content.querySelector('[data-order-location-change]');
      function syncOrderLocation(collapse) {
        const cityEl = form && form.querySelector('[name="cidade"]');
        const ufEl = form && form.querySelector('[name="uf"]');
        const cepEl = form && form.querySelector('[name="cep"]');
        const cidade = String(cityEl && cityEl.value || '').trim();
        const uf = String(ufEl && ufEl.value || '').trim().toUpperCase();
        if (!cidade || !uf) return;
        if (locationLabel) locationLabel.textContent = cidade + '/' + uf;
        if (locationSummary) locationSummary.hidden = false;
        if (locationFields && collapse) locationFields.hidden = true;
        try {
          sessionStorage.setItem('qf_client_search_region', JSON.stringify({
            cidade: cidade,
            uf: uf,
            cep: String(cepEl && cepEl.value || '').trim()
          }));
        } catch (_) {}
      }
      global.QFGeo.bindAddressForm(form, {
        onFill: function () { syncOrderLocation(true); }
      });
      if (locationChangeBtn) {
        locationChangeBtn.addEventListener('click', function () {
          if (locationFields) locationFields.hidden = false;
          if (locationSummary) locationSummary.hidden = true;
          const cityEl = form && form.querySelector('[name="cidade"]');
          if (cityEl) { try { cityEl.focus(); cityEl.select(); } catch (_) {} }
        });
      }

      function rawFileToDataUrl(file) {
        return new Promise(function (resolve, reject) {
          const reader = new FileReader();
          reader.onerror = function () { reject(reader.error || new Error('Falha ao ler o arquivo.')); };
          reader.onload = function () { resolve(String(reader.result || '')); };
          reader.readAsDataURL(file);
        });
      }

      function videoCount() {
        return fotos.filter(function (m) { return /^data:video\//i.test(String(m || '')); }).length;
      }

      async function addMediaFromInput(input) {
        if (!input) return;
        const selected = Array.prototype.slice.call(input.files || []);
        const room = 4 - fotos.length;
        if (room <= 0) {
          PU.toast('Você pode enviar até 4 mídias por chamado.', 'danger');
          input.value = '';
          return;
        }
        if (selected.length > room) PU.toast('Limite de 4 mídias por chamado.', 'danger');
        const files = selected.slice(0, room);

        for (const file of files) {
          try {
            let durl = '';
            if (/^image\//i.test(file.type || '')) {
              durl = await PU.fileToCompressedDataUrl(file, 640);
            } else if (/^video\//i.test(file.type || '')) {
              if (videoCount() >= 1) {
                PU.toast('Envie no máximo 1 vídeo por chamado.', 'danger');
                continue;
              }
              if (Number(file.size || 0) > 3 * 1024 * 1024) {
                PU.toast('O vídeo precisa ter no máximo 3 MB. Grave um vídeo mais curto.', 'danger');
                continue;
              }
              durl = await rawFileToDataUrl(file);
            } else {
              PU.toast('Use apenas foto ou vídeo.', 'danger');
              continue;
            }
            fotos.push(durl);
            renderThumb(durl);
          } catch (_) {
            PU.toast('Não foi possível carregar esta mídia.', 'danger');
          }
        }
        input.value = '';
      }

      [galleryInput, cameraInput, videoInput].forEach(function (input) {
        if (!input) return;
        input.addEventListener('change', function () { addMediaFromInput(input); });
      });

      function renderThumb(durl) {
        const wrap = document.createElement('div');
        wrap.className = 'upload-thumb-wrap';
        const safe = PU.escapeHtml(String(durl || ''));
        const media = /^data:video\//i.test(String(durl || ''))
          ? '<video class="upload-thumb" src="' + safe + '" controls playsinline muted preload="metadata" aria-label="Vídeo do serviço"></video>'
          : '<img class="upload-thumb" src="' + safe + '" alt="Foto do serviço">';
        wrap.innerHTML = media + '<span class="upload-thumb-remove" role="button" tabindex="0" aria-label="Remover mídia">' + icon('x') + '</span>';
        wrap.querySelector('.upload-thumb-remove').addEventListener('click', function () {
          fotos = fotos.filter(function (f) { return f !== durl; });
          wrap.remove();
        });
        uploadRow.appendChild(wrap);
      }

      (function applyRepeatOrderDraft() {
        let draft = null;
        try {
          const raw = sessionStorage.getItem('qf_repeat_order_draft');
          if (raw) draft = JSON.parse(raw);
        } catch (_) { draft = null; }
        if (!draft || String(draft.categoriaId || '') !== String(params.catId || '')) return;

        const setField = function (name, value) {
          const el = form.querySelector('[name="' + name + '"]');
          if (el && value != null) el.value = String(value);
        };
        setField('descricao', draft.descricao || '');

        const end = draft.endereco || {};
        setField('cep', end.cep || '');
        setField('cidade', end.cidade || '');
        setField('uf', end.uf || '');
        setField('latitude', end.latitude != null ? end.latitude : '');
        setField('longitude', end.longitude != null ? end.longitude : '');

        fotos = Array.isArray(draft.fotos) ? draft.fotos.slice(0, 4) : [];
        fotos.forEach(function (media) { renderThumb(media); });

        try { sessionStorage.removeItem('qf_repeat_order_draft'); } catch (_) {}
        PU.toast('Pedido anterior carregado. Revise e publique quando quiser.', 'success');
      })();

      form.addEventListener('submit', async function (e) {
      e.preventDefault();
      const fd = new FormData(form);
      let cep = String(fd.get('cep') || '').trim();
      let cidade = String(fd.get('cidade') || '').trim();
      let uf = String(fd.get('uf') || '').trim().toUpperCase();
      const cepNormalizado = global.QFGeo.normalizeCep(cep);
      if (cepNormalizado) {
        if (cepNormalizado.length !== 8) { PU.toast('Digite um CEP válido ou informe cidade e estado.', 'danger'); return; }
        try {
          const dCep = await global.QFGeo.lookupCep(cepNormalizado);
          cidade = dCep.cidade || cidade;
          uf = dCep.uf || uf;
          cep = global.QFGeo.formatCep(cepNormalizado);
          const cityEl = form.querySelector('[name="cidade"]'); if (cityEl) cityEl.value = cidade;
          const ufEl = form.querySelector('[name="uf"]'); if (ufEl) ufEl.value = uf;
        } catch (errCep) {
          PU.toast((errCep && errCep.message) || 'CEP não encontrado.', 'danger');
          return;
        }
      }
      if (!cidade || !uf) { PU.toast('Informe a cidade e o estado, ou digite o CEP.', 'danger'); return; }
      let localCity = DB.cities().find(function (c) { return String(c.nome).toLowerCase() === cidade.toLowerCase() && c.uf === uf; });
      if (!localCity) localCity = DB.criarCidade(cidade, uf);
      const endereco = {
        id: PU.uid('end'), rua: '', bairro: '', cidade: cidade, uf: uf,
        cidadeId: localCity.id, cep: cepNormalizado ? cep : '', complemento: '',
        latitude: Number(fd.get('latitude')) || null, longitude: Number(fd.get('longitude')) || null
      };
      try { sessionStorage.setItem('qf_client_search_region', JSON.stringify({ cidade: cidade, uf: uf, cep: endereco.cep })); } catch (_) {}
      const prioridade = fd.get('prioridade') === '1';
      const prioridadeMetodo = fd.get('prioridadeMetodo') || 'pix';
      await pedirNotificacaoAntesDePublicar();
      const btn = form.querySelector('button[type="submit"]');
      const btnHtml = btn ? btn.innerHTML : '';
      if (btn) { btn.disabled = true; btn.textContent = 'Publicando chamado…'; }
      try {
        const dados = { clienteId: user.id, categoriaId: params.catId, descricao: fd.get('descricao').trim(), fotos: fotos, endereco: endereco, dataPreferida: fd.get('dataPreferida') || null, prioridade: prioridade, prioridadeMetodo: prioridadeMetodo };
        const req = (global.QFCloud && global.QFCloud.enabled)
          ? await global.QFCloud.createCall(dados)
          : DB.criarPedido(dados);
        if (prioridade) {
          const pp = req.pagamentoPrioridade || {};
          if (pp.status === 'aprovado') PU.toast('Pagamento confirmado. Prioridade ativada!', 'success');
          else if (pp.status === 'erro') PU.toast('Chamado publicado normalmente. A prioridade não foi ativada porque o pagamento não pôde ser iniciado.', 'danger');
          else PU.toast('Chamado publicado. A prioridade ficará ativa somente depois do pagamento.', 'success');
        } else {
          PU.toast('Chamado criado grátis! O sistema começou a procurar os profissionais mais próximos da categoria.', 'success');
        }
        if (global.QFPush && global.QFPush.needsPermission()) {
          try { sessionStorage.setItem('qf_cli_notif_pos_pedido', String(req.id)); } catch (_) {}
        }
        global.navigate('/cliente/pedido/' + req.id, true);
      } catch (err) {
        PU.toast('Não foi possível criar o chamado. ' + (err && err.message ? err.message : ''), 'danger');
      } finally {
        if (btn) { btn.disabled = false; btn.innerHTML = btnHtml; }
      }
    });
  }

  // V11.3: cliente — oferece ativar notificações antes de publicar; se recusar, publica mesmo assim.
  async function pedirNotificacaoAntesDePublicar() {
    const P = global.QFPush;
    if (P) await P.refreshStatus();
    if (!P || !P.supported() || !P.needsPermission()) return true;
    return new Promise(function (resolve) {
      const negado = P.permission() === 'denied';
      PU.openSheet('<div class="stack"><div class="icon-tile icon-tile--lg icon-tile--orange" style="margin:0 auto;">' + icon('bell') + '</div>' +
        '<h3 class="sheet__title" style="text-align:center;">Ative as notificações para saber quando um profissional responder</h3>' +
        (negado ? '<p class="text--sm" style="color:var(--danger-600);text-align:center;">As notificações estão bloqueadas neste aparelho. Você pode publicar e acompanhar pelo app.</p>'
                : '<button class="btn btn--primary" id="qf-cli-notif-ativar">' + icon('bell') + ' Ativar notificações</button>') +
        '<button class="btn btn--outline" id="qf-cli-notif-pular">' + (negado ? 'Publicar mesmo assim' : 'Agora não, publicar') + '</button>' +
        '<div class="text--sm" id="qf-cli-notif-erro" role="alert" style="color:var(--danger-600);text-align:center;"></div></div>', { persistent: true });
      const pular = document.getElementById('qf-cli-notif-pular');
      const ativar = document.getElementById('qf-cli-notif-ativar');
      if (pular) pular.onclick = function () { PU.closeSheet(); resolve(false); };
      if (ativar) ativar.onclick = async function () {
        ativar.disabled = true;
        try { await P.activate(); PU.closeSheet(); resolve(true); }
        catch (err) { PU.closeSheet(); resolve(false); }
      };
    });
  }

  async function mostrarNotificacaoPosPedido(req) {
    const P = global.QFPush;
    if (P) await P.refreshStatus();
    if (!P || !P.needsPermission() || !req) return;

    const ios = /iphone|ipad|ipod/i.test(navigator.userAgent || '');
    const suportado = P.supported();
    const negado = P.permission() === 'denied';

    let acao = '';
    let ajuda = '';
    if (suportado && !negado) {
      acao = '<button class="btn btn--primary" id="qf-cli-pos-ativar">' + icon('bell') + ' ATIVAR NOTIFICAÇÕES</button>';
      ajuda = '<div class="text--sm text--secondary" style="text-align:center;">Assim você será avisado quando um profissional aceitar ou enviar orçamento, mesmo sem ficar olhando a tela.</div>';
    } else if (ios) {
      acao = '<button class="btn btn--primary" type="button" data-install-app>' + icon('download') + ' Criar atalho no iPhone</button>';
      ajuda = '<div class="card card--tight" style="background:var(--warning-100);border:none;"><div class="text--sm" style="color:var(--warning-600);"><strong>No iPhone:</strong> abra pelo Safari, adicione o QuemFaz à Tela de Início e depois abra pelo ícone para ativar as notificações.</div></div>';
    } else {
      ajuda = '<div class="card card--tight" style="background:var(--warning-100);border:none;"><div class="text--sm" style="color:var(--warning-600);"><strong>Notificações estão bloqueadas ou indisponíveis.</strong> Libere as notificações do QuemFaz nas configurações do navegador/celular para receber a resposta com a tela apagada.</div></div>';
    }

    PU.openSheet(
      '<div class="stack">' +
        '<div class="icon-tile icon-tile--lg icon-tile--orange" style="margin:0 auto;">' + icon('bell') + '</div>' +
        '<h3 class="sheet__title" style="text-align:center;">Pedido publicado! Não perca a resposta</h3>' +
        '<p class="text text--secondary" style="text-align:center;">O profissional que aceitar seu pedido vai chamar você no WhatsApp. Ative também o aviso do QuemFaz para não perder nada.</p>' +
        ajuda + acao +
        '<button class="btn btn--outline" id="qf-cli-pos-continuar">Continuar acompanhando</button>' +
        '<div class="text--sm" id="qf-cli-pos-erro" role="alert" style="color:var(--danger-600);text-align:center;"></div>' +
      '</div>',
      { persistent: true }
    );

    const continuar = document.getElementById('qf-cli-pos-continuar');
    if (continuar) continuar.onclick = function () { PU.closeSheet(); };

    const ativar = document.getElementById('qf-cli-pos-ativar');
    if (ativar) ativar.onclick = async function () {
      ativar.disabled = true;
      ativar.textContent = 'Ativando…';
      const erro = document.getElementById('qf-cli-pos-erro');
      try {
        await P.activate();
        if (!P.isActive()) throw new Error('A ativação ainda não foi confirmada.');
        PU.closeSheet();
        PU.toast('Notificações ativadas! Você será avisado quando houver resposta.', 'success');
        global.navigate('/cliente/pedido/' + req.id, true);
      } catch (err) {
        if (erro) erro.textContent = (err && err.message) || 'Não foi possível ativar. Verifique a permissão de notificações.';
        ativar.disabled = false;
        ativar.innerHTML = icon('bell') + ' ATIVAR NOTIFICAÇÕES';
      }
    };
  }

  let qfReachTimer=null;
  let qfSearchRadarTimer=null;
  function stopCallReachPolling(){
    if(qfReachTimer){clearInterval(qfReachTimer);qfReachTimer=null;}
    if(qfSearchRadarTimer){clearInterval(qfSearchRadarTimer);qfSearchRadarTimer=null;}
  }
  function requestCityLabel(req){
    const e=(req&&req.endereco)||{};
    if(e.cidade)return String(e.cidade);
    const city=e.cidadeId?DB.cityById(e.cidadeId):null;
    return city&&city.nome?String(city.nome):'sua cidade';
  }
  function searchStage(req){
    if(req&&[STATUS.AGUARDANDO_ORCAMENTO,STATUS.ORCAMENTO_ENVIADO].indexOf(req.status)!==-1)return{title:'Profissional em contato',sub:'Até 3 profissionais podem chamar você no WhatsApp',km:'Até 3 profissionais'};
    if(req&&req.prioridade)return{title:'Busca prioritária ativa',sub:'Ampliando o alcance mais rápido',km:'Prioridade'};
    const created=typeof req.criadoEm==='number'?req.criadoEm:Date.parse(req.criadoEm||'');
    const elapsed=Number.isFinite(created)?Math.max(0,Date.now()-created):0;
    const city=requestCityLabel(req);
    if(elapsed<30000)return{title:'Buscando em '+city,sub:'Primeiro, profissionais desta cidade',km:'Cidade'};
    if(elapsed<60000)return{title:'Ampliando a busca',sub:'Procurando profissionais próximos',km:'até 15 km'};
    if(elapsed<90000)return{title:'Ampliando a busca',sub:'Aumentando o alcance automaticamente',km:'até 30 km'};
    if(elapsed<180000)return{title:'Buscando mais longe',sub:'Mantendo a mesma profissão solicitada',km:'até 60 km'};
    if(elapsed<600000)return{title:'Busca ampliada',sub:'Ainda procurando profissionais compatíveis',km:'até 100 km'};
    return{title:'Busca ampliada',sub:'Continuamos procurando até encontrar',km:'até 200 km'};
  }
  function updateSearchRadar(content,req){
    const radar=content&&content.querySelector('[data-search-radar]');
    if(!radar)return;
    const s=searchStage(req);
    const title=radar.querySelector('[data-search-stage]');
    const sub=radar.querySelector('[data-search-sub]');
    const km=radar.querySelector('[data-search-km]');
    if(title)title.textContent=s.title;
    if(sub)sub.textContent=s.sub;
    if(km)km.textContent=s.km;
  }
  function startSearchRadar(content,req){
    updateSearchRadar(content,req);
    if(qfSearchRadarTimer)clearInterval(qfSearchRadarTimer);
    qfSearchRadarTimer=setInterval(function(){
      if(location.hash!=='#/cliente/pedido/'+req.id){stopCallReachPolling();return;}
      updateSearchRadar(content,req);
    },1000);
  }
  function renderCallReach(el,req,data){
    if(!el||!req||!data)return;
    const copy=el.querySelector('[data-call-reach-copy]')||el;
    const avisados=Number(data.avisados||0);
    const online=Number(data.online_na_regiao||0);
    const participantes=Number(data.desbloqueados||0);
    const orcamentos=Number(data.orcamentos||0);
    if(orcamentos>0){
      copy.innerHTML='<strong>'+orcamentos+(orcamentos===1?' proposta recebida':' propostas recebidas')+'</strong> · combine os detalhes pelo chat';
      return;
    }
    if(participantes>0){
      copy.innerHTML=participantes===1?'<strong>Um profissional desbloqueou seu pedido</strong> · ele vai chamar você no WhatsApp':'<strong>'+participantes+' profissionais desbloquearam seu pedido</strong> · eles vão chamar você no WhatsApp';
      return;
    }
    if(avisados>0){copy.innerHTML='<strong>'+avisados+(avisados===1?' profissional':' profissionais')+' '+(avisados===1?'já foi avisado':'já foram avisados')+'</strong>';return;}
    if(online>0){copy.textContent='Avisando profissionais compatíveis…';return;}
    const created=typeof req.criadoEm==='number'?req.criadoEm:Date.parse(req.criadoEm||'');
    if(!Number.isFinite(created)||Date.now()-created<120000){copy.textContent='Procurando profissionais compatíveis…';return;}
    copy.textContent='Continuamos ampliando a busca automaticamente.';
  }
  function startCallReachPolling(content,req){
    if(qfReachTimer){clearInterval(qfReachTimer);qfReachTimer=null;}
    if(!req||[STATUS.BUSCANDO,STATUS.AGUARDANDO_ACEITE,STATUS.AGUARDANDO_ORCAMENTO,STATUS.ORCAMENTO_ENVIADO].indexOf(req.status)===-1)return;
    const el=content.querySelector('[data-call-reach]');
    if(!el||!(global.QFCloud&&global.QFCloud.client))return;
    async function load(){
      if(location.hash!=='#/cliente/pedido/'+req.id){stopCallReachPolling();return;}
      try{
        const res=await global.QFCloud.client.rpc('qf_chamado_alcance',{p_chamado_id:req.id});
        if(res.error)throw res.error;
        const data=res.data||{};
        const previous=Number(el.getAttribute('data-orcamentos')||0);
        const current=Number(data.orcamentos||0);
        renderCallReach(el,req,data);
        el.setAttribute('data-orcamentos',String(current));
        if(current!==previous){
          await global.QFCloud.syncForCurrentSession(true);
          if(location.hash==='#/cliente/pedido/'+req.id) global.navigate('/cliente/pedido/'+req.id,true);
        }
      }catch(err){console.warn('QuemFaz alcance do chamado',err);}
    }
    load();qfReachTimer=setInterval(load,10000);
  }

  function bindPedidoDetalhe(content, params, user) {
    const req = DB.requestById(params.id);
    if (!req) return;
    // V11.3: sem notificação ativa, avisa que o cliente precisa acompanhar pelo app.
    if (global.QFPush && global.QFPush.needsPermission() && ACTIVE_STATUSES.indexOf(req.status) !== -1 && !content.querySelector('.qf-no-notif-strip')) {
      const strip = document.createElement('div');
      strip.className = 'qf-no-notif-strip';
      strip.setAttribute('role', 'status');
      strip.innerHTML = icon('bell') + '<span><strong>Ative os avisos.</strong> Assim você sabe na hora quando um profissional aceitar.</span><button class="btn btn--primary btn--sm" type="button" data-action="cli-notif-ativar">Ativar</button>';
      const view = content.querySelector('.view') || content;
      view.insertBefore(strip, view.firstChild);
    }
    let mostrarPosPedido = false;
    try {
      mostrarPosPedido = sessionStorage.getItem('qf_cli_notif_pos_pedido') === String(req.id);
      if (mostrarPosPedido) sessionStorage.removeItem('qf_cli_notif_pos_pedido');
    } catch (_) {}
    if (mostrarPosPedido && global.QFPush && global.QFPush.needsPermission()) {
      setTimeout(function () { mostrarNotificacaoPosPedido(req); }, 250);
    }
    startSearchRadar(content, req);
    startCallReachPolling(content, req);

    if (req.status === STATUS.BUSCANDO && !(global.QFCloud && global.QFCloud.enabled)) {
      setTimeout(function () {
        if (location.hash !== '#/cliente/pedido/' + req.id) return;
        DB.buscarProfissional(req.id);
        global.navigate('/cliente/pedido/' + req.id, true);
      }, 1600);
    }

    content.addEventListener('click', function (e) {
      const action = e.target.closest('[data-action]');
      if (!action) return;
      const act = action.getAttribute('data-action');

      if (act === 'manter-pedido') {
        const box=action.closest('.qf-no-coverage');
        if(box)box.innerHTML='<div class="text--sm text--secondary">Pedido mantido. Continuaremos procurando e avisaremos quando houver profissional disponível.</div>';
        return;
      }
      if (act === 'tentar-novamente') {
        if (global.QFCloud && global.QFCloud.enabled) {
          global.QFCloud.syncForCurrentSession(true).then(function () { global.navigate('/cliente/pedido/' + req.id, true); });
        } else {
          DB.buscarProfissional(req.id);
          global.navigate('/cliente/pedido/' + req.id, true);
        }
      }
      if (act === 'refazer-pedido') {
        try {
          sessionStorage.setItem('qf_repeat_order_draft', JSON.stringify({
            sourceId: req.id,
            categoriaId: req.categoriaId,
            descricao: req.descricao || '',
            fotos: Array.isArray(req.fotos) ? req.fotos.slice(0, 4) : [],
            endereco: req.endereco || null
          }));
        } catch (_) {}
        global.navigate('/cliente/novo-pedido/' + encodeURIComponent(req.categoriaId));
      }
      if (act === 'ativar-busca-prioritaria') {
        if (!(global.QFCloud && global.QFCloud.enabled && global.QFCloud.client)) {
          PU.toast('Conecte-se à internet para ativar a busca prioritária.', 'danger');
          return;
        }
        action.disabled = true;
        const oldHtml = action.innerHTML;
        action.textContent = 'Preparando prioridade...';
        (async function () {
          try {
            const pay = await global.QFCloud.client.rpc('qf_solicitar_prioridade', {
              p_chamado_id: req.id,
              p_metodo: 'pix'
            });
            if (pay.error) throw pay.error;
            const out = pay.data || {};
            if (!out.pagamento_id) throw new Error('Não foi possível criar o pagamento da prioridade.');

            req.pagamentoPrioridade = {
              id: out.pagamento_id,
              status: out.status || 'pendente',
              valor: Number(out.valor_centavos || 490),
              checkoutUrl: out.checkout_url || null,
              criadoEm: new Date().toISOString()
            };
            req.prioridade = !!out.prioridade_ativa;
            DB.persist();

            if (req.prioridade) {
              PU.toast('Busca prioritária ativada!', 'success');
              await global.QFCloud.syncForCurrentSession(true);
              global.navigate('/cliente/pedido/' + req.id, true);
              return;
            }

            const checkout = await global.QFCloud.startEfiCheckout('prioridade', out.pagamento_id);
            const checkoutUrl = checkout && checkout.checkout_url ? String(checkout.checkout_url) : '';
            if (!checkoutUrl) throw new Error('Não foi possível abrir o pagamento agora.');
            req.pagamentoPrioridade.checkoutUrl = checkoutUrl;
            DB.persist();
            location.href = checkoutUrl;
          } catch (err) {
            PU.toast((err && err.message) || 'Não foi possível ativar a prioridade.', 'danger');
            action.disabled = false;
            action.innerHTML = oldHtml;
          }
        })();
        return;
      }
      if (act === 'gerar-pagamento-prioridade') {
        if (!(global.QFCloud && global.QFCloud.enabled)) return;
        const paymentId = action.getAttribute('data-payment-id');
        action.disabled = true;
        const oldHtml = action.innerHTML;
        action.textContent = 'Gerando pagamento...';
        (async function () {
          try {
            const out = await global.QFCloud.startEfiCheckout('prioridade', paymentId);
            if (!out.checkout_url) throw new Error('O link de pagamento não foi gerado.');
            if (req.pagamentoPrioridade) req.pagamentoPrioridade.checkoutUrl = out.checkout_url;
            DB.persist();
            location.href = out.checkout_url;
          } catch (err) {
            PU.toast((err && err.message) || 'Não foi possível gerar o pagamento.', 'danger');
            action.disabled = false;
            action.innerHTML = oldHtml;
          }
        })();
      }
      if (act === 'cancelar-pedido') {
        PU.confirmDialog({ title: 'Cancelar pedido', message: 'Tem certeza que deseja cancelar este pedido?', okLabel: 'Cancelar pedido', danger: true }).then(function (ok) {
          if (!ok) return;
          if (global.QFCloud && global.QFCloud.enabled) {
            global.QFCloud.cancelClientCall(req.id).then(function () {
              PU.toast('Pedido cancelado.', 'danger');
              global.navigate('/cliente/pedido/' + req.id, true);
            }).catch(function (err) {
              PU.toast('Não foi possível cancelar. ' + (err && err.message ? err.message : ''), 'danger');
            });
          } else {
            DB.cancelarPedido(req.id, 'cliente', 'Cancelado pelo cliente.');
            PU.toast('Pedido cancelado.', 'danger');
            global.navigate('/cliente/pedido/' + req.id, true);
          }
        });
      }
      if (act === 'aprovar-orcamento') {
        const quoteId = action.getAttribute('data-quote-id') || '';
        PU.confirmDialog({
          title: 'Escolher este profissional?',
          message: 'Ao confirmar, este orçamento será aprovado e os outros profissionais serão avisados de que não foram selecionados.',
          okLabel: 'Escolher profissional'
        }).then(function (ok) {
          if (!ok) return;
          (async function () {
            try {
              if (global.QFCloud && global.QFCloud.enabled) await global.QFCloud.respondQuote(req.id, 'aceitar', '', quoteId);
              else DB.aprovarOrcamento(req.id);

              global.navigate('/cliente/pedido/' + req.id, true);

              PU.toast('Não foi possível aprovar o orçamento. ' + (err && err.message ? err.message : ''), 'danger');
            }

        });
      }

        const quoteId = action.getAttribute('data-quote-id') || '';
        PU.openSheet(
          '<h3 class="sheet__title">O que deseja fazer com esta proposta?</h3>' +
          '<p class="text text--secondary text--sm">Você pode pedir um novo valor a este profissional ou descartá-lo e continuar comparando os demais.</p>' +
          '<textarea class="textarea" id="motivo-recusa" placeholder="Motivo opcional. Ex: valor acima do esperado"></textarea>' +
          '<div class="stack--sm" style="margin-top:14px;">' +
            '<button class="btn btn--outline" id="pedir-novo-valor">' + icon('refresh') + ' Pedir novo valor</button>' +
            '<button class="btn btn--primary" id="buscar-outro-profissional">' + icon('xCircle') + ' Descartar este profissional</button>' +
          '</div>'
        );

        async function processarRecusa(acao) {
          const campo = document.getElementById('motivo-recusa');
          const motivo = campo ? campo.value.trim() : '';
          PU.closeSheet();
          try {
            if (global.QFCloud && global.QFCloud.enabled) {
              await global.QFCloud.respondQuote(req.id, acao, motivo, quoteId);
            } else if (acao === 'buscar_outro') {
              DB.buscarOutroProfissional(req.id, motivo);
            } else {
              DB.recusarOrcamento(req.id, motivo);
            }

            if (acao === 'buscar_outro') {
              PU.toast('Profissional descartado. O pedido continua aberto para outras propostas.', 'success');

              PU.toast('Pedido de novo valor enviado ao profissional.', 'success');

          } catch (err) {
            PU.toast('Não foi possível atualizar o orçamento. ' + (err && err.message ? err.message : ''), 'danger');
          }
        }

        document.getElementById('pedir-novo-valor').addEventListener('click', function () {
          processarRecusa('recusar');
        });
        document.getElementById('buscar-outro-profissional').addEventListener('click', function () {
          processarRecusa('buscar_outro');
        });
      }
      if (act === 'enviar-avaliacao') {

        (async function () {
          try {
            if (global.QFCloud && global.QFCloud.enabled) await global.QFCloud.submitEvaluation(req.id, nota, comentario);
            else DB.avaliarComoCliente(req.id, nota, comentario);
            PU.toast('Serviço finalizado e sua avaliação foi enviada.', 'success');
            qfOfferRecommendation('cliente');
            global.navigate('/cliente/pedido/' + req.id, true);
          } catch (err) {
            PU.toast((err && err.message) || 'Não foi possível enviar a avaliação.', 'danger');
          }
        })();
      }
    });

    const picker = content.querySelector('#cliente-star-picker');
    if (picker) {
      picker.addEventListener('click', function (e) {
        const btn = e.target.closest('[data-star]');
        if (!btn) return;
        const n = Number(btn.getAttribute('data-star'));
        picker.setAttribute('data-nota', n);
        Array.prototype.forEach.call(picker.querySelectorAll('[data-star]'), function (b) {
          b.classList.toggle('is-active', Number(b.getAttribute('data-star')) <= n);
        });
      });
    }
  }

  function qfOfferRecommendation(role) {
    const who=role==='profissional'?'profissional':'cliente';
    PU.confirmDialog({
      title:'Gostou do Quem Faz?',
      message:'Você recomendaria o Quem Faz para um amigo ou conhecido?',

    }).then(async function(ok){
      if(!ok)return;
      const url=location.origin+location.pathname;
      const msg=who==='profissional'
        ? 'Eu uso o Quem Faz para encontrar oportunidades de serviço. Conheça: '+url
        : 'Precisou de um profissional? No Quem Faz você faz seu pedido grátis e encontra profissionais da sua região. Conheça: '+url;
      try{
        if(navigator.share){await navigator.share({title:'Quem Faz',text:msg,url:url});}
        else{window.open('https://wa.me/?text='+encodeURIComponent(msg),'_blank','noopener');}
      }catch(err){if(err&&err.name!=='AbortError')PU.toast('Não foi possível abrir o compartilhamento.','danger');}
    });
  }

  function bindEndereco(content, user) {
    const form = content.querySelector('#endereco-form');
    global.QFGeo.bindAddressForm(form);
    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      const fd = new FormData(form);
      if (!global.QFGeo.normalizeCep(fd.get('cep'))) { PU.toast('Digite um CEP válido.', 'danger'); return; }
      const cidade = fd.get('cidade').trim(); const uf = fd.get('uf');
      if (!cidade || !uf) { PU.toast('Informe cidade e UF.', 'danger'); return; }
      let localCity = DB.cities().find(function (c) { return String(c.nome).toLowerCase() === cidade.toLowerCase() && c.uf === uf; });
      if (!localCity) localCity = DB.criarCidade(cidade, uf);
      const endereco = {
        id: PU.uid('end'), rua: fd.get('rua').trim(), bairro: fd.get('bairro').trim(), cidade: cidade, uf: uf,
        cidadeId: localCity.id, cep: global.QFGeo.formatCep(fd.get('cep')), complemento: fd.get('complemento').trim(),
        latitude: Number(fd.get('latitude')) || null, longitude: Number(fd.get('longitude')) || null
      };
      try {
        if (global.QFCloud && global.QFCloud.enabled) await global.QFCloud.saveClientAddress(endereco);
        user.enderecos = [endereco]; DB.persist();
        PU.toast('Endereço validado e salvo!', 'success');
        global.navigate('/cliente/perfil', true);
      } catch (err) { PU.toast('Não foi possível salvar o endereço. ' + ((err && err.message) || ''), 'danger'); }
    });
  }
})(window);

  // Nada é salvo no banco: cada etapa vem do estado real (app aberto no APK/instalado, notificações

  const ATIV_OK = 'qf_ativacao_ok_';        // já concluiu as 3 etapas neste aparelho
  const ATIV_FESTA = 'qf_ativacao_festa_';  // mostrando "Tudo pronto!" nesta sessão (some ao fechar ou na próxima abertura)

  function ativLer(store, key) { try { return global[store].getItem(key); } catch (_) { return null; } }
  function ativGravar(store, key, val) { try { if (val == null) global[store].removeItem(key); else global[store].setItem(key, val); } catch (_) {} }
  function ativAndroid() { return /android/i.test(navigator.userAgent || ''); }
