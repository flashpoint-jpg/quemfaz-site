<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Minha carteirinha | Quem Faz Serviços</title>
<style>
:root{color-scheme:light;font-family:Inter,system-ui,-apple-system,Arial,sans-serif}
*{box-sizing:border-box}body{margin:0;background:#edf1f7;color:#0c2448;padding:72px 14px 24px}
.topo{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;gap:12px;min-height:56px;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 8px;background:#0b294e;color:#fff;box-shadow:0 2px 10px #0003}
.voltar{appearance:none;border:0;border-radius:10px;min-height:40px;padding:8px 14px;background:#ff790a;color:#0c2448;font-weight:900;font-size:15px;cursor:pointer}
.topo__titulo{font-weight:800;font-size:16px}
main{display:flex;align-items:center;flex-direction:column;gap:16px}
.toolbar{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:10px;width:100%}
.btn{appearance:none;border:0;border-radius:12px;min-height:44px;padding:10px 18px;font-weight:800;font-size:15px;cursor:pointer;text-decoration:none}
.btn--orange{background:#ff790a;color:#0c2448}.btn--light{background:#fff;color:#0c2448;border:1px solid #cbd2dd}
.card{background:#fff;width:340px;max-width:100%;min-height:558px;overflow:hidden;border-radius:22px;box-shadow:0 10px 30px #12284d27;text-align:center;border:1px solid #d8e0ec}
.header{background:#0b294e;padding:21px 15px 34px;position:relative;color:#fff}
.header::after{content:"";position:absolute;bottom:-2px;left:-10%;width:120%;height:23px;background:#ff790a;border-radius:50% 50% 0 0}
.brand{font-size:34px;font-weight:950;letter-spacing:-2px;line-height:1}.brand em{font-style:normal;color:#ff790a}
.brand-small{font-size:11px;letter-spacing:3px;text-align:right;margin:4px 55px 0 0;font-weight:700}
.avatar{position:relative;width:108px;height:108px;margin:-19px auto 8px;border:5px solid #fff;border-radius:50%;background:#e4eaf2;display:grid;place-items:center;overflow:hidden}
.avatar img{height:100%;width:100%;object-fit:cover;display:none}.avatar .fallback{font-size:44px;font-weight:850;color:#0b294e}
#nome{font-size:21px;font-weight:900;margin:4px 15px;word-break:break-word;text-transform:uppercase}
#numero{font-size:14px;color:#49556a;margin:0 0 15px;letter-spacing:.6px}
#qr{width:236px;height:236px;margin:0 auto;display:grid;place-items:center;background:#fff}
#qr canvas,#qr img{max-width:100%;max-height:100%}
.question{font-size:17px;font-weight:850;margin:15px 12px 1px}
.instructions{font-size:14px;color:#475468;margin:3px 15px 19px}
.footer{margin-top:auto;background:#ff790a;padding:13px;color:#fff;font-weight:800;font-size:14px}
.card{display:flex;flex-direction:column}
.helper{font-size:13px;color:#45546c;text-align:center;max-width:350px;line-height:1.4}
#erro{color:#a92828;font-size:14px;font-weight:700;text-align:center;max-width:340px;min-height:18px}
@media print{
  @page{size:A4;margin:12mm}
  body{padding:0;background:white}
  .topo,.toolbar,.helper,#erro{display:none!important}
  main{margin:0;gap:0;display:block}
  .card{width:86mm;height:142mm;min-height:0;border:1px solid #aeb7c8;border-radius:5mm;box-shadow:none;overflow:hidden;-webkit-print-color-adjust:exact;print-color-adjust:exact;page-break-inside:avoid}
  .header{padding:7mm 2mm 9mm}
  .brand{font-size:28pt}.brand-small{font-size:7.5pt;margin-right:12mm}
  .avatar{width:27mm;height:27mm;margin:-5mm auto 1mm}
  #nome{font-size:15pt}#numero{font-size:9pt;margin-bottom:3mm}
  #qr{width:56mm;height:56mm}#qr img,#qr canvas{width:56mm!important;height:56mm!important}
  .question{font-size:12pt;margin:3mm 2mm 0}
  .instructions{font-size:9pt;margin:1mm 2mm 3mm}
  .footer{padding:4mm 0;font-size:10pt}
}
</style>
<style>.profissao{margin:0 0 4px;font-weight:800;font-size:15px;color:#0c2448}.toolbar .btn[hidden]{display:none}</style>
<style id="qf-approved-brand">.qf-approved-logo{display:block;width:160px;height:54px;object-fit:contain;flex:none;background:#fff;border-radius:7px;padding:2px;box-sizing:border-box}.qf-brandrot__logo .qf-approved-logo{width:112px;height:40px}.tabbar__brand .qf-approved-logo{width:140px;height:48px}@media(max-width:430px){.qf-landing-brand .qf-approved-logo{width:116px;height:40px}.topbar__title .qf-approved-logo{width:140px;height:46px}}</style></head>
<body>
<main>
 <div class="topo">
  <button class="voltar" type="button" id="voltar" aria-label="Voltar ao QuemFaz">&#8592; Voltar</button>
  <span class="topo__titulo">Minha carteirinha</span>
 </div>
 <div class="toolbar">
  <button class="btn btn--orange" type="button" id="imprimir" disabled>Imprimir carteirinha</button>
  <button class="btn btn--light" type="button" data-voltar>Fechar e voltar ao QuemFaz</button>
 </div>
 <article class="card" aria-label="Carteirinha Quem Faz Serviços para impressão">
  <header class="header"><img class="qf-approved-logo" src="/assets/qf-logo-20261013.webp" alt="Quem Faz Serviços"></header>
  <div class="avatar"><img id="foto" alt="Foto do profissional"><span class="fallback" id="iniciais">QF</span></div>
  <h1 id="nome">Carregando...</h1><div id="plano-livre" hidden style="margin:10px auto;padding:6px 12px;border-radius:999px;background:#e8f1ff;color:#1458cc;font-weight:800;width:fit-content">Quem Faz Livre</div>
  <p id="profissao" class="profissao" hidden></p>
  <p id="numero"></p>
  <div id="qr" role="img" aria-label="QR Code para o cliente avaliar o atendimento"></div>
  <div class="question">Como foi meu atendimento?</div>
  <p class="instructions">Escaneie e me avalie</p>
  <div class="footer">quemfazservico.com.br</div>
 </article>
 <div class="helper">Aponte a câmera do celular para o QR Code. Esta carteirinha não informa profissão nem pontuação.</div>
 <div id="erro" role="alert"></div>
</main>
<script src="/vendor/supabase-2.117.2.js"></script>
<script src="/qf-carteirinha-extras.js?v=1"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script>
(function(){
  'use strict';
  const params=new URLSearchParams(location.search);
  const token=params.get('token')||'';
  const servico=new URLSearchParams(location.hash.slice(1)).get('servico')||'';
  const erro=document.getElementById('erro');
  const botao=document.getElementById('imprimir');
  // Sai da carteirinha e volta para o app (funciona no app da Play Store e no navegador).
  function voltar(){
    if(history.length>1&&document.referrer&&new URL(document.referrer).origin===location.origin){history.back();return;}
    try{if(window.opener){window.close();}}catch(_){}
    location.replace('/index.html#/profissional/home');
  }
  document.getElementById('voltar').addEventListener('click',voltar);
  document.querySelectorAll('[data-voltar]').forEach(function(b){b.addEventListener('click',voltar);});
  function fail(msg){erro.textContent=msg;document.getElementById('nome').textContent='Indisponível';}
  if(!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(token)){fail('Link da carteirinha inválido. Abra a carteirinha pelo seu painel.');return;}
  if(!window.supabase){fail('Não foi possível carregar o serviço. Verifique a conexão.');return;}
  const client=supabase.createClient('https://dczlyrgnzlxmzghzaooz.supabase.co','sb_publishable_-WiYw_1QTzW0l9o0d4ZU9Q_kSadNA2A',{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
  // Profissão, compartilhar e PDF: só aparecem com a chave `pedidos_valor_definido` ligada. Desligada, a carteirinha segue como era.
  async function ativarExtras(nome,numero,alvo){
    const E=window.QFCarteirinhaExtras; if(!E)return;
    const cfg=await client.rpc('qf_pedidos_valor_config');
    if(cfg.error||!cfg.data||cfg.data.ativo!==true)return;
    const v2=await client.rpc('qf_carteirinha_publica_v2',{p_token:token});
    const prof=v2.data&&v2.data.ok?E.profissaoTexto(v2.data.especialidades):'';
    if(prof){const el=document.getElementById('profissao');el.textContent=prof;el.hidden=false;}
    const helper=document.querySelector('.helper');
    if(helper)helper.textContent='Aponte a câmera do celular para o QR Code e avalie o atendimento.';
    const bar=document.querySelector('.toolbar'); if(!bar)return;
    function botaoNovo(txt,fn){const b=document.createElement('button');b.type='button';b.className='btn btn--light';b.textContent=txt;b.addEventListener('click',fn);bar.insertBefore(b,bar.lastElementChild);return b;}
    const texto='Minha carteirinha Quem Faz Serviços. Avalie meu atendimento: '+alvo;
    botaoNovo('Compartilhar',async function(){
      try{if(navigator.share){await navigator.share({title:'Carteirinha Quem Faz Serviços',text:'Avalie meu atendimento',url:alvo});return;}}catch(e){if(e&&e.name==='AbortError')return;}
      window.open(E.linkWhatsapp(texto),'_blank','noopener');
    });
    botaoNovo('Copiar link',async function(){
      try{await navigator.clipboard.writeText(alvo);erro.style.color='#0a6b3a';erro.textContent='Link copiado.';}catch(_){erro.style.color='';erro.textContent='Não foi possível copiar. Use Compartilhar.';}
    });
    botaoNovo('Baixar PDF',async function(){
      try{
        const W=600,H=840,cv=document.createElement('canvas');cv.width=W;cv.height=H;const g=cv.getContext('2d');
        g.fillStyle='#fff';g.fillRect(0,0,W,H);g.textAlign='center';
        g.fillStyle='#0c2448';g.font='800 34px Arial,sans-serif';g.fillText('Quem Faz Serviços',W/2,70);
        let y=130;
        const foto=await new Promise(function(ok){const im=new Image();im.crossOrigin='anonymous';im.onload=function(){ok(im);};im.onerror=function(){ok(null);};const f=document.getElementById('foto').src;if(f&&/^https:/i.test(f))im.src=f;else ok(null);});
        if(foto){g.save();g.beginPath();g.arc(W/2,y+60,60,0,Math.PI*2);g.clip();g.drawImage(foto,W/2-60,y,120,120);g.restore();y+=150;}else y+=20;
        g.fillStyle='#0c2448';g.font='800 36px Arial,sans-serif';g.fillText(nome,W/2,y);y+=44;
        if(prof){g.font='700 26px Arial,sans-serif';g.fillText(prof,W/2,y);y+=40;}
        g.font='600 22px Arial,sans-serif';g.fillStyle='#586377';g.fillText(numero,W/2,y);y+=30;
        const qc=document.querySelector('#qr canvas'); if(!qc)throw new Error('qr');
        const q=300;g.drawImage(qc,W/2-q/2,y,q,q);y+=q+46;
        g.fillStyle='#0c2448';g.font='800 30px Arial,sans-serif';g.fillText('Como foi meu atendimento?',W/2,y);y+=36;
        g.font='600 22px Arial,sans-serif';g.fillStyle='#586377';g.fillText('Escaneie e me avalie',W/2,y);
        g.font='600 18px Arial,sans-serif';g.fillText('quemfazservico.com.br',W/2,H-24);
        const pdf=E.jpegToPdf(E.dataUrlToBytes(cv.toDataURL('image/jpeg',0.92)),W,H);
        const url=URL.createObjectURL(new Blob([pdf],{type:'application/pdf'}));
        const a=document.createElement('a');a.href=url;a.download=E.nomeArquivo(nome);document.body.appendChild(a);a.click();a.remove();
        setTimeout(function(){URL.revokeObjectURL(url);},4000);
      }catch(_){erro.style.color='';erro.textContent='Não foi possível gerar o PDF agora. Use Imprimir e escolha "Salvar como PDF".';}
    });
  }
  async function load(){
    try{
      const r=await client.rpc('qf_carteirinha_publica',{p_token:token});
      if(r.error||!r.data||!r.data.ok)throw new Error('Carteirinha não disponível. Tente novamente mais tarde.');
      const data=r.data;
      const nome=String(data.nome||'Profissional Quem Faz').trim();
      document.getElementById('nome').textContent=nome;
      document.getElementById('plano-livre').hidden=data.plano_livre_ativo!==true;
      document.getElementById('numero').textContent=String(data.numero||'');
      document.getElementById('iniciais').textContent=nome.split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase();
      if(data.foto && /^https:\/\//i.test(data.foto)){
        const img=document.getElementById('foto');
        img.onload=function(){img.style.display='block';document.getElementById('iniciais').style.display='none';};
        img.src=data.foto;
      }
      let target=location.origin+'/avaliar.html?token='+encodeURIComponent(token);
      if(servico){
        const acordo=await client.rpc('qf_comissao13_carteirinha_info',{p_carteirinha:token,p_token:servico});
        if(acordo.error||!acordo.data||!acordo.data.ok)throw new Error('Este acordo não corresponde à carteirinha ou o link expirou. Abra novamente pelo pedido.');
        target=location.origin+'/comissao13.html#token='+encodeURIComponent(servico)+'&carteirinha='+encodeURIComponent(token);
        document.querySelector('.question').textContent='Confirme este serviço';
        document.querySelector('.instructions').textContent='Pedido '+String(acordo.data.pedido).slice(0,8)+' · '+(acordo.data.valor_centavos/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
        document.querySelector('.helper').textContent='O cliente escaneia com o próprio celular e recebe um código no telefone do pedido. O QR Code sozinho não confirma a conclusão. Não é necessário imprimir.';
        document.getElementById('qr').setAttribute('aria-label','QR Code para o cliente conferir o acordo e confirmar com código no telefone');
        document.querySelector('article.card').setAttribute('aria-label','Carteirinha digital do serviço');
        botao.hidden=true;
      }
      if(!window.QRCode)throw new Error('QR Code indisponível. Verifique sua conexão antes de imprimir.');
      new QRCode(document.getElementById('qr'),{text:target,width:236,height:236,colorDark:'#000000',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});
      botao.disabled=false;
      if(!servico)ativarExtras(nome,String(data.numero||''),target).catch(function(){});
      botao.addEventListener('click',function(){window.print();});
      if(!servico&&params.get('imprimir')==='1'){
        if(document.fonts&&document.fonts.ready)await document.fonts.ready;
        setTimeout(function(){window.print();},850);
      }
    }catch(e){fail(e.message||'Não foi possível carregar a carteirinha.');}
  }
  load();
})();
</script>
</body>
</html>
