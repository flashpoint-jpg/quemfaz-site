name: Radar de Leads - testes
on:
  pull_request:
    paths:
      - 'scripts/radar-leads-*.cjs'
      - 'tests/radar-leads-*.test.cjs'
      - '.github/workflows/radar-leads-tests.yml'
  push:
    branches: [feature/radar-leads-externos-piloto]
    paths:
      - 'scripts/radar-leads-*.cjs'
      - 'tests/radar-leads-*.test.cjs'
      - '.github/workflows/radar-leads-tests.yml'
permissions:
  contents: read
jobs:
  radar-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testar classificador e validação de fontes
        run: node --test tests/radar-leads-*.test.cjs
