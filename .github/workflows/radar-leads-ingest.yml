name: Radar de Leads - captura periódica
# Roda só na branch padrão (limitação do GitHub para "schedule") e apenas coleta de fontes HABILITADAS
# em qf_lead_sources com prova de autorização. Sem fonte habilitada ou sem segredos, não faz nada.
# Grava só em staging (qf_leads_externos): não cria pedidos, não envia notificações e não cobra créditos.
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Só classificar, sem gravar'
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: radar-leads-ingest
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Capturar oportunidades de fontes autorizadas
        env:
          SUPABASE_URL: ${{ secrets.RADAR_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.RADAR_SUPABASE_SERVICE_ROLE_KEY }}
          BSKY_HANDLE: ${{ secrets.RADAR_BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.RADAR_BSKY_APP_PASSWORD }}
        run: node scripts/radar-leads-run.cjs ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '--dry-run' || '' }}
