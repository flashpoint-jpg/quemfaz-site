name: Validar SEO Semrush
on:
  pull_request:
    paths:
      - 'scripts/build-client.cjs'
      - 'scripts/seo-semrush-20261109.cjs'
      - 'scripts/seo-search-console-prioridades.cjs'
      - 'scripts/seo-discovery-prioridades.cjs'
      - '.github/workflows/seo-semrush-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --check scripts/seo-search-console-prioridades.cjs
      - run: node --check scripts/seo-discovery-prioridades.cjs
      - name: Verificar sintaxe da correção
        run: node --check scripts/seo-semrush-20261109.cjs
      - name: Compilar páginas de SEO
        run: npm run build
      - name: Verificar páginas SEO geradas
        run: |
          node - <<'NODE'
          const fs=require('fs'),path=require('path');
          const services=['automacao-industrial','baba','guincho','professor-particular','tecnico-de-maquina-de-lavar'];
          const cities=['caieiras','duque-de-caxias','embu-guacu','ferraz-de-vasconcelos','guaruja','mairinque','mogi-das-cruzes','sao-jose-dos-campos','taboao-da-serra'];
          let ok=0;
          for(const p of [...services.map(s=>'servicos/'+s),...cities.map(c=>'servicos/cidades/'+c)]){
            const file=path.join('dist',p,'index.html');
            if(!fs.existsSync(file)){console.log('SEM PÁGINA:',p);continue}
            const html=fs.readFileSync(file,'utf8');
            if(!html.includes('data-semrush-seo="20261109"'))throw Error('Conteúdo ausente '+p);
            if(!html.includes('rel="canonical"'))throw Error('Canonical ausente '+p);
            ok++;
          }
          const fax=fs.readFileSync('dist/faxineira/index.html','utf8');
          if(!fax.includes('data-semrush-seo="20261109"'))throw Error('Faxineira sem conteúdo');
          for(const p of ['eletricista/santo-andre','eletricista/diadema','limpeza-de-sofa/santo-andre','limpeza-de-sofa/sao-bernardo-do-campo']){
            const file=path.join('dist','servicos',p,'index.html');
            if(fs.existsSync(file)&&fs.readFileSync(file,'utf8').includes('content="index,follow"')&&!fs.readFileSync(file,'utf8').includes('data-qf-gsc-20261109'))throw Error('Faltou conteúdo GSC: '+p);
          }
          const hub=fs.readFileSync('dist/servicos/index.html','utf8');
          if(!hub.includes('data-qf-discovery-20261109')||!hub.includes('/servicos/eletricista/guarulhos/'))throw Error('Links locais prioritários ausentes');
          if(!hub.includes('/servicos/pintor/sao-paulo/')||!hub.includes('/servicos/eletricista/sao-bernardo-do-campo/'))throw Error('Prioridades de maior oferta ausentes');
          const destaque=hub.match(/<section data-qf-discovery-20261109[\s\S]*?<\/section>/)?.[0]||'';
          if(destaque.includes('Muzambinho'))throw Error('Muzambinho ainda em destaque');
          console.log('Páginas com melhorias verificadas:',ok,'+ faxineira');
          if(ok<10)throw Error('Poucas páginas com correção ativa: '+ok);
          NODE
