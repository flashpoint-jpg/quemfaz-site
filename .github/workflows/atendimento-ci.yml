name: Atendimento obrigatório
on:
  pull_request:
  push:
    branches: ['feature/atendimento-obrigatorio', 'feat/pedido-simplificado-4-etapas']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regressao-e-navegador:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:atendimento:browser
  concorrencia-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local_only_dummy
          POSTGRES_DB: qf_atendimento_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d qf_atendimento_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:atendimento:postgres
        env:
          QF_TEST_DATABASE_URL: postgresql://postgres:local_only_dummy@127.0.0.1:5432/qf_atendimento_test
      - name: Regressão de recargas, planos e reconciliação
        run: bash tests/pagamentos-db.sh
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGPASSWORD: local_only_dummy
