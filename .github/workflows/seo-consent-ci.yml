name: SEO consent checks
on:
  pull_request:
    paths:
      - 'docs/seo-public-consent-proposal.sql'
      - 'tests/seo-consent-proposal.test.cjs'
      - 'tests/seo-consent-ui.test.cjs'
      - 'tests/seo-public-api.test.cjs'
      - 'api-inactive/profissionais-publicos.cjs'
      - 'scripts/qf-seo-consent-widget.js'
      - 'scripts/build-client.cjs'
      - '.github/workflows/seo-consent-ci.yml'
      - 'tests/seo-consent-rls.integration.sql'
      - '.github/workflows/seo-consent-db-manual.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  consent-static:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências dos testes de interface
        run: npm ci --ignore-scripts
      - name: Consent SQL static regression checks
        run: node --check scripts/qf-seo-consent-widget.js && node --test tests/seo-consent-proposal.test.cjs tests/seo-consent-ui.test.cjs tests/seo-public-api.test.cjs
  consent-isolated-postgres:
    if: github.event_name == 'pull_request' && github.head_ref == 'seo/implementacao-local-20261017'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local_only_dummy
          POSTGRES_DB: seo_consent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d seo_consent_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify disposable database identity
        env:
          PGPASSWORD: local_only_dummy
        run: |
          test "$GITHUB_EVENT_NAME" = "pull_request"
          test "$GITHUB_HEAD_REF" = "seo/implementacao-local-20261017"
          psql -h localhost -U postgres -d seo_consent_test -Atc "select current_database()" | grep -Fx seo_consent_test
      - name: Setup synthetic identities and roles
        env:
          PGPASSWORD: local_only_dummy
        run: psql -h localhost -U postgres -d seo_consent_test -v ON_ERROR_STOP=1 -f tests/seo-consent-db-fixture.sql
      - name: Apply SQL proposal to disposable database only
        env:
          PGPASSWORD: local_only_dummy
        run: psql -h localhost -U postgres -d seo_consent_test -v ON_ERROR_STOP=1 -f docs/seo-public-consent-proposal.sql
      - name: Execute real PostgreSQL RLS and consent assertions
        env:
          PGPASSWORD: local_only_dummy
        run: psql -h localhost -U postgres -d seo_consent_test -v ON_ERROR_STOP=1 -f tests/seo-consent-rls.integration.sql

