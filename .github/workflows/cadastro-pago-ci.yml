name: Cadastro profissional pago — validação sem cobranças
on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'qf-livre.js'
      - 'supabase/2026-10-28-cadastro-pago-obrigatorio.sql'
      - 'tests/cadastro-obrigatorio.test.cjs'
      - 'tests/pagamento-antes-da-conta.test.cjs'
      - '.github/workflows/cadastro-pago-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checkout-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: 'npm'
      - name: Instalar ferramentas sem scripts de terceiros
        run: npm ci --ignore-scripts
      - name: Build e testes estruturais do cadastro
        run: npm run build && node --test tests/cadastro-obrigatorio.test.cjs tests/pagamento-antes-da-conta.test.cjs
