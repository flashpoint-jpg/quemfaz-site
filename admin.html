        '<div class="row" style="gap:10px;"><label class="field" style="flex:1;"><span class="field__label">Versão atual do APK</span><input class="input" name="androidCurrent" placeholder="igual ao site"></label><label class="field" style="flex:1;"><span class="field__label">Versão mínima do APK</span><input class="input" name="androidMinimum" placeholder="igual ao site"></label></div>' +
        '<label class="field"><span class="field__label">Link para baixar o APK (https)</span><input class="input" name="apkUrl" type="url" placeholder="https://seudominio.com.br/QuemFaz.apk"></label>' +
        '<label class="field"><span class="field__label">Novidades (aparece na tela de atualização)</span><textarea class="textarea" name="notes" maxlength="600"></textarea></label>' +
        '<label class="card row-between" style="cursor:pointer;"><div><div class="text--strong">Forçar atualização</div><div class="text--sm text--secondary">Bloqueia quem não estiver na versão atual, mesmo acima da mínima.</div></div><input type="checkbox" name="force" style="width:22px;height:22px;accent-color:var(--orange-600);"></label>' +
        '<button class="btn btn--primary" type="submit">Salvar versão</button>' +
      '</form></div>';
  };
  function bindVersao(content) {
    const form = content.querySelector('#versao-form');
    const status = content.querySelector('#versao-status');
    if (!(global.QFAdminCloud && global.QFAdminCloud.enabled)) { status.textContent = 'Disponível apenas conectado ao Supabase.'; return; }
    global.QFAdminCloud.getAppConfig().then(function (c) {
      form.current.value = c.current_version || ''; form.minimum.value = c.minimum_required_version || '';
      form.androidCurrent.value = c.android_current_version && c.android_current_version !== c.current_version ? c.android_current_version : '';
      form.androidMinimum.value = c.android_minimum_version && c.android_minimum_version !== c.minimum_required_version ? c.android_minimum_version : '';
      form.apkUrl.value = c.apk_url || ''; form.notes.value = c.release_notes || ''; form.force.checked = !!c.force_update;
      status.textContent = 'Última alteração: ' + (c.atualizado_em ? PU.formatDateTime(c.atualizado_em) : '—');
    }).catch(function (err) { status.textContent = err.message; });
    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      const btn = form.querySelector('button[type="submit"]'); btn.disabled = true;
      try {
        await global.QFAdminCloud.saveAppConfig({ current: form.current.value.trim(), minimum: form.minimum.value.trim(), androidCurrent: form.androidCurrent.value.trim(), androidMinimum: form.androidMinimum.value.trim(), apkUrl: form.apkUrl.value.trim(), notes: form.notes.value.trim(), force: form.force.checked });
        PU.toast('Versão salva. Os aparelhos verificam ao abrir o app.', 'success');
        global.navigate('/admin/versao', true);
      } catch (err) { PU.toast((err && err.message) || 'Não foi possível salvar.', 'danger'); }
      finally { btn.disabled = false; }
    });
  }


  // ---------------- Suporte ----------------

  function supportStatusBadge(status) {
    if (status === 'resolvido') return '<span class="badge badge--success">Resolvido</span>';
    if (status === 'em_atendimento') return '<span class="badge badge--warning">Em atendimento</span>';
    return '<span class="badge badge--navy">Aberto</span>';
  }

  function supportUserName(ticket) {
    const p = DB.profissionalById(ticket.usuario_id);
    if (p) return p.nome || 'Profissional';
    const cl = DB.clienteById(ticket.usuario_id);
    if (cl) return cl.nome || 'Cliente';
    return ticket.usuario_tipo === 'profissional' ? 'Profissional' : 'Cliente';
  }

  Screens.adminSuporteRender = function () {
    const tickets = (global.QFAdminCloud && global.QFAdminCloud.supportTickets) || [];
    const ativos = tickets.filter(function(t){return t.status !== 'resolvido';});
    const resolvidos = tickets.filter(function(t){return t.status === 'resolvido';});
    function card(t) {
      return '<button class="card qf-admin-support-card" data-nav="/admin/suporte/'+t.id+'">' +
        '<div class="row-between"><div><div class="text--strong">'+PU.escapeHtml(supportUserName(t))+'</div><div class="text--sm text--secondary">'+PU.escapeHtml(t.assunto||'Suporte')+'</div></div>'+supportStatusBadge(t.status)+'</div>' +
        '<div class="row-between" style="margin-top:10px;"><span class="badge badge--muted">'+(t.usuario_tipo==='profissional'?'Profissional':'Cliente')+'</span><span class="text--sm text--muted">'+PU.escapeHtml(PU.formatDateTime(t.ultima_mensagem_em||t.atualizado_em))+'</span></div>' +
      '</button>';
    }
    return '<div class="view">' +
      '<div class="row-between" style="margin-bottom:12px;"><div><div class="h3">Central de suporte</div><div class="text--sm text--secondary">'+ativos.length+' atendimento(s) aguardando</div></div><button class="btn btn--sm btn--outline btn--block-auto" data-action="support-refresh">'+icon('refresh')+' Atualizar</button></div>' +
      (ativos.length?'<div class="qf-admin-support-list">'+ativos.map(card).join('')+'</div>':'<div class="empty-state"><div class="icon-tile icon-tile--ghost">'+icon('checkCircle')+'</div><div class="h3">Tudo resolvido</div><p class="text text--secondary">Nenhum atendimento aberto no momento.</p></div>') +
      (resolvidos.length?'<div class="section"><div class="section-head"><h2 class="h3">Resolvidos</h2></div><div class="qf-admin-support-list">'+resolvidos.slice(0,20).map(card).join('')+'</div></div>':'') +
    '</div>';
  };

  Screens.adminSuporteDetalheRender = function (params) {
    const tickets = (global.QFAdminCloud && global.QFAdminCloud.supportTickets) || [];
    const t = tickets.find(function(x){return x.id===params.id;});
    if (!t) return '<div class="view"><div class="empty-state"><p class="text text--secondary">Atendimento não encontrado.</p></div></div>';
    return '<div class="view stack">' +
      '<div class="card"><div class="row-between"><div><div class="h3">'+PU.escapeHtml(supportUserName(t))+'</div><div class="text--sm text--secondary">'+PU.escapeHtml(t.assunto||'Suporte')+'</div></div>'+supportStatusBadge(t.status)+'</div>' +
      '<div class="row" style="margin-top:10px;gap:7px;flex-wrap:wrap;"><span class="badge badge--muted">'+(t.usuario_tipo==='profissional'?'Profissional':'Cliente')+'</span><span class="text--sm text--muted">Aberto '+PU.escapeHtml(PU.formatDateTime(t.criado_em))+'</span></div></div>' +
      '<div class="card stack--sm"><div id="qf-admin-support-thread"><div class="text--sm text--secondary">Carregando conversa...</div></div></div>' +
      '<div class="card stack--sm"><label class="field"><span class="field__label">Status do atendimento</span><select class="select" id="qf-admin-support-status"><option value="aberto"'+(t.status==='aberto'?' selected':'')+'>Aberto</option><option value="em_atendimento"'+(t.status==='em_atendimento'?' selected':'')+'>Em atendimento</option><option value="resolvido"'+(t.status==='resolvido'?' selected':'')+'>Resolvido</option></select></label><button class="btn btn--outline" data-action="support-save-status">Salvar status</button></div>' +
    '</div>';
  };

  async function bindSuporteLista(content) {
    const b=content.querySelector('[data-action="support-refresh"]');
    if(b) b.addEventListener('click',async function(){b.disabled=true;try{await global.QFAdminCloud.syncSupport();global.navigate('/admin/suporte',true);}catch(err){PU.toast((err&&err.message)||'Não foi possível atualizar.','danger');b.disabled=false;}});
  }

  function bindSuporteDetalhe(content, params) {
    let timer=null;
    async function load(first) {
      const wrap=content.querySelector('#qf-admin-support-thread');
      if(!wrap) return;
      try {
        const tickets=global.QFAdminCloud.supportTickets||[];
        const ticket=tickets.find(function(x){return x.id===params.id;});
        const messages=await global.QFAdminCloud.getSupportMessages(params.id);
        const old=content.querySelector('#qf-admin-support-reply');
        const draft=old?old.value:'';
        const bubbles=messages.map(function(m){
          const admin=m.autor_tipo==='admin';
          return '<div class="qf-admin-support-msg'+(admin?' qf-admin-support-msg--admin':'')+'"><div class="qf-admin-support-msg__who">'+(admin?'Você / Suporte':'Usuário')+'</div><div class="qf-admin-support-msg__text">'+PU.escapeHtml(m.mensagem)+'</div><div class="qf-admin-support-msg__time">'+PU.escapeHtml(PU.formatDateTime(m.criado_em))+'</div></div>';
        }).join('');
        wrap.innerHTML='<div class="qf-admin-support-thread" id="qf-admin-support-message-list">'+(bubbles||'<div class="text--sm text--secondary">Nenhuma mensagem.</div>')+'</div>'+
          (ticket && ticket.status==='resolvido'
            ? '<div class="card card--tight" style="background:var(--success-100);border:none;"><div class="text--sm" style="color:var(--success-600);">Atendimento resolvido. Reabra pelo status se precisar responder novamente.</div></div>'
            : '<div class="qf-admin-support-reply"><textarea class="textarea" id="qf-admin-support-reply" maxlength="4000" placeholder="Responder ao usuário...">'+PU.escapeHtml(draft)+'</textarea><button class="btn btn--primary" id="qf-admin-support-send">'+icon('arrowRight')+' Enviar</button></div>');
        const list=content.querySelector('#qf-admin-support-message-list'); if(list&&(first||!draft))list.scrollTop=list.scrollHeight;
        const send=content.querySelector('#qf-admin-support-send');
        if(send) send.onclick=async function(){const inp=content.querySelector('#qf-admin-support-reply');const msg=inp.value.trim();if(!msg)return;send.disabled=true;try{await global.QFAdminCloud.supportReply(params.id,msg);inp.value='';await load(true);}catch(err){PU.toast((err&&err.message)||'Não foi possível enviar.','danger');send.disabled=false;}};
      } catch(err){wrap.innerHTML='<div class="text--sm" style="color:var(--danger-600);">'+PU.escapeHtml((err&&err.message)||'Não foi possível carregar a conversa.')+'</div>';}
    }
    load(true);
    timer=setInterval(function(){if(location.hash!=='#/admin/suporte/'+params.id){clearInterval(timer);return;}load(false);},4000);
    const save=content.querySelector('[data-action="support-save-status"]');
    if(save) save.addEventListener('click',async function(){save.disabled=true;try{const status=content.querySelector('#qf-admin-support-status').value;await global.QFAdminCloud.supportSetStatus(params.id,status);PU.toast(status==='resolvido'?'Atendimento resolvido.':'Status atualizado.','success');global.navigate('/admin/suporte/'+params.id,true);}catch(err){PU.toast((err&&err.message)||'Não foi possível atualizar.','danger');save.disabled=false;}});
  }

  function maisItem(iconName, label, to) {
    return '<button class="card row-between" style="width:100%;text-align:left;" data-nav="' + to + '">' +
      '<div class="row"><div class="icon-tile icon-tile--ghost">' + icon(iconName) + '</div><span class="text--strong">' + label + '</span></div>' +

  function alertKpi(value,label,warning){
    return '<div class="kpi-card"'+(warning?' style="border:2px solid var(--orange-500);background:var(--orange-100);"':'')+'><div class="kpi-card__value">'+PU.escapeHtml(String(value==null?'—':value))+'</div><div class="kpi-card__label">'+PU.escapeHtml(label)+'</div></div>';
  }
  function renderAlertMetrics(box,d){
    if(!box)return;
    d=d||{};
    const chamados=Number(d.chamados||0),aceitos=Number(d.aceitos||0);
    const pct=chamados?Math.round(aceitos/chamados*100):0;
    const regions=Array.isArray(d.regioes_sem_cobertura)?d.regioes_sem_cobertura:[];
    box.innerHTML=
      '<div class="kpi-grid">'+
        alertKpi(chamados,'Chamados')+
        alertKpi(aceitos+' · '+pct+'%','Aceitos')+
        alertKpi(Number(d.minutos_ate_aceite_media||0).toFixed(1)+' min','Média até aceitar')+
        alertKpi(Number(d.minutos_ate_aceite_mediana||0).toFixed(1)+' min','Mediana até aceitar')+
        alertKpi(Number(d.perdidos||0),'Perdidos')+
        alertKpi(Number(d.abertos_agora||0),'Abertos agora')+
        alertKpi(Number(d.sem_ninguem_avisado||0),'Sem ninguém avisado')+
        alertKpi(Number(d.profissionais_online||0),'Profissionais online')+
        alertKpi(Number(d.online_sem_notificacao||0),'Online sem notificação',Number(d.online_sem_notificacao||0)>0)+
        alertKpi(Number(d.online_localizacao_antiga||0),'Localização antiga')+
      '</div>'+
      '<div class="card" style="margin-top:12px;"><div class="text--strong">Regiões sem cobertura</div>'+
        (regions.length?'<div class="stack--sm" style="margin-top:10px;">'+regions.map(function(r){return '<div class="row-between"><span class="text--sm">'+PU.escapeHtml(r.regiao||'Região')+'</span><span class="badge badge--warning">'+Number(r.chamados||0)+' chamados</span></div>';}).join('')+'</div>':'<div class="text--sm text--secondary" style="margin-top:6px;">Nenhuma região sem cobertura neste período.</div>')+
      '</div>';
  }
  async function loadAlertMetrics(content,days){
    const box=content.querySelector('#admin-alert-metrics');
    if(!box||!(global.QFAdminCloud&&global.QFAdminCloud.alertMetrics))return;
    box.innerHTML='<div class="card card--tight"><div class="text--sm text--secondary">Carregando métricas de alerta…</div></div>';
    try{const d=await global.QFAdminCloud.alertMetrics(days);renderAlertMetrics(box,d);}
    catch(err){box.innerHTML='<div class="card card--tight" style="background:var(--warning-100);border:none;"><div class="text--sm" style="color:var(--warning-600);">Não foi possível carregar as métricas de alerta.</div></div>';console.warn('QuemFaz métricas de alerta',err);}
  }

  // ---------------- Interações pós-render ----------------

  const prevAfterRender = Screens.afterRender;
  Screens.afterRender = function (pattern, content, params, user) {
    if (prevAfterRender) prevAfterRender(pattern, content, params, user);

    if (pattern === '/admin/profissionais/:id') bindProfissionalDetalhe(content, params);
    if (pattern === '/admin/clientes') bindClientes(content);
    if (pattern === '/admin/servicos') bindServicosLista(content, params);
    if (pattern === '/admin/categorias') bindCategorias(content);
    if (pattern === '/admin/cidades') bindCidades(content);
    if (pattern === '/admin/comissao') bindComissao(content);
    if (pattern === '/admin/anuncios') bindAnuncios(content);
    if (pattern === '/admin/mais') bindMais(content);
    if (pattern === '/admin/versao') bindVersao(content);
    if (pattern === '/admin/suporte') bindSuporteLista(content);
    if (pattern === '/admin/suporte/:id') bindSuporteDetalhe(content, params);
    if (pattern === '/admin/dashboard') {
      const days=content.querySelector('#admin-alert-days');
      loadAlertMetrics(content, days ? Number(days.value) : 7);
      if(days)days.addEventListener('change',function(){loadAlertMetrics(content,Number(days.value)||7);});
      const rb = content.querySelector('[data-action="admin-refresh"]');
      if (rb) rb.addEventListener('click', async function () {
        rb.disabled = true;
        try { await Promise.all([global.QFAdminCloud.syncSnapshot(true), global.QFAdminCloud.syncAds()]); PU.toast('Painel atualizado.', 'success'); global.navigate('/admin/dashboard', true); }
        catch (err) { PU.toast('Não foi possível atualizar: ' + ((err && err.message) || err), 'danger'); rb.disabled = false; }
      });
    }
  };

  function bindProfissionalDetalhe(content, params) {
    content.addEventListener('click', function (e) {
      const el = e.target.closest('[data-action]');
      if (!el) return;
      const act = el.getAttribute('data-action');
      if (act === 'aprovar') {
        DB.aprovarProfissional(params.id);
        PU.toast('Profissional aprovado!', 'success');
        global.navigate('/admin/profissionais/' + params.id, true);
      }
      if (act === 'reprovar') {
        PU.openSheet(
          '<h3 class="sheet__title">Reprovar cadastro</h3>' +
          '<textarea class="textarea" id="motivo-reprovacao" placeholder="Explique o motivo para o profissional"></textarea>' +
          '<button class="btn btn--danger-ghost" id="confirmar-reprovacao" style="margin-top:12px;">Reprovar</button>'
        );
        document.getElementById('confirmar-reprovacao').addEventListener('click', function () {
          const motivo = document.getElementById('motivo-reprovacao').value.trim();
          PU.closeSheet();
          DB.reprovarProfissional(params.id, motivo);
          PU.toast('Cadastro reprovado.', 'danger');
          global.navigate('/admin/profissionais/' + params.id, true);
        });
      }
      if (cloudOn() && (act === 'toggle-bloqueio' || act === 'toggle-verificado' || act === 'add-creditos')) {
        const p = DB.profissionalById(params.id);
        (async function () {
          el.disabled = true;
          try {
            if (act === 'toggle-bloqueio') { await global.QFAdminCloud.setBlocked(params.id, !p.bloqueado); PU.toast(p.bloqueado ? 'Profissional desbloqueado.' : 'Profissional bloqueado.', null); }
            if (act === 'toggle-verificado') { await global.QFAdminCloud.setVerified(params.id, !p.verificado); PU.toast(p.verificado ? 'Selo removido.' : 'Profissional marcado como verificado.', 'success'); }
            if (act === 'add-creditos') {
              const cents = PU.parseCurrencyInput(content.querySelector('#credito-valor').value);
              if (!cents) { PU.toast('Informe o valor dos créditos.', 'danger'); return; }
              const ok = await PU.confirmDialog({ title: 'Adicionar créditos', message: 'Adicionar ' + PU.formatCurrency(cents) + ' na carteira de ' + p.nome + '?', okLabel: 'Adicionar' });
              if (!ok) return;
              const out = await global.QFAdminCloud.addCredits(params.id, cents, content.querySelector('#credito-desc').value.trim());
              PU.toast('Créditos adicionados. Novo saldo: ' + PU.formatCurrency(out.saldo_centavos || 0), 'success');
            }
            global.navigate('/admin/profissionais/' + params.id, true);
          } catch (err) { PU.toast((err && err.message) || 'Não foi possível concluir.', 'danger'); }
          finally { el.disabled = false; }
        })();
        return;
      }
      if (act === 'toggle-bloqueio') {
        const p = DB.profissionalById(params.id);
        DB.bloquearUsuario('profissional', params.id, !p.bloqueado);
        PU.toast(p.bloqueado ? 'Profissional desbloqueado.' : 'Profissional bloqueado.', null);
        global.navigate('/admin/profissionais/' + params.id, true);
      }
    });
  }

  function bindClientes(content) {
    content.addEventListener('click', function (e) {
      const el = e.target.closest('[data-toggle-cliente]');
      if (!el) return;
      const id = el.getAttribute('data-toggle-cliente');
      const c = DB.clienteById(id);
      if (cloudOn()) {
        el.disabled = true;
        global.QFAdminCloud.setBlocked(id, !c.bloqueado).then(function () {
          PU.toast(c.bloqueado ? 'Cliente desbloqueado.' : 'Cliente bloqueado.', null);
          global.navigate('/admin/clientes', true);
        }).catch(function (err) { el.disabled = false; PU.toast((err && err.message) || 'Não foi possível concluir.', 'danger'); });
        return;
      }
      DB.bloquearUsuario('cliente', id, !c.bloqueado);
      global.navigate('/admin/clientes', true);
    });
  }

  function bindServicosLista(content) {
    const seg = content.querySelector('#servicos-segmented');
    const lista = content.querySelector('#servicos-lista');
    seg.addEventListener('click', function (e) {
      const btn = e.target.closest('[data-tab]');
      if (!btn) return;
      Array.prototype.forEach.call(seg.querySelectorAll('.segmented__item'), function (b) { b.classList.remove('is-active'); });
      btn.classList.add('is-active');
      lista.innerHTML = renderServicosLista(DB.allRequests(), btn.getAttribute('data-tab'));
    });
  }

  function bindCategorias(content) {
    content.querySelector('#nova-categoria-form').addEventListener('submit', function (e) {
      e.preventDefault();
      const input = e.target.querySelector('[name="nome"]');
      if (!input.value.trim()) return;
      DB.criarCategoria(input.value.trim(), 'tag');
      PU.toast('Categoria adicionada.', 'success');
      global.navigate('/admin/categorias', true);
    });

      const el = e.target.closest('[data-remove-cat]');
      if (!el) return;
      DB.removerCategoria(el.getAttribute('data-remove-cat'));
      global.navigate('/admin/categorias', true);
    });
  }

  function bindCidades(content) {
    content.querySelector('#nova-cidade-form').addEventListener('submit', function (e) {
      e.preventDefault();
      const fd = new FormData(e.target);
      if (!fd.get('nome').trim()) return;
      DB.criarCidade(fd.get('nome').trim(), fd.get('uf').trim() || 'MG');
      PU.toast('Cidade adicionada.', 'success');
      global.navigate('/admin/cidades', true);
    });
    content.addEventListener('click', function (e) {
      const el = e.target.closest('[data-remove-city]');
      if (!el) return;
      DB.removerCidade(el.getAttribute('data-remove-city'));
      global.navigate('/admin/cidades', true);
    });
  }

  function bindComissao(content) {
    content.querySelector('#salvar-comissao').addEventListener('click', function () {
      const values = {
        padrao: PU.parseCurrencyInput(content.querySelector('#taxa-padrao').value),
        medio: PU.parseCurrencyInput(content.querySelector('#taxa-medio').value),
        premium: PU.parseCurrencyInput(content.querySelector('#taxa-premium').value),
        prioridadeCliente: PU.parseCurrencyInput(content.querySelector('#taxa-prioridade').value),
      };
      DB.setLeadFees(values);
      PU.toast('Valores dos chamados atualizados.', 'success');
    });
  }

  function bindAnuncios(content) {
    const save = content.querySelector('#salvar-planos-anuncio');
    if (save) save.addEventListener('click', async function () {
      const values = {
        local: PU.parseCurrencyInput(content.querySelector('#ad-price-local').value),
        destaque: PU.parseCurrencyInput(content.querySelector('#ad-price-destaque').value),
        premium: PU.parseCurrencyInput(content.querySelector('#ad-price-premium').value),
        maxSlots: Number(content.querySelector('#ad-max-slots').value || 4)
      };
      try {
        if (global.QFAdminCloud && global.QFAdminCloud.enabled) await global.QFAdminCloud.saveConfig(values);
        else DB.setAdPlans(values);
        PU.toast('Planos de anúncios atualizados.', 'success');
        global.navigate('/admin/anuncios', true);
      } catch (err) { PU.toast('Não foi possível salvar: ' + (err.message || err), 'danger'); }
    });
    content.addEventListener('click', async function (e) {
      const b = e.target.closest('[data-ad-action]'); if (!b) return;
      const id = b.getAttribute('data-id'), act = b.getAttribute('data-ad-action');
      try {
        if (act === 'aprovar') {
          const r = (global.QFAdminCloud && global.QFAdminCloud.enabled) ? await global.QFAdminCloud.approve(id) : DB.aprovarAnuncio(id);
          if (!r.ok && r.reason === 'limite') { PU.toast('Essa região já atingiu o limite de ' + r.max + ' anúncios ativos.', 'danger'); return; }
          if (!r.ok && r.reason === 'pagamento_nao_aprovado') { PU.toast('O pagamento deste anúncio ainda não foi aprovado.', 'danger'); return; }
          PU.toast('Anúncio aprovado e publicado por 30 dias.', 'success'); global.navigate('/admin/anuncios', true);
        }
        if (act === 'pausar') {
          if (global.QFAdminCloud && global.QFAdminCloud.enabled) await global.QFAdminCloud.pause(id); else DB.pausarAnuncio(id);
          PU.toast('Anúncio pausado.', null); global.navigate('/admin/anuncios', true);
        }
        if (act === 'reativar') {
          const r = (global.QFAdminCloud && global.QFAdminCloud.enabled) ? await global.QFAdminCloud.reactivate(id) : DB.reativarAnuncio(id);
          if (!r.ok) { PU.toast(r.reason === 'expirado' ? 'Este anúncio já expirou.' : 'Não há vaga disponível nesta região.', 'danger'); return; }
          PU.toast('Anúncio reativado.', 'success'); global.navigate('/admin/anuncios', true);
        }
        if (act === 'reprovar') {
          PU.openSheet('<h3 class="sheet__title">Reprovar anúncio</h3><textarea class="textarea" id="motivo-ad" placeholder="Motivo da reprovação"></textarea><button class="btn btn--danger-ghost" id="confirmar-reprovar-ad" style="margin-top:12px;">Reprovar</button>');
          document.getElementById('confirmar-reprovar-ad').onclick=async function(){
            const m=document.getElementById('motivo-ad').value.trim(); PU.closeSheet();
            try {
              if (global.QFAdminCloud && global.QFAdminCloud.enabled) await global.QFAdminCloud.reject(id,m); else DB.reprovarAnuncio(id,m);
              PU.toast('Anúncio reprovado.','danger'); global.navigate('/admin/anuncios',true);
            } catch (err) { PU.toast('Não foi possível reprovar: ' + (err.message || err), 'danger'); }
          };
        }
      } catch (err) { PU.toast('Erro no anúncio: ' + (err.message || err), 'danger'); }
    });
  }

  function bindMais(content) {
    content.addEventListener('click', function (e) {
      const el = e.target.closest('[data-action="restaurar-demo"]');
      if (!el) return;
      PU.confirmDialog({
        title: 'Restaurar dados de demonstração',
        message: 'Isso apaga todos os dados atuais (pedidos, cadastros e alterações) e restaura o conteúdo inicial de demonstração. Deseja continuar?',
        okLabel: 'Restaurar', danger: true,
      }).then(function (ok) {
        if (!ok) return;
        DB.resetDemoData();
        PU.toast('Dados de demonstração restaurados.', 'success');
        global.navigate('/', true);
      });
    });
  }
})(window);


/* QuemFaz — casca do app, roteador por hash e navegação. */

(function (global) {
  const DB = global.DB, PU = global.PU, icon = global.icon;
  const Screens = (global.Screens = global.Screens || {});

  const TABS = {
    cliente: [
      { id: 'home', label: 'Início', icon: 'home', route: '/cliente/home' },
      { id: 'pedidos', label: 'Pedidos', icon: 'clipboard', route: '/cliente/pedidos' },
      { id: 'perfil', label: 'Perfil', icon: 'user', route: '/cliente/perfil' },
    ],
    profissional: [
      { id: 'home', label: 'Chamadas', icon: 'phoneCall', route: '/profissional/home' },
      { id: 'servicos', label: 'Serviços', icon: 'clipboard', route: '/profissional/servicos' },
      { id: 'carteira', label: 'Créditos', icon: 'wallet', route: '/profissional/carteira' },
      { id: 'perfil', label: 'Perfil', icon: 'user', route: '/profissional/perfil' },
    ],
    admin: [
      { id: 'dashboard', label: 'Painel', icon: 'dashboard', route: '/admin/dashboard' },
      { id: 'profissionais', label: 'Prof.', icon: 'users', route: '/admin/profissionais' },
      { id: 'servicos', label: 'Serviços', icon: 'clipboard', route: '/admin/servicos' },
      { id: 'mais', label: 'Mais', icon: 'sliders', route: '/admin/mais' },
    ],
  };

  function currentSession() { return DB.getSession(); }

  function currentUser() {
    const s = currentSession();
    if (!s) return null;
    if (s.role === 'cliente') return DB.clienteById(s.userId);
    if (s.role === 'profissional') return DB.profissionalById(s.userId);
    if (s.role === 'admin') return DB.adminById(s.userId);
    return null;
  }

  function navigate(hash, replace) {
    if (replace) {
      const url = location.pathname + location.search + '#' + hash;
      history.replaceState(null, '', url);
      route();
    } else {
      location.hash = hash;
    }
  }
  global.navigate = navigate;

  // ---------------- Rotas ----------------

  const routes = [
    { pattern: '/', anon: true, render: function () { return Screens.landing(); } },
    { pattern: '/auth/:role/login', anon: true, render: function (p) { return Screens.authLogin(p); } },
    { pattern: '/auth/:role/cadastro', anon: true, render: function (p) { return Screens.authCadastro(p); } },

    { pattern: '/cliente/home', role: 'cliente', tab: 'home', title: 'QuemFaz', render: Screens.clienteHomeRender },
    { pattern: '/cliente/categoria/:catId', role: 'cliente', title: 'Categoria', back: '/cliente/home', render: Screens.clienteCategoriaRender },
    { pattern: '/cliente/novo-pedido/:catId', role: 'cliente', title: 'Solicitar serviço', back: '/cliente/home', render: Screens.clienteNovoPedidoRender },
    { pattern: '/cliente/pedidos', role: 'cliente', tab: 'pedidos', title: 'Meus pedidos', render: Screens.clientePedidosRender },
    { pattern: '/cliente/pedido/:id', role: 'cliente', title: 'Acompanhar pedido', back: '/cliente/pedidos', render: Screens.clientePedidoDetalheRender },
    { pattern: '/cliente/perfil', role: 'cliente', tab: 'perfil', title: 'Perfil', render: Screens.clientePerfilRender },
    { pattern: '/cliente/endereco', role: 'cliente', title: 'Meu endereço', back: '/cliente/perfil', render: Screens.clienteEnderecoRender },

    { pattern: '/profissional/home', role: 'profissional', tab: 'home', title: 'Chamadas', render: Screens.profHomeRender },
    { pattern: '/profissional/chamada/:id', role: 'profissional', title: 'Oportunidade de serviço', back: '/profissional/home', render: Screens.profChamadaRender },
    { pattern: '/profissional/servicos', role: 'profissional', tab: 'servicos', title: 'Meus serviços', render: Screens.profServicosRender },
    { pattern: '/profissional/pedido/:id', role: 'profissional', title: 'Detalhes do serviço', back: '/profissional/servicos', render: Screens.profPedidoDetalheRender },
    { pattern: '/profissional/orcamento/:id', role: 'profissional', title: 'Criar orçamento', back: '/profissional/servicos', render: Screens.profOrcamentoFormRender },
    { pattern: '/profissional/carteira', role: 'profissional', tab: 'carteira', title: 'Carteira', render: Screens.profCarteiraRender },
    { pattern: '/profissional/perfil', role: 'profissional', tab: 'perfil', title: 'Perfil profissional', render: Screens.profPerfilRender },
    { pattern: '/profissional/avaliacoes', role: 'profissional', title: 'Avaliações', back: '/profissional/perfil', render: Screens.profAvaliacoesRender },

    { pattern: '/admin/dashboard', role: 'admin', tab: 'dashboard', title: 'Painel administrativo', render: Screens.adminDashboardRender },
    { pattern: '/admin/profissionais', role: 'admin', tab: 'profissionais', title: 'Profissionais', render: Screens.adminProfissionaisRender },
    { pattern: '/admin/profissionais/:id', role: 'admin', title: 'Profissional', back: '/admin/profissionais', render: Screens.adminProfissionalDetalheRender },
    { pattern: '/admin/clientes', role: 'admin', title: 'Clientes', back: '/admin/mais', render: Screens.adminClientesRender },
    { pattern: '/admin/servicos', role: 'admin', tab: 'servicos', title: 'Serviços', render: Screens.adminServicosRender },
    { pattern: '/admin/servicos/:id', role: 'admin', title: 'Detalhe do serviço', back: '/admin/servicos', render: Screens.adminServicoDetalheRender },
    { pattern: '/admin/categorias', role: 'admin', title: 'Categorias', back: '/admin/mais', render: Screens.adminCategoriasRender },
    { pattern: '/admin/cidades', role: 'admin', title: 'Cidades e regiões', back: '/admin/mais', render: Screens.adminCidadesRender },
    { pattern: '/admin/comissao', role: 'admin', title: 'Taxas dos chamados', back: '/admin/mais', render: Screens.adminComissaoRender },
    { pattern: '/admin/anuncios', role: 'admin', title: 'Anúncios patrocinados', back: '/admin/mais', render: Screens.adminAnunciosRender },
    { pattern: '/admin/pagamentos', role: 'admin', title: 'Receitas do app', back: '/admin/mais', render: Screens.adminPagamentosRender },
    { pattern: '/admin/cancelamentos', role: 'admin', title: 'Cancelamentos', back: '/admin/mais', render: Screens.adminCancelamentosRender },
    { pattern: '/admin/suporte', role: 'admin', title: 'Central de suporte', back: '/admin/mais', render: Screens.adminSuporteRender },
    { pattern: '/admin/suporte/:id', role: 'admin', title: 'Atendimento', back: '/admin/suporte', render: Screens.adminSuporteDetalheRender },
    { pattern: '/admin/mais', role: 'admin', tab: 'mais', title: 'Mais opções', render: Screens.adminMaisRender },
    { pattern: '/admin/versao', role: 'admin', title: 'Versão do app', back: '/admin/mais', render: Screens.adminVersaoRender },
  ];

  function compilePattern(pattern) {
    const keys = [];
    const re = new RegExp('^' + pattern.replace(/:[^/]+/g, function (m) { keys.push(m.slice(1)); return '([^/]+)'; }) + '$');
    return { re: re, keys: keys };
  }
  routes.forEach(function (r) { const c = compilePattern(r.pattern); r._re = c.re; r._keys = c.keys; });

  function matchRoute(path) {
    for (let i = 0; i < routes.length; i++) {
      const r = routes[i];
      const m = r._re.exec(path);
      if (m) {
        const params = {};
        r._keys.forEach(function (k, idx) { params[k] = decodeURIComponent(m[idx + 1]); });
        return { route: r, params: params };
      }
    }
    return null;
  }

  function currentPath() {
    let h = location.hash || '#/';
    h = h.slice(1);
    if (!h) h = '/';
    return h;
  }

  async function route() {
    const path = currentPath();
    const found = matchRoute(path);
    let session = currentSession();

    if (session && session.role === 'admin' && global.QFAdminCloud && global.QFAdminCloud.enabled) {
      try {
        if (!(await global.QFAdminCloud.hasSession())) { DB.logout(); session = null; }
        else await Promise.all([global.QFAdminCloud.syncAds(), global.QFAdminCloud.syncSnapshot(), global.QFAdminCloud.syncSupport()]);
      } catch (err) {
        console.warn('QuemFaz admin sync', err);
        PU.toast('Não foi possível sincronizar o painel com o Supabase.', 'danger');
      }
    }

    if (!found) { navigate('/', true); return; }

    if (found.route.anon) {
      if (session && session.role !== 'admin') {
        DB.logout();
        renderAnon(found);
        return;
      }
      if (session && session.role === 'admin') {
        navigate('/admin/dashboard', true);
        return;
      }
      renderAnon(found);
      return;
    }

    if (!session || session.role !== found.route.role) {
      navigate('/', true);
      return;
    }
    const user = currentUser();
    if (!user) { DB.logout(); navigate('/', true); return; }
    if (user.bloqueado) {
      PU.toast('Seu acesso foi bloqueado pelo administrador.', 'danger');
      DB.logout();
      navigate('/', true);
      return;
    }
    renderApp(found, user, session);
  }

  function renderAnon(found) {
    const shell = document.getElementById('app-shell');
    shell.innerHTML = '<div id="app-content"></div>';
    const content = document.getElementById('app-content');
    content.style.paddingBottom = '0';
    content.innerHTML = found.route.render(found.params);
    bindGlobalDelegation(content);
    if (Screens.afterRenderAnon) Screens.afterRenderAnon(found.route.pattern, content, found.params);
    window.scrollTo(0, 0);
  }

  function renderApp(found, user, session) {
    const shell = document.getElementById('app-shell');
    const tabs = TABS[session.role] || [];
    const showTabbar = !!found.route.tab || tabs.some(function (t) { return t.route === '/' + session.role + currentPath().replace('/' + session.role, ''); });
    const isTabRoute = !!found.route.tab;

    let topbarHtml = '';
    if (found.route.back) {
      topbarHtml =
        '<div class="topbar">' +
        '<button class="topbar__back" data-nav="' + found.route.back + '" aria-label="Voltar">' + icon('chevronLeft') + '</button>' +
        '<h1 class="topbar__title">' + PU.escapeHtml(typeof found.route.title === 'function' ? found.route.title(found.params) : found.route.title) + '</h1>' +
        '</div>';
    } else if (isTabRoute) {
      topbarHtml =
        '<div class="topbar">' +
        '<h1 class="topbar__title">' + PU.escapeHtml(typeof found.route.title === 'function' ? found.route.title(found.params) : found.route.title) + '</h1>' +
        '</div>';
    }

    shell.innerHTML =
      '<a href="#app-content" class="skip-link">Pular para conteúdo</a>' +
      topbarHtml +
      '<main id="app-content" role="main"></main>' +
      renderTabbar(tabs, found.route.tab);

    const content = document.getElementById('app-content');
    content.innerHTML = found.route.render(found.params, user);
    bindGlobalDelegation(content);
    if (Screens.afterRender) Screens.afterRender(found.route.pattern, content, found.params, user);
    window.scrollTo(0, 0);
  }

  function renderTabbar(tabs, activeId) {
    if (!tabs.length) return '';
    return '<nav class="tabbar" aria-label="Navegação principal">' +
      tabs.map(function (t) {
        return '<button class="tabbar__item' + (t.id === activeId ? ' is-active' : '') + '" data-nav="' + t.route + '" aria-current="' + (t.id === activeId ? 'page' : 'false') + '">' +
          icon(t.icon) + '<span>' + t.label + '</span></button>';
      }).join('') +
      '</nav>';
  }

  // ---------------- Delegação global de eventos ----------------

  function bindGlobalDelegation(root) {
    root.addEventListener('click', function (e) {
      const navEl = e.target.closest('[data-nav]');
      if (navEl) { e.preventDefault(); navigate(navEl.getAttribute('data-nav')); return; }
    });
  }
  document.addEventListener('click', function (e) {
    const navEl = e.target.closest('[data-nav]');
    if (navEl && navEl.closest('.tabbar, .topbar')) { e.preventDefault(); navigate(navEl.getAttribute('data-nav')); }
    const logoutEl = e.target.closest('[data-logout]');
    if (logoutEl) {
      e.preventDefault();
      PU.confirmDialog({ title: 'Sair da conta', message: 'Deseja realmente sair?', okLabel: 'Sair' }).then(async function (ok) {
        if (!ok) return;
        if (global.QFAdminCloud && global.QFAdminCloud.enabled) await global.QFAdminCloud.signOut();
        DB.logout(); navigate('/', true);
      });
    }
  });

  window.addEventListener('hashchange', route);
  window.addEventListener('DOMContentLoaded', function () {
    DB.load();
    route();
    registerServiceWorker();
  });

  function registerServiceWorker() {
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
      navigator.serviceWorker.register('./sw.js').catch(function () { /* silencioso: app continua funcionando sem SW */ });
    }
  }

  global.PROAKI_APP = { navigate, currentSession, currentUser, route, TABS };
})(window);

</script>
