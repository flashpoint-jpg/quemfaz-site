<script>
/* QuemFaz — casca do app, roteador por hash e navegação. */

(function (global) {
  const DB = global.DB, PU = global.PU, icon = global.icon;
  const Screens = (global.Screens = global.Screens || {});

  const TABS = {
    cliente: [
      { id: 'home', label: 'Início', icon: 'home', route: '/cliente/home' },
      { id: 'pedidos', label: 'Pedidos', icon: 'clipboard', route: '/cliente/pedidos' },
      { id: 'perfil', label: 'Perfil', icon: 'user', route: '/cliente/perfil' },
    ],
    profissional: [
      { id: 'home', label: 'Chamadas', icon: 'phoneCall', route: '/profissional/home' },
      { id: 'servicos', label: 'Serviços', icon: 'clipboard', route: '/profissional/servicos' },
      { id: 'carteira', label: 'Créditos', icon: 'wallet', route: '/profissional/carteira' },
      { id: 'perfil', label: 'Perfil', icon: 'user', route: '/profissional/perfil' },
    ],
    admin: [
      { id: 'dashboard', label: 'Painel', icon: 'dashboard', route: '/admin/dashboard' },
      { id: 'profissionais', label: 'Prof.', icon: 'users', route: '/admin/profissionais' },
      { id: 'servicos', label: 'Serviços', icon: 'clipboard', route: '/admin/servicos' },
      { id: 'mais', label: 'Mais', icon: 'sliders', route: '/admin/mais' },
    ],
  };

  function currentSession() { return DB.getSession(); }

  function currentUser() {
    const s = currentSession();
    if (!s) return null;
    if (s.role === 'cliente') return DB.clienteById(s.userId);
    if (s.role === 'profissional') return DB.profissionalById(s.userId);
    if (s.role === 'admin') return DB.adminById(s.userId);
    return null;
  }

  function navigate(hash, replace) {
    if (replace) {
      const url = location.pathname + location.search + '#' + hash;
      history.replaceState(null, '', url);
      route();
    } else {
      location.hash = hash;
    }
  }
  global.navigate = navigate;

  // ---------------- Rotas ----------------

  const routes = [
    { pattern: '/admin/recrutamento', role: 'admin', title: 'Recrutamento', render: Screens.recrutAdminRender },

    { pattern: '/', anon: true, render: function () { return Screens.landing(); } },
    { pattern: '/auth/:role/login', anon: true, render: function (p) { return Screens.authLogin(p); } },
    { pattern: '/auth/:role/cadastro', anon: true, render: function (p) { return Screens.authCadastro(p); } },

    { pattern: '/cliente/home', role: 'cliente', tab: 'home', title: 'QuemFaz', render: Screens.clienteHomeRender },
    { pattern: '/cliente/categoria/:catId', role: 'cliente', title: 'Categoria', back: '/cliente/home', render: Screens.clienteCategoriaRender },
    { pattern: '/cliente/novo-pedido/:catId', role: 'cliente', title: 'Solicitar serviço', back: '/cliente/home', render: Screens.clienteNovoPedidoRender },
    { pattern: '/cliente/pedidos', role: 'cliente', tab: 'pedidos', title: 'Meus pedidos', render: Screens.clientePedidosRender },
    { pattern: '/cliente/pedido/:id', role: 'cliente', title: 'Acompanhar pedido', back: '/cliente/pedidos', render: Screens.clientePedidoDetalheRender },
    { pattern: '/cliente/perfil', role: 'cliente', tab: 'perfil', title: 'Perfil', render: Screens.clientePerfilRender },
    { pattern: '/cliente/endereco', role: 'cliente', title: 'Meu endereço', back: '/cliente/perfil', render: Screens.clienteEnderecoRender },

    { pattern: '/profissional/home', role: 'profissional', tab: 'home', title: 'Chamadas', render: Screens.profHomeRender },
    { pattern: '/profissional/chamada/:id', role: 'profissional', title: 'Oportunidade de serviço', back: '/profissional/home', render: Screens.profChamadaRender },
    { pattern: '/profissional/servicos', role: 'profissional', tab: 'servicos', title: 'Meus serviços', render: Screens.profServicosRender },
    { pattern: '/profissional/pedido/:id', role: 'profissional', title: 'Detalhes do serviço', back: '/profissional/servicos', render: Screens.profPedidoDetalheRender },
    { pattern: '/profissional/orcamento/:id', role: 'profissional', title: 'Criar orçamento', back: '/profissional/servicos', render: Screens.profOrcamentoFormRender },
    { pattern: '/profissional/carteira', role: 'profissional', tab: 'carteira', title: 'Carteira', render: Screens.profCarteiraRender },
    { pattern: '/profissional/perfil', role: 'profissional', tab: 'perfil', title: 'Perfil profissional', render: Screens.profPerfilRender },
    { pattern: '/profissional/avaliacoes', role: 'profissional', title: 'Avaliações', back: '/profissional/perfil', render: Screens.profAvaliacoesRender },

    { pattern: '/admin/dashboard', role: 'admin', tab: 'dashboard', title: 'Início', render: Screens.adminDashboardRender },
    { pattern: '/admin/profissionais', role: 'admin', tab: 'profissionais', title: 'Profissionais', render: Screens.adminProfissionaisRender },
    { pattern: '/admin/profissionais/:id', role: 'admin', title: 'Profissional', back: '/admin/profissionais', render: Screens.adminProfissionalDetalheRender },
    { pattern: '/admin/clientes', role: 'admin', title: 'Clientes', render: Screens.adminClientesRender },
    { pattern: '/admin/servicos', role: 'admin', tab: 'servicos', title: 'Pedidos', render: Screens.adminServicosRender },
    { pattern: '/admin/servicos/:id', role: 'admin', title: 'Detalhe do serviço', back: '/admin/servicos', render: Screens.adminServicoDetalheRender },
    { pattern: '/admin/categorias', role: 'admin', title: 'Categorias', back: '/admin/configuracoes', render: Screens.adminCategoriasRender },
    { pattern: '/admin/cidades', role: 'admin', title: 'Cidades e regiões', back: '/admin/configuracoes', render: Screens.adminCidadesRender },
    { pattern: '/admin/comissao', role: 'admin', title: 'Taxas dos chamados', back: '/admin/configuracoes', render: Screens.adminComissaoRender },
    { pattern: '/admin/anuncios', role: 'admin', title: 'Planos e anúncios', render: Screens.adminAnunciosRender },
    { pattern: '/admin/pagamentos', role: 'admin', title: 'Receita', render: Screens.adminPagamentosRender },
    { pattern: '/admin/cancelamentos', role: 'admin', title: 'Cancelamentos', back: '/admin/servicos', render: Screens.adminCancelamentosRender },
    { pattern: '/admin/avisar-acesso', role: 'admin', title: 'Avisar quem não entrou', back: '/admin/comunicados', render: function(){ return Screens.adminAvisarAcessoRender(); } },
    { pattern: '/admin/sem-push', role: 'admin', title: 'Profissionais sem notificações', back: '/admin/comunicados', render: function(){ return Screens.adminSemPushRender(); } },
    { pattern: '/admin/suporte', role: 'admin', title: 'Suporte', render: Screens.adminSuporteRender },
    { pattern: '/admin/suporte/:id', role: 'admin', title: 'Atendimento', back: '/admin/suporte', render: Screens.adminSuporteDetalheRender },
    { pattern: '/admin/mais', role: 'admin', tab: 'mais', title: 'Mais opções', render: Screens.adminMaisRender },
    { pattern: '/admin/desbloqueios', role: 'admin', title: 'Desbloqueios', render: Screens.adminDesbloqueiosRender },
    { pattern: '/admin/finalizados', role: 'admin', title: 'Chamados finalizados', render: Screens.adminFinalizadosRender },
    { pattern: '/admin/por-cidade', role: 'admin', title: 'Por cidade', render: Screens.adminPorCidadeRender },
    { pattern: '/admin/verificacoes', role: 'admin', title: 'Verificações', render: Screens.adminVerificacoesRender },
    { pattern: '/admin/comunicados', role: 'admin', title: 'Comunicados', render: Screens.adminComunicadosRender },
    { pattern: '/admin/bonus', role: 'admin', title: 'Bônus', render: Screens.adminBonusRender },
    { pattern: '/admin/planos', role: 'admin', title: 'Planos dos profissionais', render: Screens.adminPlanosRender },
    { pattern: '/admin/configuracoes', role: 'admin', title: 'Configurações', render: Screens.adminConfiguracoesRender },
    { pattern: '/admin/versao', role: 'admin', title: 'Versão do app', back: '/admin/configuracoes', render: Screens.adminVersaoRender },
  ];

  function compilePattern(pattern) {
    const keys = [];
    const re = new RegExp('^' + pattern.replace(/:[^/]+/g, function (m) { keys.push(m.slice(1)); return '([^/]+)'; }) + '$');
    return { re: re, keys: keys };
  }
  routes.forEach(function (r) { const c = compilePattern(r.pattern); r._re = c.re; r._keys = c.keys; });

  function matchRoute(path) {
    for (let i = 0; i < routes.length; i++) {
      const r = routes[i];
      const m = r._re.exec(path);
      if (m) {
        const params = {};
        r._keys.forEach(function (k, idx) { params[k] = decodeURIComponent(m[idx + 1]); });
        return { route: r, params: params };
      }
    }
    return null;
  }

  function currentPath() {
    let h = location.hash || '#/';
    h = h.slice(1);
    if (!h) h = '/';
    return h;
  }

  function renderConnectionError() {
    const shell = document.getElementById('app-shell');
    shell.innerHTML = '<div style="padding:48px 24px;text-align:center;max-width:440px;margin:0 auto;">' +
      '<h1 class="h2">Não foi possível carregar o painel</h1>' +
      '<p class="text text--secondary" style="margin:16px 0;">A conexão demorou. Seus cadastros continuam salvos. Tente novamente em instantes.</p>' +
      '<button class="btn btn--primary" id="qf-admin-retry">Tentar novamente</button></div>';
    document.getElementById('qf-admin-retry').onclick = function () { location.reload(); };
  }

  async function route() {
    const path = currentPath();
    const found = matchRoute(path);
    let session = currentSession();

    if (session && session.role === 'admin' && global.QFAdminCloud && global.QFAdminCloud.enabled) {
      try {
        if (!(await global.QFAdminCloud.hasSession())) { DB.logout(); session = null; }
        // V11.29.1: depois da primeira carga, a tela abre na hora com o que já está no aparelho
        // e os dados novos chegam por trás — o menu de baixo não espera mais a internet.
        else if (painelSincronizadoEm) atualizarPainelPorTras(path);
        else { await sincronizarPainel(); painelSincronizadoEm = Date.now(); }
      } catch (err) {
        console.warn('QuemFaz admin sync', err);
        renderConnectionError();
        return;
      }
    }

    if (!found) { navigate('/', true); return; }

    if (found.route.anon) {
      if (session && session.role !== 'admin') {
        DB.logout();
        renderAnon(found);
        return;
      }
      if (session && session.role === 'admin') {
        navigate('/admin/dashboard', true);
        return;
      }
      renderAnon(found);
      return;
    }

    if (!session || session.role !== found.route.role) {
      navigate('/', true);
      return;
    }
    const user = currentUser();
    if (!user) { DB.logout(); navigate('/', true); return; }
    if (user.bloqueado) {
      PU.toast('Seu acesso foi bloqueado pelo administrador.', 'danger');
      DB.logout();
      navigate('/', true);
      return;
    }
    telaMexida = false;
    renderApp(found, user, session);
  }

  var painelSincronizadoEm = 0, painelSincronizando = false, telaMexida = false;
  // V11.30.3: guarda o que está desenhado para não redesenhar a tela quando nada mudou.
  var ultimoDesenho = { path: null, html: '' };
  function semHorario(html) { return String(html == null ? '' : html).replace(/Atualizado em [^<]*/g, ''); }
  function sincronizarPainel() {
    return global.QFConnection.deadline(Promise.all([global.QFAdminCloud.syncAds(), global.QFAdminCloud.syncSnapshot(), global.QFAdminCloud.syncSupport()]), 15000, 'painel administrativo');
  }
  function atualizarPainelPorTras(path) {
    if (painelSincronizando || Date.now() - painelSincronizadoEm < 20000) return;
    painelSincronizando = true;
    sincronizarPainel().then(function () {
      painelSincronizadoEm = Date.now();
      // Só redesenha se a pessoa continua na mesma tela e ainda não tocou em nada dela.
      if (telaMexida || currentPath() !== path) return;
      const f = matchRoute(path), s = currentSession(), u = currentUser();
      if (!f || f.route.anon || !s || !u || s.role !== f.route.role) return;
      // V11.30.3: se os dados novos dão a mesma tela, não redesenha (era o "pisca" de tela antiga -> nova).
      let novo = null;
      try { novo = typeof f.route.render === 'function' ? f.route.render(f.params, u) : null; } catch (_) { novo = null; }
      if (novo != null && ultimoDesenho.path === path && semHorario(novo) === semHorario(ultimoDesenho.html)) {
        const hora = /Atualizado em [^<]*/.exec(novo);
        const rotulo = typeof document !== 'undefined' && document.querySelector ? document.querySelector('.qf-painel__topo span') : null;
        if (hora && rotulo) rotulo.textContent = hora[0];
        ultimoDesenho.html = novo;
        return;
      }
      const y = window.scrollY || 0;
      renderApp(f, u, s);
      window.scrollTo(0, y);
    }).catch(function (err) { console.warn('QuemFaz admin sync', err); })
      .then(function () { painelSincronizando = false; });
  }
  if (typeof document !== 'undefined' && document.addEventListener) ['pointerdown', 'keydown', 'input'].forEach(function (ev) {
    document.addEventListener(ev, function (e) {
      if (e.target && e.target.closest && e.target.closest('#app-content')) telaMexida = true;
    }, true);
  });

  function semMolduraAdmin(shell) { shell.className = ''; document.body.classList.remove('qf-adm-body'); }
  function renderAnon(found) {
    const shell = document.getElementById('app-shell');
    semMolduraAdmin(shell);
    shell.innerHTML = '<div id="app-content"></div>';
    const content = document.getElementById('app-content');
    content.style.paddingBottom = '0';
    content.innerHTML = found.route.render(found.params);
    bindGlobalDelegation(content);
    if (Screens.afterRenderAnon) Screens.afterRenderAnon(found.route.pattern, content, found.params);
    window.scrollTo(0, 0);
  }

  // V11.45: menu lateral do painel. Cada rota do admin acende um item (as telas internas acendem o item de origem).
  const ADMIN_MENU = [
    { id: 'inicio', label: 'Início', icon: 'home', route: '/admin/dashboard' },
    { id: 'pedidos', label: 'Pedidos', icon: 'clipboard', route: '/admin/servicos', also: ['/admin/servicos/:id', '/admin/cancelamentos'] },
    { id: 'desbloqueios', label: 'Desbloqueios', icon: 'unlock', route: '/admin/desbloqueios' },
    { id: 'finalizados', label: 'Finalizados', icon: 'checkCircle', route: '/admin/finalizados' },
    { id: 'profissionais', label: 'Profissionais', icon: 'users', route: '/admin/profissionais', also: ['/admin/profissionais/:id'] },
    { id: 'cidades', label: 'Por cidade', icon: 'mapPin', route: '/admin/por-cidade' },
    { id: 'clientes', label: 'Clientes', icon: 'user', route: '/admin/clientes' },
    { id: 'receita', label: 'Receita', icon: 'money', route: '/admin/pagamentos' },
    { id: 'verificacoes', label: 'Verificações', icon: 'shieldCheck', route: '/admin/verificacoes' },
    { id: 'comunicados', label: 'Comunicados', icon: 'megaphone', route: '/admin/comunicados', also: ['/admin/avisar-acesso', '/admin/sem-push'] },
    { id: 'bonus', label: 'Bônus', icon: 'gift', route: '/admin/bonus' },
    { id: 'assinaturas', label: 'Planos dos profissionais', icon: 'wallet', route: '/admin/planos' },
    { id: 'planos', label: 'Planos e anúncios', icon: 'image', route: '/admin/anuncios' },
    { id: 'suporte', label: 'Suporte', icon: 'chat', route: '/admin/suporte', also: ['/admin/suporte/:id'] },
    { id: 'recrutamento', label: 'Recrutamento', icon: 'briefcase', route: '/admin/recrutamento' },
    { divider: true },
    { id: 'config', label: 'Configurações', icon: 'settings', route: '/admin/configuracoes', also: ['/admin/mais', '/admin/categorias', '/admin/cidades', '/admin/comissao', '/admin/versao'] },
  ];
  // Botão principal de cada página (à direita do título). Só navegação ou ações que o painel já tinha.
  const ADMIN_ACAO = {
    '/admin/dashboard': '<button type="button" class="btn btn--primary qf-adm-head__btn" data-nav="/admin/comunicados">' + icon('megaphone') + 'Enviar comunicado</button>',
    '/admin/servicos': '<button type="button" class="btn btn--primary qf-adm-head__btn" data-adm-baixar="pedidos">' + icon('download') + 'Baixar tudo</button>',
    '/admin/desbloqueios': '<button type="button" class="btn btn--primary qf-adm-head__btn" data-nav="/admin/servicos">' + icon('clipboard') + 'Ver pedidos</button>',
    '/admin/profissionais': '<button type="button" class="btn btn--primary qf-adm-head__btn" data-nav="/admin/por-cidade">' + icon('mapPin') + 'Ver por cidade</button>',
    '/admin/por-cidade': '<button type="button" class="btn btn--primary qf-adm-head__btn" data-nav="/admin/profissionais">' + icon('users') + 'Ver profissionais</button>',
    '/admin/verificacoes': '<button type="button" class="btn btn--primary qf-adm-head__btn" data-nav="/admin/profissionais">' + icon('users') + 'Ver profissionais</button>',
    '/admin/comunicados': '<button type="button" class="btn btn--primary qf-adm-head__btn" data-nav="/admin/avisar-acesso">' + icon('users') + 'Avisar quem não entrou</button>',
    '/admin/bonus': '<button type="button" class="btn btn--primary qf-adm-head__btn" data-nav="/admin/profissionais">' + icon('users') + 'Ver profissionais</button>',
    '/admin/planos': '<button type="button" class="btn btn--primary qf-adm-head__btn" data-nav="/admin/pagamentos">' + icon('money') + 'Ver receita</button>',
    '/admin/configuracoes': '<button type="button" class="btn btn--primary qf-adm-head__btn" data-nav="/admin/categorias">' + icon('tag') + 'Categorias</button>',
  };
  function adminMenuAtivo(pattern) {
    const item = ADMIN_MENU.find(function (m) { return m.route === pattern || (m.also && m.also.indexOf(pattern) !== -1); });
    return item ? item.id : '';
  }
  function adminInicial(user) { const n = String((user && user.nome) || 'A').trim(); return (n[0] || 'A').toUpperCase(); }
  function renderAdminApp(found, user) {
    const shell = document.getElementById('app-shell');
    const pattern = found.route.pattern;
    const ativo = adminMenuAtivo(pattern);
    const raiz = ADMIN_MENU.some(function (m) { return m.route === pattern; });
    const titulo = typeof found.route.title === 'function' ? found.route.title(found.params) : found.route.title;
    let pend = 0;
    try { pend = global.QFAdminLayout ? global.QFAdminLayout.pendencias() : 0; } catch (_) { pend = 0; }
    shell.className = 'qf-adm';
    shell.innerHTML =
      '<a href="#app-content" class="skip-link">Pular para conteúdo</a>' +
      '<header class="qf-adm-top">' +
        '<button type="button" class="qf-adm-top__btn qf-adm-top__menu" data-adm-menu aria-label="Abrir menu" aria-controls="qf-adm-side" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>' +
        '<div class="qf-adm-top__marca"><b>QuemFaz</b><span aria-hidden="true">|</span><span class="qf-adm-top__sub"><span class="qf-adm-top__longo">Painel do administrador</span><span class="qf-adm-top__curto">Admin</span></span></div>' +
        '<div class="qf-adm-top__acoes">' +
          '<button type="button" class="qf-adm-top__btn" data-adm-avisos aria-label="Avisos' + (pend ? ': ' + pend + ' pendentes' : '') + '">' + icon('bell') + (pend ? '<span class="qf-adm-top__badge">' + (pend > 99 ? '99+' : pend) + '</span>' : '') + '</button>' +
          '<button type="button" class="qf-adm-top__btn" data-nav="/admin/configuracoes" aria-label="Configurações">' + icon('settings') + '</button>' +
          '<div class="qf-adm-conta"><button type="button" class="qf-adm-top__avatar" data-adm-conta aria-label="Conta do administrador" aria-expanded="false" aria-controls="qf-adm-conta-menu">' + PU.escapeHtml(adminInicial(user)) + '</button>' +
            '<div class="qf-adm-conta__menu" id="qf-adm-conta-menu" hidden><b>' + PU.escapeHtml((user && user.nome) || 'Administrador') + '</b>' + (user && user.email ? '<small>' + PU.escapeHtml(user.email) + '</small>' : '') +
            '<button type="button" class="btn btn--outline btn--sm" data-logout>' + icon('logout') + ' Sair da conta</button></div></div>' +
        '</div>' +
      '</header>' +
      '<div class="qf-adm-corpo">' +
        '<aside class="qf-adm-side" id="qf-adm-side" aria-label="Menu do painel">' +
          '<div class="qf-adm-site">' + icon('location') + '<span>quemfazservico.com.br</span></div>' +
          '<nav class="qf-adm-nav">' + ADMIN_MENU.map(function (m) {
            if (m.divider) return '<hr class="qf-adm-nav__sep">';
            return '<button type="button" class="qf-adm-nav__item' + (m.id === ativo ? ' is-active' : '') + '" data-nav="' + m.route + '"' + (m.id === ativo ? ' aria-current="page"' : '') + '>' + icon(m.icon) + '<span>' + m.label + '</span></button>';
          }).join('') + '</nav>' +
        '</aside>' +
        '<div class="qf-adm-fundo" data-adm-menu-fechar hidden></div>' +
        '<div class="qf-adm-main"><div class="qf-adm-pagina">' +
          (found.route.back && !raiz ? '<button type="button" class="qf-adm-voltar" data-nav="' + found.route.back + '">' + icon('chevronLeft') + 'Voltar</button>' : '') +
          '<div class="qf-adm-head"><h1>' + PU.escapeHtml(titulo) + '</h1>' + (ADMIN_ACAO[pattern] || '') + '</div>' +
          '<main id="app-content" role="main"></main>' +
        '</div></div>' +
      '</div>';
    document.body.classList.add('qf-adm-body');
    const content = document.getElementById('app-content');
    const telaHtml = found.route.render(found.params, user);
    ultimoDesenho = { path: currentPath(), html: telaHtml };
    content.innerHTML = telaHtml;
    bindGlobalDelegation(content);
    if (Screens.afterRender) Screens.afterRender(found.route.pattern, content, found.params, user);
    window.scrollTo(0, 0);
  }
  function adminMenuAbrir(abrir) {
    const shell = document.getElementById('app-shell');
    if (!shell || !shell.classList.contains('qf-adm')) return;
    shell.classList.toggle('qf-adm--menu', abrir);
    const fundo = shell.querySelector('[data-adm-menu-fechar]');
    if (fundo) fundo.hidden = !abrir;
    const b = shell.querySelector('[data-adm-menu]');
    if (b) b.setAttribute('aria-expanded', String(abrir));
  }
  document.addEventListener('click', function (e) {
    if (e.target.closest('[data-adm-menu]')) { e.preventDefault(); adminMenuAbrir(!document.getElementById('app-shell').classList.contains('qf-adm--menu')); return; }
    if (e.target.closest('[data-adm-menu-fechar]')) { adminMenuAbrir(false); return; }
    if (e.target.closest('[data-adm-avisos]')) {
      e.preventDefault();
      const alvo = document.querySelector('.qf-p-precisa');
      if (alvo) { alvo.scrollIntoView({ block: 'start', behavior: 'smooth' }); return; }
      try { sessionStorage.setItem('qf_adm_ir_precisa', '1'); } catch (_) {}
      navigate('/admin/dashboard');
    }
    const contaBtn = e.target.closest('[data-adm-conta]');
    if (contaBtn) { contaAbrir(contaBtn.getAttribute('aria-expanded') !== 'true'); return; }
    if (!e.target.closest('.qf-adm-conta')) contaAbrir(false);
  });
  function contaAbrir(abrir) {
    const b = document.querySelector('[data-adm-conta]'), m = document.getElementById('qf-adm-conta-menu');
    if (!b || !m) return;
    b.setAttribute('aria-expanded', String(abrir)); m.hidden = !abrir;
  }
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { adminMenuAbrir(false); contaAbrir(false); }
  });

  function renderApp(found, user, session) {
    if (session.role === 'admin') { renderAdminApp(found, user); return; }
    const shell = document.getElementById('app-shell');
    semMolduraAdmin(shell);
    const tabs = TABS[session.role] || [];
    const showTabbar = !!found.route.tab || tabs.some(function (t) { return t.route === '/' + session.role + currentPath().replace('/' + session.role, ''); });
    const isTabRoute = !!found.route.tab;

    let topbarHtml = '';
    if (found.route.back) {
      topbarHtml =
        '<div class="topbar">' +
        '<button class="topbar__back" data-nav="' + found.route.back + '" aria-label="Voltar">' + icon('chevronLeft') + '</button>' +
        '<h1 class="topbar__title">' + PU.escapeHtml(typeof found.route.title === 'function' ? found.route.title(found.params) : found.route.title) + '</h1>' +
        '</div>';
    } else if (isTabRoute) {
      topbarHtml =
        '<div class="topbar">' +
        '<h1 class="topbar__title">' + PU.escapeHtml(typeof found.route.title === 'function' ? found.route.title(found.params) : found.route.title) + '</h1>' +
        '</div>';
    }

    shell.innerHTML =
      '<a href="#app-content" class="skip-link">Pular para conteúdo</a>' +
      topbarHtml +
      '<main id="app-content" role="main"></main>' +
      renderTabbar(tabs, found.route.tab);

    const content = document.getElementById('app-content');
    const telaHtml = found.route.render(found.params, user);
    ultimoDesenho = { path: currentPath(), html: telaHtml };
    content.innerHTML = telaHtml;
    bindGlobalDelegation(content);
    if (Screens.afterRender) Screens.afterRender(found.route.pattern, content, found.params, user);
    window.scrollTo(0, 0);
  }

  function renderTabbar(tabs, activeId) {
    if (!tabs.length) return '';
    return '<nav class="tabbar" aria-label="Navegação principal">' +
      tabs.map(function (t) {
        return '<button class="tabbar__item' + (t.id === activeId ? ' is-active' : '') + '" data-nav="' + t.route + '" aria-current="' + (t.id === activeId ? 'page' : 'false') + '">' +
          icon(t.icon) + '<span>' + t.label + '</span></button>';
      }).join('') +
      '</nav>';
  }

  // ---------------- Delegação global de eventos ----------------

  function bindGlobalDelegation(root) {
    root.addEventListener('click', function (e) {
      const navEl = e.target.closest('[data-nav]');
      if (navEl) { e.preventDefault(); navigate(navEl.getAttribute('data-nav')); return; }
    });
  }
  document.addEventListener('click', function (e) {
    const navEl = e.target.closest('[data-nav]');
    if (navEl && navEl.closest('.tabbar, .topbar, .qf-adm-top, .qf-adm-side, .qf-adm-pagina > .qf-adm-head, .qf-adm-voltar')) { e.preventDefault(); adminMenuAbrir(false); navigate(navEl.getAttribute('data-nav')); }
    const logoutEl = e.target.closest('[data-logout]');
    if (logoutEl) {
      e.preventDefault();
      PU.confirmDialog({ title: 'Sair da conta', message: 'Deseja realmente sair?', okLabel: 'Sair' }).then(async function (ok) {
        if (!ok) return;
        if (global.QFAdminCloud && global.QFAdminCloud.enabled) await global.QFAdminCloud.signOut();
        DB.logout(); navigate('/', true);
      });
    }
  });

  window.addEventListener('hashchange', route);
  window.addEventListener('DOMContentLoaded', function () {
    DB.load();
    route().catch(function (err) { console.error('QuemFaz admin: inicialização', err); renderConnectionError(); });
    registerServiceWorker();
  });

  function registerServiceWorker() {
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
      navigator.serviceWorker.register('./sw.js').catch(function () { /* silencioso: app continua funcionando sem SW */ });
    }
  }

  global.PROAKI_APP = { navigate, currentSession, currentUser, route, TABS };
})(window);

</script>
<script>/* V11.4: sombra na barra de cima ao rolar */(function(){var on=false;function u(){var s=(window.scrollY||0)>4;if(s!==on){on=s;document.documentElement.classList.toggle("qf-scrolled",s);}}window.addEventListener("scroll",u,{passive:true});u();})();</script>
