  Screens.afterRenderAnon = function (pattern, content, params) {
    if (pattern === '/auth/:role/login') {
      const form = content.querySelector('#login-form');
      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        const fd = new FormData(form);
        let res;
        if (params.role === 'admin' && global.QFAdminCloud && global.QFAdminCloud.enabled) {
          res = await global.QFAdminCloud.signIn(fd.get('email').trim(), fd.get('senha'));
          if (res.ok) {
            DB.setSession({ role:'admin', userId:'admin_1' });
            res.user = DB.adminById('admin_1');
          }
        } else {
          // V10.2: sem conexão com o Supabase não existe login local de demonstração.
          res = { ok: false, error: 'Não foi possível conectar ao Supabase. Verifique a internet e recarregue a página.' };
        }
        if (!res.ok) { PU.toast(res.error, 'danger'); return; }
        PU.toast('Acesso administrativo liberado.', 'success');
        global.navigate('/admin/dashboard', true);
      });
    }

    if (pattern === '/auth/:role/cadastro' && params.role === 'cliente') {
      const form = content.querySelector('#cadastro-cliente-form');
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        const fd = new FormData(form);
        const email = fd.get('email').trim();
        if (DB.emailExists('cliente', email)) { PU.toast('Já existe uma conta com este e-mail.', 'danger'); return; }
        const user = DB.cadastrarCliente({ nome: fd.get('nome').trim(), email: email, senha: fd.get('senha'), telefone: fd.get('telefone').trim() });
        DB.setSession({ role: 'cliente', userId: user.id });
        PU.toast('Conta criada com sucesso!', 'success');
        global.navigate('/cliente/home', true);
      });
    }

    if (pattern === '/auth/:role/cadastro' && params.role === 'profissional') {
      const form = content.querySelector('#cadastro-prof-form');
      const chipsWrap = content.querySelector('#cadastro-prof-cats');
      const hiddenInput = content.querySelector('#cadastro-prof-cats-input');
      let selected = [];
      chipsWrap.addEventListener('click', function (e) {
        const chip = e.target.closest('[data-chip-cat]');
        if (!chip) return;
        const id = chip.getAttribute('data-chip-cat');
        if (selected.indexOf(id) === -1) selected.push(id); else selected = selected.filter(function (x) { return x !== id; });
        chip.classList.toggle('is-selected');
        hiddenInput.value = selected.join(',');
      });
      const raioRange = content.querySelector('#raio-range');
      const raioValor = content.querySelector('#raio-valor');
      raioRange.addEventListener('input', function () { raioValor.textContent = raioRange.value; });

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        const fd = new FormData(form);
        const email = fd.get('email').trim();
        if (!selected.length) { PU.toast('Selecione ao menos uma categoria de serviço.', 'danger'); return; }
        if (DB.emailExists('profissional', email)) { PU.toast('Já existe uma conta com este e-mail.', 'danger'); return; }
        const user = DB.cadastrarProfissional({
          nome: fd.get('nome').trim(), email: email, senha: fd.get('senha'), telefone: fd.get('telefone').trim(),
          categorias: selected, cidadeId: fd.get('cidadeId'), raioKm: Number(fd.get('raioKm')),
          taxaVisitaPadrao: PU.parseCurrencyInput(fd.get('taxaVisita')),
        });
        DB.setSession({ role: 'profissional', userId: user.id });
        PU.toast('Cadastro enviado! Após a aprovação, seu 1º chamado será grátis.', 'success');
        global.navigate('/profissional/home', true);
      });
    }
  };
})(window);

      '<p class="text text--secondary">Escolha uma categoria na Início para solicitar seu primeiro serviço.</p>' +
      '<button class="btn btn--primary btn--block-auto" data-nav="/cliente/home" style="margin-top:6px;">Ver categorias</button>' +
    '</div>';
  }

  // ---------------- Detalhe / acompanhamento do pedido ----------------

  Screens.clientePedidoDetalheRender = function (params, user) {
    const req = DB.requestById(params.id);
    if (!req || req.clienteId !== user.id) return '<div class="view"><p class="text">Pedido não encontrado.</p></div>';
    const cat = DB.categoryById(req.categoriaId);
    const prof = req.profissionalId ? DB.profissionalById(req.profissionalId) : null;

    return (
      '<div class="view" data-request-id="' + req.id + '">' +
        '<div class="row-between">' +
          '<div class="row">' +
            '<div class="icon-tile">' + icon(cat ? cat.icon : 'tag') + '</div>' +
            '<div class="h3">' + PU.escapeHtml(cat ? cat.nome : 'Serviço') + '</div>' +
          '</div>' +
          '<div class="row" style="gap:6px;">' + (req.prioridade ? '<span class="badge badge--orange"><span class="badge__dot"></span>Prioritário</span>' : '') + statusBadge(req.status) + '</div>' +
        '</div>' +

        buscandoBlock(req) +
        semProfissionalBlock(req) +
        profissionalEncontradoBlock(req, prof) +
        orcamentoBlock(req, prof) +
        avaliacaoBlock(req, prof) +
        canceladoBlock(req) +

        '<div class="section">' +
          '<div class="section-head"><h2 class="h3">Detalhes</h2></div>' +
          '<div class="card stack--sm">' +
            '<div class="text text--sm text--secondary">' + PU.escapeHtml(req.descricao) + '</div>' +
            (req.fotos && req.fotos.length ? '<div class="upload-row">' + req.fotos.map(function (f) { return '<img class="upload-thumb" src="' + f + '" alt="Foto enviada pelo cliente">'; }).join('') + '</div>' : '') +
            '<hr class="hairline">' +
            '<div class="row text--sm text--secondary">' + icon('mapPin', 'list-item__chevron') + '<span>' + PU.escapeHtml(req.endereco.rua) + ', ' + PU.escapeHtml(req.endereco.bairro) + '</span></div>' +
          '</div>' +
        '</div>' +

        statusTrackSection(req) +

        (canCancel(req.status)
          ? '<div class="section"><button class="btn btn--danger-ghost" data-action="cancelar-pedido">' + icon('xCircle') + ' Cancelar pedido</button></div>'
          : '') +
      '</div>'
    );
  };

  function canCancel(status) {
    return [STATUS.BUSCANDO, STATUS.SEM_PROFISSIONAL, STATUS.AGUARDANDO_ACEITE, STATUS.AGUARDANDO_ORCAMENTO, STATUS.ORCAMENTO_ENVIADO, STATUS.ORCAMENTO_RECUSADO, STATUS.APROVADO].indexOf(status) !== -1;
  }

  function buscandoBlock(req) {
    if (req.status !== STATUS.BUSCANDO && req.status !== STATUS.AGUARDANDO_ACEITE) return '';
    return (
      '<div class="section">' +
        '<div class="card" style="display:flex;flex-direction:column;align-items:center;text-align:center;padding:30px 16px;">' +
          '<div class="icon-tile icon-tile--lg icon-tile--orange">' + icon(req.prioridade ? 'bolt' : 'bell') + '</div>' +
          '<h2 class="h3" style="margin-top:14px;">' + (req.prioridade ? 'Chamado prioritário publicado' : 'Chamado publicado') + '</h2>' +
          '<p class="text text--secondary text--sm" style="margin-top:4px;">Profissionais disponíveis de ' + PU.escapeHtml((DB.categoryById(req.categoriaId) || {}).nome || '') + ' na sua região podem visualizar o serviço. O primeiro que desbloquear o chamado será conectado a você.</p>' +
          '<div class="badge badge--success" style="margin-top:12px;"><span class="badge__dot"></span>Você não pagou nada pelo chamado</div>' +
        '</div>' +
      '</div>'
    );
  }

  function semProfissionalBlock(req) {
    if (req.status !== STATUS.SEM_PROFISSIONAL) return '';
    return (
      '<div class="section">' +
        '<div class="card" style="text-align:center;padding:28px 16px;">' +
          '<div class="icon-tile icon-tile--ghost" style="margin:0 auto 12px;">' + icon('alertTriangle') + '</div>' +
          '<h2 class="h3">Nenhum profissional disponível agora</h2>' +
          '<p class="text text--secondary text--sm" style="margin-top:4px;">Tente novamente em instantes ou aguarde — avisamos assim que alguém ficar online.</p>' +
          '<button class="btn btn--primary" data-action="tentar-novamente" style="margin-top:14px;">' + icon('refresh') + ' Tentar novamente</button>' +
        '</div>' +
      '</div>'
    );
  }

  function profCard(prof, extra) {
    if (!prof) return '';
    return (
      '<div class="card row">' +
        '<div class="avatar avatar--lg">' + PU.initials(prof.nome) + '</div>' +
        '<div class="spacer">' +
          '<div class="text--strong">' + PU.escapeHtml(prof.nome) + '</div>' +
          '<div class="row text--sm text--secondary" style="gap:6px;margin-top:2px;">' + starsDisplay(prof.avaliacaoMedia) + '<span>' + (prof.avaliacaoMedia ? prof.avaliacaoMedia.toFixed(1) + ' · ' + prof.totalAvaliacoes + ' avaliações' : 'Novo na plataforma') + '</span></div>' +
          (extra || '') +
        '</div>' +
      '</div>'
    );
  }

  function profissionalEncontradoBlock(req, prof) {
    if (req.status !== STATUS.AGUARDANDO_ORCAMENTO) return '';
    return (
      '<div class="section">' +
        '<div class="section-head"><h2 class="h3">Profissional encontrado</h2></div>' +
        profCard(prof) +
        '<div class="card card--tight" style="margin-top:10px;background:var(--navy-100);border:none;">' +
          '<p class="text text--sm" style="color:var(--navy-800);">' + PU.escapeHtml((prof || {}).nome || 'O profissional') + ' aceitou seu chamado e está preparando o orçamento. Você será avisado assim que ele chegar.</p>' +
        '</div>' +
      '</div>'
    );
  }

  function orcamentoBlock(req, prof) {
    if (!req.orcamento) return '';
    if ([STATUS.ORCAMENTO_ENVIADO, STATUS.ORCAMENTO_RECUSADO, STATUS.APROVADO, STATUS.EM_ANDAMENTO, STATUS.SERVICO_CONCLUIDO].indexOf(req.status) === -1) return '';
    const o = req.orcamento;
    return (
      '<div class="section">' +
        '<div class="section-head"><h2 class="h3">Orçamento</h2></div>' +
        profCard(prof) +
        '<div class="card stack--sm" style="margin-top:10px;">' +
          (req.taxaVisita ? rowValor('Taxa de visita', req.taxaVisita) : '') +
          rowValor('Mão de obra', o.maoDeObra) +
          rowValor('Material', o.material) +
          '<hr class="hairline">' +
          rowValor('Total', o.total + (req.taxaVisita || 0), true) +
        '</div>' +
        (req.status === STATUS.ORCAMENTO_ENVIADO ? (
          '<div class="btn-row" style="margin-top:12px;">' +
            '<button class="btn btn--outline" data-action="recusar-orcamento">Recusar</button>' +
            '<button class="btn btn--primary" data-action="aprovar-orcamento">' + icon('check') + ' Aprovar</button>' +
          '</div>'
        ) : '') +
        (req.status === STATUS.ORCAMENTO_RECUSADO ? (
          '<div class="card card--tight" style="margin-top:10px;background:var(--danger-100);border:none;">' +
            '<p class="text text--sm" style="color:var(--danger-600);">Você recusou este orçamento' + (o.motivoRecusa ? ': "' + PU.escapeHtml(o.motivoRecusa) + '"' : '.') + ' O profissional pode enviar uma nova proposta.</p>' +
          '</div>'
        ) : '') +
      '</div>'
    );
  }

  function rowValor(label, cents, strong) {
    return '<div class="row-between"><span class="text' + (strong ? ' text--strong' : ' text--secondary text--sm') + '">' + label + '</span><span class="text' + (strong ? ' h3' : ' text--sm') + '">' + PU.formatCurrency(cents) + '</span></div>';
  }

  function pagamentoBlock(req) {
    if (req.status !== STATUS.SERVICO_CONCLUIDO) return '';
    return (
      '<div class="section">' +
        '<div class="card" style="text-align:center;padding:26px 16px;">' +
          '<div class="icon-tile icon-tile--lg icon-tile--orange" style="margin:0 auto 12px;">' + icon('creditCard') + '</div>' +
          '<h2 class="h3">Serviço concluído!</h2>' +
          '<p class="text text--secondary text--sm" style="margin-top:4px;">O pagamento do serviço é combinado diretamente com o profissional.</p>' +
          '<div class="h1" style="margin:14px 0;">' + PU.formatCurrency(req.orcamento.total + (req.taxaVisita || 0)) + '</div>' +
          '<button class="btn btn--primary" data-action="pagar-pedido">' + icon('creditCard') + ' Pagar agora (simulado)</button>' +
        '</div>' +
      '</div>'
    );
  }

  function avaliacaoBlock(req, prof) {
    if (req.status === STATUS.SERVICO_CONCLUIDO || req.status === STATUS.PAGO) {
      return (
        '<div class="section">' +
          '<div class="section-head"><h2 class="h3">Serviço concluído · avalie</h2></div>' +          '<div class="card stack" id="avaliacao-form">' +
            '<div class="text--sm text--secondary">Como foi seu atendimento com ' + PU.escapeHtml((prof || {}).nome || 'o profissional') + '?</div>' +
            '<div class="star-picker" id="cliente-star-picker">' +
              [1, 2, 3, 4, 5].map(function (n) { return '<button type="button" data-star="' + n + '" aria-label="' + n + ' estrelas">' + icon('starFilled') + '</button>'; }).join('') +
            '</div>' +
            '<textarea class="textarea" id="cliente-avaliacao-comentario" placeholder="Conte como foi (opcional)"></textarea>' +
            '<button class="btn btn--primary" data-action="enviar-avaliacao">Enviar avaliação</button>' +
          '</div>' +
        '</div>'
      );
    }
    if (req.status === STATUS.FINALIZADO && req.avaliacaoCliente) {
      return (
        '<div class="section">' +
          '<div class="section-head"><h2 class="h3">Sua avaliação</h2></div>' +
          '<div class="card stack--sm">' +
            starsDisplay(req.avaliacaoCliente.nota) +
            (req.avaliacaoCliente.comentario ? '<p class="text text--sm">' + PU.escapeHtml(req.avaliacaoCliente.comentario) + '</p>' : '') +
          '</div>' +
        '</div>'
      );
    }
    return '';
  }

  function canceladoBlock(req) {
    if (req.status !== STATUS.CANCELADO) return '';
    return (
      '<div class="section">' +
        '<div class="card" style="background:var(--danger-100);border:none;">' +
          '<div class="row"><div class="icon-tile" style="background:var(--danger-600);">' + icon('xCircle') + '</div>' +
          '<div><div class="text--strong" style="color:var(--danger-600);">Pedido cancelado</div>' +
          '<div class="text--sm" style="color:var(--danger-600);">' + (req.motivoCancelamento ? PU.escapeHtml(req.motivoCancelamento) : 'Sem motivo informado.') + '</div></div></div>' +
        '</div>' +
      '</div>'
    );
  }

  function statusTrackSection(req) {
    const steps = buildTrackSteps(req);
    return (
      '<div class="section">' +
        '<div class="section-head"><h2 class="h3">Linha do tempo</h2></div>' +
        '<div class="card status-track">' +
          steps.map(function (s, i) {
            return '<div class="status-step ' + (s.state === 'done' ? 'is-done' : s.state === 'current' ? 'is-current' : '') + '">' +
              '<div class="status-step__rail">' +
                '<div class="status-step__dot">' + (s.state === 'done' ? icon('check') : '') + '</div>' +
                (i < steps.length - 1 ? '<div class="status-step__line"></div>' : '') +
              '</div>' +
              '<div class="status-step__body">' +
                '<div class="status-step__title">' + s.title + '</div>' +
                (s.sub ? '<div class="status-step__sub">' + s.sub + '</div>' : '') +
              '</div>' +
            '</div>';
          }).join('') +
        '</div>' +
      '</div>'
    );
  }

  function buildTrackSteps(req) {
    if (req.status === STATUS.CANCELADO) {
      return [
        { title: 'Pedido criado', sub: PU.formatDateTime(req.criadoEm), state: 'done' },
        { title: 'Cancelado', sub: PU.formatDateTime(req.atualizadoEm), state: 'current' },
      ];
    }
    const order = [STATUS.BUSCANDO, STATUS.AGUARDANDO_ORCAMENTO, STATUS.ORCAMENTO_ENVIADO, STATUS.APROVADO, STATUS.EM_ANDAMENTO, STATUS.SERVICO_CONCLUIDO, STATUS.FINALIZADO];
    const titles = {
      buscando: 'Chamado publicado', aguardando_orcamento: 'Profissional conectado', orcamento_enviado: 'Orçamento enviado',
      aprovado: 'Orçamento aprovado', em_andamento: 'Serviço em andamento', servico_concluido: 'Serviço concluído',
      finalizado: 'Avaliação concluída',
    };
    let effectiveStatus = req.status;
    if ([STATUS.AGUARDANDO_ACEITE, STATUS.SEM_PROFISSIONAL].indexOf(req.status) !== -1) effectiveStatus = STATUS.BUSCANDO;
    if (req.status === STATUS.ORCAMENTO_RECUSADO) effectiveStatus = STATUS.AGUARDANDO_ORCAMENTO;
    const idx = order.indexOf(effectiveStatus);
    return order.map(function (st, i) {
      return { title: titles[st], state: i < idx ? 'done' : i === idx ? 'current' : 'pending' };
    });
  }

  // ---------------- Perfil ----------------

  Screens.clientePerfilRender = function (params, user) {
    const end = user.enderecos && user.enderecos[0];
    return (
      '<div class="view stack">' +
        '<div class="card row">' +
          '<div class="avatar avatar--lg avatar--orange">' + PU.initials(user.nome) + '</div>' +
          '<div>' +
            '<div class="h3">' + PU.escapeHtml(user.nome) + '</div>' +
            '<div class="text--sm text--secondary">' + PU.escapeHtml(user.email) + '</div>' +
          '</div>' +
        '</div>' +

        '<div class="section">' +
          '<div class="card" style="padding:4px 16px;">' +
            listItem('mapPin', 'Endereço', end ? (end.rua + ', ' + end.bairro) : 'Nenhum endereço cadastrado', '/cliente/endereco') +
            listItem('user', 'Telefone', user.telefone || 'Não informado', null) +
          '</div>' +
        '</div>' +

        '<div class="section">' +
          '<button class="btn btn--outline" data-logout>' + icon('logout') + ' Sair da conta</button>' +
        '</div>' +
      '</div>'
    );
  };

  function listItem(iconName, title, sub, navTo) {
    return (
      '<div class="list-item"' + (navTo ? ' data-nav="' + navTo + '"' : '') + '>' +
        '<div class="icon-tile icon-tile--ghost">' + icon(iconName) + '</div>' +
        '<div class="list-item__body"><div class="list-item__title">' + title + '</div><div class="list-item__sub">' + PU.escapeHtml(sub) + '</div></div>' +
        (navTo ? '<div class="list-item__chevron">' + icon('chevronRight') + '</div>' : '') +
      '</div>'
    );
  }

  Screens.clienteEnderecoRender = function (params, user) {
    const end = (user.enderecos && user.enderecos[0]) || {};
    const cidadesOpts = DB.cities().map(function (c) { return '<option value="' + c.id + '"' + (end.cidadeId === c.id ? ' selected' : '') + '>' + PU.escapeHtml(c.nome) + ' - ' + c.uf + '</option>'; }).join('');
    return (
      '<div class="view">' +
        '<form id="endereco-form" class="stack" novalidate>' +
          '<label class="field"><span class="field__label">Rua e número</span><input class="input" name="rua" required value="' + PU.escapeHtml(end.rua || '') + '"></label>' +
          '<label class="field"><span class="field__label">Bairro</span><input class="input" name="bairro" required value="' + PU.escapeHtml(end.bairro || '') + '"></label>' +
          '<label class="field"><span class="field__label">Cidade</span><select class="select" name="cidadeId" required>' + cidadesOpts + '</select></label>' +
          '<label class="field"><span class="field__label">CEP</span><input class="input" name="cep" value="' + PU.escapeHtml(end.cep || '') + '"></label>' +
          '<label class="field"><span class="field__label">Complemento</span><input class="input" name="complemento" value="' + PU.escapeHtml(end.complemento || '') + '"></label>' +
          '<button class="btn btn--primary" type="submit">Salvar endereço</button>' +
        '</form>' +
      '</div>'
    );
  };

  // ---------------- Interações pós-render ----------------

  const prevAfterRender = Screens.afterRender;
  Screens.afterRender = function (pattern, content, params, user) {
    if (prevAfterRender) prevAfterRender(pattern, content, params, user);

    if (pattern === '/cliente/novo-pedido/:catId') bindNovoPedido(content, params, user);
    if (pattern === '/cliente/pedido/:id') bindPedidoDetalhe(content, params, user);
    if (pattern === '/cliente/endereco') bindEndereco(content, user);
  };

  function bindNovoPedido(content, params, user) {
    const form = content.querySelector('#novo-pedido-form');
    const fotoInput = content.querySelector('#foto-input');
    const uploadRow = content.querySelector('#upload-row');
    let fotos = [];

    fotoInput.addEventListener('change', function () {
      const files = Array.prototype.slice.call(fotoInput.files).slice(0, 4 - fotos.length);
      Promise.all(files.map(function (f) { return PU.fileToCompressedDataUrl(f, 640); })).then(function (dataUrls) {
        dataUrls.forEach(function (durl) { fotos.push(durl); renderThumb(durl); });
        fotoInput.value = '';
      }).catch(function () { PU.toast('Não foi possível carregar a imagem.', 'danger'); });
    });

    function renderThumb(durl) {
      const wrap = document.createElement('div');
      wrap.className = 'upload-thumb-wrap';
      wrap.innerHTML = '<img class="upload-thumb" src="' + durl + '" alt="Foto do serviço"><span class="upload-thumb-remove" role="button" tabindex="0" aria-label="Remover foto">' + icon('x') + '</span>';
      wrap.querySelector('.upload-thumb-remove').addEventListener('click', function () {
        fotos = fotos.filter(function (f) { return f !== durl; });
        wrap.remove();
      });
      uploadRow.insertBefore(wrap, uploadRow.querySelector('.upload-add'));
    }

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      const fd = new FormData(form);
      const endereco = {
        id: PU.uid('end'), rua: fd.get('rua').trim(), bairro: fd.get('bairro').trim(),
        cidadeId: fd.get('cidadeId'), cep: fd.get('cep').trim(), complemento: fd.get('complemento').trim(),
      };
      user.enderecos = [endereco];
      DB.persist();
      const prioridade = fd.get('prioridade') === '1';
      const req = DB.criarPedido({ clienteId: user.id, categoriaId: params.catId, descricao: fd.get('descricao').trim(), fotos: fotos, endereco: endereco, prioridade: prioridade });
      PU.toast(prioridade ? 'Chamado prioritário criado! Pagamento simulado da prioridade confirmado.' : 'Chamado criado grátis! Profissionais próximos já podem visualizar.', 'success');
      global.navigate('/cliente/pedido/' + req.id, true);
    });
  }

  function bindPedidoDetalhe(content, params, user) {
    const req = DB.requestById(params.id);
    if (!req) return;

    if (req.status === STATUS.BUSCANDO) {
      setTimeout(function () {
        if (location.hash !== '#/cliente/pedido/' + req.id) return;
        DB.buscarProfissional(req.id);
        global.navigate('/cliente/pedido/' + req.id, true);
      }, 1600);
    }

    content.addEventListener('click', function (e) {
      const action = e.target.closest('[data-action]');
      if (!action) return;
      const act = action.getAttribute('data-action');

      if (act === 'tentar-novamente') {
        DB.buscarProfissional(req.id);
        global.navigate('/cliente/pedido/' + req.id, true);
      }
      if (act === 'cancelar-pedido') {
        PU.confirmDialog({ title: 'Cancelar pedido', message: 'Tem certeza que deseja cancelar este pedido?', okLabel: 'Cancelar pedido', danger: true }).then(function (ok) {
          if (!ok) return;
          DB.cancelarPedido(req.id, 'cliente', 'Cancelado pelo cliente.');
          PU.toast('Pedido cancelado.', 'danger');
          global.navigate('/cliente/pedido/' + req.id, true);
        });
      }
      if (act === 'aprovar-orcamento') {
        DB.aprovarOrcamento(req.id);
        PU.toast('Orçamento aprovado!', 'success');
        global.navigate('/cliente/pedido/' + req.id, true);
      }
      if (act === 'recusar-orcamento') {
        PU.openSheet(
          '<h3 class="sheet__title">Recusar orçamento</h3>' +
          '<p class="text text--secondary text--sm">Diga rapidamente o motivo (opcional).</p>' +
          '<textarea class="textarea" id="motivo-recusa" placeholder="Ex: valor acima do esperado"></textarea>' +
          '<button class="btn btn--danger-ghost" id="confirmar-recusa" style="margin-top:12px;">Recusar orçamento</button>'
        );
        document.getElementById('confirmar-recusa').addEventListener('click', function () {
          const motivo = document.getElementById('motivo-recusa').value.trim();
          PU.closeSheet();
          DB.recusarOrcamento(req.id, motivo);
          PU.toast('Orçamento recusado.', 'danger');
          global.navigate('/cliente/pedido/' + req.id, true);
        });
      }
      if (act === 'enviar-avaliacao') {
        const picker = content.querySelector('#cliente-star-picker');
        const nota = Number(picker.getAttribute('data-nota') || 0);
        if (!nota) { PU.toast('Selecione uma nota de 1 a 5 estrelas.', 'danger'); return; }
        const comentario = content.querySelector('#cliente-avaliacao-comentario').value.trim();
        DB.avaliarComoCliente(req.id, nota, comentario);
        PU.toast('Obrigado pela avaliação!', 'success');
        global.navigate('/cliente/pedido/' + req.id, true);
      }
    });

    const picker = content.querySelector('#cliente-star-picker');
    if (picker) {
      picker.addEventListener('click', function (e) {
        const btn = e.target.closest('[data-star]');
        if (!btn) return;
        const n = Number(btn.getAttribute('data-star'));
        picker.setAttribute('data-nota', n);
        Array.prototype.forEach.call(picker.querySelectorAll('[data-star]'), function (b) {
          b.classList.toggle('is-active', Number(b.getAttribute('data-star')) <= n);
        });
      });
    }
  }

  function bindEndereco(content, user) {
    const form = content.querySelector('#endereco-form');
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      const fd = new FormData(form);
      user.enderecos = [{
        id: PU.uid('end'), rua: fd.get('rua').trim(), bairro: fd.get('bairro').trim(),
        cidadeId: fd.get('cidadeId'), cep: fd.get('cep').trim(), complemento: fd.get('complemento').trim(),
      }];
      DB.persist();
      PU.toast('Endereço salvo!', 'success');
      global.navigate('/cliente/perfil', true);
    });
  }
})(window);


/* QuemFaz — telas da área Profissional */

(function (global) {
  const DB = global.DB, PU = global.PU, icon = global.icon, Screens = global.Screens;
  const STATUS = DB.STATUS;

  function statusBadge(status) {
    const label = DB.STATUS_LABEL[status] || status;
    const map = {
      buscando: 'orange', sem_profissional: 'danger', aguardando_aceite: 'orange', aguardando_orcamento: 'orange',
      orcamento_enviado: 'navy', orcamento_recusado: 'danger', aprovado: 'success', em_andamento: 'success',
      servico_concluido: 'warning', pago: 'navy', finalizado: 'success', cancelado: 'danger',
    };
    return '<span class="badge badge--' + (map[status] || 'muted') + '"><span class="badge__dot"></span>' + label + '</span>';
  }
  function starsDisplay(nota) {
    nota = Math.round(nota || 0);
    let s = '<span class="stars-display">';
    for (let i = 1; i <= 5; i++) s += icon(i <= nota ? 'starFilled' : 'star');
    return s + '</span>';
  }
  function aprovacaoBadge(status) {
    if (status === 'aprovado') return '<span class="badge badge--success"><span class="badge__dot"></span>Aprovado</span>';
    if (status === 'reprovado') return '<span class="badge badge--danger"><span class="badge__dot"></span>Reprovado</span>';
    return '<span class="badge badge--warning"><span class="badge__dot"></span>Aguardando aprovação</span>';
  }

  function pendingGate(prof) {
    if (prof.statusAprovacao === 'aprovado') return '';
    if (prof.statusAprovacao === 'reprovado') {
      return (
        '<div class="card" style="background:var(--danger-100);border:none;margin-bottom:16px;">' +
          '<div class="row"><div class="icon-tile" style="background:var(--danger-600);">' + icon('xCircle') + '</div>' +
          '<div><div class="text--strong" style="color:var(--danger-600);">Cadastro reprovado</div>' +
          '<div class="text--sm" style="color:var(--danger-600);">' + PU.escapeHtml(prof.motivoReprovacao || '') + '</div></div></div>' +
          '<button class="btn btn--outline" data-nav="/profissional/perfil" style="margin-top:12px;">Reenviar documentos</button>' +
        '</div>'
      );
    }
    return (
      '<div class="card" style="background:var(--warning-100);border:none;margin-bottom:16px;">' +
        '<div class="row"><div class="icon-tile" style="background:var(--warning-600);">' + icon('clock') + '</div>' +
        '<div><div class="text--strong" style="color:var(--warning-600);">Cadastro em análise</div>' +
        '<div class="text--sm" style="color:var(--warning-600);">Assim que o administrador aprovar seus documentos, você poderá ficar online e receber chamados.</div></div></div>' +
      '</div>'
    );
  }

  // ---------------- Início / chamadas ----------------

  Screens.profHomeRender = function (params, user) {
    const chamadas = DB.chamadasPendentes(user.id);
    const podeFicarOnline = user.statusAprovacao === 'aprovado';
    return (
      '<div class="view">' +
        pendingGate(user) +

        '<div class="card row">' +
          '<div class="spacer">' +
            '<div class="text--strong">Status de disponibilidade</div>' +
            '<div class="text--sm text--secondary">' + (user.online ? 'Você está online e pode receber chamados.' : 'Você está offline.') + '</div>' +
          '</div>' +
          '<label class="switch">' +
            '<input type="checkbox" id="toggle-online" ' + (user.online ? 'checked' : '') + (podeFicarOnline ? '' : ' disabled') + '>' +
            '<span class="switch__track"></span>' +
          '</label>' +
        '</div>' +

        '<div class="section">' +
          '<div class="card row-between" style="background:var(--navy-100);border:none;">' +
            '<div><div class="text--sm text--secondary">Carteira QuemFaz</div><div class="h2" style="color:var(--navy-900);">' + PU.formatCurrency(user.creditos || 0) + '</div>' +
            (Number(user.bonusDesbloqueios || 0) > 0 ? '<div class="text--sm" style="color:var(--success-600);margin-top:2px;">1 desbloqueio grátis disponível</div>' : '') + '</div>' +
            '<button class="btn btn--sm btn--outline btn--block-auto" data-nav="/profissional/carteira">Adicionar</button>' +
          '</div>' +
        '</div>' +

        '<div class="section">' +
          '<div class="section-head"><h2 class="h3">Oportunidades próximas</h2></div>' +
          (chamadas.length
            ? '<div class="stack--sm">' + chamadas.map(chamadaCard).join('') + '</div>'
            : '<div class="empty-state"><div class="icon-tile icon-tile--ghost">' + icon('phoneCall') + '</div><p class="text text--secondary">Nenhuma oportunidade no momento.' + (user.online ? ' Você será avisado quando surgir um chamado da sua categoria na região.' : ' Fique online para visualizar oportunidades.') + '</p></div>') +
        '</div>' +
      '</div>'
    );
  };

  function chamadaCard(req) {
    const cat = DB.categoryById(req.categoriaId);
    const cidade = DB.cityById(req.cidadeId);
    const valor = DB.leadFeeForRequest(req);
    return (
      '<button class="card card--pressable" style="width:100%;text-align:left;" data-nav="/profissional/chamada/' + req.id + '">' +
        '<div class="row">' +
          '<div class="icon-tile icon-tile--orange">' + icon(cat ? cat.icon : 'tag') + '</div>' +
          '<div class="spacer">' +
            '<div class="row" style="gap:7px;"><div class="h3">' + PU.escapeHtml(cat ? cat.nome : 'Serviço') + '</div>' + (req.prioridade ? '<span class="badge badge--orange">Prioridade</span>' : '') + '</div>' +
            '<div class="text--sm text--secondary">' + PU.escapeHtml(req.endereco.bairro || 'Região informada') + ' · ' + PU.escapeHtml((cidade || {}).nome || '') + '</div>' +
            (Number(user.bonusDesbloqueios || 0) > 0
              ? '<div class="text--sm text--strong" style="margin-top:4px;color:var(--success-600);">1º chamado grátis · use seu bônus</div>'
              : '<div class="text--sm text--strong" style="margin-top:4px;color:var(--orange-700);">Desbloquear por ' + PU.formatCurrency(valor) + '</div>') +
          '</div>' +
          '<span class="text--sm text--muted">' + PU.timeAgo(req.criadoEm) + '</span>' +
        '</div>' +
      '</button>'
    );
  }

  Screens.profChamadaRender = function (params, user) {
    const req = DB.requestById(params.id);
    const disponivel = req && req.status === STATUS.BUSCANDO && !req.profissionalId &&
      user.online && user.statusAprovacao === 'aprovado' && !user.bloqueado &&
      user.categorias.indexOf(req.categoriaId) !== -1 && req.cidadeId === user.cidadeId &&
      (req.recusadoPor || []).indexOf(user.id) === -1;
    if (!disponivel) return '<div class="view"><div class="empty-state"><div class="icon-tile icon-tile--ghost">' + icon('lock') + '</div><h2 class="h3">Chamado indisponível</h2><p class="text text--secondary">Esta oportunidade já foi assumida ou não está mais disponível.</p></div></div>';
    const cat = DB.categoryById(req.categoriaId);
    const cidade = DB.cityById(req.cidadeId);
    const valor = DB.leadFeeForRequest(req);
    return (
      '<div class="view">' +
        '<div class="row-between">' +
          '<div class="row"><div class="icon-tile icon-tile--lg icon-tile--orange">' + icon(cat ? cat.icon : 'tag') + '</div><div><div class="h2">' + PU.escapeHtml(cat ? cat.nome : 'Serviço') + '</div><div class="text--sm text--secondary">Solicitado ' + PU.timeAgo(req.criadoEm) + '</div></div></div>' +
          (req.prioridade ? '<span class="badge badge--orange"><span class="badge__dot"></span>Prioritário</span>' : '') +
        '</div>' +

        '<div class="section card stack--sm">' +
          '<div class="row"><div class="avatar avatar--sm">?</div><div><div class="text--strong">Cliente verificado</div><div class="text--sm text--muted">Identidade protegida até o desbloqueio</div></div></div>' +
          '<hr class="hairline">' +
          '<div class="text--sm text--secondary">' + PU.escapeHtml(req.descricao) + '</div>' +
          (req.fotos && req.fotos.length ? '<div class="upload-row">' + req.fotos.map(function (f) { return '<img class="upload-thumb" src="' + f + '" alt="Foto enviada pelo cliente">'; }).join('') + '</div>' : '') +
          '<hr class="hairline">' +
          '<div class="row text--sm text--secondary">' + icon('mapPin', 'list-item__chevron') + '<span>' + PU.escapeHtml(req.endereco.bairro || 'Bairro informado') + ' — ' + PU.escapeHtml((cidade || {}).nome || '') + '</span></div>' +
        '</div>' +

        '<div class="section card stack--sm" style="background:var(--navy-900);border:none;">' +
          '<div class="row-between"><div><div class="text--sm" style="color:var(--text-on-navy-muted);">' + (Number(user.bonusDesbloqueios || 0) > 0 ? 'Bônus de boas-vindas' : 'Taxa para desbloquear') + '</div><div class="h1" style="color:#fff;">' + (Number(user.bonusDesbloqueios || 0) > 0 ? 'GRÁTIS' : PU.formatCurrency(valor)) + '</div></div><div class="icon-tile icon-tile--orange">' + icon('unlock') + '</div></div>' +
          '<p class="text--sm" style="color:var(--text-on-navy-muted);">' + (Number(user.bonusDesbloqueios || 0) > 0 ? 'Seu primeiro desbloqueio é por conta do QuemFaz. Depois dele, os próximos são pagos com créditos da carteira.' : 'Ao desbloquear, liberamos nome, telefone/WhatsApp e endereço exato. O chamado fica reservado para você.') + '</p>' +
          '<div class="row-between"><span class="text--sm" style="color:var(--text-on-navy-muted);">Seus créditos</span><span class="text--strong" style="color:#fff;">' + PU.formatCurrency(user.creditos || 0) + '</span></div>' +
        '</div>' +

        '<div class="section btn-row">' +
          '<button class="btn btn--outline" data-action="recusar-chamada">Agora não</button>' +
          '<button class="btn btn--primary" data-action="desbloquear-chamada">' + icon('unlock') + ' ' + (Number(user.bonusDesbloqueios || 0) > 0 ? 'Usar 1º chamado grátis' : 'Desbloquear ' + PU.formatCurrency(valor)) + '</button>' +
        '</div>' +
      '</div>'
    );
  };

  // ---------------- Meus serviços ----------------

  const ATIVOS_PROF = [STATUS.AGUARDANDO_ORCAMENTO, STATUS.ORCAMENTO_ENVIADO, STATUS.ORCAMENTO_RECUSADO, STATUS.APROVADO, STATUS.EM_ANDAMENTO, STATUS.SERVICO_CONCLUIDO, STATUS.PAGO];

  Screens.profServicosRender = function (params, user) {
    const all = DB.requestsByProfissional(user.id);
    const ativos = all.filter(function (r) { return ATIVOS_PROF.indexOf(r.status) !== -1; });
    const historico = all.filter(function (r) { return ATIVOS_PROF.indexOf(r.status) === -1; });
    if (!all.length) {
      return '<div class="view"><div class="empty-state"><div class="icon-tile icon-tile--lg icon-tile--ghost">' + icon('clipboard') + '</div><h2 class="h3">Nenhum serviço ainda</h2><p class="text text--secondary">Fique online para começar a receber chamados de clientes.</p></div></div>';
    }
    return (
      '<div class="view">' +
        (ativos.length ? '<div class="section"><div class="section-head"><h2 class="h3">Em andamento</h2></div><div class="stack--sm">' + ativos.map(servicoCard).join('') + '</div></div>' : '') +
        (historico.length ? '<div class="section"><div class="section-head"><h2 class="h3">Histórico</h2></div><div class="stack--sm">' + historico.map(servicoCard).join('') + '</div></div>' : '') +
      '</div>'
    );
  };

  function servicoCard(req) {
    const cat = DB.categoryById(req.categoriaId);
    const cliente = DB.clienteById(req.clienteId);
    return (
      '<button class="card card--pressable" style="width:100%;text-align:left;" data-nav="/profissional/pedido/' + req.id + '">' +
        '<div class="row-between">' +
          '<div class="row"><div class="icon-tile">' + icon(cat ? cat.icon : 'tag') + '</div>' +
          '<div><div class="h3">' + PU.escapeHtml(cat ? cat.nome : 'Serviço') + '</div><div class="text--sm text--secondary">' + PU.escapeHtml((cliente || {}).nome || '') + '</div></div></div>' +
          icon('chevronRight', 'list-item__chevron') +
        '</div>' +
        '<div class="row-between" style="margin-top:12px;">' + statusBadge(req.status) + '<span class="text--sm text--muted">' + PU.timeAgo(req.criadoEm) + '</span></div>' +
      '</button>'
    );
  }

  Screens.profPedidoDetalheRender = function (params, user) {
    const req = DB.requestById(params.id);
    if (!req || req.profissionalId !== user.id) return '<div class="view"><p class="text">Serviço não encontrado.</p></div>';
    const cat = DB.categoryById(req.categoriaId);
    const cliente = DB.clienteById(req.clienteId);
    return (
      '<div class="view">' +
        '<div class="row-between">' +
          '<div class="row"><div class="icon-tile">' + icon(cat ? cat.icon : 'tag') + '</div><div class="h3">' + PU.escapeHtml(cat ? cat.nome : 'Serviço') + '</div></div>' +
          statusBadge(req.status) +
        '</div>' +

        '<div class="section card stack--sm">' +
          '<div class="row-between"><div class="row"><div class="avatar avatar--sm">' + PU.initials((cliente || {}).nome || '?') + '</div><div><div class="text--strong">' + PU.escapeHtml((cliente || {}).nome || '') + '</div><div class="text--sm text--secondary">Contato liberado</div></div></div><span class="badge badge--success"><span class="badge__dot"></span>Desbloqueado</span></div>' +
          '<div class="row text--sm text--secondary">' + icon('phoneCall', 'list-item__chevron') + '<a href="tel:' + PU.escapeHtml((cliente || {}).telefone || '') + '">' + PU.escapeHtml((cliente || {}).telefone || 'Telefone não informado') + '</a></div>' +
          '<div class="text--sm text--secondary">' + PU.escapeHtml(req.descricao) + '</div>' +
          '<div class="row text--sm text--secondary">' + icon('mapPin', 'list-item__chevron') + '<span>' + PU.escapeHtml(req.endereco.rua) + ', ' + PU.escapeHtml(req.endereco.bairro) + (req.endereco.complemento ? ' · ' + PU.escapeHtml(req.endereco.complemento) : '') + '</span></div>' +
        '</div>' +

        (req.orcamento ? orcamentoResumo(req) : '') +
        acoesPorStatus(req) +
      '</div>'
    );
  };

  function orcamentoResumo(req) {
    const o = req.orcamento;
    return (
      '<div class="section">' +
        '<div class="section-head"><h2 class="h3">Orçamento enviado</h2></div>' +
        '<div class="card stack--sm">' +
          (req.taxaVisita ? rowValor('Taxa de visita', req.taxaVisita) : '') +
          rowValor('Mão de obra', o.maoDeObra) +
          rowValor('Material', o.material) +
          '<hr class="hairline">' +
          rowValor('Total', o.total + (req.taxaVisita || 0), true) +
          (o.status === 'recusado' && o.motivoRecusa ? '<p class="text--sm" style="color:var(--danger-600);margin-top:4px;">Motivo da recusa: ' + PU.escapeHtml(o.motivoRecusa) + '</p>' : '') +
        '</div>' +
      '</div>'
    );
  }
  function rowValor(label, cents, strong) {
    return '<div class="row-between"><span class="text' + (strong ? ' text--strong' : ' text--secondary text--sm') + '">' + label + '</span><span class="text' + (strong ? ' h3' : ' text--sm') + '">' + PU.formatCurrency(cents) + '</span></div>';
  }

  function acoesPorStatus(req) {
    const s = req.status;
    if (s === STATUS.AGUARDANDO_ORCAMENTO) {
      return '<div class="section"><button class="btn btn--primary" data-nav="/profissional/orcamento/' + req.id + '">' + icon('document') + ' Criar orçamento</button></div>';
    }
    if (s === STATUS.ORCAMENTO_ENVIADO) {
      return '<div class="section"><div class="card card--tight" style="background:var(--navy-100);border:none;"><p class="text text--sm" style="color:var(--navy-800);">Aguardando aprovação do cliente.</p></div></div>';
    }
    if (s === STATUS.ORCAMENTO_RECUSADO) {
      return '<div class="section stack--sm">' +
        '<button class="btn btn--primary" data-nav="/profissional/orcamento/' + req.id + '">' + icon('edit') + ' Enviar novo orçamento</button>' +
        '<button class="btn btn--danger-ghost" data-action="cancelar-servico">Cancelar serviço</button>' +
      '</div>';
    }
    if (s === STATUS.APROVADO) {
      return '<div class="section"><button class="btn btn--primary" data-action="iniciar-servico">' + icon('checkCircle') + ' Iniciar serviço</button></div>';
    }
    if (s === STATUS.EM_ANDAMENTO) {
      return '<div class="section"><button class="btn btn--primary" data-action="finalizar-servico">' + icon('check') + ' Concluir serviço</button></div>';
    }
    if (s === STATUS.SERVICO_CONCLUIDO || s === STATUS.PAGO) {
      return (
        '<div class="section"><div class="card card--tight" style="background:var(--success-100);border:none;margin-bottom:12px;"><p class="text text--sm" style="color:var(--success-600);">Serviço marcado como concluído. O pagamento do serviço é combinado diretamente com o cliente.</p></div></div>' +
        '<div class="section">' +
          '<div class="section-head"><h2 class="h3">Avalie o cliente</h2></div>' +
          '<div class="card stack">' +
            '<div class="star-picker" id="prof-star-picker">' + [1, 2, 3, 4, 5].map(function (n) { return '<button type="button" data-star="' + n + '">' + icon('starFilled') + '</button>'; }).join('') + '</div>' +
            '<textarea class="textarea" id="prof-avaliacao-comentario" placeholder="Como foi atender este cliente? (opcional)"></textarea>' +
            '<button class="btn btn--primary" data-action="enviar-avaliacao-cliente">Enviar avaliação</button>' +
          '</div>' +
        '</div>'
      );
    }
    if (s === STATUS.FINALIZADO) {
      return '<div class="section"><div class="card card--tight" style="background:var(--success-100);border:none;"><p class="text text--sm" style="color:var(--success-600);">Serviço concluído e avaliado.</p></div></div>';
    }
    if (s === STATUS.CANCELADO) {
      return '<div class="section"><div class="card card--tight" style="background:var(--danger-100);border:none;"><p class="text text--sm" style="color:var(--danger-600);">' + PU.escapeHtml(req.motivoCancelamento || 'Serviço cancelado.') + '</p></div></div>';
    }
    return '';
  }

  Screens.profOrcamentoFormRender = function (params, user) {
    const req = DB.requestById(params.id);
    if (!req) return '<div class="view"><p class="text">Serviço não encontrado.</p></div>';
    return (
      '<div class="view">' +
        '<form id="orcamento-form" class="stack" novalidate>' +
          '<label class="field"><span class="field__label">Taxa de visita</span><input class="input" name="taxaVisita" inputmode="decimal" value="' + (req.taxaVisita ? (req.taxaVisita / 100).toFixed(2).replace('.', ',') : '') + '" placeholder="R$ 0,00"></label>' +
          '<label class="field"><span class="field__label">Mão de obra</span><input class="input" name="maoDeObra" inputmode="decimal" required placeholder="R$ 0,00" value="' + (req.orcamento ? (req.orcamento.maoDeObra / 100).toFixed(2).replace('.', ',') : '') + '"></label>' +
          '<label class="field"><span class="field__label">Material</span><input class="input" name="material" inputmode="decimal" placeholder="R$ 0,00" value="' + (req.orcamento ? (req.orcamento.material / 100).toFixed(2).replace('.', ',') : '') + '"></label>' +
          '<div class="card row-between" style="background:var(--navy-100);border:none;">' +
            '<span class="text--strong" style="color:var(--navy-900);">Total</span>' +
            '<span class="h2" id="orcamento-total" style="color:var(--navy-900);">R$ 0,00</span>' +
          '</div>' +
          '<button class="btn btn--primary" type="submit">' + icon('arrowRight') + ' Enviar orçamento ao cliente</button>' +
        '</form>' +
      '</div>'
    );
  };

  // ---------------- Carteira ----------------

  Screens.profCarteiraRender = function (params, user) {
    const txs = DB.transactionsForProfissional(user.id);
    const bonus = Number(user.bonusDesbloqueios || 0);
    return (
      '<div class="view">' +
        '<div class="card" style="padding:24px 18px;background:var(--navy-900);border:none;">' +
          '<div class="row-between" style="align-items:flex-start;">' +
            '<div><div class="text--sm" style="color:var(--text-on-navy-muted);">Saldo disponível</div><div class="h1" style="color:#fff;margin-top:4px;">' + PU.formatCurrency(user.creditos || 0) + '</div></div>' +
            '<div class="icon-tile icon-tile--orange">' + icon('wallet') + '</div>' +
          '</div>' +
          (bonus > 0 ? '<div class="card card--tight" style="margin-top:14px;background:rgba(255,255,255,.10);border:none;color:#fff;"><div class="row"><div class="icon-tile icon-tile--orange" style="width:36px;height:36px;">' + icon('unlock') + '</div><div><div class="text--strong">1º chamado grátis disponível</div><div class="text--sm" style="color:var(--text-on-navy-muted);">Vale para qualquer categoria. Não pode ser sacado ou transferido.</div></div></div></div>' : '') +
        '</div>' +

        '<div class="section">' +
          '<div class="section-head"><h2 class="h3">Adicionar créditos</h2></div>' +
          '<div class="card stack">' +
            '<div><div class="field__label">Escolha o valor</div>' +
              '<div class="chip-group" id="wallet-values" style="margin-top:8px;">' +
                '<button type="button" class="chip" data-wallet-value="2000">R$ 20</button>' +
                '<button type="button" class="chip is-selected" data-wallet-value="5000">R$ 50</button>' +
                '<button type="button" class="chip" data-wallet-value="10000">R$ 100</button>' +
                '<button type="button" class="chip" data-wallet-value="20000">R$ 200</button>' +
              '</div>' +
              '<label class="field" style="margin-top:10px;"><span class="field__label">Outro valor</span><input class="input" id="wallet-custom-value" inputmode="decimal" placeholder="R$ 0,00"></label>' +
            '</div>' +
            '<div><div class="field__label">Como quer pagar?</div>' +
              '<div class="stack--sm" id="wallet-methods" style="margin-top:8px;">' +
                walletMethodButton('pix', 'bolt', 'Pix', 'Saldo após a confirmação', true) +
                walletMethodButton('cartao', 'creditCard', 'Cartão', 'Crédito ou débito · após aprovação', false) +
                walletMethodButton('boleto', 'document', 'Boleto', 'Saldo somente após compensação', false) +
              '</div>' +
            '</div>' +
            '<button class="btn btn--primary" data-action="iniciar-recarga" data-wallet-selected-value="5000" data-wallet-selected-method="pix">' + icon('plus') + ' Adicionar R$ 50,00</button>' +
            '<p class="text--sm text--secondary" style="text-align:center;">Nesta versão offline, a confirmação do pagamento é simulada para testar todo o fluxo.</p>' +
          '</div>' +
        '</div>' +

        '<div class="section">' +
          '<div class="section-head"><h2 class="h3">Como funciona</h2></div>' +
          '<div class="card" style="padding:4px 16px;">' +
            walletInfoRow('unlock', 'Desbloqueie o chamado', 'O valor sai da carteira somente quando você decidir assumir a oportunidade.') +
            walletInfoRow('phoneCall', 'Contato liberado', 'Nome, telefone/WhatsApp e endereço exato aparecem depois do desbloqueio.') +

  // ---------------- Interações pós-render ----------------

  const prevAfterRender = Screens.afterRender;
  Screens.afterRender = function (pattern, content, params, user) {
    if (prevAfterRender) prevAfterRender(pattern, content, params, user);

    if (pattern === '/profissional/home') bindHome(content, user);
    if (pattern === '/profissional/chamada/:id') bindChamada(content, params, user);
    if (pattern === '/profissional/pedido/:id') bindPedidoDetalhe(content, params, user);
    if (pattern === '/profissional/orcamento/:id') bindOrcamentoForm(content, params, user);
    if (pattern === '/profissional/perfil') bindPerfil(content, user);
    if (pattern === '/profissional/carteira') bindCarteira(content, user);
  };

  function bindHome(content, user) {
    const toggle = content.querySelector('#toggle-online');
    if (toggle) {
      toggle.addEventListener('change', function () {
        DB.setOnlineStatus(user.id, toggle.checked);
        PU.toast(toggle.checked ? 'Você está online.' : 'Você está offline.', toggle.checked ? 'success' : null);
        global.navigate('/profissional/home', true);
      });
    }
  }

  function bindChamada(content, params, user) {
    content.addEventListener('click', function (e) {
      const action = e.target.closest('[data-action]');
      if (!action) return;
      const act = action.getAttribute('data-action');
      if (act === 'desbloquear-chamada') {
        const req = DB.requestById(params.id);
        const valor = req ? DB.leadFeeForRequest(req) : 0;
        PU.confirmDialog({
          title: 'Desbloquear chamado',
          message: Number(user.bonusDesbloqueios || 0) > 0
            ? 'Você vai usar seu desbloqueio grátis de boas-vindas. Nenhum valor será descontado da carteira. O contato e o endereço completo do cliente serão liberados.'
            : 'Serão usados ' + PU.formatCurrency(valor) + ' dos seus créditos. Depois disso, o contato e o endereço completo do cliente serão liberados para você.',
          okLabel: Number(user.bonusDesbloqueios || 0) > 0 ? 'Usar bônus e desbloquear' : 'Pagar e desbloquear'
        }).then(function (ok) {
          if (!ok) return;
          const result = DB.desbloquearChamado(params.id, user.id);
          if (result && result.ok) {
            PU.toast(result.usouBonus ? 'Primeiro chamado desbloqueado grátis! Contato liberado.' : 'Chamado desbloqueado! Contato do cliente liberado.', 'success');
            global.navigate('/profissional/pedido/' + params.id, true);
            return;
          }
          if (result && result.reason === 'saldo') {
            PU.openSheet(
              '<div class="stack"><h3 class="sheet__title">Créditos insuficientes</h3>' +
              '<p class="text text--secondary">Você tem ' + PU.formatCurrency(result.saldo) + ' e precisa de ' + PU.formatCurrency(result.valor) + ' para este chamado.</p>' +
              '<button class="btn btn--primary" id="ir-carteira">Adicionar créditos</button>' +
              '<div class="text--sm text--secondary" style="text-align:center;">Pix, cartão ou boleto</div></div>'
            );
            document.getElementById('ir-carteira').onclick = function () {
              PU.closeSheet();
              global.navigate('/profissional/carteira', true);
            };
          } else {
            PU.toast('Este chamado não está mais disponível.', 'danger');
            global.navigate('/profissional/home', true);
          }
        });
      }
      if (act === 'recusar-chamada') {
        DB.recusarChamada(params.id, user.id);
        PU.toast('Oportunidade removida da sua lista.', null);
        global.navigate('/profissional/home', true);
      }
    });
  }

  function bindPedidoDetalhe(content, params, user) {
    content.addEventListener('click', function (e) {
      const action = e.target.closest('[data-action]');
      if (!action) return;
      const act = action.getAttribute('data-action');
      if (act === 'iniciar-servico') {
        DB.iniciarServico(params.id);
        PU.toast('Serviço iniciado.', 'success');
        global.navigate('/profissional/pedido/' + params.id, true);
      }
      if (act === 'finalizar-servico') {
        PU.confirmDialog({ title: 'Concluir serviço', message: 'Confirma que o serviço foi finalizado?', okLabel: 'Concluir' }).then(function (ok) {
          if (!ok) return;
          DB.finalizarServico(params.id);
          PU.toast('Serviço concluído! O cliente já pode avaliar.', 'success');
          global.navigate('/profissional/pedido/' + params.id, true);
        });
      }
      if (act === 'cancelar-servico') {
        PU.confirmDialog({ title: 'Cancelar serviço', message: 'Tem certeza que deseja cancelar este serviço?', okLabel: 'Cancelar', danger: true }).then(function (ok) {
          if (!ok) return;
          DB.cancelarPedido(params.id, 'profissional', 'Cancelado pelo profissional após recusa do orçamento.');
          PU.toast('Serviço cancelado.', 'danger');
          global.navigate('/profissional/pedido/' + params.id, true);
        });
      }
      if (act === 'enviar-avaliacao-cliente') {
        const picker = content.querySelector('#prof-star-picker');
        const nota = Number(picker.getAttribute('data-nota') || 0);
        if (!nota) { PU.toast('Selecione uma nota de 1 a 5 estrelas.', 'danger'); return; }
        const comentario = content.querySelector('#prof-avaliacao-comentario').value.trim();
        DB.avaliarComoProfissional(params.id, nota, comentario);
        PU.toast('Avaliação enviada!', 'success');
        global.navigate('/profissional/servicos', true);
      }
    });
    const picker = content.querySelector('#prof-star-picker');
    if (picker) {
      picker.addEventListener('click', function (e) {
        const btn = e.target.closest('[data-star]');
        if (!btn) return;
        const n = Number(btn.getAttribute('data-star'));
        picker.setAttribute('data-nota', n);
        Array.prototype.forEach.call(picker.querySelectorAll('[data-star]'), function (b) {
          b.classList.toggle('is-active', Number(b.getAttribute('data-star')) <= n);
        });
      });
    }
  }

  function bindOrcamentoForm(content, params, user) {
    const form = content.querySelector('#orcamento-form');
    const maoInput = form.querySelector('[name="maoDeObra"]');
    const matInput = form.querySelector('[name="material"]');
    const totalEl = content.querySelector('#orcamento-total');
    function updateTotal() {
      const total = PU.parseCurrencyInput(maoInput.value) + PU.parseCurrencyInput(matInput.value);
      totalEl.textContent = PU.formatCurrency(total);
    }
    maoInput.addEventListener('input', updateTotal);
    matInput.addEventListener('input', updateTotal);
    updateTotal();

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      const fd = new FormData(form);
      const maoDeObra = PU.parseCurrencyInput(fd.get('maoDeObra'));
      if (!maoDeObra) { PU.toast('Informe o valor da mão de obra.', 'danger'); return; }
      const material = PU.parseCurrencyInput(fd.get('material'));
      const taxaVisita = PU.parseCurrencyInput(fd.get('taxaVisita'));
      DB.enviarOrcamento(params.id, { maoDeObra: maoDeObra, material: material, taxaVisita: taxaVisita });
      PU.toast('Orçamento enviado ao cliente!', 'success');
      global.navigate('/profissional/pedido/' + params.id, true);
    });
  }

  function bindCarteira(content, user) {
    const action = content.querySelector('[data-action="iniciar-recarga"]');
    if (!action) return;
    const valuesWrap = content.querySelector('#wallet-values');
    const methodsWrap = content.querySelector('#wallet-methods');
    const custom = content.querySelector('#wallet-custom-value');

    function selectedValue() {
      const customCents = PU.parseCurrencyInput(custom.value);
      return customCents > 0 ? customCents : Number(action.getAttribute('data-wallet-selected-value') || 5000);
    }
    function updateActionLabel() {
      action.innerHTML = icon('plus') + ' Adicionar ' + PU.formatCurrency(selectedValue());
    }

    valuesWrap.addEventListener('click', function (e) {
      const chip = e.target.closest('[data-wallet-value]');
      if (!chip) return;
      Array.prototype.forEach.call(valuesWrap.querySelectorAll('[data-wallet-value]'), function (c) { c.classList.remove('is-selected'); });
      chip.classList.add('is-selected');
      action.setAttribute('data-wallet-selected-value', chip.getAttribute('data-wallet-value'));
      custom.value = '';
      updateActionLabel();
    });
    custom.addEventListener('input', updateActionLabel);

    methodsWrap.addEventListener('click', function (e) {
      const btn = e.target.closest('[data-wallet-method]');
      if (!btn) return;
      action.setAttribute('data-wallet-selected-method', btn.getAttribute('data-wallet-method'));
      Array.prototype.forEach.call(methodsWrap.querySelectorAll('[data-wallet-method]'), function (b) {
        b.style.borderColor = '';
        b.style.boxShadow = '';
        const tile = b.querySelector('.icon-tile');
        tile.classList.remove('icon-tile--orange');
        tile.classList.add('icon-tile--ghost');
        const badge = b.querySelector('.badge');
        badge.className = 'badge badge--muted';
        badge.textContent = 'Escolher';
      });
      btn.style.borderColor = 'var(--orange-500)';
      btn.style.boxShadow = '0 0 0 1px var(--orange-500)';
      const tile = btn.querySelector('.icon-tile');
      tile.classList.remove('icon-tile--ghost');
      tile.classList.add('icon-tile--orange');
      const badge = btn.querySelector('.badge');
      badge.className = 'badge badge--success';
      badge.textContent = 'Selecionado';
    });

    action.addEventListener('click', function () {
      const valor = selectedValue();
      if (valor < 500) { PU.toast('A recarga mínima é R$ 5,00.', 'danger'); return; }
      const method = action.getAttribute('data-wallet-selected-method') || 'pix';
      openRechargeSheet(user, valor, method);
    });
  }

  function openRechargeSheet(user, valor, method) {
    const displayValue = PU.formatCurrency(valor);
    if (method === 'pix') {
      const pixCode = '00020126QUEMFAZ' + String(valor).padStart(8, '0') + 'BRASILPIX';
      PU.openSheet(
        '<div class="stack"><div class="row"><div class="icon-tile icon-tile--orange">' + icon('bolt') + '</div><div><h3 class="sheet__title">Pagar com Pix</h3><div class="text--sm text--secondary">' + displayValue + '</div></div></div>' +
        '<div class="card" style="background:var(--bg-sunken);border:none;text-align:center;padding:22px;"><div style="width:150px;height:150px;margin:0 auto;background:repeating-linear-gradient(45deg,#0b1d3a 0 7px,#fff 7px 14px);border:12px solid #fff;box-shadow:0 0 0 1px var(--border-subtle);"></div><div class="text--sm text--secondary" style="margin-top:10px;">QR Code de demonstração</div></div>' +
        '<label class="field"><span class="field__label">Pix copia e cola</span><input class="input" id="wallet-pix-code" readonly value="' + pixCode + '"></label>' +
        '<button class="btn btn--outline" id="wallet-copy-pix">Copiar código Pix</button>' +
        '<button class="btn btn--primary" id="wallet-confirm-pix">Simular Pix aprovado</button>' +
        '<p class="text--sm text--secondary" style="text-align:center;">Na versão online, o saldo entra somente depois da confirmação automática do provedor de pagamento.</p></div>'
      );
      document.getElementById('wallet-copy-pix').onclick = function () {
        const input = document.getElementById('wallet-pix-code'); input.select();
        if (navigator.clipboard) navigator.clipboard.writeText(input.value).catch(function () {});
        PU.toast('Código Pix copiado.', 'success');
      };
      document.getElementById('wallet-confirm-pix').onclick = function () {
        DB.recarregarCreditos(user.id, valor, 'Pix');
        PU.closeSheet();
        PU.toast(displayValue + ' adicionados à carteira.', 'success');
        global.navigate('/profissional/carteira', true);
      };
      return;
    }

    if (method === 'cartao') {
      PU.openSheet(
        '<div class="stack"><div class="row"><div class="icon-tile icon-tile--orange">' + icon('creditCard') + '</div><div><h3 class="sheet__title">Pagar com cartão</h3><div class="text--sm text--secondary">' + displayValue + '</div></div></div>' +
        '<label class="field"><span class="field__label">Número do cartão</span><input class="input" inputmode="numeric" placeholder="0000 0000 0000 0000"></label>' +
        '<label class="field"><span class="field__label">Nome no cartão</span><input class="input" placeholder="NOME COMO NO CARTÃO"></label>' +
        '<div class="row"><label class="field spacer"><span class="field__label">Validade</span><input class="input" placeholder="MM/AA"></label><label class="field" style="width:120px;"><span class="field__label">CVV</span><input class="input" inputmode="numeric" placeholder="123"></label></div>' +
        '<button class="btn btn--primary" id="wallet-confirm-card">Simular cartão aprovado</button>' +
        '<p class="text--sm text--secondary" style="text-align:center;">Na versão online, nenhum dado sensível do cartão deve ser salvo pelo QuemFaz; o provedor de pagamento processa a cobrança.</p></div>'
      );
      document.getElementById('wallet-confirm-card').onclick = function () {
        DB.recarregarCreditos(user.id, valor, 'Cartão');
        PU.closeSheet();
        PU.toast('Pagamento aprovado. Créditos liberados.', 'success');
        global.navigate('/profissional/carteira', true);
      };
      return;
    }

    const tx = DB.criarRecargaPendente(user.id, valor, 'Boleto');
    const line = '34191.79001 01043.510047 91020.150008 1 ' + String(900000000000 + valor).slice(0, 12);
    PU.openSheet(
      '<div class="stack"><div class="row"><div class="icon-tile icon-tile--orange">' + icon('document') + '</div><div><h3 class="sheet__title">Boleto gerado</h3><div class="text--sm text--secondary">' + displayValue + '</div></div></div>' +
      '<div class="card card--tight" style="background:var(--warning-100);border:none;"><div class="text--strong" style="color:var(--warning-600);">Aguardando compensação</div><div class="text--sm" style="color:var(--warning-600);margin-top:4px;">O saldo não é liberado ao gerar o boleto. Ele entra somente quando o pagamento for confirmado.</div></div>' +
      '<label class="field"><span class="field__label">Linha digitável</span><textarea class="textarea" id="wallet-boleto-line" readonly style="min-height:82px;">' + line + '</textarea></label>' +
      '<button class="btn btn--outline" id="wallet-copy-boleto">Copiar linha digitável</button>' +
      '<button class="btn btn--primary" id="wallet-confirm-boleto">Simular compensação do boleto</button>' +
      '<p class="text--sm text--secondary" style="text-align:center;">Esta confirmação manual existe apenas no protótipo offline.</p></div>'
    );
    document.getElementById('wallet-copy-boleto').onclick = function () {
      const input = document.getElementById('wallet-boleto-line'); input.select();
      if (navigator.clipboard) navigator.clipboard.writeText(input.value).catch(function () {});
      PU.toast('Linha digitável copiada.', 'success');
    };
    document.getElementById('wallet-confirm-boleto').onclick = function () {
      DB.confirmarRecargaPendente(tx.id);      PU.closeSheet();
      PU.toast('Boleto compensado. Créditos liberados.', 'success');
      global.navigate('/profissional/carteira', true);
    };
  }

  function bindPerfil(content, user) {
    const chips = content.querySelector('#perfil-cats');
    chips.addEventListener('click', function (e) {
      const chip = e.target.closest('[data-chip-cat]');
      if (!chip) return;
      const id = chip.getAttribute('data-chip-cat');
      let cats = user.categorias.slice();
      if (cats.indexOf(id) === -1) cats.push(id); else cats = cats.filter(function (x) { return x !== id; });
      DB.atualizarPerfilProfissional(user.id, { categorias: cats });
      chip.classList.toggle('is-selected');
    });

  // ---------------- Profissionais ----------------

  // V12.3: etiqueta de cadastro novo com dia e hora.
  const NOVO_HORAS = 24;
  function ehCadastroNovo(u) { const t = Date.parse(u && u.criadoEm); return !isNaN(t) && (Date.now() - t) < NOVO_HORAS * 3600000; }
  function tsCadastro(u) { const t = Date.parse(u && u.criadoEm); return isNaN(t) ? 0 : t; }
  function cadastroTag(u) {
    if (!u || !u.criadoEm) return '';
    return ehCadastroNovo(u)
      ? '<span class="badge" style="background:#16a34a;color:#fff;font-weight:700;">🆕 Cadastro novo · ' + PU.escapeHtml(PU.formatDateTime(u.criadoEm)) + '</span>'
      : '<span class="badge badge--muted">Cadastro ' + PU.escapeHtml(PU.formatDateTime(u.criadoEm)) + '</span>';
  }
  function profBadges(p) {
    return (p.online ? '<span class="badge badge--success"><span class="badge__dot"></span>Online</span>' : '<span class="badge badge--muted">Offline</span>') +
      (p.verificado ? '<span class="badge badge--success">Verificado</span>' : '') +
      (p.temFoto === false ? '<span class="badge badge--warning">Sem selfie</span>' : '') +
      (p.bloqueado ? '<span class="badge badge--danger">Bloqueado</span>' : '') +
      '<span class="badge badge--navy">' + PU.formatCurrency(p.saldo || 0) + '</span>';
  }
  // V12.2: profissionais separados por cidade (para saber onde abrir campanha de cliente).
  let profCidadeFiltro = 'todas';
  let profBusca = '';
  function profCidadeInfo(p) {
    const c = DB.cityById(p.cidadeId);
    const nome = (c && c.nome) || p.cidadeNome || 'Sem cidade';
    const uf = (c && c.uf) || p.uf || '';
    const key = catNormAdmin(nome) + '|' + String(uf).toUpperCase();
    return { key: key, nome: nome, uf: String(uf).toUpperCase(), label: nome + (uf ? '/' + String(uf).toUpperCase() : '') };
  }
  function catNormAdmin(v) { return String(v || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim(); }
  // ---------------- V11.58: atividade do profissional ----------------
  // Quantos pedidos ele desbloqueou, quantos finalizou (informou que fechou o serviço) e as notas que os clientes deram.
  function adminProfAtividade(proId) {
    const id = String(proId);
    const itens = [];
    (DB.state.requests || []).forEach(function (r) {
      desbloqueiosAtivos(r).forEach(function (x) {
        if (String(x.profissionalId) === id) itens.push({ r: r, x: x, t: Date.parse(x.criadoEm) || 0 });
      });
    });
    itens.sort(function (a, b) { return b.t - a.t; });
    const notas = (DB.state.avaliacoesAdmin || []).filter(function (a) { return String(a.profissionalId) === id && a.autor === 'cliente'; });
    const notaPorPedido = {};
    notas.forEach(function (a) { notaPorPedido[a.requestId] = a; });
    let fechados = 0, naoFechados = 0, gasto = 0;
    itens.forEach(function (m) {
      if (m.x.desfecho === 'fechado') fechados++; else if (m.x.desfecho === 'nao_fechado') naoFechados++;
      gasto += qfDesbPagamento(m.x).valor;
      m.nota = notaPorPedido[m.r.id] || null;
    });
    const soma = notas.reduce(function (s, a) { return s + a.nota; }, 0);
    return { itens: itens, total: itens.length, fechados: fechados, naoFechados: naoFechados, semResposta: itens.length - fechados - naoFechados,
      gasto: gasto, notas: notas, media: notas.length ? soma / notas.length : 0 };
  }
  function adminProfNotaTxt(a) { return a.notas.length ? a.media.toFixed(1).replace('.', ',') + ' (' + a.notas.length + (a.notas.length === 1 ? ' nota' : ' notas') + ')' : 'sem nota'; }
  function adminProfAtivLinha(p) {
    const a = adminProfAtividade(p.id);
    if (!a.total) return '<div class="qf-prof-ativ is-zero">Nenhum desbloqueio ainda</div>';
    return '<div class="qf-prof-ativ"><b>' + a.total + '</b> ' + (a.total === 1 ? 'desbloqueio' : 'desbloqueios') + ' · <b>' + a.fechados + '</b> ' + (a.fechados === 1 ? 'finalizado' : 'finalizados') + ' · Nota: <b>' + adminProfNotaTxt(a) + '</b></div>';
  }
  function adminProfAtivHtml(p) {
    const a = adminProfAtividade(p.id);
    function n(rot, v, sub) { return '<div class="qf-adm-num__item"><span>' + rot + '</span><b>' + v + '</b><small>' + sub + '</small></div>'; }
    const numeros = '<section class="qf-adm-numeros" aria-label="Atividade do profissional" style="margin:14px 0 0;">' +
      n('Desbloqueios', a.total, a.total ? PU.formatCurrency(a.gasto) + ' em desbloqueios' : 'nenhum ainda') +
      n('Finalizados', a.fechados, 'informou que fechou o serviço') +
      n('Não fechou', a.naoFechados, a.semResposta ? a.semResposta + ' ainda sem resultado' : 'nenhum sem resultado') +
      n('Nota dos clientes', a.notas.length ? a.media.toFixed(1).replace('.', ',') : '—', a.notas.length ? a.notas.length + (a.notas.length === 1 ? ' cliente avaliou' : ' clientes avaliaram') : 'nenhum cliente avaliou ainda') +
    '</section>';
    const lista = a.itens.map(function (m) {
      const pg = qfDesbPagamento(m.x);
      const pedido = qfPedidoTitulo(m.r) + (m.r.titulo && String(m.r.titulo).trim() !== qfPedidoTitulo(m.r) ? ' · ' + String(m.r.titulo).trim() : '');
      const res = m.x.desfecho === 'fechado' ? '<span class="qf-prof-hist__res is-ok">Finalizado</span>' : m.x.desfecho === 'nao_fechado' ? '<span class="qf-prof-hist__res is-nao">Não fechou</span>' : '<span class="qf-prof-hist__res">Sem resultado ainda</span>';
      const nota = m.nota ? ' · Cliente deu nota ' + m.nota.nota + (m.nota.comentario ? ' — “' + PU.escapeHtml(m.nota.comentario) + '”' : '') : (m.x.desfecho === 'fechado' ? ' · Cliente ainda não deu nota' : '');
      return '<button type="button" class="qf-extrato__mov" data-nav="/admin/servicos/' + m.r.id + '">' +
        '<span class="qf-extrato__hr">' + (m.t ? qfDiaMes(m.x.criadoEm) : '—') + '<small>' + (m.t ? qfHora(m.x.criadoEm) : 'sem data') + '</small></span>' +
        '<span class="qf-extrato__qm"><b>' + PU.escapeHtml(pedido) + '</b><span>' + res + nota + '</span></span>' +
        '<span class="qf-extrato__vl' + (pg.valor > 0 ? '' : ' is-zero') + '">' + PU.formatCurrency(pg.valor) + '<small>' + pg.rotulo + '</small></span>' +
      '</button>';
    }).join('');
    return numeros +
      '<div class="section"><div class="section-head"><h2 class="h3">Pedidos que ele desbloqueou</h2></div>' +
        (a.total ? '<div class="qf-prof-hist">' + lista + '</div>' : '<div class="card card--tight"><div class="text--sm text--secondary">Este profissional ainda não desbloqueou nenhum pedido.</div></div>') +
      '</div>';
  }
  function profCard(p) {

    return '<div data-prof-search="' + PU.escapeHtml(catNormAdmin(p.nome + ' ' + String(p.telefone || '').replace(/\D/g, '') + ' ' + (p.telefone || '') + ' ' + (p.email || ''))) + '"><button class="card card--pressable" style="width:100%;text-align:left;" data-nav="/admin/profissionais/' + p.id + '" data-x="' + PU.escapeHtml(catNormAdmin(p.nome + ' ' + String(p.telefone || '').replace(/\D/g, '') + ' ' + (p.telefone || '') + ' ' + (p.email || ''))) + '">' +
      '<div class="row-between">' +
        '<div class="row"><div class="avatar avatar--sm">' + (p.fotoUrl ? '<img src="' + PU.escapeHtml(p.fotoUrl) + '" alt="Selfie do profissional">' : PU.initials(p.nome)) + '</div>' +
        '<div style="min-width:0;"><div class="text--strong">' + PU.escapeHtml(p.nome) + '</div><div class="text--sm text--secondary">' + PU.escapeHtml(cidade.label) + PU.escapeHtml(extra) + (p.bloqueado ? ' · Bloqueado' : '') + '</div>' +
        '<div class="text--sm" style="word-break:break-all;">' + PU.escapeHtml(p.email || 'sem e-mail') + (p.telefone ? ' · ' + PU.escapeHtml(p.telefone) : '') + '</div></div></div>' +
        icon('chevronRight', 'list-item__chevron') +
