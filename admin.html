      (cloudOn() ? adminProfAtivLinha(p) : '') +
    '</button>' + testeLinhaHtml(p.id) + (cloudOn() ? '<div data-prof-acoes style="margin:8px 0 6px;">' + acoesHtml('profissional', p.id, null, p.telefone, p) + '</div>' : '') + '</div>';
  }

  // ---------------- V11.51: Simular chamado ----------------
  // Teste do aviso de chamado no celular do profissional (tabela chamados_teste). Não cria pedido,
  // não mexe em carteira e não entra em receita nem em contagem de pedidos.
  const TESTE_AGUARDA_MS = 2 * 60 * 1000;
  let testes = null;            // lista mais recente de chamados_teste (null = ainda não carregou)
  const testeEnviando = {};      // profissional -> envio em andamento
  let testeTimer = null;
  function ultimoTeste(proId) {
    if (!testes) return null;
    for (let i = 0; i < testes.length; i++) if (String(testes[i].profissional_id) === String(proId)) return testes[i];
    return null;
  }
  function soApk(t) { return Number(t.apk) > 0 && !Number(t.web) && !(t.envio && Number(t.envio.sent) === 0); }
  function testeSituacao(t) {
    if (!t) return { cor: 'cinza', rotulo: 'Nunca testado', quando: '' };
    if (t.confirmado_em) return { cor: 'verde', rotulo: 'Confirmado pelo profissional', quando: t.confirmado_em };
    if (t.chegou_em) return { cor: 'amarelo', rotulo: 'Chegou no aparelho, não confirmou', quando: t.chegou_em };
    if (Date.now() - (Date.parse(t.enviado_em) || 0) < TESTE_AGUARDA_MS) return { cor: 'azul', rotulo: 'Enviado agora, aguardando', quando: t.enviado_em };
    const semAparelho = t.envio && Number(t.envio.total) === 0;
    // V11.53: o app Android (APK 12) não informa a chegada; só o PWA marca "chegou" sozinho.
    if (!semAparelho && soApk(t)) return { cor: 'laranja', rotulo: 'Enviado ao celular (app Android não informa a chegada)', quando: t.enviado_em };
    // V11.61: sem aparelho cadastrado não é falha de envio — ele nunca ativou as notificações.
    if (semAparelho) return { cor: 'cinza', rotulo: 'Sem aparelho cadastrado (não ativou as notificações)', quando: t.enviado_em };
    return { cor: 'vermelho', rotulo: 'Enviado, não chegou no aparelho', quando: t.enviado_em };
  }
  function testeEtiquetaHtml(proId) {
    const sit = testeSituacao(ultimoTeste(proId));
    return '<span class="qf-teste-sit qf-teste-sit--' + sit.cor + '">' + sit.rotulo + '</span>' +
      (sit.quando ? '<small>' + PU.escapeHtml(PU.formatDateTime(sit.quando)) + '</small>' : '');
  }
  function testeLinhaHtml(proId) {
    return '<div class="qf-teste-linha"><div class="qf-teste-linha__info"><span class="qf-teste-linha__rotulo">Último teste</span>' +
      '<span data-teste-sit="' + PU.escapeHtml(String(proId)) + '">' + (cloudOn() && !testes ? '<span class="qf-teste-sit qf-teste-sit--cinza">Carregando…</span>' : testeEtiquetaHtml(proId)) + '</span></div>' +
      '<button type="button" class="btn btn--primary btn--sm qf-teste-btn" data-simular-chamado="' + PU.escapeHtml(String(proId)) + '"' + (testeEnviando[proId] ? ' disabled' : '') + '>' + icon('bell') + 'Simular chamado</button></div>';
  }
  // V11.61: um número por profissional (o último teste de cada um), separando falha de envio de quem não tem aparelho.
  function testeResumoHtml() {
    const visto = {}, l = [];
    (testes || []).forEach(function (t) { const k = String(t.profissional_id); if (!visto[k]) { visto[k] = 1; l.push(t); } });
    const agora = Date.now();
    let conf = 0, chegou = 0, naoChegou = 0, semAparelho = 0, android = 0;
    l.forEach(function (t) {
      if (t.confirmado_em) { conf++; return; }
      if (t.chegou_em) { chegou++; return; }
      if (agora - (Date.parse(t.enviado_em) || 0) < TESTE_AGUARDA_MS) return;
      if (t.envio && Number(t.envio.total) === 0) semAparelho++;
      else if (soApk(t)) android++;
      else naoChegou++;
    });
    function n(rot, v, cor, sub) { return '<div class="qf-adm-num__item"><span>' + rot + '</span><b' + (cor ? ' style="color:' + cor + '"' : '') + '>' + (testes ? v : '…') + '</b>' + (sub ? '<small>' + sub + '</small>' : '') + '</div>'; }
    return n('Profissionais testados', l.length, '', 'último teste de cada um') + n('Confirmados', conf, 'var(--success-600)', 'tocaram em confirmar') + n('Chegou e não confirmou', chegou, 'var(--warning-600)', 'o aviso chegou no celular') +
      n('Não chegou no aparelho', naoChegou, 'var(--danger-600)', 'tem aparelho, mas o aviso falhou') + n('Sem aparelho cadastrado', semAparelho, 'var(--text-secondary)', 'não ativou as notificações') + n('Enviado ao app Android', android, 'var(--orange-700)', 'o app não informa a chegada');
  }
  function testePintar() {
    document.querySelectorAll('[data-teste-sit]').forEach(function (el) { el.innerHTML = testeEtiquetaHtml(el.getAttribute('data-teste-sit')); });
    const r = document.querySelector('[data-teste-resumo]');
    if (r) r.innerHTML = testeResumoHtml();
  }
  async function testeCarregar() {
    if (!cloudOn()) return;
    try {
      // V11.53: vem junto o tipo de aparelho (apk/web) para não mostrar "não chegou" a quem usa o APK.
      const res = await global.QFAdminCloud.client.rpc('qf_admin_chamados_teste');
      if (res.error) throw res.error;
      testes = res.data || [];
    } catch (err) { console.warn('QuemFaz testes', err); if (!testes) testes = []; }
    testePintar();
  }
  // A situação se atualiza sozinha a cada 5 s enquanto a lista de profissionais estiver aberta.
  function testeAcompanhar() {
    if (testeTimer) clearInterval(testeTimer);
    testeCarregar();
    testeTimer = setInterval(function () {
      if (!document.querySelector('[data-teste-sit]')) { clearInterval(testeTimer); testeTimer = null; return; }
      if (!document.hidden) testeCarregar();
    }, 5000);
  }
  document.addEventListener('click', async function (e) {
    const b = e.target.closest && e.target.closest('[data-simular-chamado]');
    if (!b) return;
    e.preventDefault(); e.stopPropagation();
    if (!cloudOn()) { PU.toast('O teste de chamado funciona com o painel conectado ao banco de dados.', 'danger'); return; }
    const proId = b.getAttribute('data-simular-chamado');
    if (testeEnviando[proId]) return;
    testeEnviando[proId] = true; b.disabled = true;
    try {
      const r = await global.QFAdminCloud.client.functions.invoke('quemfaz-push', { body: { action: 'teste_chamado', profissional_id: proId } });
      if (r.error) throw r.error;
      const d = r.data || {};
      if (!d.ok) throw new Error(d.error || 'Não foi possível enviar o teste.');
      testes = [{ id: d.id, profissional_id: proId, enviado_em: d.enviado_em || new Date().toISOString(), chegou_em: null, confirmado_em: null, envio: { sent: d.sent, total: d.total } }].concat(testes || []);
      testePintar();
      PU.toast(Number(d.total) ? 'Chamado de teste enviado para ' + d.sent + ' de ' + d.total + ' aparelho(s).' : 'Teste registrado, mas este profissional não tem aparelho cadastrado para avisos.', Number(d.total) ? 'success' : 'danger');
    } catch (err) {
      PU.toast('Não foi possível enviar o teste: ' + ((err && err.message) || err), 'danger');
    } finally { testeEnviando[proId] = false; b.disabled = false; }
  }, true);

  // V11.56: "Simular chamado para todos" — repete o teste individual para cada profissional da lista
  // (4 por vez). Cada um fica com o seu registro em chamados_teste, igual ao teste individual.
  let testeTodosRodando = false;
  async function testeEnviarUm(proId) {
    const r = await global.QFAdminCloud.client.functions.invoke('quemfaz-push', { body: { action: 'teste_chamado', profissional_id: proId } });
    if (r.error) throw r.error;
    const d = r.data || {};
    if (!d.ok) throw new Error(d.error || 'falha');
    testes = [{ id: d.id, profissional_id: proId, enviado_em: d.enviado_em || new Date().toISOString(), chegou_em: null, confirmado_em: null, envio: { sent: d.sent, total: d.total } }].concat(testes || []);
    return d;
  }
  document.addEventListener('click', async function (e) {
    const b = e.target.closest && e.target.closest('[data-simular-todos]');
    if (!b) return;
    e.preventDefault(); e.stopPropagation();
    if (!cloudOn()) { PU.toast('O teste de chamado funciona com o painel conectado ao banco de dados.', 'danger'); return; }
    if (testeTodosRodando) return;
    const todos = DB.state.users.profissionais || [];
    const daCidade = profCidadeFiltro === 'todas' ? todos : todos.filter(function (p) { return profCidadeInfo(p).key === profCidadeFiltro; });
    const alvo = daCidade.length ? daCidade : todos;
    const ids = alvo.map(function (p) { return String(p.id); }).filter(Boolean);
    if (!ids.length) { PU.toast('Nenhum profissional na lista.', 'danger'); return; }
    const ok = await PU.confirmDialog({ title: 'Simular chamado para ' + ids.length + ' profissiona' + (ids.length === 1 ? 'l' : 'is'),
      message: 'O celular de cada um vai tocar o chamado de teste em tela cheia, com o toque de chamado, agora. Não cria pedido e não mexe em carteira. Confirma?',
      okLabel: 'Enviar para todos' });
    if (!ok) return;
    testeTodosRodando = true;
    let feitos = 0, comAparelho = 0, semAparelho = 0, falhas = 0;
    function pintarBotao() {
      const bt = document.querySelector('[data-simular-todos]'), tx = document.querySelector('[data-simular-todos-txt]');
      if (bt) bt.disabled = testeTodosRodando;
      if (tx) tx.textContent = testeTodosRodando ? 'Enviando ' + feitos + ' de ' + ids.length + '…' : 'Simular chamado para todos';
    }
    pintarBotao();
    const fila = ids.slice();
    async function trabalhador() {
      while (fila.length) {
        const id = fila.shift();
        try {
          const d = await testeEnviarUm(id);
          if (Number(d.sent) > 0) comAparelho++; else semAparelho++;
        } catch (err) { falhas++; console.warn('QuemFaz teste para todos', id, err && err.message); }
        feitos++;
        pintarBotao();
        if (feitos % 5 === 0) testePintar();
      }
    }
    try { await Promise.all([trabalhador(), trabalhador(), trabalhador(), trabalhador()]); }
    finally {
      testeTodosRodando = false;
      pintarBotao(); testePintar();
      PU.toast('Teste enviado para ' + comAparelho + ' profissiona' + (comAparelho === 1 ? 'l' : 'is') + '.' +
        (semAparelho ? ' ' + semAparelho + ' sem aparelho para receber.' : '') + (falhas ? ' ' + falhas + ' com falha no envio.' : ''), falhas && !comAparelho ? 'danger' : 'success');
    }
  }, true);

  function adminCategoryName(id) {
    const c = DB.categoryById(id);
    if (c && c.nome) return c.nome;
    if (/^cat_custom_/.test(String(id || ''))) return 'Categoria personalizada indisponível';
    if (/^cat_/.test(String(id || ''))) return 'Categoria indisponível';
    return String(id || 'Categoria não informada');
  }
  function topCats(list) {
    const cnt = {};
    list.forEach(function (p) { (p.categorias || []).forEach(function (id) { cnt[id] = (cnt[id] || 0) + 1; }); });
    return Object.keys(cnt).sort(function (a, b) { return cnt[b] - cnt[a]; }).slice(0, 5).map(function (id) {

  function confirm2(btn, fn) {
    if (btn.dataset.confirm !== '1') {
      btn.dataset.confirm = '1'; btn.dataset.label = btn.innerHTML;
      btn.innerHTML = icon('trash') + ' Toque de novo para confirmar';
      btn.classList.add('is-confirm');
      setTimeout(function () { if (btn.isConnected && btn.dataset.confirm === '1') { btn.dataset.confirm = ''; btn.innerHTML = btn.dataset.label; btn.classList.remove('is-confirm'); } }, 4000);
      return;
    }
    btn.dataset.confirm = ''; btn.disabled = true;
    Promise.resolve().then(fn).catch(function (err) { PU.toast((err && err.message) || 'Não foi possível concluir.', 'danger'); }).finally(function () { if (btn.isConnected) { btn.disabled = false; btn.innerHTML = btn.dataset.label; btn.classList.remove('is-confirm'); } });

    const box = document.getElementById('eu-cats');

          if (m && UFS.indexOf(m[2].toUpperCase()) !== -1) cidades.push({ cidade: m[1].trim(), uf: m[2].toUpperCase() }); else invalidas.push(t);
        });

        dados.nome_fantasia = val('eu-fantasia').trim();

  // Um só tratador de cliques para Editar/Excluir em qualquer tela do admin.
  document.addEventListener('click', function (e) {

  // ---------------- Clientes ----------------

  function adminClientePhoneKey(c) {
    let d = String((c && (c.whatsapp || c.telefone)) || '').replace(/\D/g, '');
    if (d.indexOf('55') === 0 && (d.length === 12 || d.length === 13)) d = d.slice(2);
    return d;
  }

  function adminClienteEmailLabel(c) {
    const e = String((c && c.email) || '').trim();
    return (!e || /@acesso\.quemfaz\.app\.br$/i.test(e)) ? 'Não informado (acesso por WhatsApp)' : e;
  }

  function adminClientesConsolidados() {
    const grupos = {};
    (DB.state.users.clientes || []).forEach(function (c) {
      const phone = adminClientePhoneKey(c);
      const key = phone ? 'wa:' + phone : 'id:' + c.id;
      (grupos[key] = grupos[key] || []).push(c);
    });
    const requests = DB.state.requests || [];
    return Object.keys(grupos).map(function (key) {
      const membros = grupos[key].slice().sort(function (a, b) { return tsCadastro(a) - tsCadastro(b); });
      const base = membros[0];
      const recente = membros[membros.length - 1];
      const ids = membros.map(function (x) { return x.id; });
      const pedidos = requests.filter(function (r) { return ids.indexOf(r.clienteId) !== -1; });
      const realEmail = membros.map(function (x) { return String(x.email || '').trim(); }).find(function (mail) {
        return mail && !/@acesso\.quemfaz\.app\.br$/i.test(mail);
      });
      const ultimoPedido = pedidos.reduce(function (mx, r) {
        const t = Date.parse(r.criadoEm || r.atualizadoEm);
        return isNaN(t) ? mx : Math.max(mx, t);
      }, 0);
      return Object.assign({}, base, {
        nome: recente.nome || base.nome,
        telefone: recente.telefone || recente.whatsapp || base.telefone || base.whatsapp || '',
        whatsapp: recente.whatsapp || recente.telefone || base.whatsapp || base.telefone || '',
        email: realEmail || base.email || '',
        _idsCliente: ids,
        _pedidos: pedidos.length,
        _duplicados: Math.max(0, membros.length - 1),
        _sortTime: Math.max(tsCadastro(recente), ultimoPedido)
      });
    }).sort(function (a, b) { return b._sortTime - a._sortTime; });
  }

  function adminClienteDocumento(c) {
    if (c.cpfFinal) return 'CPF cadastrado · final ' + PU.escapeHtml(String(c.cpfFinal));
    if (c.cnpjFinal) return 'CNPJ cadastrado · final ' + PU.escapeHtml(String(c.cnpjFinal));
    return 'CPF não informado';

  function adminClienteEndereco(c) {
    const e = c.enderecoAdmin || (c.enderecos && c.enderecos[0]) || null;
    if (!e) return 'Endereço não informado';
    const ruaNumero = [e.rua || '', e.numero || ''].filter(Boolean).join(', ');
    const cidadeUf = [e.cidade || '', e.uf || ''].filter(Boolean).join('/');
    return [ruaNumero, e.bairro || '', cidadeUf, e.cep ? 'CEP ' + e.cep : '', e.complemento || ''].filter(Boolean).join(' · ');
  }

  // ---------------- Serviços ----------------

  const TABS_SERVICOS = [

  // V11.44: data e hora sempre no horário de Brasília, e quanto tempo levou para desbloquear.
  const QF_TZ = 'America/Sao_Paulo';
  function qfHora(iso) { const d = new Date(iso); return isNaN(d) ? '—' : d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit', timeZone: QF_TZ }); }
  function qfDiaMes(iso) { const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', timeZone: QF_TZ }); }
  function qfDiaChave(iso) { const d = iso ? new Date(iso) : new Date(); return isNaN(d) ? '' : d.toLocaleDateString('en-CA', { timeZone: QF_TZ }); }
  function qfDiaRotulo(chave) {
    if (!chave) return 'Sem data';
    const p = chave.split('-'), br = p[2] + '/' + p[1] + '/' + p[0];
    if (chave === qfDiaChave()) return 'Hoje · ' + br;
    if (chave === qfDiaChave(new Date(Date.now() - 86400000).toISOString())) return 'Ontem · ' + br;
    return br;
  }
  function qfDuracao(ms) {
    if (!(ms >= 0)) return '';
    const min = Math.floor(ms / 60000);
    if (min < 1) return 'menos de 1 min';
    if (min < 60) return min + ' min';
    const h = Math.floor(min / 60);
    if (h < 24) return h + 'h' + (min % 60 ? ' ' + String(min % 60).padStart(2, '0') + 'min' : '');
    const d = Math.floor(h / 24);
    return d + (d === 1 ? ' dia' : ' dias');
  }
  // Como o desbloqueio foi pago: crédito da carteira, plano ou sem cobrança (bônus/grátis).
  function qfDesbPagamento(x) {
    if (x.origem === 'plano') return { valor: 0, rotulo: 'plano' };
    const v = Number(x.valor || 0);
    return v > 0 ? { valor: v, rotulo: 'crédito' } : { valor: 0, rotulo: 'grátis' };
  }
  function qfPedidoTitulo(r) {
    const cat = DB.categoryById(r.categoriaId);
    return (cat && cat.nome) || 'Serviço';
  }
  // Extrato: uma linha por desbloqueio (data, hora, quem, qual pedido e valor), do mais novo para o mais antigo.
  const EXTRATO_MAX = 80;
  function adminExtratoMovimentos(all) {
    const movs = [];
    all.forEach(function (r) {
      desbloqueiosAtivos(r).forEach(function (x) {
        movs.push({ r: r, x: x, t: Date.parse(x.criadoEm) || 0 });
      });
    });
    return movs.sort(function (a, b) { return b.t - a.t; });
  }
  function adminExtratoHtml(all) {
    const movs = adminExtratoMovimentos(all);
    const hoje = qfDiaChave();
    let qtdHoje = 0, totalHoje = 0;
    const dias = [], porDia = {};
    movs.forEach(function (m) {
      const k = m.t ? qfDiaChave(m.x.criadoEm) : '';
      const pg = qfDesbPagamento(m.x);
      if (!porDia[k]) { porDia[k] = { chave: k, qtd: 0, total: 0, movs: [] }; dias.push(porDia[k]); }
      porDia[k].qtd += 1; porDia[k].total += pg.valor; porDia[k].movs.push(m);
      if (k === hoje) { qtdHoje += 1; totalHoje += pg.valor; }
    });
    let restam = EXTRATO_MAX;
    const corpo = dias.map(function (d) {
      if (restam <= 0) return '';
      const linhas = d.movs.slice(0, restam); restam -= linhas.length;
      return '<div class="qf-extrato__dia"><span>' + PU.escapeHtml(qfDiaRotulo(d.chave)) + '</span><span>' + d.qtd + (d.qtd === 1 ? ' desbloqueio' : ' desbloqueios') + '</span></div>' +
        linhas.map(function (m) {
          const p = DB.profissionalById(m.x.profissionalId);
          const pg = qfDesbPagamento(m.x);
          const pedido = qfPedidoTitulo(m.r) + (m.r.titulo ? ' · ' + String(m.r.titulo).trim() : '');
          return '<button type="button" class="qf-extrato__mov" data-nav="/admin/servicos/' + m.r.id + '">' +
            '<span class="qf-extrato__hr">' + (m.t ? qfHora(m.x.criadoEm) : '—') + '<small>' + (m.t ? qfDiaMes(m.x.criadoEm) : 'sem data') + '</small></span>' +
            '<span class="qf-extrato__qm"><b>' + PU.escapeHtml((p && p.nome) || 'Profissional') + '</b><span>' + PU.escapeHtml(pedido) + '</span></span>' +
            '<span class="qf-extrato__vl' + (pg.valor > 0 ? '' : ' is-zero') + '">' + PU.formatCurrency(pg.valor) + '<small>' + pg.rotulo + '</small></span>' +
          '</button>';
        }).join('') +
        '<div class="qf-extrato__total"><span>Total do dia</span><b>' + PU.formatCurrency(d.total) + '</b></div>';
    }).join('');
    const largo = !!(global.matchMedia && global.matchMedia('(min-width:980px)').matches);
    return '<details class="qf-extrato" id="extrato-desbloqueios"' + (largo ? ' open' : '') + '>' +
      '<summary><span><strong>Extrato de desbloqueios</strong><small>Hoje: ' + qtdHoje + (qtdHoje === 1 ? ' desbloqueio' : ' desbloqueios') + ' · ' + PU.formatCurrency(totalHoje) + '</small></span><em>Abrir</em></summary>' +
      (movs.length ? corpo + (movs.length > EXTRATO_MAX ? '<div class="qf-extrato__vazio">Mostrando os ' + EXTRATO_MAX + ' mais recentes de ' + movs.length + '.</div>' : '')
        : '<div class="qf-extrato__vazio">Nenhum desbloqueio registrado ainda.</div>') +

  // Quem desbloqueou, dentro do próprio pedido: nome, hora, data, valor e resultado.
  function adminPedidoQuemHtml(r, fechadoOuCancelado) {
    const desb = desbloqueiosAtivos(r).slice().sort(function (a, b) { return (Date.parse(a.criadoEm) || 0) - (Date.parse(b.criadoEm) || 0); });
    const t0 = Date.parse(r.criadoEm) || 0;
    if (!desb.length) {
      return '<div class="qf-ped__quem"><h3>Quem desbloqueou</h3><div class="qf-ped__vazio">' +
        (fechadoOuCancelado ? 'Ninguém desbloqueou' : 'Ninguém ainda' + (t0 ? ' · aberto há ' + qfDuracao(Date.now() - t0) : '')) + '</div></div>';
    }
    return '<div class="qf-ped__quem"><h3>Quem desbloqueou · ' + desb.length + ' de 3</h3>' + desb.map(function (x, n) {
      const p = DB.profissionalById(x.profissionalId);
      const nome = (p && p.nome) || 'Profissional';
      const t = Date.parse(x.criadoEm) || 0;
      const pg = qfDesbPagamento(x);
      const partes = [(n + 1) + 'º'];
      if (t && t0 && t >= t0) partes.push(qfDuracao(t - t0) + ' depois do pedido');
      if (x.desfecho === 'fechado') partes.push('fechou o serviço'); else if (x.desfecho === 'nao_fechado') partes.push('não fechou');
      return '<div class="qf-ped__pro"><div class="qf-ped__av">' + PU.escapeHtml(PU.initials(nome)) + '</div>' +
        '<div class="qf-ped__n"><b>' + PU.escapeHtml(nome) + (p && p.verificado ? '<span class="qf-ped__tag">Verificado</span>' : '') + '</b><span>' + PU.escapeHtml(partes.join(' · ')) + '</span></div>' +
        '<div class="qf-ped__h"><b>' + (t ? qfHora(x.criadoEm) : '—') + '</b><span>' + (t ? qfDiaMes(x.criadoEm) + ' · ' : '') + (pg.valor > 0 ? PU.formatCurrency(pg.valor) : pg.rotulo) + '</span></div></div>';
    }).join('') + '</div>';
  }
  function adminControleResumoHtml(all) {
    const abertos = all.filter(function(r){return !desbloqueiosAtivos(r).length && r.status !== 'cancelado' && r.status !== 'concluido';}).length;
    const comContato = all.filter(function(r){return desbloqueiosAtivos(r).length > 0;}).length;
    const fechados = all.filter(function(r){return desbloqueiosAtivos(r).some(function(x){return x.desfecho === 'fechado';});}).length;
    return '<section class="qf-control-overview"><div class="qf-control-heading"><strong>Central de pedidos</strong><small>Dados disponíveis no painel · atualize para consultar novamente</small></div><div class="qf-control-kpis">' +
      '<div><strong>' + all.length + '</strong><span>Total</span></div>' +
      '<div><strong>' + abertos + '</strong><span>Sem desbloqueio</span></div>' +
      '<div><strong>' + comContato + '</strong><span>Desbloqueados</span></div>' +
      '<div><strong>' + fechados + '</strong><span>Fechados informados</span></div>' +
      '</div></section>';
  }
  function adminProfissionaisElegiveisHtml(r) {
    const city = DB.cityById ? DB.cityById(r.cidadeId) : null;
    const cityName = ((r.endereco || {}).cidade || (city && city.nome) || '').toLowerCase().trim();
    const pros = (DB.state.users.profissionais || []).filter(function(p){
      const cats = p.categorias || [];
      const matchesCat = cats.some(function(x){return String(x) === String(r.categoriaId);});
      const pc = DB.cityById ? DB.cityById(p.cidadeId) : null;
      const sameCity = p.cidadeId && r.cidadeId ? String(p.cidadeId) === String(r.cidadeId) : !!(cityName && pc && String(pc.nome || '').toLowerCase().trim() === cityName);
      return matchesCat && sameCity && !p.bloqueado;
    });
    const online = pros.filter(function(p){return p.online;}).length;
    return '<section class="section"><div class="section-head"><h2 class="h3">Profissionais da região e categoria</h2></div>' +
      '<div class="card stack--sm"><div class="qf-control-facts"><span><strong>' + pros.length + '</strong> cadastrados compatíveis</span><span><strong>' + online + '</strong> online no último retrato</span></div>' +
      '<p class="text--sm text--secondary">Compatibilidade preliminar por cidade e categoria. Distância exata, raio real, entrega de notificações e aceite exigem dados de geolocalização e eventos; não são confirmados aqui.</p>' +
      (pros.length ? pros.slice(0,30).map(function(p){

        return '<div class="qf-control-pro"><div><strong>' + PU.escapeHtml(p.nome || 'Profissional') + '</strong><small>' + (p.online ? 'Online no retrato' : 'Offline no retrato') + ' · Raio configurado: ' + Number(p.raioKm || 0) + ' km</small></div><span>' + (unlocked ? 'Desbloqueou' : 'Não desbloqueou') + '</span></div>';
      }).join('') : '<p class="text--sm text--secondary">Nenhum profissional compatível por cidade e categoria no retrato atual.</p>') +
      (pros.length > 30 ? '<p class="text--sm">Mostrando os primeiros 30 de ' + pros.length + ' profissionais.</p>' : '') +
      '</div></section>';

    return bulk + '<div class="stack--sm">' + list.map(function (r) {
      const cat = DB.categoryById(r.categoriaId);
      const cliente = DB.clienteById(r.clienteId);

      const pedido = String(r.titulo || r.descricao || 'Sem descrição').trim();
      const resumo = pedido.length > 130 ? pedido.slice(0, 127) + '...' : pedido;
      const desb = desbloqueiosAtivos(r);
      const cancelado = r.status === STATUS.CANCELADO;
      const fechado = desb.some(function (x) { return x.desfecho === 'fechado'; }) || ST_CONCLUIDO.indexOf(r.status) !== -1;
      const cor = cancelado ? 'can' : fechado ? 'fec' : desb.length ? 'des' : 'sem';
      const vagas = [0, 1, 2].map(function (n) { return '<i' + (n < desb.length ? ' class="on"' : '') + '></i>'; }).join('');
      return '<div class="card qf-ped qf-ped--' + cor + '">' +
        '<button type="button" class="qf-crud-open" data-nav="/admin/servicos/' + r.id + '">' +

            '<span>Pedido <strong>' + PU.escapeHtml(qfDiaMes(r.criadoEm) + ' às ' + qfHora(r.criadoEm)) + '</strong></span>' +
            '<span>Cliente <strong>' + PU.escapeHtml((cliente || {}).nome || 'Não identificado') + '</strong></span>' +
            (lugar ? '<span>' + PU.escapeHtml(lugar) + '</span>' : '') +
            '<span><span class="qf-vagas">' + vagas + '</span><strong>' + desb.length + ' de 3</strong> ' + (desb.length >= 3 ? '· lotado' : 'vagas') + '</span>' +
          '</div>' +
        '</button>' +
        adminPedidoQuemHtml(r, cancelado || fechado) +
        (cloudOn() ? '<div style="padding:12px 16px 14px;">' + acoesHtml('servico', r.id) + '</div>' : '') +
      '</div>';
    }).join('') + '</div>';
  }

  function bindVersao(content) {
    const form = content.querySelector('#versao-form');
    const status = content.querySelector('#versao-status');
    if (!(global.QFAdminCloud && global.QFAdminCloud.enabled)) { status.textContent = 'Disponível apenas conectado ao Supabase.'; return; }
    global.QFAdminCloud.getAppConfig().then(function (c) {
      form.current.value = c.current_version || ''; form.minimum.value = c.minimum_required_version || '';
      form.androidCurrent.value = c.android_current_version && c.android_current_version !== c.current_version ? c.android_current_version : '';
      form.androidMinimum.value = c.android_minimum_version && c.android_minimum_version !== c.minimum_required_version ? c.android_minimum_version : '';
      form.apkUrl.value = c.apk_url || ''; form.notes.value = c.release_notes || ''; form.force.checked = !!c.force_update;
      status.textContent = 'Última alteração: ' + (c.atualizado_em ? PU.formatDateTime(c.atualizado_em) : '—');
    }).catch(function (err) { status.textContent = err.message; });
    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      const btn = form.querySelector('button[type="submit"]'); btn.disabled = true;
      try {
        await global.QFAdminCloud.saveAppConfig({ current: form.current.value.trim(), minimum: form.minimum.value.trim(), androidCurrent: form.androidCurrent.value.trim(), androidMinimum: form.androidMinimum.value.trim(), apkUrl: form.apkUrl.value.trim(), notes: form.notes.value.trim(), force: form.force.checked });
        PU.toast('Versão salva. Os aparelhos verificam ao abrir o app.', 'success');
        global.navigate('/admin/versao', true);
      } catch (err) { PU.toast((err && err.message) || 'Não foi possível salvar.', 'danger'); }
      finally { btn.disabled = false; }
    });
  }


  // ---------------- Suporte ----------------

  function supportStatusBadge(status) {
    if (status === 'resolvido') return '<span class="badge badge--success">Resolvido</span>';
    if (status === 'em_atendimento') return '<span class="badge badge--warning">Em atendimento</span>';
    return '<span class="badge badge--navy">Aberto</span>';
  }

  function supportTipo(t) { return t.usuario_tipo === 'profissional' ? 'Profissional' : t.usuario_tipo === 'visitante' ? 'Sem conta' : 'Cliente'; }
  // V11.11.5: quem abriu o suporte não recebe aviso da resposta; o admin avisa por WhatsApp ou e-mail.
  function supportContato(t) {
    let nome = '', contato = '';
    if (t.usuario_tipo === 'visitante') { nome = t.visitante_nome || ''; contato = t.visitante_contato || ''; }
    else { const u = DB.profissionalById(t.usuario_id) || DB.clienteById(t.usuario_id) || {}; nome = u.nome || ''; contato = u.telefone || u.email || ''; }
    const fone = String(contato).replace(/\D/g, '');
    if (!/@/.test(contato) && fone.length >= 10) return { nome: nome, tipo: 'whatsapp', valor: fone.length <= 11 ? '55' + fone : fone };
    const mail = /@/.test(contato) ? contato.trim() : '';
    if (mail) return { nome: nome, tipo: 'email', valor: mail };
    return null;
  }
  function supportAvisoTexto(t, resposta) {
    const c = supportContato(t) || {};
    const primeiro = String(c.nome || '').trim().split(/\s+/)[0] || '';
    return 'Olá' + (primeiro ? ' ' + primeiro : '') + ', aqui é o suporte do QuemFaz. Sobre sua mensagem (' + (t.assunto || 'suporte') + '):\n\n' +
      (resposta || '') + (resposta ? '\n\n' : '') + 'Qualquer dúvida é só responder aqui.';
  }
  function supportUserName(ticket) {
    if (ticket.usuario_tipo === 'visitante') return (ticket.visitante_nome || 'Visitante') + (ticket.visitante_contato ? ' · ' + ticket.visitante_contato : '');
    const p = DB.profissionalById(ticket.usuario_id);
    if (p) return p.nome || 'Profissional';
    const cl = DB.clienteById(ticket.usuario_id);
    if (cl) return cl.nome || 'Cliente';
    return ticket.usuario_tipo === 'profissional' ? 'Profissional' : 'Cliente';
  }

  function supportDeleteConfirm(btn, id, after) {
    if (btn.dataset.confirm !== '1') {
      btn.dataset.confirm = '1';
      btn.classList.add('is-confirm');
      const lbl = btn.querySelector('span'); if (lbl) lbl.textContent = 'Toque de novo'; else btn.lastChild.textContent = ' Toque de novo para excluir';
      setTimeout(function(){ if(btn.isConnected && btn.dataset.confirm==='1'){ btn.dataset.confirm=''; btn.classList.remove('is-confirm'); const l=btn.querySelector('span'); if(l) l.textContent='Excluir'; else btn.lastChild.textContent=' Excluir atendimento'; } }, 4000);
      return;
    }
    btn.disabled = true;
    global.QFAdminCloud.supportDelete(id).then(function(){ PU.toast('Atendimento excluído.', 'success'); after(); })
      .catch(function(err){ PU.toast((err&&err.message)||'Não foi possível excluir.', 'danger'); btn.disabled=false; });
  }

  }

  function bindSuporteDetalhe(content, params) {
    // V12.2: a caixa de resposta é fixa; o refresh de 4 s só troca as mensagens.
    // Antes a textarea era recriada a cada 4 s e o teclado do celular fechava.
    let timer=null, lastSig='';
    async function load(first) {
      const list=content.querySelector('#qf-admin-support-message-list');
      if(!list) return;
      try {
        const messages=await global.QFAdminCloud.getSupportMessages(params.id);
        const sig=messages.map(function(m){return m.id;}).join(',');
        if(!first && sig===lastSig) return;
        lastSig=sig;
        const nearBottom=list.scrollHeight-list.scrollTop-list.clientHeight<60;
        list.innerHTML=messages.map(function(m){
          const admin=m.autor_tipo==='admin';
          return '<div class="qf-admin-support-msg'+(admin?' qf-admin-support-msg--admin':'')+'"><div class="qf-admin-support-msg__who">'+(admin?'Você / Suporte':'Usuário')+'</div><div class="qf-admin-support-msg__text">'+PU.escapeHtml(m.mensagem)+'</div><div class="qf-admin-support-msg__time">'+PU.escapeHtml(PU.formatDateTime(m.criado_em))+'</div></div>';
        }).join('') || '<div class="text--sm text--secondary">Nenhuma mensagem.</div>';
        if(first||nearBottom) list.scrollTop=list.scrollHeight;
      } catch(err){ if(first) list.innerHTML='<div class="text--sm" style="color:var(--danger-600);">'+PU.escapeHtml((err&&err.message)||'Não foi possível carregar a conversa.')+'</div>'; }
    }
    load(true);
    timer=setInterval(function(){if(location.hash!=='#/admin/suporte/'+params.id){clearInterval(timer);return;}load(false);},4000);
    const send=content.querySelector('#qf-admin-support-send');
    if(send){
      // pointerdown sem preventDefault tiraria o foco antes do clique; mantém o teclado aberto.
      send.addEventListener('mousedown',function(e){e.preventDefault();});
      send.addEventListener('click',async function(){
        const inp=content.querySelector('#qf-admin-support-reply');
        const msg=inp.value.trim(); if(!msg){inp.focus();return;}
        send.disabled=true;
        try{await global.QFAdminCloud.supportReply(params.id,msg);inp.value='';await load(true);}
        catch(err){PU.toast((err&&err.message)||'Não foi possível enviar.','danger');}
        finally{send.disabled=false;}
      });
    }
    const save=content.querySelector('[data-action="support-save-status"]');
    if(save) save.addEventListener('click',async function(){save.disabled=true;try{const status=content.querySelector('#qf-admin-support-status').value;await global.QFAdminCloud.supportSetStatus(params.id,status);PU.toast(status==='resolvido'?'Atendimento resolvido.':'Status atualizado.','success');global.navigate(status==='resolvido'?'/admin/suporte':'/admin/suporte/'+params.id,true);}catch(err){PU.toast((err&&err.message)||'Não foi possível atualizar.','danger');save.disabled=false;}});
    const avisar=content.querySelector('[data-action="support-avisar"]');
    if(avisar) avisar.addEventListener('click',async function(){
      const t=(global.QFAdminCloud.supportTickets||[]).find(function(x){return x.id===params.id;});
      const c=t&&supportContato(t); if(!c) return;
      let resp=(content.querySelector('#qf-admin-support-reply')||{}).value||'';
      resp=resp.trim();
      if(!resp){try{const ms=await global.QFAdminCloud.getSupportMessages(params.id);const adm=ms.filter(function(m){return m.autor_tipo==='admin';});if(adm.length)resp=adm[adm.length-1].mensagem;}catch(_){}}
      const txt=supportAvisoTexto(t,resp);
      const url=c.tipo==='whatsapp'?'https://wa.me/'+c.valor+'?text='+encodeURIComponent(txt):'mailto:'+c.valor+'?subject='+encodeURIComponent('Suporte QuemFaz')+'&body='+encodeURIComponent(txt);
      window.open(url,'_blank');
    });
    const del=content.querySelector('[data-action="support-delete"]');
    if(del) del.addEventListener('click',function(){supportDeleteConfirm(del,params.id,function(){clearInterval(timer);global.navigate('/admin/suporte',true);});});
  }

  async function bindAvisarAcesso(content) {
    if (!avisoLista || Date.now() - avisoEm > 60000) {
      try { avisoLista = await global.QFAdminCloud.nuncaEntraram(); avisoEm = Date.now(); }
      catch (err) { avisoLista = null; content.innerHTML = '<div class="view"><div class="card text--sm" style="color:var(--danger-600);">' + PU.escapeHtml((err && err.message) || 'Erro ao carregar.') + '</div></div>'; return; }
      global.navigate('/admin/avisar-acesso', true);
      return;
    }
    function enviar(id) {
      const u = avisoLista.find(function (x) { return x.id === id; });
      const fone = u && avisoFone(u.whatsapp);
      if (!fone) return;
      window.open('https://wa.me/' + fone + '?text=' + encodeURIComponent(avisoTexto(u)), '_blank');
      u.avisado_em = new Date().toISOString(); u.vezes = (u.vezes || 0) + 1;
      global.QFAdminCloud.marcarAvisado(id).catch(function (err) { PU.toast('Não salvou o "avisado": ' + ((err && err.message) || ''), 'danger'); });
      avisoLista.sort(function (a, b) { return (a.avisado_em ? 1 : 0) - (b.avisado_em ? 1 : 0); });
      setTimeout(function () { global.navigate('/admin/avisar-acesso', true); }, 300);
    }

      const b = e.target.closest('[data-aviso-wa]');
      if (b) { enviar(b.getAttribute('data-aviso-wa')); return; }
      if (e.target.closest('[data-aviso-proximo]')) {
        const u = avisoLista.find(function (x) { return !x.avisado_em && avisoFone(x.whatsapp); });
        if (u) enviar(u.id);
      }
    });
  }

  const SEM_PUSH_STORE_LINK = 'https://play.google.com/store/apps/details?id=br.app.quemfaz';
  const SEM_PUSH_LOCAL_KEY = 'qf_admin_sem_push_contatados_v1';

  function semPushStatus() {
    try { return JSON.parse(localStorage.getItem(SEM_PUSH_LOCAL_KEY) || '{}') || {}; }
    catch (_) { return {}; }
  }
  function semPushSalvarStatus(obj) {
    try { localStorage.setItem(SEM_PUSH_LOCAL_KEY, JSON.stringify(obj || {})); } catch (_) {}
  }
  function semPushFone(v) {
    const f = String(v || '').replace(/\D/g, '');
    if (f.length < 10) return '';
    return f.length <= 11 ? '55' + f : f;
  }
  function semPushTexto(u) {
    const primeiro = String(u.nome || '').trim().split(/\s+/)[0] || '';
    const nome = primeiro ? ' ' + primeiro.charAt(0).toUpperCase() + primeiro.slice(1).toLowerCase() : '';
    return 'Olá' + nome + '! Aqui é do Quem Faz.\n\n' +

    return (DB.state.users.profissionais || [])

  async function bindSemPush(content) {
    async function copiarEmail(id) {
      const u = semPushListaAtual().find(function (x) { return x.id === id; });
      const email = u && String(u.email || '').trim();
      if (!email) { PU.toast('Este profissional está sem e-mail no cadastro.', 'danger'); return; }
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(email);
        } else {
          const ta = document.createElement('textarea');
          ta.value = email;
          ta.setAttribute('readonly', '');
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          ta.remove();
        }
        PU.toast('E-mail copiado: ' + email, 'success');
      } catch (_) {
        PU.toast('Não foi possível copiar o e-mail.', 'danger');
      }
    }
    function enviar(id) {
      const u = semPushListaAtual().find(function (x) { return x.id === id; });
      const fone = u && semPushFone(u.telefone);
      if (!fone) return;
      window.open('https://wa.me/' + fone + '?text=' + encodeURIComponent(semPushTexto(u)), '_blank');
      const s = semPushStatus();
      s[id] = new Date().toISOString();
      semPushSalvarStatus(s);
      setTimeout(function () { global.navigate('/admin/sem-push', true); }, 250);
    }
    content.addEventListener('click', async function (e) {
      const copiar = e.target.closest('[data-sem-push-copy-email]');
      if (copiar) { await copiarEmail(copiar.getAttribute('data-sem-push-copy-email')); return; }
      const b = e.target.closest('[data-sem-push-wa]');
      if (b) { enviar(b.getAttribute('data-sem-push-wa')); return; }
      if (e.target.closest('[data-sem-push-next]')) {
        const s = semPushStatus();
        const u = semPushListaAtual().find(function (x) { return !s[x.id] && semPushFone(x.telefone); });
        if (u) enviar(u.id);
        return;
      }
      const refresh = e.target.closest('[data-sem-push-refresh]');
      if (refresh) {
        refresh.disabled = true;
        try {
          await global.QFAdminCloud.syncSnapshot(true);
          PU.toast('Lista de notificações atualizada.', 'success');
          global.navigate('/admin/sem-push', true);
        } catch (err) {
          PU.toast((err && err.message) || 'Não foi possível atualizar.', 'danger');
          refresh.disabled = false;
        }
      }
    });
  }

  Screens.afterRender = function (pattern, content, params, user) {
    if (prevAfterRender) prevAfterRender(pattern, content, params, user);

    if (pattern === '/admin/profissionais') { bindProfissionaisLista(content); testeAcompanhar(); }
    if (pattern === '/admin/profissionais/:id') bindProfissionalDetalhe(content, params);
    if (pattern === '/admin/clientes') bindClientes(content);
    if (pattern === '/admin/servicos') bindServicosLista(content, params);
    if (pattern === '/admin/categorias') bindCategorias(content);
    if (pattern === '/admin/cidades') bindCidades(content);
    if (pattern === '/admin/comissao') bindComissao(content);
    if (pattern === '/admin/anuncios') bindAnuncios(content);
    if (pattern === '/admin/mais') bindMais(content);
    if (pattern === '/admin/versao') bindVersao(content);
    if (pattern === '/admin/suporte') bindSuporteLista(content);
    if (pattern === '/admin/avisar-acesso') bindAvisarAcesso(content);
    if (pattern === '/admin/sem-push') bindSemPush(content);
    if (pattern === '/admin/suporte/:id') bindSuporteDetalhe(content, params);
    if (pattern === '/admin/dashboard') {
      loadAlertMetrics(content, painelDias || 90);
      loadNotaApp(content);
      atualizarContas();
      const rb = content.querySelector('[data-action="admin-refresh"]');

        try { await Promise.all([global.QFAdminCloud.syncSnapshot(true), global.QFAdminCloud.syncAds()]); PU.toast('Painel atualizado.', 'success'); global.navigate('/admin/dashboard', true); }
        catch (err) { PU.toast('Não foi possível atualizar: ' + ((err && err.message) || err), 'danger'); rb.disabled = false; }

      if (!el) return;

        DB.aprovarProfissional(params.id);
        PU.toast('Profissional aprovado!', 'success');
        global.navigate('/admin/profissionais/' + params.id, true);

        PU.openSheet(

        );

      if (cloudOn() && (act === 'toggle-bloqueio' || act === 'toggle-verificado' || act === 'add-creditos')) {
        const p = DB.profissionalById(params.id);
        (async function () {
          el.disabled = true;
          try {
            if (act === 'toggle-bloqueio') { await global.QFAdminCloud.setBlocked(params.id, !p.bloqueado); PU.toast(p.bloqueado ? 'Profissional desbloqueado.' : 'Profissional bloqueado.', null); }
            if (act === 'toggle-verificado') { await global.QFAdminCloud.setVerified(params.id, !p.verificado); PU.toast(p.verificado ? 'Selo removido.' : 'Profissional marcado como verificado.', 'success'); }

              if (!ok) return;

            global.navigate('/admin/profissionais/' + params.id, true);
          } catch (err) { PU.toast((err && err.message) || 'Não foi possível concluir.', 'danger'); }
          finally { el.disabled = false; }
        })();
        return;
      }
      if (act === 'toggle-bloqueio') {
        const p = DB.profissionalById(params.id);
        DB.bloquearUsuario('profissional', params.id, !p.bloqueado);
        PU.toast(p.bloqueado ? 'Profissional desbloqueado.' : 'Profissional bloqueado.', null);
        global.navigate('/admin/profissionais/' + params.id, true);
      }
    });
  }

  function abrirSenhaUsuario(u, tipo) {
    if (!u) return;

    PU.openSheet(
      '<div class="stack"><h3 class="sheet__title">Alterar senha</h3>' +
      '<p class="text text--secondary">Defina uma senha temporária para <b>' + PU.escapeHtml(u.nome || 'este usuário') + '</b>. Depois de entrar com ela, o ' + rotulo + ' será obrigado a criar uma nova senha antes de usar o QuemFaz.</p>' +
      '<div class="card card--tight"><div class="text--sm text--secondary"><b>E-mail:</b> ' + PU.escapeHtml(u.email || 'Não informado') + '</div></div>' +
      '<form id="qf-admin-password-form" class="stack">' +
      '<label class="field"><span class="field__label">Senha temporária</span><input class="input" type="password" name="senha" minlength="6" autocomplete="new-password" required placeholder="Mínimo 6 caracteres"></label>' +
      '<label class="field"><span class="field__label">Confirmar senha</span><input class="input" type="password" name="confirmar" minlength="6" autocomplete="new-password" required placeholder="Digite novamente"></label>' +
      '<button class="btn btn--primary" type="submit">Salvar senha temporária</button>' +
      '<button class="btn btn--ghost" type="button" data-admin-password-cancel>Cancelar</button>' +
      '</form></div>'
    );
    const form = document.getElementById('qf-admin-password-form');
    const cancel = document.querySelector('[data-admin-password-cancel]');
    if (cancel) cancel.onclick = function () { PU.closeSheet(); };
    if (!form) return;
    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      const fd = new FormData(form);
      const senha = String(fd.get('senha') || '');
      const confirmar = String(fd.get('confirmar') || '');
      if (senha.length < 6) { PU.toast('A senha precisa ter pelo menos 6 caracteres.', 'danger'); return; }
      if (senha !== confirmar) { PU.toast('As senhas não são iguais.', 'danger'); return; }
      const btn = form.querySelector('button[type="submit"]');
      if (btn) { btn.disabled = true; btn.textContent = 'Salvando...'; }
      try {
        await global.QFAdminCloud.setTemporaryPassword(u.id, senha);
        PU.closeSheet();
        PU.toast('Senha temporária alterada. No próximo acesso será obrigatório criar uma nova senha.', 'success');
      } catch (err) {
        PU.toast((err && err.message) || 'Não foi possível alterar a senha.', 'danger');
      } finally {
        if (btn) { btn.disabled = false; btn.textContent = 'Salvar senha temporária'; }
      }
    });
  }

  // ---------------- V11.45: painel com menu lateral (só layout) ----------------
  // Mesmos dados de sempre (DB e QFAdminCloud); aqui só se organiza em páginas, cartões e tabelas.
  function admPage(conteudo, extraClasse) {
    return '<div class="view qf-adm-view' + (extraClasse ? ' ' + extraClasse : '') + '">' + migrationBanner() + conteudo + '</div>';
  }
  function admCard(titulo, sub, corpo) {
    return '<section class="qf-adm-card">' +
      (titulo ? '<div class="qf-adm-card__head"><h2>' + titulo + '</h2>' + (sub ? '<span>' + sub + '</span>' : '') + '</div>' : '') +
      corpo + '</section>';
  }
  function admTabela(cabecalho, linhas, rodape, vazio) {
    return '<div class="qf-adm-tabela"><div class="qf-adm-tabela__rolar"><table>' +
      '<thead><tr>' + cabecalho.map(function (c) { return '<th>' + c + '</th>'; }).join('') + '</tr></thead>' +
      '<tbody>' + (linhas.length ? linhas.join('') : '<tr class="qf-adm-tabela__vazio"><td colspan="' + cabecalho.length + '">' + (vazio || 'Nada por aqui.') + '</td></tr>') + '</tbody>' +
      '</table></div>' + (rodape ? '<div class="qf-adm-tabela__rodape">' + rodape + '</div>' : '') + '</div>';
  }
  function admLinhas(n, singular, plural) { return n + ' ' + (n === 1 ? singular : plural); }

  // Situação do pedido em uma palavra, com cor: aguardando, desbloqueado, vagas preenchidas, fechado, cancelado.
  function admSituacao(r) {
    const desb = desbloqueiosAtivos(r);
    if (r.status === STATUS.CANCELADO) return { id: 'cancelado', rotulo: r.desfecho === 'nao_fechado' ? 'Não fechou' : r.desfecho === 'sem_retorno' ? 'Sem retorno' : 'Cancelado' };
    if (desb.some(function (x) { return x.desfecho === 'fechado'; }) || ST_CONCLUIDO.indexOf(r.status) !== -1) return { id: 'fechado', rotulo: 'Fechado' };
    if (desb.length >= 3) return { id: 'cheio', rotulo: 'Vagas preenchidas' };
    if (desb.length) return { id: 'desbloqueado', rotulo: 'Desbloqueado · ' + desb.length + ' de 3' };
    return { id: 'aguardando', rotulo: 'Aguardando' };
  }
  const ADM_SITUACOES = [['todas', 'Todas'], ['aguardando', 'Aguardando'], ['desbloqueado', 'Desbloqueado'], ['cheio', 'Vagas preenchidas'], ['fechado', 'Fechado'], ['cancelado', 'Cancelado']];
  function admCidadePedido(r) {
    const e = r.endereco || {}, c = DB.cityById ? DB.cityById(r.cidadeId) : null;
    return [e.cidade || (c && c.nome), e.uf || (c && c.uf)].filter(Boolean).join('/');
  }
  function admValorPedido(r) { return desbloqueiosAtivos(r).reduce(function (s, x) { return s + qfDesbPagamento(x).valor; }, 0); }
  function admOrdenados() {
    return DB.allRequests().slice().sort(function (a, b) { return (Date.parse(b.criadoEm) || 0) - (Date.parse(a.criadoEm) || 0); });
  }

  // Últimos pedidos (Início): filtros por serviço e situação; a tabela se refaz sem recarregar a tela.
  const ADM_ULTIMOS_MAX = 20;
  let admFiltroServico = 'todos', admFiltroSituacao = 'todas';
  function admFiltrados() {
    return admOrdenados().filter(function (r) {
      return (admFiltroServico === 'todos' || String(r.categoriaId) === admFiltroServico) &&
        (admFiltroSituacao === 'todas' || admSituacao(r).id === admFiltroSituacao);
    });
  }
  function admPedidoTr(r) {
    const desb = desbloqueiosAtivos(r).slice().sort(function (a, b) { return (Date.parse(a.criadoEm) || 0) - (Date.parse(b.criadoEm) || 0); });
    const sit = admSituacao(r);
    const resumo = String(r.titulo || r.descricao || '').trim();
    const valor = admValorPedido(r);
    const quem = desb.length ? desb.map(function (x) {
      const p = DB.profissionalById(x.profissionalId);
      return '<span class="qf-adm-quem"><b>' + PU.escapeHtml((p && p.nome) || 'Profissional') + '</b><small>' + (Date.parse(x.criadoEm) ? qfDiaMes(x.criadoEm) + ' · ' + qfHora(x.criadoEm) : 'sem hora') + '</small></span>';
    }).join('') : '<span class="qf-adm-mudo">Ninguém ainda</span>';
    return '<tr class="qf-adm-tr-link" data-nav="/admin/servicos/' + r.id + '" tabindex="0">' +
      '<td><b>' + PU.escapeHtml(qfPedidoTitulo(r)) + '</b>' + (resumo ? '<small class="qf-adm-resumo">' + PU.escapeHtml(resumo.length > 60 ? resumo.slice(0, 57) + '…' : resumo) + '</small>' : '') + '</td>' +
      '<td>' + (PU.escapeHtml(admCidadePedido(r)) || '<span class="qf-adm-mudo">—</span>') + '</td>' +
      '<td class="qf-adm-nowrap">' + (Date.parse(r.criadoEm) ? qfDiaMes(r.criadoEm) + ' · ' + qfHora(r.criadoEm) : '—') + '</td>' +
      '<td>' + quem + '</td>' +
      '<td><span class="qf-adm-sit qf-adm-sit--' + sit.id + '">' + sit.rotulo + '</span></td>' +
      '<td class="qf-adm-num">' + (valor > 0 ? PU.formatCurrency(valor) : '<span class="qf-adm-mudo">—</span>') + '</td>' +
    '</tr>';
  }
  const ADM_CAB_PEDIDOS = ['Pedido', 'Cidade', 'Recebido', 'Quem desbloqueou', 'Situação', 'Valor'];
  function admUltimosTabela() {
    const lista = admFiltrados();
    const mostra = lista.slice(0, ADM_ULTIMOS_MAX);
    const total = DB.allRequests().length;
    const rodape = 'Mostrando ' + mostra.length + ' de ' + admLinhas(lista.length, 'pedido', 'pedidos') + (lista.length !== total ? ' (filtrado de ' + total + ')' : '');
    return admTabela(ADM_CAB_PEDIDOS, mostra.map(admPedidoTr), rodape, 'Nenhum pedido com esse filtro.');
  }
  function admUltimosHtml() {
    const cats = {};
    DB.allRequests().forEach(function (r) { if (r.categoriaId != null) cats[r.categoriaId] = qfPedidoTitulo(r); });
    const opcoesServ = [['todos', 'Todos']].concat(Object.keys(cats).sort(function (a, b) { return cats[a].localeCompare(cats[b]); }).map(function (k) { return [k, cats[k]]; }));
    if (!opcoesServ.some(function (o) { return o[0] === admFiltroServico; })) admFiltroServico = 'todos';
    function sel(id, rotulo, opcoes, atual) {
      return '<label class="qf-adm-filtro"><span>' + rotulo + '</span><select class="select" id="' + id + '">' +
        opcoes.map(function (o) { return '<option value="' + PU.escapeHtml(o[0]) + '"' + (o[0] === atual ? ' selected' : '') + '>' + PU.escapeHtml(o[1]) + '</option>'; }).join('') + '</select></label>';
    }
    return '<section class="qf-adm-secao qf-p-pedidos" id="adm-ultimos">' +
      '<div class="qf-adm-secao__head"><h2>Últimos pedidos</h2></div>' +
      '<div class="qf-adm-barra">' +
        '<div class="qf-adm-barra__filtros">' + sel('adm-f-servico', 'Serviço', opcoesServ, admFiltroServico) + sel('adm-f-situacao', 'Situação', ADM_SITUACOES, admFiltroSituacao) + '</div>' +
        '<button type="button" class="qf-adm-link" data-adm-baixar="pedidos">' + icon('download') + 'Baixar tudo</button>' +
      '</div>' +
      '<div id="adm-ultimos-tabela">' + admUltimosTabela() + '</div>' +
    '</section>';
  }
  document.addEventListener('change', function (e) {
    const id = e.target && e.target.id;
    if (id !== 'adm-f-servico' && id !== 'adm-f-situacao') return;
    if (id === 'adm-f-servico') admFiltroServico = e.target.value; else admFiltroSituacao = e.target.value;
    const box = document.getElementById('adm-ultimos-tabela');
    if (box) box.innerHTML = admUltimosTabela();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' || !e.target || !e.target.matches || !e.target.matches('tr.qf-adm-tr-link')) return;
    global.navigate(e.target.getAttribute('data-nav'));
  });

  // "Baixar tudo": planilha CSV com os pedidos que o painel já tem carregados (nenhuma consulta nova).
  function admCsv(linhas) {
    return '﻿' + linhas.map(function (l) {
      return l.map(function (v) { const s = String(v == null ? '' : v); return /[";\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(';');
    }).join('\r\n');
  }
  function admBaixarPedidos() {
    const linhas = [['Pedido', 'Descrição', 'Cliente', 'Cidade', 'Recebido em', 'Quem desbloqueou', 'Situação', 'Valor (R$)']];
    admOrdenados().forEach(function (r) {
      const cliente = DB.clienteById(r.clienteId);
      const quem = desbloqueiosAtivos(r).map(function (x) {
        const p = DB.profissionalById(x.profissionalId);
        return ((p && p.nome) || 'Profissional') + (Date.parse(x.criadoEm) ? ' (' + qfDiaMes(x.criadoEm) + ' ' + qfHora(x.criadoEm) + ')' : '');
      }).join(' | ');
      linhas.push([qfPedidoTitulo(r), String(r.titulo || r.descricao || '').trim(), (cliente && cliente.nome) || '', admCidadePedido(r),
        Date.parse(r.criadoEm) ? qfDiaMes(r.criadoEm) + ' ' + qfHora(r.criadoEm) : '', quem, admSituacao(r).rotulo, (admValorPedido(r) / 100).toFixed(2).replace('.', ',')]);
    });
    const blob = new Blob([admCsv(linhas)], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'quemfaz-pedidos-' + qfDiaChave() + '.csv';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
    PU.toast('Planilha com ' + admLinhas(linhas.length - 1, 'pedido', 'pedidos') + ' baixada.', 'success');
  }
  document.addEventListener('click', function (e) {
    const b = e.target.closest && e.target.closest('[data-adm-baixar]');
    if (b) { e.preventDefault(); admBaixarPedidos(); }
  });

  // Quantas coisas pedem ação (mesma conta do "Precisa de você").
  function admPendencias(s) {
    s = s || DB.dashboardStats();
    const par = global.QFAdminParados, cas = global.QFAdminCascata;

    const esc = PU.escapeHtml, planos = (d && d.planos) || [], lista = (d && d.lista) || [];
    admPlanosDados = d;
    const nomes = {}; planos.forEach(function (p) { nomes[p.plano] = p.nome; });
    const editar = planos.map(function (p) {
      const cada = Math.round(p.preco_centavos / Math.max(1, p.chamados));
      return '<form class="qf-adm-plano" data-plano-form="' + esc(p.plano) + '" data-plano-nome="' + esc(p.nome) + '">' +
        '<div class="qf-adm-plano__nome"><strong>' + esc(p.nome) + '</strong><span>' + (Number(p.ativos) || 0) + ' ativo' + (Number(p.ativos) === 1 ? '' : 's') + ' agora</span></div>' +
        '<label class="qf-adm-filtro">Preço (R$)<input class="input" type="number" name="preco" min="1" max="5000" step="0.01" value="' + (p.preco_centavos / 100).toFixed(2) + '"></label>' +
        '<label class="qf-adm-filtro">Chamados<input class="input" type="number" name="chamados" min="1" max="1000" step="1" value="' + Number(p.chamados) + '"></label>' +
        '<label class="qf-adm-filtro">Vale por (dias)<input class="input" type="number" name="dias" min="1" max="365" step="1" value="' + Number(p.dias) + '"></label>' +
        '<div class="qf-adm-plano__cada">sai a <strong data-plano-cada>' + PU.formatCurrency(cada) + '</strong> por chamado</div>' +
        '<button type="submit" class="btn btn--primary btn--sm qf-adm-head__btn">Salvar</button>' +
      '</form>';
    }).join('');
    const conta = { pago: 0, aguardando: 0, vencido: 0 }; let recebido = 0;
    lista.forEach(function (x) {
      if (x.situacao === 'manual') return;
      if (x.situacao === 'pago' || x.situacao === 'pago_sem_conta') { conta.pago++; recebido += Number(x.valor_centavos || 0); }
      else if (x.situacao === 'aguardando') conta.aguardando++;
      else if (x.situacao === 'vencido') conta.vencido++;
    });
    const linhas = lista.map(function (x) {
      const sit = ADM_PLANO_SIT[x.situacao] || ADM_PLANO_SIT.cancelado;
      const plano = nomes[x.plano] || x.plano;
      const pago = x.situacao === 'pago' || x.situacao === 'pago_sem_conta' || x.situacao === 'manual';
      const zap = pago && x.situacao !== 'pago_sem_conta' ? '' : admPlanoZap(x.telefone, x.nome, plano);
      // Quem tem conta e não pagou: atalho que já deixa o profissional e o plano escolhidos no cartão de cima.
      const atalho = !pago && x.profissional_id ? '<button type="button" class="btn btn--outline btn--sm" style="width:auto;" data-plano-escolher="' + esc(String(x.profissional_id)) + '" data-plano-escolher-plano="' + esc(x.plano) + '">' + icon('bolt') + ' Pix ou ativar</button>' : '';
      const resta = (x.situacao === 'pago' || x.situacao === 'manual') && x.chamados_total != null
        ? '<div class="qf-adm-mudo" style="font-size:12px;">' + Number(x.chamados_restantes || 0) + ' de ' + Number(x.chamados_total) + ' chamados' + (x.valido_ate ? ' · até ' + new Date(x.valido_ate).toLocaleDateString('pt-BR') : '') + '</div>' : '';
      return '<tr><td><strong>' + esc(x.nome || x.email || 'Sem nome') + '</strong><div class="qf-adm-mudo" style="font-size:12px;">' + esc(x.telefone || x.email || '') + (x.origem === 'cadastro' ? ' · ainda sem conta' : '') + '</div></td>' +
        '<td>' + esc(plano) + '</td>' +
        '<td>' + (x.situacao === 'manual' ? '<span class="qf-adm-mudo">sem pagamento</span>' : PU.formatCurrency(Number(x.valor_centavos || 0)) + '<div class="qf-adm-mudo" style="font-size:12px;">' + esc(x.metodo === 'pix' ? 'Pix' : x.metodo === 'cartao' ? 'Cartão' : x.metodo === 'boleto' ? 'Boleto' : (x.metodo || '')) + '</div>') + '</td>' +
        '<td><span class="qf-adm-sit qf-adm-sit--' + sit[0] + '">' + sit[1] + '</span>' + resta + '</td>' +
        '<td>' + esc(admPlanoQuando(pago ? (x.aprovado_em || x.criado_em) : x.criado_em)) + '</td>' +
        '<td><div class="qf-adm-plano-acoes">' + atalho + (zap ? '<a class="btn btn--outline btn--sm" style="width:auto;" target="_blank" rel="noopener" href="' + esc(zap) + '">' + icon('chat') + ' Chamar</a>' : '') + '</div></td></tr>';
    });
    return admCard('Preço dos planos', 'vale na hora para novas assinaturas',
        '<div class="qf-adm-planos">' + editar + '</div>' +
        '<p class="qf-adm-mudo" style="margin:12px 0 0;font-size:13px;">O app passa a mostrar o preço novo sozinho. Quem já tinha gerado o Pix com o preço antigo ainda consegue pagar e recebe o plano como estava.</p>') +
      admCard('Ativar plano ou gerar Pix', 'para um profissional que já tem conta', admPlanoManualHtml(planos)) +
      admCard('Quem assinou ou tentou assinar', conta.pago + ' pago' + (conta.pago === 1 ? '' : 's') + ' · ' + PU.formatCurrency(recebido) + ' recebidos · ' + conta.aguardando + ' aguardando · ' + conta.vencido + ' não pagaram',
        admTabela(['Profissional', 'Plano', 'Valor', 'Situação', 'Quando', ''], linhas, lista.length ? admLinhas(lista.length, 'registro', 'registros') : '', 'Ninguém escolheu um plano ainda.'));
  }
  async function admPlanosCarregar(content) {
    const box = content.querySelector('[data-adm-planos]');
    if (!box || !cloudOn()) return;
    try {
      const r = await global.QFAdminCloud.client.rpc('qf_admin_planos_painel');
      if (r.error) throw r.error;
      if (!r.data || !r.data.ok) throw new Error((r.data && r.data.reason) || 'Não foi possível carregar.');
      box.innerHTML = admPlanosHtml(r.data);
    } catch (err) { box.innerHTML = admCard('Planos dos profissionais', '', '<p class="qf-adm-mudo" style="margin:0;">Não foi possível carregar: ' + PU.escapeHtml((err && err.message) || String(err)) + '</p>'); }
  }
  Screens.adminPlanosRender = function () {
    return admPage('<div data-adm-planos>' + admCard('Planos dos profissionais', '', cloudOn() ? '<p class="qf-adm-mudo" style="margin:0;">Carregando…</p>' : ADM_SO_CONECTADO) + '</div>');
  };
  document.addEventListener('click', async function (e) {
    const t = e.target && e.target.closest ? e.target : null;
    if (!t) return;
    const copiar = t.closest('[data-plano-pix-copiar]');
    if (copiar) {
      const campo = document.querySelector('[data-plano-pix-codigo]');
      try {
        if (navigator.clipboard) await navigator.clipboard.writeText(campo.value); else { campo.select(); document.execCommand('copy'); }
        PU.toast('Código Pix copiado.', 'success');
      } catch (_) { try { campo.select(); } catch (__) {} PU.toast('Selecione e copie o código.', 'danger'); }
      return;
    }
    const esc = t.closest('[data-plano-escolher]');
    if (esc) {
      admPlanoEscolha = { pro: esc.getAttribute('data-plano-escolher'), plano: esc.getAttribute('data-plano-escolher-plano') || '' };
      const box = esc.closest('[data-adm-planos]');
      if (box && admPlanosDados) box.innerHTML = admPlanosHtml(admPlanosDados);
      const f = document.querySelector('[data-plano-manual-form]');
      if (f) f.scrollIntoView({ block: 'center', behavior: 'smooth' });
      return;
    }
    const b = t.closest('[data-plano-acao]');
    if (!b) return;
    e.preventDefault();
    const f = b.closest('[data-plano-manual-form]'), acao = b.getAttribute('data-plano-acao');
    const pro = admPlanoProPorRotulo(f.pro.value);
    if (!pro) { PU.toast('Escolha o profissional na lista (digite o nome e toque nele).', 'danger'); try { f.pro.focus(); } catch (_) {} return; }
    const plano = f.plano.value, op = f.plano.options[f.plano.selectedIndex];
    const nomePlano = op ? op.textContent.split(' · ')[0] : plano;
    admPlanoEscolha = { pro: pro.id, plano: plano };
    const textos = {
      pix: ['Gerar Pix do plano ' + nomePlano, 'Gera um Pix de ' + (op ? op.textContent.split(' · ')[1] : '') + ' para ' + pro.nome + '. Você envia o código e o plano ativa sozinho quando ele pagar. Confirma?', 'Gerar Pix'],
      ativar: ['Ativar o plano ' + nomePlano + ' sem pagamento', pro.nome + ' recebe o plano ' + nomePlano + ' agora, sem pagar. Se ele já tiver um plano ativo, o atual é encerrado e entra este. Ele é avisado no celular. Confirma?', 'Ativar agora'],
      tirar: ['Tirar o plano de ' + pro.nome, 'Os chamados que restam no plano dele são zerados agora. O saldo da carteira não muda. Confirma?', 'Tirar o plano']
    }[acao];
    if (!textos) return;
    if (!(await PU.confirmDialog({ title: textos[0], message: textos[1], okLabel: textos[2] }))) return;
    const botoes = f.querySelectorAll('[data-plano-acao]');
    botoes.forEach(function (x) { x.disabled = true; });
    try {
      const cli = global.QFAdminCloud.client;
      if (acao === 'pix') {
        const r = await cli.functions.invoke('quemfaz-admin-pix', { body: { profissional_id: pro.id, plano: plano } });
        if (r.error) throw r.error;
        const d = r.data || {};
        if (!d.ok) throw new Error(d.error || 'Não foi possível gerar o Pix.');
        admPlanoPix = { nome: pro.nome, fone: pro.fone, nome_plano: d.nome_plano, valor_centavos: d.valor_centavos, pix_copy_paste: d.pix_copy_paste, qr_image: d.qr_image, checkout_url: d.checkout_url };
        const box = document.querySelector('[data-plano-pix-box]');
        if (box) { box.innerHTML = admPlanoPixHtml(); box.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
        PU.toast('Pix gerado. Envie para ' + pro.nome + '.', 'success');
        return;
      }
      const r = acao === 'ativar'
        ? await cli.rpc('qf_admin_ativar_plano', { p_profissional: pro.id, p_plano: plano })
        : await cli.rpc('qf_admin_remover_plano', { p_profissional: pro.id });
      if (r.error) throw r.error;
      if (!r.data || !r.data.ok) throw new Error((r.data && r.data.reason) || 'Não foi possível concluir.');
      const box = f.closest('[data-adm-planos]'); if (box) box.innerHTML = admPlanosHtml(r.data);
      PU.toast(acao === 'ativar' ? 'Plano ' + nomePlano + ' ativado para ' + pro.nome + '.' : 'Plano de ' + pro.nome + ' encerrado.', 'success');
    } catch (err) { PU.toast((err && err.message) || 'Não foi possível concluir.', 'danger'); }
    finally { document.querySelectorAll('[data-plano-acao]').forEach(function (x) { x.disabled = false; }); }
  });
  function admPlanoLer(f) {
    return {
      preco: Math.round(Number(String(f.preco.value).replace(',', '.')) * 100),
      chamados: Math.round(Number(f.chamados.value)),
      dias: Math.round(Number(f.dias.value))
    };
  }
  document.addEventListener('input', function (e) {
    const f = e.target && e.target.closest && e.target.closest('[data-plano-form]');
    if (!f) return;
    const v = admPlanoLer(f), alvo = f.querySelector('[data-plano-cada]');
    if (alvo && v.preco > 0 && v.chamados > 0) alvo.textContent = PU.formatCurrency(Math.round(v.preco / v.chamados));
  });
  document.addEventListener('submit', async function (e) {
    const f = e.target && e.target.closest && e.target.closest('[data-plano-form]');
    if (!f) return;
    e.preventDefault();
    const v = admPlanoLer(f), nome = f.getAttribute('data-plano-nome') || 'plano';
    if (!(v.preco >= 100 && v.preco <= 500000)) { PU.toast('Use um preço de R$ 1 a R$ 5.000.', 'danger'); return; }
    if (!(v.chamados >= 1 && v.chamados <= 1000)) { PU.toast('Use de 1 a 1.000 chamados.', 'danger'); return; }
    if (!(v.dias >= 1 && v.dias <= 365)) { PU.toast('Use de 1 a 365 dias.', 'danger'); return; }
    const ok = await PU.confirmDialog({ title: 'Mudar o plano ' + nome,
      message: 'O plano ' + nome + ' passa a custar ' + PU.formatCurrency(v.preco) + ', com ' + v.chamados + ' chamados, valendo por ' + v.dias + ' dias (' + PU.formatCurrency(Math.round(v.preco / v.chamados)) + ' por chamado). Vale na hora para quem assinar a partir de agora. Confirma?',
      okLabel: 'Salvar' });
    if (!ok) return;
    const btn = f.querySelector('[type="submit"]'); if (btn) btn.disabled = true;
    try {
      const r = await global.QFAdminCloud.client.rpc('qf_admin_salvar_plano', { p_plano: f.getAttribute('data-plano-form'), p_preco_centavos: v.preco, p_chamados: v.chamados, p_dias: v.dias });
      if (r.error) throw r.error;
      if (!r.data || !r.data.ok) throw new Error((r.data && r.data.reason) || 'Não foi possível salvar.');
      const box = f.closest('[data-adm-planos]'); if (box) box.innerHTML = admPlanosHtml(r.data);
      PU.toast('Plano ' + nome + ' atualizado.', 'success');
    } catch (err) { PU.toast((err && err.message) || 'Não foi possível salvar.', 'danger'); if (btn) btn.disabled = false; }
  });
  // Configurações: o que antes ficava em "Mais" e não é do dia a dia.
  Screens.adminConfiguracoesRender = function () {
    return admPage(
      admCard('Cadastro do app', '', '<div class="qf-adm-itens">' +
        admItem('tag', 'Categorias', 'serviços que aparecem no app', 'data-nav="/admin/categorias"') +
        admItem('building', 'Cidades e regiões', 'onde o QuemFaz atende', 'data-nav="/admin/cidades"') +
        admItem('unlock', 'Taxas dos chamados', 'valor do desbloqueio', 'data-nav="/admin/comissao"') +
        admItem('smartphone', 'Versão do app e atualização obrigatória', '', 'data-nav="/admin/versao"') +
      '</div>') +
      admCard('Conta', '', '<div class="qf-adm-itens">' +
        (cloudOn() ? '' : admItem('refresh', 'Restaurar dados de demonstração', 'apaga os dados atuais deste aparelho', 'data-action="restaurar-demo"')) +
        admItem('logout', 'Sair da conta', '', 'data-logout') +
      '</div>'));
  };
  // Pedidos: chamados parados, sem resposta, cascata e cancelamentos ficam junto da Central.
  function admPedidosExtrasHtml() {
    const par = global.QFAdminParados, cas = global.QFAdminCascata;
    const cascata = cas ? cas.cascata() : '';
    return '<section class="qf-adm-card qf-adm-card--atalhos"><div class="qf-adm-atalhos">' +
      (par ? '<button type="button" class="qf-adm-chip" ' + attrGaveta('parados') + '>' + icon('clock') + 'Chamados parados ' + contaPill(par.count(), 'parados') + '</button>' : '') +
      (cas ? '<button type="button" class="qf-adm-chip" ' + attrGaveta('sem-resposta') + '>' + icon('chat') + 'Sem resposta ' + contaPill(cas.count(), 'sem-resposta') + '</button>' : '') +
      (cascata ? '<button type="button" class="qf-adm-chip" ' + attrGaveta('cascata') + '>' + icon('layers') + 'Cascata do chamado</button>' : '') +
      '<button type="button" class="qf-adm-chip" data-nav="/admin/cancelamentos">' + icon('alertTriangle') + 'Cancelamentos</button>' +
    '</div>' +
    (par ? gaveta('parados', par.secao()) : '') + (cas ? gaveta('sem-resposta', cas.semResp()) : '') + gaveta('cascata', cascata) +
    '</section>';
  }

  const prevAfterAdm = Screens.afterRender;
  Screens.afterRender = function (pattern, content, params, user) {
    if (prevAfterAdm) prevAfterAdm(pattern, content, params, user);
    if (pattern === '/admin/configuracoes') bindMais(content);
    if (pattern === '/admin/bonus') admBonusCadastroCarregar(content);
    if (pattern === '/admin/planos') admPlanosCarregar(content);
    if (pattern === '/admin/desbloqueios') { const d = content.querySelector('#extrato-desbloqueios'); if (d) d.open = true; }
    if (pattern === '/admin/servicos') atualizarContas();
    if (pattern === '/admin/dashboard') {
      let ir = false; try { ir = sessionStorage.getItem('qf_adm_ir_precisa') === '1'; sessionStorage.removeItem('qf_adm_ir_precisa'); } catch (_) {}
      const alvo = ir && content.querySelector('.qf-p-precisa');
      if (alvo) setTimeout(function () { alvo.scrollIntoView({ block: 'start' }); }, 60);
    }
  };
  global.QFAdminLayout = { pendencias: function () { return admPendencias(); } };
})(window);


</script>
